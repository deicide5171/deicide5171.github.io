<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">재분배 후에도 남는 핫스팟 — 데이터량과 트래픽은 다른 문제다</text>

  <!-- Panel 1: 재분배 전, 데이터량 불균형 -->
  <text x="60" y="54" font-size="13" font-weight="bold" fill="#0b5fa5">① 재분배 전 — 데이터량 불균형</text>

  <rect x="195" y="100" width="110" height="40" fill="#cfe2f3" stroke="#0b5fa5" stroke-width="1.5"/>
  <rect x="345" y="50" width="110" height="90" fill="#cfe2f3" stroke="#0b5fa5" stroke-width="1.5"/>
  <rect x="495" y="80" width="110" height="60" fill="#cfe2f3" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="250" y="155" text-anchor="middle" font-size="11" fill="#333">Shard 1</text>
  <text x="400" y="155" text-anchor="middle" font-size="11" fill="#333">Shard 2 (데이터 많음)</text>
  <text x="550" y="155" text-anchor="middle" font-size="11" fill="#333">Shard 3</text>

  <line x1="400" y1="163" x2="400" y2="182" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="177" text-anchor="middle" font-size="10.5" fill="#666">재분배 실행 (데이터 이동)</text>

  <!-- Panel 2: 재분배 후, 트래픽은 여전히 편중 -->
  <text x="60" y="205" font-size="13" font-weight="bold" fill="#0b5fa5">② 재분배 후 — 저장 용량은 균등, 그러나 트래픽은 그대로 쏠림</text>

  <!-- QPS bars (above storage) -->
  <rect x="150" y="222" width="80" height="18" fill="#b9c8d9" stroke="#5b7a9a"/>
  <rect x="290" y="170" width="80" height="70" fill="#ffd6d1" stroke="#c0392b" stroke-width="2"/>
  <rect x="430" y="220" width="80" height="20" fill="#b9c8d9" stroke="#5b7a9a"/>
  <rect x="570" y="224" width="80" height="16" fill="#b9c8d9" stroke="#5b7a9a"/>

  <text x="190" y="216" text-anchor="middle" font-size="10" fill="#5b7a9a">QPS 1200</text>
  <text x="330" y="164" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c0392b">QPS 9800 (HOT)</text>
  <text x="470" y="214" text-anchor="middle" font-size="10" fill="#5b7a9a">QPS 1150</text>
  <text x="610" y="218" text-anchor="middle" font-size="10" fill="#5b7a9a">QPS 1300</text>

  <!-- storage boxes (equal size = balanced) -->
  <rect x="150" y="240" width="80" height="45" fill="#cfe2f3" stroke="#0b5fa5" stroke-width="1.5"/>
  <rect x="290" y="240" width="80" height="45" fill="#cfe2f3" stroke="#c0392b" stroke-width="2"/>
  <rect x="430" y="240" width="80" height="45" fill="#cfe2f3" stroke="#0b5fa5" stroke-width="1.5"/>
  <rect x="570" y="240" width="80" height="45" fill="#cfe2f3" stroke="#0b5fa5" stroke-width="1.5"/>

  <text x="190" y="300" text-anchor="middle" font-size="11" fill="#333">Shard A</text>
  <text x="330" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Shard B</text>
  <text x="470" y="300" text-anchor="middle" font-size="11" fill="#333">Shard C</text>
  <text x="610" y="300" text-anchor="middle" font-size="11" fill="#333">Shard D</text>

  <line x1="330" y1="310" x2="330" y2="328" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Panel 3: 완화 - 핫샤드 추가 분할 -->
  <text x="60" y="345" font-size="13" font-weight="bold" fill="#1f7a38">③ 완화 — 핫샤드를 추가로 분할(가상 노드 세분화 또는 핫키 salting)</text>

  <rect x="260" y="365" width="80" height="18" fill="#eafff0" stroke="#2fa84f"/>
  <rect x="460" y="365" width="80" height="18" fill="#eafff0" stroke="#2fa84f"/>
  <rect x="260" y="383" width="80" height="40" fill="#cfe2f3" stroke="#2fa84f" stroke-width="1.5"/>
  <rect x="460" y="383" width="80" height="40" fill="#cfe2f3" stroke="#2fa84f" stroke-width="1.5"/>

  <text x="300" y="378" text-anchor="middle" font-size="10" fill="#1f7a38">QPS 4900</text>
  <text x="500" y="378" text-anchor="middle" font-size="10" fill="#1f7a38">QPS 4900</text>
  <text x="300" y="435" text-anchor="middle" font-size="11" fill="#333">Shard B1</text>
  <text x="500" y="435" text-anchor="middle" font-size="11" fill="#333">Shard B2</text>

  <line x1="330" y1="325" x2="300" y2="360" stroke="#999" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="330" y1="325" x2="500" y2="360" stroke="#999" stroke-width="1.3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>
</svg>
