<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>
  <text x="400" y="35" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">결정론적 워크플로우 vs 자유형 에이전트 위임 — 실행 모델 비교</text>

  <!-- Left: deterministic workflow -->
  <rect x="40" y="65" width="340" height="340" rx="10" fill="#e8f0fe" stroke="#4a6fd4" stroke-width="1.5"/>
  <text x="210" y="90" font-size="14" text-anchor="middle" fill="#2c4a9e" font-weight="bold">결정론적 워크플로우</text>

  <rect x="65" y="110" width="110" height="45" rx="6" fill="#fff" stroke="#4a6fd4"/>
  <text x="120" y="137" font-size="11" text-anchor="middle">추출(코드)</text>
  <rect x="195" y="110" width="110" height="45" rx="6" fill="#fff" stroke="#d4714a"/>
  <text x="250" y="132" font-size="11" text-anchor="middle">분류 판단</text>
  <text x="250" y="146" font-size="10" text-anchor="middle" fill="#9e3f2c">(LLM, 범위 한정)</text>

  <path d="M 175 132 L 190 132" stroke="#666" stroke-width="2" marker-end="url(#a3)"/>

  <path d="M 250 155 L 250 185" stroke="#666" stroke-width="2" marker-end="url(#a3)"/>
  <rect x="100" y="190" width="100" height="45" rx="6" fill="#fff" stroke="#4a6fd4"/>
  <text x="150" y="217" font-size="11" text-anchor="middle">승인(코드)</text>
  <rect x="220" y="190" width="100" height="45" rx="6" fill="#fff" stroke="#4a6fd4"/>
  <text x="270" y="217" font-size="11" text-anchor="middle">에스컬레이션</text>
  <path d="M 230 212 L 200 212" stroke="#666" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="90" y="260" width="240" height="40" rx="6" fill="#f0f7f4" stroke="#4aa26f"/>
  <text x="210" y="285" font-size="11" text-anchor="middle" fill="#276b43">체크포인트 저장소 (부분 재개)</text>

  <text x="210" y="330" font-size="11" text-anchor="middle" fill="#555">제어 흐름 = 코드</text>
  <text x="210" y="348" font-size="11" text-anchor="middle" fill="#555">판단 = 범위가 좁혀진 LLM 호출</text>
  <text x="210" y="370" font-size="11" text-anchor="middle" fill="#2c4a9e" font-weight="bold">적합: 분기가 이미 명확한 반복 업무</text>

  <!-- Right: freeform agent -->
  <rect x="420" y="65" width="340" height="340" rx="10" fill="#fdeee8" stroke="#d4714a" stroke-width="1.5"/>
  <text x="590" y="90" font-size="14" text-anchor="middle" fill="#9e3f2c" font-weight="bold">자유형 에이전트 위임</text>

  <circle cx="590" cy="150" r="42" fill="#fff" stroke="#d4714a" stroke-width="1.5"/>
  <text x="590" y="146" font-size="11" text-anchor="middle">LLM이</text>
  <text x="590" y="160" font-size="11" text-anchor="middle">다음 행동 결정</text>

  <path d="M 555 185 L 500 230" stroke="#999" stroke-width="1.5" marker-end="url(#a4)"/>
  <path d="M 590 192 L 590 230" stroke="#999" stroke-width="1.5" marker-end="url(#a4)"/>
  <path d="M 625 185 L 680 230" stroke="#999" stroke-width="1.5" marker-end="url(#a4)"/>

  <rect x="455" y="235" width="90" height="38" rx="6" fill="#fff" stroke="#999"/>
  <text x="500" y="259" font-size="10" text-anchor="middle">도구 A</text>
  <rect x="545" y="235" width="90" height="38" rx="6" fill="#fff" stroke="#999"/>
  <text x="590" y="259" font-size="10" text-anchor="middle">도구 B</text>
  <rect x="635" y="235" width="90" height="38" rx="6" fill="#fff" stroke="#999"/>
  <text x="680" y="259" font-size="10" text-anchor="middle">종료 판단</text>

  <text x="590" y="300" font-size="10" text-anchor="middle" fill="#b23" font-weight="bold">실행마다 경로가 달라질 수 있음</text>

  <text x="590" y="330" font-size="11" text-anchor="middle" fill="#555">제어 흐름 = LLM 자체</text>
  <text x="590" y="348" font-size="11" text-anchor="middle" fill="#555">실패 시 전체 트랜스크립트 추적 필요</text>
  <text x="590" y="370" font-size="11" text-anchor="middle" fill="#9e3f2c" font-weight="bold">적합: 범위가 실행 중 드러나는 탐색 작업</text>

  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#666"/></marker>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#999"/></marker>
  </defs>
</svg>
