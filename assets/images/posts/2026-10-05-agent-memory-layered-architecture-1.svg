<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">에이전트 메모리의 3계층 구조</text>

  <rect x="40" y="48" width="720" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="400" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#312e81">1계층 · 워크스페이스 파일 (예: SOUL.md, CLAUDE.md)</text>
  <text x="400" y="92" text-anchor="middle" font-size="11" fill="#3730a3">세션 시작 시 항상 로드 — 규칙·컨벤션·정체성, 비용 가장 낮음</text>

  <line x1="400" y1="118" x2="400" y2="140" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="140" width="720" height="130" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="400" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#064e3b">2계층 · 런타임 컨텍스트 + 압축</text>
  <text x="400" y="180" text-anchor="middle" font-size="10" fill="#065f46">도구 호출 · 중간 추론이 누적되다 한계에 가까워지면 압축 발생</text>

  <rect x="60" y="192" width="150" height="60" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
  <text x="135" y="214" text-anchor="middle" font-size="10" fill="#065f46">단순 절단</text>
  <text x="135" y="230" text-anchor="middle" font-size="9" fill="#6b7280">오래된 턴 삭제</text>

  <rect x="225" y="192" width="150" height="60" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
  <text x="300" y="214" text-anchor="middle" font-size="10" fill="#065f46">계층적 요약</text>
  <text x="300" y="230" text-anchor="middle" font-size="9" fill="#6b7280">세부 정보 뭉개짐</text>

  <rect x="390" y="192" width="150" height="60" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
  <text x="465" y="214" text-anchor="middle" font-size="10" fill="#065f46">상태 폴딩</text>
  <text x="465" y="230" text-anchor="middle" font-size="9" fill="#6b7280">JSON 구조화</text>

  <rect x="555" y="192" width="185" height="60" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="647" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">ARC 아카이브</text>
  <text x="647" y="228" text-anchor="middle" font-size="9" fill="#065f46">원문 보존 + ID만 남김</text>
  <text x="647" y="242" text-anchor="middle" font-size="9" fill="#065f46">필요 시 주소로 재조회</text>

  <line x1="400" y1="270" x2="400" y2="292" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="292" width="720" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">3계층 · 장기 저장소 (벡터·그래프 DB)</text>
  <text x="400" y="336" text-anchor="middle" font-size="11" fill="#991b1b">세션이 끝나도 남아야 하는 사실·선호 — RAG로 다음 세션에 재검색</text>

  <rect x="60" y="378" width="680" height="54" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="400" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">설계 순서: 워크스페이스 파일부터 채움 → 런타임 압축 전략 선택</text>
  <text x="400" y="416" text-anchor="middle" font-size="11" fill="#7c2d12">→ 세션 간 재사용이 데이터로 확인된 경우에만 장기 저장소 투자</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
