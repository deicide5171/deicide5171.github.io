<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>

  <rect x="20" y="30" width="150" height="60" rx="8" fill="#0ea5e9"/>
  <text x="95" y="55" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">위성 원본 영상</text>
  <text x="95" y="75" text-anchor="middle" fill="#e0f2fe" font-size="11">Sentinel-2 / Landsat</text>

  <line x1="170" y1="60" x2="230" y2="60" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="30" width="180" height="60" rx="8" fill="#7c3aed"/>
  <text x="320" y="52" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">파운데이션 모델</text>
  <text x="320" y="70" text-anchor="middle" fill="#ede9fe" font-size="11">AlphaEarth · Clay · Prithvi</text>
  <text x="320" y="84" text-anchor="middle" fill="#ede9fe" font-size="10">(사전학습, 재학습 없음)</text>

  <line x1="410" y1="60" x2="470" y2="60" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="470" y="30" width="160" height="60" rx="8" fill="#059669"/>
  <text x="550" y="55" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">64차원 임베딩</text>
  <text x="550" y="75" text-anchor="middle" fill="#d1fae5" font-size="11">10m 해상도 격자</text>

  <line x1="550" y1="90" x2="550" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="440" y="135" width="220" height="55" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="550" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">저장: BigQuery / Earth Engine</text>
  <text x="550" y="176" text-anchor="middle" font-size="11" fill="#475569">벡터DB (유사도 검색용)</text>

  <line x1="550" y1="190" x2="550" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="400" y="235" width="300" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="550" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">경량 다운스트림 모델</text>
  <text x="550" y="277" text-anchor="middle" font-size="11" fill="#78350f">로지스틱 회귀 · 랜덤포레스트</text>
  <text x="550" y="293" text-anchor="middle" font-size="10" fill="#78350f">라벨 수백~수천 개로 학습</text>

  <line x1="550" y1="305" x2="550" y2="345" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="380" y="350" width="340" height="60" rx="8" fill="#dc2626"/>
  <text x="550" y="375" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">애플리케이션</text>
  <text x="550" y="395" text-anchor="middle" fill="#fee2e2" font-size="11">변화탐지 대시보드 · 지도 오버레이 · 알림</text>

  <rect x="20" y="135" width="180" height="140" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="110" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">대안: 직접 학습</text>
  <text x="110" y="180" text-anchor="middle" font-size="10" fill="#475569">라벨링 팀 구성</text>
  <text x="110" y="198" text-anchor="middle" font-size="10" fill="#475569">CNN/ViT 처음부터 학습</text>
  <text x="110" y="216" text-anchor="middle" font-size="10" fill="#475569">GPU 클러스터 필요</text>
  <text x="110" y="234" text-anchor="middle" font-size="10" fill="#475569">센서별 재학습</text>
  <text x="110" y="256" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="bold">비용·시간 10배 이상</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
