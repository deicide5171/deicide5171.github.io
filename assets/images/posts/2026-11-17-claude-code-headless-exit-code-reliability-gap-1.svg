<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">exit code만 믿는 경로 vs JSON 바디까지 보는 경로</text>

  <rect x="40" y="55" width="150" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="83" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">CI 러너: claude -p 호출</text>

  <line x1="190" y1="78" x2="230" y2="78" stroke="#64748b" stroke-width="2"/>

  <!-- wrong path -->
  <rect x="230" y="50" width="540" height="90" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="500" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">잘못된 경로 — exit code만 확인</text>
  <text x="500" y="90" text-anchor="middle" font-size="10" fill="#991b1b">exit 0 → "성공"으로 간주하고 바로 다음 단계 진행</text>
  <text x="500" y="108" text-anchor="middle" font-size="10" fill="#991b1b">권한 거부·rate limit도 exit 0으로 보고될 수 있음</text>
  <text x="500" y="126" text-anchor="middle" font-size="10" fill="#991b1b">→ 아무 일도 안 했는데 "리뷰 완료"로 처리됨</text>

  <line x1="115" y1="101" x2="115" y2="200" stroke="#64748b" stroke-width="2"/>
  <line x1="115" y1="200" x2="230" y2="200" stroke="#16a34a" stroke-width="2"/>

  <!-- right path -->
  <rect x="230" y="160" width="540" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">올바른 경로 — 2단계 게이트</text>
  <text x="500" y="202" text-anchor="middle" font-size="10" fill="#166534">1차: exit code → 프로세스가 끝까지 실행됐는가만 확인</text>
  <text x="500" y="220" text-anchor="middle" font-size="10" fill="#166534">2차: stdout JSON의 is_error · subtype 필드 파싱</text>
  <text x="500" y="238" text-anchor="middle" font-size="10" fill="#166534">→ "프로세스 종료"와 "작업 성공"을 분리해서 판정</text>
  <text x="500" y="256" text-anchor="middle" font-size="10" fill="#166534">→ 둘 다 통과해야만 다음 머지 단계로 진행</text>

  <rect x="40" y="310" width="720" height="110" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="400" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">핵심: exit code는 OS 프로세스 계층의 신호일 뿐이다</text>
  <text x="400" y="357" text-anchor="middle" font-size="11" fill="#64748b">"작업이 의도한 대로 끝났는가"는 애플리케이션 계층(JSON 바디)의 정보다</text>
  <text x="400" y="378" text-anchor="middle" font-size="11" fill="#64748b">밤새 돌아가는 무인 파이프라인일수록 이 간극이 늦게, 조용히 드러난다</text>
  <text x="400" y="399" text-anchor="middle" font-size="11" fill="#64748b">--allowedTools로 범위를 좁히면 권한 거부로 인한 조용한 실패 자체가 줄어든다</text>

</svg>
