<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="32" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">네트워크 네임스페이스, veth, 브리지, NAT의 구조</text>

  <!-- Host boundary -->
  <rect x="30" y="52" width="740" height="366" rx="10" fill="#fbfbfb" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="46" y="74" font-family="sans-serif" font-size="14" font-weight="bold" fill="#555">호스트 (물리 네트워크 네임스페이스)</text>

  <!-- Container netns 1 -->
  <rect x="60" y="90" width="200" height="130" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="160" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f5a8a" text-anchor="middle">컨테이너 A netns</text>
  <rect x="90" y="126" width="140" height="36" rx="5" fill="#ffffff" stroke="#4a7ab5"/>
  <text x="160" y="149" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">eth0 172.17.0.2</text>
  <text x="160" y="190" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">독립 라우팅 테이블</text>
  <text x="160" y="206" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">독립 iptables 규칙</text>

  <!-- Container netns 2 -->
  <rect x="540" y="90" width="200" height="130" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="640" y="112" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f5a8a" text-anchor="middle">컨테이너 B netns</text>
  <rect x="570" y="126" width="140" height="36" rx="5" fill="#ffffff" stroke="#4a7ab5"/>
  <text x="640" y="149" font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">eth0 172.17.0.3</text>
  <text x="640" y="190" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">독립 라우팅 테이블</text>
  <text x="640" y="206" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">독립 iptables 규칙</text>

  <!-- veth pairs -->
  <text x="160" y="238" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">veth-ns1</text>
  <line x1="160" y1="220" x2="160" y2="256" stroke="#1a6b45" stroke-width="2.5"/>
  <text x="640" y="238" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">veth-ns2</text>
  <line x1="640" y1="220" x2="640" y2="256" stroke="#1a6b45" stroke-width="2.5"/>

  <text x="130" y="252" font-family="sans-serif" font-size="11" fill="#999" text-anchor="middle">veth 페어</text>
  <text x="610" y="252" font-family="sans-serif" font-size="11" fill="#999" text-anchor="middle">veth 페어</text>

  <!-- Bridge -->
  <rect x="240" y="256" width="320" height="52" rx="8" fill="#fdf6ec" stroke="#c98a3d" stroke-width="2"/>
  <text x="400" y="288" font-family="sans-serif" font-size="15" font-weight="bold" fill="#a3611c" text-anchor="middle">docker0 브리지 (L2 스위치 역할)</text>

  <line x1="160" y1="256" x2="270" y2="256" stroke="#1a6b45" stroke-width="2.5"/>
  <line x1="640" y1="256" x2="530" y2="256" stroke="#1a6b45" stroke-width="2.5"/>

  <!-- iptables NAT box -->
  <rect x="290" y="330" width="220" height="70" rx="8" fill="#fdeceb" stroke="#d0413b" stroke-width="1.5"/>
  <text x="400" y="352" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a3221c" text-anchor="middle">iptables NAT</text>
  <text x="400" y="372" font-family="sans-serif" font-size="12" fill="#7a3530" text-anchor="middle">SNAT(외부로 나갈 때)</text>
  <text x="400" y="388" font-family="sans-serif" font-size="12" fill="#7a3530" text-anchor="middle">DNAT(포트 매핑 수신)</text>

  <line x1="400" y1="308" x2="400" y2="330" stroke="#d0413b" stroke-width="2.5"/>
  <polygon points="400,330 394,318 406,318" fill="#d0413b"/>

  <!-- External network -->
  <text x="400" y="425" font-family="sans-serif" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">외부 네트워크 / 인터넷</text>
  <line x1="400" y1="400" x2="400" y2="412" stroke="#555" stroke-width="2" stroke-dasharray="3,3"/>
</svg>
