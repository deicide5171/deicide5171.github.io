<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">재귀 해석(Recursive Resolution) 흐름</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#666">스텁 리졸버는 재귀 리졸버에게 한 번 물어보고, 실제 탐색은 재귀 리졸버가 대신 수행한다</text>

  <!-- Client -->
  <rect x="30" y="90" width="140" height="50" rx="6" fill="#555a63" stroke="#33363d" stroke-width="1.5"/>
  <text x="100" y="112" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">클라이언트</text>
  <text x="100" y="128" text-anchor="middle" font-size="10" fill="#e5e5ea">스텁 리졸버</text>

  <!-- Recursive resolver -->
  <rect x="230" y="90" width="160" height="50" rx="6" fill="#0b5fa5" stroke="#083f6e" stroke-width="1.5"/>
  <text x="310" y="112" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">재귀 리졸버</text>
  <text x="310" y="128" text-anchor="middle" font-size="10" fill="#dbeafe">ISP / 사내망 / 공용(8.8.8.8 등)</text>

  <!-- arrow client -> resolver -->
  <line x1="170" y1="105" x2="228" y2="105" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="199" y="98" text-anchor="middle" font-size="9.5" fill="#555">① 질의</text>
  <line x1="228" y1="130" x2="170" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="199" y="147" text-anchor="middle" font-size="9.5" fill="#555">⑤ 최종 응답</text>

  <!-- Root / TLD / Authoritative column -->
  <rect x="470" y="30" width="150" height="46" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="545" y="50" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">루트 네임서버</text>
  <text x="545" y="65" text-anchor="middle" font-size="9.5" fill="#dbeafe">TLD 서버 주소 응답</text>

  <rect x="470" y="100" width="150" height="46" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="545" y="120" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">TLD 네임서버</text>
  <text x="545" y="135" text-anchor="middle" font-size="9.5" fill="#dbeafe">예: .com 담당</text>

  <rect x="470" y="170" width="150" height="46" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="545" y="190" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">권한 네임서버</text>
  <text x="545" y="205" text-anchor="middle" font-size="9.5" fill="#eafff0">최종 레코드(A 등) 보유</text>

  <!-- arrows resolver <-> root/tld/auth -->
  <line x1="390" y1="95" x2="468" y2="53" stroke="#999" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="430" y="75" text-anchor="middle" font-size="9" fill="#666">② 루트에 질의</text>

  <line x1="390" y1="105" x2="468" y2="123" stroke="#999" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="425" y="108" text-anchor="middle" font-size="9" fill="#666">③ TLD에 질의</text>

  <line x1="390" y1="130" x2="468" y2="193" stroke="#999" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="425" y="165" text-anchor="middle" font-size="9" fill="#666">④ 권한 서버에 질의</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Cache note -->
  <rect x="230" y="260" width="330" height="90" rx="6" fill="#fff7f0" stroke="#ff8a3d" stroke-width="1.3"/>
  <text x="395" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a4b1a">캐싱 &amp; TTL</text>
  <text x="245" y="305" font-size="10.5" fill="#5a3a1a">재귀 리졸버는 응답을 TTL(초)만큼 캐시에 저장한다.</text>
  <text x="245" y="322" font-size="10.5" fill="#5a3a1a">TTL이 만료되기 전까지는 같은 질의가 오면</text>
  <text x="245" y="339" font-size="10.5" fill="#5a3a1a">①~④ 과정을 생략하고 캐시된 값을 바로 돌려준다.</text>

  <!-- bottom note -->
  <text x="400" y="400" text-anchor="middle" font-size="11.5" fill="#555">OS·브라우저도 각자 짧은 시간 캐시를 둘 수 있어, 레코드 변경 반영 시점은 계층마다 다를 수 있다</text>
</svg>
