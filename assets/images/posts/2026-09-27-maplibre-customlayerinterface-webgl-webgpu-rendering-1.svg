<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">MapLibre GL JS 프레임 렌더링과 CustomLayerInterface</text>

  <!-- Frame loop box -->
  <rect x="40" y="60" width="720" height="60" rx="8" fill="#eef4fb" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="400" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4f73">매 프레임(requestAnimationFrame) 호출</text>
  <text x="400" y="106" text-anchor="middle" font-size="13" fill="#33587a">카메라 행렬(투영·모델뷰) 계산 → 레이어 순서대로 draw 호출</text>

  <!-- Layer stack -->
  <rect x="60" y="150" width="180" height="46" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
  <text x="150" y="178" text-anchor="middle" font-size="13" fill="#333">기본 레이어(fill/line)</text>

  <rect x="60" y="206" width="180" height="46" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
  <text x="150" y="234" text-anchor="middle" font-size="13" fill="#333">심볼/라벨 레이어</text>

  <rect x="60" y="262" width="180" height="46" rx="6" fill="#fff3e0" stroke="#e0952b" stroke-width="2"/>
  <text x="150" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a12">CustomLayer</text>
  <text x="150" y="300" text-anchor="middle" font-size="11" fill="#8a5a12">(CustomLayerInterface)</text>

  <rect x="60" y="318" width="180" height="46" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
  <text x="150" y="346" text-anchor="middle" font-size="13" fill="#333">다음 레이어들</text>

  <line x1="150" y1="196" x2="150" y2="206" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="252" x2="150" y2="262" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="308" x2="150" y2="318" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Custom layer lifecycle -->
  <rect x="320" y="150" width="420" height="214" rx="8" fill="#fdf5f0" stroke="#e0952b" stroke-width="1.5"/>
  <text x="530" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a12">CustomLayerInterface 생명주기</text>

  <rect x="345" y="192" width="370" height="42" rx="6" fill="#ffffff" stroke="#c98a2e" stroke-width="1.2"/>
  <text x="530" y="217" text-anchor="middle" font-size="13" fill="#5a3f10">onAdd(map, gl) — WebGL 컨텍스트·셰이더·버퍼 초기화</text>

  <rect x="345" y="244" width="370" height="42" rx="6" fill="#ffffff" stroke="#c98a2e" stroke-width="1.2"/>
  <text x="530" y="269" text-anchor="middle" font-size="13" fill="#5a3f10">render(gl, matrix) — 매 프레임 투영 행렬로 직접 그리기</text>

  <rect x="345" y="296" width="370" height="42" rx="6" fill="#ffffff" stroke="#c98a2e" stroke-width="1.2"/>
  <text x="530" y="321" text-anchor="middle" font-size="13" fill="#5a3f10">onRemove(map, gl) — 리소스 해제(버퍼·텍스처 정리)</text>

  <line x1="530" y1="234" x2="530" y2="244" stroke="#c98a2e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="286" x2="530" y2="296" stroke="#c98a2e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- matrix flow -->
  <line x1="240" y1="285" x2="320" y2="263" stroke="#8a5a12" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="278" y="255" font-size="11" fill="#8a5a12">매트릭스 전달</text>

  <!-- footer note -->
  <rect x="40" y="388" width="720" height="46" rx="6" fill="#f0f7f4" stroke="#03c75a" stroke-width="1.2"/>
  <text x="400" y="410" text-anchor="middle" font-size="13" fill="#1d5c3f">같은 WebGL 컨텍스트를 공유하므로 GL 상태(blend, depth) 변경 후 반드시 원복해야 다른 레이어 렌더링이 깨지지 않는다</text>
  <text x="400" y="426" text-anchor="middle" font-size="11" fill="#3c7a5c">deck.gl의 MapboxOverlay도 내부적으로 동일한 인터페이스를 활용해 통합된다</text>
</svg>
