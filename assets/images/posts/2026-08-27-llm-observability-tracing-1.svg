<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">RAG 요청 하나 = 트레이스 하나, 각 단계 = 스팬</text>

  <!-- 트레이스 컨테이너 -->
  <rect x="40" y="60" width="720" height="330" rx="10" fill="#f7f9fc" stroke="#b9cfe8" stroke-width="1.5"/>
  <text x="56" y="86" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3a5a8c">트레이스: rag-answer (user_id, trace_id)</text>

  <!-- 스팬 1: retrieve -->
  <rect x="70" y="104" width="660" height="64" rx="6" fill="#ffffff" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="86" y="126" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222">스팬: retrieve</text>
  <text x="86" y="146" font-family="sans-serif" font-size="12" fill="#666">input: query · output: doc_id[5] · latency: 82ms</text>
  <text x="86" y="162" font-family="sans-serif" font-size="11" fill="#999">원문 대신 문서 ID/스니펫만 저장 (PII·용량 절감)</text>

  <!-- arrow down -->
  <line x1="400" y1="168" x2="400" y2="188" stroke="#888" stroke-width="2"/>
  <polygon points="400,196 393,183 407,183" fill="#888"/>

  <!-- 스팬 2: rerank -->
  <rect x="70" y="200" width="660" height="56" rx="6" fill="#ffffff" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="86" y="220" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222">스팬: rerank</text>
  <text x="86" y="240" font-family="sans-serif" font-size="12" fill="#666">input: doc_id[5] · output: doc_id[3] (top-3 재정렬) · latency: 41ms</text>

  <line x1="400" y1="256" x2="400" y2="276" stroke="#888" stroke-width="2"/>
  <polygon points="400,284 393,271 407,271" fill="#888"/>

  <!-- 스팬 3: generation -->
  <rect x="70" y="288" width="660" height="86" rx="6" fill="#eef8f1" stroke="#2e9e63" stroke-width="2"/>
  <text x="86" y="310" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a6b45">스팬(generation): generate — gpt-4.1-mini</text>
  <text x="86" y="330" font-family="sans-serif" font-size="12" fill="#444">input: 최종 프롬프트 전문 · output: 완성 전문</text>
  <text x="86" y="348" font-family="sans-serif" font-size="12" fill="#444">usage: input_tokens=612, output_tokens=184 · cost: $0.0041</text>
  <text x="86" y="365" font-family="sans-serif" font-size="11" fill="#888">latency: TTFT 320ms / 총 1.4s (스트리밍은 둘을 분리 기록)</text>

  <text x="400" y="410" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">트레이스 ID 하나로 세 스팬을 순서대로 재생하면 "왜 이 답이 나왔는지"를 재구성할 수 있다</text>
</svg>
