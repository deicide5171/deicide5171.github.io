<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">에이전트의 코드 탐색 범위 — 모듈러 모놀리스 vs 마이크로서비스</text>

  <!-- Modular monolith -->
  <text x="40" y="60" font-size="13" font-weight="bold" fill="#1b5e20">① 모듈러 모놀리스 — 한 모듈 안에서 끝난다</text>

  <rect x="40" y="75" width="130" height="50" rx="6" fill="#e8f4fd" stroke="#2b7fd1" stroke-width="2"/>
  <text x="105" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4d7a">기능 요청</text>

  <defs>
    <marker id="am1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7d32"/>
    </marker>
  </defs>
  <line x1="170" y1="100" x2="218" y2="100" stroke="#2e7d32" stroke-width="2" marker-end="url(#am1)"/>

  <rect x="220" y="65" width="380" height="75" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="410" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">단일 배포 단위 (모듈러 모놀리스)</text>
  <rect x="235" y="95" width="110" height="35" rx="5" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="290" y="117" text-anchor="middle" font-size="10" fill="#1b5e20">가격 모듈</text>
  <rect x="355" y="95" width="110" height="35" rx="5" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="410" y="117" text-anchor="middle" font-size="10" fill="#999">쿠폰 모듈</text>
  <rect x="475" y="95" width="110" height="35" rx="5" fill="#fff" stroke="#bbb" stroke-width="1"/>
  <text x="530" y="117" text-anchor="middle" font-size="10" fill="#999">알림 모듈</text>

  <text x="630" y="95" font-size="10.5" fill="#1b5e20">→ 가격 모듈</text>
  <text x="630" y="110" font-size="10.5" fill="#1b5e20">하나만 컨텍스트에</text>
  <text x="630" y="125" font-size="10.5" fill="#1b5e20">올려 작업 완료</text>

  <!-- Microservices -->
  <text x="40" y="210" font-size="13" font-weight="bold" fill="#c0392b">② IDP 없는 마이크로서비스 — 경계를 다 넘어야 한다</text>

  <rect x="40" y="225" width="130" height="50" rx="6" fill="#e8f4fd" stroke="#2b7fd1" stroke-width="2"/>
  <text x="105" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4d7a">기능 요청</text>

  <defs>
    <marker id="am2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <line x1="170" y1="250" x2="210" y2="250" stroke="#c0392b" stroke-width="2" marker-end="url(#am2)"/>

  <rect x="215" y="225" width="100" height="50" rx="6" fill="#fdf0e8" stroke="#c0392b" stroke-width="2"/>
  <text x="265" y="255" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a2d1c">주문 서비스</text>
  <line x1="315" y1="250" x2="345" y2="250" stroke="#c0392b" stroke-width="2" marker-end="url(#am2)"/>

  <rect x="350" y="225" width="100" height="50" rx="6" fill="#fdf0e8" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="255" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a2d1c">가격 서비스</text>
  <line x1="450" y1="250" x2="480" y2="250" stroke="#c0392b" stroke-width="2" marker-end="url(#am2)"/>

  <rect x="485" y="225" width="100" height="50" rx="6" fill="#fdf0e8" stroke="#c0392b" stroke-width="2"/>
  <text x="535" y="255" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a2d1c">쿠폰 서비스</text>
  <line x1="585" y1="250" x2="615" y2="250" stroke="#c0392b" stroke-width="2" marker-end="url(#am2)"/>

  <rect x="620" y="225" width="100" height="50" rx="6" fill="#fdf0e8" stroke="#c0392b" stroke-width="2"/>
  <text x="670" y="255" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a2d1c">알림 서비스</text>

  <text x="400" y="300" text-anchor="middle" font-size="11.5" fill="#8a2d1c">→ 서비스 4개를 순서대로 열어 API 클라이언트·DTO까지 읽어야 수정 지점을 찾는다</text>

  <!-- Bottom note -->
  <rect x="30" y="330" width="740" height="100" rx="8" fill="#fff7f0" stroke="#f0a04b" stroke-width="2"/>
  <text x="400" y="353" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a1c">판단 기준: 독립 배포·독립 스케일링이 이 서비스에 실제로 필요한가</text>
  <text x="400" y="376" text-anchor="middle" font-size="12" fill="#5a4632">· 필요 없다면 모듈러 모놀리스로 통합 — 에이전트 탐색 범위도, 운영 부담도 함께 줄어든다</text>
  <text x="400" y="398" text-anchor="middle" font-size="12" fill="#5a4632">· 꼭 필요하다면 서비스는 유지하되, 카탈로그·API 계약 정비에 먼저 투자한다</text>
  <text x="400" y="418" text-anchor="middle" font-size="12" fill="#5a4632">→ 투자 없이 서비스만 쪼개는 것이 에이전트 시대 가장 비싼 선택이다</text>
</svg>
