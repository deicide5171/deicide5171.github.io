<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">io_uring의 SQ/CQ 공유 링 버퍼 구조</text>

  <!-- Application box -->
  <rect x="20" y="70" width="170" height="150" rx="6" fill="#eaf1fd" stroke="#2f6fed"/>
  <text x="105" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">애플리케이션</text>
  <text x="105" y="118" text-anchor="middle" font-size="10.5" fill="#274690">사용자 공간</text>
  <text x="105" y="145" text-anchor="middle" font-size="10.5" fill="#274690">SQE를 채워</text>
  <text x="105" y="160" text-anchor="middle" font-size="10.5" fill="#274690">SQ에 적재</text>
  <text x="105" y="185" text-anchor="middle" font-size="10.5" fill="#274690">CQ에서</text>
  <text x="105" y="200" text-anchor="middle" font-size="10.5" fill="#274690">결과를 소비</text>

  <!-- Shared mmap region -->
  <rect x="230" y="55" width="340" height="180" rx="6" fill="#f9f9f9" stroke="#999999" stroke-dasharray="5,3"/>
  <text x="400" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#555555">mmap으로 공유되는 메모리 (시스템 콜 없이 접근)</text>

  <!-- SQ ring -->
  <rect x="250" y="90" width="140" height="70" rx="6" fill="#fdf1e6" stroke="#e67e22" stroke-width="2"/>
  <text x="320" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c2610d">SQ (제출 큐)</text>
  <text x="320" y="128" text-anchor="middle" font-size="9.5" fill="#7a4a1a">io_uring_sqe[]</text>
  <text x="320" y="143" text-anchor="middle" font-size="9.5" fill="#7a4a1a">head / tail 포인터</text>

  <!-- CQ ring -->
  <rect x="410" y="90" width="140" height="70" rx="6" fill="#e9f8ef" stroke="#1f9d55" stroke-width="2"/>
  <text x="480" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#15803d">CQ (완료 큐)</text>
  <text x="480" y="128" text-anchor="middle" font-size="9.5" fill="#166534">io_uring_cqe[]</text>
  <text x="480" y="143" text-anchor="middle" font-size="9.5" fill="#166534">head / tail 포인터</text>

  <!-- io_uring_enter -->
  <rect x="300" y="180" width="200" height="40" rx="6" fill="#f0f0f0" stroke="#999999"/>
  <text x="400" y="196" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#444444">io_uring_enter()</text>
  <text x="400" y="211" text-anchor="middle" font-size="9" fill="#666666">배치 제출 시 유일한 시스템 콜</text>

  <!-- Kernel box -->
  <rect x="610" y="70" width="170" height="150" rx="6" fill="#e9f8ef" stroke="#1f9d55"/>
  <text x="695" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">커널</text>
  <text x="695" y="118" text-anchor="middle" font-size="10.5" fill="#166534">SQ에서 요청을</text>
  <text x="695" y="133" text-anchor="middle" font-size="10.5" fill="#166534">가져와 비동기 처리</text>
  <text x="695" y="160" text-anchor="middle" font-size="10.5" fill="#166534">완료되면</text>
  <text x="695" y="175" text-anchor="middle" font-size="10.5" fill="#166534">CQ에 결과 적재</text>

  <!-- arrows -->
  <line x1="190" y1="125" x2="248" y2="125" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow0)"/>
  <text x="219" y="115" text-anchor="middle" font-size="9" fill="#1d4ed8">SQE 기록</text>

  <line x1="390" y1="125" x2="410" y2="125" stroke="#999999" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <line x1="550" y1="125" x2="608" y2="125" stroke="#1f9d55" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="579" y="115" text-anchor="middle" font-size="9" fill="#15803d">결과 확인</text>

  <line x1="490" y1="160" x2="695" y2="160" stroke="#1f9d55" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow2)" transform="translate(0,0)"/>

  <defs>
    <marker id="arrow0" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f6fed"/>
    </marker>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999999"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f9d55"/>
    </marker>
  </defs>

  <rect x="30" y="300" width="740" height="110" rx="4" fill="#f9f9f9" stroke="#dddddd"/>
  <text x="400" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">핵심: 요청과 결과 모두 공유 메모리를 거쳐간다</text>
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#666666">SQ/CQ는 애플리케이션과 커널이 mmap으로 함께 들여다보는 링 버퍼다</text>
  <text x="400" y="370" text-anchor="middle" font-size="11" fill="#666666">요청을 쌓는 동안은 시스템 콜이 필요 없고, 배치로 모아 io_uring_enter 한 번으로 알린다</text>
  <text x="400" y="390" text-anchor="middle" font-size="11" fill="#666666">완료 결과도 CQ에 쌓이므로, 여러 건을 한꺼번에 순회하며 소비할 수 있다</text>
</svg>
