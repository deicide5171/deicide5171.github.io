<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Potree — LAS/LAZ 포인트클라우드를 옥트리 LOD로 웹 렌더링</text>

  <!-- Step 1: raw LAS/LAZ -->
  <text x="130" y="60" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">1) 원본 LAS/LAZ</text>
  <rect x="45" y="75" width="170" height="140" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <g fill="#64748b">
    <circle cx="70" cy="100" r="1.6"/><circle cx="90" cy="115" r="1.6"/><circle cx="110" cy="95" r="1.6"/>
    <circle cx="130" cy="120" r="1.6"/><circle cx="150" cy="105" r="1.6"/><circle cx="170" cy="130" r="1.6"/>
    <circle cx="80" cy="140" r="1.6"/><circle cx="100" cy="155" r="1.6"/><circle cx="120" cy="145" r="1.6"/>
    <circle cx="140" cy="160" r="1.6"/><circle cx="160" cy="150" r="1.6"/><circle cx="185" cy="140" r="1.6"/>
    <circle cx="75" cy="175" r="1.6"/><circle cx="95" cy="185" r="1.6"/><circle cx="115" cy="190" r="1.6"/>
    <circle cx="135" cy="180" r="1.6"/><circle cx="155" cy="195" r="1.6"/><circle cx="175" cy="185" r="1.6"/>
    <circle cx="60" cy="130" r="1.6"/><circle cx="195" cy="110" r="1.6"/><circle cx="105" cy="200" r="1.6"/>
  </g>
  <text x="130" y="222" text-anchor="middle" font-size="10.5" fill="#475569">수억 개의 점 (한 번에 로드 불가)</text>

  <path d="M220,145 L270,145" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrP)"/>
  <defs>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Step 2: octree partitioning -->
  <text x="360" y="60" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">2) 옥트리 분할 (전처리)</text>
  <rect x="280" y="75" width="170" height="140" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="300" y="95" width="130" height="100" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="365" y1="95" x2="365" y2="195" stroke="#3b82f6" stroke-width="1.2"/>
  <line x1="300" y1="145" x2="430" y2="145" stroke="#3b82f6" stroke-width="1.2"/>
  <line x1="332" y1="95" x2="332" y2="145" stroke="#93c5fd" stroke-width="1"/>
  <line x1="300" y1="120" x2="365" y2="120" stroke="#93c5fd" stroke-width="1"/>
  <text x="365" y="205" text-anchor="middle" font-size="10.5" fill="#1e3a8a">공간을 재귀적으로 8분할</text>

  <path d="M455,145 L505,145" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrP)"/>

  <!-- Step 3: LOD streaming -->
  <text x="615" y="60" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">3) 화면에 LOD 스트리밍</text>
  <rect x="515" y="75" width="240" height="140" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <g fill="#059669">
    <circle cx="540" cy="100" r="2.2"/><circle cx="570" cy="95" r="2.2"/><circle cx="600" cy="105" r="2.2"/>
    <circle cx="630" cy="98" r="2.2"/><circle cx="660" cy="110" r="2.2"/><circle cx="690" cy="100" r="2.2"/>
    <circle cx="720" cy="108" r="2.2"/><circle cx="555" cy="130" r="2.2"/><circle cx="585" cy="140" r="2.2"/>
  </g>
  <g fill="#a7f3d0">
    <circle cx="545" cy="160" r="1.1"/><circle cx="555" cy="165" r="1.1"/><circle cx="565" cy="158" r="1.1"/>
    <circle cx="575" cy="170" r="1.1"/><circle cx="585" cy="162" r="1.1"/><circle cx="595" cy="172" r="1.1"/>
    <circle cx="605" cy="160" r="1.1"/><circle cx="615" cy="175" r="1.1"/><circle cx="625" cy="163" r="1.1"/>
  </g>
  <text x="635" y="200" text-anchor="middle" font-size="10.5" fill="#065f46">가까운 영역: 조밀 / 먼 영역: 성긴 포인트</text>

  <!-- bottom summary -->
  <rect x="40" y="245" width="720" height="175" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">카메라 거리 기반 노드 선택</text>

  <rect x="70" y="290" width="200" height="105" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="170" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">카메라 근접 옥트리 노드</text>
  <text x="170" y="335" text-anchor="middle" font-size="10.5" fill="#64748b">전체 포인트 로드</text>
  <text x="170" y="352" text-anchor="middle" font-size="10.5" fill="#64748b">높은 상세도</text>
  <text x="170" y="375" text-anchor="middle" font-size="10.5" fill="#64748b">GPU 메모리 집중 사용</text>

  <rect x="300" y="290" width="200" height="105" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="400" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">카메라 원거리 옥트리 노드</text>
  <text x="400" y="335" text-anchor="middle" font-size="10.5" fill="#64748b">서브샘플링된 포인트만</text>
  <text x="400" y="352" text-anchor="middle" font-size="10.5" fill="#64748b">낮은 상세도</text>
  <text x="400" y="375" text-anchor="middle" font-size="10.5" fill="#64748b">디스크에서 지연 로드</text>

  <rect x="530" y="290" width="200" height="105" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="630" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">화면 밖 노드</text>
  <text x="630" y="335" text-anchor="middle" font-size="10.5" fill="#64748b">로드되지 않음</text>
  <text x="630" y="352" text-anchor="middle" font-size="10.5" fill="#64748b">(frustum culling)</text>
  <text x="630" y="375" text-anchor="middle" font-size="10.5" fill="#64748b">메모리 절약</text>
</svg>
