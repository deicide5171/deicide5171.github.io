<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">RPO와 RTO — 장애 시점 기준 타임라인</text>

  <!-- 타임라인 -->
  <line x1="60" y1="220" x2="740" y2="220" stroke="#cccccc" stroke-width="3"/>

  <!-- 마지막 복제 지점 -->
  <circle cx="260" cy="220" r="9" fill="#ffffff" stroke="#2e9e63" stroke-width="3"/>
  <text x="260" y="252" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a6b45" text-anchor="middle">마지막 복제 시점</text>

  <!-- 장애 발생 -->
  <line x1="430" y1="208" x2="446" y2="232" stroke="#d0413b" stroke-width="4"/>
  <line x1="446" y1="208" x2="430" y2="232" stroke="#d0413b" stroke-width="4"/>
  <text x="438" y="252" font-family="sans-serif" font-size="13" font-weight="bold" fill="#d0413b" text-anchor="middle">장애 발생</text>

  <!-- 복구 완료 -->
  <circle cx="660" cy="220" r="9" fill="#ffffff" stroke="#4a7ab5" stroke-width="3"/>
  <text x="660" y="252" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3a5a8c" text-anchor="middle">서비스 정상화</text>

  <!-- RPO 구간 -->
  <line x1="260" y1="180" x2="438" y2="180" stroke="#2e9e63" stroke-width="6"/>
  <text x="349" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a6b45" text-anchor="middle">RPO — 데이터 손실 구간</text>
  <text x="349" y="200" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">이 구간의 쓰기는 복원 시 유실될 수 있음</text>

  <!-- RTO 구간 -->
  <line x1="438" y1="280" x2="660" y2="280" stroke="#4a7ab5" stroke-width="6"/>
  <text x="549" y="305" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3a5a8c" text-anchor="middle">RTO — 서비스 중단 구간</text>
  <text x="549" y="322" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">장애 인지·판단·페일오버·검증까지 포함</text>

  <text x="400" y="380" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">복제 지연이 커지면 "마지막 복제 시점"이 뒤로 밀려 실측 RPO는 설계값보다 나빠진다</text>
  <text x="400" y="410" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">RTO에는 자동화 시간뿐 아니라 사람이 판단·개입하는 시간까지 포함해야 한다</text>
</svg>
