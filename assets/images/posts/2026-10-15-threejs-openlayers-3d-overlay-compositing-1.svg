<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrowO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">OpenLayers + three.js 합성 — 카메라 동기화와 렌더 루프 구조</text>

  <rect x="40" y="55" width="190" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="135" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">OpenLayers View</text>
  <text x="135" y="94" text-anchor="middle" font-size="8.5" fill="#1e40af">center / resolution / rotation</text>

  <line x1="230" y1="83" x2="280" y2="83" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowO)"/>
  <text x="255" y="73" text-anchor="middle" font-size="7.5" fill="#4b5563">postrender 이벤트</text>

  <rect x="280" y="55" width="200" height="56" rx="8" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/>
  <text x="380" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">카메라 동기화 모듈</text>
  <text x="380" y="94" text-anchor="middle" font-size="8.5" fill="#92400e">좌표 변환 + 투영행렬 갱신</text>

  <line x1="480" y1="83" x2="530" y2="83" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowO)"/>

  <rect x="530" y="55" width="210" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="635" y="78" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">three.js PerspectiveCamera</text>
  <text x="635" y="94" text-anchor="middle" font-size="8.5" fill="#065f46">updateProjectionMatrix()</text>

  <line x1="135" y1="111" x2="135" y2="150" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="635" y1="111" x2="635" y2="150" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4,4"/>

  <text x="200" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">두 렌더 루프가 겹쳐진 화면</text>

  <rect x="60" y="165" width="320" height="200" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="188" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">레이어 1 — OpenLayers 2D 캔버스</text>
  <rect x="80" y="200" width="100" height="70" fill="#dbeafe" stroke="#2563eb"/>
  <text x="130" y="240" text-anchor="middle" font-size="8" fill="#1e3a8a">벡터타일</text>
  <rect x="190" y="200" width="100" height="70" fill="#dbeafe" stroke="#2563eb"/>
  <text x="240" y="240" text-anchor="middle" font-size="8" fill="#1e3a8a">라벨·스타일</text>
  <text x="220" y="300" text-anchor="middle" font-size="8.5" fill="#475569">EPSG:3857 (Web Mercator, 미터)</text>
  <text x="220" y="316" text-anchor="middle" font-size="8.5" fill="#475569">기존 지도 자산 그대로 유지</text>
  <text x="220" y="340" text-anchor="middle" font-size="8" fill="#64748b">pointer-events: none 또는</text>
  <text x="220" y="354" text-anchor="middle" font-size="8" fill="#64748b">GL 컨텍스트 공유로 포갬</text>

  <rect x="420" y="165" width="320" height="200" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="188" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">레이어 2 — three.js 3D 캔버스</text>
  <polygon points="540,260 580,210 640,220 620,280" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
  <text x="580" y="300" text-anchor="middle" font-size="8.5" fill="#166534">강조 건물 3D 매스</text>
  <text x="580" y="322" text-anchor="middle" font-size="8.5" fill="#166534">로컬 좌표(원점 기준 상대 미터)</text>
  <text x="580" y="346" text-anchor="middle" font-size="8" fill="#15803d">깊이·폐색은 GL 컨텍스트 공유 시에만</text>
  <text x="580" y="360" text-anchor="middle" font-size="8" fill="#15803d">레이어 간에도 자연스럽게 처리됨</text>

  <text x="400" y="400" text-anchor="middle" font-size="9" fill="#4b5563">지도를 드래그·줌할 때마다 카메라 동기화 모듈이 매 프레임 three.js 카메라를 갱신 — 둘이 함께 움직여야 "합성"이 성립한다</text>
</svg>
