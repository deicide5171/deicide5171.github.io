<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Pretendard','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- Trigger -->
  <rect x="30" y="190" width="120" height="70" rx="10" fill="#eef2f7" stroke="#8a97a8" stroke-width="1.5"/>
  <text x="90" y="220" text-anchor="middle" font-size="14" fill="#222">스케줄 트리거</text>
  <text x="90" y="240" text-anchor="middle" font-size="12" fill="#666">크론 · 이벤트</text>

  <path d="M150 225 L200 225" stroke="#8a97a8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Session -->
  <rect x="200" y="190" width="130" height="70" rx="10" fill="#eef2f7" stroke="#8a97a8" stroke-width="1.5"/>
  <text x="265" y="220" text-anchor="middle" font-size="14" fill="#222">세션 실행</text>
  <text x="265" y="240" text-anchor="middle" font-size="12" fill="#666">작업 수행</text>

  <path d="M330 225 L385 225" stroke="#8a97a8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gate -->
  <polygon points="465,160 555,225 465,290 375,225" fill="#fff3e0" stroke="#e08a2e" stroke-width="2"/>
  <text x="465" y="220" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">판단 게이트</text>
  <text x="465" y="238" text-anchor="middle" font-size="11" fill="#8a5a1e">알릴 가치가 있는가</text>

  <!-- Silent path -->
  <path d="M465 160 C 465 90, 465 90, 620 90" stroke="#8a97a8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <rect x="620" y="60" width="150" height="60" rx="10" fill="#f4f4f4" stroke="#999" stroke-width="1.5"/>
  <text x="695" y="85" text-anchor="middle" font-size="13" fill="#333">조용한 로그</text>
  <text x="695" y="102" text-anchor="middle" font-size="11" fill="#777">noop 스트릭 누적</text>

  <!-- Notify path -->
  <path d="M465 290 C 465 360, 465 360, 620 360" stroke="#03c75a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="620" y="330" width="150" height="90" rx="10" fill="#f0f7f4" stroke="#03c75a" stroke-width="1.5"/>
  <text x="695" y="355" text-anchor="middle" font-size="13" fill="#065f2f" font-weight="bold">알림 발송</text>
  <text x="695" y="373" text-anchor="middle" font-size="11" fill="#065f2f">Push</text>
  <text x="695" y="389" text-anchor="middle" font-size="11" fill="#065f2f">Email</text>
  <text x="695" y="405" text-anchor="middle" font-size="11" fill="#065f2f">Channels</text>

  <text x="420" y="130" text-anchor="middle" font-size="11" fill="#8a97a8">예산 밖 / 변화 없음</text>
  <text x="420" y="320" text-anchor="middle" font-size="11" fill="#1f8a4c">실패 또는 임계값 초과</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8a97a8"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#03c75a"/>
    </marker>
  </defs>
</svg>
