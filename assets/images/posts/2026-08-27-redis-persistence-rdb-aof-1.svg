<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="32" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">RDB vs AOF vs 하이브리드 영속성</text>

  <!-- RDB -->
  <text x="150" y="66" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3a5a8c" text-anchor="middle">RDB — 스냅샷</text>
  <rect x="50" y="78" width="200" height="46" rx="6" fill="#eef4fb" stroke="#4a7ab5"/>
  <text x="150" y="106" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222">메모리 전체 (fork+COW)</text>
  <line x1="150" y1="124" x2="150" y2="150" stroke="#8aa5c4" stroke-width="2"/>
  <polygon points="150,158 143,145 157,145" fill="#8aa5c4"/>
  <rect x="50" y="160" width="200" height="46" rx="6" fill="#ffffff" stroke="#4a7ab5" stroke-width="2"/>
  <text x="150" y="188" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#222">dump.rdb (이진, 압축)</text>
  <text x="150" y="228" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">복구 빠름, 마지막 스냅샷</text>
  <text x="150" y="244" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">이후 변경은 유실</text>

  <!-- AOF -->
  <text x="400" y="66" font-family="sans-serif" font-size="15" font-weight="bold" fill="#a3611c" text-anchor="middle">AOF — 쓰기 명령 로그</text>
  <rect x="300" y="78" width="200" height="30" rx="4" fill="#fdf6ec" stroke="#c98a3d"/>
  <text x="400" y="98" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222">SET key1 val1</text>
  <rect x="300" y="112" width="200" height="30" rx="4" fill="#fdf6ec" stroke="#c98a3d"/>
  <text x="400" y="132" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222">INCR counter</text>
  <rect x="300" y="146" width="200" height="30" rx="4" fill="#fdf6ec" stroke="#c98a3d"/>
  <text x="400" y="166" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222">SET key2 val2 ...</text>
  <text x="400" y="228" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">appendfsync로 손실 창 조절</text>
  <text x="400" y="244" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">파일 커짐 → BGREWRITEAOF</text>

  <!-- 하이브리드 -->
  <text x="650" y="66" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a6b45" text-anchor="middle">하이브리드 (권장)</text>
  <rect x="560" y="78" width="180" height="34" rx="4" fill="#eef8f1" stroke="#2e9e63" stroke-width="2"/>
  <text x="650" y="99" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a6b45">RDB 프리앰블 (압축된 전체)</text>
  <rect x="560" y="116" width="180" height="60" rx="4" fill="#fdf6ec" stroke="#c98a3d"/>
  <text x="650" y="136" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222">재작성 이후</text>
  <text x="650" y="152" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#222">증분 AOF 로그</text>
  <text x="650" y="228" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">빠른 복구 + 낮은 손실 창</text>
  <text x="650" y="244" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">aof-use-rdb-preamble yes</text>

  <text x="400" y="330" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">RDB는 파일이 작고 복구가 빠르지만 손실 창이 크고, AOF는 손실 창이 작지만 파일이 크고 복구가 느리다</text>
  <text x="400" y="360" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">fork() 기반 저장(RDB, AOF 재작성) 모두 COW로 인한 순간 메모리 스파이크에 유의해야 한다</text>
</svg>
