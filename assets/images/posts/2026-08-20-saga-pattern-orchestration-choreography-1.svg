<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Saga 패턴 — 오케스트레이션 vs 코레오그래피</text>

  <!-- Divider -->
  <line x1="400" y1="46" x2="400" y2="430" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- LEFT: Orchestration -->
  <text x="200" y="68" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0b5fa5">오케스트레이션 (Orchestration)</text>

  <rect x="130" y="90" width="140" height="42" rx="6" fill="#0b5fa5" stroke="#083f6e" stroke-width="1.5"/>
  <text x="200" y="116" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">Orchestrator</text>

  <rect x="45" y="180" width="105" height="42" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="97" y="205" text-anchor="middle" font-size="11.5" fill="#fff">Order Svc</text>

  <rect x="163" y="180" width="105" height="42" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="215" y="205" text-anchor="middle" font-size="11.5" fill="#fff">Payment Svc</text>

  <rect x="253" y="250" width="105" height="42" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="305" y="275" text-anchor="middle" font-size="11.5" fill="#fff">Inventory Svc</text>

  <!-- Arrows: orchestrator commands down, services reply up -->
  <line x1="170" y1="132" x2="105" y2="178" stroke="#0b5fa5" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <line x1="215" y1="132" x2="215" y2="178" stroke="#0b5fa5" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <line x1="240" y1="120" x2="300" y2="248" stroke="#0b5fa5" stroke-width="1.5" marker-end="url(#arrowL)"/>

  <text x="200" y="325" text-anchor="middle" font-size="11" fill="#555">① 명령 전송 ② 결과 회신</text>
  <text x="200" y="342" text-anchor="middle" font-size="11" fill="#555">③ 다음 단계 결정(중앙 상태 기계)</text>

  <rect x="55" y="365" width="290" height="60" rx="6" fill="#eaf3fc" stroke="#b8d7f2" stroke-width="1"/>
  <text x="200" y="384" text-anchor="middle" font-size="11.5" fill="#0b5fa5" font-weight="bold">특징</text>
  <text x="200" y="401" text-anchor="middle" font-size="10.5" fill="#333">전체 흐름·보상 순서를 한 곳에서 관리</text>
  <text x="200" y="415" text-anchor="middle" font-size="10.5" fill="#333">복잡한 분기에 유리, 오케스트레이터가 병목 우려</text>

  <!-- RIGHT: Choreography -->
  <text x="600" y="68" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1f7a38">코레오그래피 (Choreography)</text>

  <rect x="530" y="90" width="140" height="36" rx="6" fill="#c9821a" stroke="#8f5c10" stroke-width="1.5"/>
  <text x="600" y="113" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">Event Broker</text>

  <rect x="445" y="170" width="100" height="40" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="495" y="194" text-anchor="middle" font-size="11" fill="#fff">Order Svc</text>

  <rect x="555" y="170" width="100" height="40" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="605" y="194" text-anchor="middle" font-size="11" fill="#fff">Payment Svc</text>

  <rect x="620" y="250" width="110" height="40" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="675" y="274" text-anchor="middle" font-size="11" fill="#fff">Inventory Svc</text>

  <!-- pub/sub arrows -->
  <line x1="560" y1="126" x2="510" y2="168" stroke="#c9821a" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="600" y1="126" x2="600" y2="168" stroke="#c9821a" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="630" y1="120" x2="670" y2="248" stroke="#c9821a" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <line x1="605" y1="210" x2="600" y2="126" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowGray)"/>

  <text x="600" y="325" text-anchor="middle" font-size="11" fill="#555">① 이벤트 발행 ② 관련 서비스가 구독·반응</text>
  <text x="600" y="342" text-anchor="middle" font-size="11" fill="#555">③ 중앙 조정자 없이 서비스 간 연쇄 반응</text>

  <rect x="455" y="365" width="290" height="60" rx="6" fill="#eafff0" stroke="#bfe8cc" stroke-width="1"/>
  <text x="600" y="384" text-anchor="middle" font-size="11.5" fill="#1f7a38" font-weight="bold">특징</text>
  <text x="600" y="401" text-anchor="middle" font-size="10.5" fill="#333">서비스 간 직접 결합 없음, 단일 장애점 없음</text>
  <text x="600" y="415" text-anchor="middle" font-size="10.5" fill="#333">전체 흐름은 여러 이벤트 핸들러에 흩어져 추적 어려움</text>

  <defs>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#0b5fa5"/></marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c9821a"/></marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#999"/></marker>
  </defs>
</svg>
