<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .box { fill:#f4f8ff; stroke:#3b6fd6; stroke-width:1.5; }
    .box2 { fill:#fff4ec; stroke:#d97b3f; stroke-width:1.5; }
    .box3 { fill:#f0fbf4; stroke:#2f9e5b; stroke-width:1.5; }
    .boxblock { fill:#fdecec; stroke:#cc4444; stroke-width:1.5; stroke-dasharray:4,3; }
    .lbl { font-size:12.5px; fill:#1a1a1a; }
    .sub { font-size:10.5px; fill:#555; }
    .title { font-size:16px; font-weight:bold; fill:#1a1a1a; }
    .arrow { stroke:#555; stroke-width:1.5; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="20" y="25" class="title">RestTemplate → RestClient 감싸기 전환 구조</text>

  <rect x="40" y="45" width="200" height="50" rx="6" class="box"/>
  <text x="140" y="67" text-anchor="middle" class="lbl">서비스 로직</text>
  <text x="140" y="83" text-anchor="middle" class="sub">외부 API 호출 코드</text>

  <line x1="240" y1="70" x2="300" y2="70" class="arrow"/>

  <rect x="305" y="45" width="190" height="50" rx="6" class="box2"/>
  <text x="400" y="67" text-anchor="middle" class="lbl">RestClient.create(restTemplate)</text>
  <text x="400" y="83" text-anchor="middle" class="sub">새 조립 규칙 덧씌움</text>

  <line x1="400" y1="95" x2="400" y2="135" class="arrow"/>

  <rect x="260" y="140" width="280" height="55" rx="6" class="boxblock"/>
  <text x="400" y="163" text-anchor="middle" class="lbl" fill="#cc4444">URI 인코딩 · 인터셉터 기본값</text>
  <text x="400" y="180" text-anchor="middle" class="sub" fill="#cc4444">여기서 암묵적으로 바뀜 — 공식 보장 없음</text>

  <line x1="400" y1="195" x2="400" y2="235" class="arrow"/>

  <rect x="260" y="240" width="280" height="55" rx="6" class="box3"/>
  <text x="400" y="263" text-anchor="middle" class="lbl">기존 ClientHttpRequestFactory</text>
  <text x="400" y="280" text-anchor="middle" class="sub">커넥션 풀 · 타임아웃 설정은 유지</text>

  <line x1="400" y1="295" x2="400" y2="335" class="arrow"/>

  <rect x="300" y="340" width="200" height="50" rx="6" class="box"/>
  <text x="400" y="362" text-anchor="middle" class="lbl">외부 API 서버</text>
  <text x="400" y="378" text-anchor="middle" class="sub">실제 네트워크 호출</text>

  <text x="400" y="420" text-anchor="middle" class="sub" fill="#555">밑단 설정은 그대로인데, 그 위 조립 규칙이 바뀌어 성능·인코딩이 조용히 달라질 수 있다</text>
</svg>
