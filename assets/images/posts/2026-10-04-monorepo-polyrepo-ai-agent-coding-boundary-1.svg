<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">폴리레포 vs 모노레포 — 에이전트가 보는 범위의 차이</text>

  <text x="200" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">폴리레포 구조</text>

  <rect x="60" y="64" width="120" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="120" y="92" text-anchor="middle" font-size="11" fill="#7f1d1d">프론트엔드 레포</text>

  <rect x="220" y="64" width="120" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="280" y="92" text-anchor="middle" font-size="11" fill="#7f1d1d">백엔드 레포</text>

  <text x="200" y="135" text-anchor="middle" font-size="10" fill="#9ca3af">레포 경계 = 에이전트 시야 경계</text>

  <rect x="60" y="150" width="120" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="120" y="174" text-anchor="middle" font-size="10" fill="#7f1d1d">에이전트 A</text>

  <rect x="220" y="150" width="120" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="280" y="174" text-anchor="middle" font-size="10" fill="#7f1d1d">에이전트 B</text>

  <line x1="120" y1="150" x2="120" y2="114" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="280" y1="150" x2="280" y2="114" stroke="#dc2626" stroke-width="1.5"/>
  <text x="200" y="215" text-anchor="middle" font-size="11" fill="#991b1b" font-weight="bold">API 계약 변경을 서로 모름 — 교차 리팩터링 실패</text>

  <line x1="400" y1="130" x2="400" y2="330" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="600" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">모노레포 / 합성 모노레포</text>

  <rect x="470" y="64" width="260" height="126" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="600" y="90" text-anchor="middle" font-size="11" fill="#064e3b">프론트엔드 패키지</text>
  <text x="600" y="112" text-anchor="middle" font-size="11" fill="#064e3b">백엔드 패키지</text>
  <text x="600" y="134" text-anchor="middle" font-size="11" fill="#064e3b">공유 타입·API 계약</text>
  <text x="600" y="160" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">하나의 에이전트 컨텍스트</text>

  <text x="600" y="215" text-anchor="middle" font-size="11" fill="#065f46" font-weight="bold">의존 관계를 보고 PR 하나로 일관되게 수정</text>

  <rect x="60" y="250" width="680" height="50" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="400" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">팀 소유권·배포 독립성은 레포 분리가 아니라</text>
  <text x="400" y="288" text-anchor="middle" font-size="11" fill="#7c2d12">CODEOWNERS + 빌드 그래프 기반 선택적 배포로 별도 보존</text>

  <rect x="60" y="320" width="680" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="400" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">판단 순서: 교차 PR 비율 측정 → 가장 자주 함께 바뀌는 레포 쌍 식별</text>
  <text x="400" y="358" text-anchor="middle" font-size="11" fill="#312e81">→ 합성 모노레포로 가시성만 먼저 검증 → 필요 시 선택적 이관</text>
</svg>
