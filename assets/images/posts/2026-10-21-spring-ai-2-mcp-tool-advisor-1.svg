<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>

  <defs>
    <marker id="arrows" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Agent client -->
  <rect x="25" y="170" width="150" height="100" rx="8" fill="#eef1fb" stroke="#5b6fd4" stroke-width="1.5"/>
  <text x="100" y="200" font-size="13" text-anchor="middle" fill="#2c3a9e" font-weight="bold">에이전트</text>
  <text x="100" y="220" font-size="11" text-anchor="middle" fill="#555">Claude Code /</text>
  <text x="100" y="236" font-size="11" text-anchor="middle" fill="#555">사내 챗봇</text>
  <text x="100" y="254" font-size="10" text-anchor="middle" fill="#999">표준 MCP 클라이언트</text>

  <!-- ChatClient + Advisor chain -->
  <rect x="215" y="100" width="190" height="240" rx="10" fill="#fdeee8" stroke="#d4714a" stroke-width="2"/>
  <text x="310" y="130" font-size="14" text-anchor="middle" fill="#9e3f2c" font-weight="bold">ChatClient</text>
  <text x="310" y="150" font-size="11" text-anchor="middle" fill="#555">Advisor 체인</text>

  <rect x="235" y="165" width="150" height="50" rx="6" fill="#fff" stroke="#d4714a" stroke-width="1"/>
  <text x="310" y="186" font-size="11" text-anchor="middle" fill="#9e3f2c">ToolCallingAdvisor</text>
  <text x="310" y="202" font-size="10" text-anchor="middle" fill="#999">(1.x ToolCallback 대체)</text>

  <rect x="235" y="225" width="150" height="50" rx="6" fill="#fff" stroke="#d4714a" stroke-width="1"/>
  <text x="310" y="246" font-size="11" text-anchor="middle" fill="#9e3f2c">승인 게이트</text>
  <text x="310" y="262" font-size="10" text-anchor="middle" fill="#999">(쓰기 작업 확인)</text>

  <text x="310" y="305" font-size="10" text-anchor="middle" fill="#999">MCP Java SDK 2.0.0</text>
  <text x="310" y="320" font-size="10" text-anchor="middle" fill="#999">2025-11-25 스펙 준수</text>

  <!-- Existing Spring service layer -->
  <rect x="445" y="100" width="190" height="240" rx="10" fill="#e8f0fe" stroke="#4a6fd4" stroke-width="2"/>
  <text x="540" y="130" font-size="14" text-anchor="middle" fill="#2c4a9e" font-weight="bold">@Service 빈</text>
  <text x="540" y="150" font-size="11" text-anchor="middle" fill="#555">(기존 로직 그대로)</text>

  <rect x="465" y="165" width="150" height="50" rx="6" fill="#fff" stroke="#4a6fd4" stroke-width="1"/>
  <text x="540" y="186" font-size="11" text-anchor="middle" fill="#2c4a9e">@McpTool 메서드</text>
  <text x="540" y="202" font-size="10" text-anchor="middle" fill="#999">checkStock(sku)</text>

  <rect x="465" y="225" width="150" height="50" rx="6" fill="#fff" stroke="#4a6fd4" stroke-width="1"/>
  <text x="540" y="246" font-size="11" text-anchor="middle" fill="#2c4a9e">@PreAuthorize</text>
  <text x="540" y="262" font-size="10" text-anchor="middle" fill="#999">기존 권한 검사 재사용</text>

  <text x="540" y="305" font-size="10" text-anchor="middle" fill="#999">트랜잭션 · 검증 로직</text>
  <text x="540" y="320" font-size="10" text-anchor="middle" fill="#999">단일 소스 유지</text>

  <!-- DB -->
  <rect x="655" y="170" width="130" height="100" rx="8" fill="#eaf7ee" stroke="#4aa26f" stroke-width="1.5"/>
  <text x="720" y="200" font-size="13" text-anchor="middle" fill="#276b43" font-weight="bold">DB</text>
  <text x="720" y="220" font-size="11" text-anchor="middle" fill="#555">재고 · 주문</text>

  <!-- Arrows -->
  <path d="M 175 220 L 210 220" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrows)"/>
  <path d="M 405 220 L 440 220" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrows)"/>
  <path d="M 635 220 L 650 220" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrows)"/>

  <!-- Caption -->
  <text x="400" y="395" font-size="12" text-anchor="middle" fill="#444">별도 Python MCP 서버 없이, 기존 Spring 서비스 레이어가 그대로 MCP 도구가 된다</text>

  <!-- Title -->
  <text x="400" y="40" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">Spring AI 2.0 — @McpTool과 Advisor 체인 구조</text>
</svg>
