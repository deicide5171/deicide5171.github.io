<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">vLLM 처리량의 두 축 — 연속 배칭과 PagedAttention</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arDash" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c9701d"/>
    </marker>
    <pattern id="idleHatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#f3f3f3"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ccc" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- ===== 상단: 정적 배칭 ===== -->
  <text x="40" y="50" font-size="13" font-weight="bold" fill="#a3312b">정적 배칭 (Static Batching)</text>

  <text x="40" y="70" font-size="10.5" fill="#555">요청 A</text>
  <rect x="80" y="59" width="110" height="16" fill="#0b5fa5"/>
  <rect x="190" y="59" width="160" height="16" fill="url(#idleHatch)" stroke="#ccc"/>

  <text x="40" y="93" font-size="10.5" fill="#555">요청 B</text>
  <rect x="80" y="82" width="180" height="16" fill="#0b5fa5"/>
  <rect x="260" y="82" width="90" height="16" fill="url(#idleHatch)" stroke="#ccc"/>

  <text x="40" y="116" font-size="10.5" fill="#555">요청 C</text>
  <rect x="80" y="105" width="270" height="16" fill="#0b5fa5"/>

  <line x1="350" y1="52" x2="350" y2="128" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="358" y="60" font-size="10" fill="#a3312b">배치 경계</text>
  <text x="358" y="72" font-size="10" fill="#a3312b">(가장 긴 요청 대기)</text>

  <text x="192" y="103" text-anchor="middle" font-size="9.5" fill="#999">GPU 유휴</text>

  <!-- ===== 하단: 연속 배칭 ===== -->
  <text x="40" y="160" font-size="13" font-weight="bold" fill="#1f7a38">연속 배칭 (Continuous Batching)</text>

  <text x="40" y="180" font-size="10.5" fill="#555">요청 A</text>
  <rect x="80" y="169" width="110" height="16" fill="#0b5fa5"/>
  <rect x="190" y="169" width="90" height="16" fill="#2fa84f"/>
  <text x="235" y="181" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">요청 D</text>

  <text x="40" y="203" font-size="10.5" fill="#555">요청 B</text>
  <rect x="80" y="192" width="180" height="16" fill="#0b5fa5"/>
  <rect x="260" y="192" width="80" height="16" fill="#2fa84f"/>
  <text x="300" y="204" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">요청 E</text>

  <text x="40" y="226" font-size="10.5" fill="#555">요청 C</text>
  <rect x="80" y="215" width="270" height="16" fill="#0b5fa5"/>
  <rect x="350" y="215" width="50" height="16" fill="#2fa84f"/>
  <text x="375" y="227" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">F</text>

  <text x="220" y="246" text-anchor="middle" font-size="10" fill="#1f7a38">요청이 끝나는 즉시 다음 요청이 그 슬롯을 채운다 — 배치 경계 없음, 유휴 시간 없음</text>

  <!-- divider -->
  <line x1="20" y1="262" x2="780" y2="262" stroke="#e5e5e5" stroke-width="1"/>

  <!-- ===== 하단부: PagedAttention ===== -->
  <text x="40" y="286" font-size="13" font-weight="bold" fill="#4b3480">PagedAttention — KV 캐시를 고정 크기 블록으로 관리</text>

  <text x="60" y="308" font-size="10.5" fill="#555">논리 KV 캐시 (시퀀스 관점, 연속처럼 보임)</text>

  <rect x="60" y="316" width="55" height="42" rx="6" fill="#f3f0fb" stroke="#6a4fa8"/>
  <text x="87" y="341" text-anchor="middle" font-size="11" fill="#4b3480" font-weight="bold">블록0</text>

  <rect x="122" y="316" width="55" height="42" rx="6" fill="#f3f0fb" stroke="#6a4fa8"/>
  <text x="149" y="341" text-anchor="middle" font-size="11" fill="#4b3480" font-weight="bold">블록1</text>

  <rect x="184" y="316" width="55" height="42" rx="6" fill="#f3f0fb" stroke="#6a4fa8"/>
  <text x="211" y="341" text-anchor="middle" font-size="11" fill="#4b3480" font-weight="bold">블록2</text>

  <rect x="246" y="316" width="55" height="42" rx="6" fill="#f3f0fb" stroke="#6a4fa8"/>
  <text x="273" y="341" text-anchor="middle" font-size="11" fill="#4b3480" font-weight="bold">블록3</text>

  <rect x="330" y="322" width="90" height="30" rx="6" fill="#fff4e5" stroke="#c9701d"/>
  <text x="375" y="341" text-anchor="middle" font-size="10.5" fill="#a3550f" font-weight="bold">블록 테이블</text>

  <text x="470" y="308" font-size="10.5" fill="#555">물리 GPU 메모리 (비연속 배치, 다른 요청과 공유)</text>

  <rect x="470" y="316" width="50" height="38" rx="6" fill="#eaf2fb" stroke="#0b5fa5"/>
  <text x="495" y="339" text-anchor="middle" font-size="10" fill="#0b5fa5">P0</text>
  <rect x="530" y="316" width="50" height="38" rx="6" fill="#e8e8e8" stroke="#999"/>
  <text x="555" y="339" text-anchor="middle" font-size="10" fill="#777">P1(타요청)</text>
  <rect x="590" y="316" width="50" height="38" rx="6" fill="#eaf2fb" stroke="#0b5fa5"/>
  <text x="615" y="339" text-anchor="middle" font-size="10" fill="#0b5fa5">P2</text>
  <rect x="650" y="316" width="50" height="38" rx="6" fill="#eaf2fb" stroke="#0b5fa5"/>
  <text x="675" y="339" text-anchor="middle" font-size="10" fill="#0b5fa5">P3</text>
  <rect x="710" y="316" width="50" height="38" rx="6" fill="#eaf2fb" stroke="#0b5fa5"/>
  <text x="735" y="339" text-anchor="middle" font-size="10" fill="#0b5fa5">P4</text>

  <!-- mapping lines: logical -> block table -->
  <line x1="115" y1="337" x2="328" y2="332" stroke="#888" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="177" y1="337" x2="328" y2="335" stroke="#888" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="239" y1="337" x2="328" y2="338" stroke="#888" stroke-width="1" marker-end="url(#ar)"/>
  <line x1="301" y1="337" x2="328" y2="341" stroke="#888" stroke-width="1" marker-end="url(#ar)"/>

  <!-- block table -> scattered physical blocks (non-contiguous mapping) -->
  <path d="M 420 328 C 450 300, 460 300, 490 316" fill="none" stroke="#c9701d" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arDash)"/>
  <path d="M 420 334 C 460 355, 580 370, 610 316" fill="none" stroke="#c9701d" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arDash)"/>
  <path d="M 420 340 C 480 380, 620 390, 670 316" fill="none" stroke="#c9701d" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arDash)"/>
  <path d="M 420 346 C 500 400, 680 410, 730 316" fill="none" stroke="#c9701d" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arDash)"/>

  <text x="400" y="380" text-anchor="middle" font-size="10.5" fill="#4b3480">논리 블록은 이어진 것처럼 보이지만, 물리 메모리에서는 흩어진 블록에 매핑된다</text>
  <rect x="130" y="392" width="540" height="30" rx="6" fill="#f0f7f4" stroke="#03c75a"/>
  <text x="400" y="411" text-anchor="middle" font-size="11" fill="#1f7a38" font-weight="bold">고정 크기 블록 + 블록 테이블 매핑 → 예약 낭비·단편화 최소화, 프리픽스 블록 공유 가능</text>

</svg>
