<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">바운딩 박스 = 도형을 감싸는 최소 사각형</text>

  <!-- Bounding box -->
  <rect x="180" y="110" width="300" height="230" fill="none" stroke="#03c75a" stroke-width="2.5" stroke-dasharray="8 5"/>

  <!-- Irregular polygon (a blob shape) inside -->
  <path d="M250,180 L340,130 L430,170 L450,260 L380,320 L280,310 L210,250 Z"
        fill="#e08e2b" fill-opacity="0.35" stroke="#e08e2b" stroke-width="2"/>
  <text x="330" y="245" font-family="sans-serif" font-size="15" font-weight="bold" fill="#8a5a12" text-anchor="middle">복잡한 도형</text>

  <!-- Corner labels -->
  <circle cx="180" cy="340" r="5" fill="#03c75a"/>
  <text x="120" y="362" font-family="sans-serif" font-size="14" fill="#03c75a">(minX, minY)</text>
  <circle cx="480" cy="110" r="5" fill="#03c75a"/>
  <text x="490" y="106" font-family="sans-serif" font-size="14" fill="#03c75a">(maxX, maxY)</text>

  <text x="330" y="98" font-family="sans-serif" font-size="14" fill="#03c75a" text-anchor="middle">바운딩 박스 [minX, minY, maxX, maxY]</text>

  <!-- Right side: explanation -->
  <rect x="540" y="120" width="230" height="210" rx="10" fill="#fafafa" stroke="#ddd"/>
  <text x="560" y="152" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222">공간 검색 2단계</text>
  <text x="560" y="182" font-family="sans-serif" font-size="13" fill="#333">1단계(빠름):</text>
  <text x="560" y="202" font-family="sans-serif" font-size="13" fill="#777">박스끼리 겹치나?</text>
  <text x="560" y="222" font-family="sans-serif" font-size="13" fill="#777">안 겹치면 즉시 제외</text>
  <text x="560" y="256" font-family="sans-serif" font-size="13" fill="#333">2단계(느림):</text>
  <text x="560" y="276" font-family="sans-serif" font-size="13" fill="#777">남은 후보만</text>
  <text x="560" y="296" font-family="sans-serif" font-size="13" fill="#777">실제 도형 정밀 비교</text>
</svg>
