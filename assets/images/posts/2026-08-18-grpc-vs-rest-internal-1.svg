<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="400" y="24" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">REST vs gRPC 프로토콜 스택 비교</text>

  <!-- Column headers -->
  <text x="210" y="52" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2a5a9a">REST</text>
  <text x="590" y="52" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a5c3a">gRPC</text>

  <!-- REST stack -->
  <g font-family="sans-serif" font-size="13">
    <rect x="60" y="62" width="300" height="46" rx="6" fill="#eef4ff" stroke="#4a7fd6" stroke-width="1.5"/>
    <text x="210" y="82" text-anchor="middle" font-weight="bold" fill="#22315a">애플리케이션</text>
    <text x="210" y="99" text-anchor="middle" fill="#22315a">리소스 기반 API (URL + Method)</text>

    <rect x="60" y="114" width="300" height="46" rx="6" fill="#eef4ff" stroke="#4a7fd6" stroke-width="1.5"/>
    <text x="210" y="134" text-anchor="middle" font-weight="bold" fill="#22315a">직렬화</text>
    <text x="210" y="151" text-anchor="middle" fill="#22315a">JSON (텍스트, 사람이 읽기 쉬움)</text>

    <rect x="60" y="166" width="300" height="46" rx="6" fill="#eef4ff" stroke="#4a7fd6" stroke-width="1.5"/>
    <text x="210" y="186" text-anchor="middle" font-weight="bold" fill="#22315a">전송</text>
    <text x="210" y="203" text-anchor="middle" fill="#22315a">HTTP/1.1 (연결당 순차 요청)</text>

    <rect x="60" y="218" width="300" height="46" rx="6" fill="#eef4ff" stroke="#4a7fd6" stroke-width="1.5"/>
    <text x="210" y="238" text-anchor="middle" font-weight="bold" fill="#22315a">네트워크</text>
    <text x="210" y="255" text-anchor="middle" fill="#22315a">TCP</text>
  </g>

  <!-- gRPC stack -->
  <g font-family="sans-serif" font-size="13">
    <rect x="440" y="62" width="300" height="46" rx="6" fill="#eafaf0" stroke="#2fa86a" stroke-width="1.5"/>
    <text x="590" y="82" text-anchor="middle" font-weight="bold" fill="#1a5c3a">애플리케이션</text>
    <text x="590" y="99" text-anchor="middle" fill="#1a5c3a">RPC 서비스 정의 (.proto)</text>

    <rect x="440" y="114" width="300" height="46" rx="6" fill="#eafaf0" stroke="#2fa86a" stroke-width="1.5"/>
    <text x="590" y="134" text-anchor="middle" font-weight="bold" fill="#1a5c3a">직렬화</text>
    <text x="590" y="151" text-anchor="middle" fill="#1a5c3a">Protobuf (바이너리, 작고 빠름)</text>

    <rect x="440" y="166" width="300" height="46" rx="6" fill="#eafaf0" stroke="#2fa86a" stroke-width="1.5"/>
    <text x="590" y="186" text-anchor="middle" font-weight="bold" fill="#1a5c3a">전송</text>
    <text x="590" y="203" text-anchor="middle" fill="#1a5c3a">HTTP/2 (단일 연결 멀티플렉싱)</text>

    <rect x="440" y="218" width="300" height="46" rx="6" fill="#eafaf0" stroke="#2fa86a" stroke-width="1.5"/>
    <text x="590" y="238" text-anchor="middle" font-weight="bold" fill="#1a5c3a">네트워크</text>
    <text x="590" y="255" text-anchor="middle" fill="#1a5c3a">TCP</text>
  </g>

  <!-- divider -->
  <line x1="400" y1="60" x2="400" y2="264" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="400" y="292" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#666666">같은 연결에서의 요청 처리 방식</text>

  <!-- REST: sequential requests -->
  <g font-family="sans-serif" font-size="12">
    <rect x="60" y="308" width="300" height="110" rx="6" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
    <text x="210" y="326" text-anchor="middle" fill="#555555">연결 1개 → 요청은 순차 처리</text>

    <rect x="80" y="340" width="70" height="26" rx="4" fill="#eef4ff" stroke="#4a7fd6" stroke-width="1.2"/>
    <text x="115" y="358" text-anchor="middle" fill="#22315a">요청 1</text>
    <line x1="150" y1="353" x2="180" y2="353" stroke="#999999" stroke-width="1.2" marker-end="url(#arrowhead)"/>

    <rect x="184" y="340" width="70" height="26" rx="4" fill="#eef4ff" stroke="#4a7fd6" stroke-width="1.2"/>
    <text x="219" y="358" text-anchor="middle" fill="#22315a">요청 2</text>
    <line x1="254" y1="353" x2="284" y2="353" stroke="#999999" stroke-width="1.2" marker-end="url(#arrowhead)"/>

    <rect x="288" y="340" width="60" height="26" rx="4" fill="#eef4ff" stroke="#4a7fd6" stroke-width="1.2"/>
    <text x="318" y="358" text-anchor="middle" fill="#22315a">요청 3</text>

    <text x="210" y="398" text-anchor="middle" fill="#888888" font-size="11.5">응답을 받아야 다음 요청 시작</text>
  </g>

  <!-- gRPC: concurrent streams -->
  <g font-family="sans-serif" font-size="12">
    <rect x="440" y="308" width="300" height="110" rx="6" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
    <text x="590" y="326" text-anchor="middle" fill="#555555">연결 1개 → 스트림 여러 개 동시 처리</text>

    <rect x="460" y="336" width="260" height="18" rx="3" fill="#eafaf0" stroke="#2fa86a" stroke-width="1"/>
    <text x="590" y="349" text-anchor="middle" fill="#1a5c3a" font-size="11">스트림 1</text>

    <rect x="460" y="358" width="260" height="18" rx="3" fill="#eafaf0" stroke="#2fa86a" stroke-width="1"/>
    <text x="590" y="371" text-anchor="middle" fill="#1a5c3a" font-size="11">스트림 2</text>

    <rect x="460" y="380" width="260" height="18" rx="3" fill="#eafaf0" stroke="#2fa86a" stroke-width="1"/>
    <text x="590" y="393" text-anchor="middle" fill="#1a5c3a" font-size="11">스트림 3 (서버 스트리밍 가능)</text>

    <text x="590" y="410" text-anchor="middle" fill="#888888" font-size="11">HTTP/2 프레임으로 인터리빙 전송</text>
  </g>
</svg>
