<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">Mapbox GL JS 인증 및 렌더링 흐름</text>

  <rect x="40" y="90" width="200" height="100" rx="8" fill="#eaf6ff" stroke="#4a90d9" stroke-width="2"/>
  <text x="140" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a4a7a">Mapbox 계정</text>
  <text x="140" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">대시보드에서</text>
  <text x="140" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">액세스 토큰 발급</text>

  <line x1="240" y1="140" x2="310" y2="140" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <rect x="320" y="90" width="200" height="100" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="420" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0a5a30">클라이언트 코드</text>
  <text x="420" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">mapboxgl.accessToken</text>
  <text x="420" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">= 'TOKEN'</text>

  <line x1="520" y1="140" x2="590" y2="140" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <rect x="600" y="90" width="170" height="100" rx="8" fill="#fff3e6" stroke="#e08a2b" stroke-width="2"/>
  <text x="685" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8a4a10">Mapbox 타일 서버</text>
  <text x="685" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">토큰 검증 후</text>
  <text x="685" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">타일·스타일 응답</text>

  <line x1="420" y1="190" x2="420" y2="240" stroke="#888" stroke-width="2" marker-end="url(#a)"/>

  <rect x="150" y="250" width="500" height="140" rx="8" fill="#fbfbfb" stroke="#999" stroke-width="2"/>
  <text x="400" y="280" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222">브라우저에 렌더링된 지도</text>
  <rect x="180" y="300" width="440" height="70" fill="#dff0e8"/>
  <circle cx="400" cy="335" r="5" fill="#e05252"/>
  <text x="400" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">style: mapbox://styles/mapbox/streets-v12</text>

  <text x="400" y="415" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#777">도메인 화이트리스트로 토큰 노출 위험을 제한한다</text>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>
