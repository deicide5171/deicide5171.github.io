<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">사용자 입력이 CQL을 거쳐 SQL에 도달하는 경로</text>

  <!-- user -->
  <rect x="30" y="90" width="140" height="60" rx="8" fill="#eef6ff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="100" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4f7a">사용자 입력</text>
  <text x="100" y="133" text-anchor="middle" font-size="11" fill="#1b4f7a">검색 조건 폼</text>

  <line x1="170" y1="120" x2="230" y2="120" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- frontend -->
  <rect x="230" y="90" width="140" height="60" rx="8" fill="#eef6ff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="300" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4f7a">프런트엔드</text>
  <text x="300" y="133" text-anchor="middle" font-size="11" fill="#1b4f7a">CQL_FILTER 조립</text>

  <line x1="370" y1="120" x2="430" y2="120" stroke="#d9534f" stroke-width="2" marker-end="url(#arrowred)"/>
  <text x="400" y="108" text-anchor="middle" font-size="10" fill="#d9534f">인증 없이 공개</text>

  <!-- geoserver -->
  <rect x="430" y="90" width="160" height="60" rx="8" fill="#fdeceb" stroke="#d9534f" stroke-width="1.5"/>
  <text x="510" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2420">GeoServer WMS/WFS</text>
  <text x="510" y="130" text-anchor="middle" font-size="11" fill="#7a2420">CQL_FILTER 파라미터</text>

  <line x1="590" y1="120" x2="650" y2="120" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- geotools -->
  <rect x="650" y="90" width="120" height="60" rx="8" fill="#fdeceb" stroke="#d9534f" stroke-width="1.5"/>
  <text x="710" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2420">GeoTools</text>
  <text x="710" y="130" text-anchor="middle" font-size="11" fill="#7a2420">CQL→SQL 번역</text>

  <line x1="710" y1="150" x2="710" y2="200" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- vuln box -->
  <rect x="560" y="210" width="220" height="80" rx="8" fill="#fdeceb" stroke="#d9534f" stroke-width="2"/>
  <text x="670" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2420">jsonArrayContains</text>
  <text x="670" y="253" text-anchor="middle" font-size="11" fill="#7a2420">이스케이프 없이 문자열 삽입</text>
  <text x="670" y="270" text-anchor="middle" font-size="11" fill="#7a2420">CVSS 9.8 (2026-08)</text>
  <text x="670" y="285" text-anchor="middle" font-size="10" fill="#7a2420">패치: 3.0.1/2.28.5/2.27.6</text>

  <line x1="560" y1="250" x2="440" y2="250" stroke="#d9534f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowred)"/>

  <!-- postgis -->
  <rect x="260" y="210" width="180" height="80" rx="8" fill="#f1f1f1" stroke="#888" stroke-width="1.5"/>
  <text x="350" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">PostGIS</text>
  <text x="350" y="253" text-anchor="middle" font-size="11" fill="#444">jsonb_path_exists()</text>
  <text x="350" y="270" text-anchor="middle" font-size="11" fill="#444">JSON/JSONB 컬럼</text>

  <!-- safe design -->
  <rect x="100" y="330" width="600" height="90" rx="10" fill="#e6f4ea" stroke="#2f9e44" stroke-width="2"/>
  <text x="400" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d6b30">안전한 대안 — 신뢰 경계를 애플리케이션 서버로 이동</text>
  <text x="400" y="378" text-anchor="middle" font-size="12" fill="#1d6b30">사용자 입력 → 필드·연산자 화이트리스트 검증 → 서버가 CQL 조립</text>
  <text x="400" y="396" text-anchor="middle" font-size="12" fill="#1d6b30">또는 CQL 자체를 노출하지 않는 사전 정의 WFS 파라미터만 허용</text>
  <line x1="400" y1="330" x2="400" y2="291" stroke="#2f9e44" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowgreen)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#999"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d9534f"/>
    </marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2f9e44"/>
    </marker>
  </defs>
</svg>
