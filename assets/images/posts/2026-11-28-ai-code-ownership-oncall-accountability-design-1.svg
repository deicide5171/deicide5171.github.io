<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="195" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">작성자 기준 온콜 (기존)</text>
  <text x="605" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">프로비넌스 기반 온콜 (재설계)</text>
  <line x1="400" y1="15" x2="400" y2="430" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Left: author-based -->
  <rect x="115" y="55" width="160" height="40" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="195" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d50">에이전트가 커밋 작성</text>

  <line x1="195" y1="95" x2="195" y2="130" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="115" y="130" width="160" height="40" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="195" y="150" text-anchor="middle" font-size="11" fill="#1f2d50">사람 A 리뷰 승인</text>
  <text x="195" y="164" text-anchor="middle" font-size="9" fill="#1f2d50">(형식적 검토)</text>

  <line x1="195" y1="170" x2="195" y2="200" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="115" y="200" width="160" height="35" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="195" y="222" text-anchor="middle" font-size="11" fill="#333">배포</text>

  <line x1="195" y1="235" x2="195" y2="265" stroke="#c23b3b" stroke-width="2" marker-end="url(#arrowred)"/>

  <rect x="115" y="265" width="160" height="35" rx="6" fill="#fdecec" stroke="#c23b3b" stroke-width="2"/>
  <text x="195" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a1f1f">장애 발생</text>

  <line x1="195" y1="300" x2="195" y2="330" stroke="#c23b3b" stroke-width="2" marker-end="url(#arrowred)"/>

  <rect x="90" y="330" width="210" height="60" rx="6" fill="#fdecec" stroke="#c23b3b" stroke-width="2.5"/>
  <text x="195" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a1f1f">CODEOWNERS → 사람 A 호출</text>
  <text x="195" y="368" text-anchor="middle" font-size="10" fill="#7a1f1f">A는 코드 의도를 모름</text>
  <text x="195" y="381" text-anchor="middle" font-size="10" fill="#7a1f1f">— 복구 지연 —</text>

  <!-- Right: provenance-based -->
  <rect x="525" y="55" width="160" height="40" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="605" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2d50">에이전트가 커밋 작성</text>
  <text x="605" y="90" text-anchor="middle" font-size="9" fill="#1f2d50">+ 프로비넌스 트레일러</text>

  <line x1="605" y1="95" x2="605" y2="125" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arrowgreen)"/>

  <rect x="525" y="125" width="160" height="40" rx="6" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="605" y="145" text-anchor="middle" font-size="11" fill="#1d6b3d">리뷰 승인 + 기술 리드 태깅</text>

  <line x1="605" y1="165" x2="605" y2="195" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="525" y="195" width="160" height="35" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="605" y="217" text-anchor="middle" font-size="11" fill="#333">배포</text>

  <line x1="605" y1="230" x2="605" y2="260" stroke="#c23b3b" stroke-width="2" marker-end="url(#arrowred)"/>

  <rect x="525" y="260" width="160" height="35" rx="6" fill="#fdecec" stroke="#c23b3b" stroke-width="2"/>
  <text x="605" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a1f1f">장애 발생</text>

  <line x1="605" y1="295" x2="605" y2="325" stroke="#2e9e5b" stroke-width="2" marker-end="url(#arrowgreen)"/>

  <rect x="500" y="325" width="210" height="65" rx="6" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="2.5"/>
  <text x="605" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d6b3d">리뷰 승인자 + 기술 리드 호출</text>
  <text x="605" y="363" text-anchor="middle" font-size="10" fill="#1d6b3d">트레일러로 생성 맥락 즉시 조회</text>
  <text x="605" y="377" text-anchor="middle" font-size="10" fill="#1d6b3d">— 복구 시간 단축 —</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c23b3b"/>
    </marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e9e5b"/>
    </marker>
  </defs>
</svg>
