<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- sources of change -->
  <rect x="40" y="30" width="150" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="115" y="60" text-anchor="middle" font-size="14" fill="#1e1b4b">개발자 변경</text>

  <rect x="220" y="30" width="150" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="295" y="60" text-anchor="middle" font-size="14" fill="#1e1b4b">에이전트 변경</text>

  <line x1="115" y1="80" x2="250" y2="130" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="295" y1="80" x2="280" y2="130" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- PR / review -->
  <rect x="150" y="130" width="260" height="50" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="280" y="160" text-anchor="middle" font-size="14" fill="#1e293b">PR → 코드 리뷰 → 머지</text>

  <line x1="280" y1="180" x2="200" y2="220" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="180" x2="360" y2="220" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- tech debt check -->
  <rect x="80" y="220" width="200" height="70" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="180" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e7490">기술부채 체크</text>
  <text x="180" y="265" text-anchor="middle" font-size="11" fill="#155e75">린트 · 테스트 · 복잡도</text>
  <text x="180" y="280" text-anchor="middle" font-size="11" fill="#155e75">(코드 "동작"만 검증)</text>

  <!-- cognitive debt check -->
  <rect x="300" y="220" width="220" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="410" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">인지 부채 체크포인트</text>
  <text x="410" y="265" text-anchor="middle" font-size="11" fill="#9a3412">아키텍처 적합성 함수</text>
  <text x="410" y="280" text-anchor="middle" font-size="11" fill="#9a3412">설계 의도 기록</text>

  <line x1="180" y1="290" x2="180" y2="330" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="290" x2="410" y2="330" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="330" width="500" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="330" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">프로덕션 시스템</text>
  <text x="330" y="375" text-anchor="middle" font-size="11" fill="#334155">동작은 맞지만, 왜 이렇게 짰는지 팀이 설명할 수 있는가?</text>

  <text x="400" y="420" text-anchor="middle" font-size="13" fill="#475569">기술부채는 코드 왼쪽 경로에서, 인지 부채는 오른쪽 경로에서 갚아야 한다</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>
</svg>
