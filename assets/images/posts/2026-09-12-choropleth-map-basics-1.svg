<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">코로플레스 지도 — 값을 색으로</text>

  <!-- Regions with graded green -->
  <polygon points="120,110 260,100 250,200 130,210" fill="#d9f0e4" stroke="#fff" stroke-width="2"/>
  <text x="190" y="160" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">A: 낮음</text>

  <polygon points="260,100 410,110 400,205 250,200" fill="#7fcfa8" stroke="#fff" stroke-width="2"/>
  <text x="330" y="160" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">B: 중간</text>

  <polygon points="130,210 250,200 260,310 140,320" fill="#33a76f" stroke="#fff" stroke-width="2"/>
  <text x="195" y="265" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">C: 높음</text>

  <polygon points="250,200 400,205 410,315 260,310" fill="#0b7a44" stroke="#fff" stroke-width="2"/>
  <text x="330" y="265" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">D: 매우 높음</text>

  <!-- Legend -->
  <text x="560" y="120" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">범례 (값 → 색)</text>
  <rect x="500" y="140" width="40" height="26" fill="#d9f0e4" stroke="#ccc"/>
  <text x="552" y="159" font-family="sans-serif" font-size="14" fill="#555">낮음</text>
  <rect x="500" y="176" width="40" height="26" fill="#7fcfa8" stroke="#ccc"/>
  <text x="552" y="195" font-family="sans-serif" font-size="14" fill="#555">중간</text>
  <rect x="500" y="212" width="40" height="26" fill="#33a76f" stroke="#ccc"/>
  <text x="552" y="231" font-family="sans-serif" font-size="14" fill="#555">높음</text>
  <rect x="500" y="248" width="40" height="26" fill="#0b7a44" stroke="#ccc"/>
  <text x="552" y="267" font-family="sans-serif" font-size="14" fill="#555">매우 높음</text>

  <text x="400" y="380" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">값이 클수록 색을 진하게 → 지역별 차이가 한눈에</text>
  <text x="400" y="408" font-family="sans-serif" font-size="14" fill="#777" text-anchor="middle">절대값보다 비율(밀도·1인당)을 쓰면 오해가 줄어든다</text>
</svg>
