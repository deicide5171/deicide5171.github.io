<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">proj4js 좌표계 변환 흐름 — EPSG 코드 사이를 오가는 통역기</text>

  <!-- Left: source data box -->
  <rect x="30" y="80" width="190" height="130" rx="8" fill="#eef4fb" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="125" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b5fa5">입력 데이터</text>
  <rect x="45" y="116" width="160" height="38" rx="5" fill="#0b5fa5"/>
  <text x="125" y="135" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">EPSG:4326</text>
  <text x="125" y="147" text-anchor="middle" font-size="10" fill="#dbeafe">GPS / GeoJSON (경도,위도)</text>
  <rect x="45" y="160" width="160" height="38" rx="5" fill="#1877c9"/>
  <text x="125" y="179" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">EPSG:5186</text>
  <text x="125" y="191" text-anchor="middle" font-size="10" fill="#dbeafe">국내 공공데이터 (중부원점)</text>

  <!-- Arrows into proj4js -->
  <line x1="220" y1="135" x2="300" y2="180" stroke="#999" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="220" y1="179" x2="300" y2="200" stroke="#999" stroke-width="1.6" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#999"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1f7a38"/>
    </marker>
  </defs>

  <!-- Center: proj4js engine -->
  <rect x="300" y="120" width="200" height="150" rx="10" fill="#fff7ec" stroke="#c9791f" stroke-width="2"/>
  <text x="400" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a4b00">proj4js</text>
  <text x="400" y="163" text-anchor="middle" font-size="10.5" fill="#8a4b00">① proj4.defs(code, params)</text>
  <text x="400" y="180" text-anchor="middle" font-size="10.5" fill="#8a4b00">정의 등록 (epsg.io 참고)</text>
  <line x1="325" y1="192" x2="475" y2="192" stroke="#e0b070" stroke-width="1"/>
  <text x="400" y="210" text-anchor="middle" font-size="10.5" fill="#8a4b00">② proj4(from, to).forward([x,y])</text>
  <text x="400" y="227" text-anchor="middle" font-size="10.5" fill="#8a4b00">또는 .inverse([x,y])</text>
  <text x="400" y="252" text-anchor="middle" font-size="10" fill="#a56a00">항상 [x=경도/Easting, y=위도/Northing] 순서</text>

  <!-- Arrows out of proj4js -->
  <line x1="500" y1="160" x2="580" y2="130" stroke="#1f7a38" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <line x1="500" y1="200" x2="580" y2="230" stroke="#1f7a38" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <line x1="500" y1="230" x2="580" y2="300" stroke="#1f7a38" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

  <!-- Right: output/display box -->
  <rect x="580" y="80" width="190" height="270" rx="8" fill="#eef9f1" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="675" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f7a38">출력 / 지도 표시</text>

  <rect x="595" y="116" width="160" height="40" rx="5" fill="#2fa84f"/>
  <text x="675" y="136" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">EPSG:3857</text>
  <text x="675" y="149" text-anchor="middle" font-size="9.5" fill="#eafff0">Web Mercator (타일 좌표계)</text>

  <rect x="595" y="200" width="160" height="40" rx="5" fill="#2fa84f"/>
  <text x="675" y="220" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">EPSG:4326</text>
  <text x="675" y="233" text-anchor="middle" font-size="9.5" fill="#eafff0">지도 라이브러리 API 입력값</text>

  <rect x="595" y="284" width="160" height="52" rx="5" fill="#2fa84f"/>
  <text x="675" y="304" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">OpenLayers /</text>
  <text x="675" y="319" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Mapbox GL / Leaflet</text>
  <text x="675" y="332" text-anchor="middle" font-size="9.5" fill="#eafff0">화면에 최종 렌더링</text>

  <line x1="675" y1="156" x2="675" y2="200" stroke="#1f7a38" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="675" y1="240" x2="675" y2="284" stroke="#1f7a38" stroke-width="1.4" stroke-dasharray="4,3"/>

  <text x="400" y="395" text-anchor="middle" font-size="12" fill="#555">정의(defs)는 한 번만 등록하면 되고, 실제 변환은 forward/inverse 호출마다 반복해서 일어난다</text>
  <text x="400" y="418" text-anchor="middle" font-size="11.5" fill="#a33" font-weight="bold">EPSG:5186·5179처럼 proj4js에 내장되지 않은 좌표계는 defs 등록을 빠뜨리면 변환이 조용히 틀어진다</text>
</svg>
