<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- app traffic -->
  <rect x="40" y="30" width="180" height="56" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="130" y="54" text-anchor="middle" font-size="13" fill="#1b3a73">서비스 트래픽</text>
  <text x="130" y="72" text-anchor="middle" font-size="11" fill="#1b3a73">주문·결제·사용자 행동</text>

  <line x1="220" y1="58" x2="280" y2="58" stroke="#555" stroke-width="2" marker-end="url(#arrowO)"/>

  <!-- OLTP -->
  <rect x="282" y="30" width="180" height="56" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="372" y="54" text-anchor="middle" font-size="13" fill="#15502f">Postgres (OLTP)</text>
  <text x="372" y="72" text-anchor="middle" font-size="11" fill="#15502f">행 지향, 트랜잭션 전용</text>

  <line x1="372" y1="86" x2="372" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrowO)"/>
  <text x="430" y="118" font-size="11" fill="#999999">CDC / 배치 동기화</text>

  <!-- split -->
  <rect x="180" y="142" width="200" height="60" rx="8" fill="#fff7f0" stroke="#e08a2e" stroke-width="2"/>
  <text x="280" y="166" text-anchor="middle" font-size="13" fill="#7a4310">DuckDB (임베디드)</text>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#7a4310">배치 리포트·노트북·서버리스</text>

  <rect x="420" y="142" width="200" height="60" rx="8" fill="#fdf0f0" stroke="#d6555a" stroke-width="2"/>
  <text x="520" y="166" text-anchor="middle" font-size="13" fill="#7a2a2d">ClickHouse (서빙 클러스터)</text>
  <text x="520" y="184" text-anchor="middle" font-size="11" fill="#7a2a2d">다수 동시 사용자·고동시성</text>

  <line x1="372" y1="140" x2="280" y2="140" stroke="#555" stroke-width="2"/>
  <line x1="372" y1="140" x2="520" y2="140" stroke="#555" stroke-width="2"/>

  <line x1="280" y1="202" x2="280" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrowO)"/>
  <line x1="520" y1="202" x2="520" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrowO)"/>

  <!-- dashboards -->
  <rect x="140" y="242" width="280" height="56" rx="8" fill="#f3f0ff" stroke="#6c4fd6" stroke-width="2"/>
  <text x="280" y="266" text-anchor="middle" font-size="13" fill="#3a2a73">내부 리포트 / 분석 스크립트</text>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#3a2a73">지연 수 분~수 시간 허용</text>

  <rect x="400" y="242" width="280" height="56" rx="8" fill="#f3f0ff" stroke="#6c4fd6" stroke-width="2"/>
  <text x="540" y="266" text-anchor="middle" font-size="13" fill="#3a2a73">실시간 공개 대시보드</text>
  <text x="540" y="284" text-anchor="middle" font-size="11" fill="#3a2a73">서브초 응답, 다수 동시 조회</text>

  <rect x="150" y="360" width="500" height="50" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="2"/>
  <text x="400" y="390" text-anchor="middle" font-size="13" fill="#333333">대시보드는 서비스 DB(OLTP)를 직접 조회하지 않는다</text>

  <line x1="280" y1="298" x2="330" y2="358" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="540" y1="298" x2="470" y2="358" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
