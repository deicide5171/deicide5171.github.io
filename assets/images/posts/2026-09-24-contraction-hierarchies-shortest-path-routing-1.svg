<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Contraction Hierarchies — 축약과 숏컷으로 탐색 공간 줄이기</text>

  <!-- Left: original graph -->
  <text x="185" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">1) 원본 도로망 그래프</text>
  <rect x="40" y="70" width="290" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>

  <circle cx="75" cy="110" r="9" fill="#60a5fa"/>
  <circle cx="150" cy="90" r="9" fill="#60a5fa"/>
  <circle cx="230" cy="105" r="9" fill="#60a5fa"/>
  <circle cx="295" cy="90" r="9" fill="#60a5fa"/>
  <circle cx="95" cy="180" r="9" fill="#60a5fa"/>
  <circle cx="170" cy="200" r="9" fill="#f59e0b"/>
  <circle cx="250" cy="190" r="9" fill="#60a5fa"/>
  <circle cx="300" cy="160" r="9" fill="#60a5fa"/>

  <g stroke="#94a3b8" stroke-width="2">
    <line x1="75" y1="110" x2="150" y2="90"/>
    <line x1="150" y1="90" x2="230" y2="105"/>
    <line x1="230" y1="105" x2="295" y2="90"/>
    <line x1="75" y1="110" x2="95" y2="180"/>
    <line x1="95" y1="180" x2="170" y2="200"/>
    <line x1="170" y1="200" x2="250" y2="190"/>
    <line x1="250" y1="190" x2="300" y2="160"/>
    <line x1="230" y1="105" x2="250" y2="190"/>
    <line x1="150" y1="90" x2="170" y2="200"/>
  </g>
  <text x="170" y="222" text-anchor="middle" font-size="10.5" fill="#a86b1f">낮은 차수 교차로(주황)</text>

  <!-- Right: contracted graph -->
  <text x="605" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">2) 축약 후 — 숏컷 엣지 추가</text>
  <rect x="460" y="70" width="300" height="170" rx="8" fill="#f0fdf4" stroke="#86efac"/>

  <circle cx="495" cy="110" r="9" fill="#10b981"/>
  <circle cx="570" cy="90" r="9" fill="#10b981"/>
  <circle cx="650" cy="105" r="9" fill="#10b981"/>
  <circle cx="715" cy="90" r="9" fill="#10b981"/>
  <circle cx="515" cy="180" r="9" fill="#10b981"/>
  <circle cx="670" cy="190" r="9" fill="#10b981"/>
  <circle cx="720" cy="160" r="9" fill="#10b981"/>

  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3">
    <line x1="495" y1="110" x2="570" y2="90"/>
    <line x1="570" y1="90" x2="650" y2="105"/>
    <line x1="650" y1="105" x2="715" y2="90"/>
    <line x1="495" y1="110" x2="515" y2="180"/>
    <line x1="670" y1="190" x2="720" y2="160"/>
    <line x1="650" y1="105" x2="670" y2="190"/>
  </g>
  <!-- shortcut edge replacing removed node -->
  <path d="M515,180 Q595,225 670,190" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="592" y="235" text-anchor="middle" font-size="10.5" fill="#065f46">숏컷: 제거된 노드를 건너뛰는 새 엣지</text>

  <text x="605" y="255" text-anchor="middle" font-size="10.5" fill="#3d8b6a">노드 제거 순서 = 중요도 낮은 순</text>

  <!-- arrow between panels -->
  <defs>
    <marker id="arrH" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <path d="M335,150 L455,150" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrH)"/>
  <text x="395" y="140" text-anchor="middle" font-size="10.5" fill="#475569">전처리(축약)</text>

  <!-- bottom: bidirectional search comparison -->
  <rect x="40" y="270" width="720" height="150" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="400" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">3) 질의 시 — 상위 계층 노드에서만 만나는 양방향 탐색</text>

  <text x="90" y="325" font-size="12" fill="#334155">Dijkstra 전체 그래프 탐색</text>
  <rect x="90" y="335" width="600" height="14" rx="7" fill="#fecaca"/>
  <text x="700" y="346" font-size="11" fill="#991b1b">탐색 범위 넓음</text>

  <text x="90" y="375" font-size="12" fill="#334155">CH 양방향 탐색 (상위 계층으로만 상승)</text>
  <rect x="90" y="385" width="130" height="14" rx="7" fill="#bbf7d0"/>
  <rect x="560" y="385" width="130" height="14" rx="7" fill="#bbf7d0"/>
  <circle cx="400" cy="392" r="6" fill="#059669"/>
  <text x="400" y="412" text-anchor="middle" font-size="10.5" fill="#065f46">최상위 노드에서 두 탐색이 만남 → 탐색 범위 대폭 축소</text>
</svg>
