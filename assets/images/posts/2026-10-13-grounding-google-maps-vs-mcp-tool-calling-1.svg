<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrowC" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">지도 데이터 연결 지점 비교 — Grounding vs MCP 툴콜</text>

  <text x="195" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">① Grounding with Google Maps</text>

  <rect x="40" y="66" width="150" height="50" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="115" y="88" text-anchor="middle" font-size="9" font-weight="bold" fill="#312e81">앱: 질의 + 좌표</text>
  <text x="115" y="102" text-anchor="middle" font-size="8" fill="#3730a3">(tools: googleMaps)</text>

  <line x1="190" y1="91" x2="240" y2="91" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <rect x="240" y="60" width="190" height="104" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="335" y="80" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">Gemini 모델 추론 내부</text>
  <text x="335" y="96" text-anchor="middle" font-size="8" fill="#065f46">(블랙박스)</text>
  <text x="335" y="112" text-anchor="middle" font-size="8" fill="#065f46">· 장소DB 2.5억+ 자동 조회</text>
  <text x="335" y="126" text-anchor="middle" font-size="8" fill="#065f46">· 랭킹·신뢰도 판단</text>
  <text x="335" y="140" text-anchor="middle" font-size="8" fill="#065f46">· 에이전트는 호출 과정을</text>
  <text x="335" y="152" text-anchor="middle" font-size="8" fill="#065f46">  볼 수 없음</text>

  <line x1="335" y1="164" x2="335" y2="195" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <rect x="240" y="195" width="190" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="335" y="214" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#7c2d12">그라운딩된 텍스트</text>
  <text x="335" y="228" text-anchor="middle" font-size="8" fill="#9a3412">+ context_token(지도 위젯)</text>

  <line x1="400" y1="230" x2="400" y2="420" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4,4"/>

  <text x="600" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#9333ea">② MCP 툴콜 (ArcGIS MCP / 자체 PostGIS)</text>

  <rect x="455" y="66" width="150" height="50" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.8"/>
  <text x="530" y="88" text-anchor="middle" font-size="9" font-weight="bold" fill="#581c87">에이전트 루프</text>
  <text x="530" y="102" text-anchor="middle" font-size="8" fill="#6b21a8">(도구 호출 결정)</text>

  <line x1="605" y1="91" x2="650" y2="91" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <rect x="650" y="66" width="130" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="715" y="88" text-anchor="middle" font-size="9" font-weight="bold" fill="#7f1d1d">MCP 서버</text>
  <text x="715" y="102" text-anchor="middle" font-size="8" fill="#991b1b">지오코딩/공간질의</text>

  <line x1="715" y1="116" x2="715" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <rect x="620" y="150" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="700" y="170" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#14532d">자체/서드파티 DB</text>
  <text x="700" y="184" text-anchor="middle" font-size="8" fill="#166534">사내 매장·재고 데이터</text>
  <text x="700" y="198" text-anchor="middle" font-size="8" fill="#166534">결합 가능</text>

  <line x1="650" y1="180" x2="605" y2="180" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowC)"/>
  <line x1="605" y1="180" x2="530" y2="150" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowC)" stroke-dasharray="4,3"/>
  <text x="560" y="140" text-anchor="middle" font-size="7.5" fill="#4b5563">결과를 프롬프트에 되먹임</text>

  <rect x="455" y="195" width="280" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="595" y="214" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#7c2d12">모델이 호출 결과를 반영해</text>
  <text x="595" y="228" text-anchor="middle" font-size="8" fill="#9a3412">최종 응답 생성 (전 과정 로그 가능)</text>

  <text x="400" y="420" text-anchor="middle" font-size="9" fill="#4b5563">공통점: 둘 다 "지도 데이터를 LLM에 묶는다"가 목표 — 차이는 제어권이 모델 내부냐 애플리케이션이냐</text>
</svg>
