<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">브라우저 안에서 끝나는 공간 분석</text>

  <!-- Browser box -->
  <rect x="40" y="60" width="720" height="200" rx="10" fill="#f6f9fc" stroke="#3b6fd6" stroke-width="2"/>
  <text x="70" y="88" font-size="14" font-weight="bold" fill="#22345a">브라우저</text>

  <!-- Map with points -->
  <rect x="70" y="100" width="280" height="140" rx="6" fill="#ffffff" stroke="#c8d6e5" stroke-width="1.5"/>
  <text x="210" y="118" text-anchor="middle" font-size="12" fill="#555">이미 로드된 매장 GeoJSON</text>
  <circle cx="150" cy="160" r="5" fill="#2f9e58"/>
  <circle cx="200" cy="190" r="5" fill="#2f9e58"/>
  <circle cx="250" cy="150" r="5" fill="#2f9e58"/>
  <circle cx="300" cy="200" r="5" fill="#d64550"/>
  <circle cx="120" cy="210" r="5" fill="#d64550"/>
  <circle cx="230" cy="220" r="60" fill="#3b6fd6" opacity="0.15" stroke="#3b6fd6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="210" y="235" text-anchor="middle" font-size="11" fill="#22345a">1km 반경 원</text>

  <!-- Arrow to turf box -->
  <line x1="360" y1="170" x2="430" y2="170" stroke="#555" stroke-width="3" marker-end="url(#arrow3)"/>

  <!-- Turf.js processing box -->
  <rect x="440" y="110" width="290" height="120" rx="8" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="585" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#22345a">Turf.js</text>
  <text x="585" y="165" text-anchor="middle" font-size="12" fill="#22345a">booleanPointInPolygon</text>
  <text x="585" y="185" text-anchor="middle" font-size="12" fill="#22345a">buffer / distance / convex</text>
  <text x="585" y="208" text-anchor="middle" font-size="11" fill="#555">서버 왕복 없이 즉시 계산</text>

  <text x="400" y="290" text-anchor="middle" font-size="13" fill="#333">초록 점 = 반경 안, 빨강 점 = 반경 밖 (즉시 필터링 결과)</text>

  <!-- Bottom: server comparison -->
  <rect x="40" y="320" width="720" height="90" rx="10" fill="#fff4e8" stroke="#d98a2b" stroke-width="2"/>
  <text x="70" y="345" font-size="14" font-weight="bold" fill="#7a4a10">서버(PostGIS)가 필요한 경우</text>
  <text x="70" y="368" font-size="12" fill="#7a4a10">대용량 공간 조인, 극지방 근처 정밀 계산, 법적으로 중요한 최종 결과</text>
  <text x="70" y="390" font-size="12" fill="#7a4a10">→ 이런 경우엔 클라이언트 근사 계산 대신 서버에서 재검증</text>

  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
