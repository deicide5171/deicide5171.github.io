<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">서빙 경로 vs 분석 경로 — 서버가 꼭 필요한가</text>

  <!-- Left: serving path -->
  <rect x="30" y="55" width="340" height="360" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="200" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e1b4b">서빙 경로 — 앱 기능</text>

  <rect x="55" y="100" width="290" height="55" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="200" y="122" text-anchor="middle" font-size="12" fill="#312e81">운영 테이블 (로컬 임포트)</text>
  <text x="200" y="140" text-anchor="middle" font-size="11" fill="#4338ca">geom geometry(Point,4326)</text>

  <line x1="200" y1="155" x2="200" y2="185" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="55" y="185" width="290" height="70" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="200" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#312e81">PostGIS — 상시 가동 서버</text>
  <text x="200" y="226" text-anchor="middle" font-size="11" fill="#4338ca">GiST 영속 인덱스</text>
  <text x="200" y="242" text-anchor="middle" font-size="11" fill="#4338ca">동시 쓰기 트랜잭션</text>

  <line x1="200" y1="255" x2="200" y2="285" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="55" y="285" width="290" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#064e3b">초당 수백 건 반경 검색 응답</text>
  <text x="200" y="326" text-anchor="middle" font-size="11" fill="#065f46">다음 요청을 또 받을 준비</text>

  <text x="200" y="385" text-anchor="middle" font-size="12" fill="#4338ca">적합: 반복·동시·저지연 질의</text>

  <!-- Right: analysis path -->
  <rect x="430" y="55" width="340" height="360" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">분석 경로 — 1회성 작업</text>

  <rect x="455" y="100" width="290" height="55" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="600" y="122" text-anchor="middle" font-size="12" fill="#7c2d12">S3의 GeoParquet·COG 원본</text>
  <text x="600" y="140" text-anchor="middle" font-size="11" fill="#9a3412">ETL·임포트 없이 그대로</text>

  <line x1="600" y1="155" x2="600" y2="185" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="455" y="185" width="290" height="70" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="600" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">DuckDB 프로세스 (임베디드)</text>
  <text x="600" y="226" text-anchor="middle" font-size="11" fill="#9a3412">read_parquet() 원격 직접 쿼리</text>
  <text x="600" y="242" text-anchor="middle" font-size="11" fill="#9a3412">서버 설치·가동 불필요</text>

  <line x1="600" y1="255" x2="600" y2="285" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="455" y="285" width="290" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">결과만 저장, 프로세스는 종료</text>
  <text x="600" y="326" text-anchor="middle" font-size="11" fill="#991b1b">인덱스·서버 상주 없음</text>

  <text x="600" y="385" text-anchor="middle" font-size="12" fill="#b91c1c">적합: 읽기 위주 배치·리포트</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
  </defs>
</svg>
