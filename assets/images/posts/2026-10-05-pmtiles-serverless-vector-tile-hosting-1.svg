<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">PMTiles 서버리스 서빙 vs 전통 타일 서버</text>

  <text x="195" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">PMTiles 파이프라인 (정적 레이어)</text>

  <rect x="40" y="64" width="110" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="95" y="91" text-anchor="middle" font-size="10" fill="#064e3b">원본 데이터</text>

  <rect x="165" y="64" width="110" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="220" y="84" text-anchor="middle" font-size="10" fill="#064e3b">tippecanoe</text>
  <text x="220" y="98" text-anchor="middle" font-size="9" fill="#065f46">.pmtiles 생성</text>

  <rect x="40" y="130" width="235" height="46" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="157" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">S3 / R2 오브젝트 스토리지</text>
  <text x="157" y="165" text-anchor="middle" font-size="9" fill="#065f46">+ CDN (서버 프로세스 없음)</text>

  <line x1="157" y1="176" x2="157" y2="198" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="40" y="198" width="235" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="157" y="218" text-anchor="middle" font-size="10" fill="#064e3b">pmtiles.js</text>
  <text x="157" y="233" text-anchor="middle" font-size="9" fill="#065f46">HTTP Range Request로 타일만 요청</text>

  <line x1="157" y1="110" x2="157" y2="130" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <text x="605" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">동적 레이어 (사용자별 필터링)</text>

  <rect x="500" y="64" width="210" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="605" y="84" text-anchor="middle" font-size="10" fill="#7f1d1d">사용자 요청 (권한·필터 포함)</text>
  <text x="605" y="98" text-anchor="middle" font-size="9" fill="#991b1b">요청마다 결과가 다름</text>

  <line x1="605" y1="110" x2="605" y2="130" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="500" y="130" width="210" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="605" y="150" text-anchor="middle" font-size="10" fill="#7f1d1d">경량 API 서버</text>
  <text x="605" y="165" text-anchor="middle" font-size="9" fill="#991b1b">Martin / GeoJSON 응답</text>

  <line x1="605" y1="176" x2="605" y2="198" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow3)"/>

  <rect x="500" y="198" width="210" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="605" y="226" text-anchor="middle" font-size="10" fill="#7f1d1d">동적 오버레이 레이어</text>

  <line x1="400" y1="60" x2="400" y2="260" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>

  <line x1="157" y1="244" x2="400" y2="285" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="605" y1="244" x2="400" y2="285" stroke="#9ca3af" stroke-width="1.2"/>

  <rect x="230" y="285" width="340" height="56" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="400" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">MapLibre GL JS</text>
  <text x="400" y="326" text-anchor="middle" font-size="10" fill="#3730a3">정적 베이스맵 + 동적 오버레이를 한 지도에 합성</text>

  <rect x="60" y="370" width="680" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="400" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">판단 기준: 모두에게 동일하고 갱신 주기가 느리면 PMTiles</text>
  <text x="400" y="410" text-anchor="middle" font-size="11" fill="#7c2d12">사용자마다 결과가 다르면 별도 API로 분리해 겹쳐 그리기</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
