<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e65100"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="36" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">@Cacheable + Redis 요청 처리 흐름</text>

  <!-- 클라이언트 -->
  <rect x="30" y="170" width="120" height="70" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="90" y="210" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">클라이언트</text>

  <!-- AOP 프록시 -->
  <rect x="210" y="160" width="160" height="90" rx="8" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
  <text x="290" y="198" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">AOP 프록시</text>
  <text x="290" y="222" font-family="sans-serif" font-size="15" fill="#4a6fa5" text-anchor="middle">@Cacheable</text>

  <!-- Redis -->
  <rect x="440" y="160" width="150" height="90" rx="8" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="515" y="198" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">Redis 캐시</text>
  <text x="515" y="222" font-family="sans-serif" font-size="15" fill="#c0392b" text-anchor="middle">키 조회 (GET)</text>

  <!-- HIT 반환 박스 -->
  <rect x="620" y="70" width="150" height="60" rx="8" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="695" y="96" font-family="sans-serif" font-size="15" fill="#2e7d32" text-anchor="middle">HIT: 역직렬화 후</text>
  <text x="695" y="118" font-family="sans-serif" font-size="15" fill="#2e7d32" text-anchor="middle">즉시 반환</text>

  <!-- sync 락 박스 -->
  <rect x="400" y="320" width="200" height="80" rx="8" fill="#fff6ea" stroke="#e65100" stroke-width="2"/>
  <text x="500" y="352" font-family="sans-serif" font-size="15" fill="#e65100" text-anchor="middle">MISS: sync=true 락</text>
  <text x="500" y="376" font-family="sans-serif" font-size="14" fill="#7a4a12" text-anchor="middle">스레드 1개만 원본 조회</text>

  <!-- DB 박스 -->
  <rect x="660" y="320" width="110" height="80" rx="8" fill="#f0f0f0" stroke="#666666" stroke-width="2"/>
  <text x="715" y="352" font-family="sans-serif" font-size="16" fill="#222222" text-anchor="middle">원본 DB</text>
  <text x="715" y="376" font-family="sans-serif" font-size="14" fill="#666666" text-anchor="middle">느린 조회</text>

  <!-- 화살표: 클라이언트 -> 프록시 -->
  <line x1="150" y1="205" x2="202" y2="205" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 화살표: 프록시 -> Redis -->
  <line x1="370" y1="205" x2="432" y2="205" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- HIT 화살표: Redis -> HIT 박스 -->
  <line x1="560" y1="160" x2="640" y2="120" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- MISS 화살표: Redis -> 락 박스 -->
  <line x1="510" y1="250" x2="502" y2="312" stroke="#e65100" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- 락 -> DB -->
  <line x1="600" y1="360" x2="652" y2="360" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DB -> Redis 저장 (곡선) -->
  <path d="M 715 320 C 715 260 620 250 590 240" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="700" y="272" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">TTL + 지터로 저장</text>

  <!-- 하단 설명 -->
  <text x="60" y="330" font-family="sans-serif" font-size="14" fill="#666666">· 직렬화: GenericJackson2JsonRedisSerializer 권장</text>
  <text x="60" y="358" font-family="sans-serif" font-size="14" fill="#666666">· TTL: 캐시 이름별로 다르게 + 무작위 지터</text>
  <text x="60" y="386" font-family="sans-serif" font-size="14" fill="#666666">· sync=true 락은 JVM 로컬 — 인스턴스 수만큼 통과</text>
</svg>
