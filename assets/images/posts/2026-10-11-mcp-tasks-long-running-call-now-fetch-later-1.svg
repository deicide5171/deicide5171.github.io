<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">MCP Tasks — 지금 부르고(call-now) 나중에 받기(fetch-later)</text>

  <rect x="30" y="60" width="160" height="60" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="110" y="84" text-anchor="middle" font-size="10" font-weight="bold" fill="#312e81">MCP 클라이언트</text>
  <text x="110" y="100" text-anchor="middle" font-size="8" fill="#3730a3">(에이전트 런타임)</text>

  <line x1="190" y1="80" x2="300" y2="80" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <text x="245" y="72" text-anchor="middle" font-size="7.5" fill="#374151">tools/call</text>

  <rect x="300" y="60" width="200" height="60" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="400" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">MCP 서버</text>
  <text x="400" y="96" text-anchor="middle" font-size="8" fill="#065f46">task 핸들 즉시 반환</text>

  <line x1="500" y1="80" x2="190" y2="80" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowB)" transform="translate(0,30)"/>
  <text x="345" y="128" text-anchor="middle" font-size="7.5" fill="#065f46">{ taskId, status: "working", ttl }</text>

  <line x1="400" y1="120" x2="400" y2="170" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <rect x="270" y="170" width="260" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="400" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">백그라운드 워커</text>
  <text x="400" y="210" text-anchor="middle" font-size="8" fill="#991b1b">분석·인코딩 등 장시간 작업 수행</text>
  <text x="400" y="222" text-anchor="middle" font-size="7.5" fill="#991b1b">클라이언트 연결과 무관하게 계속 진행</text>

  <rect x="60" y="260" width="300" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="210" y="282" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#78350f">tasks/get (폴링)</text>
  <text x="210" y="298" text-anchor="middle" font-size="7.5" fill="#92400e">taskId로 상태 재조회</text>
  <text x="210" y="312" text-anchor="middle" font-size="7.5" fill="#92400e">연결이 끊겨도 같은 id로 재개 가능</text>

  <rect x="440" y="260" width="300" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="590" y="282" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#78350f">tasks/result</text>
  <text x="590" y="298" text-anchor="middle" font-size="7.5" fill="#92400e">status: completed 시 결과 조회</text>
  <text x="590" y="312" text-anchor="middle" font-size="7.5" fill="#92400e">TTL 만료 전까지만 유효</text>

  <line x1="110" y1="120" x2="210" y2="260" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowA)"/>
  <line x1="110" y1="120" x2="590" y2="260" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowA)"/>

  <rect x="150" y="360" width="500" height="68" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="400" y="382" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7c2d12">핵심: 작업의 생존 주기가 클라이언트 연결 주기에서 분리된다</text>
  <text x="400" y="400" text-anchor="middle" font-size="8" fill="#7c2d12">세션이 끊겨도 taskId만 있으면 TTL 내에서 언제든 재접속해 상태 확인·결과 회수 가능</text>
  <text x="400" y="414" text-anchor="middle" font-size="7.5" fill="#9a3412">(아직 코어 스펙이 아닌 실험적 확장 — 클라이언트 지원 여부 사전 확인 필요)</text>

  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>
</svg>
