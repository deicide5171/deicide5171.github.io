<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">기능 범위 vs 학습 곡선</text>

  <!-- axes -->
  <line x1="90" y1="380" x2="740" y2="380" stroke="#888" stroke-width="1.5"/>
  <line x1="90" y1="380" x2="90" y2="70" stroke="#888" stroke-width="1.5"/>
  <text x="415" y="415" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">기능 범위 (많음 →)</text>
  <text x="55" y="225" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555" transform="rotate(-90 55 225)">학습 곡선 (가파름 ↑)</text>

  <!-- Leaflet bubble: low complexity, low-mid features -->
  <circle cx="230" cy="300" r="55" fill="#eaf6ff" stroke="#4a90d9" stroke-width="2" opacity="0.9"/>
  <text x="230" y="295" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a4a7a">Leaflet</text>
  <text x="230" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a4a7a">가볍고 간단</text>

  <!-- OpenLayers bubble: high complexity, high features -->
  <circle cx="560" cy="150" r="80" fill="#f0f7f4" stroke="#03c75a" stroke-width="2" opacity="0.9"/>
  <text x="560" y="145" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0a5a30">OpenLayers</text>
  <text x="560" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#0a5a30">기능 풍부·다중 좌표계</text>

  <text x="415" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#777">간단한 지도는 Leaflet, 복잡한 GIS 요구사항은 OpenLayers</text>
</svg>
