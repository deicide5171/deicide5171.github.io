<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">3D Tiles: 거리에 따른 상세도(LOD) 스트리밍</text>

  <!-- camera -->
  <polygon points="70,230 110,205 110,255" fill="#e08a2b"/>
  <text x="90" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a4a10">카메라</text>

  <!-- near buildings (detailed) -->
  <text x="230" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0a5a30">가까움 → 상세</text>
  <rect x="180" y="150" width="40" height="120" fill="#cfe8d8" stroke="#3a8a5a" stroke-width="1.5"/>
  <line x1="188" y1="160" x2="188" y2="270" stroke="#3a8a5a" stroke-width="0.5"/>
  <line x1="196" y1="160" x2="196" y2="270" stroke="#3a8a5a" stroke-width="0.5"/>
  <line x1="204" y1="160" x2="204" y2="270" stroke="#3a8a5a" stroke-width="0.5"/>
  <line x1="212" y1="160" x2="212" y2="270" stroke="#3a8a5a" stroke-width="0.5"/>
  <rect x="240" y="180" width="35" height="90" fill="#cfe8d8" stroke="#3a8a5a" stroke-width="1.5"/>
  <line x1="248" y1="190" x2="248" y2="270" stroke="#3a8a5a" stroke-width="0.5"/>
  <line x1="258" y1="190" x2="258" y2="270" stroke="#3a8a5a" stroke-width="0.5"/>
  <line x1="268" y1="190" x2="268" y2="270" stroke="#3a8a5a" stroke-width="0.5"/>

  <!-- mid buildings -->
  <rect x="380" y="200" width="30" height="70" fill="#d8e8df" stroke="#7fb39a" stroke-width="1"/>
  <rect x="430" y="210" width="28" height="60" fill="#d8e8df" stroke="#7fb39a" stroke-width="1"/>

  <!-- far buildings (simple boxes) -->
  <text x="620" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#888">멀리 → 간략</text>
  <rect x="560" y="225" width="20" height="45" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <rect x="595" y="230" width="18" height="40" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <rect x="628" y="228" width="18" height="42" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>
  <rect x="661" y="232" width="16" height="38" fill="#e8e8e8" stroke="#bbb" stroke-width="1"/>

  <!-- ground line -->
  <line x1="70" y1="270" x2="740" y2="270" stroke="#999" stroke-width="1.5"/>

  <!-- explanation -->
  <rect x="90" y="320" width="620" height="100" rx="8" fill="#f7f7f7" stroke="#ccc"/>
  <text x="110" y="350" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222">타일 트리로 쪼개고 화면에 보이는 부분만 스트리밍</text>
  <text x="110" y="375" font-family="sans-serif" font-size="13" fill="#333">가까운 건물: 창문·질감까지 상세하게 (많은 데이터)</text>
  <text x="110" y="398" font-family="sans-serif" font-size="13" fill="#333">먼 건물: 간략한 상자로 (적은 데이터) → 수 GB 도시도 부드럽게</text>
</svg>
