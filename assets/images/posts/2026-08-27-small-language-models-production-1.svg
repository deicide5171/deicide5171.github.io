<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">SLM 우선 라우팅, 애매하면 대형 모델로 에스컬레이션</text>

  <rect x="40" y="80" width="140" height="50" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="110" y="110" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#222">사용자 요청</text>

  <line x1="180" y1="105" x2="240" y2="105" stroke="#8aa5c4" stroke-width="2"/>
  <polygon points="240,105 230,100 230,110" fill="#8aa5c4"/>

  <rect x="240" y="70" width="180" height="70" rx="8" fill="#eef8f1" stroke="#2e9e63" stroke-width="2"/>
  <text x="330" y="98" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a6b45">SLM (3B급)</text>
  <text x="330" y="116" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444">로컬 vLLM 서빙 · 수십ms</text>
  <text x="330" y="130" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444">신뢰도(logprob) 계산</text>

  <!-- 분기 -->
  <line x1="420" y1="90" x2="480" y2="60" stroke="#2e9e63" stroke-width="2.5"/>
  <polygon points="480,60 466,60 473,73" fill="#2e9e63"/>
  <text x="470" y="48" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">신뢰도 ≥ 0.85</text>

  <rect x="480" y="42" width="260" height="46" rx="8" fill="#ffffff" stroke="#2e9e63" stroke-width="2"/>
  <text x="610" y="70" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a6b45">SLM 결과 즉시 응답</text>

  <line x1="420" y1="120" x2="480" y2="180" stroke="#d0413b" stroke-width="2.5"/>
  <polygon points="480,180 466,177 470,192" fill="#d0413b"/>
  <text x="470" y="150" font-family="sans-serif" font-size="12" fill="#a13a34" text-anchor="middle">신뢰도 &lt; 0.85</text>
  <text x="470" y="165" font-family="sans-serif" font-size="11" fill="#a13a34" text-anchor="middle">(에스컬레이션)</text>

  <rect x="480" y="184" width="260" height="70" rx="8" fill="#fdf6ec" stroke="#c98a3d" stroke-width="2"/>
  <text x="610" y="212" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#a3611c">대형 모델 (플래그십)</text>
  <text x="610" y="230" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444">클라우드 API · 수백ms~수초</text>
  <text x="610" y="244" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444">애매한 소수 케이스만 처리</text>

  <!-- 증류 화살표 -->
  <line x1="610" y1="184" x2="330" y2="140" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4"/>
  <polygon points="330,140 342,138 338,151" fill="#999"/>
  <text x="470" y="300" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">대형 모델의 출력을 교사 데이터로 삼아 SLM을 지속적으로 증류·재학습</text>

  <text x="400" y="380" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">트래픽 대부분을 SLM이 저지연·저비용으로 처리하고, 애매한 소수만 대형 모델로 넘긴다</text>
</svg>
