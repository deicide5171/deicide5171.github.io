<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">Leaflet 지도의 레이어 구조</text>

  <!-- stacked layers (isometric-ish) -->
  <g>
    <!-- tile layer -->
    <polygon points="200,300 500,300 620,360 320,360" fill="#dff0e8" stroke="#3a8a5a" stroke-width="2"/>
    <text x="410" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0a5a30">타일 레이어 (배경 지도)</text>

    <!-- vector layer -->
    <polygon points="200,230 500,230 620,290 320,290" fill="#eaf6ff" stroke="#4a90d9" stroke-width="2" opacity="0.9"/>
    <text x="410" y="265" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a4a7a">벡터 레이어 (선·다각형)</text>

    <!-- marker layer -->
    <polygon points="200,160 500,160 620,220 320,220" fill="#fff3e6" stroke="#e08a2b" stroke-width="2" opacity="0.9"/>
    <text x="410" y="195" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#8a4a10">마커 + 팝업 레이어</text>
    <circle cx="360" cy="180" r="5" fill="#e05252"/>
    <circle cx="450" cy="185" r="5" fill="#e05252"/>
  </g>

  <!-- arrow showing stacking -->
  <line x1="670" y1="180" x2="670" y2="330" stroke="#888" stroke-width="2" marker-end="url(#l)"/>
  <text x="700" y="260" font-family="sans-serif" font-size="12" fill="#666" transform="rotate(90 700 260)">겹쳐서 합성</text>

  <text x="400" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">L.map 위에 L.tileLayer, L.marker 등을 addTo로 겹쳐 지도를 구성한다</text>

  <defs>
    <marker id="l" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>
