<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>

  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="32" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">에이전트가 경계를 넘을 때: 코드 직접 확인 vs 계약 신뢰</text>

  <!-- Left: Monolith -->
  <text x="190" y="65" font-size="13" text-anchor="middle" fill="#276b43" font-weight="bold">모놀리스 / 모듈러 모놀리스</text>
  <rect x="60" y="85" width="260" height="150" rx="8" fill="#eaf7ee" stroke="#4aa26f" stroke-width="1.5"/>
  <rect x="80" y="105" width="90" height="50" rx="5" fill="#ffffff" stroke="#4aa26f"/>
  <text x="125" y="135" font-size="11" text-anchor="middle" fill="#276b43">모듈 A</text>
  <rect x="200" y="105" width="100" height="50" rx="5" fill="#ffffff" stroke="#4aa26f"/>
  <text x="250" y="135" font-size="11" text-anchor="middle" fill="#276b43">모듈 B (코드)</text>
  <path d="M 170 130 L 198 130" fill="none" stroke="#276b43" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="190" y="190" font-size="11" text-anchor="middle" fill="#276b43" font-weight="bold">에이전트가 레포 하나를</text>
  <text x="190" y="206" font-size="11" text-anchor="middle" fill="#276b43" font-weight="bold">한 번에 열어 직접 추적</text>

  <!-- Right: Microservices -->
  <text x="610" y="65" font-size="13" text-anchor="middle" fill="#9e3f2c" font-weight="bold">마이크로서비스</text>
  <rect x="480" y="85" width="260" height="150" rx="8" fill="#fdeee8" stroke="#d4714a" stroke-width="1.5"/>
  <rect x="500" y="105" width="90" height="50" rx="5" fill="#ffffff" stroke="#d4714a"/>
  <text x="545" y="135" font-size="11" text-anchor="middle" fill="#9e3f2c">서비스 A</text>
  <rect x="620" y="105" width="100" height="30" rx="5" fill="#fff3e0" stroke="#d4a24a"/>
  <text x="670" y="124" font-size="10" text-anchor="middle" fill="#8a6418">계약 문서(OpenAPI)</text>
  <rect x="620" y="150" width="100" height="40" rx="5" fill="#ffffff" stroke="#999" stroke-dasharray="3,2"/>
  <text x="670" y="174" font-size="10" text-anchor="middle" fill="#999">서비스 B 코드</text>
  <text x="670" y="186" font-size="9" text-anchor="middle" fill="#999">(직접 못 봄)</text>
  <path d="M 590 125 L 615 118" fill="none" stroke="#9e3f2c" stroke-width="2" marker-end="url(#arrow5)"/>
  <path d="M 670 135 L 670 148" fill="none" stroke="#b23" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="610" y="210" font-size="11" text-anchor="middle" fill="#b23" font-weight="bold">계약이 코드와 어긋나면</text>
  <text x="610" y="226" font-size="11" text-anchor="middle" fill="#b23" font-weight="bold">에이전트는 알아챌 수 없음</text>

  <!-- Bottom: decision criteria -->
  <rect x="150" y="270" width="500" height="150" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  <text x="400" y="300" font-size="13" text-anchor="middle" fill="#222" font-weight="bold">판단 기준: 쪼개느냐가 아니라 "경계가 지켜지고 계약을 신뢰할 수 있는가"</text>
  <text x="400" y="330" font-size="11" text-anchor="middle" fill="#555">1. 에이전트 실패 지점 기록</text>
  <text x="400" y="352" font-size="11" text-anchor="middle" fill="#555">2. 계약-코드 불일치 점검 (자동 생성으로 해결 가능한가)</text>
  <text x="400" y="374" font-size="11" text-anchor="middle" fill="#555">3. 부족하면 모듈러 모놀리스로 중간 통합</text>
  <text x="400" y="396" font-size="11" text-anchor="middle" fill="#555">4. 못 합치는 경계는 기계가 읽는 계약으로 강화</text>
</svg>
