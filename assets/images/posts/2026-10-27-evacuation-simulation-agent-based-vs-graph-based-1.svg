<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">대피 시뮬레이션 데이터 흐름 — 연산과 재생의 분리</text>

  <rect x="30" y="55" width="160" height="70" rx="8" fill="#eef2fb" stroke="#3b5bdb" stroke-width="2"/>
  <text x="110" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1c2e6b">입력 데이터</text>
  <text x="110" y="95" text-anchor="middle" font-size="9.5" fill="#1c2e6b">도로망·건물·인구</text>
  <text x="110" y="109" text-anchor="middle" font-size="9.5" fill="#1c2e6b">통제 지점·대피소</text>

  <defs>
    <marker id="ae1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#555"/></marker>
  </defs>
  <line x1="190" y1="90" x2="230" y2="90" stroke="#555" stroke-width="2" marker-end="url(#ae1)"/>

  <rect x="232" y="50" width="250" height="90" rx="8" fill="#fff" stroke="#888" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="357" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">연산 엔진 (선택 지점)</text>

  <rect x="245" y="78" width="100" height="50" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="295" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">그래프 기반</text>
  <text x="295" y="113" text-anchor="middle" font-size="8.5" fill="#1b5e20">최단경로+용량</text>

  <rect x="355" y="78" width="115" height="50" rx="6" fill="#fdf0e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="412" y="98" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a2d1c">에이전트 기반</text>
  <text x="412" y="113" text-anchor="middle" font-size="8.5" fill="#8a2d1c">개별 보행자 규칙</text>

  <line x1="482" y1="90" x2="520" y2="90" stroke="#555" stroke-width="2" marker-end="url(#ae1)"/>

  <rect x="522" y="55" width="150" height="70" rx="8" fill="#eef2fb" stroke="#3b5bdb" stroke-width="2"/>
  <text x="597" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1c2e6b">시계열 결과</text>
  <text x="597" y="95" text-anchor="middle" font-size="9.5" fill="#1c2e6b">경로별 소요 시간</text>
  <text x="597" y="109" text-anchor="middle" font-size="9.5" fill="#1c2e6b">혼잡 구간 · 완료 시각</text>

  <line x1="597" y1="125" x2="597" y2="160" stroke="#555" stroke-width="2" marker-end="url(#ae1)"/>

  <rect x="462" y="163" width="270" height="60" rx="8" fill="#eef2fb" stroke="#3b5bdb" stroke-width="2"/>
  <text x="597" y="186" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1c2e6b">웹 지도 시간축 재생 레이어</text>
  <text x="597" y="203" text-anchor="middle" font-size="9.5" fill="#1c2e6b">(침수 시뮬레이션 재생 구조 재사용)</text>

  <rect x="30" y="245" width="740" height="60" rx="8" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <text x="400" y="267" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">단계적 접근: 그래프 기반으로 병목 구간 선별 → 그 구간만 에이전트 기반으로 정밀화</text>
  <text x="400" y="286" text-anchor="middle" font-size="10.5" fill="#555">전체를 에이전트 기반으로 돌리는 것보다 연산 비용을 크게 줄일 수 있다</text>

  <rect x="30" y="320" width="740" height="110" rx="8" fill="#fff7f0" stroke="#f0a04b" stroke-width="2"/>
  <text x="400" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a1c">판단 기준: 정책 비교용 1차 스크리닝인가, 정밀 검증인가</text>
  <text x="400" y="370" text-anchor="middle" font-size="12" fill="#5a4632">· 정보 전파 순서·대략적 완료 시간 비교 → 그래프 기반으로 충분</text>
  <text x="400" y="392" text-anchor="middle" font-size="12" fill="#5a4632">· 특정 교차로 혼잡 원인·세부 행동 분석 → 에이전트 기반 필요</text>
  <text x="400" y="414" text-anchor="middle" font-size="12" fill="#5a4632">→ 두 경우 모두 실측 데이터(훈련 기록·이동 데이터) 검증 없이는 신뢰할 수 없다</text>
</svg>
