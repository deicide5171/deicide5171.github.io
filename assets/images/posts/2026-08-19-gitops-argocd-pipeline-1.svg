<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="400" y="24" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">GitOps 동기화 흐름 (ArgoCD)</text>

  <!-- Git repo -->
  <rect x="40" y="60" width="200" height="90" rx="8" fill="#eef4ff" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="140" y="95" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#22315a">Git 리포지토리</text>
  <text x="140" y="114" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#22315a">(선언형 매니페스트)</text>
  <text x="140" y="130" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#22315a">목표 상태(Desired State)</text>

  <!-- CI -->
  <rect x="40" y="330" width="200" height="60" rx="8" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.3"/>
  <text x="140" y="356" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333333">CI 파이프라인</text>
  <text x="140" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333333">이미지 빌드 + 매니페스트 커밋</text>

  <line x1="140" y1="330" x2="140" y2="150" stroke="#4a7fd6" stroke-width="1.4" marker-end="url(#arrowhead)"/>
  <text x="60" y="245" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a7fd6">git push</text>
  <text x="60" y="259" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a7fd6">(태그 갱신)</text>

  <!-- ArgoCD box -->
  <rect x="300" y="60" width="260" height="220" rx="8" fill="#f2ecfb" stroke="#8a5fd6" stroke-width="1.5"/>
  <text x="430" y="84" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3a2a5a">ArgoCD</text>

  <rect x="320" y="100" width="220" height="46" rx="6" fill="#ffffff" stroke="#8a5fd6" stroke-width="1.2"/>
  <text x="430" y="127" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#3a2a5a">Repo Server (렌더링)</text>

  <line x1="430" y1="146" x2="430" y2="172" stroke="#8a5fd6" stroke-width="1.3" marker-end="url(#arrowhead)"/>

  <rect x="320" y="174" width="220" height="46" rx="6" fill="#ffffff" stroke="#8a5fd6" stroke-width="1.2"/>
  <text x="430" y="197" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a2a5a">Application Controller</text>
  <text x="430" y="212" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#3a2a5a">목표 vs 실제 상태 Diff</text>

  <text x="430" y="246" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a2a5a">주기적 폴링 / Git 웹훅으로</text>
  <text x="430" y="261" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a2a5a">변경 감지 (Pull 방식)</text>

  <!-- Git to ArgoCD -->
  <line x1="240" y1="100" x2="320" y2="100" stroke="#4a7fd6" stroke-width="1.4" marker-end="url(#arrowhead)"/>
  <text x="280" y="90" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#4a7fd6">감지</text>

  <!-- ArgoCD to cluster -->
  <rect x="600" y="60" width="160" height="220" rx="8" fill="#eafaf0" stroke="#2fa86a" stroke-width="1.5"/>
  <text x="680" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a5c3a">쿠버네티스</text>
  <text x="680" y="108" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a5c3a">클러스터</text>
  <text x="680" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a5c3a">실제 상태</text>
  <text x="680" y="156" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a5c3a">(Live State)</text>

  <line x1="560" y1="130" x2="600" y2="130" stroke="#2fa86a" stroke-width="1.4" marker-end="url(#arrowhead)"/>
  <text x="580" y="118" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2fa86a">적용</text>

  <line x1="600" y1="200" x2="560" y2="200" stroke="#2fa86a" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <text x="580" y="215" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#2fa86a">상태 조회</text>

  <!-- selfHeal note -->
  <rect x="300" y="340" width="260" height="70" rx="6" fill="#fff3e6" stroke="#e08a3d" stroke-width="1.5"/>
  <text x="430" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7a4a1a">수동 kubectl 변경 발생 시</text>
  <text x="430" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7a4a1a">selfHeal 활성화 시 다음 동기화</text>
  <text x="430" y="396" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7a4a1a">주기에 Git 상태로 자동 복원</text>

  <line x1="430" y1="280" x2="430" y2="340" stroke="#e08a3d" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
</svg>
