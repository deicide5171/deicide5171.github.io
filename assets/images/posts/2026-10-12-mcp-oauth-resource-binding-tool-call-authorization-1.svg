<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">토큰 바인딩(발급 시점) vs 런타임 정책(호출 시점) — 2단계 인가</text>

  <rect x="30" y="56" width="150" height="56" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="105" y="80" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#312e81">에이전트 런타임</text>
  <text x="105" y="96" text-anchor="middle" font-size="7.5" fill="#3730a3">(MCP 클라이언트)</text>

  <line x1="180" y1="84" x2="280" y2="84" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <text x="230" y="76" text-anchor="middle" font-size="7" fill="#374151">resource=이슈트래커</text>

  <rect x="280" y="56" width="180" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="370" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">인가 서버</text>
  <text x="370" y="94" text-anchor="middle" font-size="7.5" fill="#065f46">resource 바인딩 토큰 발급</text>

  <line x1="460" y1="84" x2="180" y2="84" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowB)" transform="translate(0,26)"/>
  <text x="320" y="124" text-anchor="middle" font-size="7" fill="#065f46">token{ aud: 이슈트래커, iss 검증 }</text>

  <line x1="105" y1="112" x2="105" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <text x="130" y="135" text-anchor="middle" font-size="7" fill="#374151">tools/call</text>

  <rect x="20" y="150" width="200" height="56" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="120" y="172" text-anchor="middle" font-size="9" font-weight="bold" fill="#581c87">런타임 정책 게이트</text>
  <text x="120" y="188" text-anchor="middle" font-size="7" fill="#6b21a8">호출 시점마다 재판단</text>

  <line x1="120" y1="206" x2="120" y2="240" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <rect x="20" y="240" width="760" height="54" rx="6" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="400" y="260" text-anchor="middle" font-size="8.5" fill="#581c87">이 세션이 지금 쓰기 작업을 요청했는가? 도구 정의가 승인 시점과 달라지지 않았는가? (rug-pull 방지)</text>
  <text x="400" y="278" text-anchor="middle" font-size="8.5" fill="#581c87">→ 토큰이 유효해도 이 계층을 통과 못하면 호출은 차단된다</text>

  <rect x="580" y="56" width="200" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="680" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7c2d12">이슈 트래커 MCP 서버</text>
  <text x="680" y="94" text-anchor="middle" font-size="7.5" fill="#9a3412">aud가 자신인지 검증</text>

  <rect x="580" y="150" width="200" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="680" y="172" text-anchor="middle" font-size="9" font-weight="bold" fill="#7f1d1d">캘린더 MCP 서버</text>
  <text x="680" y="190" text-anchor="middle" font-size="7.5" fill="#991b1b">다른 aud 토큰 → 거부</text>

  <line x1="240" y1="268" x2="580" y2="80" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="2,3"/>
  <text x="430" y="200" text-anchor="middle" font-size="7" fill="#6b7280">정책 통과 시에만 호출 전달</text>

  <rect x="150" y="360" width="500" height="70" rx="8" fill="#f0f7f4" stroke="#047857" stroke-width="1.5"/>
  <text x="400" y="382" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">핵심: 두 관문은 서로 다른 질문에 답한다</text>
  <text x="400" y="400" text-anchor="middle" font-size="8" fill="#065f46">토큰 바인딩 = &quot;이 토큰이 이 서버용이 맞는가&quot; (2026-07-28 표준화)</text>
  <text x="400" y="415" text-anchor="middle" font-size="8" fill="#065f46">런타임 정책 = &quot;지금 이 호출이 안전한가&quot; (표준 없음, 직접 설계)</text>

  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
    <marker id="arrowC" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9333ea"/>
    </marker>
  </defs>
</svg>
