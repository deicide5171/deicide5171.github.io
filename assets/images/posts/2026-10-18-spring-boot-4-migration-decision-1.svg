<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrowS" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Spring Boot 4 의존성 체인 — 한 번에 같이 올라가는 네 레이어</text>

  <rect x="40" y="60" width="150" height="56" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="115" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">서블릿 컨테이너</text>
  <text x="115" y="98" text-anchor="middle" font-size="8" fill="#1e40af">Tomcat/Jetty</text>
  <text x="115" y="110" text-anchor="middle" font-size="7.5" fill="#dc2626">Undertow 제거됨</text>

  <line x1="190" y1="88" x2="226" y2="88" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowS)"/>

  <rect x="226" y="60" width="160" height="56" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="306" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">Spring MVC/WebFlux</text>
  <text x="306" y="98" text-anchor="middle" font-size="8" fill="#92400e">Framework 7</text>
  <text x="306" y="110" text-anchor="middle" font-size="7.5" fill="#92400e">Jakarta EE 11 베이스라인</text>

  <line x1="386" y1="88" x2="422" y2="88" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowS)"/>

  <rect x="422" y="60" width="160" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="502" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">직렬화 계층</text>
  <text x="502" y="98" text-anchor="middle" font-size="8" fill="#991b1b">Jackson 3</text>
  <text x="502" y="110" text-anchor="middle" font-size="7.5" fill="#991b1b">패키지 네임스페이스 변경</text>

  <line x1="582" y1="88" x2="618" y2="88" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowS)"/>

  <rect x="618" y="60" width="150" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="693" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">영속성 계층</text>
  <text x="693" y="98" text-anchor="middle" font-size="8" fill="#065f46">Hibernate 7.2</text>
  <text x="693" y="110" text-anchor="middle" font-size="7.5" fill="#065f46">2차 캐시 설정 키 변경</text>

  <line x1="693" y1="116" x2="693" y2="160" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowS)"/>
  <rect x="618" y="160" width="150" height="40" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="693" y="184" text-anchor="middle" font-size="9" fill="#374151">DB</text>

  <rect x="60" y="230" width="680" height="34" rx="6" fill="#fff7ed" stroke="#f0a04b" stroke-width="1.3"/>
  <text x="400" y="252" text-anchor="middle" font-size="9.5" fill="#92400e">선행 점검: Properties Migrator 실행 → 사라지거나 이름 바뀐 설정 키 확인</text>

  <rect x="60" y="276" width="680" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="400" y="298" text-anchor="middle" font-size="9.5" fill="#7f1d1d">가장 흔한 회귀: Jackson 3 미지원 라이브러리 → 직렬화 조용히 기본값 복귀</text>

  <rect x="60" y="322" width="680" height="34" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="400" y="344" text-anchor="middle" font-size="9.5" fill="#1e3a8a">검증 우선순위: 통합 테스트(직렬화·보안 필터) → 스테이징 트래픽 모니터링 → 운영 반영</text>

  <text x="400" y="400" text-anchor="middle" font-size="9" fill="#4b5563">네 레이어가 한 번의 버전 업그레이드로 동시에 바뀌므로, 장애 원인을 좁히는 것 자체가 난이도다</text>
  <text x="400" y="420" text-anchor="middle" font-size="9" fill="#4b5563">Java 최소 버전도 21로 상향 — Boot 설정을 건드리지 않아도 Framework 레이어에서 깨질 수 있다</text>
</svg>
