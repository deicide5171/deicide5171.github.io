<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">에이전트 추론 계층과 웹·데스크톱 조작 실행 계층의 분리</text>

  <!-- Reasoning layer -->
  <rect x="220" y="50" width="360" height="55" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="400" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#3730a3">에이전트 추론 (모델) — "로그인 버튼을 눌러라"</text>
  <text x="400" y="92" text-anchor="middle" font-size="10" fill="#4338ca">무엇을 할지 결정 · 좌표는 모른다</text>

  <!-- arrows down -->
  <line x1="320" y1="105" x2="220" y2="150" stroke="#64748b" stroke-width="2"/>
  <line x1="480" y1="105" x2="580" y2="150" stroke="#64748b" stroke-width="2"/>

  <!-- agent-browser branch -->
  <rect x="80" y="150" width="280" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="220" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">agent-browser</text>
  <text x="220" y="190" text-anchor="middle" font-size="10" fill="#166534">웹 페이지 DOM 조작</text>

  <!-- agent-desktop branch -->
  <rect x="440" y="150" width="280" height="50" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="580" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">agent-desktop</text>
  <text x="580" y="190" text-anchor="middle" font-size="10" fill="#9a3412">OS 접근성 트리 조작</text>

  <line x1="220" y1="200" x2="220" y2="230" stroke="#64748b" stroke-width="2"/>
  <line x1="580" y1="200" x2="580" y2="230" stroke="#64748b" stroke-width="2"/>

  <rect x="80" y="230" width="280" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="220" y="258" text-anchor="middle" font-size="11" fill="#334155">브라우저 렌더링 DOM</text>

  <rect x="440" y="230" width="280" height="45" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="580" y="258" text-anchor="middle" font-size="11" fill="#334155">OS 접근성 API (macOS/Win/Linux)</text>

  <line x1="220" y1="275" x2="220" y2="305" stroke="#64748b" stroke-width="2"/>
  <line x1="580" y1="275" x2="580" y2="305" stroke="#64748b" stroke-width="2"/>

  <rect x="80" y="305" width="280" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="330" text-anchor="middle" font-size="11" fill="#1e3a8a">웹 서비스 화면</text>

  <rect x="440" y="305" width="280" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="580" y="330" text-anchor="middle" font-size="11" fill="#1e3a8a">네이티브 데스크톱 앱 (ERP·전자결재 등)</text>

  <rect x="40" y="370" width="720" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">한계: 접근성 트리를 노출하지 않는 앱(자체 렌더링 UI)에서는 이 경로 자체가 막힌다</text>
  <text x="400" y="412" text-anchor="middle" font-size="10" fill="#991b1b">→ 픽셀 비전 폴백 또는 벤더 공식 연동으로 전환해야 한다</text>

</svg>
