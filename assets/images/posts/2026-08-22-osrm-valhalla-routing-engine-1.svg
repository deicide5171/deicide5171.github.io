<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">OSRM vs Valhalla — 그래프 처리 방식 비교</text>
  <text x="400" y="49" text-anchor="middle" font-size="12" fill="#666">두 엔진 모두 도로망을 그래프로 다루지만, 전처리와 질의 시점에서의 전략이 다르다</text>

  <!-- divider -->
  <line x1="400" y1="65" x2="400" y2="425" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- LEFT: OSRM Contraction Hierarchies -->
  <text x="200" y="85" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#0b5fa5">OSRM — Contraction Hierarchies</text>
  <text x="200" y="102" text-anchor="middle" font-size="10.5" fill="#666">사전 계산(preprocessing)으로 중요도 낮은 노드를 축약</text>

  <!-- original graph row -->
  <text x="60" y="132" font-size="10.5" fill="#888">원본 그래프</text>
  <g stroke="#999" stroke-width="1.5">
    <line x1="70" y1="150" x2="130" y2="150"/>
    <line x1="130" y1="150" x2="190" y2="150"/>
    <line x1="190" y1="150" x2="250" y2="150"/>
    <line x1="250" y1="150" x2="310" y2="150"/>
  </g>
  <circle cx="70" cy="150" r="9" fill="#1877c9"/>
  <circle cx="130" cy="150" r="9" fill="#1877c9"/>
  <circle cx="190" cy="150" r="9" fill="#c9821a"/>
  <circle cx="250" cy="150" r="9" fill="#1877c9"/>
  <circle cx="310" cy="150" r="9" fill="#1877c9"/>
  <text x="190" y="176" text-anchor="middle" font-size="9.5" fill="#c9821a">중요도 낮은 노드</text>

  <!-- arrow down -->
  <line x1="200" y1="192" x2="200" y2="222" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="210" font-size="10" fill="#555">노드 축약</text>

  <!-- contracted graph row -->
  <text x="60" y="250" font-size="10.5" fill="#888">축약된 그래프</text>
  <g stroke="#999" stroke-width="1.5">
    <line x1="70" y1="268" x2="130" y2="268"/>
    <line x1="250" y1="268" x2="310" y2="268"/>
  </g>
  <path d="M 130 268 Q 190 300 250 268" fill="none" stroke="#2fa84f" stroke-width="2" stroke-dasharray="5,3"/>
  <circle cx="70" cy="268" r="9" fill="#1877c9"/>
  <circle cx="130" cy="268" r="9" fill="#1877c9"/>
  <circle cx="250" cy="268" r="9" fill="#1877c9"/>
  <circle cx="310" cy="268" r="9" fill="#1877c9"/>
  <text x="190" y="315" text-anchor="middle" font-size="9.5" fill="#2fa84f">shortcut 간선 추가</text>

  <rect x="60" y="345" width="280" height="58" rx="6" fill="#eef5fb" stroke="#0b5fa5" stroke-width="1"/>
  <text x="200" y="365" text-anchor="middle" font-size="11" fill="#0b5fa5" font-weight="bold">질의(query) 시점</text>
  <text x="200" y="382" text-anchor="middle" font-size="10" fill="#333">축약된 그래프 위에서 양방향 탐색</text>
  <text x="200" y="396" text-anchor="middle" font-size="10" fill="#333">→ 매우 빠른 응답 속도</text>

  <!-- RIGHT: Valhalla hierarchical tiles -->
  <text x="600" y="85" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8f5c10">Valhalla — 계층적 타일 그래프</text>
  <text x="600" y="102" text-anchor="middle" font-size="10.5" fill="#666">지역을 타일로 분할하고, 도로 등급별 레벨로 계층화</text>

  <!-- level 0 -->
  <rect x="470" y="120" width="260" height="42" rx="6" fill="#c9821a" stroke="#8f5c10" stroke-width="1.5"/>
  <text x="600" y="137" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">Level 0 — 고속도로/간선</text>
  <text x="600" y="152" text-anchor="middle" font-size="9.5" fill="#fff2df">타일 크기 大, 장거리 이동</text>

  <line x1="600" y1="162" x2="600" y2="182" stroke="#999" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- level 1 -->
  <rect x="470" y="182" width="260" height="42" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="600" y="199" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">Level 1 — 지역 간선도로</text>
  <text x="600" y="214" text-anchor="middle" font-size="9.5" fill="#dbeafe">타일 크기 中</text>

  <line x1="600" y1="224" x2="600" y2="244" stroke="#999" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- level 2 -->
  <rect x="470" y="244" width="260" height="42" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="600" y="261" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">Level 2 — 지역 도로/골목</text>
  <text x="600" y="276" text-anchor="middle" font-size="9.5" fill="#eafff0">타일 크기 小, 정밀 경로</text>

  <rect x="470" y="304" width="260" height="99" rx="6" fill="#fdf3e7" stroke="#c9821a" stroke-width="1"/>
  <text x="600" y="324" text-anchor="middle" font-size="11" fill="#8f5c10" font-weight="bold">비용 모델(costing) 선택</text>
  <text x="600" y="342" text-anchor="middle" font-size="10" fill="#333">자동차 · 자전거 · 보행자 · 화물차</text>
  <text x="600" y="358" text-anchor="middle" font-size="10" fill="#333">등 이동 수단별 비용 함수를 교체하여</text>
  <text x="600" y="374" text-anchor="middle" font-size="10" fill="#333">같은 그래프에서 다른 경로 산출</text>
  <text x="600" y="393" text-anchor="middle" font-size="9.5" fill="#8f5c10">커스텀 비용 모델 정의도 가능</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <text x="400" y="440" text-anchor="middle" font-size="11" fill="#555">OSRM은 질의 속도에, Valhalla는 유연성과 다양한 이동 수단 지원에 무게를 둔다</text>
</svg>
