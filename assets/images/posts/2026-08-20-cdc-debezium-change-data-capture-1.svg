<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">DB 로그 → Debezium → Kafka 흐름</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#666">트랜잭션 로그를 읽어 변경 이벤트를 커밋 순서 그대로 스트리밍한다</text>

  <!-- DB box -->
  <rect x="40" y="100" width="190" height="230" rx="8" fill="#0b5fa5" stroke="#083f6e" stroke-width="1.5"/>
  <text x="135" y="128" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">원본 데이터베이스</text>
  <text x="135" y="146" text-anchor="middle" font-size="10.5" fill="#dbeafe">PostgreSQL / MySQL</text>

  <rect x="60" y="164" width="150" height="40" rx="5" fill="#1877c9" stroke="#0b5fa5" stroke-width="1"/>
  <text x="135" y="188" text-anchor="middle" font-size="11.5" fill="#fff">orders 테이블</text>

  <rect x="60" y="214" width="150" height="52" rx="5" fill="#0e3a5f" stroke="#083f6e" stroke-width="1.5"/>
  <text x="135" y="234" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">트랜잭션 로그</text>
  <text x="135" y="250" text-anchor="middle" font-size="10" fill="#cfe4f7">WAL / binlog</text>

  <rect x="60" y="278" width="150" height="36" rx="5" fill="#1877c9" stroke="#0b5fa5" stroke-width="1"/>
  <text x="135" y="300" text-anchor="middle" font-size="11" fill="#fff">복제 슬롯 / binlog 위치</text>

  <!-- arrow DB -> Debezium -->
  <line x1="230" y1="240" x2="290" y2="240" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="260" y="228" text-anchor="middle" font-size="10" fill="#555">로그 구독</text>

  <!-- Debezium box -->
  <rect x="295" y="130" width="210" height="170" rx="8" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="400" y="158" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Debezium 커넥터</text>
  <text x="400" y="176" text-anchor="middle" font-size="10.5" fill="#eafff0">(Kafka Connect Source)</text>

  <rect x="315" y="190" width="170" height="34" rx="5" fill="#1f7a38" stroke="#155429" stroke-width="1"/>
  <text x="400" y="212" text-anchor="middle" font-size="11" fill="#fff">스냅샷 (초기 적재)</text>

  <rect x="315" y="232" width="170" height="34" rx="5" fill="#1f7a38" stroke="#155429" stroke-width="1"/>
  <text x="400" y="254" text-anchor="middle" font-size="11" fill="#fff">로그 스트리밍</text>

  <text x="400" y="284" text-anchor="middle" font-size="10" fill="#eafff0">before/after 이벤트 봉투 생성</text>

  <!-- arrow Debezium -> Kafka -->
  <line x1="505" y1="215" x2="565" y2="215" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="535" y="203" text-anchor="middle" font-size="10" fill="#555">발행</text>

  <!-- Kafka box -->
  <rect x="570" y="100" width="190" height="230" rx="8" fill="#c9821a" stroke="#8f5c10" stroke-width="1.5"/>
  <text x="665" y="128" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Kafka</text>

  <rect x="590" y="150" width="150" height="34" rx="5" fill="#8f5c10" stroke="#6b4409" stroke-width="1"/>
  <text x="665" y="172" text-anchor="middle" font-size="11" fill="#fff">shop.public.orders</text>

  <rect x="590" y="196" width="150" height="34" rx="5" fill="#8f5c10" stroke="#6b4409" stroke-width="1"/>
  <text x="665" y="218" text-anchor="middle" font-size="11" fill="#fff">outbox 라우팅 토픽</text>

  <rect x="590" y="242" width="150" height="46" rx="5" fill="#6b4409" stroke="#4a2f06" stroke-width="1"/>
  <text x="665" y="262" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">컨슈머 애플리케이션</text>
  <text x="665" y="278" text-anchor="middle" font-size="9.5" fill="#ffe9c9">검색 인덱스 · 캐시 · DW</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>

  <text x="400" y="405" text-anchor="middle" font-size="11.5" fill="#555">Kafka Connect 위에서 동작하므로 재시작·오프셋 관리를 그대로 재사용한다</text>
</svg>
