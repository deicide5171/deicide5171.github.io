<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">CityGML LOD(Level of Detail) 단계별 3D 건물 모델</text>
  <text x="400" y="52" text-anchor="middle" font-size="12.5" fill="#666">동일한 건물을 표현 목적에 따라 서로 다른 상세도로 담는다</text>

  <!-- ground line -->
  <line x1="30" y1="360" x2="770" y2="360" stroke="#ccc" stroke-width="1.5"/>

  <!-- progress arrow -->
  <line x1="60" y1="400" x2="740" y2="400" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>
  <text x="400" y="422" text-anchor="middle" font-size="12" fill="#666">상세도(Detail) 및 데이터 용량 증가 &#8594;</text>

  <!-- column width helper: 5 columns centered at 100,250,400,550,700 -->

  <!-- LOD0: footprint only -->
  <g transform="translate(100,0)">
    <rect x="-42" y="330" width="84" height="30" fill="#eef3f7" stroke="#0b5fa5" stroke-width="1.5"/>
    <text x="0" y="350" text-anchor="middle" font-size="10" fill="#0b5fa5">건물 발자국</text>
    <rect x="-4" y="290" width="8" height="4" fill="#0b5fa5"/>
    <rect x="-2" y="140" width="70" height="0" fill="none"/>
    <text x="0" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b5fa5">LOD0</text>
    <text x="0" y="135" text-anchor="middle" font-size="10.5" fill="#555">2.5D 지형 +</text>
    <text x="0" y="148" text-anchor="middle" font-size="10.5" fill="#555">건물 윤곽선</text>
  </g>

  <!-- LOD1: block model -->
  <g transform="translate(250,0)">
    <rect x="-38" y="230" width="76" height="130" fill="#cfe0ee" stroke="#0b5fa5" stroke-width="1.5"/>
    <text x="0" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b5fa5">LOD1</text>
    <text x="0" y="135" text-anchor="middle" font-size="10.5" fill="#555">단순 블록</text>
    <text x="0" y="148" text-anchor="middle" font-size="10.5" fill="#555">(평평한 지붕 압출)</text>
  </g>

  <!-- LOD2: roof structure + facade -->
  <g transform="translate(400,0)">
    <rect x="-40" y="220" width="80" height="140" fill="#bcd8ee" stroke="#1877c9" stroke-width="1.5"/>
    <polygon points="-46,220 0,178 46,220" fill="#9fc4e3" stroke="#1877c9" stroke-width="1.5"/>
    <line x1="-40" y1="255" x2="40" y2="255" stroke="#1877c9" stroke-width="1"/>
    <line x1="-40" y1="290" x2="40" y2="290" stroke="#1877c9" stroke-width="1"/>
    <line x1="-40" y1="325" x2="40" y2="325" stroke="#1877c9" stroke-width="1"/>
    <text x="0" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1877c9">LOD2</text>
    <text x="0" y="125" text-anchor="middle" font-size="10.5" fill="#555">지붕 형태 +</text>
    <text x="0" y="138" text-anchor="middle" font-size="10.5" fill="#555">외피 텍스처</text>
  </g>

  <!-- LOD3: architectural detail -->
  <g transform="translate(550,0)">
    <rect x="-40" y="200" width="80" height="160" fill="#a9d0ea" stroke="#1568b0" stroke-width="1.5"/>
    <polygon points="-46,200 0,160 46,200" fill="#8fbfe0" stroke="#1568b0" stroke-width="1.5"/>
    <rect x="-30" y="220" width="14" height="18" fill="#eef7ff" stroke="#1568b0" stroke-width="1"/>
    <rect x="-6" y="220" width="14" height="18" fill="#eef7ff" stroke="#1568b0" stroke-width="1"/>
    <rect x="18" y="220" width="14" height="18" fill="#eef7ff" stroke="#1568b0" stroke-width="1"/>
    <rect x="-30" y="255" width="14" height="18" fill="#eef7ff" stroke="#1568b0" stroke-width="1"/>
    <rect x="-6" y="255" width="14" height="18" fill="#eef7ff" stroke="#1568b0" stroke-width="1"/>
    <rect x="18" y="255" width="14" height="18" fill="#eef7ff" stroke="#1568b0" stroke-width="1"/>
    <rect x="-8" y="330" width="16" height="30" fill="#5a3a20"/>
    <text x="0" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#1568b0">LOD3</text>
    <text x="0" y="107" text-anchor="middle" font-size="10.5" fill="#555">창문·출입구 등</text>
    <text x="0" y="120" text-anchor="middle" font-size="10.5" fill="#555">건축 디테일</text>
  </g>

  <!-- LOD4: interior -->
  <g transform="translate(700,0)">
    <rect x="-40" y="200" width="80" height="160" fill="#7fb8dd" stroke="#0d4d8c" stroke-width="1.5"/>
    <polygon points="-46,200 0,160 46,200" fill="#6aa9d3" stroke="#0d4d8c" stroke-width="1.5"/>
    <line x1="-40" y1="250" x2="40" y2="250" stroke="#0d4d8c" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="-40" y1="300" x2="40" y2="300" stroke="#0d4d8c" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="0" y1="200" x2="0" y2="360" stroke="#0d4d8c" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="-20" y="230" text-anchor="middle" font-size="8" fill="#08335e">실</text>
    <text x="20" y="275" text-anchor="middle" font-size="8" fill="#08335e">실</text>
    <text x="0" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d4d8c">LOD4</text>
    <text x="0" y="107" text-anchor="middle" font-size="10.5" fill="#555">실내 공간</text>
    <text x="0" y="120" text-anchor="middle" font-size="10.5" fill="#555">(방·계단 등)까지</text>
  </g>

  <text x="400" y="445" text-anchor="middle" font-size="11" fill="#888">※ OGC CityGML 표준의 대표 LOD 5단계 개념을 단순화해 표현한 그림</text>
</svg>
