<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">CAP 삼각형과 실전 분산 DB의 위치</text>
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#666">파티션(네트워크 단절)이 실제로 발생했을 때, C와 A 중 하나만 지킬 수 있다</text>

  <!-- triangle edges -->
  <!-- CA edge (dashed - unreachable for distributed systems) -->
  <line x1="400" y1="90" x2="160" y2="378" stroke="#bbb" stroke-width="2" stroke-dasharray="6,5"/>
  <!-- CP edge -->
  <line x1="400" y1="90" x2="640" y2="378" stroke="#2fa84f" stroke-width="2.5"/>
  <!-- AP edge -->
  <line x1="160" y1="378" x2="640" y2="378" stroke="#0b5fa5" stroke-width="2.5"/>

  <!-- vertex C -->
  <circle cx="400" cy="80" r="6" fill="#1a1a1a"/>
  <text x="400" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">C: 일관성</text>
  <text x="400" y="76" text-anchor="middle" font-size="10.5" fill="#555">(Consistency)</text>

  <!-- vertex A -->
  <circle cx="160" cy="382" r="6" fill="#1a1a1a"/>
  <text x="150" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">A: 가용성</text>
  <text x="150" y="424" text-anchor="middle" font-size="10.5" fill="#555">(Availability)</text>

  <!-- vertex P -->
  <circle cx="640" cy="382" r="6" fill="#1a1a1a"/>
  <text x="650" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">P: 파티션 허용</text>
  <text x="650" y="424" text-anchor="middle" font-size="10.5" fill="#555">(Partition Tolerance)</text>

  <!-- CA label (unreachable) -->
  <rect x="180" y="205" width="150" height="46" rx="6" fill="#f4f4f4" stroke="#bbb"/>
  <text x="255" y="222" text-anchor="middle" font-size="11" fill="#777">CA 구간</text>
  <text x="255" y="236" text-anchor="middle" font-size="10" fill="#888">단일 노드에서만 성립,</text>
  <text x="255" y="247" text-anchor="middle" font-size="10" fill="#888">분산 환경엔 해당 없음</text>

  <!-- CP side box -->
  <rect x="470" y="150" width="185" height="88" rx="6" fill="#eafff0" stroke="#2fa84f"/>
  <text x="562" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f7a38">CP 쪽 (일관성 우선)</text>
  <circle cx="490" cy="188" r="4" fill="#1f7a38"/>
  <text x="500" y="192" font-size="11.5" fill="#1f7a38">CockroachDB</text>
  <circle cx="490" cy="208" r="4" fill="#1f7a38"/>
  <text x="500" y="212" font-size="11.5" fill="#1f7a38">MongoDB (강한 일관성 설정)</text>
  <text x="562" y="230" text-anchor="middle" font-size="10" fill="#3c8a54">파티션 시 소수 쪽은 응답 거부</text>

  <!-- AP side box -->
  <rect x="145" y="290" width="185" height="70" rx="6" fill="#eaf3fb" stroke="#0b5fa5"/>
  <text x="237" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b5fa5">AP 쪽 (가용성 우선)</text>
  <circle cx="165" cy="328" r="4" fill="#0b5fa5"/>
  <text x="175" y="332" font-size="11.5" fill="#0b5fa5">Cassandra (기본 설정)</text>
  <circle cx="165" cy="346" r="4" fill="#0b5fa5"/>
  <text x="175" y="350" font-size="11.5" fill="#0b5fa5">DynamoDB</text>

  <text x="400" y="443" text-anchor="middle" font-size="11" fill="#555">같은 DB라도 쿼럼·컨시스턴시 레벨 설정에 따라 삼각형 위 위치가 이동할 수 있다</text>
</svg>
