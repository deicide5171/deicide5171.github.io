<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrowW" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">워크플로 엔진의 저널-리플레이 — LLM 호출은 활동으로 분리돼 한 번만 기록된다</text>

  <rect x="40" y="50" width="160" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="120" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">에이전트 오케스트레이터</text>
  <text x="120" y="88" text-anchor="middle" font-size="8" fill="#1e40af">작업 위임</text>

  <line x1="200" y1="75" x2="245" y2="75" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="245" y="50" width="170" height="50" rx="8" fill="#fef9c3" stroke="#b45309" stroke-width="1.8"/>
  <text x="330" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">워크플로 코드(결정적)</text>
  <text x="330" y="88" text-anchor="middle" font-size="8" fill="#92400e">if/for, 순차 로직</text>

  <line x1="330" y1="100" x2="330" y2="130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <rect x="90" y="140" width="150" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="165" y="160" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">활동: LLM 호출</text>
  <text x="165" y="176" text-anchor="middle" font-size="8" fill="#065f46">결과를 저널에 1회 기록</text>

  <rect x="260" y="140" width="150" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="335" y="160" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">활동: 툴 호출</text>
  <text x="335" y="176" text-anchor="middle" font-size="8" fill="#065f46">부수효과, 멱등 보장 필요</text>

  <rect x="430" y="140" width="150" height="54" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="505" y="160" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">활동: 요약 생성</text>
  <text x="505" y="176" text-anchor="middle" font-size="8" fill="#065f46">최종 결과 반환</text>

  <line x1="240" y1="167" x2="258" y2="167" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrowW)"/>
  <line x1="410" y1="167" x2="428" y2="167" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrowW)"/>

  <rect x="90" y="220" width="490" height="54" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="335" y="242" text-anchor="middle" font-size="10" font-weight="bold" fill="#334155">저널(Event History) — 완료된 활동 결과가 순서대로 기록됨</text>
  <text x="335" y="260" text-anchor="middle" font-size="8.5" fill="#475569">LLM 응답처럼 큰 페이로드는 참조만 저장하고 실데이터는 외부 저장소로 오프로드</text>

  <line x1="165" y1="194" x2="165" y2="220" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="335" y1="194" x2="335" y2="220" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="505" y1="194" x2="505" y2="220" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="3,3"/>

  <text x="650" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">프로세스 재시작 (배포·장애)</text>
  <line x1="650" y1="210" x2="650" y2="240" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrowW)"/>
  <rect x="580" y="330" width="180" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="670" y="352" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">저널 재생(Replay)</text>
  <text x="670" y="368" text-anchor="middle" font-size="8" fill="#991b1b">완료 활동은 건너뜀</text>
  <text x="670" y="382" text-anchor="middle" font-size="8" fill="#991b1b">LLM 재호출 없음</text>

  <line x1="335" y1="274" x2="670" y2="330" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3,3"/>

  <text x="400" y="420" text-anchor="middle" font-size="9" fill="#4b5563">핵심: 워크플로 코드는 결정적으로 짜고, 비결정적인 LLM 호출은 활동으로 분리해 저널에 가둬야 재생이 안전하다</text>
</svg>
