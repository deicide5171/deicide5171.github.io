<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">포인트클라우드 옥트리(Octree) LOD 구조</text>

  <!-- density axis -->
  <line x1="40" y1="70" x2="40" y2="390" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="60" text-anchor="middle" font-size="12" fill="#666">점 밀도</text>
  <text x="20" y="230" text-anchor="middle" font-size="12" fill="#666" transform="rotate(-90 20 230)">낮음 → 높음</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- Root octree node -->
  <rect x="325" y="76" width="150" height="52" rx="6" fill="#0b5fa5" stroke="#083f6e" stroke-width="1.5"/>
  <text x="400" y="96" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Root Node</text>
  <text x="400" y="112" text-anchor="middle" font-size="10.5" fill="#dbeafe">전체 영역 · 저밀도 서브샘플</text>
  <!-- sparse dots inside root -->
  <g fill="#dbeafe">
    <circle cx="352" cy="120" r="1.6"/><circle cx="370" cy="115" r="1.6"/><circle cx="395" cy="121" r="1.6"/>
    <circle cx="418" cy="116" r="1.6"/><circle cx="440" cy="120" r="1.6"/><circle cx="405" cy="112" r="1.6"/>
  </g>

  <!-- connectors root -> 4 octant children (2 of 8 octants omitted for clarity, noted in label) -->
  <line x1="400" y1="128" x2="150" y2="196" stroke="#999" stroke-width="1.5"/>
  <line x1="400" y1="128" x2="310" y2="196" stroke="#999" stroke-width="1.5"/>
  <line x1="400" y1="128" x2="490" y2="196" stroke="#999" stroke-width="1.5"/>
  <line x1="400" y1="128" x2="650" y2="196" stroke="#999" stroke-width="1.5"/>
  <text x="400" y="150" text-anchor="middle" font-size="10.5" fill="#a33" font-weight="bold">공간을 8개 옥탄트로 분할(그림엔 4개만 표시)</text>

  <!-- Level 1 octant nodes -->
  <rect x="80" y="196" width="140" height="46" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="150" y="216" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Octant 1</text>
  <text x="150" y="232" text-anchor="middle" font-size="10" fill="#dbeafe">Level 1 · 중간 밀도</text>

  <rect x="240" y="196" width="140" height="46" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="310" y="216" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Octant 2</text>
  <text x="310" y="232" text-anchor="middle" font-size="10" fill="#dbeafe">Level 1 · 중간 밀도</text>

  <rect x="420" y="196" width="140" height="46" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="490" y="216" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Octant 3</text>
  <text x="490" y="232" text-anchor="middle" font-size="10" fill="#dbeafe">Level 1 · 중간 밀도</text>

  <rect x="580" y="196" width="140" height="46" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="650" y="216" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Octant 4</text>
  <text x="650" y="232" text-anchor="middle" font-size="10" fill="#dbeafe">Level 1 · 중간 밀도</text>

  <!-- Octant 3 is near camera -> further subdivided into leaf nodes -->
  <line x1="490" y1="242" x2="420" y2="312" stroke="#999" stroke-width="1.5"/>
  <line x1="490" y1="242" x2="560" y2="312" stroke="#999" stroke-width="1.5"/>

  <rect x="350" y="312" width="140" height="52" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="420" y="332" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Octant 3-A</text>
  <text x="420" y="348" text-anchor="middle" font-size="10" fill="#eafff0">Level 2 · 원본 해상도</text>
  <g fill="#eafff0">
    <circle cx="375" cy="356" r="1.4"/><circle cx="383" cy="352" r="1.4"/><circle cx="390" cy="358" r="1.4"/>
    <circle cx="398" cy="353" r="1.4"/><circle cx="405" cy="357" r="1.4"/><circle cx="412" cy="352" r="1.4"/>
    <circle cx="420" cy="358" r="1.4"/><circle cx="428" cy="353" r="1.4"/><circle cx="436" cy="357" r="1.4"/>
    <circle cx="443" cy="352" r="1.4"/><circle cx="450" cy="358" r="1.4"/><circle cx="458" cy="353" r="1.4"/>
  </g>

  <rect x="490" y="312" width="140" height="52" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="560" y="332" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Octant 3-B</text>
  <text x="560" y="348" text-anchor="middle" font-size="10" fill="#eafff0">Level 2 · 원본 해상도</text>
  <g fill="#eafff0">
    <circle cx="515" cy="356" r="1.4"/><circle cx="523" cy="352" r="1.4"/><circle cx="530" cy="358" r="1.4"/>
    <circle cx="538" cy="353" r="1.4"/><circle cx="545" cy="357" r="1.4"/><circle cx="552" cy="352" r="1.4"/>
    <circle cx="560" cy="358" r="1.4"/><circle cx="568" cy="353" r="1.4"/><circle cx="576" cy="357" r="1.4"/>
    <circle cx="583" cy="352" r="1.4"/><circle cx="590" cy="358" r="1.4"/><circle cx="598" cy="353" r="1.4"/>
  </g>

  <!-- other octants stay coarse -->
  <text x="150" y="268" text-anchor="middle" font-size="10" fill="#a33" font-weight="bold">포인트 예산 초과 &#8594; 더 세분화 안 함</text>
  <text x="650" y="268" text-anchor="middle" font-size="10" fill="#a33" font-weight="bold">카메라에서 멀어 서브샘플만 유지</text>

  <!-- camera icon near Octant 3-A/3-B -->
  <g transform="translate(650,345)">
    <polygon points="0,0 46,-16 46,16" fill="#ffb020" stroke="#a56a00" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#a56a00"/>
    <text x="-8" y="34" font-size="11.5" fill="#7a4b00" font-weight="bold" text-anchor="middle">카메라 시점</text>
  </g>
  <line x1="605" y1="340" x2="560" y2="335" stroke="#ffb020" stroke-width="2" stroke-dasharray="5,4"/>

  <text x="400" y="400" text-anchor="middle" font-size="11.5" fill="#555">각 노드는 원본 포인트의 일부만 담고 있어, 필요한 노드만 내려받아 화면에 합성한다(계층적 서브샘플링)</text>
  <text x="400" y="420" text-anchor="middle" font-size="11.5" fill="#555">카메라와 가까운 Octant 3만 재귀적으로 자식 노드(3-A, 3-B)를 로드해 점 밀도를 높인다</text>
</svg>
