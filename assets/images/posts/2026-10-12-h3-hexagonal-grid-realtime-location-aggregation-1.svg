<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">GPS 핑 → H3 셀 인코딩 → 실시간 집계 → 육각 지도 렌더링</text>

  <rect x="20" y="56" width="160" height="56" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="100" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#312e81">원시 GPS 스트림</text>
  <text x="100" y="94" text-anchor="middle" font-size="7.5" fill="#3730a3">(lat, lng, timestamp)</text>

  <line x1="180" y1="84" x2="250" y2="84" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <rect x="250" y="56" width="180" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="340" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">수집 파이프라인</text>
  <text x="340" y="94" text-anchor="middle" font-size="7.5" fill="#065f46">H3 셀 ID로 인코딩(해상도 고정)</text>

  <line x1="430" y1="84" x2="500" y2="84" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <rect x="500" y="56" width="180" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="590" y="78" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7c2d12">실시간 OLAP 스토어</text>
  <text x="590" y="94" text-anchor="middle" font-size="7.5" fill="#9a3412">h3_cell 정수 컬럼 저장</text>

  <line x1="590" y1="112" x2="590" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <rect x="430" y="150" width="320" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="590" y="172" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">GROUP BY h3_cell 집계 질의</text>
  <text x="590" y="190" text-anchor="middle" font-size="7.5" fill="#991b1b">좌표 비교 없이 정수 컬럼만으로 집계</text>

  <line x1="500" y1="206" x2="300" y2="250" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <rect x="80" y="250" width="320" height="56" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.8"/>
  <text x="240" y="272" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#581c87">대시보드 (deck.gl H3HexagonLayer)</text>
  <text x="240" y="290" text-anchor="middle" font-size="7.5" fill="#6b21a8">셀 ID → 육각 폴리곤 자동 렌더링</text>

  <!-- hex grid illustration -->
  <g transform="translate(540,250)">
    <polygon points="30,0 60,17 60,52 30,69 0,52 0,17" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.2"/>
    <polygon points="90,0 120,17 120,52 90,69 60,52 60,17" fill="#c4b5fd" stroke="#7c3aed" stroke-width="1.2"/>
    <polygon points="60,52 90,69 90,104 60,121 30,104 30,69" fill="#a78bfa" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="60" y="140" text-anchor="middle" font-size="7.5" fill="#581c87">모든 이웃 셀까지 거리 동일</text>
  </g>

  <rect x="150" y="360" width="500" height="70" rx="8" fill="#f0f7f4" stroke="#047857" stroke-width="1.5"/>
  <text x="400" y="382" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">핵심: 인코딩은 조회 시점이 아니라 수집 시점에</text>
  <text x="400" y="400" text-anchor="middle" font-size="8" fill="#065f46">원본 좌표도 함께 보관해야 해상도를 나중에 바꿀 수 있다</text>
  <text x="400" y="415" text-anchor="middle" font-size="8" fill="#065f46">법적 경계가 필요한 질의는 격자가 아닌 폴리곤 조인으로 분리</text>

  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
