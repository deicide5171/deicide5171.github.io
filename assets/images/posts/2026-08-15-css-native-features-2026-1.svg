<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">같은 카드 컴포넌트, 컨테이너 너비에 따라 레이아웃 전환</text>

  <!-- Narrow container -->
  <text x="190" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b5fa5">좁은 컨테이너 (사이드바)</text>
  <rect x="60" y="90" width="260" height="280" rx="8" fill="#f5f9ff" stroke="#1877c9" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="190" y="112" text-anchor="middle" font-size="10.5" fill="#0b5fa5">container: 260px</text>

  <rect x="80" y="130" width="220" height="110" rx="6" fill="#ffffff" stroke="#c8d8ec" stroke-width="1.5"/>
  <rect x="80" y="130" width="220" height="60" rx="6" fill="#dbeafe"/>
  <text x="190" y="165" text-anchor="middle" font-size="11" fill="#0b5fa5">썸네일 이미지</text>
  <text x="90" y="212" font-size="11" fill="#333">제목 텍스트</text>
  <text x="90" y="230" font-size="10" fill="#777">설명 한 줄 · 세로 스택</text>

  <text x="190" y="270" text-anchor="middle" font-size="11.5" fill="#a3550f" font-weight="bold">@container (max-width: 400px)</text>
  <text x="190" y="288" text-anchor="middle" font-size="10.5" fill="#a3550f">→ 이미지 위, 텍스트 아래 (세로 배치)</text>

  <!-- arrow between -->
  <line x1="335" y1="230" x2="445" y2="230" stroke="#999" stroke-width="2" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>
  <text x="390" y="215" text-anchor="middle" font-size="10" fill="#666">같은 컴포넌트</text>

  <!-- Wide container -->
  <text x="610" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f7a38">넓은 컨테이너 (본문 영역)</text>
  <rect x="450" y="90" width="300" height="280" rx="8" fill="#f5fff8" stroke="#2fa84f" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="600" y="112" text-anchor="middle" font-size="10.5" fill="#1f7a38">container: 300px</text>

  <rect x="470" y="150" width="260" height="90" rx="6" fill="#ffffff" stroke="#c8e6cf" stroke-width="1.5"/>
  <rect x="480" y="160" width="90" height="70" rx="5" fill="#d7f5df"/>
  <text x="525" y="200" text-anchor="middle" font-size="10" fill="#1f7a38">썸네일</text>
  <text x="585" y="188" font-size="11" fill="#333">제목 텍스트</text>
  <text x="585" y="206" font-size="10" fill="#777">설명 한 줄</text>
  <text x="585" y="222" font-size="10" fill="#777">가로 배치</text>

  <text x="600" y="270" text-anchor="middle" font-size="11.5" fill="#1f7a38" font-weight="bold">@container (min-width: 401px)</text>
  <text x="600" y="288" text-anchor="middle" font-size="10.5" fill="#1f7a38">→ 이미지 왼쪽, 텍스트 오른쪽 (가로 배치)</text>

  <text x="400" y="420" text-anchor="middle" font-size="12" fill="#555">부모(화면) 너비가 아니라 컴포넌트를 담은 컨테이너 자체의 너비를 기준으로 스타일이 바뀐다</text>
</svg>
