<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">Turf.js 브라우저 공간 연산 흐름</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#666">GeoJSON 입력 → 클라이언트 연산 → 지도 레이어 반영 (서버 왕복 없음)</text>

  <!-- Browser boundary -->
  <rect x="30" y="72" width="740" height="330" rx="10" fill="#fbfbfb" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="55" y="94" font-size="12" fill="#888">브라우저 (클라이언트) — 서버 요청 없음</text>

  <!-- GeoJSON input -->
  <rect x="55" y="110" width="150" height="54" rx="6" fill="#546e7a" stroke="#37474f" stroke-width="1.5"/>
  <text x="130" y="132" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">GeoJSON 입력</text>
  <text x="130" y="149" text-anchor="middle" font-size="10.5" fill="#e0e6e8">점 · 선 · 폴리곤</text>

  <line x1="205" y1="137" x2="255" y2="137" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <!-- Turf.js core -->
  <rect x="260" y="100" width="180" height="74" rx="8" fill="#0b8043" stroke="#06592c" stroke-width="1.5"/>
  <text x="350" y="128" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Turf.js</text>
  <text x="350" y="146" text-anchor="middle" font-size="10.5" fill="#dcf5e6">turf.buffer / turf.intersect</text>
  <text x="350" y="161" text-anchor="middle" font-size="10.5" fill="#dcf5e6">turf.distance 등</text>

  <line x1="440" y1="137" x2="490" y2="137" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Result GeoJSON -->
  <rect x="495" y="110" width="150" height="54" rx="6" fill="#546e7a" stroke="#37474f" stroke-width="1.5"/>
  <text x="570" y="132" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">결과 GeoJSON</text>
  <text x="570" y="149" text-anchor="middle" font-size="10.5" fill="#e0e6e8">새 지오메트리</text>

  <line x1="570" y1="164" x2="570" y2="196" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Map render -->
  <rect x="475" y="200" width="190" height="46" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="570" y="220" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">지도 레이어 렌더링</text>
  <text x="570" y="236" text-anchor="middle" font-size="10" fill="#dbeafe">MapLibre / OpenLayers 등</text>

  <!-- Three operation cards below -->
  <text x="400" y="272" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">대표 연산 3가지</text>

  <!-- Buffer -->
  <g transform="translate(85,290)">
    <rect x="0" y="0" width="190" height="100" rx="8" fill="#eaf5ee" stroke="#2fa84f" stroke-width="1.5"/>
    <circle cx="55" cy="42" r="14" fill="none" stroke="#2fa84f" stroke-width="2"/>
    <circle cx="55" cy="42" r="28" fill="#2fa84f" fill-opacity="0.18" stroke="#2fa84f" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="95" y="30" font-size="12.5" fill="#1f7a38" font-weight="bold">buffer</text>
    <text x="95" y="46" font-size="10.5" fill="#33513a">지점 → 반경 폴리곤</text>
    <text x="20" y="86" font-size="10" fill="#33513a">예: 반경 500m 상권</text>
  </g>

  <!-- Intersect -->
  <g transform="translate(305,290)">
    <rect x="0" y="0" width="190" height="100" rx="8" fill="#eaf0fb" stroke="#1877c9" stroke-width="1.5"/>
    <circle cx="45" cy="42" r="22" fill="#1877c9" fill-opacity="0.35" stroke="#1877c9" stroke-width="1.5"/>
    <circle cx="68" cy="42" r="22" fill="#0b5fa5" fill-opacity="0.35" stroke="#0b5fa5" stroke-width="1.5"/>
    <text x="115" y="30" font-size="12.5" fill="#0b5fa5" font-weight="bold">intersect</text>
    <text x="115" y="46" font-size="10.5" fill="#2b3a4a">두 폴리곤 교집합</text>
    <text x="20" y="86" font-size="10" fill="#2b3a4a">예: 배달구역 중첩 확인</text>
  </g>

  <!-- Distance -->
  <g transform="translate(525,290)">
    <rect x="0" y="0" width="190" height="100" rx="8" fill="#fdf3ea" stroke="#ffb020" stroke-width="1.5"/>
    <circle cx="30" cy="42" r="6" fill="#a56a00"/>
    <circle cx="90" cy="42" r="6" fill="#a56a00"/>
    <line x1="30" y1="42" x2="90" y2="42" stroke="#ffb020" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="115" y="30" font-size="12.5" fill="#a56a00" font-weight="bold">distance</text>
    <text x="115" y="46" font-size="10.5" fill="#4a3a1f">두 점 사이 거리</text>
    <text x="20" y="86" font-size="10" fill="#4a3a1f">예: 최근접 매장 탐색</text>
  </g>

  <text x="400" y="428" text-anchor="middle" font-size="11.5" fill="#555">연산이 클라이언트에서 끝나므로 서버 API 호출·지연 없이 지도 인터랙션과 함께 즉시 반영된다</text>
</svg>
