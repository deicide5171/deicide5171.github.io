<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">대축척 vs 소축척</text>

  <!-- Large scale panel -->
  <rect x="70" y="90" width="290" height="280" rx="12" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="215" y="122" font-family="sans-serif" font-size="18" font-weight="bold" fill="#03c75a" text-anchor="middle">대축척 (1:1,000)</text>
  <!-- detailed blocks -->
  <rect x="110" y="150" width="60" height="45" fill="#cfe8dc" stroke="#03c75a"/>
  <rect x="180" y="150" width="60" height="45" fill="#cfe8dc" stroke="#03c75a"/>
  <rect x="250" y="150" width="70" height="45" fill="#cfe8dc" stroke="#03c75a"/>
  <rect x="110" y="205" width="90" height="50" fill="#cfe8dc" stroke="#03c75a"/>
  <rect x="210" y="205" width="110" height="50" fill="#cfe8dc" stroke="#03c75a"/>
  <line x1="110" y1="270" x2="320" y2="270" stroke="#2a8f66" stroke-width="4"/>
  <text x="215" y="300" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">좁은 지역 · 건물·골목 상세</text>
  <text x="215" y="330" font-family="sans-serif" font-size="13" fill="#777" text-anchor="middle">지도 1cm = 실제 10m</text>

  <!-- Small scale panel -->
  <rect x="440" y="90" width="290" height="280" rx="12" fill="#eef6ff" stroke="#3b7dd8" stroke-width="2"/>
  <text x="585" y="122" font-family="sans-serif" font-size="18" font-weight="bold" fill="#3b7dd8" text-anchor="middle">소축척 (1:1,000,000)</text>
  <!-- coarse region -->
  <path d="M490,160 Q540,145 590,165 T690,175 L680,240 Q600,260 520,245 L490,210 Z"
        fill="#d3e4fa" stroke="#3b7dd8" stroke-width="1.5"/>
  <circle cx="560" cy="200" r="4" fill="#3b7dd8"/>
  <text x="568" y="197" font-family="sans-serif" font-size="11" fill="#333">도시</text>
  <circle cx="640" cy="215" r="4" fill="#3b7dd8"/>
  <text x="648" y="212" font-family="sans-serif" font-size="11" fill="#333">도시</text>
  <text x="585" y="300" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">넓은 지역 · 개략적</text>
  <text x="585" y="330" font-family="sans-serif" font-size="13" fill="#777" text-anchor="middle">지도 1cm = 실제 10km</text>

  <text x="400" y="410" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">분수로 크면 대축척(상세) · 작으면 소축척(개략) · 웹지도는 줌 레벨로 표현</text>
</svg>
