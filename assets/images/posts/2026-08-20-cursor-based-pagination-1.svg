<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">OFFSET vs 커서 기반 페이지네이션 — 3페이지 이동 시 동작 차이</text>
  <text x="400" y="46" text-anchor="middle" font-size="11.5" fill="#666">같은 "다음 페이지" 요청도 DB 내부에서는 전혀 다르게 처리된다</text>

  <defs>
    <marker id="arrowB" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#555"/>
    </marker>
    <marker id="arrowR" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c9701d"/>
    </marker>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2fa84f"/>
    </marker>
  </defs>

  <!-- LEFT: OFFSET -->
  <rect x="26" y="64" width="352" height="354" rx="8" fill="#fff4e5" stroke="#c9701d" stroke-width="2"/>
  <text x="202" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a3550f">OFFSET 페이지네이션</text>
  <text x="202" y="105" text-anchor="middle" font-size="10.5" fill="#a3550f">LIMIT 20 OFFSET 4000</text>

  <!-- row strip -->
  <rect x="42" y="120" width="320" height="26" rx="3" fill="#f0d9bd" stroke="#c9701d"/>
  <text x="52" y="137" font-size="9.5" fill="#7a4a10">id 1 ~ 4000 (건너뛸 행) — 서버가 매번 처음부터 스캔</text>

  <rect x="42" y="150" width="320" height="26" rx="3" fill="#ffffff" stroke="#2fa84f" stroke-width="1.5"/>
  <text x="52" y="167" font-size="9.5" fill="#1f7a38">id 4001 ~ 4020 (실제 반환되는 20행)</text>

  <line x1="60" y1="146" x2="60" y2="150" stroke="#c9701d" stroke-width="1.5" stroke-dasharray="3,2"/>

  <text x="202" y="196" text-anchor="middle" font-size="10" fill="#a3550f">→ 페이지 번호(200페이지째)가 커질수록</text>
  <text x="202" y="212" text-anchor="middle" font-size="10" fill="#a3550f">건너뛰는 행 수도 함께 늘어난다</text>

  <rect x="42" y="228" width="320" height="70" rx="5" fill="#ffffff" stroke="#c9701d"/>
  <text x="202" y="246" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">문제 1 — 스캔 비용 증가</text>
  <text x="202" y="261" text-anchor="middle" font-size="9" fill="#666">OFFSET이 커질수록 스캔 후 버리는</text>
  <text x="202" y="274" text-anchor="middle" font-size="9" fill="#666">행이 늘어 뒷페이지일수록 느려짐</text>
  <text x="202" y="290" text-anchor="middle" font-size="9" fill="#666">(스캔 비용은 O(offset + limit))</text>

  <rect x="42" y="306" width="320" height="70" rx="5" fill="#ffffff" stroke="#c9701d"/>
  <text x="202" y="324" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">문제 2 — 페이지 밀림/중복</text>
  <text x="202" y="339" text-anchor="middle" font-size="9" fill="#666">조회 중간에 행이 추가·삭제되면</text>
  <text x="202" y="352" text-anchor="middle" font-size="9" fill="#666">OFFSET 기준 위치가 밀려서</text>
  <text x="202" y="365" text-anchor="middle" font-size="9" fill="#666">항목이 중복 노출되거나 누락됨</text>

  <text x="202" y="400" text-anchor="middle" font-size="9.5" fill="#a3550f">주로 쓰는 곳: 페이지 번호 클릭형 목록(1,2,3…)</text>

  <!-- MIDDLE ARROW -->
  <line x1="380" y1="230" x2="418" y2="230" stroke="#555" stroke-width="2" marker-end="url(#arrowB)"/>
  <text x="399" y="218" text-anchor="middle" font-size="9.5" fill="#555">대용량·</text>
  <text x="399" y="248" text-anchor="middle" font-size="9.5" fill="#555">무한스크롤</text>

  <!-- RIGHT: 커서 기반 -->
  <rect x="422" y="64" width="352" height="354" rx="8" fill="#eaffef" stroke="#2fa84f" stroke-width="2"/>
  <text x="598" y="88" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1f7a38">커서 기반(Keyset) 페이지네이션</text>
  <text x="598" y="105" text-anchor="middle" font-size="10.5" fill="#1f7a38">WHERE id &gt; 4000 ORDER BY id LIMIT 20</text>

  <rect x="438" y="120" width="320" height="26" rx="3" fill="#ffffff" stroke="#2fa84f" stroke-width="1.5"/>
  <text x="448" y="137" font-size="9.5" fill="#1f7a38">인덱스가 id=4000 위치로 바로 이동(seek)</text>

  <rect x="438" y="150" width="320" height="26" rx="3" fill="#ffffff" stroke="#2fa84f" stroke-width="1.5"/>
  <text x="448" y="167" font-size="9.5" fill="#1f7a38">id 4001 ~ 4020 (실제 반환되는 20행)</text>

  <line x1="598" y1="146" x2="598" y2="150" stroke="#2fa84f" stroke-width="2" marker-end="url(#arrowG)"/>

  <text x="598" y="196" text-anchor="middle" font-size="10" fill="#1f7a38">→ 이전 페이지 마지막 id(커서) 값만으로</text>
  <text x="598" y="212" text-anchor="middle" font-size="10" fill="#1f7a38">인덱스를 즉시 탐색(seek), 앞부분 스캔 없음</text>

  <rect x="438" y="228" width="320" height="70" rx="5" fill="#ffffff" stroke="#2fa84f"/>
  <text x="598" y="246" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">장점 1 — 일정한 응답 속도</text>
  <text x="598" y="261" text-anchor="middle" font-size="9" fill="#666">몇 페이지째든 스캔 비용이</text>
  <text x="598" y="274" text-anchor="middle" font-size="9" fill="#666">거의 O(limit)로 일정하게 유지됨</text>

  <rect x="438" y="306" width="320" height="70" rx="5" fill="#ffffff" stroke="#2fa84f"/>
  <text x="598" y="324" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#333">장점 2 — 안정적인 결과</text>
  <text x="598" y="339" text-anchor="middle" font-size="9" fill="#666">커서가 "행 번호"가 아니라</text>
  <text x="598" y="352" text-anchor="middle" font-size="9" fill="#666">"고유하고 정렬 가능한 값"이라</text>
  <text x="598" y="365" text-anchor="middle" font-size="9" fill="#666">중간에 데이터가 변해도 밀리지 않음</text>

  <text x="598" y="400" text-anchor="middle" font-size="9.5" fill="#1f7a38">주로 쓰는 곳: 무한 스크롤, API 목록 조회</text>

</svg>
