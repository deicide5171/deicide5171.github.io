<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .box { fill:#f4f8ff; stroke:#3b6fd6; stroke-width:1.5; }
    .box2 { fill:#fff4ec; stroke:#d97b3f; stroke-width:1.5; }
    .box3 { fill:#f0fbf4; stroke:#2f9e5b; stroke-width:1.5; }
    .lbl { font-size:12.5px; fill:#1a1a1a; }
    .sub { font-size:10.5px; fill:#555; }
    .title { font-size:16px; font-weight:bold; fill:#1a1a1a; }
    .arrow { stroke:#555; stroke-width:1.5; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="20" y="25" class="title">GeoVolumes 모듈이 서는 자리 — 변환 파이프라인 바깥쪽</text>

  <rect x="20" y="55" width="160" height="75" rx="6" class="box"/>
  <text x="100" y="80" text-anchor="middle" class="lbl">원본 3D 모델</text>
  <text x="100" y="97" text-anchor="middle" class="sub">BIM / 메시</text>
  <text x="100" y="113" text-anchor="middle" class="sub">포인트클라우드</text>

  <line x1="180" y1="92" x2="220" y2="92" class="arrow"/>

  <rect x="225" y="55" width="190" height="75" rx="6" class="box2"/>
  <text x="320" y="78" text-anchor="middle" class="lbl">3D Tiles 변환 파이프라인</text>
  <text x="320" y="97" text-anchor="middle" class="sub">Cesium ion / 3d-tiles-tools</text>
  <text x="320" y="113" text-anchor="middle" class="sub">자체 타일링 배치 (팀이 구축)</text>

  <line x1="320" y1="130" x2="320" y2="165" class="arrow"/>

  <rect x="225" y="170" width="190" height="60" rx="6" class="box"/>
  <text x="320" y="193" text-anchor="middle" class="lbl">정적 3D Tiles / i3s 파일</text>
  <text x="320" y="210" text-anchor="middle" class="sub">geovolumes 디렉토리에 배포</text>

  <line x1="320" y1="230" x2="320" y2="265" class="arrow"/>

  <rect x="195" y="270" width="250" height="90" rx="8" class="box3"/>
  <text x="320" y="293" text-anchor="middle" class="lbl">GeoServer</text>
  <text x="320" y="310" text-anchor="middle" fill="#2f9e5b" class="sub">OGC API 3D GeoVolumes 모듈</text>
  <text x="320" y="327" text-anchor="middle" class="sub">변환·렌더링 없음</text>
  <text x="320" y="343" text-anchor="middle" class="sub">표준 API 엔드포인트로 노출만</text>

  <line x1="445" y1="315" x2="520" y2="315" class="arrow"/>

  <rect x="525" y="280" width="220" height="70" rx="6" class="box"/>
  <text x="635" y="303" text-anchor="middle" class="lbl">클라이언트</text>
  <text x="635" y="320" text-anchor="middle" class="sub">CesiumJS 등 3D 뷰어</text>
  <text x="635" y="336" text-anchor="middle" class="sub">OGC API로 타일 조회</text>

  <text x="320" y="400" text-anchor="middle" class="sub" fill="#d97b3f">⚠ 변환 파이프라인이 없으면 GeoVolumes만 설치해도 서빙할 데이터가 없다</text>
</svg>
