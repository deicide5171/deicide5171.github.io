<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">공간 버퍼 — 대상 주위로 영역 넓히기</text>

  <!-- Point buffer -->
  <rect x="60" y="90" width="220" height="270" rx="12" fill="#fafafa" stroke="#ddd"/>
  <text x="170" y="122" font-family="sans-serif" font-size="17" font-weight="bold" fill="#03c75a" text-anchor="middle">점 → 원</text>
  <circle cx="170" cy="230" r="70" fill="#03c75a" fill-opacity="0.18" stroke="#03c75a" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="170" cy="230" r="7" fill="#03c75a"/>
  <text x="170" y="330" font-family="sans-serif" font-size="13" fill="#777" text-anchor="middle">반경 500m 영향권</text>

  <!-- Line buffer -->
  <rect x="290" y="90" width="220" height="270" rx="12" fill="#fafafa" stroke="#ddd"/>
  <text x="400" y="122" font-family="sans-serif" font-size="17" font-weight="bold" fill="#3b7dd8" text-anchor="middle">선 → 띠</text>
  <path d="M330,300 L360,200 L440,240 L470,160" fill="none" stroke="#3b7dd8" stroke-width="34" stroke-opacity="0.18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330,300 L360,200 L440,240 L470,160" fill="none" stroke="#3b7dd8" stroke-width="3"/>
  <text x="400" y="330" font-family="sans-serif" font-size="13" fill="#777" text-anchor="middle">도로 양옆 10m</text>

  <!-- Polygon buffer -->
  <rect x="520" y="90" width="220" height="270" rx="12" fill="#fafafa" stroke="#ddd"/>
  <text x="630" y="122" font-family="sans-serif" font-size="17" font-weight="bold" fill="#e08e2b" text-anchor="middle">면 → 커진 면</text>
  <polygon points="580,270 590,180 680,175 700,250 640,300" fill="none" stroke="#e08e2b" stroke-width="24" stroke-opacity="0.18" stroke-linejoin="round"/>
  <polygon points="580,270 590,180 680,175 700,250 640,300" fill="#e08e2b" fill-opacity="0.35" stroke="#e08e2b" stroke-width="2"/>
  <text x="630" y="330" font-family="sans-serif" font-size="13" fill="#777" text-anchor="middle">바깥으로 확장</text>

  <text x="400" y="405" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">버퍼로 "영향권"을 만들고 그 안의 대상을 찾는다</text>
</svg>
