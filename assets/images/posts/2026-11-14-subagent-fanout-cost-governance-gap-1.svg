<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">서브에이전트 팬아웃에서 비용 통제가 걸리는 네 지점</text>

  <!-- Orchestrator -->
  <rect x="40" y="70" width="160" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="120" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e1b4b">오케스트레이터</text>
  <text x="120" y="118" text-anchor="middle" font-size="11" fill="#1e1b4b">(메인 에이전트)</text>

  <!-- arrow fanout -->
  <line x1="200" y1="105" x2="280" y2="105" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="95" text-anchor="middle" font-size="10" fill="#666">① 정의 시점</text>

  <!-- Subagent definition box -->
  <rect x="280" y="55" width="190" height="100" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="375" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">서브에이전트 정의</text>
  <text x="375" y="98" text-anchor="middle" font-size="11" fill="#9a3412">model: 고정 가능</text>
  <text x="375" y="116" text-anchor="middle" font-size="11" fill="#9a3412">effort/thinking: 불가</text>
  <text x="375" y="134" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="bold">← 예방 통제 공백</text>

  <!-- arrow to fanout -->
  <line x1="470" y1="105" x2="550" y2="105" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="95" text-anchor="middle" font-size="10" fill="#666">② 실행 시점</text>

  <!-- fanout of N subagents -->
  <rect x="550" y="55" width="190" height="30" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="645" y="75" text-anchor="middle" font-size="11" fill="#155e75">서브에이전트 #1</text>
  <rect x="550" y="90" width="190" height="30" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="645" y="110" text-anchor="middle" font-size="11" fill="#155e75">서브에이전트 #2 … #N</text>
  <text x="645" y="140" text-anchor="middle" font-size="10" fill="#666">maxTurns로만 상한 가능</text>

  <!-- middle layer: gateway budget -->
  <rect x="280" y="210" width="280" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">게이트웨이 예산 (budget)</text>
  <text x="420" y="256" text-anchor="middle" font-size="11" fill="#14532d">API 키 단위로 상한 설정 가능</text>
  <text x="420" y="274" text-anchor="middle" font-size="11" fill="#b45309">③ 실행 중 차단 — 하지만 키 단위라 거칠다</text>

  <line x1="375" y1="155" x2="375" y2="210" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="645" y1="155" x2="500" y2="210" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- bottom layer: cost report API -->
  <rect x="280" y="340" width="280" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="420" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">GET /analytics/cost (2.1.317)</text>
  <text x="420" y="386" text-anchor="middle" font-size="11" fill="#7f1d1d">개발자·일자·IdP 그룹별 집계</text>
  <text x="420" y="404" text-anchor="middle" font-size="11" fill="#b45309">④ 사후 집계 — 이미 쓴 돈을 보는 것</text>

  <line x1="420" y1="290" x2="420" y2="340" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>
</svg>
