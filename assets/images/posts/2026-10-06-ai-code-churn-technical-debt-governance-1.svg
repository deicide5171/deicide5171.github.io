<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">생성 속도 측정에서 배포 후 처언 측정 + 피드백 루프로</text>

  <rect x="40" y="52" width="130" height="46" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="105" y="72" text-anchor="middle" font-size="10" fill="#312e81">에이전트</text>
  <text x="105" y="86" text-anchor="middle" font-size="9" fill="#3730a3">코드 생성</text>

  <line x1="170" y1="75" x2="200" y2="75" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowD)"/>

  <rect x="200" y="52" width="130" height="46" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="265" y="72" text-anchor="middle" font-size="10" fill="#312e81">PR 오픈</text>
  <text x="265" y="86" text-anchor="middle" font-size="9" fill="#3730a3">+38% YoY</text>

  <line x1="330" y1="75" x2="360" y2="75" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowD)"/>

  <rect x="360" y="52" width="130" height="46" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="425" y="72" text-anchor="middle" font-size="10" fill="#312e81">사람+봇 리뷰</text>
  <text x="425" y="86" text-anchor="middle" font-size="9" fill="#3730a3">리뷰 시간 +67%</text>

  <line x1="490" y1="75" x2="520" y2="75" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowD)"/>

  <rect x="520" y="52" width="110" height="46" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="575" y="78" text-anchor="middle" font-size="10" fill="#312e81">머지·배포</text>

  <line x1="575" y1="98" x2="575" y2="124" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowD)"/>

  <rect x="430" y="124" width="290" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="575" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">배포 후 관측 레이어 (기존엔 없던 지점)</text>
  <text x="575" y="162" text-anchor="middle" font-size="9" fill="#991b1b">코드 처언률(2주 내 되돌림 +39%) · 결함 밀도 · PR당 이슈 1.7배</text>
  <text x="575" y="176" text-anchor="middle" font-size="9" fill="#991b1b">측정이 없으면 "속도만 보이는" 착시가 발생</text>

  <line x1="430" y1="154" x2="270" y2="154" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowD2)"/>
  <line x1="270" y1="154" x2="270" y2="200" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowD2)"/>

  <rect x="100" y="200" width="340" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="270" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">피드백 → 에이전트 워크플로 조정</text>
  <text x="270" y="240" text-anchor="middle" font-size="9" fill="#92400e">역할 분리(작성자·테스터·리뷰어·릴리스 플래너)</text>
  <text x="270" y="256" text-anchor="middle" font-size="9" fill="#92400e">위험 영역엔 사람 승인 게이트 추가</text>

  <line x1="270" y1="268" x2="105" y2="75" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowD3)"/>

  <rect x="60" y="300" width="680" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/>
  <text x="400" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#1f2937">팀 규모별 거버넌스 성숙도 (2026년 8.1M PR / 4,800팀 분석)</text>
  <text x="400" y="348" text-anchor="middle" font-size="10" fill="#374151">대규모(201~1,000명) — 61%가 구조화된 에이전트+사람 감독 워크플로 → 이슈율 37%(최저)</text>
  <text x="400" y="368" text-anchor="middle" font-size="10" fill="#374151">소규모 팀 — 약 1/3만 구조화된 워크플로 사용 → 이슈율 상대적으로 높음</text>
  <text x="400" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">핵심: 팀 규모가 아니라 "구조화 수준"이 선택 변수</text>

  <defs>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowD2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowD3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
