<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- Pod boundary -->
  <rect x="40" y="40" width="720" height="260" rx="14" fill="#f7f9fc" stroke="#555" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="400" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">파드(Pod) 경계 — 사람 1~2명 + 에이전트 2~4개</text>

  <!-- Human lead -->
  <rect x="70" y="90" width="150" height="90" rx="10" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="145" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f3b6e">사람 리드</text>
  <text x="145" y="140" text-anchor="middle" font-size="11" fill="#333">전략적 문제 분해</text>
  <text x="145" y="158" text-anchor="middle" font-size="11" fill="#333">아키텍처 지점 승인</text>

  <!-- Agent roles -->
  <rect x="260" y="90" width="140" height="70" rx="8" fill="#fff3e0" stroke="#d98c00" stroke-width="2"/>
  <text x="330" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5600">아키텍처 제안</text>
  <text x="330" y="136" text-anchor="middle" font-size="10" fill="#333">에이전트</text>

  <rect x="420" y="90" width="140" height="70" rx="8" fill="#fff3e0" stroke="#d98c00" stroke-width="2"/>
  <text x="490" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5600">구현</text>
  <text x="490" y="136" text-anchor="middle" font-size="10" fill="#333">에이전트</text>

  <rect x="260" y="180" width="140" height="70" rx="8" fill="#fff3e0" stroke="#d98c00" stroke-width="2"/>
  <text x="330" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5600">QA·테스트</text>
  <text x="330" y="226" text-anchor="middle" font-size="10" fill="#333">에이전트</text>

  <rect x="420" y="180" width="140" height="70" rx="8" fill="#fff3e0" stroke="#d98c00" stroke-width="2"/>
  <text x="490" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a5600">보안 리뷰</text>
  <text x="490" y="226" text-anchor="middle" font-size="10" fill="#333">에이전트</text>

  <!-- Gate -->
  <polygon points="650,110 720,150 650,190 580,150" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
  <text x="650" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a2015">아키텍처</text>
  <text x="650" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a2015">변경점 게이트</text>

  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  <line x1="220" y1="125" x2="260" y2="125" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="400" y1="125" x2="420" y2="125" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="400" y1="215" x2="420" y2="215" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="560" y1="125" x2="580" y2="145" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="650" y1="190" x2="145" y2="180" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow3)"/>
  <text x="400" y="260" text-anchor="middle" font-size="11" fill="#8a2015">게이트 통과 실패 시에만 사람에게 되돌아감</text>

  <!-- Bottom: governance -->
  <rect x="60" y="330" width="680" height="100" rx="10" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
  <text x="400" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">파드 밖 거버넌스 — 확장 전에 먼저 갖출 것</text>
  <text x="400" y="380" text-anchor="middle" font-size="11" fill="#333">에이전트 신원 인벤토리(누가 몇 개를 쥐고 있는가)</text>
  <text x="400" y="400" text-anchor="middle" font-size="11" fill="#333">파드 간 보안 리뷰 에이전트 공유 여부 결정</text>
  <text x="400" y="420" text-anchor="middle" font-size="11" fill="#333">리뷰 병목 지표 측정(개인 레인 수 기준)</text>
</svg>
