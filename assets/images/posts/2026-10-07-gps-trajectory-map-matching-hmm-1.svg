<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">맵매칭 파이프라인 — 원시 GPS에서 깨끗한 경로까지</text>

  <rect x="30" y="54" width="130" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="95" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">GPS 센서</text>
  <text x="95" y="92" text-anchor="middle" font-size="8" fill="#991b1b">(위도,경도,시간)</text>

  <line x1="160" y1="82" x2="205" y2="82" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <rect x="205" y="54" width="150" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="280" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">원시 좌표 스트림</text>
  <text x="280" y="90" text-anchor="middle" font-size="8" fill="#991b1b">건물·강 위로 튐</text>

  <line x1="280" y1="110" x2="280" y2="135" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <rect x="150" y="135" width="260" height="90" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="280" y="157" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">맵매칭 엔진 (HMM + Viterbi)</text>
  <text x="280" y="174" text-anchor="middle" font-size="8" fill="#3730a3">방출확률: 관측점↔후보도로 거리</text>
  <text x="280" y="188" text-anchor="middle" font-size="8" fill="#3730a3">전이확률: 연속점 사이 도로망 이동성</text>
  <text x="280" y="204" text-anchor="middle" font-size="8" fill="#3730a3">→ 가장 그럴듯한 경로 복원</text>

  <line x1="410" y1="180" x2="460" y2="180" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="3,3"/>

  <rect x="460" y="135" width="150" height="90" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="535" y="155" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">도로망 그래프</text>
  <text x="535" y="172" text-anchor="middle" font-size="8" fill="#4b5563">OSM / Overture</text>
  <text x="535" y="186" text-anchor="middle" font-size="8" fill="#4b5563">Maps 교통 레이어</text>
  <text x="535" y="202" text-anchor="middle" font-size="8" fill="#4b5563">후보 세그먼트 제공</text>

  <line x1="280" y1="225" x2="280" y2="250" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <rect x="150" y="250" width="260" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="280" y="277" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">도로망에 붙은 깨끗한 경로</text>

  <line x1="220" y1="296" x2="150" y2="330" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowD)"/>
  <line x1="340" y1="296" x2="410" y2="330" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowD)"/>

  <rect x="40" y="330" width="220" height="56" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="150" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">라우팅 엔진</text>
  <text x="150" y="368" text-anchor="middle" font-size="8" fill="#065f46">실거리·ETA 재계산</text>

  <rect x="300" y="330" width="220" height="56" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="410" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">지도 렌더링</text>
  <text x="410" y="368" text-anchor="middle" font-size="8" fill="#065f46">MapLibre 폴리라인 표시</text>

  <rect x="580" y="250" width="190" height="130" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="675" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c2d12">최근접 스냅의 실패</text>
  <text x="675" y="292" text-anchor="middle" font-size="8" fill="#7c2d12">교차로 근처 GPS 오차 →</text>
  <text x="675" y="306" text-anchor="middle" font-size="8" fill="#7c2d12">옆 도로가 더 가까우면</text>
  <text x="675" y="320" text-anchor="middle" font-size="8" fill="#7c2d12">바로 그 도로로 꺾어버림</text>
  <text x="675" y="340" text-anchor="middle" font-size="8" fill="#7c2d12">HMM은 전체 궤적 문맥을</text>
  <text x="675" y="354" text-anchor="middle" font-size="8" fill="#7c2d12">함께 봐서 이를 방지</text>
  <text x="675" y="370" text-anchor="middle" font-size="8" font-weight="bold" fill="#9a3412">시간순서 + 연결성 = 핵심</text>

  <defs>
    <marker id="arrowC" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>
</svg>
