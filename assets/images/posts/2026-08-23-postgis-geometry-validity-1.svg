<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="38" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">꼬인 폴리곤(자기 교차) 진단과 ST_MakeValid 복구</text>

  <!-- 왼쪽 패널: 잘못된 입력 -->
  <rect x="30" y="60" width="330" height="330" rx="10" fill="#fdf3f3" stroke="#d9534f" stroke-width="1.5"/>
  <text x="195" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">입력: ST_IsValid = false</text>

  <!-- 나비넥타이 폴리곤 (자기 교차) -->
  <path d="M 90 140 L 300 260 L 90 260 L 300 140 Z" fill="#f5c6c6" fill-opacity="0.6" stroke="#c0392b" stroke-width="2.5"/>
  <!-- 꼭짓점 -->
  <circle cx="90" cy="140" r="4" fill="#c0392b"/>
  <circle cx="300" cy="260" r="4" fill="#c0392b"/>
  <circle cx="90" cy="260" r="4" fill="#c0392b"/>
  <circle cx="300" cy="140" r="4" fill="#c0392b"/>
  <!-- 자기 교차점 -->
  <circle cx="195" cy="200" r="9" fill="none" stroke="#d9534f" stroke-width="3"/>
  <circle cx="195" cy="200" r="3.5" fill="#d9534f"/>
  <text x="195" y="182" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d9534f" text-anchor="middle">자기 교차점</text>

  <text x="195" y="300" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">경계선이 서로를 가로지르는 폴리곤</text>
  <text x="195" y="330" font-family="sans-serif" font-size="14" fill="#777777" text-anchor="middle">ST_IsValidReason 결과:</text>
  <text x="195" y="356" font-family="sans-serif" font-size="14" fill="#555555" text-anchor="middle">"Self-intersection[195 200]"</text>

  <!-- 가운데 화살표 -->
  <line x1="368" y1="225" x2="424" y2="225" stroke="#2e7d32" stroke-width="4"/>
  <path d="M 424 225 L 408 216 L 408 234 Z" fill="#2e7d32"/>
  <text x="398" y="204" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2e7d32" text-anchor="middle">ST_MakeValid</text>

  <!-- 오른쪽 패널: 복구 결과 -->
  <rect x="440" y="60" width="330" height="330" rx="10" fill="#f0f7f4" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="605" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="middle">결과: 유효한 MULTIPOLYGON</text>

  <!-- 왼쪽 삼각형 -->
  <path d="M 500 140 L 605 200 L 500 260 Z" fill="#bfe3cd" stroke="#2e7d32" stroke-width="2.5"/>
  <!-- 오른쪽 삼각형 -->
  <path d="M 710 140 L 605 200 L 710 260 Z" fill="#bfe3cd" stroke="#2e7d32" stroke-width="2.5"/>
  <!-- 공유 꼭짓점 -->
  <circle cx="605" cy="200" r="5" fill="#2e7d32"/>
  <text x="533" y="205" font-family="sans-serif" font-size="14" fill="#1b5e20" text-anchor="middle">A</text>
  <text x="677" y="205" font-family="sans-serif" font-size="14" fill="#1b5e20" text-anchor="middle">B</text>

  <text x="605" y="300" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">교차점에서 분리된 두 개의 유효한 폴리곤</text>
  <text x="605" y="330" font-family="sans-serif" font-size="14" fill="#555555" text-anchor="middle">입력 면적이 그대로 보존된다</text>
  <text x="605" y="356" font-family="sans-serif" font-size="14" fill="#777777" text-anchor="middle">(한 점에서만 맞닿는 것은 유효)</text>

  <!-- 하단 주의 문구 -->
  <text x="400" y="426" font-family="sans-serif" font-size="15" fill="#b26a00" text-anchor="middle">주의: ST_Buffer(geom, 0)로 고치면 한쪽 날개(A 또는 B)가 통째로 사라질 수 있다</text>
</svg>
