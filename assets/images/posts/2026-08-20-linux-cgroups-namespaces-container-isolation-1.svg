<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">네임스페이스 + cgroups = "컨테이너"</text>
  <text x="400" y="43" text-anchor="middle" font-size="11.5" fill="#666">두 컨테이너는 서로 다른 커널을 쓰는 게 아니라, 같은 커널 위에서 뷰와 자원이 분리된 프로세스일 뿐이다</text>

  <!-- Container A -->
  <rect x="30" y="58" width="350" height="194" rx="8" fill="#fafafa" stroke="#666" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="46" y="76" font-size="12" font-weight="bold" fill="#222">컨테이너 A (격리된 프로세스 그룹)</text>

  <g font-size="9.5">
    <rect x="46" y="88" width="92" height="36" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.1"/>
    <text x="92" y="102" text-anchor="middle" font-weight="bold" fill="#1f3a7a">PID NS</text>
    <text x="92" y="116" text-anchor="middle" fill="#555" font-size="8.5">격리된 PID 1</text>

    <rect x="148" y="88" width="92" height="36" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.1"/>
    <text x="194" y="102" text-anchor="middle" font-weight="bold" fill="#1f3a7a">Net NS</text>
    <text x="194" y="116" text-anchor="middle" fill="#555" font-size="8.5">독립 IP·라우팅</text>

    <rect x="250" y="88" width="92" height="36" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.1"/>
    <text x="296" y="102" text-anchor="middle" font-weight="bold" fill="#1f3a7a">Mount NS</text>
    <text x="296" y="116" text-anchor="middle" fill="#555" font-size="8.5">독자 파일시스템</text>

    <rect x="46" y="130" width="92" height="36" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.1"/>
    <text x="92" y="144" text-anchor="middle" font-weight="bold" fill="#1f3a7a">UTS NS</text>
    <text x="92" y="158" text-anchor="middle" fill="#555" font-size="8.5">호스트명 분리</text>

    <rect x="148" y="130" width="92" height="36" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.1"/>
    <text x="194" y="144" text-anchor="middle" font-weight="bold" fill="#1f3a7a">IPC NS</text>
    <text x="194" y="158" text-anchor="middle" fill="#555" font-size="8.5">공유메모리 분리</text>

    <rect x="250" y="130" width="92" height="36" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.1"/>
    <text x="296" y="144" text-anchor="middle" font-weight="bold" fill="#1f3a7a">User NS</text>
    <text x="296" y="158" text-anchor="middle" fill="#555" font-size="8.5">UID/GID 매핑</text>
  </g>

  <rect x="46" y="174" width="296" height="40" rx="6" fill="#fff2e0" stroke="#d97706" stroke-width="1.2"/>
  <text x="194" y="190" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a4b00">cgroup 자원 제한</text>
  <text x="194" y="204" text-anchor="middle" font-size="8.5" fill="#8a4b00">cpu.max · memory.max · io.max</text>

  <text x="205" y="238" text-anchor="middle" font-size="9" fill="#888">namespace(뷰 분리) + cgroup(자원 제한) 조합 = 하나의 "컨테이너"</text>

  <!-- Container B -->
  <rect x="420" y="58" width="350" height="194" rx="8" fill="#fafafa" stroke="#666" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="436" y="76" font-size="12" font-weight="bold" fill="#222">컨테이너 B (격리된 프로세스 그룹)</text>

  <g font-size="9.5">
    <rect x="436" y="88" width="92" height="36" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.1"/>
    <text x="482" y="102" text-anchor="middle" font-weight="bold" fill="#1f3a7a">PID NS</text>
    <text x="482" y="116" text-anchor="middle" fill="#555" font-size="8.5">격리된 PID 1</text>

    <rect x="538" y="88" width="92" height="36" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.1"/>
    <text x="584" y="102" text-anchor="middle" font-weight="bold" fill="#1f3a7a">Net NS</text>
    <text x="584" y="116" text-anchor="middle" fill="#555" font-size="8.5">독립 IP·라우팅</text>

    <rect x="640" y="88" width="92" height="36" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.1"/>
    <text x="686" y="102" text-anchor="middle" font-weight="bold" fill="#1f3a7a">Mount NS</text>
    <text x="686" y="116" text-anchor="middle" fill="#555" font-size="8.5">독자 파일시스템</text>

    <rect x="436" y="130" width="92" height="36" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.1"/>
    <text x="482" y="144" text-anchor="middle" font-weight="bold" fill="#1f3a7a">UTS NS</text>
    <text x="482" y="158" text-anchor="middle" fill="#555" font-size="8.5">호스트명 분리</text>

    <rect x="538" y="130" width="92" height="36" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.1"/>
    <text x="584" y="144" text-anchor="middle" font-weight="bold" fill="#1f3a7a">IPC NS</text>
    <text x="584" y="158" text-anchor="middle" fill="#555" font-size="8.5">공유메모리 분리</text>

    <rect x="640" y="130" width="92" height="36" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.1"/>
    <text x="686" y="144" text-anchor="middle" font-weight="bold" fill="#1f3a7a">User NS</text>
    <text x="686" y="158" text-anchor="middle" fill="#555" font-size="8.5">UID/GID 매핑</text>
  </g>

  <rect x="436" y="174" width="296" height="40" rx="6" fill="#fff2e0" stroke="#d97706" stroke-width="1.2"/>
  <text x="584" y="190" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a4b00">cgroup 자원 제한</text>
  <text x="584" y="204" text-anchor="middle" font-size="8.5" fill="#8a4b00">cpu.max · memory.max · io.max</text>

  <text x="595" y="238" text-anchor="middle" font-size="9" fill="#888">namespace(뷰 분리) + cgroup(자원 제한) 조합 = 하나의 "컨테이너"</text>

  <!-- arrows down to shared kernel -->
  <line x1="205" y1="252" x2="205" y2="278" stroke="#3b6fd6" stroke-width="1.4" marker-end="url(#arrowBlue)"/>
  <line x1="595" y1="252" x2="595" y2="278" stroke="#3b6fd6" stroke-width="1.4" marker-end="url(#arrowBlue)"/>
  <text x="400" y="268" text-anchor="middle" font-size="9.5" fill="#888">동일한 시스템 콜 인터페이스</text>

  <!-- Kernel box -->
  <rect x="30" y="280" width="740" height="100" rx="8" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="400" y="300" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f3a7a">리눅스 커널 — 단일 인스턴스 (호스트와 모든 컨테이너가 공유)</text>
  <text x="400" y="326" text-anchor="middle" font-size="10.5" fill="#1f3a7a">네임스페이스: 프로세스마다 PID·네트워크·마운트 등 커널 자료구조의 "보이는 범위"를 다르게 부여</text>
  <text x="400" y="350" text-anchor="middle" font-size="10.5" fill="#1f3a7a">cgroups: 프로세스 그룹 단위로 CPU·메모리·블록 I/O 사용량에 상한을 걸어 서로 침범하지 못하게 강제</text>

  <text x="400" y="405" text-anchor="middle" font-size="10.5" fill="#555">컨테이너는 VM처럼 별도 커널을 갖는 것이 아니라, 같은 커널 위에서 격리·제한된 프로세스일 뿐이다</text>
  <text x="400" y="422" text-anchor="middle" font-size="9.5" fill="#999">격리 강도는 하이퍼바이저 기반 VM보다 약하지만, 프로세스 하나를 띄우는 것과 오버헤드 차이가 거의 없다</text>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3b6fd6"/>
    </marker>
  </defs>
</svg>
