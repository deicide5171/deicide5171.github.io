<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>

  <defs>
    <marker id="arrows" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
    <marker id="arrows-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="400" y="32" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">직접 호출 vs 큐 기반 핸드오프 — 장애 전파 범위</text>

  <!-- Direct call -->
  <text x="195" y="62" font-size="13" text-anchor="middle" fill="#9e3f2c" font-weight="bold">직접 호출</text>
  <rect x="50" y="75" width="120" height="60" rx="8" fill="#fdeee8" stroke="#d4714a" stroke-width="1.5"/>
  <text x="110" y="100" font-size="12" text-anchor="middle" fill="#9e3f2c" font-weight="bold">에이전트 A</text>
  <text x="110" y="118" font-size="10" text-anchor="middle" fill="#555">조사</text>

  <path d="M 170 105 L 215 105" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrows-red)"/>
  <text x="192" y="97" font-size="9" text-anchor="middle" fill="#c0392b">동기 호출</text>

  <rect x="220" y="75" width="120" height="60" rx="8" fill="#fdeee8" stroke="#d4714a" stroke-width="1.5"/>
  <text x="280" y="100" font-size="12" text-anchor="middle" fill="#9e3f2c" font-weight="bold">에이전트 B</text>
  <text x="280" y="118" font-size="10" text-anchor="middle" fill="#555">작성(지연/재시도)</text>

  <rect x="60" y="150" width="270" height="55" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="195" y="172" font-size="11" text-anchor="middle" fill="#8e2a1e" font-weight="bold">B의 지연·실패·재시도가</text>
  <text x="195" y="190" font-size="11" text-anchor="middle" fill="#8e2a1e" font-weight="bold">A까지 그대로 전파</text>

  <!-- Divider -->
  <line x1="400" y1="55" x2="400" y2="420" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Queue-based -->
  <text x="605" y="62" font-size="13" text-anchor="middle" fill="#2c4a9e" font-weight="bold">큐 기반 핸드오프</text>
  <rect x="460" y="75" width="110" height="60" rx="8" fill="#eef1fb" stroke="#5b6fd4" stroke-width="1.5"/>
  <text x="515" y="100" font-size="12" text-anchor="middle" fill="#2c3a9e" font-weight="bold">에이전트 A</text>
  <text x="515" y="118" font-size="10" text-anchor="middle" fill="#555">적재 후 종료</text>

  <path d="M 570 105 L 605 105" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrows)"/>

  <rect x="610" y="78" width="120" height="55" rx="20" fill="#fff" stroke="#999" stroke-width="1.5"/>
  <text x="670" y="100" font-size="11" text-anchor="middle" fill="#555" font-weight="bold">메시지 큐</text>
  <text x="670" y="116" font-size="9" text-anchor="middle" fill="#999">참조 ID만 적재</text>

  <path d="M 670 135 L 670 170" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrows)"/>

  <rect x="605" y="175" width="130" height="60" rx="8" fill="#eaf7ee" stroke="#4aa26f" stroke-width="1.5"/>
  <text x="670" y="198" font-size="12" text-anchor="middle" fill="#276b43" font-weight="bold">에이전트 B</text>
  <text x="670" y="216" font-size="10" text-anchor="middle" fill="#555">자신의 속도로 소비</text>

  <rect x="460" y="255" width="280" height="80" rx="8" fill="#e8f0fe" stroke="#4a6fd4" stroke-width="1.5"/>
  <text x="600" y="278" font-size="11" text-anchor="middle" fill="#2c4a9e" font-weight="bold">B가 느려져도</text>
  <text x="600" y="296" font-size="11" text-anchor="middle" fill="#2c4a9e" font-weight="bold">메시지는 큐에 쌓일 뿐</text>
  <text x="600" y="314" font-size="11" text-anchor="middle" fill="#2c4a9e" font-weight="bold">A는 영향받지 않음(백프레셔)</text>

  <!-- Caption -->
  <text x="400" y="440" font-size="12" text-anchor="middle" fill="#444">상태는 별도 DB에, 소비자는 멱등하게 — 재전달돼도 중복 실행되지 않는다</text>
</svg>
