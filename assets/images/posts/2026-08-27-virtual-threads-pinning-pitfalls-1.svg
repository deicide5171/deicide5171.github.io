<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">synchronized 피닝 vs ReentrantLock 정상 언마운트</text>

  <!-- 피닝 발생 -->
  <text x="40" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="#d0413b">피닝 발생 — synchronized 블록 안에서 블로킹 I/O</text>

  <rect x="40" y="84" width="330" height="150" rx="8" fill="#fdf1f0" stroke="#e2a6a1"/>
  <text x="56" y="106" font-family="sans-serif" font-size="13" fill="#a13a34">캐리어 스레드 #1 (OS 스레드)</text>

  <rect x="60" y="118" width="290" height="46" rx="6" fill="#ffffff" stroke="#d0413b" stroke-width="2"/>
  <text x="205" y="140" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">가상 스레드 A (synchronized 안)</text>
  <text x="205" y="156" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#a13a34">블로킹 I/O 중에도 고정됨</text>

  <rect x="60" y="172" width="290" height="40" rx="6" fill="#f4f4f4" stroke="#bbb" stroke-dasharray="4,3"/>
  <text x="205" y="197" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#999">가상 스레드 B, C ... 대기 (캐리어 못 씀)</text>

  <text x="205" y="245" font-family="sans-serif" font-size="12" fill="#d0413b" text-anchor="middle" font-weight="bold">동시성이 캐리어 개수로 축소</text>

  <!-- 정상 언마운트 -->
  <text x="430" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a6b45">정상 — ReentrantLock, 언마운트되어 캐리어 반납</text>

  <rect x="430" y="84" width="330" height="150" rx="8" fill="#eef8f1" stroke="#a8d9bd"/>
  <text x="446" y="106" font-family="sans-serif" font-size="13" fill="#1a6b45">캐리어 스레드 #1 (OS 스레드)</text>

  <rect x="450" y="118" width="290" height="40" rx="6" fill="#ffffff" stroke="#2e9e63" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="595" y="142" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#666">가상 스레드 A 블로킹 → 언마운트되어 대기 큐로</text>

  <rect x="450" y="164" width="290" height="46" rx="6" fill="#ffffff" stroke="#2e9e63" stroke-width="2"/>
  <text x="595" y="186" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">가상 스레드 B (lock.lock() 획득)</text>
  <text x="595" y="202" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#1a6b45">비어있는 캐리어를 즉시 사용</text>

  <text x="595" y="245" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle" font-weight="bold">캐리어가 계속 다른 작업을 처리</text>

  <text x="400" y="300" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">JDK 24(JEP 491)부터는 synchronized도 피닝 없이 언마운트되지만,</text>
  <text x="400" y="322" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">그 이전 버전이거나 JNI 네이티브 호출 중이라면 여전히 ReentrantLock 교체가 필요하다</text>

  <text x="400" y="400" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">감지: -Djdk.tracePinnedThreads=full 또는 JFR의 jdk.VirtualThreadPinned 이벤트</text>
</svg>
