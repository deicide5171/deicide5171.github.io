<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; }
    .boxGood { fill: #f0f7f4; stroke: #2e8b57; stroke-width: 2; }
    .boxBase { fill: #eef2fb; stroke: #3a5fcd; stroke-width: 2; }
    .label { font-size: 14px; fill: #222222; text-anchor: middle; }
    .sublabel { font-size: 11px; fill: #555555; text-anchor: middle; }
    .arrow { stroke: #666666; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .title { font-size: 15px; font-weight: bold; fill: #222222; }
    .goodtext { font-size: 12px; fill: #1f6b42; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666666" />
    </marker>
  </defs>

  <text x="20" y="28" class="title">현대화 결정의 세 레이어</text>

  <rect x="40" y="45" width="720" height="60" class="box" />
  <text x="400" y="68" class="label">① 리스크·규제 동인 — 왜 지금 건드리는가</text>
  <text x="400" y="88" class="sublabel">보안 EOL · 컴플라이언스 요건 · 제로 트러스트 · 비즈니스 요구 변화</text>

  <line x1="400" y1="105" x2="400" y2="130" class="arrow" />

  <rect x="40" y="135" width="720" height="60" class="box" />
  <text x="400" y="158" class="label">② 4R 방식 선택 — 어떻게 옮길 것인가</text>
  <text x="400" y="178" class="sublabel">Rehost · Replatform · Refactor · Rebuild</text>

  <line x1="400" y1="195" x2="400" y2="220" class="arrow" />

  <rect x="40" y="225" width="720" height="60" class="box" />
  <text x="400" y="248" class="label">③ 실행 계획 — 어떤 순서로 손댈 것인가</text>
  <text x="400" y="268" class="sublabel">영향 범위 작은 모듈부터 점진적 전환, 되돌림 지점 확보</text>

  <rect x="40" y="320" width="720" height="70" class="boxGood" />
  <text x="400" y="345" class="label">이해 단계 — 현재 시스템의 데이터 흐름·숨은 의존성·암묵 규칙 파악</text>
  <text x="400" y="365" class="goodtext">세 레이어 모두를 가로질러 받친다 — 생략하면 ③에서 숨은 의존성이 터진다</text>

  <line x1="400" y1="285" x2="400" y2="318" class="arrow" stroke-dasharray="5,4" />
  <line x1="150" y1="320" x2="150" y2="200" class="arrow" stroke-dasharray="5,4" />
  <line x1="650" y1="320" x2="650" y2="110" class="arrow" stroke-dasharray="5,4" />

</svg>
