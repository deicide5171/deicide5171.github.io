<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="195" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">단일 리뷰 게이트 (기존)</text>
  <text x="605" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">2단 게이트 + PR 분할</text>
  <line x1="400" y1="15" x2="400" y2="430" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Left: single gate bottleneck -->
  <rect x="115" y="55" width="160" height="40" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="195" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d50">에이전트 코드 생성</text>

  <line x1="195" y1="95" x2="195" y2="130" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="115" y="130" width="160" height="40" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="195" y="155" text-anchor="middle" font-size="11" fill="#1f2d50">대형 PR 생성 (PR당 평균 길이 ↑)</text>

  <line x1="195" y1="170" x2="195" y2="205" stroke="#c23b3b" stroke-width="2" marker-end="url(#arrowred)"/>

  <rect x="90" y="205" width="210" height="65" rx="6" fill="#fdecec" stroke="#c23b3b" stroke-width="2.5"/>
  <text x="195" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a1f1f">사람 리뷰어 (단일 게이트)</text>
  <text x="195" y="245" text-anchor="middle" font-size="10" fill="#7a1f1f">처리량 그대로 — 병목 발생</text>
  <text x="195" y="259" text-anchor="middle" font-size="10" fill="#7a1f1f">리뷰 대기열 적체</text>

  <line x1="195" y1="270" x2="195" y2="305" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="115" y="305" width="160" height="40" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="195" y="330" text-anchor="middle" font-size="12" fill="#333">머지 (지연)</text>

  <!-- Right: two-tier gate -->
  <rect x="525" y="55" width="160" height="40" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="605" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d50">에이전트 코드 생성</text>

  <line x1="605" y1="95" x2="605" y2="125" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="525" y="125" width="160" height="40" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="605" y="144" text-anchor="middle" font-size="10" fill="#1f2d50">스택형 소형 PR로 분할</text>
  <text x="605" y="157" text-anchor="middle" font-size="9" fill="#1f2d50">(리뷰 가능한 단위)</text>

  <line x1="605" y1="165" x2="605" y2="195" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arrowgreen)"/>

  <rect x="505" y="195" width="200" height="45" rx="6" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="2"/>
  <text x="605" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d6b3d">1차 게이트: 자동 리뷰</text>
  <text x="605" y="230" text-anchor="middle" font-size="9" fill="#1d6b3d">린트·보안 스캔·agentic reviewer</text>

  <line x1="605" y1="240" x2="605" y2="270" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arrowgreen)"/>

  <rect x="505" y="270" width="200" height="50" rx="6" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="2"/>
  <text x="605" y="289" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d6b3d">2차 게이트: 사람 리뷰어</text>
  <text x="605" y="304" text-anchor="middle" font-size="9" fill="#1d6b3d">아키텍처·의도 중심만 확인</text>

  <line x1="605" y1="320" x2="605" y2="350" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="525" y="350" width="160" height="40" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="605" y="375" text-anchor="middle" font-size="12" fill="#333">머지 (지연 감소)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c23b3b"/>
    </marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e9e5b"/>
    </marker>
  </defs>
</svg>
