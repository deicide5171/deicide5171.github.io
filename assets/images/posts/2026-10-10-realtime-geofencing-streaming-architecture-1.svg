<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">실시간 지오펜싱 — 어디서 판정할 것인가</text>

  <rect x="20" y="52" width="130" height="54" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
  <text x="85" y="76" text-anchor="middle" font-size="9" font-weight="bold" fill="#312e81">디바이스</text>
  <text x="85" y="90" text-anchor="middle" font-size="7.5" fill="#312e81">GPS 수신</text>

  <text x="110" y="130" text-anchor="middle" font-size="8" fill="#64748b">옵션 A</text>
  <rect x="20" y="140" width="130" height="50" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="85" y="162" text-anchor="middle" font-size="8" font-weight="bold" fill="#7c2d12">디바이스 SDK</text>
  <text x="85" y="176" text-anchor="middle" font-size="7.2" fill="#7c2d12">온디바이스 판정</text>

  <line x1="150" y1="79" x2="330" y2="79" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrowL)"/>

  <rect x="330" y="52" width="150" height="54" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/>
  <text x="405" y="72" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e293b">이벤트 스트림</text>
  <text x="405" y="88" text-anchor="middle" font-size="7.5" fill="#1e293b">(Kafka 등)</text>

  <line x1="480" y1="79" x2="330" y2="79" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3,3"/>

  <text x="580" y="60" text-anchor="middle" font-size="8" fill="#64748b">옵션 C</text>
  <rect x="520" y="52" width="150" height="54" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/>
  <text x="595" y="72" text-anchor="middle" font-size="8" font-weight="bold" fill="#164e63">통신사 네트워크</text>
  <text x="595" y="88" text-anchor="middle" font-size="7.2" fill="#164e63">CAMARA 구독형</text>

  <line x1="405" y1="106" x2="405" y2="136" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrowL)"/>

  <text x="300" y="128" text-anchor="middle" font-size="8" fill="#64748b">옵션 B — 서버 스트리밍</text>
  <rect x="280" y="136" width="250" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="405" y="160" text-anchor="middle" font-size="9" font-weight="bold" fill="#14532d">지오펜스 판정 엔진</text>
  <text x="405" y="176" text-anchor="middle" font-size="7.5" fill="#14532d">공간 인덱스 조인 + 디바운스/dwell</text>
  <text x="405" y="189" text-anchor="middle" font-size="7.2" fill="#14532d">(materialized view)</text>

  <line x1="595" y1="106" x2="430" y2="136" stroke="#9ca3af" stroke-width="1.2" marker-end="url(#arrowL)"/>

  <line x1="405" y1="196" x2="405" y2="226" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrowL)"/>

  <rect x="255" y="226" width="300" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="405" y="248" text-anchor="middle" font-size="9" font-weight="bold" fill="#7f1d1d">ENTER / EXIT 이벤트 발행</text>
  <text x="405" y="264" text-anchor="middle" font-size="7.5" fill="#7f1d1d">멱등 키로 중복 발행 방지</text>

  <line x1="405" y1="278" x2="405" y2="306" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrowL)"/>

  <rect x="150" y="306" width="150" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="225" y="335" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#4c1d95">알림/쿠폰 발송</text>

  <rect x="320" y="306" width="150" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="395" y="335" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#4c1d95">운영 대시보드</text>

  <rect x="490" y="306" width="150" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="565" y="335" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#4c1d95">웹훅/다운스트림</text>

  <text x="400" y="400" text-anchor="middle" font-size="8" fill="#94a3b8">배터리·프라이버시는 A, 처리량·정확도는 B, 네트워크 커버리지 의존은 C가 가진 트레이드오프</text>

  <defs>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
