<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">deck.gl TripsLayer — 좌표+타임스탬프 경로를 시간 애니메이션으로</text>

  <!-- Step 1: raw trip data -->
  <text x="140" y="60" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">1) 원본 Trip 데이터</text>
  <rect x="40" y="75" width="240" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="60" y="100" font-size="10.5" fill="#475569" font-family="monospace">{ path: [[x1,y1],[x2,y2],...],</text>
  <text x="70" y="115" font-size="10.5" fill="#475569" font-family="monospace">timestamps: [0, 12, 25, 40, ...] }</text>
  <path d="M60,140 L100,150 L140,135 L180,160 L220,145 L255,170" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="60" cy="140" r="3" fill="#64748b"/>
  <circle cx="100" cy="150" r="3" fill="#64748b"/>
  <circle cx="140" cy="135" r="3" fill="#64748b"/>
  <circle cx="180" cy="160" r="3" fill="#64748b"/>
  <circle cx="220" cy="145" r="3" fill="#64748b"/>
  <circle cx="255" cy="170" r="3" fill="#64748b"/>
  <text x="160" y="205" text-anchor="middle" font-size="10" fill="#475569">각 정점마다 좌표 + 경과 시각(timestamp)</text>

  <path d="M290,150 L340,150" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrTr)"/>
  <defs>
    <marker id="arrTr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Step 2: currentTime shader clipping -->
  <text x="480" y="60" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">2) currentTime 기준 GPU 셰이더 클리핑</text>
  <rect x="350" y="75" width="330" height="150" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <path d="M370,140 L410,150 L450,135 L490,160" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <path d="M490,160 L530,145 L565,170" fill="none" stroke="#bfdbfe" stroke-width="4" stroke-linecap="round" stroke-dasharray="2,4"/>
  <circle cx="490" cy="160" r="6" fill="#1d4ed8"/>
  <text x="490" y="185" text-anchor="middle" font-size="10" fill="#1e3a8a">currentTime 시점 = 이동 중인 점</text>
  <text x="515" y="205" text-anchor="middle" font-size="10" fill="#3b5a9a">지나온 구간(실선, trailLength) vs 아직 안 지난 구간(점선)</text>

  <!-- bottom: comparison table-like boxes -->
  <rect x="40" y="250" width="720" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">GPU 시간축 애니메이션의 핵심 — CPU 재계산 없음</text>

  <rect x="70" y="295" width="320" height="105" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="230" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">일반적인 방식 (지양)</text>
  <text x="230" y="340" text-anchor="middle" font-size="10.5" fill="#991b1b">매 프레임 JS에서 현재 시각까지의</text>
  <text x="230" y="356" text-anchor="middle" font-size="10.5" fill="#991b1b">좌표 배열을 다시 계산해 GPU에 재업로드</text>
  <text x="230" y="378" text-anchor="middle" font-size="10.5" fill="#991b1b">→ 경로·차량 수가 늘면 CPU 병목</text>

  <rect x="410" y="295" width="320" height="105" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="570" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">TripsLayer 방식</text>
  <text x="570" y="340" text-anchor="middle" font-size="10.5" fill="#0d7a5f">전체 경로+타임스탬프를 GPU 버퍼에 한 번만 업로드</text>
  <text x="570" y="356" text-anchor="middle" font-size="10.5" fill="#0d7a5f">currentTime uniform만 매 프레임 갱신</text>
  <text x="570" y="378" text-anchor="middle" font-size="10.5" fill="#0d7a5f">→ 셰이더가 GPU에서 직접 클리핑</text>
</svg>
