<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">병목은 사라진 게 아니라 옮겨갔다</text>

  <line x1="730" y1="62" x2="730" y2="320" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="736" y="58" font-size="10" fill="#aaa">도입 전 리드타임</text>

  <!-- Bar 1 -->
  <text x="30" y="80" font-size="12" font-weight="bold" fill="#666">AI 도구 도입 전</text>
  <rect x="30"  y="88" width="130" height="44" fill="#dbe4ee" stroke="#8fa3b8"/>
  <rect x="160" y="88" width="390" height="44" fill="#cfe4f7" stroke="#6aa9d8"/>
  <rect x="550" y="88" width="120" height="44" fill="#fde8d0" stroke="#e0a060"/>
  <rect x="670" y="88" width="60"  height="44" fill="#d9f0e2" stroke="#66b98a"/>
  <text x="95"  y="115" text-anchor="middle" font-size="12" fill="#333">설계</text>
  <text x="355" y="115" text-anchor="middle" font-size="12" fill="#333">구현</text>
  <text x="610" y="115" text-anchor="middle" font-size="12" fill="#333">리뷰</text>
  <text x="700" y="115" text-anchor="middle" font-size="11" fill="#333">배포</text>

  <!-- Bar 2 -->
  <text x="30" y="170" font-size="12" font-weight="bold" fill="#c0392b">AI 도구 도입 후 — 생성은 빨라졌는데 전체는 더 길어진다</text>
  <rect x="30"  y="178" width="110" height="44" fill="#dbe4ee" stroke="#8fa3b8"/>
  <rect x="140" y="178" width="150" height="44" fill="#cfe4f7" stroke="#6aa9d8"/>
  <rect x="290" y="178" width="420" height="44" fill="#f8d0d0" stroke="#d05050" stroke-width="1.6"/>
  <rect x="710" y="178" width="60"  height="44" fill="#d9f0e2" stroke="#66b98a"/>
  <text x="85"  y="205" text-anchor="middle" font-size="12" fill="#333">설계</text>
  <text x="215" y="205" text-anchor="middle" font-size="12" fill="#333">구현</text>
  <text x="500" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#8b2b2b">리뷰</text>
  <text x="500" y="216" text-anchor="middle" font-size="11" fill="#8b2b2b">맥락을 복원하는 시간</text>
  <text x="740" y="205" text-anchor="middle" font-size="11" fill="#333">배포</text>

  <!-- Bar 3 -->
  <text x="30" y="260" font-size="12" font-weight="bold" fill="#2e7d54">스펙을 앞에 두면 — 검증이 '열린 판단'에서 '대조'로 바뀐다</text>
  <rect x="30"  y="268" width="230" height="44" fill="#cde9d8" stroke="#03a65a" stroke-width="1.6"/>
  <rect x="260" y="268" width="150" height="44" fill="#cfe4f7" stroke="#6aa9d8"/>
  <rect x="410" y="268" width="120" height="44" fill="#fde8d0" stroke="#e0a060"/>
  <rect x="530" y="268" width="60"  height="44" fill="#d9f0e2" stroke="#66b98a"/>
  <text x="145" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f6b46">스펙 · 설계</text>
  <text x="145" y="306" text-anchor="middle" font-size="11" fill="#2e7d54">수용 기준 · 리뷰 포인트 합의</text>
  <text x="335" y="295" text-anchor="middle" font-size="12" fill="#333">구현</text>
  <text x="470" y="295" text-anchor="middle" font-size="12" fill="#333">리뷰</text>
  <text x="560" y="295" text-anchor="middle" font-size="11" fill="#333">배포</text>

  <text x="30" y="352" font-size="12.5" font-weight="bold" fill="#c05621">① 리뷰가 느린 이유는 코드량이 아니라, 판단 기준이 리뷰 시점에야 만들어지기 때문이다</text>
  <text x="30" y="378" font-size="12.5" fill="#444">② 기준을 앞으로 옮기면 리뷰어가 하는 일이 "이게 좋은 코드인가"에서 "합의한 기준을 만족하는가"로 바뀐다</text>
  <text x="30" y="404" font-size="12.5" fill="#444">③ 같은 스펙을 에이전트에게도 주면, 애초에 기준을 벗어난 코드가 덜 나온다</text>
  <text x="30" y="432" font-size="11" fill="#999">막대 길이는 리드타임 비중을 나타낸 도식이며 실제 측정값이 아니다</text>
</svg>
