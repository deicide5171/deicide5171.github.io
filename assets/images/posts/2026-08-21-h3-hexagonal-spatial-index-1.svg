<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">H3 육각형 계층 인덱스 — 격자 구조와 해상도 계층</text>

  <!-- divider -->
  <line x1="400" y1="45" x2="400" y2="420" stroke="#e2e2e2" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- LEFT PANEL: hexagon grid, equal neighbor distance -->
  <text x="190" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">① 육각형 격자 — 모든 이웃까지 거리가 같다</text>

  <!-- 6 neighbor hexagons -->
  <polygon points="270.0,279.6 250.0,314.3 210.0,314.3 190.0,279.6 210.0,245.0 250.0,245.0" fill="#dcefe3" stroke="#2f9e58" stroke-width="1.5"/>
  <polygon points="270.0,210.4 250.0,245.0 210.0,245.0 190.0,210.4 210.0,175.7 250.0,175.7" fill="#dcefe3" stroke="#2f9e58" stroke-width="1.5"/>
  <polygon points="150.0,279.6 130.0,314.3 90.0,314.3 70.0,279.6 90.0,245.0 130.0,245.0" fill="#dcefe3" stroke="#2f9e58" stroke-width="1.5"/>
  <polygon points="150.0,210.4 130.0,245.0 90.0,245.0 70.0,210.4 90.0,175.7 130.0,175.7" fill="#dcefe3" stroke="#2f9e58" stroke-width="1.5"/>
  <polygon points="210.0,314.3 190.0,348.9 150.0,348.9 130.0,314.3 150.0,279.6 190.0,279.6" fill="#dcefe3" stroke="#2f9e58" stroke-width="1.5"/>
  <polygon points="210.0,175.7 190.0,210.4 150.0,210.4 130.0,175.7 150.0,141.1 190.0,141.1" fill="#dcefe3" stroke="#2f9e58" stroke-width="1.5"/>

  <!-- center hexagon -->
  <polygon points="210.0,245.0 190.0,279.6 150.0,279.6 130.0,245.0 150.0,210.4 190.0,210.4" fill="#2f9e58" stroke="#1f7a40" stroke-width="1.8"/>

  <!-- distance lines from center to each neighbor centroid -->
  <line x1="170" y1="245" x2="230" y2="279.6" stroke="#c0392b" stroke-width="1.3"/>
  <line x1="170" y1="245" x2="230" y2="210.4" stroke="#c0392b" stroke-width="1.3"/>
  <line x1="170" y1="245" x2="110" y2="279.6" stroke="#c0392b" stroke-width="1.3"/>
  <line x1="170" y1="245" x2="110" y2="210.4" stroke="#c0392b" stroke-width="1.3"/>
  <line x1="170" y1="245" x2="170" y2="314.3" stroke="#c0392b" stroke-width="1.3"/>
  <line x1="170" y1="245" x2="170" y2="175.7" stroke="#c0392b" stroke-width="1.3"/>

  <text x="170" y="249" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">C</text>
  <text x="205" y="255" font-size="9.5" fill="#c0392b">d</text>
  <text x="203" y="228" font-size="9.5" fill="#c0392b">d</text>

  <text x="190" y="378" text-anchor="middle" font-size="11" fill="#555">중심 셀 C에서 6개 이웃까지의 거리 d가 전부 동일하다</text>
  <text x="190" y="393" text-anchor="middle" font-size="11" fill="#555">(사각형 격자는 상하좌우와 대각선 거리가 다르다)</text>

  <!-- RIGHT PANEL: parent-child hierarchy -->
  <text x="610" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">② 계층적 해상도 — 부모 셀과 자식 셀</text>

  <!-- parent outline -->
  <polygon points="692.0,245.0 646.0,324.7 554.0,324.7 508.0,245.0 554.0,165.3 646.0,165.3" fill="none" stroke="#0b5fa5" stroke-width="2.5" stroke-dasharray="5,3"/>

  <!-- 7 child hexagons -->
  <polygon points="634.0,245.0 617.0,274.4 583.0,274.4 566.0,245.0 583.0,215.6 617.0,215.6" fill="#a9cff0" stroke="#0b5fa5" stroke-width="1.3"/>
  <polygon points="685.0,274.4 668.0,303.9 634.0,303.9 617.0,274.4 634.0,245.0 668.0,245.0" fill="#c9e2f7" stroke="#0b5fa5" stroke-width="1.3"/>
  <polygon points="685.0,215.6 668.0,245.0 634.0,245.0 617.0,215.6 634.0,186.1 668.0,186.1" fill="#c9e2f7" stroke="#0b5fa5" stroke-width="1.3"/>
  <polygon points="583.0,274.4 566.0,303.9 532.0,303.9 515.0,274.4 532.0,245.0 566.0,245.0" fill="#c9e2f7" stroke="#0b5fa5" stroke-width="1.3"/>
  <polygon points="583.0,215.6 566.0,245.0 532.0,245.0 515.0,215.6 532.0,186.1 566.0,186.1" fill="#c9e2f7" stroke="#0b5fa5" stroke-width="1.3"/>
  <polygon points="634.0,303.9 617.0,333.3 583.0,333.3 566.0,303.9 583.0,274.4 617.0,274.4" fill="#c9e2f7" stroke="#0b5fa5" stroke-width="1.3"/>
  <polygon points="634.0,186.1 617.0,215.6 583.0,215.6 566.0,186.1 583.0,156.7 617.0,156.7" fill="#c9e2f7" stroke="#0b5fa5" stroke-width="1.3"/>

  <text x="600" y="249" text-anchor="middle" font-size="10" fill="#0b3d63" font-weight="bold">R+1</text>

  <text x="610" y="145" text-anchor="middle" font-size="11.5" fill="#0b5fa5" font-weight="bold">부모 셀 (해상도 R)</text>
  <line x1="610" y1="150" x2="610" y2="163" stroke="#0b5fa5" stroke-width="1" marker-end="url(#arrow)"/>

  <text x="610" y="378" text-anchor="middle" font-size="11" fill="#555">부모 1개가 더 세밀한 자식 셀 여러 개로 근사 분할된다</text>
  <text x="610" y="393" text-anchor="middle" font-size="11" fill="#555">(해상도가 1단계 높아질수록 셀 면적은 약 1/7로 작아진다)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0b5fa5"/>
    </marker>
  </defs>
</svg>
