<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">ADR이 에이전트 워크플로에 끼어드는 세 지점</text>

  <rect x="330" y="50" width="140" height="56" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="400" y="74" text-anchor="middle" font-size="10" font-weight="bold" fill="#312e81">ADR 저장소</text>
  <text x="400" y="90" text-anchor="middle" font-size="8.5" fill="#3730a3">(Git 또는 MCP 서버)</text>

  <line x1="360" y1="106" x2="190" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <line x1="400" y1="106" x2="400" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <line x1="440" y1="106" x2="610" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <rect x="60" y="150" width="190" height="80" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="155" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">① 참조 (Context)</text>
  <text x="155" y="190" text-anchor="middle" font-size="8" fill="#065f46">작업 시작 전</text>
  <text x="155" y="203" text-anchor="middle" font-size="8" fill="#065f46">관련 ADR을 읽어</text>
  <text x="155" y="216" text-anchor="middle" font-size="8" fill="#065f46">제약을 파악</text>

  <rect x="305" y="150" width="190" height="80" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.8"/>
  <text x="400" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#581c87">② 생성 (Authoring)</text>
  <text x="400" y="190" text-anchor="middle" font-size="8" fill="#6b21a8">새 결정이 생기면</text>
  <text x="400" y="203" text-anchor="middle" font-size="8" fill="#6b21a8">ADR 초안을</text>
  <text x="400" y="216" text-anchor="middle" font-size="8" fill="#6b21a8">직접 제안</text>

  <rect x="550" y="150" width="190" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="645" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c2d12">③ 강제 (Gating)</text>
  <text x="645" y="190" text-anchor="middle" font-size="8" fill="#9a3412">PR 머지 전</text>
  <text x="645" y="203" text-anchor="middle" font-size="8" fill="#9a3412">기존 ADR과 대조해</text>
  <text x="645" y="216" text-anchor="middle" font-size="8" fill="#9a3412">위반 여부 확인</text>

  <line x1="155" y1="230" x2="155" y2="280" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowA)"/>
  <line x1="400" y1="230" x2="400" y2="280" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowA)"/>
  <line x1="645" y1="230" x2="645" y2="280" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowA)"/>

  <rect x="120" y="280" width="560" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
  <text x="400" y="302" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1f2937">코드 생성 → PR 제출</text>
  <text x="400" y="318" text-anchor="middle" font-size="8" fill="#4b5563">강제 지점이 빠지면 참조·생성은 "안 지켜도 그만"인 희망적 설계로 남는다</text>

  <line x1="645" y1="230" x2="400" y2="86" stroke="#9333ea" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowA)"/>
  <text x="560" y="105" font-size="7.5" fill="#6b21a8">새 ADR이 승인되면 저장소에 반영</text>

  <text x="400" y="400" text-anchor="middle" font-size="9" fill="#4b5563">세 지점이 순환해야 ADR이 "쓰여 있는 문서"에서 "지켜지는 규칙"으로 바뀐다</text>
</svg>
