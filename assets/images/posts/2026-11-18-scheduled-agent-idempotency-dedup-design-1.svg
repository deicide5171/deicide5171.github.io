<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; rx: 8; }
    .boxBad { fill: #fff0f0; stroke: #d9534f; stroke-width: 2; rx: 8; }
    .boxGood { fill: #f0f7f4; stroke: #2e8b57; stroke-width: 2; rx: 8; }
    .label { font-size: 15px; fill: #222222; text-anchor: middle; }
    .sublabel { font-size: 12px; fill: #555555; text-anchor: middle; }
    .arrow { stroke: #666666; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .title { font-size: 16px; font-weight: bold; fill: #222222; }
    .badtext { font-size: 13px; fill: #b02a2a; text-anchor: middle; }
    .goodtext { font-size: 13px; fill: #1f6b42; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666666" />
    </marker>
  </defs>

  <text x="20" y="30" class="title">① 체크 없이 바로 실행 — 재시도 시 중복 발생</text>

  <rect x="20" y="50" width="130" height="50" class="box" />
  <text x="85" y="80" class="label">크론 트리거</text>

  <rect x="190" y="50" width="130" height="50" class="box" />
  <text x="255" y="80" class="label">에이전트 실행</text>

  <rect x="360" y="50" width="150" height="50" class="boxBad" />
  <text x="435" y="75" class="label">사이드이펙트</text>
  <text x="435" y="92" class="sublabel">커밋·PR·알림</text>

  <rect x="550" y="50" width="130" height="50" class="box" />
  <text x="615" y="80" class="label">상태 기록</text>

  <line x1="150" y1="75" x2="188" y2="75" class="arrow" />
  <line x1="320" y1="75" x2="358" y2="75" class="arrow" />
  <line x1="510" y1="75" x2="548" y2="75" class="arrow" />

  <path d="M615,100 Q615,140 435,140 Q255,140 255,102" class="arrow" stroke-dasharray="5,4" />
  <text x="435" y="155" class="badtext">기록 직전 세션 중단 → 재시도가 "미완료"로 오판 → 같은 사이드이펙트 한 번 더 발생</text>

  <text x="20" y="210" class="title">② 사이드이펙트 직전에 멱등성 키를 원자적으로 선점</text>

  <rect x="20" y="230" width="130" height="50" class="box" />
  <text x="85" y="260" class="label">크론 트리거</text>

  <rect x="190" y="230" width="130" height="50" class="box" />
  <text x="255" y="260" class="label">에이전트 실행</text>

  <rect x="360" y="220" width="150" height="70" class="boxGood" />
  <text x="435" y="245" class="label">멱등성 키 선점</text>
  <text x="435" y="262" class="sublabel">post:날짜:슬롯</text>
  <text x="435" y="278" class="sublabel">원자적 체크</text>

  <rect x="550" y="230" width="130" height="50" class="boxGood" />
  <text x="615" y="255" class="label">사이드이펙트</text>
  <text x="615" y="272" class="sublabel">선점 성공 시만</text>

  <line x1="150" y1="255" x2="188" y2="255" class="arrow" />
  <line x1="320" y1="255" x2="358" y2="255" class="arrow" />
  <line x1="510" y1="255" x2="548" y2="255" class="arrow" />

  <path d="M435,220 Q435,190 255,190 Q110,190 85,228" class="arrow" stroke-dasharray="5,4" />
  <text x="260" y="183" class="goodtext">이미 선점된 키면 즉시 스킵 — 재시도해도 실행은 한 번만</text>

  <rect x="20" y="330" width="760" height="90" rx="10" fill="#f7f7f7" stroke="#cccccc" />
  <text x="40" y="358" font-size="14" fill="#333333">핵심 차이: ①은 "실행이 끝난 뒤" 기록하므로 실행과 기록 사이에 틈이 생긴다.</text>
  <text x="40" y="380" font-size="14" fill="#333333">②는 사이드이펙트 "직전"에 멱등성 키 선점을 원자적 연산으로 묶어, 같은 트리거가</text>
  <text x="40" y="402" font-size="14" fill="#333333">여러 번 들어와도 선점에 성공한 단 한 번만 실제 사이드이펙트가 일어나게 만든다.</text>
</svg>
