<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">위도(가로선)와 경도(세로선)</text>

  <!-- Globe circle -->
  <circle cx="300" cy="255" r="150" fill="#eef6ff" stroke="#3b7dd8" stroke-width="2"/>

  <!-- Latitude lines (horizontal) -->
  <line x1="165" y1="205" x2="435" y2="205" stroke="#03c75a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="150" y1="255" x2="450" y2="255" stroke="#03c75a" stroke-width="2.5"/>
  <line x1="165" y1="305" x2="435" y2="305" stroke="#03c75a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="465" y="259" font-family="sans-serif" font-size="14" fill="#03c75a">적도 0°</text>

  <!-- Longitude lines (vertical, curved approximated) -->
  <line x1="300" y1="105" x2="300" y2="405" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M245,120 Q225,255 245,390" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M355,120 Q375,255 355,390" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="300" y="95" font-family="sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">본초자오선 0°</text>

  <!-- Point (Seoul) -->
  <circle cx="355" cy="205" r="7" fill="#e08e2b" stroke="#fff" stroke-width="2"/>
  <text x="368" y="200" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">서울</text>

  <!-- Legend -->
  <rect x="540" y="150" width="230" height="200" rx="10" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <line x1="560" y1="185" x2="600" y2="185" stroke="#03c75a" stroke-width="3"/>
  <text x="610" y="190" font-family="sans-serif" font-size="15" fill="#333">위도 = 가로선(남북)</text>
  <text x="560" y="212" font-family="sans-serif" font-size="13" fill="#777">-90° ~ +90°, 북쪽 +</text>

  <line x1="560" y1="248" x2="600" y2="248" stroke="#c0392b" stroke-width="3"/>
  <text x="610" y="253" font-family="sans-serif" font-size="15" fill="#333">경도 = 세로선(동서)</text>
  <text x="560" y="275" font-family="sans-serif" font-size="13" fill="#777">-180° ~ +180°, 동쪽 +</text>

  <text x="560" y="315" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222">서울: 37.5°N, 127°E</text>
  <text x="560" y="337" font-family="sans-serif" font-size="12" fill="#999">두 선이 만나는 점 = 위치</text>
</svg>
