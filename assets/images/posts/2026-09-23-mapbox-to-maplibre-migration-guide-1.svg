<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">Mapbox GL JS → MapLibre GL JS 마이그레이션</text>

  <!-- Before column -->
  <rect x="50" y="70" width="320" height="230" rx="10" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="210" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#8a1f1f">Before: Mapbox GL JS</text>

  <rect x="75" y="115" width="270" height="34" fill="#f7c9c9" stroke="#c0392b"/>
  <text x="210" y="137" text-anchor="middle" font-family="monospace" font-size="12" fill="#5a2727">mapboxgl.accessToken = 'pk...'</text>

  <rect x="75" y="158" width="270" height="34" fill="#f7c9c9" stroke="#c0392b"/>
  <text x="210" y="180" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#5a2727">style: 'mapbox://styles/...'</text>

  <rect x="75" y="201" width="270" height="34" fill="#f7c9c9" stroke="#c0392b"/>
  <text x="210" y="223" text-anchor="middle" font-family="monospace" font-size="11" fill="#5a2727">import 'mapbox-gl/dist/...css'</text>

  <text x="210" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a1f1f">Mapbox 서비스에 종속</text>

  <!-- Arrow -->
  <line x1="380" y1="185" x2="420" y2="185" stroke="#333" stroke-width="2.5" marker-end="url(#am)"/>
  <defs>
    <marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <!-- After column -->
  <rect x="430" y="70" width="320" height="230" rx="10" fill="#eafaf0" stroke="#03a35a" stroke-width="2"/>
  <text x="590" y="98" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#03612f">After: MapLibre GL JS</text>

  <rect x="455" y="115" width="270" height="34" fill="#bdeed1" stroke="#03a35a"/>
  <text x="590" y="137" text-anchor="middle" font-family="monospace" font-size="12" fill="#03612f">accessToken 설정 자체가 불필요</text>

  <rect x="455" y="158" width="270" height="34" fill="#bdeed1" stroke="#03a35a"/>
  <text x="590" y="180" text-anchor="middle" font-family="monospace" font-size="11" fill="#03612f">style: '.../style.json?key=...'</text>

  <rect x="455" y="201" width="270" height="34" fill="#bdeed1" stroke="#03a35a"/>
  <text x="590" y="223" text-anchor="middle" font-family="monospace" font-size="11" fill="#03612f">import 'maplibre-gl/dist/...css'</text>

  <text x="590" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#03612f">오픈 타일 소스(MapTiler 등)로 교체</text>

  <!-- bottom note -->
  <rect x="60" y="330" width="680" height="80" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="400" y="358" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333">핵심: API 표면은 거의 동일 — 진짜 작업은 스타일/타일 소스 교체</text>
  <text x="400" y="382" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#555">RTL 플러그인 등록, v2 이후 전용 기능(3D 지형 확장 등)은 별도 확인 필요</text>
</svg>
