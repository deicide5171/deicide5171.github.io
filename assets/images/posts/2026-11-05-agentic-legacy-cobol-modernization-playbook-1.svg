<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .box { fill:#f4f8ff; stroke:#3b6fd6; stroke-width:1.5; }
    .box2 { fill:#fff4ec; stroke:#d97b3f; stroke-width:1.5; }
    .box3 { fill:#f0fbf4; stroke:#2f9e5b; stroke-width:1.5; }
    .boxhuman { fill:#fdecec; stroke:#cc4444; stroke-width:1.5; }
    .lbl { font-size:12.5px; fill:#1a1a1a; }
    .sub { font-size:10px; fill:#555; }
    .title { font-size:16px; font-weight:bold; fill:#1a1a1a; }
    .arrow { stroke:#555; stroke-width:1.5; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="20" y="25" class="title">레거시 현대화 3단계와 에이전트의 범위</text>

  <rect x="30" y="45" width="150" height="50" rx="6" class="box"/>
  <text x="105" y="67" text-anchor="middle" class="lbl">레거시 코드</text>
  <text x="105" y="83" text-anchor="middle" class="sub">COBOL 수십만 줄</text>

  <line x1="180" y1="70" x2="220" y2="70" class="arrow"/>

  <rect x="225" y="45" width="190" height="50" rx="6" class="box3"/>
  <text x="320" y="67" text-anchor="middle" class="lbl">① 탐색·발견 (에이전트)</text>
  <text x="320" y="83" text-anchor="middle" class="sub">의존성 맵, 업무 흐름 문서화</text>

  <line x1="415" y1="70" x2="455" y2="70" class="arrow"/>

  <rect x="460" y="45" width="190" height="50" rx="6" class="box3"/>
  <text x="555" y="67" text-anchor="middle" class="lbl">② 위험 분석 (에이전트)</text>
  <text x="555" y="83" text-anchor="middle" class="sub">전환 우선순위 제안</text>

  <line x1="555" y1="95" x2="555" y2="135" class="arrow"/>

  <rect x="400" y="140" width="310" height="55" rx="6" class="boxhuman"/>
  <text x="555" y="163" text-anchor="middle" class="lbl" fill="#cc4444">③ 전환 (신·구 시스템 나란히 비교)</text>
  <text x="555" y="180" text-anchor="middle" class="sub" fill="#cc4444">도메인 전문가가 결과 일치 여부 승인</text>

  <line x1="555" y1="195" x2="555" y2="235" class="arrow"/>

  <rect x="400" y="240" width="310" height="50" rx="6" class="box"/>
  <text x="555" y="262" text-anchor="middle" class="lbl">검증 통과 모듈만 점진 교체</text>
  <text x="555" y="278" text-anchor="middle" class="sub">미통과 모듈은 현행 유지</text>

  <rect x="40" y="320" width="720" height="80" rx="8" class="boxhuman"/>
  <text x="400" y="345" text-anchor="middle" class="lbl" fill="#cc4444">파이프라인 바깥 — 여전히 사람·조직의 일</text>
  <text x="400" y="365" text-anchor="middle" class="sub" fill="#cc4444">비즈니스 범위 재정의 · 동작 동등성 최종 검증</text>
  <text x="400" y="382" text-anchor="middle" class="sub" fill="#cc4444">데이터 마이그레이션 전략 · 조직 변화 관리</text>

  <text x="400" y="420" text-anchor="middle" class="sub" fill="#555">에이전트는 ①②를 빠르게 하고, ③의 최종 승인과 바깥 영역은 사람이 맡는다</text>
</svg>
