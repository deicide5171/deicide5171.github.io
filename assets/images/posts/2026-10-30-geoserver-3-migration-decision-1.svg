<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .box { fill:#f4f8ff; stroke:#3b6fd6; stroke-width:1.5; }
    .box2 { fill:#fff4ec; stroke:#d97b3f; stroke-width:1.5; }
    .box3 { fill:#f0fbf4; stroke:#2f9e5b; stroke-width:1.5; }
    .lbl { font-size:13px; fill:#1a1a1a; }
    .sub { font-size:11px; fill:#555; }
    .arrow { stroke:#444; stroke-width:1.5; marker-end:url(#arrow); fill:none; }
    .title { font-size:16px; font-weight:bold; fill:#1a1a1a; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>

  <rect x="20" y="30" width="140" height="50" rx="8" class="box3"/>
  <text x="90" y="52" text-anchor="middle" class="lbl">PostGIS 등</text>
  <text x="90" y="68" text-anchor="middle" class="lbl">데이터 스토어</text>
  <path class="arrow" d="M160,55 L220,55"/>

  <rect x="220" y="20" width="360" height="200" rx="8" fill="#fbfbfb" stroke="#999" stroke-width="1.5"/>
  <text x="400" y="40" text-anchor="middle" class="title">GeoServer (OGC 서비스 계층)</text>

  <rect x="240" y="55" width="150" height="40" rx="6" class="box"/>
  <text x="315" y="79" text-anchor="middle" class="lbl">WMS / WFS / WPS</text>

  <rect x="240" y="105" width="150" height="110" rx="6" class="box2"/>
  <text x="315" y="123" text-anchor="middle" class="lbl">2.x 내부 스택</text>
  <text x="315" y="140" text-anchor="middle" class="sub">Java 11 · Spring 5</text>
  <text x="315" y="155" text-anchor="middle" class="sub">Wicket 7 · javax.*</text>
  <text x="315" y="170" text-anchor="middle" class="sub">JAI · Tomcat 9</text>
  <text x="315" y="185" text-anchor="middle" class="sub">Jetty 9</text>

  <rect x="410" y="105" width="150" height="110" rx="6" class="box3"/>
  <text x="485" y="123" text-anchor="middle" class="lbl">3.0 내부 스택</text>
  <text x="485" y="140" text-anchor="middle" class="sub">Java 17 · Spring 6</text>
  <text x="485" y="155" text-anchor="middle" class="sub">Wicket 10 · jakarta.*</text>
  <text x="485" y="170" text-anchor="middle" class="sub">ImageN · Tomcat 10</text>
  <text x="485" y="185" text-anchor="middle" class="sub">Jetty 12</text>

  <path class="arrow" d="M390,160 L410,160"/>
  <text x="400" y="100" text-anchor="middle" class="sub">전면 교체</text>

  <path class="arrow" d="M580,55 L640,55"/>
  <rect x="640" y="30" width="140" height="50" rx="8" class="box"/>
  <text x="710" y="52" text-anchor="middle" class="lbl">WMS/WFS/WPS</text>
  <text x="710" y="68" text-anchor="middle" class="lbl">클라이언트</text>

  <line x1="20" y1="250" x2="780" y2="250" stroke="#ccc" stroke-dasharray="4,4"/>
  <text x="400" y="275" text-anchor="middle" class="title">영향을 직접 받는 커스텀 레이어</text>

  <rect x="60" y="300" width="200" height="70" rx="8" class="box2"/>
  <text x="160" y="325" text-anchor="middle" class="lbl">커스텀 WPS 프로세스</text>
  <text x="160" y="345" text-anchor="middle" class="sub">javax.* 직접 참조 시</text>
  <text x="160" y="360" text-anchor="middle" class="sub">이름공간 포팅 필요</text>

  <rect x="300" y="300" width="200" height="70" rx="8" class="box2"/>
  <text x="400" y="325" text-anchor="middle" class="lbl">OAuth2 / OIDC 연동</text>
  <text x="400" y="345" text-anchor="middle" class="sub">모듈 전면 리라이트</text>
  <text x="400" y="360" text-anchor="middle" class="sub">설정 포맷 재검증 필수</text>

  <rect x="540" y="300" width="200" height="70" rx="8" class="box2"/>
  <text x="640" y="325" text-anchor="middle" class="lbl">커스텀 데이터스토어</text>
  <text x="640" y="345" text-anchor="middle" class="sub">구버전 JAI API 참조 시</text>
  <text x="640" y="360" text-anchor="middle" class="sub">ImageN으로 재작성</text>

  <path class="arrow" d="M160,300 C160,290 400,230 400,220"/>
  <path class="arrow" d="M400,300 C400,260 485,230 485,220"/>
  <path class="arrow" d="M640,300 C640,260 485,230 485,220"/>
</svg>
