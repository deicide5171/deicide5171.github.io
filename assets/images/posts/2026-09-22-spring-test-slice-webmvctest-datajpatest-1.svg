<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">테스트 슬라이스별 빈 로딩 범위</text>

  <rect x="40" y="60" width="720" height="360" rx="10" fill="#f9f9f9" stroke="#ccc" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="400" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#555">@SpringBootTest — 전체 애플리케이션 컨텍스트</text>

  <rect x="70" y="105" width="330" height="130" rx="8" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="235" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#22345a">@WebMvcTest</text>
  <text x="235" y="155" text-anchor="middle" font-size="12" fill="#333">Controller</text>
  <text x="235" y="175" text-anchor="middle" font-size="12" fill="#333">ControllerAdvice</text>
  <text x="235" y="195" text-anchor="middle" font-size="12" fill="#333">Filter, Converter</text>
  <text x="235" y="220" text-anchor="middle" font-size="11" fill="#888">Service/Repository는 @MockBean</text>

  <rect x="420" y="105" width="330" height="130" rx="8" fill="#eef8ef" stroke="#2f9e58" stroke-width="2"/>
  <text x="585" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5c34">@DataJpaTest</text>
  <text x="585" y="155" text-anchor="middle" font-size="12" fill="#333">EntityManager</text>
  <text x="585" y="175" text-anchor="middle" font-size="12" fill="#333">Repository</text>
  <text x="585" y="195" text-anchor="middle" font-size="12" fill="#333">인메모리 DB (H2 등)</text>
  <text x="585" y="220" text-anchor="middle" font-size="11" fill="#888">Controller/Service는 로딩 안 함</text>

  <rect x="70" y="260" width="680" height="60" rx="8" fill="#fff7f0" stroke="#f0a04b" stroke-width="2"/>
  <text x="410" y="285" text-anchor="middle" font-size="12" fill="#5a4632">서비스, 시큐리티, 메시지 브로커, DB 커넥션 등 애플리케이션 전체 빈</text>
  <text x="410" y="305" text-anchor="middle" font-size="12" fill="#5a4632">여러 레이어가 얽힌 통합 시나리오를 검증할 때만 사용</text>

  <text x="410" y="355" text-anchor="middle" font-size="13" fill="#333">슬라이스 테스트 → 빠르고 좁게</text>
  <text x="410" y="378" text-anchor="middle" font-size="13" fill="#333">@SpringBootTest → 느리지만 넓게, 핵심 시나리오만</text>
</svg>
