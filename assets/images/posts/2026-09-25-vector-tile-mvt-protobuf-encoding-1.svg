<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Vector Tile(MVT) 내부 구조 — Protobuf 계층과 좌표 압축</text>

  <!-- Step 1: Tile message -->
  <text x="140" y="60" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">1) Tile 메시지</text>
  <rect x="30" y="75" width="230" height="150" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="145" y="98" text-anchor="middle" font-size="11.5" fill="#1e3a8a" font-weight="bold">Tile</text>
  <rect x="50" y="108" width="190" height="30" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="145" y="127" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Layer "roads" (extent=4096)</text>
  <rect x="50" y="144" width="190" height="30" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="145" y="163" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Layer "buildings" (extent=4096)</text>
  <rect x="50" y="180" width="190" height="30" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="145" y="199" text-anchor="middle" font-size="10.5" fill="#1e3a8a">Layer "labels" (extent=4096)</text>

  <path d="M262,150 L305,150" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrM)"/>
  <defs>
    <marker id="arrM" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Step 2: Layer internal (dictionary encoding) -->
  <text x="480" y="60" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">2) Layer 내부 — 키·값 딕셔너리 공유</text>
  <rect x="310" y="75" width="460" height="150" rx="8" fill="#f0fdf4" stroke="#86efac"/>

  <rect x="325" y="88" width="130" height="60" rx="5" fill="#dcfce7" stroke="#4ade80"/>
  <text x="390" y="103" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">keys[]</text>
  <text x="390" y="119" text-anchor="middle" font-size="9.5" fill="#065f46" font-family="monospace">0:"type" 1:"lanes"</text>
  <text x="390" y="133" text-anchor="middle" font-size="9.5" fill="#065f46" font-family="monospace">2:"name"</text>

  <rect x="465" y="88" width="130" height="60" rx="5" fill="#dcfce7" stroke="#4ade80"/>
  <text x="530" y="103" text-anchor="middle" font-size="10" font-weight="bold" fill="#065f46">values[]</text>
  <text x="530" y="119" text-anchor="middle" font-size="9.5" fill="#065f46" font-family="monospace">0:"primary" 1:2</text>
  <text x="530" y="133" text-anchor="middle" font-size="9.5" fill="#065f46" font-family="monospace">2:"강남대로"</text>

  <rect x="605" y="88" width="150" height="60" rx="5" fill="#fef9c3" stroke="#fde047"/>
  <text x="680" y="103" text-anchor="middle" font-size="10" font-weight="bold" fill="#854d0e">feature.tags</text>
  <text x="680" y="119" text-anchor="middle" font-size="9.5" fill="#854d0e" font-family="monospace">[0,0, 1,1, 2,2]</text>
  <text x="680" y="133" text-anchor="middle" font-size="9" fill="#854d0e">키·값 인덱스 쌍만 저장</text>

  <rect x="325" y="158" width="430" height="55" rx="5" fill="#fefce8" stroke="#fde047"/>
  <text x="540" y="175" text-anchor="middle" font-size="10.5" fill="#713f12" font-weight="bold">geometry (command 정수열, zigzag+varint 인코딩)</text>
  <text x="540" y="195" text-anchor="middle" font-size="9.5" fill="#713f12" font-family="monospace">MoveTo(dx,dy) → LineTo(dx,dy) → LineTo(dx,dy) → ClosePath</text>

  <!-- Step 3: comparison boxes -->
  <rect x="30" y="250" width="740" height="170" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">같은 도로 100개를 표현할 때 — GeoJSON vs MVT</text>

  <rect x="55" y="295" width="345" height="105" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="227" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">GeoJSON (텍스트 기반)</text>
  <text x="227" y="340" text-anchor="middle" font-size="10.5" fill="#991b1b">각 feature마다 "type", "primary" 같은</text>
  <text x="227" y="356" text-anchor="middle" font-size="10.5" fill="#991b1b">속성 키·값 문자열을 매번 통째로 반복</text>
  <text x="227" y="378" text-anchor="middle" font-size="10.5" fill="#991b1b">좌표도 절대 좌표(위경도, 부동소수)</text>

  <rect x="415" y="295" width="330" height="105" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="580" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#065f46">MVT (Protobuf 바이너리)</text>
  <text x="580" y="340" text-anchor="middle" font-size="10.5" fill="#0d7a5f">같은 키·값은 딕셔너리에 한 번만 저장,</text>
  <text x="580" y="356" text-anchor="middle" font-size="10.5" fill="#0d7a5f">feature는 인덱스 정수 쌍만 참조</text>
  <text x="580" y="378" text-anchor="middle" font-size="10.5" fill="#0d7a5f">좌표는 타일 로컬 정수 + 이전 점과의 상대 델타</text>
</svg>
