<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">지오펜싱 진입/이탈 이벤트 판정 개념도</text>

  <!-- outer buffer (exit-confirm zone) -->
  <polygon points="265,128 500,112 596,205 562,352 378,398 222,312 202,198"
    fill="none" stroke="#c9502f" stroke-width="1.6" stroke-dasharray="6,5"/>
  <text x="612" y="118" font-size="11.5" fill="#c9502f" font-weight="bold">이탈 확정 buffer</text>
  <text x="612" y="133" font-size="10.5" fill="#c9502f">(경계 밖으로 일정 거리)</text>

  <!-- main geofence polygon -->
  <polygon points="280,150 480,135 570,210 540,330 380,375 250,300 230,210"
    fill="#e3f4e8" stroke="#1f7a38" stroke-width="2.5"/>
  <text x="400" y="250" text-anchor="middle" font-size="13" fill="#1f7a38" font-weight="bold">지오펜스 경계</text>
  <text x="400" y="266" text-anchor="middle" font-size="10.5" fill="#2f8a4a">(등록된 폴리곤, ray casting으로 내부 판정)</text>

  <!-- inner buffer (enter-confirm zone) -->
  <polygon points="303,178 458,166 543,228 517,318 372,352 278,280 265,222"
    fill="none" stroke="#0b5fa5" stroke-width="1.6" stroke-dasharray="6,5"/>
  <text x="330" y="205" font-size="11" fill="#0b5fa5" font-weight="bold">진입 확정 buffer</text>
  <text x="330" y="219" font-size="10" fill="#0b5fa5">(dwell time 충족 지점)</text>

  <!-- movement path (dotted, with jitter near boundary) -->
  <polyline points="110,375 165,345 205,320 236,303 222,292 248,286 231,299 260,278 300,255 330,235 400,245 435,268 470,295 505,315 528,300 512,335 545,352 560,368 585,388"
    fill="none" stroke="#8a5a00" stroke-width="1.8" stroke-dasharray="2,5"/>

  <!-- GPS ping dots -->
  <g fill="#c98a1a">
    <circle cx="110" cy="375" r="4"/>
    <circle cx="165" cy="345" r="4"/>
    <circle cx="205" cy="320" r="4"/>
    <circle cx="236" cy="303" r="4"/>
    <circle cx="222" cy="292" r="4"/>
    <circle cx="248" cy="286" r="4"/>
    <circle cx="231" cy="299" r="4"/>
    <circle cx="260" cy="278" r="4"/>
    <circle cx="330" cy="235" r="4"/>
    <circle cx="435" cy="268" r="4"/>
    <circle cx="505" cy="315" r="4"/>
    <circle cx="528" cy="300" r="4"/>
    <circle cx="512" cy="335" r="4"/>
    <circle cx="545" cy="352" r="4"/>
    <circle cx="585" cy="388" r="4"/>
  </g>

  <!-- jitter callout -->
  <text x="150" y="270" font-size="10.5" fill="#a33" font-weight="bold">GPS 오차로 경계 근처에서</text>
  <text x="150" y="283" font-size="10.5" fill="#a33" font-weight="bold">측위가 흔들림(플리커링 위험)</text>
  <line x1="215" y1="290" x2="180" y2="277" stroke="#a33" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- ENTER event flag -->
  <g transform="translate(300,255)">
    <line x1="0" y1="0" x2="0" y2="-34" stroke="#1f7a38" stroke-width="2"/>
    <polygon points="0,-34 26,-27 0,-20" fill="#2fa84f"/>
    <circle cx="0" cy="0" r="4.5" fill="#1f7a38"/>
  </g>
  <text x="300" y="240" text-anchor="middle" font-size="11" fill="#1f7a38" font-weight="bold">ENTER 이벤트 확정</text>

  <!-- EXIT event flag -->
  <g transform="translate(560,368)">
    <line x1="0" y1="0" x2="0" y2="-34" stroke="#a33" stroke-width="2"/>
    <polygon points="0,-34 26,-27 0,-20" fill="#d1553a"/>
    <circle cx="0" cy="0" r="4.5" fill="#a33"/>
  </g>
  <text x="560" y="410" text-anchor="middle" font-size="11" fill="#a33" font-weight="bold">EXIT 이벤트 확정</text>

  <!-- legend -->
  <g font-size="10.5" fill="#444">
    <circle cx="45" cy="418" r="4" fill="#c98a1a"/>
    <text x="55" y="422">GPS 측위 포인트</text>
    <line x1="150" y1="418" x2="175" y2="418" stroke="#1f7a38" stroke-width="2.5"/>
    <text x="180" y="422">지오펜스 경계</text>
    <line x1="270" y1="418" x2="295" y2="418" stroke="#0b5fa5" stroke-width="1.6" stroke-dasharray="5,4"/>
    <text x="300" y="422">진입 buffer</text>
    <line x1="380" y1="418" x2="405" y2="418" stroke="#c9502f" stroke-width="1.6" stroke-dasharray="5,4"/>
    <text x="410" y="422">이탈 buffer</text>
  </g>
</svg>
