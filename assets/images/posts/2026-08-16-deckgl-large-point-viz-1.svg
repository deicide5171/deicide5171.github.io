<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">deck.gl 레이어 파이프라인 — CPU에서 GPU로</text>

  <!-- Stage 1: raw data -->
  <rect x="25" y="70" width="150" height="72" rx="6" fill="#0b5fa5" stroke="#083f6e" stroke-width="1.5"/>
  <text x="100" y="98" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">원본 데이터</text>
  <text x="100" y="115" text-anchor="middle" font-size="10.5" fill="#dbeafe">CSV·GeoJSON·Arrow</text>
  <text x="100" y="129" text-anchor="middle" font-size="10.5" fill="#dbeafe">(대용량 포인트 배열)</text>

  <!-- arrow 1->2 -->
  <line x1="175" y1="106" x2="207" y2="106" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: layer definition -->
  <rect x="210" y="70" width="150" height="72" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="285" y="98" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Layer 정의</text>
  <text x="285" y="115" text-anchor="middle" font-size="10.5" fill="#dbeafe">ScatterplotLayer +</text>
  <text x="285" y="129" text-anchor="middle" font-size="10.5" fill="#dbeafe">accessor 함수</text>

  <!-- arrow 2->3 -->
  <line x1="360" y1="106" x2="392" y2="106" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: gpu buffer upload -->
  <rect x="395" y="70" width="150" height="72" rx="6" fill="#1c9a8a" stroke="#0f6b60" stroke-width="1.5"/>
  <text x="470" y="98" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">GPU 버퍼 업로드</text>
  <text x="470" y="115" text-anchor="middle" font-size="10.5" fill="#dffaf5">Typed Array →</text>
  <text x="470" y="129" text-anchor="middle" font-size="10.5" fill="#dffaf5">WebGL Buffer</text>

  <!-- arrow 3->4 -->
  <line x1="545" y1="106" x2="577" y2="106" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 4: gpu instanced rendering -->
  <rect x="580" y="70" width="195" height="72" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="677" y="98" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">GPU 인스턴싱 렌더링</text>
  <text x="677" y="115" text-anchor="middle" font-size="10.5" fill="#eafff0">정점 셰이더가 포인트별</text>
  <text x="677" y="129" text-anchor="middle" font-size="10.5" fill="#eafff0">좌표 변환을 병렬 처리</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- accessor detail chips under stage 2 -->
  <line x1="285" y1="142" x2="285" y2="160" stroke="#bbb" stroke-width="1.3"/>
  <rect x="215" y="160" width="70" height="26" rx="4" fill="#eef4fb" stroke="#a9c6e6" stroke-width="1"/>
  <text x="250" y="177" text-anchor="middle" font-size="10" fill="#0b5fa5">getPosition</text>
  <rect x="290" y="160" width="70" height="26" rx="4" fill="#eef4fb" stroke="#a9c6e6" stroke-width="1"/>
  <text x="325" y="177" text-anchor="middle" font-size="10" fill="#0b5fa5">getFillColor</text>
  <rect x="365" y="160" width="65" height="26" rx="4" fill="#eef4fb" stroke="#a9c6e6" stroke-width="1"/>
  <text x="397" y="177" text-anchor="middle" font-size="10" fill="#0b5fa5">getRadius</text>

  <!-- key insight callout -->
  <rect x="25" y="204" width="750" height="46" rx="6" fill="#fff7ea" stroke="#ffb020" stroke-width="1.5"/>
  <text x="400" y="223" text-anchor="middle" font-size="12" fill="#7a4b00" font-weight="bold">핵심: 위경도 → 화면 좌표 변환(Web Mercator 투영)까지 GPU 셰이더에서 처리</text>
  <text x="400" y="240" text-anchor="middle" font-size="11.5" fill="#7a4b00">CPU는 버퍼를 한 번만 올리고, 포인트 개수가 늘어도 반복 연산은 GPU가 병렬로 나눠 맡는다</text>

  <!-- comparison section -->
  <text x="400" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">렌더링 방식 비교 (개념도 — 실제 처리량은 기기·데이터에 따라 달라짐)</text>

  <!-- DOM marker row -->
  <text x="70" y="308" font-size="11.5" fill="#555" font-weight="bold">기존 방식</text>
  <text x="70" y="322" font-size="10.5" fill="#888">DOM 마커 / Canvas 2D</text>
  <g>
    <circle cx="230" cy="308" r="5" fill="#c0392b"/>
    <circle cx="250" cy="308" r="5" fill="#c0392b"/>
    <circle cx="270" cy="308" r="5" fill="#c0392b"/>
    <circle cx="290" cy="308" r="5" fill="#c0392b"/>
    <circle cx="310" cy="308" r="5" fill="#c0392b"/>
  </g>
  <text x="450" y="312" font-size="11" fill="#a33">포인트마다 DOM 엘리먼트/개별 draw 호출 → 개수가 늘수록 CPU 부담 급증</text>

  <!-- GPU instancing row -->
  <text x="70" y="352" font-size="11.5" fill="#555" font-weight="bold">deck.gl 방식</text>
  <text x="70" y="366" font-size="10.5" fill="#888">GPU 인스턴싱 (WebGL2)</text>
  <g fill="#2fa84f">
    <circle cx="220" cy="352" r="3.2"/><circle cx="234" cy="352" r="3.2"/><circle cx="248" cy="352" r="3.2"/>
    <circle cx="262" cy="352" r="3.2"/><circle cx="276" cy="352" r="3.2"/><circle cx="290" cy="352" r="3.2"/>
    <circle cx="304" cy="352" r="3.2"/><circle cx="318" cy="352" r="3.2"/><circle cx="332" cy="352" r="3.2"/>
    <circle cx="346" cy="352" r="3.2"/><circle cx="360" cy="352" r="3.2"/><circle cx="374" cy="352" r="3.2"/>
  </g>
  <text x="450" y="356" font-size="11" fill="#1f7a38">같은 지오메트리를 하나의 draw call로 대량 복제 렌더링 → 대규모 포인트에 유리</text>

  <!-- composited layers at bottom -->
  <g transform="translate(560,290)">
    <rect x="0" y="55" width="190" height="60" rx="5" fill="#dfe7ee" stroke="#9fb3c8" stroke-width="1.3"/>
    <text x="95" y="90" text-anchor="middle" font-size="11" fill="#3a4a5a" font-weight="bold">Base Map (타일)</text>
    <rect x="18" y="35" width="190" height="60" rx="5" fill="#d7f0e6" stroke="#6fbfa0" stroke-width="1.3"/>
    <text x="113" y="70" text-anchor="middle" font-size="11" fill="#1f7a38" font-weight="bold">deck.gl WebGL Canvas</text>
    <text x="113" y="20" text-anchor="middle" font-size="10.5" fill="#555">두 레이어를 겹쳐 하나의 지도로 합성</text>
  </g>

  <text x="400" y="435" text-anchor="middle" font-size="11.5" fill="#555">Layer → GPU 버퍼 → 인스턴싱 렌더링 → 베이스맵과 합성, 이 흐름이 대량 포인트 시각화의 핵심이다</text>
</svg>
