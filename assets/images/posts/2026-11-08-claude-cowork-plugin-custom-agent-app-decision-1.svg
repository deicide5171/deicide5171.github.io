<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- 요구사항 -->
  <rect x="250" y="20" width="300" height="50" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="400" y="50" text-anchor="middle" font-size="16" fill="#1b3a73">"사내 반복 업무, 자동화해주세요"</text>

  <!-- 좌: Cowork 경로 -->
  <rect x="60" y="110" width="280" height="50" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="200" y="140" text-anchor="middle" font-size="15" fill="#15502f">Cowork 세션 — 사람이 직접 트리거</text>

  <rect x="60" y="190" width="280" height="50" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="200" y="215" text-anchor="middle" font-size="14" fill="#15502f">플러그인</text>
  <text x="200" y="233" text-anchor="middle" font-size="12" fill="#15502f">슬래시 커맨드 + 스킬 + 매니페스트</text>

  <!-- 우: 자체 앱 경로 -->
  <rect x="460" y="110" width="280" height="50" rx="8" fill="#fff7f0" stroke="#e08a2e" stroke-width="2"/>
  <text x="600" y="140" text-anchor="middle" font-size="15" fill="#7a4310">스케줄러 / 웹훅 — 무인 트리거</text>

  <rect x="460" y="190" width="280" height="50" rx="8" fill="#fff7f0" stroke="#e08a2e" stroke-width="2"/>
  <text x="600" y="215" text-anchor="middle" font-size="14" fill="#7a4310">자체 에이전트 앱</text>
  <text x="600" y="233" text-anchor="middle" font-size="12" fill="#7a4310">오케스트레이터 + 승인·롤백 로직</text>

  <!-- 공용 계층 -->
  <rect x="220" y="300" width="360" height="50" rx="8" fill="#f3f0ff" stroke="#6c4fd6" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" font-size="15" fill="#3a2a73">MCP 서버 (공용 도구 계층)</text>

  <rect x="250" y="380" width="300" height="50" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="2"/>
  <text x="400" y="410" text-anchor="middle" font-size="15" fill="#333333">사내 시스템 (ERP · DB · Slack)</text>

  <!-- 화살표 -->
  <line x1="400" y1="70" x2="200" y2="108" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="70" x2="600" y2="108" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="200" y1="160" x2="200" y2="188" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="160" x2="600" y2="188" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="200" y1="240" x2="330" y2="298" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="240" x2="470" y2="298" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="400" y1="350" x2="400" y2="378" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="400" y="285" text-anchor="middle" font-size="12" fill="#888888">두 경로는 여기서 다시 합류한다</text>
</svg>
