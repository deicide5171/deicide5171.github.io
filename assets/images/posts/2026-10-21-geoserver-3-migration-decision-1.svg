<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>

  <defs>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Upstream: client/auth gateway -->
  <rect x="20" y="60" width="150" height="80" rx="8" fill="#eef1fb" stroke="#5b6fd4" stroke-width="1.5"/>
  <text x="95" y="90" font-size="13" text-anchor="middle" fill="#2c3a9e" font-weight="bold">클라이언트 / 웹맵</text>
  <text x="95" y="108" font-size="11" text-anchor="middle" fill="#555">WMS · WFS 요청</text>

  <rect x="20" y="170" width="150" height="80" rx="8" fill="#fdeee8" stroke="#d4714a" stroke-width="1.5"/>
  <text x="95" y="200" font-size="13" text-anchor="middle" fill="#9e3f2c" font-weight="bold">인증 게이트웨이</text>
  <text x="95" y="218" font-size="11" text-anchor="middle" fill="#555">① OIDC 공식 익스텐션</text>
  <text x="95" y="234" font-size="10" text-anchor="middle" fill="#999">(서드파티→공식 승격)</text>

  <!-- Center: GeoServer core -->
  <rect x="220" y="100" width="220" height="200" rx="10" fill="#e8f0fe" stroke="#4a6fd4" stroke-width="2"/>
  <text x="330" y="130" font-size="15" text-anchor="middle" fill="#2c4a9e" font-weight="bold">GeoServer 3.0</text>
  <text x="330" y="155" font-size="11" text-anchor="middle" fill="#555">② 전면 재작성된</text>
  <text x="330" y="171" font-size="11" text-anchor="middle" fill="#555">관리 UI (레이어·스타일)</text>
  <text x="330" y="196" font-size="11" text-anchor="middle" fill="#555">WMS / WFS / WMTS</text>
  <text x="330" y="212" font-size="11" text-anchor="middle" fill="#555">서빙 엔진 (응답 동일)</text>
  <text x="330" y="237" font-size="11" text-anchor="middle" fill="#555">GWC 타일 캐시</text>
  <text x="330" y="253" font-size="11" text-anchor="middle" fill="#555">(기존 그대로)</text>
  <text x="330" y="278" font-size="10" text-anchor="middle" fill="#999">영향 범위: 운영 워크플로만</text>

  <!-- Downstream: datasources -->
  <rect x="490" y="60" width="150" height="80" rx="8" fill="#eaf7ee" stroke="#4aa26f" stroke-width="1.5"/>
  <text x="565" y="90" font-size="13" text-anchor="middle" fill="#276b43" font-weight="bold">PostGIS</text>
  <text x="565" y="108" font-size="11" text-anchor="middle" fill="#555">기존 벡터 저장소</text>

  <rect x="490" y="170" width="150" height="80" rx="8" fill="#fdf3e0" stroke="#d4a24a" stroke-width="1.5"/>
  <text x="565" y="196" font-size="13" text-anchor="middle" fill="#8a6418" font-weight="bold">③ DuckDB</text>
  <text x="565" y="214" font-size="11" text-anchor="middle" fill="#555">네이티브 데이터소스</text>
  <text x="565" y="230" font-size="10" text-anchor="middle" fill="#999">(신규, 분석·GeoParquet)</text>

  <rect x="490" y="280" width="150" height="80" rx="8" fill="#f1f1f1" stroke="#999" stroke-width="1.5"/>
  <text x="565" y="310" font-size="13" text-anchor="middle" fill="#444" font-weight="bold">원본 래스터·타일</text>
  <text x="565" y="328" font-size="11" text-anchor="middle" fill="#555">파일 저장소</text>

  <!-- Arrows -->
  <path d="M 170 100 L 215 150" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowg)"/>
  <path d="M 170 210 L 215 210" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowg)"/>
  <path d="M 440 150 L 485 100" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowg)"/>
  <path d="M 440 210 L 485 210" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowg)"/>
  <path d="M 440 250 L 485 310" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowg)"/>

  <!-- Caption -->
  <text x="400" y="395" font-size="12" text-anchor="middle" fill="#444">①②③ 세 축이 동시에 바뀐다 — 각자 독립적이지만 의존 여부에 따라 전환 리스크가 갈린다</text>

  <!-- Title -->
  <text x="400" y="35" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">GeoServer 3.0 변경점의 시스템상 위치</text>
</svg>
