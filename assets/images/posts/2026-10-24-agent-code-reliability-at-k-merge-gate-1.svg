<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1e8449"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="400" y="32" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">pass@1 게이트와 reliability@k 게이트의 차이</text>

  <!-- Agent -->
  <rect x="30" y="60" width="120" height="60" rx="8" fill="#eef1fb" stroke="#5b6fd4" stroke-width="1.5"/>
  <text x="90" y="85" font-size="12" text-anchor="middle" fill="#2c3a9e" font-weight="bold">코딩 에이전트</text>
  <text x="90" y="102" font-size="10" text-anchor="middle" fill="#555">PR 1건 생성</text>

  <path d="M 150 90 L 185 90" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- pass@1 gate (old) -->
  <rect x="190" y="55" width="150" height="70" rx="8" fill="#fdeee8" stroke="#d4714a" stroke-width="1.5"/>
  <text x="265" y="78" font-size="12" text-anchor="middle" fill="#9e3f2c" font-weight="bold">기존: 단일 CI 실행</text>
  <text x="265" y="95" font-size="10" text-anchor="middle" fill="#555">단위 테스트 1회 통과</text>
  <text x="265" y="110" font-size="10" text-anchor="middle" fill="#555">= pass@1</text>

  <path d="M 340 90 L 375 90" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="357" y="78" font-size="10" text-anchor="middle" fill="#1e8449">통과시</text>

  <rect x="380" y="55" width="140" height="70" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="450" y="80" font-size="12" text-anchor="middle" fill="#196f3d" font-weight="bold">자동 머지</text>
  <text x="450" y="98" font-size="10" text-anchor="middle" fill="#555">(리뷰어 1명 또는 생략)</text>

  <path d="M 520 90 L 555 90" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-r)"/>
  <rect x="560" y="55" width="200" height="70" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="660" y="80" font-size="12" text-anchor="middle" fill="#8e2a1e" font-weight="bold">프로덕션 리버트</text>
  <text x="660" y="98" font-size="10" text-anchor="middle" fill="#8e2a1e">METR: 절반이 실제론 머지 부적격</text>

  <!-- Divider -->
  <line x1="30" y1="150" x2="770" y2="150" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- New pipeline -->
  <rect x="30" y="175" width="120" height="60" rx="8" fill="#eef1fb" stroke="#5b6fd4" stroke-width="1.5"/>
  <text x="90" y="200" font-size="12" text-anchor="middle" fill="#2c3a9e" font-weight="bold">코딩 에이전트</text>
  <text x="90" y="217" font-size="10" text-anchor="middle" fill="#555">동일 작업 k회 실행</text>

  <path d="M 150 205 L 185 205" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="190" y="170" width="170" height="70" rx="8" fill="#fff7f0" stroke="#f0a04b" stroke-width="1.5"/>
  <text x="275" y="192" font-size="12" text-anchor="middle" fill="#8a5a1e" font-weight="bold">반복 샘플링 (k=3~5)</text>
  <text x="275" y="208" font-size="10" text-anchor="middle" fill="#5a4632">각 결과에 테스트+리뷰어</text>
  <text x="275" y="223" font-size="10" text-anchor="middle" fill="#5a4632">에이전트 채점 적용</text>

  <path d="M 360 205 L 395 205" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="400" y="170" width="170" height="70" rx="8" fill="#e8f0fe" stroke="#4a6fd4" stroke-width="2"/>
  <text x="485" y="192" font-size="12" text-anchor="middle" fill="#2c4a9e" font-weight="bold">reliability@k 산출</text>
  <text x="485" y="208" font-size="10" text-anchor="middle" fill="#555">k회 전부 성공한 비율</text>
  <text x="485" y="223" font-size="10" text-anchor="middle" fill="#555">(pass^k)</text>

  <path d="M 485 240 L 485 270" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="400" y="275" width="170" height="55" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="485" y="298" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">임계값 비교</text>
  <text x="485" y="315" font-size="10" text-anchor="middle" fill="#555">작업 유형별 기준선</text>

  <path d="M 450 330 L 300 370" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="190" y="375" width="160" height="55" rx="8" fill="#eafaf1" stroke="#1e8449" stroke-width="2"/>
  <text x="270" y="397" font-size="12" text-anchor="middle" fill="#196f3d" font-weight="bold">임계값 이상</text>
  <text x="270" y="414" font-size="10" text-anchor="middle" fill="#555">자동 머지 허용</text>

  <path d="M 520 330 L 660 370" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-r)"/>
  <rect x="580" y="375" width="180" height="55" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="670" y="397" font-size="12" text-anchor="middle" fill="#8e2a1e" font-weight="bold">임계값 미달</text>
  <text x="670" y="414" font-size="10" text-anchor="middle" fill="#8e2a1e">사람 리뷰로 에스컬레이션</text>
</svg>
