<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="195" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">벤더 SDK 직접 호출 (기존)</text>
  <text x="605" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">모델 어댑터 레이어 도입</text>
  <line x1="400" y1="15" x2="400" y2="430" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Left: direct SDK coupling -->
  <rect x="115" y="55" width="160" height="45" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="195" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d50">에이전트 오케스트레이션</text>
  <text x="195" y="91" text-anchor="middle" font-size="10" fill="#1f2d50">프롬프트·도구 스키마 하드코딩</text>

  <line x1="195" y1="100" x2="195" y2="140" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="115" y="140" width="160" height="45" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="195" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">벤더 A SDK 직접 호출</text>

  <line x1="195" y1="185" x2="195" y2="225" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="95" y="225" width="200" height="60" rx="6" fill="#fdecec" stroke="#c23b3b" stroke-width="2"/>
  <text x="195" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a1f1f">벤더 교체 시</text>
  <text x="195" y="264" text-anchor="middle" font-size="11" fill="#7a1f1f">프롬프트·스키마·파싱</text>
  <text x="195" y="278" text-anchor="middle" font-size="11" fill="#7a1f1f">전부 재작성 + 수작업 회귀 확인</text>

  <rect x="95" y="320" width="200" height="60" rx="6" fill="#fff7e6" stroke="#d8972a" stroke-width="2"/>
  <text x="195" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c3d0a">데이터 경계</text>
  <text x="195" y="360" text-anchor="middle" font-size="11" fill="#8a5a00">코드가 어느 리전으로</text>
  <text x="195" y="374" text-anchor="middle" font-size="11" fill="#8a5a00">나가는지 추적 불가</text>

  <!-- Right: adapter layer -->
  <rect x="515" y="55" width="180" height="45" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="605" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d50">에이전트 오케스트레이션</text>
  <text x="605" y="91" text-anchor="middle" font-size="10" fill="#1f2d50">벤더 중립 프롬프트·도구 스키마</text>

  <line x1="605" y1="100" x2="605" y2="135" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arrowgreen)"/>

  <rect x="495" y="135" width="220" height="55" rx="6" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="2"/>
  <text x="605" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d6b3d">모델 어댑터 레이어</text>
  <text x="605" y="172" text-anchor="middle" font-size="10" fill="#1d6b3d">스키마 번역 + 데이터 분류·마스킹</text>
  <text x="605" y="184" text-anchor="middle" font-size="9" fill="#1d6b3d">리전·벤더 허용 정책 적용</text>

  <line x1="540" y1="190" x2="460" y2="230" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arrowgreen)"/>
  <line x1="605" y1="190" x2="605" y2="230" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arrowgreen)"/>
  <line x1="660" y1="190" x2="740" y2="230" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arrowgreen)"/>

  <rect x="400" y="230" width="120" height="45" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="460" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">벤더 A</text>
  <text x="460" y="265" text-anchor="middle" font-size="9" fill="#555">국내 리전 가능</text>

  <rect x="545" y="230" width="120" height="45" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="605" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">벤더 B</text>
  <text x="605" y="265" text-anchor="middle" font-size="9" fill="#555">샌드박스/섀도만</text>

  <rect x="680" y="230" width="120" height="45" rx="6" fill="#fdecec" stroke="#c23b3b" stroke-width="2"/>
  <text x="740" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a1f1f">벤더 C</text>
  <text x="740" y="265" text-anchor="middle" font-size="9" fill="#7a1f1f">리전 정책 위반 — 차단</text>

  <line x1="605" y1="275" x2="605" y2="315" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arrowgreen)"/>

  <rect x="505" y="315" width="200" height="60" rx="6" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="2"/>
  <text x="605" y="337" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d6b3d">벤더 교체 시</text>
  <text x="605" y="354" text-anchor="middle" font-size="11" fill="#1d6b3d">설정값(허용 벤더·리전)만 변경</text>
  <text x="605" y="368" text-anchor="middle" font-size="11" fill="#1d6b3d">오케스트레이션 코드는 그대로</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e9e5b"/>
    </marker>
  </defs>
</svg>
