<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">깜빡임 없는 다크모드 로딩 순서</text>

  <!-- timeline -->
  <line x1="70" y1="90" x2="730" y2="90" stroke="#999" stroke-width="2"/>

  <!-- step 1 -->
  <circle cx="120" cy="90" r="8" fill="#3b6fd6"/>
  <text x="120" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f3d7a">1. HTML 파싱 시작</text>
  <rect x="60" y="110" width="120" height="70" rx="6" fill="#eef4ff" stroke="#3b6fd6"/>
  <text x="120" y="135" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">head 진입</text>
  <text x="120" y="155" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">인라인 스크립트</text>
  <text x="120" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">발견</text>

  <!-- step 2 -->
  <circle cx="340" cy="90" r="8" fill="#03a35a"/>
  <text x="340" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#03612f">2. 테마 결정 (동기 실행)</text>
  <rect x="260" y="110" width="160" height="90" rx="6" fill="#eafaf0" stroke="#03a35a"/>
  <text x="340" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">localStorage 값 있음?</text>
  <text x="340" y="153" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#03612f">있으면 → 그 값 사용</text>
  <text x="340" y="174" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">없으면 →</text>
  <text x="340" y="192" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">prefers-color-scheme</text>

  <!-- step 3 -->
  <circle cx="580" cy="90" r="8" fill="#e08b2b"/>
  <text x="580" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#8a5314">3. data-theme 속성 부착</text>
  <rect x="510" y="110" width="140" height="70" rx="6" fill="#fff5e9" stroke="#e08b2b"/>
  <text x="580" y="135" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">&lt;html data-theme</text>
  <text x="580" y="153" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">="dark"&gt;</text>
  <text x="580" y="171" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">CSS 로드 전 완료</text>

  <!-- step 4 -->
  <circle cx="700" cy="90" r="8" fill="#7a3bd6"/>
  <text x="700" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#4a2280">4. 첫 페인트</text>
  <rect x="655" y="110" width="90" height="70" rx="6" fill="#f2eafa" stroke="#7a3bd6"/>
  <text x="700" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">올바른</text>
  <text x="700" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">테마로</text>
  <text x="700" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">렌더링</text>

  <!-- priority box -->
  <rect x="60" y="240" width="680" height="150" rx="10" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="400" y="268" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333">테마 우선순위</text>

  <rect x="100" y="290" width="260" height="70" rx="8" fill="#eafaf0" stroke="#03a35a" stroke-width="2"/>
  <text x="230" y="318" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#03612f">사용자가 직접 선택한 값</text>
  <text x="230" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#26543a">(localStorage) — 최우선</text>

  <text x="400" y="330" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#999">&gt;</text>

  <rect x="440" y="290" width="260" height="70" rx="8" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="570" y="318" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f3d7a">시스템 설정</text>
  <text x="570" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#26467a">(prefers-color-scheme)</text>
</svg>
