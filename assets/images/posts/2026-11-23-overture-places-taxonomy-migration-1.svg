<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; }
    .boxOld { fill: #fff0f0; stroke: #c0392b; stroke-width: 2; }
    .boxNew { fill: #f0f7f4; stroke: #2e8b57; stroke-width: 2; }
    .boxSvc { fill: #eef3ff; stroke: #3b5bdb; stroke-width: 2; }
    .label { font-size: 12px; fill: #222222; text-anchor: middle; }
    .sublabel { font-size: 10.5px; fill: #555555; text-anchor: middle; }
    .arrow { stroke: #666666; stroke-width: 1.6; marker-end: url(#arrowhead); fill: none; }
    .arrowBad { stroke: #c0392b; stroke-width: 1.6; stroke-dasharray: 4 3; marker-end: url(#arrowheadbad); fill: none; }
    .title { font-size: 15px; font-weight: bold; fill: #222222; }
    .notetext { font-size: 12px; fill: #555555; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#666666" />
    </marker>
    <marker id="arrowheadbad" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#c0392b" />
    </marker>
  </defs>

  <text x="20" y="24" class="title">Overture Places 스키마 v2.0.0 — categories 제거가 흘러드는 경로</text>

  <rect x="20" y="50" width="150" height="50" class="box" />
  <text x="95" y="72" class="label">Overture 데이터 릴리스</text>
  <text x="95" y="90" class="sublabel">GeoParquet · Places 테마</text>

  <line x1="170" y1="60" x2="208" y2="60" class="arrowBad" />
  <rect x="210" y="40" width="160" height="34" class="boxOld" />
  <text x="290" y="62" class="label">categories (deprecated)</text>

  <line x1="170" y1="90" x2="208" y2="90" class="arrow" />
  <rect x="210" y="80" width="160" height="34" class="boxNew" />
  <text x="290" y="102" class="label">taxonomy / basic_category</text>

  <line x1="370" y1="57" x2="408" y2="57" class="arrowBad" />
  <line x1="370" y1="97" x2="408" y2="97" class="arrow" />

  <rect x="410" y="45" width="180" height="70" class="boxSvc" />
  <text x="500" y="68" class="label">우리 지도 서비스 수집 파이프라인</text>
  <text x="500" y="86" class="sublabel">categories 필드로 필터링 중</text>
  <text x="500" y="102" class="sublabel">→ v2.0.0 이후 값이 비어 들어옴</text>

  <line x1="500" y1="115" x2="500" y2="153" class="arrow" />

  <rect x="340" y="155" width="320" height="60" class="box" />
  <text x="500" y="178" class="label">사용자 화면: "카테고리로 필터링"</text>
  <text x="500" y="196" class="sublabel">categories 값이 비어 결과가 0건으로 보임</text>

  <rect x="60" y="260" width="300" height="130" class="boxOld" />
  <text x="210" y="282" class="label" text-anchor="middle">taxonomy 무시하고 버틴 경우</text>
  <text x="210" y="304" class="sublabel">필터 결과가 조용히 0건·일부만 매칭</text>
  <text x="210" y="322" class="sublabel">장애 알람 없이 데이터 신뢰도만 하락</text>
  <text x="210" y="340" class="sublabel">taxonomy.primary / hierarchy /</text>
  <text x="210" y="358" class="sublabel">alternates 약 2,300개 체계 미반영</text>

  <rect x="440" y="260" width="300" height="130" class="boxNew" />
  <text x="590" y="282" class="label" text-anchor="middle">taxonomy로 전환한 경우</text>
  <text x="590" y="304" class="sublabel">taxonomy.primary로 넓은 필터,</text>
  <text x="590" y="322" class="sublabel">basic_category로 단순 라벨 분리</text>
  <text x="590" y="340" class="sublabel">계층(hierarchy)으로 "카페 포함</text>
  <text x="590" y="358" class="sublabel">음식점" 같은 넓은 질의도 가능</text>

  <text x="20" y="420" class="title">핵심: 필드 제거는 조용한 장애다 — 스키마 버전을 코드로 고정하고 타입 체크로 잡아야 한다</text>
</svg>
