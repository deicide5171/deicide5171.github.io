<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">GERS 전역 ID로 다중 소스 공간 데이터 통합하기</text>

  <rect x="30" y="54" width="130" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="95" y="74" text-anchor="middle" font-size="9" font-weight="bold" fill="#7f1d1d">OpenStreetMap</text>
  <text x="95" y="88" text-anchor="middle" font-size="7.5" fill="#991b1b">건물 중심점</text>

  <rect x="30" y="112" width="130" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="95" y="132" text-anchor="middle" font-size="9" font-weight="bold" fill="#7f1d1d">파트너 피드</text>
  <text x="95" y="146" text-anchor="middle" font-size="7.5" fill="#991b1b">출입구 좌표</text>

  <rect x="30" y="170" width="130" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="95" y="190" text-anchor="middle" font-size="9" font-weight="bold" fill="#7f1d1d">자체 수집 데이터</text>
  <text x="95" y="204" text-anchor="middle" font-size="7.5" fill="#991b1b">GPS 오차 포함</text>

  <line x1="160" y1="80" x2="210" y2="150" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowG)"/>
  <line x1="160" y1="137" x2="210" y2="155" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowG)"/>
  <line x1="160" y1="195" x2="210" y2="165" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowG)"/>

  <rect x="210" y="110" width="200" height="100" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="310" y="132" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#312e81">GERS 컨플레이션 레이어</text>
  <text x="310" y="150" text-anchor="middle" font-size="8" fill="#3730a3">피처 단위 매칭 /</text>
  <text x="310" y="163" text-anchor="middle" font-size="8" fill="#3730a3">결정적 해시</text>
  <text x="310" y="180" text-anchor="middle" font-size="8" fill="#3730a3">→ 전역 레지스트리</text>
  <text x="310" y="194" text-anchor="middle" font-size="8" fill="#3730a3">→ 변경 내역(changelog)</text>

  <line x1="410" y1="160" x2="460" y2="160" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="460" y="112" width="160" height="96" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="540" y="132" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#374151">GERS 레지스트리</text>
  <text x="540" y="150" text-anchor="middle" font-size="7.5" fill="#4b5563">ID · 버전 ·</text>
  <text x="540" y="163" text-anchor="middle" font-size="7.5" fill="#4b5563">최초 등장 릴리스</text>
  <text x="540" y="182" text-anchor="middle" font-size="7.5" fill="#4b5563">(월 단위 갱신,</text>
  <text x="540" y="195" text-anchor="middle" font-size="7.5" fill="#4b5563">병합·분할 반영)</text>

  <line x1="310" y1="210" x2="310" y2="250" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <rect x="150" y="250" width="320" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="310" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">자체 공간 DB — gers_id를 조인 키로 채택</text>
  <text x="310" y="290" text-anchor="middle" font-size="8" fill="#065f46">여러 소스 레코드를 하나의 엔티티로 통합</text>

  <line x1="220" y1="306" x2="160" y2="340" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <line x1="310" y1="306" x2="310" y2="340" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <line x1="400" y1="306" x2="460" y2="340" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowH)"/>

  <rect x="70" y="340" width="150" height="46" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="145" y="368" text-anchor="middle" font-size="9" font-weight="bold" fill="#064e3b">검색 랭킹</text>

  <rect x="235" y="340" width="150" height="46" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="310" y="368" text-anchor="middle" font-size="9" font-weight="bold" fill="#064e3b">지도 렌더링</text>

  <rect x="400" y="340" width="150" height="46" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="475" y="368" text-anchor="middle" font-size="9" font-weight="bold" fill="#064e3b">추천 시스템</text>

  <rect x="640" y="112" width="135" height="170" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="707" y="134" text-anchor="middle" font-size="9" font-weight="bold" fill="#7c2d12">GERS가 못 덮는 영역</text>
  <text x="707" y="154" text-anchor="middle" font-size="7.5" fill="#7c2d12">지도화 안 된</text>
  <text x="707" y="166" text-anchor="middle" font-size="7.5" fill="#7c2d12">골목 상권 등</text>
  <text x="707" y="186" text-anchor="middle" font-size="7.5" fill="#7c2d12">→ 자체 매칭</text>
  <text x="707" y="198" text-anchor="middle" font-size="7.5" fill="#7c2d12">로직으로</text>
  <text x="707" y="210" text-anchor="middle" font-size="7.5" fill="#7c2d12">폴백 필요</text>
  <text x="707" y="232" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#9a3412">완전 대체가 아닌</text>
  <text x="707" y="245" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#9a3412">분업 구조</text>

  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowH" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>
</svg>
