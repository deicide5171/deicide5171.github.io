<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">채용 깔때기 단계별 AI 통제 가능성과 신호 가치</text>

  <!-- funnel stages -->
  <rect x="30" y="60" width="170" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="115" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">1차 온라인 테스트</text>
  <text x="115" y="103" text-anchor="middle" font-size="10" fill="#9a3412">통제 불가 · 신호 가치 낮춤</text>

  <rect x="230" y="60" width="170" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="315" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">기술 면접(라이브)</text>
  <text x="315" y="103" text-anchor="middle" font-size="10" fill="#1e3a8a">관찰 가능 · 재설계 집중</text>

  <rect x="430" y="60" width="170" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="515" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">온사이트</text>
  <text x="515" y="103" text-anchor="middle" font-size="10" fill="#166534">AI 활용 라운드 시범 적용</text>

  <rect x="630" y="60" width="140" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="700" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">오퍼</text>
  <text x="700" y="103" text-anchor="middle" font-size="10" fill="#334155">성과 추적으로 검증</text>

  <line x1="200" y1="90" x2="230" y2="90" stroke="#64748b" stroke-width="2"/>
  <line x1="400" y1="90" x2="430" y2="90" stroke="#64748b" stroke-width="2"/>
  <line x1="600" y1="90" x2="630" y2="90" stroke="#64748b" stroke-width="2"/>

  <!-- signal value bars -->
  <text x="30" y="160" font-size="12" font-weight="bold" fill="#1e293b">단계별 "AI 사용 통제 가능성"</text>
  <rect x="30" y="170" width="170" height="18" fill="#fecaca"/>
  <text x="115" y="183" text-anchor="middle" font-size="10" fill="#991b1b">낮음</text>
  <rect x="230" y="170" width="170" height="18" fill="#bfdbfe"/>
  <text x="315" y="183" text-anchor="middle" font-size="10" fill="#1e3a8a">높음</text>
  <rect x="430" y="170" width="170" height="18" fill="#bbf7d0"/>
  <text x="515" y="183" text-anchor="middle" font-size="10" fill="#166534">매우 높음</text>

  <text x="30" y="225" font-size="12" font-weight="bold" fill="#1e293b">단계별 "채용 결정에 쓸 신호 가치"</text>
  <rect x="30" y="235" width="170" height="18" fill="#fecaca"/>
  <text x="115" y="248" text-anchor="middle" font-size="10" fill="#991b1b">낮음(필터만)</text>
  <rect x="230" y="235" width="170" height="18" fill="#bfdbfe"/>
  <text x="315" y="248" text-anchor="middle" font-size="10" fill="#1e3a8a">높음</text>
  <rect x="430" y="235" width="170" height="18" fill="#bbf7d0"/>
  <text x="515" y="248" text-anchor="middle" font-size="10" fill="#166534">매우 높음</text>

  <rect x="30" y="290" width="740" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="400" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">세 전략의 단계별 배치</text>
  <text x="400" y="340" text-anchor="middle" font-size="11" fill="#334155">1차 온라인 테스트 — 탐지 포기, 미달자만 거르는 느슨한 필터로 재정의</text>
  <text x="400" y="362" text-anchor="middle" font-size="11" fill="#334155">기술 면접 — 재설계: AI 사용 허용 + 검증·반박 과정에 꼬리 질문 집중</text>
  <text x="400" y="384" text-anchor="middle" font-size="11" fill="#334155">온사이트 — AI 활용력 평가: 지시·검증·설명 능력을 명시적 루브릭으로 채점</text>
  <text x="400" y="406" text-anchor="middle" font-size="10" fill="#64748b">※ 하나의 전략만 고르지 않고 단계마다 다른 전략을 겹쳐 배치하는 것이 핵심</text>

</svg>
