<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .spec { fill:#eef3fb; stroke:#3b6fd6; stroke-width:1.5; }
    .warn { fill:#fdeceb; stroke:#c0392b; stroke-width:1.5; }
    .good { fill:#eefbf2; stroke:#2f9e5c; stroke-width:1.5; }
    .beta { fill:#f5f0fb; stroke:#8e5ec4; stroke-width:1.5; }
    .lbl { font-size:13px; fill:#1a1a1a; }
    .sub { font-size:11px; fill:#555; }
    .title { font-size:15px; font-weight:bold; fill:#1a1a1a; }
    .arrow { stroke:#444; stroke-width:1.5; marker-end:url(#arrow); fill:none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="140" height="50" rx="6" class="spec"/>
  <text x="90" y="50" text-anchor="middle" class="lbl">스펙 작성</text>

  <path class="arrow" d="M160,45 L220,45"/>

  <!-- tier 1 -->
  <rect x="220" y="20" width="180" height="60" rx="6" class="spec"/>
  <text x="310" y="42" text-anchor="middle" class="lbl">spec-first</text>
  <text x="310" y="58" text-anchor="middle" class="sub">Spec Kit로 코드 생성</text>
  <text x="310" y="72" text-anchor="middle" class="sub">이후 사람이 코드만 편집</text>
  <path class="arrow" d="M400,50 L460,50"/>
  <rect x="460" y="20" width="180" height="60" rx="6" class="warn"/>
  <text x="550" y="42" text-anchor="middle" class="lbl">Spec Drift</text>
  <text x="550" y="58" text-anchor="middle" class="sub">스펙·코드가 조용히 어긋남</text>
  <text x="550" y="72" text-anchor="middle" class="sub">감지 장치 없음</text>

  <text x="660" y="50" class="sub">◀ 다인·멀티세션에서</text>
  <text x="660" y="65" class="sub">  위험 커짐</text>

  <!-- tier 2 -->
  <path class="arrow" d="M90,70 C90,160 310,160 310,130"/>
  <rect x="220" y="130" width="180" height="70" rx="6" class="good"/>
  <text x="310" y="155" text-anchor="middle" class="lbl">spec-anchored</text>
  <text x="310" y="172" text-anchor="middle" class="sub">CI가 코드·스펙 diff 상시 검증</text>
  <text x="310" y="188" text-anchor="middle" class="sub">소유권·순서 메타데이터 부여</text>
  <path class="arrow" d="M400,165 L460,165"/>
  <rect x="460" y="130" width="180" height="70" rx="6" class="good"/>
  <text x="550" y="155" text-anchor="middle" class="lbl">지속적 진실의 원천</text>
  <text x="550" y="172" text-anchor="middle" class="sub">인수인계·감사 가능</text>
  <text x="550" y="188" text-anchor="middle" class="sub">표준 도구 없음 — 자체 구축 필요</text>

  <!-- tier 3 -->
  <path class="arrow" d="M90,70 C90,260 310,260 310,290"/>
  <rect x="220" y="290" width="180" height="60" rx="6" class="beta"/>
  <text x="310" y="312" text-anchor="middle" class="lbl">spec-as-source</text>
  <text x="310" y="328" text-anchor="middle" class="sub">스펙이 곧 산출물로 컴파일</text>
  <text x="310" y="342" text-anchor="middle" class="sub">(Tessl 등, 2026년 베타)</text>
  <path class="arrow" d="M400,320 L460,320"/>
  <rect x="460" y="290" width="180" height="60" rx="6" class="warn"/>
  <text x="550" y="312" text-anchor="middle" class="lbl">프로덕션 전면 도입</text>
  <text x="550" y="328" text-anchor="middle" class="sub">이르다 — 소규모 모듈로만</text>
  <text x="550" y="342" text-anchor="middle" class="sub">실험 권장</text>

  <text x="20" y="400" class="sub">전환 신호: 다인 팀 + 세션을 넘나드는 작업 + 감사 가능한 인수인계 필요</text>
  <text x="20" y="420" class="sub">→ 이 조건이 충족되면 spec-first만으로는 부족, spec-anchoring을 의도적으로 설계해야 한다.</text>
</svg>
