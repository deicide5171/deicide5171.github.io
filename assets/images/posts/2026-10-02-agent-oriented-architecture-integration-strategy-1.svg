<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">레거시 위에 얇게 얹는 Agent-Oriented 통합</text>

  <!-- User channel -->
  <rect x="300" y="42" width="200" height="36" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="400" y="65" text-anchor="middle" font-size="12" fill="#374151">사용자 채널 (문의·요청)</text>

  <line x1="400" y1="78" x2="400" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowg)"/>

  <!-- Orchestrator -->
  <rect x="280" y="100" width="240" height="44" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="400" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#312e81">오케스트레이터 (도메인 분배)</text>

  <line x1="340" y1="144" x2="220" y2="175" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowi)"/>
  <line x1="460" y1="144" x2="580" y2="175" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowi)"/>

  <!-- Domain agents -->
  <rect x="100" y="175" width="240" height="42" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="220" y="201" text-anchor="middle" font-size="12" fill="#312e81">문의 분류 에이전트 (읽기 위주)</text>

  <rect x="460" y="175" width="240" height="42" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="580" y="201" text-anchor="middle" font-size="12" fill="#7f1d1d">환불 처리 에이전트 (쓰기 동반)</text>

  <line x1="220" y1="217" x2="220" y2="245" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowi)"/>
  <line x1="580" y1="217" x2="580" y2="245" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowr)"/>

  <!-- Approval gate for write -->
  <rect x="460" y="245" width="240" height="38" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="580" y="269" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">승인 게이트 + 감사 로그</text>

  <line x1="580" y1="283" x2="580" y2="305" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowr)"/>
  <line x1="220" y1="245" x2="220" y2="305" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowi)"/>

  <!-- MCP adapter layer -->
  <rect x="80" y="305" width="640" height="48" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="400" y="334" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">MCP 어댑터 레이어 — 읽기는 바로 통과, 쓰기는 게이트 거친 요청만</text>

  <line x1="400" y1="353" x2="400" y2="378" stroke="#059669" stroke-width="2" marker-end="url(#arrowgr)"/>

  <!-- Legacy systems -->
  <rect x="80" y="378" width="190" height="48" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="175" y="406" text-anchor="middle" font-size="11" fill="#374151">CRM (변경 없음)</text>

  <rect x="305" y="378" width="190" height="48" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="400" y="406" text-anchor="middle" font-size="11" fill="#374151">주문 시스템 (변경 없음)</text>

  <rect x="530" y="378" width="190" height="48" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="625" y="406" text-anchor="middle" font-size="11" fill="#374151">배치 작업 (변경 없음)</text>

  <defs>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowi" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowgr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
  </defs>
</svg>
