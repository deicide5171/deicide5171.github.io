<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="32" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">라이트 프리셋별 태양 각도와 그림자 변화</text>

  <!-- Four preset panels -->
  <!-- dawn -->
  <rect x="30" y="56" width="175" height="200" rx="8" fill="#fdf1e6" stroke="#e0a868" stroke-width="1.5"/>
  <text x="117" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a3611c" text-anchor="middle">dawn</text>
  <circle cx="70" cy="160" r="12" fill="#f2b866"/>
  <line x1="30" y1="200" x2="205" y2="200" stroke="#c9a876" stroke-width="2"/>
  <rect x="90" y="170" width="24" height="30" fill="#d9c8a8"/>
  <polygon points="90,200 150,200 114,170" fill="#e8ddb8" opacity="0.7"/>
  <text x="117" y="240" font-family="sans-serif" font-size="11" fill="#a3611c" text-anchor="middle">낮은 태양각, 긴 그림자</text>

  <!-- day -->
  <rect x="215" y="56" width="175" height="200" rx="8" fill="#eaf3fc" stroke="#7fb1e0" stroke-width="1.5"/>
  <text x="302" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2f5a8a" text-anchor="middle">day</text>
  <circle cx="302" cy="90" r="14" fill="#ffd966"/>
  <line x1="215" y1="200" x2="390" y2="200" stroke="#a8c8e0" stroke-width="2"/>
  <rect x="275" y="170" width="24" height="30" fill="#c8d8e8"/>
  <polygon points="275,200 305,200 290,193" fill="#d8e4f0" opacity="0.7"/>
  <text x="302" y="240" font-family="sans-serif" font-size="11" fill="#2f5a8a" text-anchor="middle">밝은 조명, 짧은 그림자</text>

  <!-- dusk -->
  <rect x="400" y="56" width="175" height="200" rx="8" fill="#fbe9e6" stroke="#d98a7a" stroke-width="1.5"/>
  <text x="487" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a3421c" text-anchor="middle">dusk</text>
  <circle cx="530" cy="165" r="12" fill="#e0724a"/>
  <line x1="400" y1="200" x2="575" y2="200" stroke="#d9a08e" stroke-width="2"/>
  <rect x="455" y="170" width="24" height="30" fill="#b88070"/>
  <polygon points="455,200 400,200 460,170" fill="#e0a088" opacity="0.6"/>
  <text x="487" y="240" font-family="sans-serif" font-size="11" fill="#a3421c" text-anchor="middle">저녁노을, 대비 강한 그림자</text>

  <!-- night -->
  <rect x="585" y="56" width="185" height="200" rx="8" fill="#232b3d" stroke="#4a5a78" stroke-width="1.5"/>
  <text x="677" y="78" font-family="sans-serif" font-size="14" font-weight="bold" fill="#cdd8f0" text-anchor="middle">night</text>
  <circle cx="650" cy="90" r="8" fill="#e8e8e8"/>
  <rect x="640" y="170" width="24" height="30" fill="#3a4560"/>
  <rect x="644" y="176" width="4" height="4" fill="#ffd966"/>
  <rect x="652" y="176" width="4" height="4" fill="#ffd966"/>
  <rect x="644" y="186" width="4" height="4" fill="#ffd966"/>
  <rect x="700" y="160" width="24" height="40" fill="#3a4560"/>
  <rect x="704" y="168" width="4" height="4" fill="#ffd966"/>
  <rect x="712" y="176" width="4" height="4" fill="#ffd966"/>
  <text x="677" y="240" font-family="sans-serif" font-size="11" fill="#cdd8f0" text-anchor="middle">어두운 톤, 창문 발광 효과</text>

  <!-- config box -->
  <rect x="30" y="280" width="740" height="140" rx="8" fill="#f7f7f7" stroke="#ccc" stroke-width="1.5"/>
  <text x="400" y="304" font-family="sans-serif" font-size="15" font-weight="bold" fill="#333" text-anchor="middle">setConfigProperty('basemap', ...) — 런타임 전환</text>
  <rect x="55" y="316" width="220" height="36" rx="5" fill="#ffffff" stroke="#999"/>
  <text x="165" y="339" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">lightPreset: 'dusk'</text>
  <rect x="290" y="316" width="220" height="36" rx="5" fill="#ffffff" stroke="#999"/>
  <text x="400" y="339" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">show3dObjects: true</text>
  <rect x="525" y="316" width="220" height="36" rx="5" fill="#ffffff" stroke="#999"/>
  <text x="635" y="339" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">showPointOfInterestLabels: false</text>
  <text x="400" y="384" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">스타일 재로드 없이 관련 레이어 전체가 일괄 갱신됨</text>
</svg>
