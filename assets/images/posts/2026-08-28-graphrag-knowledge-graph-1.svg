<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="32" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">GraphRAG 파이프라인: 인덱싱과 두 가지 검색 모드</text>

  <!-- documents -->
  <rect x="30" y="60" width="110" height="60" rx="6" fill="#eef4fb" stroke="#4a7ab5"/>
  <text x="85" y="95" font-family="sans-serif" font-size="13" fill="#2b5a8a" text-anchor="middle">문서 청크</text>

  <line x1="140" y1="90" x2="180" y2="90" stroke="#999" stroke-width="2"/>
  <polygon points="184,90 174,84 174,96" fill="#999"/>

  <!-- graph nodes -->
  <g>
    <circle cx="240" cy="70" r="18" fill="#eefaf1" stroke="#2e9e63" stroke-width="2"/>
    <text x="240" y="75" font-family="sans-serif" font-size="10" fill="#1a6b45" text-anchor="middle">A사</text>
    <circle cx="300" cy="110" r="18" fill="#eefaf1" stroke="#2e9e63" stroke-width="2"/>
    <text x="300" y="115" font-family="sans-serif" font-size="10" fill="#1a6b45" text-anchor="middle">B사</text>
    <circle cx="240" cy="150" r="18" fill="#eefaf1" stroke="#2e9e63" stroke-width="2"/>
    <text x="240" y="155" font-family="sans-serif" font-size="10" fill="#1a6b45" text-anchor="middle">CEO</text>
    <circle cx="200" cy="110" r="18" fill="#eefaf1" stroke="#2e9e63" stroke-width="2"/>
    <text x="200" y="115" font-family="sans-serif" font-size="9" fill="#1a6b45" text-anchor="middle">이전회사</text>
    <line x1="240" y1="88" x2="290" y2="105" stroke="#5b9e7a" stroke-width="1.5"/>
    <line x1="285" y1="118" x2="252" y2="140" stroke="#5b9e7a" stroke-width="1.5"/>
    <line x1="216" y1="120" x2="228" y2="140" stroke="#5b9e7a" stroke-width="1.5"/>
    <line x1="216" y1="105" x2="225" y2="80" stroke="#5b9e7a" stroke-width="1.5"/>
  </g>
  <text x="255" y="195" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">지식그래프(개체+관계)</text>

  <line x1="330" y1="115" x2="380" y2="115" stroke="#999" stroke-width="2"/>
  <polygon points="384,115 374,109 374,121" fill="#999"/>

  <rect x="392" y="70" width="150" height="90" rx="8" fill="#fdf6ec" stroke="#c98a3d" stroke-width="1.5"/>
  <text x="467" y="95" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a3611c" text-anchor="middle">커뮤니티 탐지</text>
  <text x="467" y="115" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">(Leiden 알고리즘)</text>
  <text x="467" y="135" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">군집별 요약을</text>
  <text x="467" y="151" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">LLM으로 미리 생성</text>

  <!-- two query modes -->
  <text x="400" y="220" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">질의 단계 — 두 가지 검색 모드</text>

  <rect x="80" y="245" width="280" height="140" rx="8" fill="#eefaf1" stroke="#2e9e63" stroke-width="2"/>
  <text x="220" y="272" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a6b45" text-anchor="middle">로컬 검색</text>
  <text x="220" y="296" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">질문의 개체에서 출발해</text>
  <text x="220" y="314" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">그래프를 N홉 순회</text>
  <text x="220" y="336" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">→ 다중 홉 관계 질문에 적합</text>
  <text x="220" y="360" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">"B사 CEO의 이전 회사는?"</text>

  <rect x="440" y="245" width="280" height="140" rx="8" fill="#fdf6ec" stroke="#c98a3d" stroke-width="2"/>
  <text x="580" y="272" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a3611c" text-anchor="middle">글로벌 검색</text>
  <text x="580" y="296" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">커뮤니티 요약들을 순회하며</text>
  <text x="580" y="314" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">부분 답변을 모아 종합</text>
  <text x="580" y="336" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">→ 문서 전체 주제 질문에 적합</text>
  <text x="580" y="360" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">"이 문서 모음의 핵심 주제는?"</text>

  <text x="400" y="420" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">단일 사실 확인은 여전히 저비용 벡터 유사도 검색(일반 RAG)이 더 효율적입니다</text>
</svg>
