<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">ShedLock — 셋 다 호출하지만 하나만 실행한다</text>

  <!-- 인스턴스 3개 -->
  <rect x="40" y="60" width="180" height="70" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="130" y="88" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2f5a8c" text-anchor="middle">인스턴스 A</text>
  <text x="130" y="106" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">03:00 크론 발화</text>

  <rect x="310" y="60" width="180" height="70" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="400" y="88" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2f5a8c" text-anchor="middle">인스턴스 B</text>
  <text x="400" y="106" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">03:00 크론 발화</text>

  <rect x="580" y="60" width="180" height="70" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="670" y="88" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2f5a8c" text-anchor="middle">인스턴스 C</text>
  <text x="670" y="106" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">03:00 크론 발화</text>

  <!-- 화살표 to lock store -->
  <line x1="130" y1="130" x2="350" y2="200" stroke="#999" stroke-width="1.5"/>
  <line x1="400" y1="130" x2="400" y2="200" stroke="#999" stroke-width="1.5"/>
  <line x1="670" y1="130" x2="450" y2="200" stroke="#999" stroke-width="1.5"/>
  <text x="400" y="160" font-family="sans-serif" font-size="12" fill="#666" text-anchor="middle">셋 다 동시에 락 획득 시도</text>

  <!-- 락 저장소 -->
  <rect x="300" y="205" width="200" height="70" rx="8" fill="#fdf6ec" stroke="#c98a3d" stroke-width="2"/>
  <text x="400" y="232" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a3611c" text-anchor="middle">공유 락 저장소</text>
  <text x="400" y="250" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">(DB 테이블 / Redis)</text>
  <text x="400" y="265" font-family="sans-serif" font-size="10" fill="#666" text-anchor="middle">name, lock_until, locked_by</text>

  <!-- 결과 -->
  <line x1="350" y1="275" x2="150" y2="340" stroke="#2e9e63" stroke-width="2.5"/>
  <polygon points="150,340 160,332 165,344" fill="#2e9e63"/>
  <line x1="400" y1="275" x2="400" y2="340" stroke="#d0413b" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="450" y1="275" x2="650" y2="340" stroke="#d0413b" stroke-width="2" stroke-dasharray="5,4"/>

  <rect x="40" y="345" width="220" height="70" rx="8" fill="#eef7f1" stroke="#2e9e63" stroke-width="2"/>
  <text x="150" y="370" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a6b45" text-anchor="middle">A: 락 획득 성공</text>
  <text x="150" y="390" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">실제 배치 로직 실행</text>
  <text x="150" y="406" font-family="sans-serif" font-size="10" fill="#666" text-anchor="middle">완료 후 락 해제</text>

  <rect x="310" y="345" width="180" height="70" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="400" y="372" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">B: 락 획득 실패</text>
  <text x="400" y="392" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">이번 회차 스킵</text>

  <rect x="580" y="345" width="180" height="70" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="670" y="372" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">C: 락 획득 실패</text>
  <text x="670" y="392" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">이번 회차 스킵</text>
</svg>
