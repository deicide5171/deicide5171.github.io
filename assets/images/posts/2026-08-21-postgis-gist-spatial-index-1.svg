<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">GiST 공간 인덱스의 바운딩 박스 계층 구조</text>
  <text x="400" y="47" text-anchor="middle" font-size="11.5" fill="#666">검색 반경과 겹치지 않는 가지는 상위 노드에서 통째로 걸러진다(pruning)</text>

  <!-- ===== Left panel: spatial layout ===== -->
  <text x="205" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">① 실제 공간 배치</text>

  <!-- root dashed box -->
  <rect x="50" y="82" width="310" height="288" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="58" y="97" font-size="10.5" fill="#777">루트 MBR</text>

  <!-- Child B (pruned) -->
  <rect x="212" y="102" width="132" height="118" fill="#eef0f2" stroke="#9aa0a8" stroke-width="1.5"/>
  <text x="278" y="116" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">B (제외)</text>
  <rect x="222" y="128" width="50" height="38" fill="#e2e5e8" stroke="#aab0b8" stroke-width="1"/>
  <circle cx="235" cy="140" r="3" fill="#98a0aa"/>
  <circle cx="250" cy="152" r="3" fill="#98a0aa"/>
  <rect x="282" y="152" width="50" height="58" fill="#e2e5e8" stroke="#aab0b8" stroke-width="1"/>
  <circle cx="295" cy="168" r="3" fill="#98a0aa"/>
  <circle cx="310" cy="188" r="3" fill="#98a0aa"/>

  <!-- Child A (visited) -->
  <rect x="63" y="102" width="132" height="118" fill="#e8f1fc" stroke="#1877c9" stroke-width="1.5"/>
  <text x="129" y="116" text-anchor="middle" font-size="10.5" fill="#0b5fa5" font-weight="bold">A (방문)</text>

  <!-- leaf A1 (pruned within A) -->
  <rect x="73" y="128" width="48" height="36" fill="#eef0f2" stroke="#9aa0a8" stroke-width="1"/>
  <circle cx="86" cy="140" r="3" fill="#98a0aa"/>
  <circle cx="100" cy="150" r="3" fill="#98a0aa"/>

  <!-- leaf A2 (visited, contains actual match) -->
  <rect x="126" y="150" width="60" height="60" fill="#dff6e6" stroke="#2fa84f" stroke-width="1.5"/>
  <circle cx="142" cy="170" r="3.2" fill="#1f7a38"/>
  <circle cx="158" cy="188" r="3.2" fill="#1f7a38"/>
  <circle cx="150" cy="200" r="3.2" fill="#1f7a38"/>

  <!-- query radius (dashed red circle) -->
  <circle cx="152" cy="182" r="52" fill="none" stroke="#d64545" stroke-width="1.6" stroke-dasharray="5,4"/>
  <text x="152" y="238" text-anchor="middle" font-size="10" fill="#b23333">검색 반경(ST_DWithin)</text>

  <!-- legend -->
  <rect x="63" y="356" width="12" height="12" fill="#dff6e6" stroke="#2fa84f" stroke-width="1"/>
  <text x="80" y="366" font-size="10" fill="#333">방문(겹침, 실제 확인)</text>
  <rect x="210" y="356" width="12" height="12" fill="#eef0f2" stroke="#9aa0a8" stroke-width="1"/>
  <text x="227" y="366" font-size="10" fill="#333">제외(안 겹침, pruning)</text>

  <!-- divider -->
  <line x1="392" y1="70" x2="392" y2="400" stroke="#e2e2e2" stroke-width="1"/>

  <!-- ===== Right panel: tree structure ===== -->
  <text x="596" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">② 대응되는 GiST 트리 탐색</text>

  <!-- Root node -->
  <rect x="526" y="82" width="140" height="42" rx="6" fill="#0b5fa5" stroke="#083f6e" stroke-width="1.5"/>
  <text x="596" y="108" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Root MBR</text>

  <!-- connectors root -> A,B -->
  <line x1="596" y1="124" x2="470" y2="168" stroke="#1877c9" stroke-width="1.6"/>
  <line x1="596" y1="124" x2="712" y2="168" stroke="#bbb" stroke-width="1.4"/>

  <!-- Child A node (visited) -->
  <rect x="400" y="168" width="140" height="42" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="470" y="188" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">A MBR</text>
  <text x="470" y="203" text-anchor="middle" font-size="9.5" fill="#dbeafe">쿼리와 겹침 → 하위 탐색</text>

  <!-- Child B node (pruned) -->
  <rect x="642" y="168" width="140" height="42" rx="6" fill="#c3c8ce" stroke="#8b929a" stroke-width="1.5"/>
  <text x="712" y="188" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">B MBR</text>
  <text x="712" y="203" text-anchor="middle" font-size="9.5" fill="#555">안 겹침 → 하위 노드 전부 스킵</text>

  <!-- connectors A -> leaf A1, leaf A2 -->
  <line x1="440" y1="210" x2="412" y2="254" stroke="#bbb" stroke-width="1.4"/>
  <line x1="500" y1="210" x2="560" y2="254" stroke="#2fa84f" stroke-width="1.6"/>

  <!-- leaf A1 (pruned) -->
  <rect x="352" y="254" width="120" height="42" rx="6" fill="#c3c8ce" stroke="#8b929a" stroke-width="1.5"/>
  <text x="412" y="274" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">leaf A1</text>
  <text x="412" y="288" text-anchor="middle" font-size="9" fill="#555">쿼리와 안 겹침 → 제외</text>

  <!-- leaf A2 (visited) -->
  <rect x="500" y="254" width="130" height="42" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="565" y="274" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">leaf A2</text>
  <text x="565" y="288" text-anchor="middle" font-size="9" fill="#eafff0">겹침 → 실제 도형 검사</text>

  <!-- connector leaf A2 -> result -->
  <line x1="565" y1="296" x2="565" y2="330" stroke="#2fa84f" stroke-width="1.6"/>

  <rect x="470" y="330" width="190" height="46" rx="6" fill="#fff3e6" stroke="#c9821a" stroke-width="1.5"/>
  <text x="565" y="350" text-anchor="middle" font-size="10.5" fill="#8f5c10" font-weight="bold">recheck: 정확한 거리 재계산</text>
  <text x="565" y="365" text-anchor="middle" font-size="9.5" fill="#8f5c10">조건 만족 시에만 결과에 포함</text>

  <text x="596" y="405" text-anchor="middle" font-size="10.5" fill="#777">B 서브트리 전체와 A의 leaf A1은 실제 거리 계산 없이 통째로 제외된다</text>
</svg>
