<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">지도 범례(legend)의 역할</text>

  <!-- Map area with choropleth-style regions -->
  <g>
    <rect x="60" y="80" width="430" height="300" fill="#f7fbf9" stroke="#ccc" stroke-width="2"/>
    <polygon points="90,120 230,110 250,220 130,240" fill="#c8e6d4" stroke="#fff" stroke-width="2"/>
    <polygon points="230,110 420,130 400,230 250,220" fill="#66c295" stroke="#fff" stroke-width="2"/>
    <polygon points="130,240 250,220 300,340 120,350" fill="#2e8b57" stroke="#fff" stroke-width="2"/>
    <polygon points="250,220 400,230 430,350 300,340" fill="#a5d9bd" stroke="#fff" stroke-width="2"/>
    <text x="275" y="400" font-family="sans-serif" font-size="14" fill="#777" text-anchor="middle">색으로 값을 표현한 지도</text>
  </g>

  <!-- Legend box -->
  <g>
    <rect x="540" y="110" width="210" height="220" fill="#ffffff" stroke="#03c75a" stroke-width="2"/>
    <text x="560" y="140" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">범례 (인구밀도)</text>

    <rect x="560" y="160" width="26" height="20" fill="#c8e6d4" stroke="#ccc"/>
    <text x="596" y="176" font-family="sans-serif" font-size="14" fill="#333">0 – 100</text>

    <rect x="560" y="192" width="26" height="20" fill="#a5d9bd" stroke="#ccc"/>
    <text x="596" y="208" font-family="sans-serif" font-size="14" fill="#333">100 – 300</text>

    <rect x="560" y="224" width="26" height="20" fill="#66c295" stroke="#ccc"/>
    <text x="596" y="240" font-family="sans-serif" font-size="14" fill="#333">300 – 600</text>

    <rect x="560" y="256" width="26" height="20" fill="#2e8b57" stroke="#ccc"/>
    <text x="596" y="272" font-family="sans-serif" font-size="14" fill="#333">600 이상</text>

    <text x="560" y="308" font-family="sans-serif" font-size="12" fill="#777">단위: 명/km²</text>
  </g>

  <text x="400" y="428" font-family="sans-serif" font-size="14" fill="#777" text-anchor="middle">범례가 색과 값 구간을 연결해 지도를 데이터로 읽게 한다</text>
</svg>
