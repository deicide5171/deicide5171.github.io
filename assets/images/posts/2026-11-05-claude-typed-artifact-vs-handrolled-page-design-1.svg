<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .box { fill:#f4f8ff; stroke:#3b6fd6; stroke-width:1.5; }
    .box2 { fill:#fff4ec; stroke:#d97b3f; stroke-width:1.5; }
    .box3 { fill:#f0fbf4; stroke:#2f9e5b; stroke-width:1.5; }
    .lbl { font-size:12.5px; fill:#1a1a1a; }
    .sub { font-size:10.5px; fill:#555; }
    .title { font-size:16px; font-weight:bold; fill:#1a1a1a; }
    .arrow { stroke:#555; stroke-width:1.5; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="20" y="25" class="title">타입드 아티팩트 vs 직접 설계 분기</text>

  <rect x="320" y="40" width="160" height="50" rx="6" class="box"/>
  <text x="400" y="62" text-anchor="middle" class="lbl">사용자 요청</text>
  <text x="400" y="78" text-anchor="middle" class="sub">"데이터 페이지 만들어주세요"</text>

  <line x1="400" y1="90" x2="400" y2="125" class="arrow"/>
  <rect x="300" y="130" width="200" height="50" rx="6" class="box"/>
  <text x="400" y="152" text-anchor="middle" class="lbl">의도 분류 (quickstart)</text>
  <text x="400" y="168" text-anchor="middle" class="sub">문서·슬라이드·대시보드 매칭 확인</text>

  <line x1="340" y1="180" x2="180" y2="220" class="arrow"/>
  <line x1="460" y1="180" x2="620" y2="220" class="arrow"/>

  <rect x="60" y="225" width="240" height="55" rx="6" class="box3"/>
  <text x="180" y="248" text-anchor="middle" class="lbl">기성 타입 있음</text>
  <text x="180" y="265" text-anchor="middle" class="sub">문서 · 슬라이드 · 대시보드 틀에 데이터만 채움</text>

  <rect x="500" y="225" width="240" height="55" rx="6" class="box2"/>
  <text x="620" y="248" text-anchor="middle" class="lbl">기성 타입 없음</text>
  <text x="620" y="265" text-anchor="middle" class="sub">직접 HTML 설계 + 필요한 런타임 기능 선택</text>

  <line x1="180" y1="280" x2="180" y2="320" class="arrow"/>
  <line x1="620" y1="280" x2="620" y2="320" class="arrow"/>

  <rect x="40" y="325" width="280" height="55" rx="6" class="box"/>
  <text x="180" y="348" text-anchor="middle" class="lbl">타입 전용 저장소 / 자체 스토어</text>
  <text x="180" y="365" text-anchor="middle" class="sub">타입이 정한 구조 안에서 갱신</text>

  <rect x="480" y="325" width="280" height="55" rx="6" class="box"/>
  <text x="620" y="348" text-anchor="middle" class="lbl">공유 데이터베이스(ArtifactData)</text>
  <text x="620" y="365" text-anchor="middle" class="sub">여러 뷰어가 같은 상태를 보는 경우에만 연결</text>

  <text x="400" y="410" text-anchor="middle" class="sub" fill="#555">두 경로 모두 결국 "데이터가 어디 머물고 누가 갱신하는가"로 수렴한다</text>
</svg>
