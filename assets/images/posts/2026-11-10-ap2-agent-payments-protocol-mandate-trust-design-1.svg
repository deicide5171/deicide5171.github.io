<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="14" fill="#333333">사용자 의도 → 결제 실행까지, 서명 주체가 바뀌는 세 번의 Mandate</text>

  <!-- user -->
  <rect x="30" y="60" width="150" height="70" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="105" y="88" text-anchor="middle" font-size="13" fill="#15502f">사용자</text>
  <text x="105" y="106" text-anchor="middle" font-size="11" fill="#15502f">"10만원 이하면</text>
  <text x="105" y="120" text-anchor="middle" font-size="11" fill="#15502f">알아서 예약해줘"</text>

  <line x1="180" y1="95" x2="230" y2="95" stroke="#555" stroke-width="2" marker-end="url(#arrowM)"/>

  <rect x="232" y="60" width="150" height="70" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="307" y="85" text-anchor="middle" font-size="13" fill="#1b3a73">Intent Mandate</text>
  <text x="307" y="103" text-anchor="middle" font-size="11" fill="#1b3a73">사용자 서명</text>
  <text x="307" y="118" text-anchor="middle" font-size="11" fill="#1b3a73">위임 범위 확정</text>

  <line x1="382" y1="95" x2="432" y2="95" stroke="#555" stroke-width="2" marker-end="url(#arrowM)"/>

  <rect x="30" y="170" width="150" height="70" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="2"/>
  <text x="105" y="198" text-anchor="middle" font-size="13" fill="#333333">에이전트</text>
  <text x="105" y="216" text-anchor="middle" font-size="11" fill="#333333">후보 상품 탐색</text>
  <text x="105" y="230" text-anchor="middle" font-size="11" fill="#333333">(MCP·A2A로 조회)</text>

  <line x1="105" y1="130" x2="105" y2="170" stroke="#999999" stroke-width="2" stroke-dasharray="5,4"/>

  <rect x="434" y="60" width="150" height="70" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="509" y="85" text-anchor="middle" font-size="13" fill="#1b3a73">Cart Mandate</text>
  <text x="509" y="103" text-anchor="middle" font-size="11" fill="#1b3a73">가맹점 공동 서명</text>
  <text x="509" y="118" text-anchor="middle" font-size="11" fill="#1b3a73">가격·재고 확정</text>

  <line x1="509" y1="130" x2="509" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrowM)"/>

  <rect x="434" y="172" width="150" height="70" rx="8" fill="#fff7f0" stroke="#e08a2e" stroke-width="2"/>
  <text x="509" y="197" text-anchor="middle" font-size="13" fill="#7a4310">가맹점</text>
  <text x="509" y="215" text-anchor="middle" font-size="11" fill="#7a4310">실제 재고·가격</text>
  <text x="509" y="229" text-anchor="middle" font-size="11" fill="#7a4310">검증 후 서명</text>

  <line x1="584" y1="95" x2="634" y2="95" stroke="#555" stroke-width="2" marker-end="url(#arrowM)"/>

  <rect x="636" y="60" width="140" height="70" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="706" y="85" text-anchor="middle" font-size="13" fill="#1b3a73">Payment Mandate</text>
  <text x="706" y="103" text-anchor="middle" font-size="11" fill="#1b3a73">결제사 서명</text>
  <text x="706" y="118" text-anchor="middle" font-size="11" fill="#1b3a73">금액·수단 확정</text>

  <line x1="706" y1="130" x2="706" y2="170" stroke="#555" stroke-width="2" marker-end="url(#arrowM)"/>

  <rect x="636" y="172" width="140" height="60" rx="8" fill="#fdf0f0" stroke="#d6555a" stroke-width="2"/>
  <text x="706" y="196" text-anchor="middle" font-size="13" fill="#7a2a2d">결제 레일</text>
  <text x="706" y="214" text-anchor="middle" font-size="11" fill="#7a2a2d">카드망·은행·스테이블코인</text>

  <rect x="180" y="300" width="440" height="100" rx="8" fill="#f9f9f9" stroke="#aaaaaa" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="400" y="328" text-anchor="middle" font-size="13" fill="#555555">분쟁 발생 시 재구성 가능한 질문</text>
  <text x="400" y="352" text-anchor="middle" font-size="11" fill="#555555">사용자가 승인한 범위(Intent)와 실제 장바구니(Cart)가 일치하는가?</text>
  <text x="400" y="370" text-anchor="middle" font-size="11" fill="#555555">실제 청구된 결제(Payment)가 그 장바구니와 일치하는가?</text>
  <text x="400" y="388" text-anchor="middle" font-size="11" fill="#555555">서명 없이 암묵적으로 넘어간 구간은 없는가?</text>

  <text x="400" y="430" text-anchor="middle" font-size="12" fill="#999999">세 Mandate 중 하나라도 서명이 빠지면 그 구간은 사후 증명이 불가능한 사각지대가 된다</text>
</svg>
