<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">프롬프트 인젝션 공격 경로와 다층 방어</text>

  <!-- Attack path label -->
  <text x="40" y="58" font-size="13" font-weight="bold" fill="#b3261e">공격 경로</text>

  <!-- Attack path boxes -->
  <rect x="20" y="68" width="170" height="56" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="105" y="90" text-anchor="middle" font-size="11" fill="#8f2419">신뢰 안 된 외부 콘텐츠</text>
  <text x="105" y="106" text-anchor="middle" font-size="10.5" fill="#8f2419">(웹페이지·문서·도구 응답)</text>

  <rect x="215" y="68" width="170" height="56" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="300" y="90" text-anchor="middle" font-size="11" fill="#8f2419">LLM 컨텍스트에</text>
  <text x="300" y="106" text-anchor="middle" font-size="11" fill="#8f2419">그대로 삽입됨</text>

  <rect x="410" y="68" width="180" height="56" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="500" y="90" text-anchor="middle" font-size="11" fill="#8f2419">모델이 삽입된 문구를</text>
  <text x="500" y="106" text-anchor="middle" font-size="11" fill="#8f2419">사용자 지시로 오인</text>

  <rect x="615" y="68" width="165" height="56" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="697" y="90" text-anchor="middle" font-size="11" fill="#8f2419">미승인 행동 실행</text>
  <text x="697" y="106" text-anchor="middle" font-size="10.5" fill="#8f2419">(정보 유출·도구 오남용)</text>

  <line x1="190" y1="96" x2="213" y2="96" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="385" y1="96" x2="408" y2="96" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="590" y1="96" x2="613" y2="96" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- divider -->
  <line x1="20" y1="150" x2="780" y2="150" stroke="#ddd" stroke-width="1"/>

  <text x="40" y="176" font-size="13" font-weight="bold" fill="#1f7a38">방어 계층 (각 단계에서 가로챈다)</text>

  <!-- Defense layers stacked -->
  <rect x="20" y="188" width="760" height="52" rx="6" fill="#eafff0" stroke="#2fa84f"/>
  <text x="40" y="209" font-size="11.5" font-weight="bold" fill="#1f7a38">1. 입력 계층</text>
  <text x="40" y="227" font-size="11" fill="#1f7a38">외부 콘텐츠와 사용자 지시의 신뢰 경계를 구분하고, 알려진 인젝션 패턴을 사전 필터링</text>

  <rect x="20" y="248" width="760" height="52" rx="6" fill="#eafff0" stroke="#2fa84f"/>
  <text x="40" y="269" font-size="11.5" font-weight="bold" fill="#1f7a38">2. 프롬프트 설계 계층</text>
  <text x="40" y="287" font-size="11" fill="#1f7a38">시스템 프롬프트에 역할·우선순위 명시, 구분자(delimiter)로 외부 콘텐츠를 데이터로만 표시</text>

  <rect x="20" y="308" width="760" height="52" rx="6" fill="#eafff0" stroke="#2fa84f"/>
  <text x="40" y="329" font-size="11.5" font-weight="bold" fill="#1f7a38">3. 출력·행동 검증 계층</text>
  <text x="40" y="347" font-size="11" fill="#1f7a38">모델의 응답과 도구 호출 계획을 실행 전에 검증하고, 민감정보 유출 여부를 필터링</text>

  <rect x="20" y="368" width="760" height="52" rx="6" fill="#eafff0" stroke="#2fa84f"/>
  <text x="40" y="389" font-size="11.5" font-weight="bold" fill="#1f7a38">4. 실행 권한 계층</text>
  <text x="40" y="407" font-size="11" fill="#1f7a38">도구·API 권한을 최소 권한 원칙으로 제한하고, 민감한 행동은 사람 승인(HITL)을 거치게 함</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="400" y="438" text-anchor="middle" font-size="11" fill="#555">단일 방어책은 없다 — 네 계층 중 어느 하나라도 뚫리면 다음 계층이 막아야 한다(defense in depth)</text>
</svg>
