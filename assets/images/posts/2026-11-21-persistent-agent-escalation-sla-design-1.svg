<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; }
    .boxWatch { fill: #f0f7f4; stroke: #2e8b57; stroke-width: 2; }
    .boxAlert { fill: #fff7f0; stroke: #e08a2e; stroke-width: 2; }
    .boxHuman { fill: #eef3ff; stroke: #3b5bdb; stroke-width: 2; }
    .label { font-size: 13px; fill: #222222; text-anchor: middle; }
    .sublabel { font-size: 11px; fill: #555555; text-anchor: middle; }
    .arrow { stroke: #666666; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .arrowBack { stroke: #3b5bdb; stroke-width: 2; stroke-dasharray: 5 3; marker-end: url(#arrowheadBlue); fill: none; }
    .title { font-size: 15px; font-weight: bold; fill: #222222; }
    .notetext { font-size: 12px; fill: #555555; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666666" />
    </marker>
    <marker id="arrowheadBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3b5bdb" />
    </marker>
  </defs>

  <text x="20" y="28" class="title">상시 에이전트의 작업 루프 + 별도의 에스컬레이션 감시 루프</text>

  <rect x="30" y="55" width="150" height="60" class="box" />
  <text x="105" y="80" class="label">에이전트 작업 루프</text>
  <text x="105" y="98" class="sublabel">조사 · 실행 · 다음 턴</text>

  <rect x="30" y="140" width="150" height="80" class="boxWatch" />
  <text x="105" y="162" class="label">에스컬레이션 감시</text>
  <text x="105" y="180" class="sublabel">타임아웃 15분?</text>
  <text x="105" y="195" class="sublabel">확신도 &lt; 0.6?</text>
  <text x="105" y="210" class="sublabel">되돌릴 수 없는 액션?</text>

  <line x1="105" y1="115" x2="105" y2="138" class="arrow" />

  <rect x="240" y="150" width="150" height="60" class="boxAlert" />
  <text x="315" y="175" class="label">알림 라우팅</text>
  <text x="315" y="193" class="sublabel">역할 기반 (#oncall-infra)</text>

  <line x1="180" y1="180" x2="238" y2="180" class="arrow" />

  <rect x="450" y="150" width="150" height="60" class="boxHuman" />
  <text x="525" y="175" class="label">담당자 (사람)</text>
  <text x="525" y="193" class="sublabel">승인 · 수정 지시 · 거부</text>

  <line x1="390" y1="180" x2="448" y2="180" class="arrow" />

  <path d="M525,150 C525,60 180,60 105,53" class="arrowBack" />
  <text x="330" y="55" class="notetext">사람의 응답이 에이전트의 다음 턴 입력으로 복귀</text>

  <rect x="620" y="55" width="150" height="60" class="box" />
  <text x="695" y="78" class="label">감사 로그</text>
  <text x="695" y="96" class="sublabel">왜 이 시점에 불렀는가</text>
  <line x1="390" y1="165" x2="618" y2="90" class="arrow" />

  <text x="20" y="260" class="title">대기 중 에이전트 행동 범위는 작업 단위로 명시</text>
  <rect x="30" y="280" width="340" height="50" class="boxWatch" />
  <text x="200" y="300" class="label">진단 작업: 승인 대기 중에도 조사는 계속</text>
  <text x="200" y="318" class="sublabel">진행 상황을 스레드에 주기적으로 기록</text>

  <rect x="400" y="280" width="340" height="50" class="boxAlert" />
  <text x="570" y="300" class="label">위험 액션: 승인 올 때까지 해당 액션만 보류</text>
  <text x="570" y="318" class="sublabel">다른 하위 작업은 계속 진행 가능</text>

  <text x="20" y="370" class="title">핵심: 에스컬레이션은 에이전트 로직 안의 if문이 아니라 별도 계층</text>
  <text x="20" y="395" class="notetext">트리거 조건 · 라우팅 규칙 · 대기 중 행동 범위, 이 세 가지를 작업 로직과 분리해 두어야</text>
  <text x="20" y="413" class="notetext">조건을 바꿀 때 에이전트 본체를 건드리지 않고, "왜 사람을 불렀는가"를 감사할 수 있다.</text>
</svg>
