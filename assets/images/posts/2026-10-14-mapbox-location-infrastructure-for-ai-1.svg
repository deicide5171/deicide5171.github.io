<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrowM" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Place ID 유무에 따른 다턴 재참조 안정성 비교</text>

  <text x="200" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">① Place ID로 저장·재조회</text>

  <rect x="60" y="66" width="140" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="130" y="86" text-anchor="middle" font-size="9" font-weight="bold" fill="#064e3b">1턴: 장소 검색</text>
  <text x="130" y="100" text-anchor="middle" font-size="8" fill="#065f46">"강남역 디저트 카페"</text>

  <line x1="200" y1="90" x2="240" y2="90" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <rect x="240" y="66" width="130" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="305" y="86" text-anchor="middle" font-size="9" font-weight="bold" fill="#064e3b">Place ID 저장</text>
  <text x="305" y="100" text-anchor="middle" font-size="8" fill="#065f46">DB 외래키로 보관</text>

  <line x1="305" y1="114" x2="305" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <text x="330" y="135" font-size="7.5" fill="#4b5563">N턴 경과 (상호 변경 가능)</text>

  <rect x="240" y="150" width="130" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="305" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#064e3b">ID로 직접 재조회</text>
  <text x="305" y="184" text-anchor="middle" font-size="8" fill="#065f46">최신 정보 반환</text>

  <line x1="305" y1="198" x2="305" y2="228" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <rect x="220" y="228" width="170" height="40" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="305" y="252" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">같은 장소로 예약 성공</text>

  <line x1="400" y1="130" x2="400" y2="320" stroke="#d1d5db" stroke-width="1.2" stroke-dasharray="4,4"/>

  <text x="600" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">② Place ID 없이 이름 재검색</text>

  <rect x="470" y="66" width="140" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="540" y="86" text-anchor="middle" font-size="9" font-weight="bold" fill="#7f1d1d">1턴: 장소 검색</text>
  <text x="540" y="100" text-anchor="middle" font-size="8" fill="#991b1b">"강남역 디저트 카페"</text>

  <line x1="610" y1="90" x2="650" y2="90" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <rect x="650" y="66" width="120" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="710" y="86" text-anchor="middle" font-size="9" font-weight="bold" fill="#7f1d1d">이름만 저장</text>
  <text x="710" y="100" text-anchor="middle" font-size="8" fill="#991b1b">좌표 근사치</text>

  <line x1="710" y1="114" x2="710" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <text x="735" y="135" font-size="7.5" fill="#4b5563">N턴 경과 (상호 변경)</text>

  <rect x="650" y="150" width="120" height="48" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="710" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#7f1d1d">이름으로 재검색</text>
  <text x="710" y="184" text-anchor="middle" font-size="8" fill="#991b1b">검색 순위 변동 가능</text>

  <line x1="710" y1="198" x2="710" y2="228" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <rect x="630" y="228" width="160" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="710" y="252" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">다른 장소로 예약될 위험</text>

  <text x="400" y="310" text-anchor="middle" font-size="9" fill="#4b5563">공통 전제: 두 경로 모두 1턴 조회는 동일 — 차이는 "그 결과를 어떻게 저장해 다시 참조하는가"에서 생긴다</text>
</svg>
