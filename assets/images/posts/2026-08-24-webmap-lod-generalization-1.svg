<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">줌 레벨에 따른 LOD 제너럴라이제이션</text>

  <!-- Zoom 5 -->
  <text x="140" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a6b45" text-anchor="middle">저줌 (z5) — 강한 단순화</text>
  <rect x="60" y="90" width="160" height="130" rx="6" fill="#f8faf9" stroke="#ccc"/>
  <polyline points="80,190 130,120 200,150" fill="none" stroke="#2e6b9e" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="80" cy="190" r="4" fill="#2e6b9e"/>
  <circle cx="130" cy="120" r="4" fill="#2e6b9e"/>
  <circle cx="200" cy="150" r="4" fill="#2e6b9e"/>
  <text x="140" y="235" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">정점 3개, tolerance 큼</text>

  <!-- Zoom 10 -->
  <text x="400" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a3611c" text-anchor="middle">중줌 (z10) — 중간 단순화</text>
  <rect x="320" y="90" width="160" height="130" rx="6" fill="#f8faf9" stroke="#ccc"/>
  <polyline points="340,190 365,150 400,165 430,120 460,150" fill="none" stroke="#2e6b9e" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="340" cy="190" r="3.5" fill="#2e6b9e"/>
  <circle cx="365" cy="150" r="3.5" fill="#2e6b9e"/>
  <circle cx="400" cy="165" r="3.5" fill="#2e6b9e"/>
  <circle cx="430" cy="120" r="3.5" fill="#2e6b9e"/>
  <circle cx="460" cy="150" r="3.5" fill="#2e6b9e"/>
  <text x="400" y="235" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">정점 5개, tolerance 중간</text>

  <!-- Zoom 16 -->
  <text x="660" y="70" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2e9e63" text-anchor="middle">고줌 (z16) — 원본에 근접</text>
  <rect x="580" y="90" width="160" height="130" rx="6" fill="#f8faf9" stroke="#ccc"/>
  <polyline points="600,190 615,175 630,180 650,150 660,155 675,135 700,140 720,120" fill="none" stroke="#2e6b9e" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="600" cy="190" r="3" fill="#2e6b9e"/>
  <circle cx="615" cy="175" r="3" fill="#2e6b9e"/>
  <circle cx="630" cy="180" r="3" fill="#2e6b9e"/>
  <circle cx="650" cy="150" r="3" fill="#2e6b9e"/>
  <circle cx="660" cy="155" r="3" fill="#2e6b9e"/>
  <circle cx="675" cy="135" r="3" fill="#2e6b9e"/>
  <circle cx="700" cy="140" r="3" fill="#2e6b9e"/>
  <circle cx="720" cy="120" r="3" fill="#2e6b9e"/>
  <text x="660" y="235" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">정점 8개, 원본 형상 유지</text>

  <!-- 화살표 -->
  <line x1="225" y1="155" x2="315" y2="155" stroke="#999" stroke-width="2"/>
  <polygon points="315,155 306,150 306,160" fill="#999"/>
  <line x1="485" y1="155" x2="575" y2="155" stroke="#999" stroke-width="2"/>
  <polygon points="575,155 566,150 566,160" fill="#999"/>
  <text x="270" y="145" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">줌인</text>
  <text x="530" y="145" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">줌인</text>

  <!-- 하단 설명 -->
  <rect x="60" y="270" width="680" height="130" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="80" y="294" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2c5583">정적 방식: tippecanoe -z5 -Z16 --simplification=10</text>
  <text x="80" y="314" font-family="sans-serif" font-size="12.5" fill="#3a5f85">줌 레벨별 벡터 타일을 사전 생성 시점에 각각 단순화해 저장 — 런타임 연산 없음</text>
  <text x="80" y="340" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2c5583">동적 방식: MapLibre style expression (zoom 기반 필터/굵기 보간)</text>
  <text x="80" y="360" font-family="sans-serif" font-size="12.5" fill="#3a5f85">같은 벡터 데이터를 두고 스타일 표현식으로 줌마다 다르게 렌더링 — 유연하지만 GPU/CPU 비용 발생</text>
  <text x="80" y="386" font-family="sans-serif" font-size="12" fill="#7a95b3">공통 목표: 저줌에서 정점 수를 줄여 렌더링 성능과 시각적 명료성을 동시에 확보</text>
</svg>
