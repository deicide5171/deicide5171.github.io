<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">AGENTS.md를 단일 소스로 둔 레포 지침 계층 구조</text>

  <rect x="300" y="52" width="200" height="64" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="400" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">AGENTS.md</text>
  <text x="400" y="92" text-anchor="middle" font-size="8" fill="#3730a3">공유 지침 단일 소스</text>
  <text x="400" y="104" text-anchor="middle" font-size="8" fill="#3730a3">(컨벤션·빌드·테스트)</text>

  <line x1="360" y1="116" x2="150" y2="170" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowA)"/>
  <line x1="400" y1="116" x2="400" y2="170" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowA)"/>
  <line x1="440" y1="116" x2="650" y2="170" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowA)"/>

  <rect x="60" y="170" width="180" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="150" y="192" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">CLAUDE.md</text>
  <text x="150" y="208" text-anchor="middle" font-size="7.5" fill="#991b1b">symlink / 참조</text>
  <text x="150" y="220" text-anchor="middle" font-size="7.5" fill="#991b1b">+ 권한·훅 설정</text>

  <rect x="310" y="170" width="180" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="400" y="192" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">.cursor/rules</text>
  <text x="400" y="208" text-anchor="middle" font-size="7.5" fill="#991b1b">AGENTS.md 임포트</text>
  <text x="400" y="220" text-anchor="middle" font-size="7.5" fill="#991b1b">+ MCP 서버 목록</text>

  <rect x="560" y="170" width="190" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="655" y="192" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">copilot-instructions.md</text>
  <text x="655" y="208" text-anchor="middle" font-size="7.5" fill="#991b1b">AGENTS.md 참조</text>
  <text x="655" y="220" text-anchor="middle" font-size="7.5" fill="#991b1b">+ 리뷰 전용 규칙</text>

  <line x1="150" y1="230" x2="150" y2="270" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="400" y1="230" x2="400" y2="270" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="655" y1="230" x2="655" y2="270" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <rect x="60" y="270" width="180" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="150" y="298" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">Claude Code 세션</text>

  <rect x="310" y="270" width="180" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="400" y="298" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">Cursor 세션</text>

  <rect x="560" y="270" width="190" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="655" y="298" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">Copilot 세션</text>

  <rect x="230" y="350" width="340" height="68" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="400" y="372" text-anchor="middle" font-size="9" font-weight="bold" fill="#7c2d12">한 곳만 고치면 세 도구에 전파</text>
  <text x="400" y="390" text-anchor="middle" font-size="8" fill="#7c2d12">단, 권한·MCP 서버처럼 도구 전용 설정은</text>
  <text x="400" y="403" text-anchor="middle" font-size="8" fill="#7c2d12">AGENTS.md 밖, 각 어댑터 파일에 남는다</text>

  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>
