<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">하이브리드 배치 — 엣지는 1차 필터, 중앙은 상태의 집</text>

  <rect x="30" y="60" width="130" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="95" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#374151">사용자 요청</text>

  <line x1="160" y1="85" x2="210" y2="85" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowE)"/>

  <rect x="210" y="50" width="220" height="150" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="320" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#064e3b">엣지 PoP (가장 가까운 거점)</text>
  <text x="320" y="90" text-anchor="middle" font-size="8" fill="#065f46">V8 isolate · 콜드스타트 없음</text>

  <rect x="226" y="100" width="190" height="40" rx="6" fill="#d1fae5" stroke="#047857" stroke-width="1.3"/>
  <text x="321" y="117" text-anchor="middle" font-size="8" font-weight="bold" fill="#064e3b">요청 자체 정보로 완결되는 로직</text>
  <text x="321" y="132" text-anchor="middle" font-size="8" fill="#065f46">검증 · 라우팅 · 경량 모델 추론</text>

  <rect x="226" y="148" width="190" height="40" rx="6" fill="#bbf7d0" stroke="#047857" stroke-width="1.3"/>
  <text x="321" y="165" text-anchor="middle" font-size="8" font-weight="bold" fill="#064e3b">즉시 응답 (2~15ms 네트워크)</text>
  <text x="321" y="180" text-anchor="middle" font-size="8" fill="#065f46">origin 왕복 없이 종료</text>

  <line x1="320" y1="200" x2="320" y2="230" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="400" y="218" text-anchor="middle" font-size="8" fill="#6b7280">애매·고위험·공유상태 필요 시 폴백</text>

  <line x1="320" y1="230" x2="320" y2="250" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowF)"/>

  <rect x="190" y="250" width="260" height="130" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="320" y="272" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">중앙 Origin 리전</text>
  <text x="320" y="292" text-anchor="middle" font-size="8" fill="#991b1b">공유 상태 · 트랜잭션 일관성</text>

  <rect x="206" y="302" width="110" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="261" y="324" text-anchor="middle" font-size="8" font-weight="bold" fill="#7f1d1d">중앙 서버</text>
  <text x="261" y="340" text-anchor="middle" font-size="7" fill="#991b1b">무거운 모델·로직</text>
  <text x="261" y="352" text-anchor="middle" font-size="7" fill="#991b1b">제약 없음</text>

  <rect x="324" y="302" width="110" height="60" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="379" y="324" text-anchor="middle" font-size="8" font-weight="bold" fill="#7f1d1d">중앙 DB</text>
  <text x="379" y="340" text-anchor="middle" font-size="7" fill="#991b1b">사용자 이력</text>
  <text x="379" y="352" text-anchor="middle" font-size="7" fill="#991b1b">재고·잔액 등 공유 상태</text>

  <rect x="500" y="60" width="270" height="320" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="635" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">판단 기준</text>
  <text x="635" y="112" text-anchor="middle" font-size="9" font-weight="bold" fill="#7c2d12">요청 자체 정보만으로</text>
  <text x="635" y="128" text-anchor="middle" font-size="9" font-weight="bold" fill="#7c2d12">충분한가?</text>

  <text x="635" y="156" text-anchor="middle" font-size="8" fill="#9a3412">예 → 엣지 후보</text>
  <text x="635" y="174" text-anchor="middle" font-size="8" fill="#7c2d12">· 입력값 검증</text>
  <text x="635" y="190" text-anchor="middle" font-size="8" fill="#7c2d12">· 단건 리스크 스코어링</text>
  <text x="635" y="206" text-anchor="middle" font-size="8" fill="#7c2d12">· 텍스트 분류·모더레이션</text>

  <line x1="540" y1="222" x2="730" y2="222" stroke="#f0a04b" stroke-width="1"/>

  <text x="635" y="246" text-anchor="middle" font-size="8" fill="#9a3412">아니오 → 중앙 유지</text>
  <text x="635" y="264" text-anchor="middle" font-size="8" fill="#7c2d12">· 30일 거래 패턴 대조</text>
  <text x="635" y="280" text-anchor="middle" font-size="8" fill="#7c2d12">· 재고 차감 트랜잭션</text>
  <text x="635" y="296" text-anchor="middle" font-size="8" fill="#7c2d12">· 다중 사용자 공유 상태</text>

  <text x="635" y="330" text-anchor="middle" font-size="8" font-weight="bold" fill="#9a3412">엣지는 중앙을 대체하지 않는다</text>
  <text x="635" y="348" text-anchor="middle" font-size="8" fill="#7c2d12">"빠른 1차 필터" 계층으로 추가될 뿐</text>
  <text x="635" y="364" text-anchor="middle" font-size="8" fill="#7c2d12">관측성·폴백 설계가 선행돼야 함</text>

  <defs>
    <marker id="arrowE" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowF" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
