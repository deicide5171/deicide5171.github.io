<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- layers -->
  <rect x="40" y="40" width="220" height="60" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="150" y="65" text-anchor="middle" font-size="14" fill="#1b3a73">Controller (API 경계)</text>
  <text x="150" y="84" text-anchor="middle" font-size="11" fill="#1b3a73">@NullMarked 최우선 적용</text>

  <rect x="290" y="40" width="220" height="60" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="400" y="65" text-anchor="middle" font-size="14" fill="#15502f">Service</text>
  <text x="400" y="84" text-anchor="middle" font-size="11" fill="#15502f">@Nullable로 분기 표시</text>

  <rect x="540" y="40" width="220" height="60" rx="8" fill="#fff7f0" stroke="#e08a2e" stroke-width="2"/>
  <text x="650" y="65" text-anchor="middle" font-size="14" fill="#7a4310">Repository / 외부 API</text>
  <text x="650" y="84" text-anchor="middle" font-size="11" fill="#7a4310">서드파티 경계 — 보수적 처리</text>

  <line x1="260" y1="70" x2="288" y2="70" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="510" y1="70" x2="538" y2="70" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- compile time pipeline -->
  <rect x="150" y="160" width="500" height="60" rx="8" fill="#f3f0ff" stroke="#6c4fd6" stroke-width="2"/>
  <text x="400" y="184" text-anchor="middle" font-size="15" fill="#3a2a73">정적분석 도구 (NullAway · IntelliJ 검사기)</text>
  <text x="400" y="204" text-anchor="middle" font-size="12" fill="#3a2a73">JSpecify 어노테이션을 읽어 컴파일 경고/에러로 변환</text>

  <line x1="150" y1="100" x2="300" y2="158" stroke="#999" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow3)"/>
  <line x1="400" y1="100" x2="400" y2="158" stroke="#999" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow3)"/>
  <line x1="650" y1="100" x2="500" y2="158" stroke="#999" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow3)"/>

  <!-- CI gate -->
  <rect x="220" y="260" width="360" height="55" rx="8" fill="#fdf6e3" stroke="#c9a227" stroke-width="2"/>
  <text x="400" y="284" text-anchor="middle" font-size="14" fill="#6b5a10">CI 게이트 — 지정 패키지부터 점진 확대</text>
  <text x="400" y="302" text-anchor="middle" font-size="11" fill="#6b5a10">전체 프로젝트 일괄 적용 금지</text>

  <line x1="400" y1="220" x2="400" y2="258" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- result -->
  <rect x="250" y="355" width="300" height="55" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="2"/>
  <text x="400" y="379" text-anchor="middle" font-size="14" fill="#333333">런타임 NPE 발생 전, 빌드 단계에서 차단</text>

  <line x1="400" y1="315" x2="400" y2="353" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
</svg>
