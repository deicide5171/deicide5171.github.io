<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">개별 마커 vs 히트맵</text>

  <!-- Left: overlapping markers -->
  <rect x="40" y="70" width="330" height="300" rx="8" fill="#fbfbfb" stroke="#ccc" stroke-width="2"/>
  <text x="205" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#555">개별 마커 (겹쳐서 안 보임)</text>
  <g fill="#e05252" opacity="0.6">
    <circle cx="180" cy="200" r="7"/><circle cx="190" cy="205" r="7"/><circle cx="185" cy="195" r="7"/>
    <circle cx="195" cy="210" r="7"/><circle cx="175" cy="208" r="7"/><circle cx="188" cy="215" r="7"/>
    <circle cx="200" cy="200" r="7"/><circle cx="182" cy="220" r="7"/><circle cx="192" cy="198" r="7"/>
    <circle cx="250" cy="260" r="7"/><circle cx="260" cy="265" r="7"/><circle cx="255" cy="255" r="7"/>
    <circle cx="140" cy="150" r="7"/><circle cx="300" cy="180" r="7"/>
  </g>

  <!-- Right: heatmap -->
  <rect x="430" y="70" width="330" height="300" rx="8" fill="#fbfbfb" stroke="#ccc" stroke-width="2"/>
  <text x="595" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0a5a30">히트맵 (밀집도가 한눈에)</text>
  <defs>
    <radialGradient id="hot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d7191c" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fdae61" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#ffffbf" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2c7bb6" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdae61" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#ffffbf" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2c7bb6" stop-opacity="0.05"/>
    </radialGradient>
  </defs>
  <circle cx="575" cy="205" r="80" fill="url(#hot)"/>
  <circle cx="650" cy="265" r="55" fill="url(#warm)"/>
  <circle cx="530" cy="160" r="40" fill="url(#warm)"/>

  <!-- color legend -->
  <rect x="470" y="335" width="250" height="14" fill="url(#legendgrad)"/>
  <defs>
    <linearGradient id="legendgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c7bb6"/>
      <stop offset="50%" stop-color="#ffffbf"/>
      <stop offset="100%" stop-color="#d7191c"/>
    </linearGradient>
  </defs>
  <text x="470" y="365" font-family="sans-serif" font-size="11" fill="#555">낮음</text>
  <text x="700" y="365" text-anchor="end" font-family="sans-serif" font-size="11" fill="#555">높음</text>

  <text x="400" y="405" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">밀집도 경향만 보면 될 때는 히트맵이 훨씬 직관적이다</text>
</svg>
