<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">세 번째 클라이언트 — 코어 서비스 앞의 BFF / BFA 계층</text>

  <rect x="320" y="330" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="355" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">코어 서비스 API</text>
  <text x="400" y="372" text-anchor="middle" font-size="8" fill="#166534">리소스 중심 REST</text>

  <line x1="150" y1="130" x2="340" y2="330" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowD)"/>
  <line x1="400" y1="130" x2="400" y2="330" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowD)"/>
  <line x1="650" y1="130" x2="460" y2="330" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowD)"/>

  <rect x="60" y="60" width="180" height="70" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="150" y="84" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#312e81">웹 BFF</text>
  <text x="150" y="100" text-anchor="middle" font-size="8" fill="#3730a3">화면 단위 데이터 집계</text>
  <text x="150" y="114" text-anchor="middle" font-size="8" fill="#3730a3">사람이 눈으로 훑음</text>

  <rect x="310" y="60" width="180" height="70" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="400" y="84" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#312e81">모바일 BFF</text>
  <text x="400" y="100" text-anchor="middle" font-size="8" fill="#3730a3">화면 단위 데이터 집계</text>
  <text x="400" y="114" text-anchor="middle" font-size="8" fill="#3730a3">사람이 눈으로 훑음</text>

  <rect x="560" y="55" width="200" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
  <text x="660" y="76" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7c2d12">BFA (에이전트 전용)</text>
  <text x="660" y="92" text-anchor="middle" font-size="7.5" fill="#9a3412">· 작업 단위 도구로 재포장</text>
  <text x="660" y="104" text-anchor="middle" font-size="7.5" fill="#9a3412">· 응답 압축(토큰 예산)</text>
  <text x="660" y="116" text-anchor="middle" font-size="7.5" fill="#9a3412">· 구조화된 에러 + 멱등성 키</text>

  <text x="150" y="155" text-anchor="middle" font-size="8" fill="#4b5563">응답 = 화면 렌더링용</text>
  <text x="660" y="150" text-anchor="middle" font-size="8" fill="#4b5563">응답 = 다음 추론의 입력(매 턴 컨텍스트에 남음)</text>

  <rect x="580" y="200" width="160" height="56" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.8"/>
  <text x="660" y="222" text-anchor="middle" font-size="9" font-weight="bold" fill="#581c87">에이전트 런타임</text>
  <text x="660" y="238" text-anchor="middle" font-size="7.5" fill="#6b21a8">도구 호출 + 재시도</text>

  <line x1="660" y1="135" x2="660" y2="200" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowD)"/>

  <text x="400" y="420" text-anchor="middle" font-size="9" fill="#4b5563">BFF는 "어떤 화면이냐"로 갈라지고, BFA는 "토큰 예산·재시도 안전성"이라는 다른 축으로 갈라진다</text>
</svg>
