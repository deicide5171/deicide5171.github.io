<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">레인지 파티셔닝과 파티션 프루닝</text>
  <text x="400" y="46" text-anchor="middle" font-size="11.5" fill="#666">created_at 기준 월별 파티션 — 쿼리 조건에 해당하는 파티션만 스캔한다</text>

  <defs>
    <marker id="arrowP" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0b5fa5"/>
    </marker>
    <marker id="arrowHit" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1f7a38"/>
    </marker>
    <marker id="arrowSkip" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#aaaaaa"/>
    </marker>
  </defs>

  <!-- Parent table -->
  <rect x="290" y="66" width="220" height="52" rx="6" fill="#eaf3ff" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="400" y="88" text-anchor="middle" font-size="11" fill="#0b5fa5" font-weight="bold">orders (부모 테이블)</text>
  <text x="400" y="104" text-anchor="middle" font-size="9.5" fill="#0b5fa5">PARTITION BY RANGE (created_at)</text>

  <!-- lines down to partitions -->
  <line x1="340" y1="118" x2="150" y2="150" stroke="#0b5fa5" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="375" y1="118" x2="330" y2="150" stroke="#0b5fa5" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="425" y1="118" x2="470" y2="150" stroke="#0b5fa5" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="460" y1="118" x2="650" y2="150" stroke="#0b5fa5" stroke-width="1.5" marker-end="url(#arrowP)"/>

  <!-- Partition boxes -->
  <rect x="50" y="152" width="160" height="56" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
  <text x="130" y="174" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">orders_2026_05</text>
  <text x="130" y="190" text-anchor="middle" font-size="9" fill="#888">05-01 ~ 06-01</text>
  <text x="130" y="200" text-anchor="middle" font-size="8.5" fill="#aaa">스캔 제외</text>

  <rect x="230" y="152" width="160" height="56" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
  <text x="310" y="174" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">orders_2026_06</text>
  <text x="310" y="190" text-anchor="middle" font-size="9" fill="#888">06-01 ~ 07-01</text>
  <text x="310" y="200" text-anchor="middle" font-size="8.5" fill="#aaa">스캔 제외</text>

  <rect x="410" y="152" width="160" height="56" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
  <text x="490" y="174" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">orders_2026_07</text>
  <text x="490" y="190" text-anchor="middle" font-size="9" fill="#888">07-01 ~ 08-01</text>
  <text x="490" y="200" text-anchor="middle" font-size="8.5" fill="#aaa">스캔 제외</text>

  <rect x="590" y="152" width="160" height="56" rx="6" fill="#eaffef" stroke="#1f7a38" stroke-width="2"/>
  <text x="670" y="174" text-anchor="middle" font-size="10.5" fill="#1f7a38" font-weight="bold">orders_2026_08</text>
  <text x="670" y="190" text-anchor="middle" font-size="9" fill="#1f7a38">08-01 ~ 09-01</text>
  <text x="670" y="200" text-anchor="middle" font-size="8.5" fill="#1f7a38" font-weight="bold">실제 스캔 대상</text>

  <!-- Divider -->
  <line x1="30" y1="232" x2="770" y2="232" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Query box -->
  <rect x="270" y="250" width="260" height="60" rx="6" fill="#fff4e5" stroke="#c9701d" stroke-width="1.5"/>
  <text x="400" y="272" text-anchor="middle" font-size="10.5" fill="#a3550f" font-weight="bold">SELECT * FROM orders</text>
  <text x="400" y="288" text-anchor="middle" font-size="10" fill="#a3550f">WHERE created_at &gt;= '2026-08-01'</text>
  <text x="400" y="303" text-anchor="middle" font-size="9" fill="#a3550f">플래너가 프루닝 판단</text>

  <!-- arrows from query to partitions -->
  <line x1="380" y1="310" x2="150" y2="356" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowSkip)"/>
  <line x1="390" y1="310" x2="310" y2="356" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowSkip)"/>
  <line x1="405" y1="310" x2="490" y2="356" stroke="#aaaaaa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowSkip)"/>
  <line x1="450" y1="310" x2="670" y2="356" stroke="#1f7a38" stroke-width="2.5" marker-end="url(#arrowHit)"/>

  <!-- result labels -->
  <text x="130" y="374" text-anchor="middle" font-size="9" fill="#aaa">건너뜀</text>
  <text x="310" y="374" text-anchor="middle" font-size="9" fill="#aaa">건너뜀</text>
  <text x="490" y="374" text-anchor="middle" font-size="9" fill="#aaa">건너뜀</text>
  <text x="670" y="374" text-anchor="middle" font-size="9.5" fill="#1f7a38" font-weight="bold">스캔</text>

  <!-- Note -->
  <rect x="30" y="392" width="740" height="46" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="400" y="412" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">파티션 키(created_at)가 WHERE 절 조건에 그대로 등장해야 프루닝이 동작한다</text>
  <text x="400" y="428" text-anchor="middle" font-size="9.5" fill="#555">조건이 파티션 키와 무관하거나 함수로 감싸져 있으면 플래너는 전체 파티션을 순회한다</text>
</svg>
