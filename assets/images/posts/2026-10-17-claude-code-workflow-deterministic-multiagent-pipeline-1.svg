<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>

  <!-- Outer deterministic script boundary -->
  <rect x="20" y="20" width="760" height="410" rx="12" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="40" y="45" font-size="15" fill="#333" font-weight="bold">Workflow 스크립트 (결정론적 제어 흐름)</text>

  <!-- Phase 1: Review -->
  <rect x="50" y="70" width="260" height="300" rx="8" fill="#e8f0fe" stroke="#4a6fd4" stroke-width="1.5"/>
  <text x="180" y="95" font-size="14" fill="#2c4a9e" font-weight="bold" text-anchor="middle">Phase: Review</text>

  <rect x="75" y="115" width="210" height="60" rx="6" fill="#ffffff" stroke="#4a6fd4"/>
  <text x="180" y="140" font-size="13" text-anchor="middle" fill="#222">agent: bugs 리뷰</text>
  <text x="180" y="158" font-size="11" text-anchor="middle" fill="#777">(LLM 판단)</text>

  <rect x="75" y="190" width="210" height="60" rx="6" fill="#ffffff" stroke="#4a6fd4"/>
  <text x="180" y="215" font-size="13" text-anchor="middle" fill="#222">agent: perf 리뷰</text>
  <text x="180" y="233" font-size="11" text-anchor="middle" fill="#777">(LLM 판단)</text>

  <rect x="75" y="265" width="210" height="60" rx="6" fill="#ffffff" stroke="#4a6fd4"/>
  <text x="180" y="290" font-size="13" text-anchor="middle" fill="#222">agent: security 리뷰</text>
  <text x="180" y="308" font-size="11" text-anchor="middle" fill="#777">(LLM 판단)</text>

  <!-- Phase 2: Verify -->
  <rect x="460" y="70" width="290" height="300" rx="8" fill="#fdeee8" stroke="#d4714a" stroke-width="1.5"/>
  <text x="605" y="95" font-size="14" fill="#9e3f2c" font-weight="bold" text-anchor="middle">Phase: Verify</text>

  <rect x="485" y="125" width="240" height="50" rx="6" fill="#ffffff" stroke="#d4714a"/>
  <text x="605" y="155" font-size="13" text-anchor="middle" fill="#222">agent: 발견 1 검증</text>

  <rect x="485" y="190" width="240" height="50" rx="6" fill="#ffffff" stroke="#d4714a"/>
  <text x="605" y="220" font-size="13" text-anchor="middle" fill="#222">agent: 발견 2 검증</text>

  <rect x="485" y="255" width="240" height="50" rx="6" fill="#ffffff" stroke="#d4714a"/>
  <text x="605" y="285" font-size="13" text-anchor="middle" fill="#222">agent: 발견 3 검증</text>

  <text x="605" y="345" font-size="11" text-anchor="middle" fill="#777">confirmed 결과만 반환</text>

  <!-- Streaming arrows: bugs finishes early -> verify, security still running -->
  <path d="M 285 145 C 380 145, 400 150, 485 150" fill="none" stroke="#4a6fd4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="135" font-size="10" fill="#4a6fd4">먼저 끝나는 즉시 흘려보냄</text>

  <path d="M 285 220 C 380 220, 400 215, 485 215" fill="none" stroke="#4a6fd4" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M 285 295 C 380 295, 400 280, 485 280" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="390" y="312" font-size="10" fill="#999">security는 아직 실행 중이어도 전체는 안 멈춤</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a6fd4"/>
    </marker>
  </defs>
</svg>
