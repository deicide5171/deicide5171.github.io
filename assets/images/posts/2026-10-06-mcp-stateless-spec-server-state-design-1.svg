<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">세션 기반(구) vs 스테이트리스(2026-07-28 신 스펙)</text>

  <text x="195" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">구 구조 — 세션에 상태가 고정</text>

  <rect x="110" y="64" width="170" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="195" y="88" text-anchor="middle" font-size="10" fill="#7f1d1d">클라이언트 (세션 ID 보유)</text>

  <line x1="195" y1="104" x2="195" y2="124" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <rect x="110" y="124" width="170" height="36" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="195" y="146" text-anchor="middle" font-size="9" fill="#7f1d1d">로드밸런서 (sticky session)</text>

  <line x1="195" y1="160" x2="195" y2="180" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <rect x="90" y="180" width="210" height="60" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="195" y="202" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">고정된 서버 인스턴스</text>
  <text x="195" y="218" text-anchor="middle" font-size="9" fill="#991b1b">인증·작업상태·알림이</text>
  <text x="195" y="232" text-anchor="middle" font-size="9" fill="#991b1b">메모리 안에 함께 존재</text>

  <text x="605" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#064e3b">신 구조 — 상태가 서버 밖으로</text>

  <rect x="520" y="64" width="170" height="40" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="605" y="88" text-anchor="middle" font-size="10" fill="#064e3b">클라이언트 (매 요청 독립)</text>

  <line x1="605" y1="104" x2="605" y2="124" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowM2)"/>

  <rect x="520" y="124" width="170" height="36" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="605" y="146" text-anchor="middle" font-size="9" fill="#064e3b">로드밸런서 (라운드로빈)</text>

  <line x1="565" y1="160" x2="540" y2="180" stroke="#059669" stroke-width="1.3" marker-end="url(#arrowM2)"/>
  <line x1="645" y1="160" x2="670" y2="180" stroke="#059669" stroke-width="1.3" marker-end="url(#arrowM2)"/>

  <rect x="500" y="180" width="90" height="40" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="545" y="204" text-anchor="middle" font-size="9" fill="#064e3b">인스턴스 A</text>

  <rect x="620" y="180" width="90" height="40" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="665" y="204" text-anchor="middle" font-size="9" fill="#064e3b">인스턴스 B</text>

  <line x1="545" y1="220" x2="605" y2="246" stroke="#059669" stroke-width="1.3" marker-end="url(#arrowM2)"/>
  <line x1="665" y1="220" x2="605" y2="246" stroke="#059669" stroke-width="1.3" marker-end="url(#arrowM2)"/>

  <rect x="500" y="246" width="210" height="40" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="1.8"/>
  <text x="605" y="264" text-anchor="middle" font-size="9" font-weight="bold" fill="#064e3b">Redis / DB</text>
  <text x="605" y="278" text-anchor="middle" font-size="8" fill="#065f46">task ID 기반 작업 상태 저장</text>

  <line x1="400" y1="60" x2="400" y2="300" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="60" y="330" width="680" height="88" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="400" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">인증: 세션 캐시 → 요청마다 자체완결형 토큰 검증</text>
  <text x="400" y="376" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">장시간 작업: 세션에 진행률 보관 → task ID + 외부 저장소 + MRTR 폴링</text>
  <text x="400" y="398" text-anchor="middle" font-size="10" fill="#7c2d12">Roots / Sampling / Logging은 12개월 유예 후 폐기 — 기한 내 마이그레이션 필요</text>

  <defs>
    <marker id="arrowM" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowM2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>
</svg>
