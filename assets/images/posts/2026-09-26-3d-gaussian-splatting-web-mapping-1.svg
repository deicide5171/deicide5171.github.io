<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Segoe UI', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#f7f7f5"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">메시 기반 3D 재구성 vs 3D Gaussian Splatting</text>

  <!-- Panel 1: Mesh -->
  <g>
    <rect x="30" y="60" width="330" height="360" rx="10" fill="#ffffff" stroke="#ccc"/>
    <text x="195" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6cb0">1. 전통적 메시 재구성</text>

    <text x="195" y="115" text-anchor="middle" font-size="12" fill="#666">사진 여러 장 → SfM → 폴리곤 메시</text>

    <!-- polygon mesh building shape -->
    <g transform="translate(75,140)">
      <polygon points="100,10 180,60 180,150 100,200 20,150 20,60" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.5"/>
      <!-- facet lines to show polygon edges -->
      <line x1="100" y1="10" x2="100" y2="200" stroke="#4a5568" stroke-width="1"/>
      <line x1="20" y1="60" x2="180" y2="60" stroke="#4a5568" stroke-width="1"/>
      <line x1="20" y1="150" x2="180" y2="150" stroke="#4a5568" stroke-width="1"/>
      <line x1="20" y1="60" x2="100" y2="10" stroke="#4a5568" stroke-width="1"/>
      <line x1="180" y1="150" x2="100" y2="200" stroke="#4a5568" stroke-width="1"/>
      <text x="100" y="230" text-anchor="middle" font-size="11" fill="#4a5568">각진 표면(폴리곤 경계 티남)</text>
    </g>

    <rect x="55" y="315" width="260" height="90" rx="6" fill="#f4f4f4" stroke="#ddd"/>
    <text x="65" y="335" font-size="12" fill="#222" font-family="Consolas, monospace">- 정점/면 텍스처 매핑</text>
    <text x="65" y="353" font-size="12" fill="#222" font-family="Consolas, monospace">- 얇은 구조물(전선,잎)</text>
    <text x="65" y="371" font-size="12" fill="#222" font-family="Consolas, monospace">  재구성 시 구멍·왜곡</text>
    <text x="65" y="389" font-size="12" fill="#222" font-family="Consolas, monospace">- glTF/3D Tiles로 배포</text>
  </g>

  <!-- Arrow -->
  <g>
    <line x1="372" y1="240" x2="418" y2="240" stroke="#03c75a" stroke-width="3" marker-end="url(#arrow2)"/>
    <text x="395" y="225" text-anchor="middle" font-size="11" fill="#03c75a" font-weight="bold">대안</text>
  </g>

  <!-- Panel 2: Gaussian Splatting -->
  <g>
    <rect x="430" y="60" width="340" height="360" rx="10" fill="#ffffff" stroke="#ccc"/>
    <text x="600" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6cb0">2. 3D Gaussian Splatting</text>
    <text x="600" y="115" text-anchor="middle" font-size="12" fill="#666">사진 여러 장 → SfM → 타원체(가우시안) 집합</text>

    <g transform="translate(455,140)">
      <rect x="0" y="0" width="290" height="200" fill="#fdf6ec" stroke="#eadfc9"/>
      <!-- Overlapping semi-transparent ellipses forming a soft realistic blob -->
      <ellipse cx="90" cy="90" rx="45" ry="30" fill="#8fbf9f" opacity="0.55"/>
      <ellipse cx="130" cy="70" rx="35" ry="50" fill="#7aa8c9" opacity="0.5" transform="rotate(20 130 70)"/>
      <ellipse cx="160" cy="120" rx="50" ry="25" fill="#e3b97f" opacity="0.5"/>
      <ellipse cx="110" cy="130" rx="30" ry="40" fill="#c78fa8" opacity="0.45" transform="rotate(-15 110 130)"/>
      <ellipse cx="200" cy="80" rx="28" ry="38" fill="#9fb88f" opacity="0.5" transform="rotate(35 200 80)"/>
      <ellipse cx="70" cy="140" rx="25" ry="18" fill="#d4c17a" opacity="0.5"/>
      <ellipse cx="200" cy="150" rx="22" ry="30" fill="#8f9fbf" opacity="0.45" transform="rotate(-25 200 150)"/>
      <text x="145" y="230" text-anchor="middle" font-size="11" fill="#7a5c2e" font-family="'Segoe UI'">반투명 타원체가 겹쳐 부드러운 표면 형성</text>
    </g>

    <rect x="455" y="355" width="290" height="50" rx="6" fill="#f4f4f4" stroke="#ddd"/>
    <text x="465" y="373" font-size="12" fill="#222" font-family="Consolas, monospace">위치·크기·회전·색·불투명도</text>
    <text x="465" y="391" font-size="12" fill="#222" font-family="Consolas, monospace">→ GPU 래스터화로 실시간 스플랫</text>
  </g>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#03c75a"/>
    </marker>
  </defs>
</svg>
