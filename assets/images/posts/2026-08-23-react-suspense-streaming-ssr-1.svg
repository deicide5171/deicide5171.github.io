<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">기존 SSR vs 스트리밍 SSR — HTML이 도착하는 방식</text>

  <!-- time axis -->
  <line x1="60" y1="58" x2="720" y2="58" stroke="#bbbbbb" stroke-width="1.5"/>
  <polygon points="720,58 708,53 708,63" fill="#bbbbbb"/>
  <text x="740" y="63" font-family="sans-serif" font-size="14" fill="#888888">시간</text>

  <!-- Section 1: traditional SSR -->
  <text x="60" y="92" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c0392b">기존 SSR (renderToString)</text>

  <rect x="60" y="104" width="185" height="44" rx="6" fill="#fdeaea" stroke="#e08383" stroke-width="1.5"/>
  <text x="152" y="131" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7b2d26">느린 데이터까지 전부 대기</text>

  <rect x="253" y="104" width="130" height="44" rx="6" fill="#fdeaea" stroke="#e08383" stroke-width="1.5"/>
  <text x="318" y="131" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7b2d26">전체 렌더링</text>

  <rect x="391" y="104" width="160" height="44" rx="6" fill="#fdeaea" stroke="#e08383" stroke-width="1.5"/>
  <text x="471" y="131" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7b2d26">HTML 한 번에 전송</text>

  <rect x="559" y="104" width="181" height="44" rx="6" fill="#fdeaea" stroke="#e08383" stroke-width="1.5"/>
  <text x="649" y="131" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#7b2d26">전체 하이드레이션</text>

  <line x1="391" y1="156" x2="391" y2="176" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="391" y="192" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#c0392b">첫 바이트가 여기서야 출발</text>

  <!-- Section 2: streaming SSR -->
  <text x="60" y="232" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e7e4f">스트리밍 SSR (renderToPipeableStream + Suspense)</text>

  <rect x="60" y="244" width="100" height="44" rx="6" fill="#e8f6ee" stroke="#5cb884" stroke-width="1.5"/>
  <text x="110" y="271" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e5c3d">셸 렌더</text>

  <rect x="168" y="244" width="130" height="44" rx="6" fill="#e8f6ee" stroke="#5cb884" stroke-width="1.5"/>
  <text x="233" y="271" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e5c3d">셸 즉시 전송</text>

  <rect x="306" y="244" width="130" height="44" rx="6" fill="#e8f6ee" stroke="#5cb884" stroke-width="1.5"/>
  <text x="371" y="271" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e5c3d">청크 전송 ①</text>

  <rect x="444" y="244" width="130" height="44" rx="6" fill="#e8f6ee" stroke="#5cb884" stroke-width="1.5"/>
  <text x="509" y="271" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e5c3d">청크 전송 ②</text>

  <rect x="582" y="244" width="158" height="44" rx="6" fill="#e8f6ee" stroke="#5cb884" stroke-width="1.5"/>
  <text x="661" y="271" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e5c3d">부분 하이드레이션</text>

  <line x1="168" y1="296" x2="168" y2="316" stroke="#1e7e4f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="168" y="332" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e7e4f">첫 바이트는 여기서 이미 출발</text>

  <!-- bottom explanation: fallback swap -->
  <rect x="60" y="352" width="200" height="60" rx="6" fill="#f4f6fa" stroke="#9aa7bd" stroke-width="1.5"/>
  <text x="160" y="378" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333333">① fallback HTML이</text>
  <text x="160" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333333">셸에 실려 먼저 도착</text>

  <line x1="260" y1="382" x2="300" y2="382" stroke="#9aa7bd" stroke-width="2"/>
  <polygon points="300,382 289,377 289,387" fill="#9aa7bd"/>

  <rect x="300" y="352" width="220" height="60" rx="6" fill="#f4f6fa" stroke="#9aa7bd" stroke-width="1.5"/>
  <text x="410" y="378" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333333">② 준비된 콘텐츠가 hidden</text>
  <text x="410" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333333">상태로 뒤따라 도착</text>

  <line x1="520" y1="382" x2="560" y2="382" stroke="#9aa7bd" stroke-width="2"/>
  <polygon points="560,382 549,377 549,387" fill="#9aa7bd"/>

  <rect x="560" y="352" width="180" height="60" rx="6" fill="#f4f6fa" stroke="#9aa7bd" stroke-width="1.5"/>
  <text x="650" y="378" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333333">③ 인라인 스크립트가</text>
  <text x="650" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333333">fallback을 교체</text>
</svg>
