<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">에이전트 도구 호출의 Idempotency + Saga 구조</text>

  <rect x="40" y="46" width="200" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="140" y="68" text-anchor="middle" font-size="11" fill="#312e81">에이전트 도구 호출</text>
  <text x="140" y="84" text-anchor="middle" font-size="9" fill="#3730a3">재시도마다 다른 행동 가능</text>

  <line x1="240" y1="71" x2="280" y2="71" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="280" y="46" width="230" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="395" y="66" text-anchor="middle" font-size="10" fill="#064e3b">키 = tool-call ID + 세션 ID</text>
  <text x="395" y="82" text-anchor="middle" font-size="10" fill="#064e3b">+ 도구명 + 인자 해시</text>

  <line x1="510" y1="71" x2="550" y2="71" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="550" y="46" width="210" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="655" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#064e3b">원장(Ledger)</text>

  <line x1="655" y1="96" x2="655" y2="120" stroke="#059669" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="470" y="120" width="290" height="80" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="615" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">1. 키 확인(이미 처리됐나)</text>
  <text x="615" y="162" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">2. 외부 API 실행</text>
  <text x="615" y="182" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">3. 결과 기록 (이 순서 고정)</text>

  <text x="200" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">순서를 바꾸면(실행→확인)</text>
  <text x="200" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">중복 실행을 막을 수 없음</text>
  <line x1="300" y1="160" x2="465" y2="160" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a2)"/>

  <text x="400" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">멀티스텝 워크플로의 Saga 보정</text>

  <rect x="60" y="250" width="160" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="140" y="272" text-anchor="middle" font-size="10" fill="#7f1d1d">1단계: 항공편 예약</text>
  <text x="140" y="288" text-anchor="middle" font-size="9" fill="#991b1b">성공</text>

  <line x1="220" y1="275" x2="260" y2="275" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="260" y="250" width="160" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="340" y="272" text-anchor="middle" font-size="10" fill="#7f1d1d">2단계: 호텔 예약</text>
  <text x="340" y="288" text-anchor="middle" font-size="9" fill="#991b1b">성공</text>

  <line x1="420" y1="275" x2="460" y2="275" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a1)"/>

  <rect x="460" y="250" width="160" height="50" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="540" y="272" text-anchor="middle" font-size="10" fill="#7c2d12">3단계: 결제</text>
  <text x="540" y="288" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">실패</text>

  <line x1="540" y1="300" x2="340" y2="330" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a2)"/>
  <line x1="340" y1="300" x2="140" y2="330" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a2)"/>

  <rect x="60" y="330" width="360" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="240" y="355" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c2d12">보정 액션: 호텔·항공편 예약 역순 취소</text>

  <rect x="60" y="388" width="680" height="46" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="400" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">원칙: 사이드이펙트 도구를 추가할 때 보정(취소/환불) 도구도 함께 설계</text>
  <text x="400" y="424" text-anchor="middle" font-size="11" fill="#312e81">키 TTL은 결제 API 기본값이 아니라 워크플로 실제 수명에 맞춤</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
