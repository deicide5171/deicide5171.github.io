<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">리스(lease) 기반 리더 선출 흐름</text>

  <!-- 세 노드 -->
  <circle cx="150" cy="130" r="46" fill="#eaf7ef" stroke="#2e9e63" stroke-width="3"/>
  <text x="150" y="124" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a6b45" text-anchor="middle">노드 A</text>
  <text x="150" y="144" font-family="sans-serif" font-size="13" fill="#1a6b45" text-anchor="middle">(리더)</text>

  <circle cx="400" cy="130" r="46" fill="#f5f5f5" stroke="#999999" stroke-width="2"/>
  <text x="400" y="124" font-family="sans-serif" font-size="15" font-weight="bold" fill="#555" text-anchor="middle">노드 B</text>
  <text x="400" y="144" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">(팔로워)</text>

  <circle cx="650" cy="130" r="46" fill="#f5f5f5" stroke="#999999" stroke-width="2"/>
  <text x="650" y="124" font-family="sans-serif" font-size="15" font-weight="bold" fill="#555" text-anchor="middle">노드 C</text>
  <text x="650" y="144" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">(팔로워)</text>

  <!-- 코디네이터(ZK/etcd) -->
  <rect x="300" y="210" width="200" height="56" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="2"/>
  <text x="400" y="233" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2c5583" text-anchor="middle">조정 서비스</text>
  <text x="400" y="252" font-family="sans-serif" font-size="12" fill="#5b7a9d" text-anchor="middle">(ZooKeeper / etcd, Raft 기반)</text>

  <line x1="150" y1="176" x2="340" y2="216" stroke="#2e9e63" stroke-width="2"/>
  <line x1="400" y1="176" x2="400" y2="210" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="650" y1="176" x2="460" y2="216" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="215" y="205" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">리스 갱신(heartbeat)</text>

  <!-- 리스 타이머 박스 -->
  <rect x="60" y="300" width="680" height="70" rx="8" fill="#fdf6ec" stroke="#e8d3ae"/>
  <text x="80" y="322" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a3823f">리스(lease) TTL과 펜싱 토큰</text>
  <text x="80" y="344" font-family="sans-serif" font-size="12.5" fill="#6b5a35">A가 TTL 내에 갱신에 실패하면 리스가 만료되고, 조정 서비스는 다음 후보(B 또는 C)에게 더 큰 값의</text>
  <text x="80" y="362" font-family="sans-serif" font-size="12.5" fill="#6b5a35">펜싱 토큰과 함께 새 리더 자격을 부여한다 — 옛 리더의 지연된 쓰기는 토큰 비교로 거부된다.</text>

  <!-- 장애 시나리오 -->
  <line x1="150" y1="176" x2="150" y2="290" stroke="#d0413b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="150" y="298" font-family="sans-serif" font-size="12" fill="#d0413b" text-anchor="middle" font-weight="bold">네트워크 단절 시 리스 만료</text>

  <line x1="400" y1="176" x2="400" y2="290" stroke="#2e9e63" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="440" y="298" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">B가 새 리더로 승격</text>

  <text x="400" y="420" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">split-brain 방지 핵심: 리스 TTL + 단조 증가 펜싱 토큰의 조합</text>
</svg>
