<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="14" fill="#333333">드론 촬영 원본이 지도에 뜨기까지 — 메쉬 경로 vs Splat 경로</text>

  <!-- source -->
  <rect x="320" y="42" width="160" height="50" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="2"/>
  <text x="400" y="63" text-anchor="middle" font-size="13" fill="#333333">드론 촬영 사진 원본</text>
  <text x="400" y="80" text-anchor="middle" font-size="11" fill="#333333">(수백 장 사진 정합)</text>

  <line x1="360" y1="92" x2="200" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="440" y1="92" x2="600" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- mesh path -->
  <rect x="80" y="132" width="240" height="46" rx="6" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="200" y="160" text-anchor="middle" font-size="12" fill="#1b3a73">포인트클라우드 → 메쉬화</text>

  <line x1="200" y1="178" x2="200" y2="210" stroke="#555" stroke-width="2" marker-end="url(#arrowG)"/>

  <rect x="80" y="212" width="240" height="46" rx="6" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="200" y="240" text-anchor="middle" font-size="12" fill="#1b3a73">텍스처 베이킹</text>

  <line x1="200" y1="258" x2="200" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrowG)"/>

  <rect x="80" y="292" width="240" height="46" rx="6" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="200" y="320" text-anchor="middle" font-size="12" fill="#1b3a73">3D Tiles 타일링 (메쉬)</text>

  <!-- splat path -->
  <rect x="480" y="132" width="240" height="46" rx="6" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="600" y="160" text-anchor="middle" font-size="12" fill="#15502f">Gaussian 직접 학습</text>

  <line x1="600" y1="178" x2="600" y2="290" stroke="#999999" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="650" y="230" text-anchor="middle" font-size="10" fill="#999999">변환 단계 생략</text>

  <rect x="480" y="292" width="240" height="46" rx="6" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="600" y="320" text-anchor="middle" font-size="12" fill="#15502f">3D Tiles 타일링 (Splat, HLOD)</text>

  <!-- convergence -->
  <line x1="200" y1="338" x2="340" y2="380" stroke="#555" stroke-width="2" marker-end="url(#arrowG)"/>
  <line x1="600" y1="338" x2="460" y2="380" stroke="#555" stroke-width="2" marker-end="url(#arrowG)"/>

  <rect x="260" y="382" width="280" height="46" rx="6" fill="#fff7f0" stroke="#e08a2e" stroke-width="2"/>
  <text x="400" y="410" text-anchor="middle" font-size="12" fill="#7a4310">CesiumJS · GeoLibre 렌더링</text>

  <text x="200" y="400" text-anchor="middle" font-size="10" fill="#555555">측량·충돌 판정 가능</text>
  <text x="600" y="400" text-anchor="middle" font-size="10" fill="#555555">표면 개념 없음(측량 약함)</text>
</svg>
