<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">하이브리드 팬아웃 구조 — 푸시와 풀의 결합</text>

  <!-- 일반 사용자 push 경로 -->
  <rect x="30" y="70" width="190" height="56" rx="8" fill="#e8f4ff" stroke="#3b82c4" stroke-width="2"/>
  <text x="125" y="93" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">일반 사용자</text>
  <text x="125" y="113" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">글 작성</text>

  <rect x="285" y="70" width="200" height="56" rx="8" fill="#eef7ee" stroke="#4a9a4a" stroke-width="2"/>
  <text x="385" y="93" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">비동기 팬아웃 워커</text>
  <text x="385" y="113" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">(메시지 큐)</text>

  <rect x="550" y="62" width="220" height="72" rx="8" fill="#eef7ee" stroke="#4a9a4a" stroke-width="2"/>
  <text x="660" y="90" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">팔로워별 타임라인 캐시</text>
  <text x="660" y="112" font-family="sans-serif" font-size="14" fill="#555555" text-anchor="middle">(Redis Sorted Set)</text>

  <line x1="220" y1="98" x2="278" y2="98" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="485" y1="98" x2="543" y2="98" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="514" y="88" font-family="sans-serif" font-size="14" fill="#4a9a4a" text-anchor="middle">푸시</text>

  <!-- 셀럽 pull 경로 -->
  <rect x="30" y="185" width="190" height="56" rx="8" fill="#fff2ec" stroke="#d97b4f" stroke-width="2"/>
  <text x="125" y="208" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">셀럽 글 작성</text>
  <text x="125" y="228" font-family="sans-serif" font-size="14" fill="#555555" text-anchor="middle">(팔로워 ≥ 임계값)</text>

  <rect x="285" y="185" width="200" height="56" rx="8" fill="#fff2ec" stroke="#d97b4f" stroke-width="2"/>
  <text x="385" y="208" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">셀럽 글 저장소</text>
  <text x="385" y="228" font-family="sans-serif" font-size="14" fill="#555555" text-anchor="middle">(푸시 생략)</text>

  <line x1="220" y1="213" x2="278" y2="213" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 읽기 경로 -->
  <rect x="30" y="330" width="190" height="56" rx="8" fill="#f3eefc" stroke="#7a5fb5" stroke-width="2"/>
  <text x="125" y="353" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">타임라인</text>
  <text x="125" y="373" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">읽기 요청</text>

  <rect x="285" y="325" width="200" height="66" rx="8" fill="#f3eefc" stroke="#7a5fb5" stroke-width="2"/>
  <text x="385" y="352" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">병합기 (Merger)</text>
  <text x="385" y="374" font-family="sans-serif" font-size="14" fill="#555555" text-anchor="middle">캐시 + 셀럽 글 병합·정렬</text>

  <rect x="550" y="330" width="220" height="56" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="2"/>
  <text x="660" y="353" font-family="sans-serif" font-size="15" fill="#222222" text-anchor="middle">최종 타임라인 응답</text>
  <text x="660" y="373" font-family="sans-serif" font-size="14" fill="#555555" text-anchor="middle">(시간순 상위 N개)</text>

  <line x1="220" y1="358" x2="278" y2="358" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="485" y1="358" x2="543" y2="358" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 캐시 → 병합기 (읽기 시 조회) -->
  <line x1="640" y1="134" x2="440" y2="320" stroke="#7a5fb5" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="590" y="230" font-family="sans-serif" font-size="14" fill="#7a5fb5" text-anchor="middle">캐시 조회</text>

  <!-- 셀럽 저장소 → 병합기 (읽기 시 풀) -->
  <line x1="385" y1="241" x2="385" y2="318" stroke="#d97b4f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="450" y="285" font-family="sans-serif" font-size="14" fill="#d97b4f" text-anchor="middle">읽기 시 풀(pull)</text>
</svg>
