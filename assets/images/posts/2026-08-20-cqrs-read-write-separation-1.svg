<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">CQRS: 커맨드 경로와 쿼리 경로의 분리</text>
  <text x="400" y="46" text-anchor="middle" font-size="11.5" fill="#666">쓰기는 도메인 모델로, 읽기는 조회 전용 모델로 — 두 경로는 이벤트로만 연결된다</text>

  <defs>
    <marker id="arrowC" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0b5fa5"/>
    </marker>
    <marker id="arrowQ" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2fa84f"/>
    </marker>
    <marker id="arrowE" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#a3550f"/>
    </marker>
  </defs>

  <!-- Command path (top) -->
  <text x="60" y="82" font-size="12.5" font-weight="bold" fill="#0b5fa5">Command 경로</text>

  <rect x="30" y="94" width="120" height="52" rx="6" fill="#eaf3ff" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="90" y="116" text-anchor="middle" font-size="10.5" fill="#0b5fa5" font-weight="bold">클라이언트</text>
  <text x="90" y="132" text-anchor="middle" font-size="9.5" fill="#0b5fa5">PlaceOrderCommand</text>

  <line x1="150" y1="120" x2="204" y2="120" stroke="#0b5fa5" stroke-width="2" marker-end="url(#arrowC)"/>

  <rect x="206" y="94" width="150" height="52" rx="6" fill="#eaf3ff" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="281" y="112" text-anchor="middle" font-size="10.5" fill="#0b5fa5" font-weight="bold">Command Handler</text>
  <text x="281" y="128" text-anchor="middle" font-size="9.5" fill="#0b5fa5">도메인 규칙 검증</text>
  <text x="281" y="141" text-anchor="middle" font-size="9.5" fill="#0b5fa5">불변식 체크</text>

  <line x1="356" y1="120" x2="410" y2="120" stroke="#0b5fa5" stroke-width="2" marker-end="url(#arrowC)"/>

  <rect x="412" y="94" width="150" height="52" rx="6" fill="#dcebff" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="487" y="116" text-anchor="middle" font-size="10.5" fill="#0b5fa5" font-weight="bold">쓰기 모델(Write DB)</text>
  <text x="487" y="132" text-anchor="middle" font-size="9.5" fill="#0b5fa5">정규화된 도메인 스키마</text>

  <line x1="562" y1="120" x2="616" y2="120" stroke="#a3550f" stroke-width="2" marker-end="url(#arrowE)"/>

  <rect x="618" y="94" width="152" height="52" rx="6" fill="#fff4e5" stroke="#c9701d" stroke-width="1.5"/>
  <text x="694" y="112" text-anchor="middle" font-size="10.5" fill="#a3550f" font-weight="bold">이벤트 발행</text>
  <text x="694" y="128" text-anchor="middle" font-size="9.5" fill="#a3550f">OrderPlacedEvent</text>
  <text x="694" y="141" text-anchor="middle" font-size="9.5" fill="#a3550f">등 도메인 이벤트</text>

  <!-- Divider -->
  <line x1="30" y1="170" x2="770" y2="170" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Projection (middle) -->
  <rect x="290" y="184" width="220" height="54" rx="6" fill="#fff4e5" stroke="#c9701d" stroke-width="1.5"/>
  <text x="400" y="204" text-anchor="middle" font-size="10.5" fill="#a3550f" font-weight="bold">프로젝션(Projection)</text>
  <text x="400" y="219" text-anchor="middle" font-size="9.5" fill="#a3550f">이벤트 구독 → 읽기 모델 갱신</text>
  <text x="400" y="232" text-anchor="middle" font-size="9" fill="#a3550f">비동기 · 최종 일관성</text>

  <line x1="694" y1="146" x2="694" y2="211" stroke="#a3550f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="694" y1="211" x2="516" y2="211" stroke="#a3550f" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowE)"/>

  <line x1="400" y1="238" x2="400" y2="264" stroke="#2fa84f" stroke-width="2" marker-end="url(#arrowQ)"/>

  <!-- Query path (bottom) -->
  <text x="60" y="284" font-size="12.5" font-weight="bold" fill="#1f7a38">Query 경로</text>

  <rect x="412" y="264" width="150" height="52" rx="6" fill="#eaffef" stroke="#2fa84f" stroke-width="1.5"/>
  <text x="487" y="286" text-anchor="middle" font-size="10.5" fill="#1f7a38" font-weight="bold">읽기 모델(Read DB)</text>
  <text x="487" y="302" text-anchor="middle" font-size="9.5" fill="#1f7a38">비정규화된 조회 전용 스키마</text>

  <line x1="410" y1="290" x2="356" y2="290" stroke="#2fa84f" stroke-width="2" marker-end="url(#arrowQ)"/>

  <rect x="206" y="264" width="150" height="52" rx="6" fill="#eaffef" stroke="#2fa84f" stroke-width="1.5"/>
  <text x="281" y="282" text-anchor="middle" font-size="10.5" fill="#1f7a38" font-weight="bold">Query Handler</text>
  <text x="281" y="298" text-anchor="middle" font-size="9.5" fill="#1f7a38">조회 전용, 도메인 규칙 없음</text>
  <text x="281" y="311" text-anchor="middle" font-size="9" fill="#1f7a38">화면 응답 형태로 바로 반환</text>

  <line x1="204" y1="290" x2="150" y2="290" stroke="#2fa84f" stroke-width="2" marker-end="url(#arrowQ)"/>

  <rect x="30" y="264" width="120" height="52" rx="6" fill="#eaffef" stroke="#2fa84f" stroke-width="1.5"/>
  <text x="90" y="286" text-anchor="middle" font-size="10.5" fill="#1f7a38" font-weight="bold">클라이언트</text>
  <text x="90" y="302" text-anchor="middle" font-size="9.5" fill="#1f7a38">GetOrderSummaryQuery</text>

  <!-- Note -->
  <rect x="30" y="340" width="740" height="80" rx="6" fill="#f5f5f5" stroke="#bbb"/>
  <text x="400" y="364" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">핵심: Command Handler와 Query Handler는 서로 직접 참조하지 않는다</text>
  <text x="400" y="384" text-anchor="middle" font-size="9.5" fill="#555">쓰기 모델의 변경은 이벤트를 매개로 프로젝션에 전파되고, 읽기 모델은 그 결과만 조회에 활용한다.</text>
  <text x="400" y="400" text-anchor="middle" font-size="9.5" fill="#555">이 연결이 비동기이기 때문에, 쓰기 직후 읽기 모델이 아직 갱신 전일 수 있다(최종 일관성).</text>

  <text x="400" y="438" text-anchor="middle" font-size="11" fill="#555">두 모델을 반드시 별도 DB로 분리할 필요는 없다 — 같은 DB 안의 테이블/뷰 분리로도 CQRS는 성립한다</text>
</svg>
