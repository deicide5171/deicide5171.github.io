<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">세 가지 에이전트 오케스트레이션 패러다임</text>

  <!-- column backgrounds -->
  <rect x="30" y="66" width="220" height="347" rx="8" fill="#eef4ff" stroke="#7aa7e6" stroke-width="1.2"/>
  <rect x="290" y="66" width="220" height="347" rx="8" fill="#eafff0" stroke="#2fa84f" stroke-width="1.2"/>
  <rect x="550" y="66" width="220" height="347" rx="8" fill="#f5eeff" stroke="#a67fd1" stroke-width="1.2"/>

  <text x="140" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a56db">LangGraph</text>
  <text x="400" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f7a38">CrewAI</text>
  <text x="660" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b3fa0">AutoGen</text>

  <!-- ===== Column 1: LangGraph state graph with cycle ===== -->
  <rect x="100" y="100" width="80" height="28" rx="5" fill="#ffffff" stroke="#7aa7e6"/>
  <text x="140" y="118" text-anchor="middle" font-size="11" fill="#1a1a1a">시작</text>

  <line x1="140" y1="128" x2="140" y2="150" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="90" y="150" width="100" height="36" rx="5" fill="#ffffff" stroke="#7aa7e6"/>
  <text x="140" y="164" text-anchor="middle" font-size="10.5" fill="#1a1a1a">Agent 노드</text>
  <text x="140" y="178" text-anchor="middle" font-size="9.5" fill="#555">(LLM 호출)</text>

  <line x1="140" y1="186" x2="140" y2="206" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="90" y="206" width="100" height="36" rx="5" fill="#ffffff" stroke="#7aa7e6"/>
  <text x="140" y="220" text-anchor="middle" font-size="10.5" fill="#1a1a1a">도구 호출 노드</text>
  <text x="140" y="234" text-anchor="middle" font-size="9.5" fill="#555">(Tool Call)</text>

  <line x1="140" y1="242" x2="140" y2="262" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <polygon points="140,262 192,288 140,314 88,288" fill="#ffffff" stroke="#7aa7e6"/>
  <text x="140" y="292" text-anchor="middle" font-size="10.5" fill="#1a1a1a">완료?</text>

  <path d="M88,288 C40,288 40,168 88,168" fill="none" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="55" y="230" text-anchor="middle" font-size="9.5" fill="#555" transform="rotate(-90 55 230)">아니오(조건부 엣지)</text>

  <line x1="140" y1="314" x2="140" y2="336" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="156" y="328" font-size="9.5" fill="#555">예</text>

  <rect x="100" y="336" width="80" height="28" rx="5" fill="#ffffff" stroke="#7aa7e6"/>
  <text x="140" y="354" text-anchor="middle" font-size="11" fill="#1a1a1a">종료</text>

  <text x="140" y="384" text-anchor="middle" font-size="10.5" fill="#1a1a1a">노드·엣지 그래프로</text>
  <text x="140" y="398" text-anchor="middle" font-size="10.5" fill="#1a1a1a">상태 전이를 명시적으로 제어</text>

  <!-- ===== Column 2: CrewAI role-based crew ===== -->
  <rect x="330" y="98" width="140" height="40" rx="6" fill="#ffffff" stroke="#2fa84f"/>
  <text x="400" y="115" text-anchor="middle" font-size="10.5" fill="#1a1a1a">매니저 에이전트</text>
  <text x="400" y="129" text-anchor="middle" font-size="9" fill="#555">(Process: Hierarchical)</text>

  <line x1="380" y1="138" x2="345" y2="186" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="420" y1="138" x2="455" y2="186" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="292" y="186" width="96" height="48" rx="6" fill="#ffffff" stroke="#2fa84f"/>
  <text x="340" y="205" text-anchor="middle" font-size="10" fill="#1a1a1a">리서처 에이전트</text>
  <text x="340" y="219" text-anchor="middle" font-size="9" fill="#555">Task: 자료 조사</text>

  <rect x="412" y="186" width="96" height="48" rx="6" fill="#ffffff" stroke="#2fa84f"/>
  <text x="460" y="205" text-anchor="middle" font-size="10" fill="#1a1a1a">작성자 에이전트</text>
  <text x="460" y="219" text-anchor="middle" font-size="9" fill="#555">Task: 보고서 작성</text>

  <line x1="345" y1="234" x2="375" y2="288" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="455" y1="234" x2="425" y2="288" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="330" y="288" width="140" height="36" rx="6" fill="#ffffff" stroke="#2fa84f"/>
  <text x="400" y="310" text-anchor="middle" font-size="10.5" fill="#1a1a1a">최종 결과(Crew Output)</text>

  <text x="400" y="384" text-anchor="middle" font-size="10.5" fill="#1a1a1a">역할(Role)·목표를 가진</text>
  <text x="400" y="398" text-anchor="middle" font-size="10.5" fill="#1a1a1a">에이전트 팀이 태스크를 위임</text>

  <!-- ===== Column 3: AutoGen conversable agents ===== -->
  <circle cx="605" cy="150" r="36" fill="#ffffff" stroke="#a67fd1"/>
  <text x="605" y="147" text-anchor="middle" font-size="10" fill="#1a1a1a">에이전트 A</text>
  <text x="605" y="160" text-anchor="middle" font-size="9" fill="#555">(Assistant)</text>

  <circle cx="715" cy="150" r="36" fill="#ffffff" stroke="#a67fd1"/>
  <text x="715" y="147" text-anchor="middle" font-size="10" fill="#1a1a1a">에이전트 B</text>
  <text x="715" y="160" text-anchor="middle" font-size="9" fill="#555">(User Proxy)</text>

  <line x1="641" y1="140" x2="679" y2="140" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="660" y="130" text-anchor="middle" font-size="9" fill="#555">메시지</text>
  <line x1="679" y1="160" x2="641" y2="160" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="660" y="178" text-anchor="middle" font-size="9" fill="#555">응답</text>

  <line x1="608" y1="185" x2="618" y2="228" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="712" y1="185" x2="702" y2="228" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <rect x="585" y="228" width="150" height="38" rx="6" fill="#ffffff" stroke="#a67fd1"/>
  <text x="660" y="244" text-anchor="middle" font-size="10" fill="#1a1a1a">GroupChat Manager</text>
  <text x="660" y="257" text-anchor="middle" font-size="9" fill="#555">(대화 순서 조정)</text>

  <line x1="660" y1="266" x2="660" y2="290" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#arrow)"/>

  <circle cx="660" cy="318" r="28" fill="#ffffff" stroke="#a67fd1"/>
  <text x="660" y="322" text-anchor="middle" font-size="10" fill="#1a1a1a">에이전트 C</text>

  <text x="660" y="384" text-anchor="middle" font-size="10.5" fill="#1a1a1a">대화형 메시지 교환으로</text>
  <text x="660" y="398" text-anchor="middle" font-size="10.5" fill="#1a1a1a">에이전트가 협업</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <text x="400" y="432" text-anchor="middle" font-size="11.5" fill="#555">셋 다 &#39;여러 에이전트의 협업&#39;을 다루지만, 제어 흐름을 표현하는 단위가 다르다 &#8212; 그래프 / 역할·태스크 / 대화</text>
</svg>
