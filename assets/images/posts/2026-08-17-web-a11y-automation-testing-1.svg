<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a">웹 접근성 자동화 테스트 파이프라인</text>

  <!-- Stage 1 -->
  <rect x="20" y="70" width="130" height="80" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="85" y="102" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1a1a1a">코드 작성</text>
  <text x="85" y="122" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#333">PR 오픈</text>

  <line x1="150" y1="110" x2="185" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <rect x="190" y="70" width="140" height="80" rx="8" fill="#ecfdf5" stroke="#03c75a" stroke-width="2"/>
  <text x="260" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">정적 분석</text>
  <text x="260" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">eslint-plugin</text>
  <text x="260" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">-jsx-a11y</text>

  <line x1="330" y1="110" x2="365" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <rect x="370" y="70" width="140" height="80" rx="8" fill="#fff7ed" stroke="#ff8a3d" stroke-width="2"/>
  <text x="440" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">단위/컴포넌트</text>
  <text x="440" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">jest-axe /</text>
  <text x="440" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">vitest-axe</text>

  <line x1="510" y1="110" x2="545" y2="110" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <rect x="550" y="70" width="140" height="80" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="620" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">E2E 스캔</text>
  <text x="620" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">@axe-core/</text>
  <text x="620" y="134" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">playwright</text>

  <!-- down arrow to gate -->
  <line x1="620" y1="150" x2="620" y2="185" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gate box -->
  <rect x="480" y="190" width="240" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="218" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="bold" fill="#1a1a1a">CI 게이트</text>
  <text x="600" y="238" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#333">critical/serious 위반 시 실패</text>
  <text x="600" y="252" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">Lighthouse CI 점수 임계값 포함</text>

  <line x1="480" y1="225" x2="90" y2="225" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="90" y1="225" x2="90" y2="260" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-gray)"/>

  <!-- Manual audit box -->
  <rect x="20" y="265" width="140" height="80" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="90" y="293" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1a1a1a">수동 감사</text>
  <text x="90" y="311" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#444">스크린리더</text>
  <text x="90" y="325" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#444">(NVDA/VoiceOver)</text>

  <!-- merge box -->
  <line x1="600" y1="260" x2="600" y2="300" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="500" y="305" width="200" height="60" rx="8" fill="#ecfdf5" stroke="#03c75a" stroke-width="2"/>
  <text x="600" y="333" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">PR 머지 · 배포</text>
  <text x="600" y="350" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#666">회귀 없는 접근성 유지</text>

  <!-- Note -->
  <text x="400" y="400" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#666">자동화는 각 PR마다 실행되는 회귀 방지선, 수동 감사는 릴리스 주기마다 병행되는 보완선</text>
  <text x="400" y="422" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#999">자동 도구는 WCAG 이슈의 일부만 탐지하므로 두 축을 함께 운영하는 것이 핵심</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#999"/>
    </marker>
  </defs>
</svg>
