<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">MapLibre GL JS 렌더링 흐름</text>

  <!-- Source -->
  <rect x="40" y="90" width="180" height="90" rx="8" fill="#eaf6ff" stroke="#4a90d9" stroke-width="2"/>
  <text x="130" y="125" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a4a7a">벡터 타일 서버</text>
  <text x="130" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">PostGIS + pg_tileserv</text>
  <text x="130" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">또는 PMTiles</text>

  <!-- arrow 1 -->
  <line x1="220" y1="135" x2="290" y2="135" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="255" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">PBF 타일</text>

  <!-- Source/Layer -->
  <rect x="300" y="90" width="200" height="90" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="400" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0a5a30">Source / Layer</text>
  <text x="400" y="143" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">Style Spec(JSON)으로</text>
  <text x="400" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">색상·라벨·순서 정의</text>

  <!-- arrow 2 -->
  <line x1="500" y1="135" x2="570" y2="135" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="535" y="122" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#666">스타일링</text>

  <!-- WebGL -->
  <rect x="580" y="90" width="180" height="90" rx="8" fill="#fff3e6" stroke="#e08a2b" stroke-width="2"/>
  <text x="670" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#8a4a10">WebGL 렌더러</text>
  <text x="670" y="143" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">GPU로 벡터</text>
  <text x="670" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">지오메트리 래스터화</text>

  <!-- down arrow -->
  <line x1="670" y1="180" x2="670" y2="230" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Browser canvas -->
  <rect x="120" y="240" width="560" height="160" rx="8" fill="#fbfbfb" stroke="#999" stroke-width="2"/>
  <text x="400" y="270" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222">브라우저 &lt;canvas&gt; — 확대·축소·회전 인터랙션</text>

  <!-- simple map illustration inside canvas -->
  <rect x="150" y="290" width="500" height="90" fill="#dff0e8"/>
  <polygon points="150,340 300,300 400,330 500,290 650,320 650,380 150,380" fill="#c9e6d3"/>
  <line x1="150" y1="360" x2="650" y2="345" stroke="#7fb3d5" stroke-width="4"/>
  <circle cx="330" cy="350" r="5" fill="#e05252"/>
  <text x="330" y="335" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">서울 시청</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>
