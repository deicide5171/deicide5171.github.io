<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">가상 대기열(Virtual Waiting Room) 구조</text>

  <text x="120" y="70" text-anchor="middle" font-size="13" fill="#555">동시 접속 폭주</text>
  <circle cx="60" cy="100" r="12" fill="#e05a5a" fill-opacity="0.7"/>
  <circle cx="95" cy="90" r="12" fill="#e05a5a" fill-opacity="0.7"/>
  <circle cx="130" cy="105" r="12" fill="#e05a5a" fill-opacity="0.7"/>
  <circle cx="75" cy="120" r="12" fill="#e05a5a" fill-opacity="0.7"/>
  <circle cx="110" cy="125" r="12" fill="#e05a5a" fill-opacity="0.7"/>
  <circle cx="145" cy="120" r="12" fill="#e05a5a" fill-opacity="0.7"/>
  <text x="103" y="155" text-anchor="middle" font-size="11" fill="#888">수십만 명 동시 접근</text>

  <line x1="170" y1="110" x2="220" y2="110" stroke="#555" stroke-width="3" marker-end="url(#arrowW)"/>

  <rect x="225" y="65" width="220" height="110" rx="10" fill="#fff9e8" stroke="#e6b800" stroke-width="2"/>
  <text x="335" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5c00">가상 대기열</text>
  <text x="335" y="118" text-anchor="middle" font-size="12" fill="#333">Redis Sorted Set으로</text>
  <text x="335" y="136" text-anchor="middle" font-size="12" fill="#333">순번 관리 (가벼운 시스템)</text>
  <text x="335" y="156" text-anchor="middle" font-size="11" fill="#888">"3,204번 · 예상 2분"</text>

  <line x1="450" y1="120" x2="500" y2="120" stroke="#2f9e58" stroke-width="4" marker-end="url(#arrowW)"/>
  <text x="475" y="105" text-anchor="middle" font-size="11" fill="#2f9e58">일정 속도로만 통과</text>

  <rect x="505" y="65" width="230" height="110" rx="10" fill="#eef8ef" stroke="#2f9e58" stroke-width="2"/>
  <text x="620" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f5c34">실제 예매 서버</text>
  <text x="620" y="118" text-anchor="middle" font-size="12" fill="#333">좌석 조회 · 결제</text>
  <text x="620" y="140" text-anchor="middle" font-size="12" fill="#333">안전한 처리량만 수신</text>
  <text x="620" y="160" text-anchor="middle" font-size="11" fill="#888">DB·PG사 부하 안정</text>

  <rect x="60" y="230" width="680" height="180" rx="10" fill="#f9f9f9" stroke="#ddd" stroke-width="1.5"/>
  <text x="400" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">대기열 없음 vs 대기열 적용</text>

  <text x="100" y="295" font-size="13" fill="#8a2e2e">✕ 없음: 모든 요청이 즉시 본 서버로 몰림 → 타임아웃, 무한 로딩</text>
  <text x="100" y="325" font-size="13" fill="#1f5c34">✓ 적용: 유입 속도 제어 → DB·PG사 부하 안정, 명확한 순번 안내</text>
  <text x="100" y="355" font-size="13" fill="#1f5c34">✓ 새로고침 폭탄으로 인한 악순환 방지</text>
  <text x="100" y="385" font-size="13" fill="#555">단, 토큰 유효시간·우회 차단·실측 기반 유입 속도 설정이 필요</text>

  <defs>
    <marker id="arrowW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
