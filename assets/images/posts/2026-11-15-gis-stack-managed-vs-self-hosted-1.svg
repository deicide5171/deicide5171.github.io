<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">GIS 스택 네 층에서 직접 구축 vs 매니지드의 운영 경계선</text>

  <!-- Stack layers (shared top labels) -->
  <rect x="40" y="55" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="120" y="79" text-anchor="middle" font-size="12" fill="#334155">데이터 수집·정제</text>

  <rect x="220" y="55" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="300" y="79" text-anchor="middle" font-size="12" fill="#334155">PostGIS 저장</text>

  <rect x="400" y="55" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="79" text-anchor="middle" font-size="12" fill="#334155">GeoServer 서빙</text>

  <rect x="580" y="55" width="160" height="40" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="660" y="79" text-anchor="middle" font-size="12" fill="#334155">지도 클라이언트</text>

  <!-- Row 1: self-hosted -->
  <text x="40" y="130" font-size="12" font-weight="bold" fill="#1e3a8a">직접 구축</text>
  <rect x="40" y="140" width="700" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="175" text-anchor="middle" font-size="12" fill="#1e3a8a">네 층 전부 팀이 설계·운영 (패치 주기·플러그인·캐시 전략·장애 복구까지 직접 결정)</text>

  <!-- Row 2: managed -->
  <text x="40" y="235" font-size="12" font-weight="bold" fill="#9a3412">매니지드(Open Spatial Cloud류)</text>
  <rect x="40" y="245" width="220" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="272" text-anchor="middle" font-size="11" fill="#1e3a8a">데이터 적재</text>
  <text x="150" y="288" text-anchor="middle" font-size="10" fill="#1e3a8a">팀이 직접 관리</text>

  <rect x="270" y="245" width="310" height="60" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="425" y="272" text-anchor="middle" font-size="11" fill="#9a3412">PostGIS 저장 + GeoServer 서빙</text>
  <text x="425" y="288" text-anchor="middle" font-size="10" fill="#9a3412">벤더 SLA로 운영 — 커스텀 확장은 막힐 수 있음</text>

  <rect x="590" y="245" width="150" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="665" y="272" text-anchor="middle" font-size="11" fill="#1e3a8a">클라이언트</text>
  <text x="665" y="288" text-anchor="middle" font-size="10" fill="#1e3a8a">팀이 직접 관리</text>

  <!-- boundary line -->
  <line x1="260" y1="335" x2="590" y2="335" stroke="#dc2626" stroke-width="2.5"/>
  <text x="425" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">↑ 운영 경계선 — 커스텀 WPS·확장 플러그인이 필요해지면 이 경계가 다시 그어진다</text>

  <rect x="40" y="385" width="700" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="390" y="406" text-anchor="middle" font-size="11" fill="#334155">출구 전략: OGC 표준 포맷 그대로면 데이터는 이식 가능 — 단 벤더 자동화·모니터링 기능은 이식 안 됨</text>
  <text x="390" y="423" text-anchor="middle" font-size="10" fill="#64748b">계약 전 "표준 포맷으로 통째 내보내기 가능한가"를 문서로 확인</text>

</svg>
