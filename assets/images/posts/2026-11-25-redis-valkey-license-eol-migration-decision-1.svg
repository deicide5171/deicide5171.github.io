<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <rect x="30" y="190" width="150" height="70" rx="8" fill="#eef3fb" stroke="#4a77c5" stroke-width="1.5"/>
  <text x="105" y="220" text-anchor="middle" font-size="15" fill="#223">애플리케이션</text>
  <text x="105" y="240" text-anchor="middle" font-size="15" fill="#223">서버</text>

  <line x1="180" y1="225" x2="250" y2="225" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="250" y="40" width="190" height="370" rx="10" fill="#fbf7ee" stroke="#c99a3a" stroke-width="1.5"/>
  <text x="345" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5a16">캐시 레이어</text>

  <rect x="270" y="90" width="150" height="60" rx="6" fill="#ffffff" stroke="#c99a3a"/>
  <text x="345" y="113" text-anchor="middle" font-size="13" fill="#333">단순 키-값 캐시</text>
  <text x="345" y="131" text-anchor="middle" font-size="11" fill="#777">GET / SET / EXPIRE</text>

  <rect x="270" y="165" width="150" height="60" rx="6" fill="#ffffff" stroke="#c99a3a"/>
  <text x="345" y="188" text-anchor="middle" font-size="13" fill="#333">세션 · 분산 락</text>
  <text x="345" y="206" text-anchor="middle" font-size="11" fill="#777">상태 저장소 역할</text>

  <rect x="270" y="240" width="150" height="80" rx="6" fill="#fff1e8" stroke="#c9623a"/>
  <text x="345" y="263" text-anchor="middle" font-size="13" fill="#333">모듈형 보조 인덱스</text>
  <text x="345" y="281" text-anchor="middle" font-size="11" fill="#777">RedisSearch · JSON</text>
  <text x="345" y="297" text-anchor="middle" font-size="11" fill="#777">TimeSeries</text>

  <text x="345" y="350" text-anchor="middle" font-size="12" fill="#a33" font-weight="bold">↓ 모듈 의존 여부가</text>
  <text x="345" y="368" text-anchor="middle" font-size="12" fill="#a33" font-weight="bold">전환 난이도를 가른다</text>

  <line x1="440" y1="120" x2="520" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="195" x2="520" y2="195" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="280" x2="520" y2="280" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="520" y="90" width="250" height="60" rx="6" fill="#eefbf1" stroke="#2f9e52" stroke-width="1.5"/>
  <text x="645" y="113" text-anchor="middle" font-size="13" fill="#1d6b36" font-weight="bold">Valkey (BSD, 멀티벤더)</text>
  <text x="645" y="131" text-anchor="middle" font-size="11" fill="#2f6b43">와이어 호환 — 전환 수월</text>

  <rect x="520" y="165" width="250" height="60" rx="6" fill="#eefbf1" stroke="#2f9e52" stroke-width="1.5"/>
  <text x="645" y="188" text-anchor="middle" font-size="13" fill="#1d6b36" font-weight="bold">Valkey / Redis 8 모두 가능</text>
  <text x="645" y="206" text-anchor="middle" font-size="11" fill="#2f6b43">상태 로직은 클라이언트 종속 적음</text>

  <rect x="520" y="240" width="250" height="80" rx="6" fill="#fdeeee" stroke="#c23b3b" stroke-width="1.5"/>
  <text x="645" y="263" text-anchor="middle" font-size="13" fill="#8a1f1f" font-weight="bold">모듈 기능 대조 필수</text>
  <text x="645" y="281" text-anchor="middle" font-size="11" fill="#8a3f3f">Valkey 9 JSON·Bloom·벡터 추가</text>
  <text x="645" y="297" text-anchor="middle" font-size="11" fill="#8a3f3f">세부 쿼리 문법 격차 가능</text>

  <text x="400" y="415" text-anchor="middle" font-size="12" fill="#555">Redis 8(AGPLv3/상용) vs Valkey(BSD) — 선택은 모듈 의존 범위에서 갈린다</text>
</svg>
