<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrowC" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">기존 분리형 파이프라인 vs Cesium Vector Tiles 통합 파이프라인</text>

  <text x="190" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">기존: 두 스트림을 화면에서 합성</text>

  <rect x="40" y="60" width="130" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="105" y="78" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#7f1d1d">메쉬 타일셋</text>
  <text x="105" y="92" text-anchor="middle" font-size="7.5" fill="#991b1b">screen-space LOD</text>

  <rect x="210" y="60" width="130" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="275" y="78" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#1e3a8a">벡터 타일(MVT)</text>
  <text x="275" y="92" text-anchor="middle" font-size="7.5" fill="#1e40af">정수 줌레벨 LOD</text>

  <line x1="105" y1="104" x2="180" y2="150" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrowC)"/>
  <line x1="275" y1="104" x2="200" y2="150" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrowC)"/>

  <rect x="80" y="150" width="220" height="48" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="190" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#78350f">클라이언트 화면 합성</text>
  <text x="190" y="186" text-anchor="middle" font-size="7.5" fill="#92400e">LOD·좌표 어긋남 발생 지점</text>

  <line x1="400" y1="60" x2="400" y2="390" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="610" y="48" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">프리뷰: 하나의 타일셋으로 통합</text>

  <rect x="460" y="60" width="140" height="44" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
  <text x="530" y="78" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#064e3b">원본 메쉬+벡터</text>
  <text x="530" y="92" text-anchor="middle" font-size="7.5" fill="#065f46">통합 타일링 단계</text>

  <line x1="530" y1="104" x2="530" y2="150" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrowC)"/>

  <rect x="440" y="150" width="180" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="530" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#064e3b">3D Tiles + glTF 확장</text>
  <text x="530" y="186" text-anchor="middle" font-size="7.5" fill="#065f46">메쉬·벡터 동일 LOD 체계</text>

  <line x1="530" y1="198" x2="530" y2="230" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrowC)"/>

  <rect x="440" y="230" width="180" height="40" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="530" y="254" text-anchor="middle" font-size="8.5" fill="#064e3b">클라이언트 단일 요청 렌더링</text>

  <rect x="60" y="310" width="680" height="34" rx="6" fill="#fff7ed" stroke="#f0a04b" stroke-width="1.3"/>
  <text x="400" y="332" text-anchor="middle" font-size="9.5" fill="#92400e">glTF 확장: 공통 지오메트리 압축 최대 5배 — 메쉬 타일에도 독립 적용 가능</text>

  <rect x="60" y="356" width="680" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
  <text x="400" y="378" text-anchor="middle" font-size="9.5" fill="#7f1d1d">현재 상태: 기술 프리뷰 — 3D Tiles 2.0 정식 승격 전까지 운영 적용은 보류</text>

  <text x="400" y="415" text-anchor="middle" font-size="9" fill="#4b5563">기존 분리형은 안정적이지만 LOD·좌표 동기화를 직접 관리해야 한다</text>
</svg>
