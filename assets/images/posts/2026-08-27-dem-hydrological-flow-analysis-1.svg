<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="32" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">D8 흐름 방향 → 흐름 누적 → 유역 추출</text>

  <!-- D8 -->
  <text x="140" y="66" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a6b45" text-anchor="middle">1. D8 흐름 방향</text>
  <g transform="translate(60,80)">
    <rect x="0" y="0" width="160" height="160" fill="none" stroke="#ccc"/>
    <line x1="53" y1="0" x2="53" y2="160" stroke="#ccc"/><line x1="106" y1="0" x2="106" y2="160" stroke="#ccc"/>
    <line x1="0" y1="53" x2="160" y2="53" stroke="#ccc"/><line x1="0" y1="106" x2="160" y2="106" stroke="#ccc"/>
    <text x="26" y="30" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#888">95</text>
    <text x="80" y="30" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#888">88</text>
    <text x="133" y="30" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#888">92</text>
    <text x="26" y="83" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#888">90</text>
    <rect x="53" y="53" width="53" height="53" fill="#2e9e63" fill-opacity="0.25"/>
    <text x="80" y="83" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a6b45">78</text>
    <text x="133" y="83" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#888">85</text>
    <text x="26" y="136" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#888">89</text>
    <text x="80" y="136" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#888">82</text>
    <text x="133" y="136" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#888">80</text>
    <line x1="80" y1="83" x2="128" y2="128" stroke="#1a6b45" stroke-width="2.5"/>
    <polygon points="133,133 120,131 131,120" fill="#1a6b45"/>
  </g>
  <text x="140" y="264" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">중심 셀은 8이웃 중</text>
  <text x="140" y="279" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">가장 급경사 방향(80)으로만 흐름</text>

  <!-- 화살표 -->
  <line x1="240" y1="170" x2="290" y2="170" stroke="#999" stroke-width="2"/>
  <polygon points="290,170 280,165 280,175" fill="#999"/>

  <!-- 흐름누적 -->
  <text x="440" y="66" font-family="sans-serif" font-size="15" font-weight="bold" fill="#a3611c" text-anchor="middle">2. 흐름 누적 → 하천망</text>
  <g transform="translate(340,80)">
    <rect x="0" y="0" width="200" height="160" fill="#f7f9fc" stroke="#ccc"/>
    <path d="M 20 20 L 60 60 L 100 80 L 140 100 L 180 140" fill="none" stroke="#4a7ab5" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M 20 140 L 70 110 L 100 80" fill="none" stroke="#4a7ab5" stroke-width="2" stroke-dasharray="3,3"/>
    <path d="M 100 80 L 140 100 L 180 140" fill="none" stroke="#c98a3d" stroke-width="5"/>
    <circle cx="180" cy="140" r="6" fill="#c98a3d"/>
  </g>
  <text x="440" y="264" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">누적값이 임계값을 넘는 셀만</text>
  <text x="440" y="279" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">이어 하천망(굵은선)으로 추출</text>

  <line x1="560" y1="170" x2="610" y2="170" stroke="#999" stroke-width="2"/>
  <polygon points="610,170 600,165 600,175" fill="#999"/>

  <!-- 유역 -->
  <text x="700" y="66" font-family="sans-serif" font-size="15" font-weight="bold" fill="#3a5a8c" text-anchor="middle">3. 유역 경계</text>
  <g transform="translate(630,80)">
    <rect x="0" y="0" width="140" height="160" fill="#f7f9fc" stroke="#ccc"/>
    <path d="M 10 20 L 100 10 L 130 60 L 110 130 L 60 150 L 20 120 Z" fill="#4a7ab5" fill-opacity="0.25" stroke="#4a7ab5" stroke-width="2"/>
    <circle cx="70" cy="140" r="6" fill="#d0413b"/>
    <text x="70" y="158" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#d0413b">pour point</text>
  </g>
  <text x="700" y="264" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">기준 지점으로 흘러드는</text>
  <text x="700" y="279" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">모든 상류 셀의 경계</text>

  <text x="400" y="340" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">전처리(싱크 채우기)가 선행되지 않으면 흐름이 인공 웅덩이에서 끊겨 파이프라인 전체가 무너진다</text>
  <text x="400" y="365" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">pour point는 반드시 실제 하천 셀(높은 흐름 누적값)로 스냅해야 정확한 유역이 나온다</text>
</svg>
