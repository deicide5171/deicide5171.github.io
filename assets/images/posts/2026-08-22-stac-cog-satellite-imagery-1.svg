<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">COG 타일·오버뷰 구조와 STAC 카탈로그 계층</text>
  <text x="400" y="44" text-anchor="middle" font-size="12" fill="#666">부분 읽기가 가능한 이미지 포맷(COG)과 검색 가능한 메타데이터 표준(STAC)</text>

  <line x1="400" y1="58" x2="400" y2="415" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ===================== LEFT: COG ===================== -->
  <text x="200" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">COG (Cloud Optimized GeoTIFF)</text>

  <!-- overview pyramid -->
  <rect x="170" y="80" width="60" height="22" rx="3" fill="#2b6cb0" stroke="#1a4971" stroke-width="1"/>
  <text x="200" y="95" text-anchor="middle" font-size="9.5" fill="#fff">오버뷰 L3</text>

  <rect x="145" y="106" width="110" height="22" rx="3" fill="#3182ce" stroke="#1a4971" stroke-width="1"/>
  <text x="200" y="121" text-anchor="middle" font-size="9.5" fill="#fff">오버뷰 L2</text>

  <rect x="110" y="132" width="180" height="22" rx="3" fill="#4299e1" stroke="#1a4971" stroke-width="1"/>
  <text x="200" y="147" text-anchor="middle" font-size="9.5" fill="#fff">오버뷰 L1</text>

  <!-- full-res tile grid -->
  <rect x="60" y="170" width="280" height="90" fill="#bee3f8" stroke="#2b6cb0" stroke-width="1.5"/>
  <line x1="100" y1="170" x2="100" y2="260" stroke="#8fb8d8" stroke-width="1"/>
  <line x1="140" y1="170" x2="140" y2="260" stroke="#8fb8d8" stroke-width="1"/>
  <line x1="180" y1="170" x2="180" y2="260" stroke="#8fb8d8" stroke-width="1"/>
  <line x1="220" y1="170" x2="220" y2="260" stroke="#8fb8d8" stroke-width="1"/>
  <line x1="260" y1="170" x2="260" y2="260" stroke="#8fb8d8" stroke-width="1"/>
  <line x1="300" y1="170" x2="300" y2="260" stroke="#8fb8d8" stroke-width="1"/>
  <line x1="60" y1="200" x2="340" y2="200" stroke="#8fb8d8" stroke-width="1"/>
  <line x1="60" y1="230" x2="340" y2="230" stroke="#8fb8d8" stroke-width="1"/>

  <!-- highlighted single tile -->
  <rect x="180" y="200" width="40" height="30" fill="#f6ad55" stroke="#c05621" stroke-width="1.5"/>

  <text x="200" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6cb0">원본 해상도 타일 그리드</text>

  <!-- client + range request arrow -->
  <rect x="155" y="310" width="90" height="28" rx="4" fill="#edf2f7" stroke="#4a5568" stroke-width="1.2"/>
  <text x="200" y="328" text-anchor="middle" font-size="10.5" fill="#333">클라이언트</text>

  <line x1="200" y1="310" x2="200" y2="234" stroke="#c05621" stroke-width="1.8" stroke-dasharray="5,3"/>
  <polygon points="193,240 207,240 200,229" fill="#c05621"/>

  <text x="330" y="264" text-anchor="middle" font-size="10" fill="#555">HTTP Range Request</text>
  <text x="330" y="278" text-anchor="middle" font-size="10" fill="#555">(필요한 타일 1개만 요청)</text>

  <text x="200" y="402" text-anchor="middle" font-size="11" fill="#444">파일 전체를 내려받지 않고 필요한 영역만 스트리밍</text>

  <!-- ===================== RIGHT: STAC ===================== -->
  <text x="600" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">STAC (SpatioTemporal Asset Catalog)</text>

  <rect x="530" y="80" width="140" height="34" rx="6" fill="#2f855a" stroke="#22543d" stroke-width="1.2"/>
  <text x="600" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Catalog</text>
  <text x="600" y="110" text-anchor="middle" font-size="9" fill="#e6fffa">(전체 카탈로그)</text>

  <line x1="600" y1="114" x2="600" y2="140" stroke="#999" stroke-width="1.5"/>

  <rect x="530" y="140" width="140" height="38" rx="6" fill="#38a169" stroke="#22543d" stroke-width="1.2"/>
  <text x="600" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Collection</text>
  <text x="600" y="171" text-anchor="middle" font-size="9" fill="#e6fffa">(예: Sentinel-2 L2A)</text>

  <line x1="565" y1="178" x2="510" y2="204" stroke="#999" stroke-width="1.5"/>
  <line x1="635" y1="178" x2="670" y2="204" stroke="#999" stroke-width="1.5"/>

  <rect x="455" y="204" width="110" height="36" rx="6" fill="#48bb78" stroke="#22543d" stroke-width="1.2"/>
  <text x="510" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Item</text>
  <text x="510" y="234" text-anchor="middle" font-size="8.5" fill="#f0fff4">(촬영 1장, A)</text>

  <rect x="615" y="204" width="110" height="36" rx="6" fill="#48bb78" stroke="#22543d" stroke-width="1.2"/>
  <text x="670" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Item</text>
  <text x="670" y="234" text-anchor="middle" font-size="8.5" fill="#f0fff4">(촬영 1장, B)</text>

  <line x1="490" y1="240" x2="465" y2="270" stroke="#999" stroke-width="1.5"/>
  <line x1="530" y1="240" x2="575" y2="270" stroke="#999" stroke-width="1.5"/>
  <line x1="670" y1="240" x2="685" y2="270" stroke="#999" stroke-width="1.5"/>

  <rect x="415" y="270" width="100" height="32" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1"/>
  <text x="465" y="285" text-anchor="middle" font-size="9" fill="#22543d">asset:</text>
  <text x="465" y="297" text-anchor="middle" font-size="9" fill="#22543d">B04.tif (COG)</text>

  <rect x="525" y="270" width="100" height="32" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1"/>
  <text x="575" y="285" text-anchor="middle" font-size="9" fill="#22543d">asset:</text>
  <text x="575" y="297" text-anchor="middle" font-size="9" fill="#22543d">thumbnail.png</text>

  <rect x="635" y="270" width="100" height="32" rx="4" fill="#c6f6d5" stroke="#2f855a" stroke-width="1"/>
  <text x="685" y="285" text-anchor="middle" font-size="9" fill="#22543d">asset:</text>
  <text x="685" y="297" text-anchor="middle" font-size="9" fill="#22543d">metadata.json</text>

  <text x="600" y="402" text-anchor="middle" font-size="11" fill="#444">geo 확장 필드(bbox, datetime)로 검색 가능한 JSON 메타데이터</text>
</svg>
