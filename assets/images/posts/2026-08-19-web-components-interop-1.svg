<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">프레임워크 ↔ 커스텀 엘리먼트 경계에서 오가는 데이터</text>

  <!-- Left: React box -->
  <rect x="30" y="70" width="190" height="60" rx="6" fill="#eaf1fd" stroke="#2f6fed"/>
  <text x="125" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">React 컴포넌트</text>
  <text x="125" y="115" text-anchor="middle" font-size="11" fill="#3b5bdb">ref + addEventListener</text>

  <!-- Left: Vue box -->
  <rect x="30" y="150" width="190" height="60" rx="6" fill="#e9f8ef" stroke="#1f9d55"/>
  <text x="125" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">Vue 컴포넌트</text>
  <text x="125" y="195" text-anchor="middle" font-size="11" fill="#1f9d55">:prop / @event 바인딩</text>

  <!-- Center: Custom Element boundary -->
  <rect x="300" y="70" width="220" height="230" rx="6" fill="#fdf1e6" stroke="#e67e22" stroke-width="2"/>
  <text x="410" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2610d">커스텀 엘리먼트</text>
  <text x="410" y="110" text-anchor="middle" font-size="11" fill="#c2610d">(예: &lt;my-date-picker&gt;)</text>

  <!-- Inner shadow dom box -->
  <rect x="320" y="130" width="180" height="140" rx="4" fill="#ffffff" stroke="#e67e22" stroke-dasharray="4,3"/>
  <text x="410" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2610d">Shadow DOM</text>
  <text x="410" y="170" text-anchor="middle" font-size="10.5" fill="#7a4a1a">내부 스타일 캡슐화</text>
  <text x="410" y="186" text-anchor="middle" font-size="10.5" fill="#7a4a1a">외부 CSS가 침투하지 못함</text>
  <text x="410" y="205" text-anchor="middle" font-size="10.5" fill="#7a4a1a">→ ::part() / CSS 변수로만</text>
  <text x="410" y="221" text-anchor="middle" font-size="10.5" fill="#7a4a1a">테마 값 전달</text>

  <!-- Right: outgoing custom event -->
  <rect x="580" y="110" width="190" height="60" rx="6" fill="#fdecec" stroke="#d64545"/>
  <text x="675" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#b02a2a">CustomEvent 발생</text>
  <text x="675" y="150" text-anchor="middle" font-size="10.5" fill="#b02a2a">el.dispatchEvent(...)</text>

  <!-- arrows in: attribute -->
  <line x1="220" y1="95" x2="300" y2="130" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="88" text-anchor="middle" font-size="10.5" fill="#1d4ed8">속성(문자열만)</text>

  <!-- arrows in: property -->
  <line x1="220" y1="115" x2="300" y2="160" stroke="#2f6fed" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="255" y="128" text-anchor="middle" font-size="10.5" fill="#1d4ed8">프로퍼티(객체·배열·함수)</text>

  <!-- vue arrows -->
  <line x1="220" y1="175" x2="300" y2="200" stroke="#1f9d55" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="220" text-anchor="middle" font-size="10.5" fill="#15803d">:value 바인딩(자동 변환)</text>

  <line x1="220" y1="195" x2="300" y2="230" stroke="#1f9d55" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="255" y="248" text-anchor="middle" font-size="10.5" fill="#15803d">@date-change 리스너</text>

  <!-- arrow out to custom event box -->
  <line x1="520" y1="140" x2="580" y2="140" stroke="#d64545" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- arrows back from custom event box to frameworks -->
  <path d="M675,170 C675,320 220,320 220,105" fill="none" stroke="#888888" stroke-width="1.3" stroke-dasharray="2,3" marker-end="url(#arrow3)"/>
  <text x="450" y="335" text-anchor="middle" font-size="11" fill="#666666">React: addEventListener 수동 등록 / Vue: v-on이 네이티브 이벤트로 자동 수신</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f6fed"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d64545"/>
    </marker>
    <marker id="arrow3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888888"/>
    </marker>
  </defs>

  <rect x="30" y="350" width="740" height="70" rx="4" fill="#f9f9f9" stroke="#dddddd"/>
  <text x="400" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">핵심: 원시값은 속성으로, 복합 데이터는 프로퍼티로 — 상태 변화는 CustomEvent로 밖에 알린다</text>
  <text x="400" y="395" text-anchor="middle" font-size="11" fill="#666666">React 19는 프로퍼티 존재 여부를 감지해 속성/프로퍼티를 자동 구분해 대입하도록 개선되었지만,</text>
  <text x="400" y="411" text-anchor="middle" font-size="11" fill="#666666">임의 이름의 커스텀 이벤트 수신은 여전히 ref + addEventListener가 필요한 경우가 많다</text>
</svg>
