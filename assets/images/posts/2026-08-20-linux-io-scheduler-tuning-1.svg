<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">blk-mq 구조와 I/O 스케줄러의 위치</text>
  <text x="400" y="46" text-anchor="middle" font-size="11.5" fill="#666">애플리케이션 요청 → CPU별 소프트웨어 큐 → (스케줄러) → NVMe 하드웨어 디스패치 큐</text>

  <defs>
    <marker id="arrowIO" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text x="105" y="72" text-anchor="middle" font-size="11" fill="#666">애플리케이션</text>
  <text x="290" y="72" text-anchor="middle" font-size="11" fill="#666">소프트웨어 큐 (CPU별)</text>
  <text x="500" y="72" text-anchor="middle" font-size="11" fill="#666">I/O 스케줄러 (선택)</text>
  <text x="700" y="72" text-anchor="middle" font-size="11" fill="#666">NVMe 장치</text>

  <!-- App requests -->
  <rect x="40" y="90" width="130" height="34" rx="5" fill="#eaf3ff" stroke="#0b5fa5"/>
  <text x="105" y="111" text-anchor="middle" font-size="10.5" fill="#123">read() / write()</text>

  <rect x="40" y="134" width="130" height="34" rx="5" fill="#eaf3ff" stroke="#0b5fa5"/>
  <text x="105" y="155" text-anchor="middle" font-size="10.5" fill="#123">read() / write()</text>

  <rect x="40" y="178" width="130" height="34" rx="5" fill="#eaf3ff" stroke="#0b5fa5"/>
  <text x="105" y="199" text-anchor="middle" font-size="10.5" fill="#123">fsync() 등</text>

  <line x1="170" y1="107" x2="228" y2="107" stroke="#555" stroke-width="1.5" marker-end="url(#arrowIO)"/>
  <line x1="170" y1="151" x2="228" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrowIO)"/>
  <line x1="170" y1="195" x2="228" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arrowIO)"/>

  <!-- Software queues (per-CPU) -->
  <rect x="230" y="90" width="130" height="34" rx="5" fill="#eefaf0" stroke="#2fa84f"/>
  <text x="295" y="111" text-anchor="middle" font-size="10" fill="#1f7a38">CPU0 SW 큐</text>

  <rect x="230" y="134" width="130" height="34" rx="5" fill="#eefaf0" stroke="#2fa84f"/>
  <text x="295" y="155" text-anchor="middle" font-size="10" fill="#1f7a38">CPU1 SW 큐</text>

  <rect x="230" y="178" width="130" height="34" rx="5" fill="#eefaf0" stroke="#2fa84f"/>
  <text x="295" y="199" text-anchor="middle" font-size="10" fill="#1f7a38">CPU2 SW 큐</text>

  <text x="295" y="228" text-anchor="middle" font-size="9.5" fill="#666">코어마다 큐가 분리되어</text>
  <text x="295" y="241" text-anchor="middle" font-size="9.5" fill="#666">단일 큐 락 경합이 사라짐</text>

  <!-- Scheduler branch box -->
  <rect x="400" y="86" width="200" height="160" rx="8" fill="#fff8ea" stroke="#c9701d" stroke-width="2"/>
  <text x="500" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a3550f">스케줄러 선택</text>

  <rect x="414" y="116" width="172" height="52" rx="5" fill="#ffffff" stroke="#c9701d"/>
  <text x="500" y="134" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">none</text>
  <text x="500" y="149" text-anchor="middle" font-size="9" fill="#333">병합·정렬 없이 그대로 전달</text>
  <text x="500" y="161" text-anchor="middle" font-size="8.5" fill="#a3550f">다중 큐 NVMe에 적합</text>

  <rect x="414" y="174" width="172" height="62" rx="5" fill="#ffffff" stroke="#c9701d"/>
  <text x="500" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">mq-deadline / bfq / kyber</text>
  <text x="500" y="204" text-anchor="middle" font-size="9" fill="#333">요청 병합·정렬, 만료시각·</text>
  <text x="500" y="216" text-anchor="middle" font-size="9" fill="#333">공평성·목표 지연시간 관리</text>
  <text x="500" y="229" text-anchor="middle" font-size="8.5" fill="#a3550f">기아 방지·공평 분배 필요 시</text>

  <line x1="360" y1="140" x2="400" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrowIO)"/>
  <line x1="600" y1="140" x2="640" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#arrowIO)"/>

  <!-- Hardware dispatch queues -->
  <rect x="642" y="90" width="120" height="34" rx="5" fill="#eaf3ff" stroke="#0b5fa5"/>
  <text x="702" y="111" text-anchor="middle" font-size="9.5" fill="#123">HW 디스패치 큐 0</text>

  <rect x="642" y="134" width="120" height="34" rx="5" fill="#eaf3ff" stroke="#0b5fa5"/>
  <text x="702" y="155" text-anchor="middle" font-size="9.5" fill="#123">HW 디스패치 큐 1</text>

  <rect x="642" y="178" width="120" height="34" rx="5" fill="#eaf3ff" stroke="#0b5fa5"/>
  <text x="702" y="199" text-anchor="middle" font-size="9.5" fill="#123">HW 디스패치 큐 N</text>

  <text x="702" y="228" text-anchor="middle" font-size="9.5" fill="#666">NVMe는 코어 수만큼</text>
  <text x="702" y="241" text-anchor="middle" font-size="9.5" fill="#666">병렬 큐를 지원</text>

  <!-- Comparison strip: none vs mq-deadline effect on requests -->
  <rect x="40" y="268" width="720" height="150" rx="8" fill="#f7f7f7" stroke="#bbb"/>
  <text x="400" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">요청 순서에 미치는 영향 비교 (예시)</text>

  <text x="70" y="318" font-size="10.5" fill="#333">들어온 순서:</text>
  <rect x="170" y="306" width="34" height="20" fill="#ffffff" stroke="#999"/>
  <text x="187" y="320" text-anchor="middle" font-size="9.5" fill="#333">A</text>
  <rect x="210" y="306" width="34" height="20" fill="#ffffff" stroke="#999"/>
  <text x="227" y="320" text-anchor="middle" font-size="9.5" fill="#333">C</text>
  <rect x="250" y="306" width="34" height="20" fill="#ffffff" stroke="#999"/>
  <text x="267" y="320" text-anchor="middle" font-size="9.5" fill="#333">B</text>
  <rect x="290" y="306" width="34" height="20" fill="#ffffff" stroke="#999"/>
  <text x="307" y="320" text-anchor="middle" font-size="9.5" fill="#333">C</text>

  <text x="70" y="354" font-size="10.5" fill="#c9701d">none 통과 후:</text>
  <rect x="170" y="342" width="34" height="20" fill="#fff8ea" stroke="#c9701d"/>
  <text x="187" y="356" text-anchor="middle" font-size="9.5" fill="#333">A</text>
  <rect x="210" y="342" width="34" height="20" fill="#fff8ea" stroke="#c9701d"/>
  <text x="227" y="356" text-anchor="middle" font-size="9.5" fill="#333">C</text>
  <rect x="250" y="342" width="34" height="20" fill="#fff8ea" stroke="#c9701d"/>
  <text x="267" y="356" text-anchor="middle" font-size="9.5" fill="#333">B</text>
  <rect x="290" y="342" width="34" height="20" fill="#fff8ea" stroke="#c9701d"/>
  <text x="307" y="356" text-anchor="middle" font-size="9.5" fill="#333">C</text>
  <text x="360" y="356" font-size="9.5" fill="#a3550f">순서 그대로, 병합 없음</text>

  <text x="70" y="390" font-size="10.5" fill="#1f7a38">mq-deadline 통과 후:</text>
  <rect x="210" y="378" width="34" height="20" fill="#eefaf0" stroke="#2fa84f"/>
  <text x="227" y="392" text-anchor="middle" font-size="9.5" fill="#333">C+C</text>
  <rect x="170" y="378" width="34" height="20" fill="#eefaf0" stroke="#2fa84f"/>
  <text x="187" y="392" text-anchor="middle" font-size="9.5" fill="#333">A</text>
  <rect x="250" y="378" width="34" height="20" fill="#eefaf0" stroke="#2fa84f"/>
  <text x="267" y="392" text-anchor="middle" font-size="9.5" fill="#333">B</text>
  <text x="400" y="392" font-size="9.5" fill="#1f7a38">인접 요청(C,C) 병합 + deadline 순 재정렬</text>

  <text x="400" y="436" text-anchor="middle" font-size="11" fill="#555">회전 디스크의 seek 최소화 로직은 병렬 큐 NVMe에서 오버헤드가 될 수 있어, 장치·워크로드별로 골라야 한다</text>
</svg>
