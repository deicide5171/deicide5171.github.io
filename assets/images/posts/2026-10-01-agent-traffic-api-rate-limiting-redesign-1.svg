<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>

  <rect x="20" y="30" width="140" height="55" rx="8" fill="#0ea5e9"/>
  <text x="90" y="53" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">에이전트 요청</text>
  <text x="90" y="71" text-anchor="middle" fill="#e0f2fe" font-size="10">재시도 루프 포함</text>

  <line x1="160" y1="57" x2="215" y2="57" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="215" y="25" width="280" height="110" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="355" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">게이트웨이 — 계층적 한도 검사</text>
  <rect x="230" y="55" width="250" height="24" rx="4" fill="#dbeafe"/>
  <text x="355" y="71" text-anchor="middle" font-size="10" fill="#1e3a8a">조직 단위 한도</text>
  <rect x="230" y="83" width="250" height="24" rx="4" fill="#bfdbfe"/>
  <text x="355" y="99" text-anchor="middle" font-size="10" fill="#1e3a8a">에이전트 식별자 단위 한도</text>
  <rect x="230" y="111" width="250" height="20" rx="4" fill="#93c5fd"/>
  <text x="355" y="125" text-anchor="middle" font-size="9" fill="#1e3a8a">최종 사용자 단위 한도</text>

  <line x1="355" y1="135" x2="355" y2="165" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="225" y="170" width="260" height="60" rx="8" fill="#7c3aed"/>
  <text x="355" y="195" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">비용 계측기</text>
  <text x="355" y="213" text-anchor="middle" fill="#ede9fe" font-size="10">토큰 수 · 컴퓨팅 시간 · 실제 비용 기록</text>

  <line x1="355" y1="230" x2="355" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="355" y1="245" x2="230" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="245" x2="480" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="110" y="285" width="240" height="65" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="230" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">재시도 예산</text>
  <text x="230" y="328" text-anchor="middle" font-size="10" fill="#78350f">같은 작업의 누적 소비 상한</text>
  <text x="230" y="342" text-anchor="middle" font-size="9" fill="#78350f">정상 범위면 통과</text>

  <rect x="370" y="285" width="240" height="65" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="490" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">서킷 브레이커</text>
  <text x="490" y="328" text-anchor="middle" font-size="10" fill="#7f1d1d">상한 초과 시 일정 시간 완전 차단</text>
  <text x="490" y="342" text-anchor="middle" font-size="9" fill="#7f1d1d">사람 트래픽은 영향 없음</text>

  <line x1="230" y1="350" x2="230" y2="385" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="90" y="390" width="280" height="45" rx="8" fill="#059669"/>
  <text x="230" y="417" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">정상 처리 후 응답 반환</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
</svg>
