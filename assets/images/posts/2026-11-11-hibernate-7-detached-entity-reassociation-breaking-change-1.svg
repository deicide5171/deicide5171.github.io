<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowHB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="14" fill="#333333">detached 엔티티 저장 경로 — Hibernate 6 vs Hibernate 7</text>

  <!-- controller -->
  <rect x="300" y="42" width="200" height="50" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="2"/>
  <text x="400" y="64" text-anchor="middle" font-size="12" fill="#333333">컨트롤러 — 폼 데이터 수신</text>
  <text x="400" y="80" text-anchor="middle" font-size="10" fill="#333333">ID 채워진 detached 엔티티</text>

  <line x1="360" y1="92" x2="220" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrowHB)"/>
  <line x1="440" y1="92" x2="580" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrowHB)"/>

  <!-- hibernate 6 path -->
  <rect x="80" y="132" width="280" height="50" rx="6" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="220" y="154" text-anchor="middle" font-size="12" fill="#1b3a73">Hibernate 6</text>
  <text x="220" y="170" text-anchor="middle" font-size="10" fill="#1b3a73">saveOrUpdate — 암묵적 재연결</text>

  <line x1="220" y1="182" x2="220" y2="216" stroke="#555" stroke-width="2" marker-end="url(#arrowHB)"/>

  <rect x="80" y="218" width="280" height="46" rx="6" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="220" y="246" text-anchor="middle" font-size="12" fill="#1b3a73">조회 없이 바로 update 시도</text>

  <line x1="220" y1="264" x2="220" y2="298" stroke="#999999" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowHB)"/>
  <text x="130" y="290" font-size="10" fill="#c0392b">동시 수정 시 덮어쓰기 위험</text>

  <!-- hibernate 7 path -->
  <rect x="440" y="132" width="280" height="50" rx="6" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="580" y="154" text-anchor="middle" font-size="12" fill="#15502f">Hibernate 7</text>
  <text x="580" y="170" text-anchor="middle" font-size="10" fill="#15502f">암묵적 재연결 경로 제거됨</text>

  <line x1="580" y1="182" x2="580" y2="216" stroke="#555" stroke-width="2" marker-end="url(#arrowHB)"/>

  <rect x="440" y="218" width="280" height="46" rx="6" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="580" y="246" text-anchor="middle" font-size="12" fill="#15502f">명시적 merge() 필요</text>

  <line x1="580" y1="264" x2="580" y2="298" stroke="#555" stroke-width="2" marker-end="url(#arrowHB)"/>

  <rect x="440" y="300" width="280" height="46" rx="6" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="580" y="328" text-anchor="middle" font-size="12" fill="#15502f">현재 상태 조회 후 병합</text>

  <rect x="80" y="300" width="280" height="46" rx="6" fill="#fff7f0" stroke="#e08a2e" stroke-width="2"/>
  <text x="220" y="322" text-anchor="middle" font-size="12" fill="#7a4310">런타임에서만 드러나는 실패</text>
  <text x="220" y="338" text-anchor="middle" font-size="10" fill="#7a4310">(컴파일 타임엔 안 보임)</text>

  <text x="400" y="400" text-anchor="middle" font-size="12" fill="#333333">영향 범위: 컨트롤러 · 서비스 · 레포지토리 전 구간</text>
</svg>
