<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">MapLibre GL JS Terrain — DEM 타일에서 3D 지형까지</text>

  <!-- Step 1: DEM tile -->
  <text x="130" y="60" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">1) Terrain-RGB DEM 타일</text>
  <rect x="45" y="75" width="170" height="140" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="60" y="90" width="140" height="110" fill="url(#grad1)" stroke="#64748b"/>
  <defs>
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
  </defs>
  <text x="130" y="222" text-anchor="middle" font-size="10.5" fill="#475569">픽셀 RGB 값 = 인코딩된 고도</text>

  <path d="M220,145 L270,145" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrT)"/>
  <defs>
    <marker id="arrT" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Step 2: decode formula -->
  <text x="360" y="60" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">2) 셰이더에서 고도 디코딩</text>
  <rect x="280" y="75" width="170" height="140" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="365" y="120" text-anchor="middle" font-size="11" fill="#1e3a8a">height = -10000 +</text>
  <text x="365" y="138" text-anchor="middle" font-size="11" fill="#1e3a8a">(R*256*256 + G*256 + B)</text>
  <text x="365" y="156" text-anchor="middle" font-size="11" fill="#1e3a8a">* 0.1</text>
  <text x="365" y="185" text-anchor="middle" font-size="10.5" fill="#3b5a9a">GPU 버텍스 셰이더에서</text>
  <text x="365" y="200" text-anchor="middle" font-size="10.5" fill="#3b5a9a">메시 정점 Z값으로 사용</text>

  <path d="M455,145 L505,145" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrT)"/>

  <!-- Step 3: 3D mesh -->
  <text x="615" y="60" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#334155">3) 지형 메시로 변형된 지도</text>
  <rect x="515" y="75" width="240" height="140" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <polyline points="530,190 560,150 590,175 620,120 650,160 680,100 710,140 740,110"
            fill="none" stroke="#059669" stroke-width="3"/>
  <polygon points="530,190 560,150 590,175 620,120 650,160 680,100 710,140 740,110 740,205 530,205"
           fill="#bbf7d0" opacity="0.5"/>
  <text x="635" y="222" text-anchor="middle" font-size="10.5" fill="#065f46">벡터/래스터 레이어가 지형 위에 드레이핑됨</text>

  <!-- bottom: exaggeration and hillshade -->
  <rect x="40" y="245" width="720" height="175" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">주요 설정: exaggeration과 hillshade 레이어 조합</text>

  <rect x="70" y="290" width="320" height="105" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="230" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">exaggeration: 1.0 (기본)</text>
  <polyline points="90,380 130,360 170,370 210,340 250,365 290,330 330,350 370,320"
            fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="230" y="398" text-anchor="middle" font-size="10.5" fill="#64748b">실제 고도 비율 그대로 표현</text>

  <rect x="410" y="290" width="320" height="105" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="570" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">exaggeration: 2.5 (과장)</text>
  <polyline points="430,385 470,345 510,365 550,300 590,355 630,280 670,325 710,265"
            fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="570" y="398" text-anchor="middle" font-size="10.5" fill="#92400e">평탄한 지형도 굴곡이 도드라짐</text>
</svg>
