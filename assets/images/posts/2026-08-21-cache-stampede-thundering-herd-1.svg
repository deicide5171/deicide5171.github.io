<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">캐시 스탬피드 발생 구조와 뮤텍스 락을 통한 해결</text>

  <!-- Problem panel -->
  <text x="20" y="52" font-size="12.5" font-weight="bold" fill="#c0392b">문제 상황 — 인기 키가 동시에 만료되는 순간</text>

  <rect x="330" y="60" width="140" height="36" rx="5" fill="#fdf1e6" stroke="#e67e22"/>
  <text x="400" y="83" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c2610d">캐시 키 만료(TTL=0)</text>

  <!-- concurrent requests -->
  <g fill="#eaf1fd" stroke="#2f6fed">
    <rect x="60"  y="130" width="90" height="34" rx="5"/>
    <rect x="180" y="130" width="90" height="34" rx="5"/>
    <rect x="300" y="130" width="90" height="34" rx="5"/>
    <rect x="420" y="130" width="90" height="34" rx="5"/>
    <rect x="540" y="130" width="90" height="34" rx="5"/>
  </g>
  <g font-size="10.5" fill="#1d4ed8" text-anchor="middle">
    <text x="105" y="151">요청 1</text>
    <text x="225" y="151">요청 2</text>
    <text x="345" y="151">요청 3</text>
    <text x="465" y="151">요청 4</text>
    <text x="585" y="151">요청 N</text>
  </g>

  <!-- arrows converging to DB -->
  <g stroke="#c0392b" stroke-width="1.4" fill="none" marker-end="url(#arrowRed)">
    <path d="M105,164 C105,190 340,210 400,222"/>
    <path d="M225,164 C225,195 350,212 400,222"/>
    <path d="M345,164 L400,222"/>
    <path d="M465,164 C465,195 450,212 400,222"/>
    <path d="M585,164 C585,190 460,210 400,222"/>
  </g>
  <text x="400" y="180" text-anchor="middle" font-size="10" fill="#999999">모두 캐시 미스 → 동시에 재계산 시도</text>

  <rect x="310" y="225" width="180" height="46" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">DB / 오리진</text>
  <text x="400" y="263" text-anchor="middle" font-size="10.5" fill="#c0392b">동시 부하 폭증 (과부하 위험)</text>

  <line x1="0" y1="290" x2="800" y2="290" stroke="#dddddd" stroke-width="1"/>

  <!-- Solution panel -->
  <text x="20" y="312" font-size="12.5" font-weight="bold" fill="#15803d">해결책 — 뮤텍스 락으로 재계산을 단일화</text>

  <g fill="#eaf1fd" stroke="#2f6fed">
    <rect x="60"  y="330" width="90" height="34" rx="5"/>
    <rect x="180" y="330" width="90" height="34" rx="5"/>
    <rect x="300" y="330" width="90" height="34" rx="5"/>
    <rect x="420" y="330" width="90" height="34" rx="5"/>
    <rect x="540" y="330" width="90" height="34" rx="5"/>
  </g>
  <g font-size="10.5" fill="#1d4ed8" text-anchor="middle">
    <text x="105" y="351">요청 1</text>
    <text x="225" y="351">요청 2</text>
    <text x="345" y="351">요청 3</text>
    <text x="465" y="351">요청 4</text>
    <text x="585" y="351">요청 N</text>
  </g>

  <!-- only request 3 (first) acquires lock -->
  <path d="M345,364 L400,404" stroke="#15803d" stroke-width="1.8" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="410" y="388" font-size="10" fill="#15803d">락 획득 → 재계산</text>

  <!-- others wait / stale -->
  <g stroke="#999999" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrowGray)">
    <path d="M105,364 C105,400 280,430 330,415"/>
    <path d="M225,364 C225,395 300,420 330,415"/>
    <path d="M465,364 C465,395 380,418 400,412"/>
    <path d="M585,364 C585,400 420,430 400,412"/>
  </g>
  <text x="230" y="410" text-anchor="middle" font-size="10" fill="#777777">락 실패 → 대기 후 새 캐시 사용 또는 기존(stale) 값 반환</text>

  <rect x="330" y="395" width="140" height="34" rx="6" fill="#e9f8ef" stroke="#1f9d55"/>
  <text x="400" y="417" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#15803d">DB 요청 1건만 발생</text>

  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#15803d"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999999"/>
    </marker>
  </defs>
</svg>
