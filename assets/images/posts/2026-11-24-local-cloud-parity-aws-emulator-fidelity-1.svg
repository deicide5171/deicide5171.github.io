<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; }
    .boxLocal { fill: #eef3ff; stroke: #3b5bdb; stroke-width: 2; }
    .boxCi { fill: #f0f7f4; stroke: #2e8b57; stroke-width: 2; }
    .boxStage { fill: #fff7f0; stroke: #e08a2e; stroke-width: 2; }
    .boxProd { fill: #fdeeee; stroke: #c0392b; stroke-width: 2; }
    .label { font-size: 12px; fill: #222222; text-anchor: middle; }
    .sublabel { font-size: 10px; fill: #555555; text-anchor: middle; }
    .arrow { stroke: #666666; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .title { font-size: 15px; font-weight: bold; fill: #222222; }
    .axislabel { font-size: 11px; fill: #777777; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666666" />
    </marker>
  </defs>

  <text x="20" y="26" class="title">로컬-클라우드 동등성 스펙트럼 — 충실도 vs 비용·속도</text>

  <line x1="60" y1="60" x2="760" y2="60" stroke="#cccccc" stroke-width="1" />
  <text x="70" y="52" class="axislabel">충실도 낮음 · 속도 빠름</text>
  <text x="690" y="52" class="axislabel">충실도 높음 · 속도 느림</text>

  <rect x="60" y="80" width="160" height="90" class="boxLocal" />
  <text x="140" y="102" class="label">로컬 워크스테이션</text>
  <text x="140" y="120" class="sublabel">AWS Emulator</text>
  <text x="140" y="136" class="sublabel">인메모리, 종료 시 소실</text>
  <text x="140" y="152" class="sublabel">단위·짧은 통합 테스트</text>

  <rect x="260" y="80" width="160" height="90" class="boxCi" />
  <text x="340" y="102" class="label">CI 파이프라인</text>
  <text x="340" y="120" class="sublabel">매 실행 휘발성 기동</text>
  <text x="340" y="136" class="sublabel">깨끗한 상태가 장점</text>
  <text x="340" y="152" class="sublabel">장시간 테스트는 비권장</text>

  <rect x="460" y="80" width="160" height="90" class="boxStage" />
  <text x="540" y="102" class="label">스테이징</text>
  <text x="540" y="120" class="sublabel">실제 AWS 샌드박스 계정</text>
  <text x="540" y="136" class="sublabel">계약 테스트 (주 1회)</text>
  <text x="540" y="152" class="sublabel">드리프트 감시 지점</text>

  <rect x="660" y="80" width="100" height="90" class="boxProd" />
  <text x="710" y="102" class="label">운영</text>
  <text x="710" y="120" class="sublabel">완전한</text>
  <text x="710" y="136" class="sublabel">실제 환경</text>

  <line x1="220" y1="125" x2="256" y2="125" class="arrow" />
  <line x1="420" y1="125" x2="456" y2="125" class="arrow" />
  <line x1="620" y1="125" x2="656" y2="125" class="arrow" />

  <rect x="150" y="210" width="500" height="80" class="box" />
  <text x="400" y="235" class="label">충실도 격차 감시: 계약 테스트 계층</text>
  <text x="400" y="256" class="sublabel">로컬·CI에서 통과한 테스트를 실제 샌드박스 계정에 주기 재실행</text>
  <text x="400" y="274" class="sublabel">에뮬레이터가 실제 AWS와 벌어지기 시작한 지점을 운영 전에 포착</text>

  <line x1="340" y1="170" x2="340" y2="206" class="arrow" />
  <line x1="540" y1="170" x2="460" y2="206" class="arrow" />

  <rect x="150" y="330" width="500" height="55" class="boxLocal" />
  <text x="400" y="352" class="label">주의: AWS Emulator는 에이전트가 전부 작성, PR 불가</text>
  <text x="400" y="370" class="sublabel">버그 발견해도 커뮤니티 패치 경로 없음 — 블랙박스 의존성으로 설계</text>

  <line x1="140" y1="170" x2="250" y2="356" class="arrow" />
</svg>
