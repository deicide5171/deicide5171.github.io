<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">typescript 패키지를 호출하는 네 가지 경로</text>

  <!-- consumers -->
  <rect x="30" y="70" width="160" height="60" rx="8" fill="#eef6ff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="110" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4f7a">에디터 LSP</text>
  <text x="110" y="113" text-anchor="middle" font-size="11" fill="#1b4f7a">자동완성·호버</text>

  <rect x="30" y="150" width="160" height="60" rx="8" fill="#eef6ff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="110" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4f7a">CI 타입체크</text>
  <text x="110" y="193" text-anchor="middle" font-size="11" fill="#1b4f7a">tsc --noEmit</text>

  <rect x="30" y="230" width="160" height="60" rx="8" fill="#fff4e5" stroke="#d98c2b" stroke-width="1.5"/>
  <text x="110" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4e14">번들러 트랜스파일</text>
  <text x="110" y="273" text-anchor="middle" font-size="11" fill="#7a4e14">esbuild·SWC·oxc</text>

  <rect x="30" y="310" width="160" height="70" rx="8" fill="#fdeceb" stroke="#d9534f" stroke-width="1.5"/>
  <text x="110" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2420">플러그인·코드생성</text>
  <text x="110" y="353" text-anchor="middle" font-size="11" fill="#7a2420">ts-patch·ts-morph</text>
  <text x="110" y="369" text-anchor="middle" font-size="11" fill="#7a2420">ts-jest 내부 API</text>

  <!-- arrows -->
  <line x1="190" y1="100" x2="300" y2="140" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="180" x2="300" y2="165" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="260" x2="300" y2="260" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="345" x2="300" y2="300" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <!-- Corsa box -->
  <rect x="320" y="110" width="190" height="90" rx="10" fill="#e6f4ea" stroke="#2f9e44" stroke-width="2"/>
  <text x="415" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d6b30">Corsa (Go)</text>
  <text x="415" y="160" text-anchor="middle" font-size="11" fill="#1d6b30">TypeScript 7.0 네이티브</text>
  <text x="415" y="177" text-anchor="middle" font-size="11" fill="#1d6b30">타입 체크 엔진, 8~12배 속도</text>

  <!-- Strada box -->
  <rect x="320" y="260" width="190" height="90" rx="10" fill="#f1f1f1" stroke="#888" stroke-width="2"/>
  <text x="415" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#444">Strada (JS)</text>
  <text x="415" y="310" text-anchor="middle" font-size="11" fill="#444">기존 프로그래매틱 API</text>
  <text x="415" y="327" text-anchor="middle" font-size="11" fill="#444">7.1 전까지 듀얼 설치로 유지</text>

  <!-- unaffected note -->
  <text x="630" y="255" text-anchor="middle" font-size="11" fill="#7a4e14" font-weight="bold">영향 적음</text>
  <text x="630" y="272" text-anchor="middle" font-size="10" fill="#7a4e14">(이미 네이티브 도구 사용)</text>

  <!-- affected note -->
  <rect x="560" y="300" width="200" height="70" rx="8" fill="#fdeceb" stroke="#d9534f" stroke-dasharray="4 3" stroke-width="1.5"/>
  <text x="660" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a2420">7.0에서 API 공백</text>
  <text x="660" y="343" text-anchor="middle" font-size="11" fill="#7a2420">프로그래매틱 접근은</text>
  <text x="660" y="358" text-anchor="middle" font-size="11" fill="#7a2420">7.1로 연기됨</text>

  <line x1="510" y1="155" x2="800" y2="155" stroke="none"/>
  <line x1="510" y1="305" x2="560" y2="330" stroke="#d9534f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="400" y="420" text-anchor="middle" font-size="12" fill="#666">에디터·CI 타입체크는 Corsa로 즉시 이득, 플러그인·코드생성 계층만 당분간 Strada에 고정</text>
</svg>
