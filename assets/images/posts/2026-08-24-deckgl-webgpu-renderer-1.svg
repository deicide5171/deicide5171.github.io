<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">deck.gl 렌더링 파이프라인 — WebGL vs WebGPU</text>

  <!-- deck.gl / luma.gl 공통 레이어 -->
  <rect x="220" y="60" width="360" height="56" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="2"/>
  <text x="400" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2c5583" text-anchor="middle">deck.gl 레이어 (ScatterplotLayer, PointCloudLayer 등)</text>
  <text x="400" y="103" font-family="sans-serif" font-size="12" fill="#5b7a9d" text-anchor="middle">luma.gl 추상화 계층 (Device API)</text>

  <line x1="330" y1="116" x2="230" y2="160" stroke="#888" stroke-width="2"/>
  <line x1="470" y1="116" x2="570" y2="160" stroke="#888" stroke-width="2"/>

  <!-- WebGL 경로 -->
  <rect x="90" y="165" width="260" height="130" rx="8" fill="#fdf6ec" stroke="#c98a3d" stroke-width="2"/>
  <text x="220" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a3611c" text-anchor="middle">WebGL 렌더러</text>
  <text x="110" y="212" font-family="sans-serif" font-size="12" fill="#6b5a35">· 명령형 상태 머신 API</text>
  <text x="110" y="232" font-family="sans-serif" font-size="12" fill="#6b5a35">· 셰이더 = 정점/프래그먼트 셰이더</text>
  <text x="110" y="252" font-family="sans-serif" font-size="12" fill="#6b5a35">· 범용 GPU 연산(컴퓨트) 미지원</text>
  <text x="110" y="272" font-family="sans-serif" font-size="12" fill="#6b5a35">· 폭넓은 브라우저 호환성</text>

  <!-- WebGPU 경로 -->
  <rect x="450" y="165" width="260" height="130" rx="8" fill="#eaf7ef" stroke="#2e9e63" stroke-width="2"/>
  <text x="580" y="190" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a6b45" text-anchor="middle">WebGPU 렌더러</text>
  <text x="470" y="212" font-family="sans-serif" font-size="12" fill="#2f6b4a">· 커맨드 버퍼 기반 명시적 API</text>
  <text x="470" y="232" font-family="sans-serif" font-size="12" fill="#2f6b4a">· 컴퓨트 셰이더 네이티브 지원</text>
  <text x="470" y="252" font-family="sans-serif" font-size="12" fill="#2f6b4a">· 병렬 커맨드 인코딩으로 CPU 오버헤드 절감</text>
  <text x="470" y="272" font-family="sans-serif" font-size="12" fill="#2f6b4a">· 브라우저 지원 확대 중</text>

  <!-- GPU 하드웨어 -->
  <rect x="250" y="330" width="300" height="60" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
  <text x="400" y="355" font-family="sans-serif" font-size="14" font-weight="bold" fill="#555" text-anchor="middle">GPU 하드웨어</text>
  <text x="400" y="375" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">(Vulkan / Metal / Direct3D 12 드라이버 경유)</text>

  <line x1="220" y1="295" x2="330" y2="330" stroke="#c98a3d" stroke-width="2"/>
  <line x1="580" y1="295" x2="470" y2="330" stroke="#2e9e63" stroke-width="2"/>

  <text x="400" y="425" font-family="sans-serif" font-size="13" fill="#888" text-anchor="middle">대용량 포인트클라우드에서 컴퓨트 셰이더로 필터링·집계를 GPU에서 직접 수행 가능</text>
</svg>
