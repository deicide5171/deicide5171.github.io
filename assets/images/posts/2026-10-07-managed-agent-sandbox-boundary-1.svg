<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">완전 관리형 vs 셀프호스티드 샌드박스 — 두뇌와 손의 분리</text>

  <text x="195" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">완전 관리형 — 경계가 하나</text>

  <rect x="90" y="66" width="210" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="195" y="87" text-anchor="middle" font-size="10" fill="#1e3a8a">사용자 요청</text>

  <line x1="195" y1="100" x2="195" y2="120" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <rect x="70" y="120" width="250" height="180" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="195" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">Anthropic 컨테이너</text>

  <rect x="90" y="154" width="210" height="54" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="195" y="174" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e3a8a">오케스트레이션(두뇌)</text>
  <text x="195" y="190" text-anchor="middle" font-size="8" fill="#1e40af">추론 · 컨텍스트 · 에러복구</text>

  <line x1="195" y1="208" x2="195" y2="222" stroke="#1d4ed8" stroke-width="1.3" marker-end="url(#arrowA)"/>

  <rect x="90" y="222" width="210" height="60" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="195" y="244" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e3a8a">실행 레이어(손)</text>
  <text x="195" y="260" text-anchor="middle" font-size="8" fill="#1e40af">bash · 파일 · 네트워크 egress</text>
  <text x="195" y="273" text-anchor="middle" font-size="8" fill="#1e40af">전부 Anthropic이 통제</text>

  <text x="605" y="52" text-anchor="middle" font-size="13" font-weight="bold" fill="#065f46">셀프호스티드 — 경계가 둘로 분리</text>

  <rect x="500" y="66" width="210" height="34" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="605" y="87" text-anchor="middle" font-size="10" fill="#064e3b">사용자 요청</text>

  <line x1="605" y1="100" x2="605" y2="120" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowB)"/>

  <rect x="500" y="120" width="210" height="60" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.6"/>
  <text x="605" y="140" text-anchor="middle" font-size="9" font-weight="bold" fill="#064e3b">Anthropic 오케스트레이션(두뇌)</text>
  <text x="605" y="156" text-anchor="middle" font-size="8" fill="#065f46">추론 · 컨텍스트 · 에러복구</text>
  <text x="605" y="170" text-anchor="middle" font-size="8" fill="#065f46">— 여전히 외부 인프라</text>

  <line x1="605" y1="180" x2="605" y2="198" stroke="#047857" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrowB)"/>
  <text x="680" y="193" text-anchor="middle" font-size="8" fill="#065f46">API 경계</text>

  <rect x="500" y="198" width="210" height="86" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.8"/>
  <text x="605" y="216" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">고객 VPC — 샌드박스 호스트</text>
  <text x="605" y="232" text-anchor="middle" font-size="8" fill="#78350f">실행 레이어(손): bash·파일·egress</text>
  <text x="605" y="246" text-anchor="middle" font-size="8" fill="#78350f">allowlist · 파일마운트 · 감사 로그</text>
  <text x="605" y="260" text-anchor="middle" font-size="8" fill="#78350f">고객이 직접 통제</text>
  <text x="605" y="274" text-anchor="middle" font-size="8" fill="#92400e">(메모리 기능은 2026-10 기준 미지원)</text>

  <line x1="400" y1="60" x2="400" y2="300" stroke="#d1d5db" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="60" y="330" width="680" height="80" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="400" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">데이터 레지던시 요구 = "실행 레이어의 물리적 위치를 통제하라"</text>
  <text x="400" y="376" text-anchor="middle" font-size="10" fill="#7c2d12">추론(두뇌)은 여전히 Anthropic — 프롬프트 자체가 민감 정보면 해결 안 됨</text>
  <text x="400" y="396" text-anchor="middle" font-size="10" fill="#7c2d12">egress·파일마운트 설계 책임이 고객에게 넘어온다는 점이 핵심 비용</text>

  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>
</svg>
