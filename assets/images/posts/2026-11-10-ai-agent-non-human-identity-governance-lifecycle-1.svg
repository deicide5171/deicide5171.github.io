<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="14" fill="#333333">에이전트 생명주기와 두 통제 레이어</text>

  <!-- lifecycle row -->
  <rect x="30" y="60" width="140" height="56" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="100" y="92" text-anchor="middle" font-size="13" fill="#15502f">생성</text>

  <line x1="170" y1="88" x2="210" y2="88" stroke="#555" stroke-width="2" marker-end="url(#arrowN)"/>

  <rect x="212" y="60" width="140" height="56" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="282" y="92" text-anchor="middle" font-size="13" fill="#15502f">권한 부여</text>

  <line x1="352" y1="88" x2="392" y2="88" stroke="#555" stroke-width="2" marker-end="url(#arrowN)"/>

  <rect x="394" y="60" width="140" height="56" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="464" y="92" text-anchor="middle" font-size="13" fill="#1b3a73">실행</text>

  <line x1="534" y1="88" x2="574" y2="88" stroke="#555" stroke-width="2" marker-end="url(#arrowN)"/>

  <rect x="576" y="60" width="90" height="56" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="621" y="92" text-anchor="middle" font-size="12" fill="#15502f">로테이션</text>

  <line x1="666" y1="88" x2="700" y2="88" stroke="#555" stroke-width="2" marker-end="url(#arrowN)"/>

  <rect x="672" y="140" width="98" height="56" rx="8" fill="#fdf0f0" stroke="#d6555a" stroke-width="2"/>
  <text x="721" y="172" text-anchor="middle" font-size="12" fill="#7a2a2d">폐기</text>

  <line x1="700" y1="116" x2="721" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrowN)"/>

  <!-- identity layer -->
  <rect x="30" y="220" width="400" height="100" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="230" y="246" text-anchor="middle" font-size="13" fill="#15502f">신원 거버넌스 레이어</text>
  <text x="230" y="268" text-anchor="middle" font-size="11" fill="#15502f">자격증명이 존재해야 하는가 · 소유자는 누구인가</text>
  <text x="230" y="286" text-anchor="middle" font-size="11" fill="#15502f">수명은 얼마인가 · 권한 범위는 어디까지인가</text>
  <text x="230" y="304" text-anchor="middle" font-size="11" fill="#15502f">→ 생성·권한부여·로테이션·폐기 책임</text>

  <!-- behavior layer -->
  <rect x="460" y="220" width="310" height="100" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="615" y="246" text-anchor="middle" font-size="13" fill="#1b3a73">런타임 행위 레이어</text>
  <text x="615" y="268" text-anchor="middle" font-size="11" fill="#1b3a73">지금 이 순간 이 권한으로</text>
  <text x="615" y="286" text-anchor="middle" font-size="11" fill="#1b3a73">무엇을 하려고 하는가</text>
  <text x="615" y="304" text-anchor="middle" font-size="11" fill="#1b3a73">→ 실행 단계 책임</text>

  <rect x="250" y="350" width="300" height="70" rx="8" fill="#fff7f0" stroke="#e08a2e" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="400" y="376" text-anchor="middle" font-size="12" fill="#7a4310">가장 흔한 설계 공백</text>
  <text x="400" y="396" text-anchor="middle" font-size="11" fill="#7a4310">세션 종료 후에도 자격증명이 자동 revoke 안 됨</text>

  <text x="400" y="438" text-anchor="middle" font-size="12" fill="#999999">두 레이어는 서로 다른 질문에 답하며, 한쪽이 다른 쪽을 대신할 수 없다</text>
</svg>
