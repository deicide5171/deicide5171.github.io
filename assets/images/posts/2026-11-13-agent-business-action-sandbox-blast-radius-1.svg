<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- Agent -->
  <rect x="320" y="20" width="160" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="400" y="50" text-anchor="middle" font-size="16" fill="#1e1b4b">에이전트 (LLM 추론)</text>

  <!-- arrows down -->
  <line x1="360" y1="70" x2="200" y2="110" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="70" x2="600" y2="110" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Left: code execution path -->
  <rect x="80" y="110" width="240" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="200" y="135" text-anchor="middle" font-size="14" fill="#1e293b">코드 실행형 도구 호출</text>

  <rect x="80" y="170" width="240" height="90" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="200" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#0e7490">코드 실행 샌드박스</text>
  <text x="200" y="218" text-anchor="middle" font-size="12" fill="#155e75">컨테이너 / 마이크로VM</text>
  <text x="200" y="238" text-anchor="middle" font-size="12" fill="#155e75">예상 밖 시스템 콜 차단</text>

  <line x1="200" y1="260" x2="200" y2="300" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="282" text-anchor="middle" font-size="11" fill="#666">침해 없으면 통과</text>

  <!-- Right: business action path -->
  <rect x="480" y="110" width="240" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="600" y="135" text-anchor="middle" font-size="14" fill="#1e293b">비즈니스 액션형 도구 호출</text>

  <rect x="480" y="170" width="240" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">행동 샌드박스</text>
  <text x="600" y="215" text-anchor="middle" font-size="12" fill="#9a3412">드라이런 · 멱등키</text>
  <text x="600" y="234" text-anchor="middle" font-size="12" fill="#9a3412">금액/빈도 한도</text>
  <text x="600" y="253" text-anchor="middle" font-size="12" fill="#9a3412">승인 게이트(HITL)</text>

  <line x1="600" y1="280" x2="600" y2="320" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="302" text-anchor="middle" font-size="11" fill="#666">되돌릴 수 있으면 통과</text>

  <!-- bottom: real systems -->
  <rect x="100" y="320" width="220" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="210" y="350" text-anchor="middle" font-size="13" fill="#334155">실행 환경 (컨테이너/VM 내부)</text>

  <rect x="480" y="320" width="240" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="600" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">실제 업무 시스템</text>
  <text x="600" y="362" text-anchor="middle" font-size="11" fill="#991b1b">결제 · CRM · 티켓 · 발송</text>

  <text x="400" y="410" text-anchor="middle" font-size="13" fill="#475569">같은 "샌드박스"라는 말이라도, 막는 대상과 수단은 전혀 다르다</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>
</svg>
