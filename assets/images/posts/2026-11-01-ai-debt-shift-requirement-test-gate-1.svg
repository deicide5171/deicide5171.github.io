<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <style>
    .stage { font: 13px sans-serif; fill:#1f2937; text-anchor:middle; }
    .label { font: 12px sans-serif; fill:#374151; text-anchor:middle; }
    .small { font: 11px sans-serif; fill:#6b7280; text-anchor:middle; }
    .title { font: bold 14px sans-serif; fill:#111827; }
    .box { fill:#ffffff; stroke:#9ca3af; stroke-width:1.5; }
    .arrow { stroke:#9ca3af; stroke-width:2; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <text x="20" y="28" class="title">파이프라인: 요구사항 → 스펙 → 코드 생성 → 테스트 → 리뷰 → 배포 → 운영</text>

  <!-- stage boxes -->
  <g>
    <rect x="20" y="50" width="90" height="46" rx="6" class="box"/>
    <text x="65" y="78" class="stage">요구사항</text>
    <rect x="130" y="50" width="90" height="46" rx="6" class="box"/>
    <text x="175" y="78" class="stage">스펙</text>
    <rect x="240" y="50" width="100" height="46" rx="6" class="box"/>
    <text x="290" y="78" class="stage">에이전트 코드생성</text>
    <rect x="360" y="50" width="90" height="46" rx="6" class="box"/>
    <text x="405" y="78" class="stage">로컬 테스트</text>
    <rect x="470" y="50" width="80" height="46" rx="6" class="box"/>
    <text x="510" y="78" class="stage">리뷰</text>
    <rect x="570" y="50" width="80" height="46" rx="6" class="box"/>
    <text x="610" y="78" class="stage">배포</text>
    <rect x="670" y="50" width="100" height="46" rx="6" class="box"/>
    <text x="720" y="78" class="stage">운영</text>
  </g>
  <line x1="110" y1="73" x2="130" y2="73" class="arrow"/>
  <line x1="220" y1="73" x2="240" y2="73" class="arrow"/>
  <line x1="340" y1="73" x2="360" y2="73" class="arrow"/>
  <line x1="450" y1="73" x2="470" y2="73" class="arrow"/>
  <line x1="550" y1="73" x2="570" y2="73" class="arrow"/>
  <line x1="650" y1="73" x2="670" y2="73" class="arrow"/>

  <!-- before: debt concentration -->
  <text x="20" y="140" class="title">AI 이전 — 부채는 코드 설계 단계에 몰림</text>
  <rect x="240" y="150" width="100" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="290" y="184" class="label" fill="#991b1b">설계 결함</text>
  <text x="290" y="200" class="small">코드리뷰·정적분석으로 포착</text>

  <!-- after: debt concentration -->
  <text x="20" y="260" class="title">AI 이후 — 부채는 요구사항·테스트 양끝으로 이동</text>
  <rect x="20" y="270" width="110" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="75" y="296" class="label" fill="#92400e">요구사항 오해</text>
  <text x="75" y="313" class="small">기존 게이트 없음</text>

  <rect x="360" y="270" width="110" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="415" y="296" class="label" fill="#92400e">테스트 누락</text>
  <text x="415" y="313" class="small">엣지케이스 미검증</text>

  <!-- new gates -->
  <text x="20" y="365" class="title">새 게이트</text>
  <rect x="20" y="375" width="190" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="397" class="label" fill="#1e3a8a">수용 기준 체크리스트</text>
  <text x="115" y="413" class="small">코드생성 전 PM·에이전트 합의</text>

  <rect x="360" y="375" width="190" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="455" y="397" class="label" fill="#1e3a8a">자동 수용 테스트 게이트</text>
  <text x="455" y="413" class="small">머지 전 커버리지 강제</text>

  <rect x="580" y="375" width="190" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="675" y="397" class="label" fill="#14532d">피처 플래그 롤백망</text>
  <text x="675" y="413" class="small">최후 안전망, 조기탐지 아님</text>
</svg>
