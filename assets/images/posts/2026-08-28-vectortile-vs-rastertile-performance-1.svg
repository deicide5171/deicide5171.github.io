<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="32" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">래스터 타일 vs 벡터 타일: 어디서 그리는가</text>

  <!-- Raster path -->
  <text x="200" y="64" font-family="sans-serif" font-size="15" font-weight="bold" fill="#a3611c" text-anchor="middle">래스터 타일</text>

  <rect x="60" y="80" width="120" height="60" rx="6" fill="#fdf6ec" stroke="#c98a3d" stroke-width="1.5"/>
  <text x="120" y="105" font-family="sans-serif" font-size="12" fill="#a3611c" text-anchor="middle">서버에서</text>
  <text x="120" y="123" font-family="sans-serif" font-size="12" fill="#a3611c" text-anchor="middle">스타일 반영해 렌더링</text>

  <line x1="180" y1="110" x2="220" y2="110" stroke="#999" stroke-width="2"/>
  <polygon points="224,110 214,104 214,116" fill="#999"/>

  <rect x="230" y="80" width="120" height="60" rx="6" fill="#ffffff" stroke="#c98a3d" stroke-width="1.5"/>
  <text x="290" y="105" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">완성된 이미지</text>
  <text x="290" y="123" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">PNG/JPEG 전송</text>

  <line x1="350" y1="110" x2="390" y2="110" stroke="#999" stroke-width="2"/>
  <polygon points="394,110 384,104 384,116" fill="#999"/>

  <rect x="60" y="160" width="290" height="50" rx="6" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="205" y="180" font-family="sans-serif" font-size="12" fill="#2b5a8a" text-anchor="middle" font-weight="bold">클라이언트: 이미지를 그대로 붙임</text>
  <text x="205" y="198" font-family="sans-serif" font-size="10" fill="#888" text-anchor="middle">렌더링 부담 낮음, 스타일 변경 시 재요청 필요</text>

  <!-- divider -->
  <line x1="400" y1="60" x2="400" y2="410" stroke="#ddd" stroke-width="1.5"/>

  <!-- Vector path -->
  <text x="600" y="64" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a6b45" text-anchor="middle">벡터 타일</text>

  <rect x="440" y="80" width="120" height="60" rx="6" fill="#eefaf1" stroke="#2e9e63" stroke-width="1.5"/>
  <text x="500" y="105" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">서버에서</text>
  <text x="500" y="123" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">좌표+속성만 추출</text>

  <line x1="560" y1="110" x2="600" y2="110" stroke="#999" stroke-width="2"/>
  <polygon points="604,110 594,104 594,116" fill="#999"/>

  <rect x="610" y="80" width="120" height="60" rx="6" fill="#ffffff" stroke="#2e9e63" stroke-width="1.5"/>
  <text x="670" y="105" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">MVT 바이너리</text>
  <text x="670" y="123" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">좌표 데이터 전송</text>

  <rect x="440" y="160" width="290" height="70" rx="6" fill="#eefaf1" stroke="#2e9e63" stroke-width="2"/>
  <text x="585" y="182" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle" font-weight="bold">클라이언트 GPU가 그 자리에서 그림</text>
  <text x="585" y="200" font-family="sans-serif" font-size="10" fill="#888" text-anchor="middle">스타일 JSON만 바꾸면 즉시 다크모드/언어 전환</text>
  <text x="585" y="216" font-family="sans-serif" font-size="10" fill="#888" text-anchor="middle">회전·3D 틸트도 좌표 재계산으로 자연스러움</text>

  <rect x="80" y="260" width="640" height="150" rx="8" fill="#f7f7f7" stroke="#ccc"/>
  <text x="400" y="288" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">트레이드오프 요약</text>
  <text x="400" y="316" font-family="sans-serif" font-size="12" fill="#a3611c" text-anchor="middle">래스터: 클라이언트 부담 낮음 / 스타일 변경 시 재배포 필요 / 저사양 기기에서도 안정적</text>
  <text x="400" y="342" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">벡터: 스타일 전환 자유로움 / 고해상도 대응 쉬움 / GPU 렌더링 부담 존재</text>
  <text x="400" y="372" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">위성·항공 원본처럼 벡터화 불가능한 연속 톤 이미지는 래스터가 유일한 선택지</text>
</svg>
