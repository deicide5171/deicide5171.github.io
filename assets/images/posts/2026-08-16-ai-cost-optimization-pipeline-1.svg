<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">AI 파이프라인 비용 최적화 아키텍처 — 캐싱 + 모델 라우팅</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arDash" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c9701d"/>
    </marker>
  </defs>

  <!-- 요청 -->
  <rect x="30" y="70" width="100" height="52" rx="8" fill="#eaf2fb" stroke="#0b5fa5"/>
  <text x="80" y="100" text-anchor="middle" font-size="13" fill="#0b5fa5" font-weight="bold">요청 수신</text>

  <!-- 캐시 계층 diamond -->
  <polygon points="240,60 320,96 240,132 160,96" fill="#eafff0" stroke="#2fa84f" stroke-width="1.5"/>
  <text x="240" y="91" text-anchor="middle" font-size="12" fill="#1f7a38" font-weight="bold">캐시 계층</text>
  <text x="240" y="106" text-anchor="middle" font-size="11" fill="#1f7a38">히트?</text>

  <line x1="130" y1="96" x2="158" y2="96" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Yes: to client response top -->
  <line x1="285" y1="72" x2="640" y2="40" stroke="#2fa84f" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="470" y="47" text-anchor="middle" font-size="11" fill="#1f7a38">HIT — 캐시 응답 즉시 반환</text>

  <!-- No: to classifier -->
  <line x1="240" y1="132" x2="240" y2="175" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="278" y="155" text-anchor="middle" font-size="11" fill="#333">MISS</text>

  <!-- 복잡도 분류기 -->
  <rect x="170" y="180" width="140" height="52" rx="8" fill="#fff4e5" stroke="#c9701d"/>
  <text x="240" y="202" text-anchor="middle" font-size="12" fill="#a3550f" font-weight="bold">복잡도 분류기</text>
  <text x="240" y="218" text-anchor="middle" font-size="10.5" fill="#a3550f">작업 유형 · 위험도 판단</text>

  <!-- arrows to tiers -->
  <line x1="200" y1="232" x2="110" y2="278" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="240" y1="232" x2="240" y2="278" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="280" y1="232" x2="370" y2="278" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- tier boxes -->
  <rect x="45" y="282" width="130" height="54" rx="8" fill="#eaf2fb" stroke="#0b5fa5"/>
  <text x="110" y="304" text-anchor="middle" font-size="12" fill="#0b5fa5" font-weight="bold">Economy</text>
  <text x="110" y="320" text-anchor="middle" font-size="10" fill="#0b5fa5">분류·태깅·추출</text>

  <rect x="175" y="282" width="130" height="54" rx="8" fill="#eaf2fb" stroke="#0b5fa5"/>
  <text x="240" y="304" text-anchor="middle" font-size="12" fill="#0b5fa5" font-weight="bold">Standard</text>
  <text x="240" y="320" text-anchor="middle" font-size="10" fill="#0b5fa5">요약·일반 Q&amp;A</text>

  <rect x="305" y="282" width="130" height="54" rx="8" fill="#eaf2fb" stroke="#0b5fa5"/>
  <text x="370" y="304" text-anchor="middle" font-size="12" fill="#0b5fa5" font-weight="bold">Premium</text>
  <text x="370" y="320" text-anchor="middle" font-size="10" fill="#0b5fa5">복합 추론·고위험</text>

  <!-- merge to model call -->
  <line x1="110" y1="336" x2="490" y2="380" stroke="#888" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="240" y1="336" x2="500" y2="382" stroke="#888" stroke-width="1.3" marker-end="url(#ar)"/>
  <line x1="370" y1="336" x2="510" y2="380" stroke="#888" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- 모델 실행 -->
  <rect x="440" y="356" width="120" height="52" rx="8" fill="#fdeeee" stroke="#c0392b"/>
  <text x="500" y="378" text-anchor="middle" font-size="12" fill="#a3312b" font-weight="bold">선택된 모델</text>
  <text x="500" y="394" text-anchor="middle" font-size="10" fill="#a3312b">추론 실행</text>

  <!-- 캐시 기록 -->
  <line x1="560" y1="382" x2="630" y2="382" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="632" y="356" width="140" height="52" rx="8" fill="#eafff0" stroke="#2fa84f"/>
  <text x="702" y="378" text-anchor="middle" font-size="12" fill="#1f7a38" font-weight="bold">캐시에 기록</text>
  <text x="702" y="394" text-anchor="middle" font-size="10" fill="#1f7a38">write-through</text>

  <!-- 클라이언트 응답 -->
  <rect x="632" y="18" width="140" height="52" rx="8" fill="#f3f0fb" stroke="#6a4fa8"/>
  <text x="702" y="40" text-anchor="middle" font-size="12" fill="#4b3480" font-weight="bold">클라이언트</text>
  <text x="702" y="56" text-anchor="middle" font-size="10" fill="#4b3480">응답 반환</text>

  <line x1="702" y1="356" x2="702" y2="72" stroke="#888" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- dashed loop back to cache layer -->
  <path d="M 702 356 C 702 200, 500 130, 322 96" fill="none" stroke="#c9701d" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arDash)"/>
  <text x="560" y="150" text-anchor="middle" font-size="10.5" fill="#a3550f">다음 동일 요청은 캐시 계층에서 히트</text>

</svg>
