<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">MCP 세션 기반(stateful) vs 2026-07-28 stateless 아키텍처</text>

  <text x="20" y="55" font-size="12" font-weight="bold" fill="#8a2d1c">Before — stateful</text>
  <rect x="20" y="65" width="110" height="46" rx="8" fill="#fdf0e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="75" y="93" text-anchor="middle" font-size="11" fill="#8a2d1c">클라이언트</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2e7d32"/></marker>
  </defs>

  <line x1="130" y1="88" x2="185" y2="88" stroke="#c0392b" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="190" y="65" width="150" height="46" rx="8" fill="#fdf0e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="265" y="85" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a2d1c">sticky 로드밸런서</text>
  <text x="265" y="100" text-anchor="middle" font-size="9" fill="#8a2d1c">세션 ID로 고정 라우팅</text>

  <line x1="340" y1="88" x2="395" y2="88" stroke="#c0392b" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="400" y="65" width="150" height="46" rx="8" fill="#fdf0e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="475" y="85" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a2d1c">서버 인스턴스 A</text>
  <text x="475" y="100" text-anchor="middle" font-size="9" fill="#8a2d1c">이 세션을 계속 들고 있음</text>

  <line x1="550" y1="88" x2="605" y2="88" stroke="#c0392b" stroke-width="2" marker-end="url(#a1)"/>
  <rect x="610" y="65" width="160" height="46" rx="8" fill="#fdf0e8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="690" y="85" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a2d1c">세션 스토어</text>
  <text x="690" y="100" text-anchor="middle" font-size="9" fill="#8a2d1c">Redis 등, 추가 장애 지점</text>

  <text x="400" y="135" text-anchor="middle" font-size="10.5" fill="#8a2d1c">인스턴스 재시작 → 세션 유실 · 다른 인스턴스로 튀면 맥락 끊김</text>

  <line x1="400" y1="150" x2="400" y2="175" stroke="#bbb" stroke-width="1.5"/>

  <text x="20" y="200" font-size="12" font-weight="bold" fill="#1b5e20">After — stateless (2026-07-28)</text>
  <rect x="20" y="210" width="110" height="46" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="75" y="233" text-anchor="middle" font-size="10.5" fill="#1b5e20">클라이언트</text>
  <text x="75" y="247" text-anchor="middle" font-size="8.5" fill="#1b5e20">(_meta에 신원 포함)</text>

  <line x1="130" y1="233" x2="185" y2="233" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="190" y="210" width="150" height="46" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="265" y="229" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b5e20">게이트웨이</text>
  <text x="265" y="244" text-anchor="middle" font-size="9" fill="#1b5e20">Mcp-Method/Name 헤더만 확인</text>

  <line x1="340" y1="225" x2="395" y2="210" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="340" y1="233" x2="395" y2="233" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="340" y1="241" x2="395" y2="256" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2)"/>

  <rect x="400" y="195" width="150" height="34" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="475" y="216" text-anchor="middle" font-size="10" fill="#1b5e20">인스턴스 A</text>
  <rect x="400" y="234" width="150" height="34" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="475" y="255" text-anchor="middle" font-size="10" fill="#1b5e20">인스턴스 B</text>
  <rect x="400" y="273" width="150" height="34" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="475" y="294" text-anchor="middle" font-size="10" fill="#1b5e20">인스턴스 C — 아무거나 OK</text>

  <line x1="550" y1="250" x2="605" y2="250" stroke="#2e7d32" stroke-width="2" marker-end="url(#a2)"/>
  <rect x="610" y="227" width="160" height="46" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="690" y="247" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b5e20">도구 / 백엔드</text>
  <text x="690" y="262" text-anchor="middle" font-size="9" fill="#1b5e20">세션 스토어 불필요</text>

  <rect x="30" y="330" width="740" height="100" rx="8" fill="#fff7f0" stroke="#f0a04b" stroke-width="2"/>
  <text x="400" y="353" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a5a1c">핵심 변화: 세션 ID·initialize 핸드셰이크 제거 → 요청마다 _meta로 신원 전달</text>
  <text x="400" y="376" text-anchor="middle" font-size="11.5" fill="#5a4632">확인(confirmation)이 필요한 중간 응답도 SSE 장기 연결 대신 MRTR(짧은 요청-응답 반복)로 처리</text>
  <text x="400" y="396" text-anchor="middle" font-size="11.5" fill="#5a4632">게이트웨이는 JSON-RPC 바디를 몰라도 표준 헤더만으로 라우팅 가능</text>
  <text x="400" y="416" text-anchor="middle" font-size="11.5" fill="#5a4632">→ 수평 확장 시 sticky routing·공유 세션 스토어가 더 이상 필요 없다</text>
</svg>
