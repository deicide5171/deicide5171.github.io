<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="32" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">TDE의 2단계 키 관리 구조</text>

  <!-- KMS -->
  <rect x="300" y="60" width="200" height="80" rx="8" fill="#fdf6ec" stroke="#c98a3d" stroke-width="2"/>
  <text x="400" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a3611c" text-anchor="middle">KMS (외부 키 관리 서비스)</text>
  <text x="400" y="112" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">마스터 키(KEK) 보관</text>

  <line x1="400" y1="140" x2="400" y2="175" stroke="#c98a3d" stroke-width="2.5"/>
  <polygon points="400,180 393,168 407,168" fill="#c98a3d"/>
  <text x="470" y="163" font-family="sans-serif" font-size="11" fill="#a3611c" text-anchor="middle">DB 부팅 시 인증 후 수신</text>

  <!-- DB engine -->
  <rect x="240" y="185" width="320" height="90" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="2"/>
  <text x="400" y="210" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b5a8a" text-anchor="middle">DB 엔진 (메모리)</text>
  <text x="400" y="232" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">KEK로 DEK를 복호화</text>
  <text x="400" y="252" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">DEK로 데이터 암복호화 (투명하게)</text>

  <line x1="400" y1="275" x2="400" y2="310" stroke="#2b5a8a" stroke-width="2.5"/>
  <polygon points="400,315 393,303 407,303" fill="#2b5a8a"/>

  <!-- Disk -->
  <rect x="180" y="320" width="440" height="100" rx="8" fill="#fdeeee" stroke="#d0413b" stroke-width="2"/>
  <text x="400" y="345" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a3211c" text-anchor="middle">디스크 (데이터 파일 / WAL / 백업)</text>
  <rect x="200" y="358" width="180" height="46" rx="6" fill="#ffffff" stroke="#d0413b"/>
  <text x="290" y="378" font-family="sans-serif" font-size="11" fill="#a3211c" text-anchor="middle" font-weight="bold">암호화된 DEK</text>
  <text x="290" y="394" font-family="sans-serif" font-size="10" fill="#666" text-anchor="middle">(KEK로 암호화되어 저장)</text>

  <rect x="400" y="358" width="200" height="46" rx="6" fill="#ffffff" stroke="#d0413b"/>
  <text x="500" y="378" font-family="sans-serif" font-size="11" fill="#a3211c" text-anchor="middle" font-weight="bold">암호화된 데이터 블록</text>
  <text x="500" y="394" font-family="sans-serif" font-size="10" fill="#666" text-anchor="middle">디스크 훔쳐도 무의미한 바이트</text>

  <text x="80" y="230" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle" transform="rotate(-90 80 230)">DEK: 실제 데이터 암호화 키</text>
</svg>
