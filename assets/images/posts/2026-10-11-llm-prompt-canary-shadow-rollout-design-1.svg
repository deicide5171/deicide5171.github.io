<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">LLM 변경의 섀도우 → 카나리 → 단계적 확대 라우팅</text>

  <rect x="320" y="50" width="160" height="50" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="400" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#312e81">사용자 요청</text>
  <text x="400" y="88" text-anchor="middle" font-size="7.5" fill="#3730a3">세션 단위로 버전 고정</text>

  <line x1="400" y1="100" x2="400" y2="130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <rect x="260" y="130" width="280" height="44" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.8"/>
  <text x="400" y="157" text-anchor="middle" font-size="10" font-weight="bold" fill="#1f2937">라우팅 계층 (버전 분기 + 비중 조절)</text>

  <line x1="330" y1="174" x2="200" y2="210" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <rect x="80" y="210" width="240" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="200" y="232" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">제어 버전(control)</text>
  <text x="200" y="248" text-anchor="middle" font-size="7.5" fill="#065f46">대다수 트래픽, 실제 응답 반환</text>

  <line x1="470" y1="174" x2="600" y2="210" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowC)"/>
  <rect x="480" y="210" width="240" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="600" y="228" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">후보 버전(candidate)</text>
  <text x="600" y="244" text-anchor="middle" font-size="7.5" fill="#991b1b">섀도우: 미러링만, 응답 미노출</text>
  <text x="600" y="256" text-anchor="middle" font-size="7.5" fill="#991b1b">카나리: 소수% 실제 응답 노출</text>

  <line x1="200" y1="266" x2="330" y2="300" stroke="#059669" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowB)"/>
  <line x1="600" y1="266" x2="470" y2="300" stroke="#dc2626" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowC)"/>

  <rect x="260" y="300" width="280" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="400" y="322" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#78350f">평가 레이어</text>
  <text x="400" y="338" text-anchor="middle" font-size="7.5" fill="#92400e">작업 완료율·재질문율 등 과업 지표 비교</text>
  <text x="400" y="350" text-anchor="middle" font-size="7.5" fill="#92400e">(에러율만으로는 품질 저하가 안 잡힘)</text>

  <line x1="400" y1="356" x2="400" y2="385" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowA)"/>

  <rect x="230" y="385" width="340" height="50" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="407" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7c2d12">자동 롤백 트리거 → 라우팅 비중을 0%로 되돌림</text>
  <text x="400" y="421" text-anchor="middle" font-size="7.5" fill="#9a3412">기준(예: 완료율 3%p 하락)은 카나리 시작 전에 미리 합의</text>

  <line x1="300" y1="385" x2="340" y2="174" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowD)"/>

  <defs>
    <marker id="arrowA" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
    <marker id="arrowC" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
