<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Segoe UI', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222222">1차 검색 → 리랭킹 → 생성으로 이어지는 RAG 파이프라인</text>

  <!-- Stage 1: query -->
  <rect x="20" y="80" width="130" height="90" rx="6" fill="#f0f0f0" stroke="#999999"/>
  <text x="85" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#444444">사용자 질의</text>
  <text x="85" y="135" text-anchor="middle" font-size="10.5" fill="#666666">query embedding</text>
  <text x="85" y="150" text-anchor="middle" font-size="10.5" fill="#666666">으로 변환</text>

  <!-- Stage 2: bi-encoder retrieval -->
  <rect x="200" y="70" width="180" height="110" rx="6" fill="#eaf1fd" stroke="#2f6fed"/>
  <text x="290" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">1차 검색</text>
  <text x="290" y="112" text-anchor="middle" font-size="11" fill="#3b5bdb">(Bi-Encoder, ANN 인덱스)</text>
  <text x="290" y="136" text-anchor="middle" font-size="10.5" fill="#274690">코사인 유사도 기준</text>
  <text x="290" y="152" text-anchor="middle" font-size="10.5" fill="#274690">top-k(예: 100개) 후보 추출</text>
  <text x="290" y="168" text-anchor="middle" font-size="10.5" fill="#274690">빠르지만 대략적</text>

  <!-- Stage 3: reranking -->
  <rect x="430" y="70" width="180" height="110" rx="6" fill="#fdf1e6" stroke="#e67e22" stroke-width="2"/>
  <text x="520" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2610d">리랭킹</text>
  <text x="520" y="112" text-anchor="middle" font-size="11" fill="#c2610d">(Cross-Encoder)</text>
  <text x="520" y="136" text-anchor="middle" font-size="10.5" fill="#7a4a1a">질의-문서 쌍을 함께</text>
  <text x="520" y="152" text-anchor="middle" font-size="10.5" fill="#7a4a1a">인코딩해 정밀 채점</text>
  <text x="520" y="168" text-anchor="middle" font-size="10.5" fill="#7a4a1a">top-n(예: 5개)로 축소</text>

  <!-- Stage 4: generation -->
  <rect x="650" y="80" width="130" height="90" rx="6" fill="#e9f8ef" stroke="#1f9d55"/>
  <text x="715" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">LLM 생성</text>
  <text x="715" y="135" text-anchor="middle" font-size="10.5" fill="#166534">최종 top-n 문서를</text>
  <text x="715" y="150" text-anchor="middle" font-size="10.5" fill="#166534">컨텍스트로 답변</text>

  <!-- arrows -->
  <line x1="150" y1="125" x2="200" y2="125" stroke="#666666" stroke-width="1.5" marker-end="url(#arrow0)"/>
  <line x1="380" y1="125" x2="430" y2="125" stroke="#2f6fed" stroke-width="1.5" marker-end="url(#arrow1)"/>
  <text x="405" y="115" text-anchor="middle" font-size="9.5" fill="#1d4ed8">후보 k개</text>
  <line x1="610" y1="125" x2="650" y2="125" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="630" y="115" text-anchor="middle" font-size="9.5" fill="#c2610d">상위 n개</text>

  <defs>
    <marker id="arrow0" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666666"/>
    </marker>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f6fed"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e67e22"/>
    </marker>
  </defs>

  <rect x="30" y="300" width="740" height="110" rx="4" fill="#f9f9f9" stroke="#dddddd"/>
  <text x="400" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">핵심: 속도와 정확도를 분리된 두 단계로 나눠 맡긴다</text>
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#666666">Bi-Encoder는 문서를 미리 임베딩해두고 벡터 연산만으로 빠르게 후보군을 좁힌다</text>
  <text x="400" y="370" text-anchor="middle" font-size="11" fill="#666666">Cross-Encoder는 질의와 문서를 함께 넣어 어텐션을 계산하므로 느리지만 훨씬 정밀하다</text>
  <text x="400" y="390" text-anchor="middle" font-size="11" fill="#666666">후보군이 이미 줄어든 상태에서만 리랭킹을 적용하므로 전체 지연시간은 감당할 만한 수준으로 유지된다</text>
</svg>
