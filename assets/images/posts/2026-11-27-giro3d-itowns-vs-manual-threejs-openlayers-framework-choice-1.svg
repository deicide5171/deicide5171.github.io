<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="200" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">직접 합성 (수동)</text>
  <text x="600" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">Giro3D / iTowns 채택</text>
  <line x1="400" y1="15" x2="400" y2="430" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Left: manual composition -->
  <rect x="50" y="50" width="130" height="50" rx="8" fill="#eef3ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="115" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d50">OpenLayers</text>
  <text x="115" y="88" text-anchor="middle" font-size="10" fill="#3b6fd6">2D 렌더 루프</text>

  <rect x="220" y="50" width="130" height="50" rx="8" fill="#fff7e6" stroke="#d8972a" stroke-width="2"/>
  <text x="285" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c3d0a">three.js</text>
  <text x="285" y="88" text-anchor="middle" font-size="10" fill="#8a5a00">3D 렌더 루프</text>

  <line x1="115" y1="100" x2="200" y2="150" stroke="#c23b3b" stroke-width="1.5"/>
  <line x1="285" y1="100" x2="200" y2="150" stroke="#c23b3b" stroke-width="1.5"/>

  <rect x="90" y="150" width="220" height="70" rx="8" fill="#fdecec" stroke="#c23b3b" stroke-width="2"/>
  <text x="200" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a1f1f">팀이 직접 짠 동기화 레이어</text>
  <text x="200" y="189" text-anchor="middle" font-size="10" fill="#7a1f1f">좌표계 재투영 · 렌더 루프 동기화</text>
  <text x="200" y="204" text-anchor="middle" font-size="10" fill="#7a1f1f">피킹 조정 · 테스트·문서 없음</text>

  <line x1="200" y1="220" x2="200" y2="260" stroke="#c23b3b" stroke-width="1.5" marker-end="url(#arrowred)"/>

  <rect x="90" y="260" width="220" height="50" rx="8" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="200" y="282" text-anchor="middle" font-size="11" fill="#333">신규 포맷·좌표계 추가할 때마다</text>
  <text x="200" y="298" text-anchor="middle" font-size="11" fill="#333">이 레이어에 코드가 계속 쌓임</text>

  <!-- Right: framework -->
  <rect x="430" y="50" width="130" height="50" rx="8" fill="#eef3ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="495" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2d50">OpenLayers</text>
  <text x="495" y="88" text-anchor="middle" font-size="10" fill="#3b6fd6">2D 엔진</text>

  <rect x="600" y="50" width="130" height="50" rx="8" fill="#fff7e6" stroke="#d8972a" stroke-width="2"/>
  <text x="665" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c3d0a">three.js</text>
  <text x="665" y="88" text-anchor="middle" font-size="10" fill="#8a5a00">3D 렌더러</text>

  <line x1="495" y1="100" x2="580" y2="150" stroke="#2e9e5b" stroke-width="1.5"/>
  <line x1="665" y1="100" x2="580" y2="150" stroke="#2e9e5b" stroke-width="1.5"/>

  <rect x="470" y="150" width="220" height="70" rx="8" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="2"/>
  <text x="580" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d6b3d">Giro3D / iTowns 코어</text>
  <text x="580" y="189" text-anchor="middle" font-size="10" fill="#1d6b3d">CRS 재투영 · 3D Tiles · 포인트클라우드</text>
  <text x="580" y="204" text-anchor="middle" font-size="10" fill="#1d6b3d">프레임워크가 유지보수</text>

  <line x1="580" y1="220" x2="580" y2="260" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arrowgreen)"/>

  <rect x="470" y="260" width="220" height="50" rx="8" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="580" y="282" text-anchor="middle" font-size="11" fill="#333">애플리케이션은 레이어 선언만</text>
  <text x="580" y="298" text-anchor="middle" font-size="11" fill="#333">("이 좌표계로 추가해줘")</text>

  <!-- Migration cost note -->
  <rect x="300" y="340" width="200" height="60" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="400" y="362" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">전환 비용</text>
  <text x="400" y="378" text-anchor="middle" font-size="10" fill="#444">기존 변환 로직을</text>
  <text x="400" y="392" text-anchor="middle" font-size="10" fill="#444">프레임워크 API로 재작성</text>

  <line x1="300" y1="220" x2="340" y2="340" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="500" y1="220" x2="460" y2="340" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2"/>

  <defs>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c23b3b"/>
    </marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e9e5b"/>
    </marker>
  </defs>
</svg>
