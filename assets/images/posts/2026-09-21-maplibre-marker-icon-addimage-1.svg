<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">커스텀 아이콘 등록 순서</text>

  <!-- Step 1 -->
  <rect x="40" y="70" width="200" height="110" rx="10" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="140" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#22345a">1. loadImage()</text>
  <text x="140" y="125" text-anchor="middle" font-size="12" fill="#22345a">PNG 파일을</text>
  <text x="140" y="143" text-anchor="middle" font-size="12" fill="#22345a">비동기로 로드</text>
  <text x="140" y="163" text-anchor="middle" font-size="11" fill="#666">(콜백/Promise)</text>

  <line x1="240" y1="125" x2="300" y2="125" stroke="#555" stroke-width="3" marker-end="url(#arrowA)"/>

  <!-- Step 2 -->
  <rect x="300" y="70" width="200" height="110" rx="10" fill="#e8f7ee" stroke="#2f9e58" stroke-width="2"/>
  <text x="400" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f5c34">2. addImage()</text>
  <text x="400" y="125" text-anchor="middle" font-size="12" fill="#1f5c34">스프라이트에</text>
  <text x="400" y="143" text-anchor="middle" font-size="12" fill="#1f5c34">이름으로 등록</text>
  <text x="400" y="163" text-anchor="middle" font-size="11" fill="#666">hasImage()로 중복 체크</text>

  <line x1="500" y1="125" x2="560" y2="125" stroke="#555" stroke-width="3" marker-end="url(#arrowA)"/>

  <!-- Step 3 -->
  <rect x="560" y="70" width="200" height="110" rx="10" fill="#fff4e5" stroke="#d98a2b" stroke-width="2"/>
  <text x="660" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4a10">3. symbol 레이어</text>
  <text x="660" y="125" text-anchor="middle" font-size="12" fill="#7a4a10">icon-image로</text>
  <text x="660" y="143" text-anchor="middle" font-size="12" fill="#7a4a10">이름 참조</text>
  <text x="660" y="163" text-anchor="middle" font-size="11" fill="#666">여기서 addLayer 호출</text>

  <!-- Warning box -->
  <rect x="60" y="230" width="680" height="90" rx="10" fill="#fdeceb" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a1f2b">순서를 뒤바꾸면?</text>
  <text x="400" y="282" text-anchor="middle" font-size="12" fill="#7a1f2b">레이어를 먼저 추가하면 "Image could not be loaded" 경고가 뜨거나</text>
  <text x="400" y="302" text-anchor="middle" font-size="12" fill="#7a1f2b">아이콘이 조용히 표시되지 않는다</text>

  <!-- setStyle warning -->
  <rect x="60" y="340" width="680" height="80" rx="10" fill="#fff7f0" stroke="#f0a04b" stroke-width="2"/>
  <text x="400" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a4632">setStyle()로 스타일 교체 시</text>
  <text x="400" y="390" text-anchor="middle" font-size="12" fill="#5a4632">등록된 이미지도 함께 사라짐 → style.load 이벤트에서 재등록 필요</text>

  <defs>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
