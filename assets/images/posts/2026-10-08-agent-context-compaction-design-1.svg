<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">에이전트 세션 압축(Compaction) 파이프라인</text>

  <rect x="30" y="54" width="170" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="115" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">누적되는 대화 턴</text>
  <text x="115" y="92" text-anchor="middle" font-size="8" fill="#991b1b">도구 호출·파일 읽기 결과</text>

  <line x1="200" y1="82" x2="245" y2="82" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowE)"/>

  <rect x="245" y="54" width="150" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="320" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">컨텍스트 버퍼</text>
  <text x="320" y="92" text-anchor="middle" font-size="8" fill="#991b1b">한도에 근접</text>

  <line x1="320" y1="110" x2="320" y2="134" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowE)"/>

  <rect x="200" y="134" width="240" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="320" y="159" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c2d12">압축 트리거 — 임계값 vs 시맨틱 판단</text>

  <line x1="320" y1="174" x2="320" y2="198" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowE)"/>

  <rect x="90" y="198" width="470" height="150" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="325" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">압축 전략 계층 (하나 또는 조합)</text>

  <rect x="110" y="232" width="100" height="50" rx="6" fill="#ffffff" stroke="#4338ca" stroke-width="1.2"/>
  <text x="160" y="252" text-anchor="middle" font-size="8" font-weight="bold" fill="#3730a3">LLM 요약</text>
  <text x="160" y="265" text-anchor="middle" font-size="7" fill="#3730a3">상태 재서술</text>
  <text x="160" y="276" text-anchor="middle" font-size="7" fill="#3730a3">(환각 위험)</text>

  <rect x="220" y="232" width="100" height="50" rx="6" fill="#ffffff" stroke="#4338ca" stroke-width="1.2"/>
  <text x="270" y="252" text-anchor="middle" font-size="8" font-weight="bold" fill="#3730a3">Verbatim 삭제</text>
  <text x="270" y="265" text-anchor="middle" font-size="7" fill="#3730a3">결정적 제거</text>
  <text x="270" y="276" text-anchor="middle" font-size="7" fill="#3730a3">(저비용)</text>

  <rect x="330" y="232" width="100" height="50" rx="6" fill="#ffffff" stroke="#4338ca" stroke-width="1.2"/>
  <text x="380" y="252" text-anchor="middle" font-size="8" font-weight="bold" fill="#3730a3">Observation</text>
  <text x="380" y="263" text-anchor="middle" font-size="8" font-weight="bold" fill="#3730a3">Masking</text>
  <text x="380" y="276" text-anchor="middle" font-size="7" fill="#3730a3">낡은 출력 치환</text>

  <rect x="440" y="232" width="100" height="50" rx="6" fill="#ffffff" stroke="#4338ca" stroke-width="1.2"/>
  <text x="490" y="252" text-anchor="middle" font-size="8" font-weight="bold" fill="#3730a3">서브에이전트</text>
  <text x="490" y="263" text-anchor="middle" font-size="8" font-weight="bold" fill="#3730a3">격리</text>
  <text x="490" y="276" text-anchor="middle" font-size="7" fill="#3730a3">새 컨텍스트 분리</text>

  <text x="325" y="330" text-anchor="middle" font-size="8" fill="#312e81">필수 보존: 사용자 요구사항 · 확정된 설계 결정 · 파일 상태 · 남은 작업</text>

  <line x1="320" y1="348" x2="320" y2="372" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowE)"/>

  <rect x="190" y="372" width="260" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="320" y="399" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">압축된 컨텍스트 → 다음 모델 입력</text>

  <path d="M 450 395 C 650 395 650 95 400 82" fill="none" stroke="#059669" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowF)"/>
  <text x="640" y="230" text-anchor="middle" font-size="8" fill="#065f46" transform="rotate(90 640 230)">에이전트 루프로 복귀</text>

  <rect x="600" y="54" width="170" height="100" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="685" y="74" text-anchor="middle" font-size="9" font-weight="bold" fill="#374151">압축이 망가지면</text>
  <text x="685" y="90" text-anchor="middle" font-size="7.5" fill="#4b5563">이미 끝낸 작업을 반복</text>
  <text x="685" y="104" text-anchor="middle" font-size="7.5" fill="#4b5563">중간에 바뀐 요구사항을 망각</text>
  <text x="685" y="118" text-anchor="middle" font-size="7.5" fill="#4b5563">"세션은 안 끊겼는데</text>
  <text x="685" y="132" text-anchor="middle" font-size="7.5" fill="#4b5563">왜 이상하게 행동하지" 버그</text>

  <defs>
    <marker id="arrowE" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowF" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>
</svg>
