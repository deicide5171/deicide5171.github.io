<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">자체 MCP 서버 경로 vs 서버사이드 도구 경로</text>

  <!-- Top: self-hosted MCP path -->
  <text x="40" y="58" font-size="13" font-weight="bold" fill="#c0392b">① 자체 MCP 서버 경로 — 왕복 2회</text>

  <rect x="40" y="70" width="110" height="50" rx="6" fill="#e8f4fd" stroke="#2b7fd1" stroke-width="2"/>
  <text x="95" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4d7a">클라이언트</text>

  <rect x="200" y="70" width="110" height="50" rx="6" fill="#fdf0e8" stroke="#c0392b" stroke-width="2"/>
  <text x="255" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a2d1c">Claude</text>
  <text x="255" y="108" text-anchor="middle" font-size="10" fill="#8a2d1c">(모델 추론)</text>

  <rect x="360" y="70" width="140" height="50" rx="6" fill="#fff" stroke="#888" stroke-width="2"/>
  <text x="430" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">우리 MCP 서버</text>
  <text x="430" y="108" text-anchor="middle" font-size="10" fill="#555">(검색 API/샌드박스)</text>

  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <line x1="150" y1="85" x2="198" y2="85" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="310" y1="95" x2="195" y2="95" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="310" y1="115" x2="358" y2="115" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow1)"/>
  <line x1="358" y1="85" x2="310" y2="85" stroke="#c0392b" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="600" y="98" font-size="11" fill="#8a2d1c">→ 도구 호출마다 클라이언트까지 왕복</text>

  <!-- Bottom: server-side tool path -->
  <text x="40" y="190" font-size="13" font-weight="bold" fill="#1b5e20">② 서버사이드 도구 경로 — 왕복 1회</text>

  <rect x="40" y="205" width="110" height="50" rx="6" fill="#e8f4fd" stroke="#2b7fd1" stroke-width="2"/>
  <text x="95" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4d7a">클라이언트</text>

  <rect x="230" y="190" width="330" height="90" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="395" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">Anthropic 인프라 (API 제공자 쪽)</text>

  <rect x="245" y="220" width="130" height="45" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="310" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">Claude</text>
  <text x="310" y="253" text-anchor="middle" font-size="10" fill="#444">모델 추론 루프</text>

  <rect x="400" y="220" width="145" height="45" rx="6" fill="#fff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="472" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b5e20">WebSearch/WebFetch</text>
  <text x="472" y="251" text-anchor="middle" font-size="10" fill="#444">CodeExecution 등</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7d32"/>
    </marker>
  </defs>
  <line x1="150" y1="225" x2="228" y2="225" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="228" y1="250" x2="150" y2="250" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="378" y1="242" x2="398" y2="242" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="600" y="235" font-size="11" fill="#1b5e20">→ 도구 호출이 인프라 안에서</text>
  <text x="600" y="250" font-size="11" fill="#1b5e20">완결, 최종 응답만 왕복</text>

  <!-- Bottom note -->
  <rect x="30" y="310" width="740" height="110" rx="8" fill="#fff7f0" stroke="#f0a04b" stroke-width="2"/>
  <text x="400" y="335" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a1c">선택 기준: 도구가 다루는 데이터가 공개된 것인가, 사내 전용인가</text>
  <text x="400" y="360" text-anchor="middle" font-size="12" fill="#5a4632">· 공개 웹 검색·범용 코드 실행 → 서버사이드 도구로 옮겨 왕복·운영 부담 절감</text>
  <text x="400" y="382" text-anchor="middle" font-size="12" fill="#5a4632">· 사내 DB·망분리 리소스 → 자체 MCP 서버로 유지, 제공자 인프라를 거칠 이유 없음</text>
  <text x="400" y="404" text-anchor="middle" font-size="12" fill="#5a4632">→ 2026년 기준 두 경로를 한 요청에 함께 등록하는 하이브리드 구성이 가장 흔하다</text>
</svg>
