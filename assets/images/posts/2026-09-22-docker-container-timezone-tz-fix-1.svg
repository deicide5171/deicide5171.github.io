<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">컨테이너 기본 시간대 vs TZ 설정 후</text>

  <rect x="50" y="70" width="320" height="320" rx="10" fill="#fdeeee" stroke="#e05a5a" stroke-width="2"/>
  <text x="210" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a2e2e">기본 상태 (TZ 미설정)</text>

  <circle cx="210" cy="200" r="70" fill="#ffffff" stroke="#e05a5a" stroke-width="2"/>
  <line x1="210" y1="200" x2="210" y2="150" stroke="#8a2e2e" stroke-width="3"/>
  <line x1="210" y1="200" x2="245" y2="200" stroke="#8a2e2e" stroke-width="3"/>
  <text x="210" y="285" text-anchor="middle" font-size="13" fill="#8a2e2e">시스템 시각: UTC</text>
  <text x="210" y="308" text-anchor="middle" font-size="12" fill="#555">/etc/localtime → UTC</text>
  <text x="210" y="330" text-anchor="middle" font-size="12" fill="#555">로그 타임스탬프가 9시간 어긋남</text>
  <text x="210" y="360" text-anchor="middle" font-size="12" fill="#555">크론 스케줄이 엉뚱한 시각에 실행</text>

  <rect x="430" y="70" width="320" height="320" rx="10" fill="#eef8ef" stroke="#2f9e58" stroke-width="2"/>
  <text x="590" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f5c34">TZ=Asia/Seoul 설정 후</text>

  <circle cx="590" cy="200" r="70" fill="#ffffff" stroke="#2f9e58" stroke-width="2"/>
  <line x1="590" y1="200" x2="590" y2="155" stroke="#1f5c34" stroke-width="3"/>
  <line x1="590" y1="200" x2="620" y2="225" stroke="#1f5c34" stroke-width="3"/>
  <text x="590" y="285" text-anchor="middle" font-size="13" fill="#1f5c34">시스템 시각: KST (UTC+9)</text>
  <text x="590" y="308" text-anchor="middle" font-size="12" fill="#555">tzdata 설치 + ENV TZ 설정</text>
  <text x="590" y="330" text-anchor="middle" font-size="12" fill="#555">로그 타임스탬프가 로컬 시각과 일치</text>
  <text x="590" y="360" text-anchor="middle" font-size="12" fill="#555">스케줄러가 의도한 시각에 실행</text>

  <line x1="380" y1="230" x2="420" y2="230" stroke="#555" stroke-width="3" marker-end="url(#arrowT)"/>

  <defs>
    <marker id="arrowT" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
