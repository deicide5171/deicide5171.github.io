<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">liveness 헬스체크가 degraded 상태를 놓치는 경로</text>

  <!-- Load balancer -->
  <rect x="40" y="70" width="130" height="55" rx="6" fill="#e8f4fd" stroke="#2b7fd1" stroke-width="2"/>
  <text x="105" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4d7a">로드밸런서</text>
  <text x="105" y="116" text-anchor="middle" font-size="10" fill="#1a4d7a">/오케스트레이터</text>

  <!-- Healthy node -->
  <rect x="240" y="55" width="150" height="55" rx="6" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="315" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">정상 노드</text>
  <text x="315" y="96" text-anchor="middle" font-size="10" fill="#1b5e20">liveness: 200 OK</text>

  <!-- Degraded node -->
  <rect x="240" y="125" width="150" height="55" rx="6" fill="#fdf0e8" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="315" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a2d1c">degraded 노드</text>
  <text x="315" y="166" text-anchor="middle" font-size="10" fill="#8a2d1c">liveness: 200 OK (느림, 5s)</text>

  <defs>
    <marker id="arrowg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2e7d32"/>
    </marker>
    <marker id="arrowr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <line x1="170" y1="90" x2="238" y2="80" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowg)"/>
  <line x1="170" y1="100" x2="238" y2="150" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowr)"/>
  <text x="600" y="150" font-size="12" fill="#8a2d1c">→ liveness만 보면 둘 다 "정상"으로 보여</text>
  <text x="600" y="168" font-size="12" fill="#8a2d1c">  트래픽이 계속 degraded 노드로도 흘러감</text>

  <!-- Connection pool filling up -->
  <rect x="240" y="210" width="340" height="70" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="2"/>
  <text x="410" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">커넥션 풀 — 느린 응답을 기다리는 연결로 고갈</text>
  <rect x="255" y="240" width="22" height="22" fill="#c0392b"/>
  <rect x="282" y="240" width="22" height="22" fill="#c0392b"/>
  <rect x="309" y="240" width="22" height="22" fill="#c0392b"/>
  <rect x="336" y="240" width="22" height="22" fill="#c0392b"/>
  <rect x="363" y="240" width="22" height="22" fill="#c0392b"/>
  <rect x="390" y="240" width="22" height="22" fill="#c0392b"/>
  <rect x="417" y="240" width="22" height="22" fill="#e0e0e0" stroke="#999"/>
  <rect x="444" y="240" width="22" height="22" fill="#e0e0e0" stroke="#999"/>
  <text x="520" y="256" font-size="10" fill="#555">대기 요청 누적 → 연쇄 지연</text>

  <line x1="315" y1="180" x2="315" y2="208" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowr)"/>

  <!-- Fix box -->
  <rect x="30" y="310" width="740" height="110" rx="8" fill="#fff7f0" stroke="#f0a04b" stroke-width="2"/>
  <text x="400" y="333" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a1c">구멍을 메우는 두 축</text>
  <text x="400" y="358" text-anchor="middle" font-size="12" fill="#5a4632">① 지연시간 기반 체크 — 응답 시간이 p99 기준선의 N배를 넘으면 unready로 판정 (감지)</text>
  <text x="400" y="380" text-anchor="middle" font-size="12" fill="#5a4632">② 회로차단기 — degraded로 판정된 노드로의 트래픽을 실제로 차단 (조치)</text>
  <text x="400" y="402" text-anchor="middle" font-size="11" fill="#8a5a1c">둘 중 하나만으로는 불완전: 감지만 하고 차단하지 않으면 대기 요청은 계속 쌓인다</text>
</svg>
