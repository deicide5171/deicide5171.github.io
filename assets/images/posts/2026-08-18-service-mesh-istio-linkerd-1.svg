<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555555"/>
    </marker>
    <marker id="arrowhead-rev" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555555"/>
    </marker>
  </defs>

  <text x="400" y="24" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">서비스 메시 사이드카 프록시 구조</text>

  <!-- Control plane -->
  <rect x="270" y="38" width="260" height="46" rx="6" fill="#eef4ff" stroke="#4a7fd6" stroke-width="1.5"/>
  <text x="400" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#22315a">컨트롤 플레인</text>
  <text x="400" y="75" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#22315a">(Istiod / linkerd-controller)</text>

  <!-- control plane to sidecars -->
  <line x1="330" y1="84" x2="210" y2="248" stroke="#4a7fd6" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="84" x2="590" y2="248" stroke="#4a7fd6" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <text x="205" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a7fd6">설정 전달</text>
  <text x="205" y="163" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a7fd6">(xDS / 인증서)</text>
  <text x="595" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a7fd6">설정 전달</text>
  <text x="595" y="163" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a7fd6">(xDS / 인증서)</text>

  <!-- Pod A -->
  <rect x="70" y="150" width="280" height="180" rx="8" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.3"/>
  <text x="210" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333333">Pod (서비스 A)</text>

  <rect x="100" y="182" width="220" height="50" rx="6" fill="#eafaf0" stroke="#2fa86a" stroke-width="1.5"/>
  <text x="210" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a5c3a">애플리케이션 컨테이너</text>

  <line x1="210" y1="232" x2="210" y2="248" stroke="#555555" stroke-width="1.3" marker-end="url(#arrowhead-rev)" marker-start="url(#arrowhead)"/>

  <rect x="100" y="250" width="220" height="50" rx="6" fill="#f2ecfb" stroke="#8a5fd6" stroke-width="1.5"/>
  <text x="210" y="273" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a2a5a">사이드카 프록시</text>
  <text x="210" y="289" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a2a5a">(Envoy / linkerd2-proxy)</text>

  <!-- Pod B -->
  <rect x="450" y="150" width="280" height="180" rx="8" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.3"/>
  <text x="590" y="172" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333333">Pod (서비스 B)</text>

  <rect x="480" y="182" width="220" height="50" rx="6" fill="#eafaf0" stroke="#2fa86a" stroke-width="1.5"/>
  <text x="590" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a5c3a">애플리케이션 컨테이너</text>

  <line x1="590" y1="232" x2="590" y2="248" stroke="#555555" stroke-width="1.3" marker-end="url(#arrowhead-rev)" marker-start="url(#arrowhead)"/>

  <rect x="480" y="250" width="220" height="50" rx="6" fill="#f2ecfb" stroke="#8a5fd6" stroke-width="1.5"/>
  <text x="590" y="273" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a2a5a">사이드카 프록시</text>
  <text x="590" y="289" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a2a5a">(Envoy / linkerd2-proxy)</text>

  <!-- mTLS between sidecars -->
  <line x1="320" y1="275" x2="480" y2="275" stroke="#8a5fd6" stroke-width="1.6" marker-end="url(#arrowhead)" marker-start="url(#arrowhead-rev)"/>
  <text x="400" y="265" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3a2a5a">mTLS 암호화 트래픽</text>

  <!-- Observability -->
  <rect x="280" y="382" width="240" height="48" rx="6" fill="#fff3e6" stroke="#e08a3d" stroke-width="1.5"/>
  <text x="400" y="401" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7a4a1a">관측성</text>
  <text x="400" y="417" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7a4a1a">메트릭 · 분산 트레이싱 · 접속 로그</text>

  <line x1="230" y1="300" x2="330" y2="382" stroke="#e08a3d" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <line x1="570" y1="300" x2="470" y2="382" stroke="#e08a3d" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
</svg>
