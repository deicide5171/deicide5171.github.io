<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">낙관적 락 충돌과 재시도 흐름</text>

  <!-- lifelines -->
  <line x1="180" y1="65" x2="180" y2="400" stroke="#999" stroke-width="1.5"/>
  <line x1="450" y1="65" x2="450" y2="400" stroke="#999" stroke-width="1.5"/>
  <line x1="680" y1="65" x2="680" y2="400" stroke="#999" stroke-width="1.5"/>

  <text x="180" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1f3d7a">트랜잭션 A</text>
  <text x="450" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#03612f">행 (version=1)</text>
  <text x="680" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#8a1f1f">트랜잭션 B</text>

  <!-- Both read -->
  <line x1="180" y1="90" x2="440" y2="90" stroke="#3b6fd6" stroke-width="1.8" marker-end="url(#o1)"/>
  <text x="310" y="82" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f3d7a">읽기 (v=1)</text>

  <line x1="680" y1="110" x2="460" y2="110" stroke="#c0392b" stroke-width="1.8" marker-end="url(#o2)"/>
  <text x="570" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a1f1f">읽기 (v=1)</text>

  <!-- A commits first -->
  <line x1="180" y1="150" x2="440" y2="150" stroke="#3b6fd6" stroke-width="1.8" marker-end="url(#o1)"/>
  <text x="310" y="142" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1f3d7a">UPDATE ... WHERE v=1</text>

  <rect x="380" y="160" width="140" height="30" rx="4" fill="#eafaf0" stroke="#03a35a"/>
  <text x="450" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#03612f">성공 → v=2로 갱신</text>

  <!-- B tries, fails -->
  <line x1="680" y1="220" x2="460" y2="220" stroke="#c0392b" stroke-width="1.8" marker-end="url(#o2)"/>
  <text x="570" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a1f1f">UPDATE ... WHERE v=1</text>

  <rect x="600" y="230" width="150" height="45" rx="4" fill="#fdeeee" stroke="#c0392b"/>
  <text x="675" y="248" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a1f1f" font-weight="bold">OptimisticLock</text>
  <text x="675" y="264" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a1f1f" font-weight="bold">Exception!</text>

  <!-- B retries -->
  <line x1="680" y1="310" x2="460" y2="310" stroke="#e08b2b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#o3)"/>
  <text x="570" y="302" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a5314">새 트랜잭션에서 재조회 (v=2)</text>

  <line x1="680" y1="350" x2="460" y2="350" stroke="#03a35a" stroke-width="1.8" marker-end="url(#o1b)"/>
  <text x="570" y="342" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#03612f">UPDATE ... WHERE v=2 → 성공</text>

  <defs>
    <marker id="o1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#3b6fd6"/></marker>
    <marker id="o1b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#03a35a"/></marker>
    <marker id="o2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c0392b"/></marker>
    <marker id="o3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#e08b2b"/></marker>
  </defs>

  <text x="400" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#777">핵심: 재시도는 새 트랜잭션에서 엔티티를 다시 읽는 것부터 시작</text>
</svg>
