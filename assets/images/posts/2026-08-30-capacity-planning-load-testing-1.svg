<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">용량 계획 3단계와 부하 테스트 유형별 트래픽 곡선</text>

  <!-- 3단계 -->
  <rect x="30" y="50" width="220" height="60" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="140" y="76" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2f5a8c" text-anchor="middle">① 트래픽 모델링</text>
  <text x="140" y="96" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">형태·지속시간·구성 변화 예측</text>

  <line x1="250" y1="80" x2="285" y2="80" stroke="#999" stroke-width="2"/>
  <polygon points="285,80 276,75 276,85" fill="#999"/>

  <rect x="290" y="50" width="220" height="60" rx="8" fill="#fdf6ec" stroke="#c98a3d" stroke-width="1.5"/>
  <text x="400" y="76" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a3611c" text-anchor="middle">② 병목 식별</text>
  <text x="400" y="96" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">DB풀·큐·캐시·다운스트림 API</text>

  <line x1="510" y1="80" x2="545" y2="80" stroke="#999" stroke-width="2"/>
  <polygon points="545,80 536,75 536,85" fill="#999"/>

  <rect x="550" y="50" width="220" height="60" rx="8" fill="#eef7f1" stroke="#2e9e63" stroke-width="1.5"/>
  <text x="660" y="76" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a6b45" text-anchor="middle">③ 부하 테스트 검증</text>
  <text x="660" y="96" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">가정을 실제 트래픽으로 확인</text>

  <!-- 4가지 테스트 곡선 -->
  <text x="400" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">부하 테스트 유형별 트래픽 곡선</text>

  <!-- Load test -->
  <rect x="40" y="160" width="170" height="110" rx="6" fill="#f7f9fc" stroke="#c9d6e8"/>
  <text x="125" y="178" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2f5a8c" text-anchor="middle">부하 테스트</text>
  <polyline points="55,250 90,220 175,220 195,250" fill="none" stroke="#4a7ab5" stroke-width="2"/>
  <text x="125" y="264" font-family="sans-serif" font-size="10" fill="#666" text-anchor="middle">예상 피크 재현</text>

  <!-- Stress test -->
  <rect x="220" y="160" width="170" height="110" rx="6" fill="#f7f9fc" stroke="#c9d6e8"/>
  <text x="305" y="178" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a3611c" text-anchor="middle">스트레스 테스트</text>
  <polyline points="235,255 260,240 285,215 310,185 335,190" fill="none" stroke="#c98a3d" stroke-width="2"/>
  <circle cx="335" cy="190" r="4" fill="#d0413b"/>
  <text x="305" y="264" font-family="sans-serif" font-size="10" fill="#666" text-anchor="middle">한계까지 계속 증가</text>

  <!-- Spike test -->
  <rect x="400" y="160" width="170" height="110" rx="6" fill="#f7f9fc" stroke="#c9d6e8"/>
  <text x="485" y="178" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a6b45" text-anchor="middle">스파이크 테스트</text>
  <polyline points="415,255 440,250 460,190 480,250 555,250" fill="none" stroke="#2e9e63" stroke-width="2"/>
  <text x="485" y="264" font-family="sans-serif" font-size="10" fill="#666" text-anchor="middle">급증 후 급감, 회복 확인</text>

  <!-- Soak test -->
  <rect x="580" y="160" width="190" height="110" rx="6" fill="#f7f9fc" stroke="#c9d6e8"/>
  <text x="675" y="178" font-family="sans-serif" font-size="12" font-weight="bold" fill="#8a5a2f" text-anchor="middle">소크 테스트</text>
  <polyline points="595,235 750,235" fill="none" stroke="#8a5a2f" stroke-width="2"/>
  <text x="675" y="255" font-family="sans-serif" font-size="10" fill="#666" text-anchor="middle">중간 부하를 장시간 유지</text>
  <text x="675" y="264" font-family="sans-serif" font-size="10" fill="#666" text-anchor="middle">(메모리·커넥션 누수 탐지)</text>

  <!-- 하단 요약 -->
  <rect x="40" y="300" width="730" height="120" rx="8" fill="#fff7f0" stroke="#e8d3ae"/>
  <text x="60" y="326" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a3611c">흔한 실수</text>
  <text x="60" y="354" font-family="sans-serif" font-size="13" fill="#333">CPU 사용률만 보고 애플리케이션 서버를 늘리지만, 실제 병목은 DB 커넥션 풀이나</text>
  <text x="60" y="378" font-family="sans-serif" font-size="13" fill="#333">다운스트림 API 레이트리밋처럼 눈에 덜 띄는 곳에 있는 경우가 많다.</text>
  <text x="60" y="404" font-family="sans-serif" font-size="13" fill="#d0413b">→ 병목 후보 전체를 표로 나열하고 하나씩 실측으로 확인해야 한다.</text>
</svg>
