<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">벡터 vs 래스터</text>

  <!-- Vector -->
  <rect x="40" y="70" width="330" height="300" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="205" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0a5a30">벡터 (점·선·면 좌표)</text>
  <!-- polygon building -->
  <polygon points="90,150 170,140 180,210 100,220" fill="#cfe8d8" stroke="#3a8a5a" stroke-width="2"/>
  <text x="135" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">건물(면)</text>
  <!-- line road -->
  <polyline points="200,160 260,200 320,170" fill="none" stroke="#4a90d9" stroke-width="3"/>
  <text x="270" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">도로(선)</text>
  <!-- point -->
  <circle cx="150" cy="280" r="6" fill="#e05252"/>
  <text x="150" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">지점(점)</text>
  <text x="205" y="345" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">확대해도 안 깨짐, 속성 부여 쉬움</text>

  <!-- Raster -->
  <rect x="430" y="70" width="330" height="300" rx="8" fill="#fff3e6" stroke="#e08a2b" stroke-width="2"/>
  <text x="595" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#8a4a10">래스터 (격자 픽셀)</text>
  <g stroke="#e0b080" stroke-width="0.5">
    <rect x="490" y="140" width="25" height="25" fill="#a8c99a"/><rect x="515" y="140" width="25" height="25" fill="#b8d4aa"/>
    <rect x="540" y="140" width="25" height="25" fill="#c9e0bc"/><rect x="565" y="140" width="25" height="25" fill="#dceccf"/>
    <rect x="590" y="140" width="25" height="25" fill="#7fb3d5"/><rect x="615" y="140" width="25" height="25" fill="#7fb3d5"/>
    <rect x="490" y="165" width="25" height="25" fill="#b8d4aa"/><rect x="515" y="165" width="25" height="25" fill="#c9e0bc"/>
    <rect x="540" y="165" width="25" height="25" fill="#dceccf"/><rect x="565" y="165" width="25" height="25" fill="#7fb3d5"/>
    <rect x="590" y="165" width="25" height="25" fill="#7fb3d5"/><rect x="615" y="165" width="25" height="25" fill="#6aa3c5"/>
    <rect x="490" y="190" width="25" height="25" fill="#c9e0bc"/><rect x="515" y="190" width="25" height="25" fill="#dceccf"/>
    <rect x="540" y="190" width="25" height="25" fill="#e8d4a0"/><rect x="565" y="190" width="25" height="25" fill="#e8d4a0"/>
    <rect x="590" y="190" width="25" height="25" fill="#7fb3d5"/><rect x="615" y="190" width="25" height="25" fill="#6aa3c5"/>
  </g>
  <text x="595" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">각 픽셀에 값(색·고도 등)</text>
  <text x="595" y="345" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">위성영상·고도, 확대하면 픽셀 보임</text>
</svg>
