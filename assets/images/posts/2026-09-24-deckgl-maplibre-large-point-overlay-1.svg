<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">deck.gl + MapLibre GL JS — MapboxOverlay로 대용량 포인트 인터리브 렌더링</text>

  <!-- Two approaches comparison -->
  <text x="185" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">1) 별도 캔버스 오버레이 (지양)</text>
  <rect x="40" y="72" width="300" height="150" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="60" y="90" width="260" height="50" rx="6" fill="#fecaca" stroke="#f87171"/>
  <text x="190" y="112" text-anchor="middle" font-size="12.5" fill="#7f1d1d">MapLibre 캔버스</text>
  <text x="190" y="128" text-anchor="middle" font-size="10.5" fill="#991b1b">(자체 render loop)</text>
  <rect x="60" y="150" width="260" height="50" rx="6" fill="#fecaca" stroke="#f87171"/>
  <text x="190" y="172" text-anchor="middle" font-size="12.5" fill="#7f1d1d">deck.gl 캔버스 (position:absolute)</text>
  <text x="190" y="188" text-anchor="middle" font-size="10.5" fill="#991b1b">(별도 render loop)</text>
  <text x="190" y="215" text-anchor="middle" font-size="10.5" fill="#991b1b">확대·회전 시 두 캔버스가 어긋남</text>

  <text x="605" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">2) MapboxOverlay 인터리브 (권장)</text>
  <rect x="460" y="72" width="300" height="150" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="480" y="90" width="260" height="35" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="610" y="112" text-anchor="middle" font-size="11.5" fill="#1e3a8a">배경 타일 레이어</text>
  <rect x="480" y="130" width="260" height="35" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="610" y="152" text-anchor="middle" font-size="11.5" fill="#92400e">deck.gl 포인트 레이어 (같은 gl 컨텍스트)</text>
  <rect x="480" y="170" width="260" height="35" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="610" y="192" text-anchor="middle" font-size="11.5" fill="#1e3a8a">레이블 레이어</text>
  <text x="610" y="215" text-anchor="middle" font-size="10.5" fill="#065f46">한 프레임, 한 컨텍스트에서 순서대로 합성</text>

  <!-- arrow -->
  <defs>
    <marker id="arrX" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
  <path d="M345,147 L455,147" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arrX)"/>
  <text x="400" y="137" text-anchor="middle" font-size="10" fill="#475569">전환</text>

  <!-- bottom: data flow for large point rendering -->
  <rect x="40" y="245" width="720" height="175" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">대용량 포인트 렌더링 — GPU 집계 흐름</text>

  <rect x="70" y="290" width="150" height="55" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="145" y="313" text-anchor="middle" font-size="12" fill="#4c1d95">원본 포인트</text>
  <text x="145" y="329" text-anchor="middle" font-size="10.5" fill="#5b21b6">수백만 건 (GeoJSON/Arrow)</text>

  <path d="M220,317 L275,317" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrX)"/>

  <rect x="280" y="290" width="150" height="55" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="355" y="313" text-anchor="middle" font-size="12" fill="#4c1d95">ScatterplotLayer /</text>
  <text x="355" y="329" text-anchor="middle" font-size="12" fill="#4c1d95">HeatmapLayer</text>

  <path d="M430,317 L485,317" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrX)"/>

  <rect x="490" y="290" width="150" height="55" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="565" y="313" text-anchor="middle" font-size="12" fill="#4c1d95">GPU 인스턴싱</text>
  <text x="565" y="329" text-anchor="middle" font-size="10.5" fill="#5b21b6">draw call 1회로 처리</text>

  <path d="M640,317 L695,317" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrX)"/>

  <rect x="670" y="290" width="70" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="705" y="322" text-anchor="middle" font-size="11" fill="#92400e">지도에</text>
  <text x="705" y="336" text-anchor="middle" font-size="11" fill="#92400e">합성</text>

  <text x="400" y="385" text-anchor="middle" font-size="11.5" fill="#475569">CPU에서 포인트 하나하나 DOM/Canvas로 그리지 않고, GPU 인스턴싱으로 수백만 건을 한 번의 draw call로 처리</text>
  <text x="400" y="403" text-anchor="middle" font-size="11.5" fill="#475569">MapboxOverlay 인터리브 모드 덕분에 지도 확대·회전에도 포인트가 항상 정확한 위치를 유지</text>
</svg>
