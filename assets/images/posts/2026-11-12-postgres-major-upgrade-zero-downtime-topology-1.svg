<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- app -->
  <rect x="320" y="20" width="160" height="50" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="400" y="50" text-anchor="middle" font-size="13" fill="#1b3a73">애플리케이션</text>

  <line x1="400" y1="70" x2="400" y2="110" stroke="#555" stroke-width="2"/>

  <!-- connection pooler -->
  <rect x="280" y="112" width="240" height="56" rx="8" fill="#f3f0ff" stroke="#6c4fd6" stroke-width="2"/>
  <text x="400" y="136" text-anchor="middle" font-size="13" fill="#3a2a73">커넥션 풀러 (PgBouncer)</text>
  <text x="400" y="154" text-anchor="middle" font-size="11" fill="#3a2a73">전환의 유일한 접점</text>

  <line x1="330" y1="168" x2="200" y2="220" stroke="#555" stroke-width="2" marker-end="url(#arrowP)"/>
  <line x1="470" y1="168" x2="600" y2="220" stroke="#2f6fed" stroke-width="2.5" marker-end="url(#arrowP)"/>
  <text x="170" y="200" font-size="11" fill="#999999">현재 트래픽</text>
  <text x="590" y="200" font-size="11" fill="#2f6fed">전환 후 트래픽</text>

  <!-- old pg -->
  <rect x="90" y="222" width="220" height="60" rx="8" fill="#fdf0f0" stroke="#d6555a" stroke-width="2"/>
  <text x="200" y="248" text-anchor="middle" font-size="13" fill="#7a2a2d">PostgreSQL 14 (구버전)</text>
  <text x="200" y="266" text-anchor="middle" font-size="11" fill="#7a2a2d">EOL, 읽기 전용 롤백 대상</text>

  <!-- new pg -->
  <rect x="490" y="222" width="220" height="60" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="600" y="248" text-anchor="middle" font-size="13" fill="#15502f">PostgreSQL 19 (신버전)</text>
  <text x="600" y="266" text-anchor="middle" font-size="11" fill="#15502f">운영 트래픽 수신</text>

  <!-- logical replication -->
  <line x1="310" y1="252" x2="490" y2="252" stroke="#e08a2e" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowP)"/>
  <text x="400" y="240" text-anchor="middle" font-size="11" fill="#b57d3a">논리 복제</text>

  <rect x="150" y="320" width="500" height="56" rx="8" fill="#fff7f0" stroke="#e08a2e" stroke-width="2"/>
  <text x="400" y="344" text-anchor="middle" font-size="13" fill="#7a4310">복제 지연 0 수렴 확인 → 풀러 설정만 전환</text>
  <text x="400" y="362" text-anchor="middle" font-size="11" fill="#7a4310">시퀀스 값은 커트오버 직전 수동 동기화</text>

  <line x1="200" y1="282" x2="300" y2="320" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="600" y1="282" x2="500" y2="320" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
