<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">커스텀 애노테이션 + AOP 실행 흐름</text>

  <rect x="60" y="70" width="250" height="80" rx="8" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="185" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#22345a">@RequireAdmin</text>
  <text x="185" y="120" text-anchor="middle" font-size="11" fill="#333">deleteUser(id)</text>
  <text x="185" y="138" text-anchor="middle" font-size="10" fill="#888">컨트롤러 메서드 호출</text>

  <line x1="310" y1="110" x2="360" y2="110" stroke="#555" stroke-width="3" marker-end="url(#arrowA)"/>

  <rect x="365" y="65" width="380" height="200" rx="10" fill="#fff9e8" stroke="#e6b800" stroke-width="2"/>
  <text x="555" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5c00">AdminCheckAspect (@Around)</text>

  <rect x="390" y="105" width="330" height="40" rx="6" fill="#ffffff" stroke="#e6b800"/>
  <text x="555" y="130" text-anchor="middle" font-size="12" fill="#333">1. 권한(ROLE_ADMIN) 확인</text>

  <line x1="555" y1="145" x2="555" y2="165" stroke="#7a5c00" stroke-width="2" marker-end="url(#arrowA)"/>

  <rect x="390" y="167" width="150" height="40" rx="6" fill="#fbe3e3" stroke="#e05a5a"/>
  <text x="465" y="192" text-anchor="middle" font-size="11" fill="#8a2e2e">실패 → 예외</text>

  <rect x="560" y="167" width="160" height="40" rx="6" fill="#e6f7ea" stroke="#2f9e58"/>
  <text x="640" y="192" text-anchor="middle" font-size="11" fill="#1f5c34">성공 → proceed()</text>

  <line x1="640" y1="207" x2="640" y2="230" stroke="#1f5c34" stroke-width="2" marker-end="url(#arrowA)"/>

  <rect x="560" y="232" width="160" height="30" rx="6" fill="#ffffff" stroke="#2f9e58"/>
  <text x="640" y="252" text-anchor="middle" font-size="11" fill="#333">2. 원본 메서드 실행</text>

  <rect x="150" y="300" width="500" height="110" rx="10" fill="#f9f9f9" stroke="#ddd" stroke-width="1.5"/>
  <text x="400" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">핵심 포인트</text>
  <text x="400" y="355" text-anchor="middle" font-size="12" fill="#555">애노테이션 자체는 메타데이터일 뿐, 동작은 Aspect가 담당</text>
  <text x="400" y="378" text-anchor="middle" font-size="12" fill="#555">@Retention(RUNTIME)이 없으면 AOP가 감지하지 못함</text>
  <text x="400" y="398" text-anchor="middle" font-size="12" fill="#555">컨트롤러는 비즈니스 로직만 담당</text>

  <defs>
    <marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
