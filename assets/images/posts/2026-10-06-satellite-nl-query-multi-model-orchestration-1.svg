<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">자연어 질의 → 멀티 파운데이션 모델 오케스트레이션</text>

  <rect x="300" y="44" width="200" height="44" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="400" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#312e81">분석가 자연어 질의</text>
  <text x="400" y="78" text-anchor="middle" font-size="9" fill="#3730a3">"냉방 설비 없는 건물 찾아줘"</text>

  <line x1="400" y1="88" x2="400" y2="112" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrowI)"/>

  <rect x="275" y="112" width="250" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="400" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#4c1d95">오케스트레이터 LLM</text>
  <text x="400" y="148" text-anchor="middle" font-size="9" fill="#5b21b6">질의 분해 + 함수 호출(tool-calling)</text>

  <line x1="330" y1="158" x2="160" y2="192" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrowI)"/>
  <line x1="400" y1="158" x2="400" y2="192" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrowI)"/>
  <line x1="470" y1="158" x2="640" y2="192" stroke="#7c3aed" stroke-width="1.3" marker-end="url(#arrowI)"/>

  <rect x="60" y="192" width="200" height="48" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="160" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">객체 탐지 모델</text>
  <text x="160" y="228" text-anchor="middle" font-size="9" fill="#065f46">전문 파운데이션 모델</text>

  <rect x="300" y="192" width="200" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">변화 탐지 모델</text>
  <text x="400" y="228" text-anchor="middle" font-size="9" fill="#92400e">전문 파운데이션 모델</text>

  <rect x="540" y="192" width="200" height="48" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="640" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#831843">토지 피복 분류 모델</text>
  <text x="640" y="228" text-anchor="middle" font-size="9" fill="#9d174d">전문 파운데이션 모델</text>

  <line x1="160" y1="240" x2="160" y2="262" stroke="#059669" stroke-width="1.2" marker-end="url(#arrowI)"/>
  <line x1="400" y1="240" x2="400" y2="262" stroke="#d97706" stroke-width="1.2" marker-end="url(#arrowI)"/>
  <line x1="640" y1="240" x2="640" y2="262" stroke="#db2777" stroke-width="1.2" marker-end="url(#arrowI)"/>

  <rect x="80" y="262" width="640" height="38" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/>
  <text x="400" y="286" text-anchor="middle" font-size="10" fill="#374151">위성·항공 이미지 타일 인덱스 (STAC 카탈로그 / 클라우드 네이티브 래스터)</text>

  <line x1="400" y1="300" x2="400" y2="322" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowI)"/>

  <rect x="230" y="322" width="340" height="48" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.8"/>
  <text x="400" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#064e3b">지도 합성 레이어</text>
  <text x="400" y="358" text-anchor="middle" font-size="9" fill="#065f46">좌표·신뢰도 점수 통합 → 시각화 / 보고서</text>

  <rect x="60" y="388" width="680" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="400" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">핵심: 모델을 새로 학습하지 않고, 이미 존재하는 전문 모델을 질의 단위로 조합</text>
  <text x="400" y="424" text-anchor="middle" font-size="10" fill="#7c2d12">신뢰도 낮은 결과는 사람 검수 루프로</text>

  <defs>
    <marker id="arrowI" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4b5563"/>
    </marker>
  </defs>
</svg>
