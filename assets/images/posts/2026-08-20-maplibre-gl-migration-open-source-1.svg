<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">MapLibre GL 벡터 타일 렌더링 파이프라인</text>
  <text x="400" y="49" text-anchor="middle" font-size="12" fill="#666">타일 요청부터 화면에 그려지기까지 네 단계</text>

  <!-- Stage 1: Tile request -->
  <rect x="40" y="90" width="160" height="90" rx="8" fill="#0b5fa5" stroke="#083f6e" stroke-width="1.5"/>
  <text x="120" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">① 타일 요청</text>
  <text x="120" y="138" text-anchor="middle" font-size="10.5" fill="#dbeafe">화면 범위 → z/x/y</text>
  <text x="120" y="154" text-anchor="middle" font-size="10.5" fill="#dbeafe">좌표 계산 후 서버에</text>
  <text x="120" y="170" text-anchor="middle" font-size="10.5" fill="#dbeafe">MVT 바이너리 요청</text>

  <path d="M200 135 L235 135" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Parse (worker) -->
  <rect x="240" y="90" width="160" height="90" rx="8" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="320" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">② 파싱</text>
  <text x="320" y="138" text-anchor="middle" font-size="10.5" fill="#dbeafe">워커 스레드에서 MVT</text>
  <text x="320" y="154" text-anchor="middle" font-size="10.5" fill="#dbeafe">바이너리 → 지오메트리</text>
  <text x="320" y="170" text-anchor="middle" font-size="10.5" fill="#dbeafe">복원 및 타일링</text>

  <path d="M400 135 L435 135" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Style apply -->
  <rect x="440" y="90" width="160" height="90" rx="8" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="520" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">③ 스타일 적용</text>
  <text x="520" y="138" text-anchor="middle" font-size="10.5" fill="#eafff0">스타일 JSON의 레이어</text>
  <text x="520" y="154" text-anchor="middle" font-size="10.5" fill="#eafff0">순서·필터·페인트 속성</text>
  <text x="520" y="170" text-anchor="middle" font-size="10.5" fill="#eafff0">을 지오메트리에 매핑</text>

  <path d="M600 135 L635 135" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: WebGL render -->
  <rect x="640" y="90" width="150" height="90" rx="8" fill="#c9821a" stroke="#8f5c10" stroke-width="1.5"/>
  <text x="715" y="118" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">④ WebGL 렌더링</text>
  <text x="715" y="138" text-anchor="middle" font-size="10.5" fill="#fff2df">정점 데이터를 GPU에</text>
  <text x="715" y="154" text-anchor="middle" font-size="10.5" fill="#fff2df">전달해 래스터화 후</text>
  <text x="715" y="170" text-anchor="middle" font-size="10.5" fill="#fff2df">화면에 합성</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <!-- Divider -->
  <line x1="40" y1="215" x2="760" y2="215" stroke="#ddd" stroke-width="1"/>

  <!-- Lineage comparison -->
  <text x="400" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">계보: 공통 뿌리에서 갈라진 두 프로젝트</text>

  <rect x="90" y="265" width="260" height="60" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
  <text x="220" y="288" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">Mapbox GL JS v1 (BSD, 오픈소스)</text>
  <text x="220" y="306" text-anchor="middle" font-size="10.5" fill="#555">마지막 오픈소스 커밋 지점</text>

  <path d="M220 325 L220 350" stroke="#999" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="220" y1="350" x2="130" y2="375" stroke="#999" stroke-width="1.5"/>
  <line x1="220" y1="350" x2="580" y2="375" stroke="#999" stroke-width="1.5"/>

  <rect x="30" y="375" width="220" height="60" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="140" y="398" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">MapLibre GL (BSD, 오픈소스)</text>
  <text x="140" y="416" text-anchor="middle" font-size="10.5" fill="#eafff0">커뮤니티 포크 · 독립 로드맵</text>

  <rect x="460" y="375" width="240" height="60" rx="6" fill="#a33a3a" stroke="#7a2626" stroke-width="1.5"/>
  <text x="580" y="398" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">Mapbox GL JS v2+ (독점 라이선스)</text>
  <text x="580" y="416" text-anchor="middle" font-size="10.5" fill="#fde8e8">Mapbox 계정·토큰 필요</text>
</svg>
