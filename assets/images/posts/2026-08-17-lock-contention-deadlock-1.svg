<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">데드락 발생 과정 — 두 트랜잭션의 순환 대기(wait-for cycle)</text>

  <!-- time axis -->
  <line x1="60" y1="230" x2="740" y2="230" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="248" font-size="12" fill="#666">시간 →</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- T1 lane -->
  <text x="60" y="90" font-size="13" font-weight="bold" fill="#0b5fa5">T1</text>
  <line x1="100" y1="100" x2="620" y2="100" stroke="#1877c9" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="6" fill="#0b5fa5"/>
  <text x="100" y="78" text-anchor="middle" font-size="11" fill="#0b5fa5">BEGIN</text>
  <rect x="140" y="120" width="160" height="32" rx="5" fill="#eaf3ff" stroke="#1877c9"/>
  <text x="220" y="141" text-anchor="middle" font-size="11.5" fill="#0b5fa5">UPDATE 행 A (락 획득)</text>
  <rect x="400" y="120" width="220" height="32" rx="5" fill="#ffe8e8" stroke="#c0392b"/>
  <text x="510" y="141" text-anchor="middle" font-size="11.5" fill="#a3281b">UPDATE 행 B → 대기(Lock)</text>

  <!-- T2 lane -->
  <text x="60" y="200" font-size="13" font-weight="bold" fill="#1f7a38">T2</text>
  <line x1="260" y1="210" x2="700" y2="210" stroke="#2fa84f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="260" cy="210" r="6" fill="#1f7a38"/>
  <text x="260" y="190" text-anchor="middle" font-size="11" fill="#1f7a38">BEGIN</text>
  <rect x="300" y="120" width="160" height="0" opacity="0"/>
  <rect x="300" y="120" width="0" height="0"/>
  <rect x="300" y="120" width="0" height="0" opacity="0"/>
  <rect x="300" y="120" width="0" height="0"/>
  <rect x="300" y="164" width="160" height="32" rx="5" fill="#eafff0" stroke="#2fa84f"/>
  <text x="380" y="185" text-anchor="middle" font-size="11.5" fill="#1f7a38">UPDATE 행 B (락 획득)</text>
  <rect x="480" y="164" width="220" height="32" rx="5" fill="#ffe8e8" stroke="#c0392b"/>
  <text x="590" y="185" text-anchor="middle" font-size="11.5" fill="#a3281b">UPDATE 행 A → 대기(Lock)</text>

  <!-- wait-for graph -->
  <text x="400" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Wait-For 그래프 (순환 = 데드락)</text>

  <circle cx="280" cy="350" r="34" fill="#eaf3ff" stroke="#0b5fa5" stroke-width="2"/>
  <text x="280" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b5fa5">T1</text>

  <circle cx="520" cy="350" r="34" fill="#eafff0" stroke="#1f7a38" stroke-width="2"/>
  <text x="520" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f7a38">T2</text>

  <path d="M 314 338 C 380 310, 420 310, 486 338" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="400" y="308" text-anchor="middle" font-size="11.5" fill="#a3281b">대기: 행 B (T2가 보유)</text>

  <path d="M 486 362 C 420 392, 380 392, 314 362" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="400" y="410" text-anchor="middle" font-size="11.5" fill="#a3281b">대기: 행 A (T1이 보유)</text>

  <rect x="600" y="325" width="150" height="50" rx="6" fill="#fff7f0" stroke="#ff8a3d"/>
  <text x="675" y="345" text-anchor="middle" font-size="11" fill="#a3550f" font-weight="bold">순환 대기 감지</text>
  <text x="675" y="362" text-anchor="middle" font-size="10.3" fill="#a3550f">victim 하나 강제 롤백</text>
</svg>
