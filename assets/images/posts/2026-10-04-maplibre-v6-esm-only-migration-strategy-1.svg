<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">MapLibre v6 — 두 로딩 경로가 ESM 한 곳으로 수렴</text>

  <!-- Bundler path -->
  <rect x="60" y="56" width="280" height="44" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="200" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#312e81">번들러 경로 (Webpack/Vite/esbuild)</text>

  <!-- CDN path -->
  <rect x="460" y="56" width="280" height="44" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="600" y="83" text-anchor="middle" font-size="12" font-weight="bold" fill="#713f12">CDN 스크립트 태그 경로</text>

  <line x1="200" y1="100" x2="200" y2="130" stroke="#4f46e5" stroke-width="2" marker-end="url(#arrowi)"/>
  <line x1="600" y1="100" x2="600" y2="130" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrowy)"/>

  <rect x="60" y="130" width="280" height="50" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="200" y="152" text-anchor="middle" font-size="11" fill="#374151">default → namespace import 전환</text>
  <text x="200" y="168" text-anchor="middle" font-size="10" fill="#374151">(named import는 영향 적음)</text>

  <rect x="460" y="130" width="280" height="50" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="600" y="152" text-anchor="middle" font-size="11" fill="#374151">&lt;script&gt; → type="module" 전환</text>
  <text x="600" y="168" text-anchor="middle" font-size="10" fill="#374151">(로딩 순서 리그레션 테스트 필요)</text>

  <line x1="200" y1="180" x2="350" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowg)"/>
  <line x1="600" y1="180" x2="450" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowg)"/>

  <!-- ESM only bundle -->
  <rect x="260" y="210" width="280" height="54" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="400" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#064e3b">maplibre-gl.mjs (ESM 전용)</text>
  <text x="400" y="248" text-anchor="middle" font-size="10" fill="#064e3b">UMD·CSP 전용 빌드 제거됨</text>

  <line x1="400" y1="264" x2="400" y2="290" stroke="#059669" stroke-width="2" marker-end="url(#arrowgr)"/>

  <!-- Worker loading -->
  <rect x="260" y="290" width="280" height="48" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="400" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">maplibre-gl-worker.mjs</text>
  <text x="400" y="326" text-anchor="middle" font-size="10" fill="#7c2d12">실제 URL 로드 — worker-src blob: 불필요</text>

  <line x1="400" y1="338" x2="400" y2="364" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowr)"/>

  <!-- WebGL2 -->
  <rect x="260" y="364" width="280" height="50" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="400" y="386" text-anchor="middle" font-size="11" font-weight="bold" fill="#831843">WebGL2 렌더링 컨텍스트 (필수)</text>
  <text x="400" y="402" text-anchor="middle" font-size="10" fill="#831843">WebGL1 지원 완전 제거 — 구형 기기 확인 필요</text>

  <defs>
    <marker id="arrowg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowi" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrowy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ca8a04"/>
    </marker>
    <marker id="arrowgr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <marker id="arrowr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
  </defs>
</svg>
