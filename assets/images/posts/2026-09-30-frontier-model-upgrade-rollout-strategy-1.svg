<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>

  <rect x="330" y="20" width="140" height="50" rx="8" fill="#334155"/>
  <text x="400" y="50" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">사용자 요청</text>

  <line x1="400" y1="70" x2="400" y2="105" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="270" y="110" width="260" height="50" rx="8" fill="#0ea5e9"/>
  <text x="400" y="140" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">모델 라우팅 게이트웨이</text>

  <line x1="330" y1="160" x2="180" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="160" x2="620" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowred)"/>

  <rect x="60" y="205" width="240" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="180" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#3730a3">기존 pinned 버전</text>
  <text x="180" y="246" text-anchor="middle" font-size="11" fill="#333">트래픽 대다수 (예: 95%)</text>

  <rect x="500" y="205" width="240" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="620" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">신규 모델 카나리</text>
  <text x="620" y="246" text-anchor="middle" font-size="11" fill="#333">소규모 트래픽 (예: 5%)</text>

  <line x1="180" y1="265" x2="180" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="620" y1="265" x2="620" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="300" x2="620" y2="300" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="300" x2="400" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="335" width="340" height="65" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="400" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">Eval 지표 비교</text>
  <text x="400" y="377" text-anchor="middle" font-size="10" fill="#78350f">골든셋 정확도 · 툴콜 패턴 · 지연시간 · 비용</text>
  <text x="400" y="393" text-anchor="middle" font-size="10" fill="#78350f">기준 충족 → 비중 확대 / 미달 → 즉시 롤백</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
