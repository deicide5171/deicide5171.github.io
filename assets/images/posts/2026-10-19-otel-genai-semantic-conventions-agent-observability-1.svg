<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">gen_ai 스팬이 흐르는 경로</text>

  <rect x="20" y="70" width="170" height="90" rx="8" fill="#eef1fb" stroke="#4a5fc1" stroke-width="1.5"/>
  <text x="105" y="105" text-anchor="middle" font-size="13" fill="#2a3680">오케스트레이터</text>
  <text x="105" y="125" text-anchor="middle" font-size="12" fill="#2a3680">invoke_agent 스팬</text>

  <rect x="220" y="70" width="170" height="90" rx="8" fill="#eef1fb" stroke="#4a5fc1" stroke-width="1.5"/>
  <text x="305" y="105" text-anchor="middle" font-size="13" fill="#2a3680">서브에이전트 ·</text>
  <text x="305" y="123" text-anchor="middle" font-size="12" fill="#2a3680">MCP 도구 호출</text>
  <text x="305" y="141" text-anchor="middle" font-size="12" fill="#2a3680">chat / execute_tool 스팬</text>

  <rect x="420" y="70" width="170" height="90" rx="8" fill="#fdf2e9" stroke="#d98a3d" stroke-width="1.5"/>
  <text x="505" y="105" text-anchor="middle" font-size="13" fill="#7a4a12">OTel SDK</text>
  <text x="505" y="125" text-anchor="middle" font-size="12" fill="#7a4a12">gen_ai.* 속성</text>
  <text x="505" y="143" text-anchor="middle" font-size="12" fill="#7a4a12">traceparent 전파</text>

  <rect x="620" y="70" width="160" height="90" rx="8" fill="#eafaf0" stroke="#2f9e5c" stroke-width="1.5"/>
  <text x="700" y="105" text-anchor="middle" font-size="13" fill="#14532d">Collector</text>
  <text x="700" y="123" text-anchor="middle" font-size="12" fill="#14532d">→ Datadog</text>
  <text x="700" y="141" text-anchor="middle" font-size="12" fill="#14532d">→ Grafana / Jaeger</text>

  <path d="M190,115 L220,115" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M390,115 L420,115" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M590,115 L620,115" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="60" y="230" width="680" height="170" rx="8" fill="#f6f6f6" stroke="#bbbbbb"/>
  <text x="400" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">하나의 트레이스 트리로 펼쳐지는 실행</text>
  <text x="90" y="290" font-size="13" fill="#333333">invoke_agent (전체 실행)</text>
  <text x="110" y="315" font-size="13" fill="#555555">├─ chat claude-sonnet-5 (모델 호출, 토큰 사용량)</text>
  <text x="110" y="340" font-size="13" fill="#555555">├─ execute_tool search_store (도구 호출, 인자·결과)</text>
  <text x="110" y="365" font-size="13" fill="#555555">└─ invoke_agent (서브에이전트, 별도 trace 구간과 연결)</text>
</svg>
