<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">AI 시대 주니어 온보딩 파이프라인 — 설명 가능성 게이트의 위치</text>

  <rect x="30" y="60" width="150" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="105" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">과제 배정</text>
  <text x="105" y="98" text-anchor="middle" font-size="8" fill="#991b1b">난이도·범위 결정</text>

  <line x1="180" y1="88" x2="225" y2="88" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowI)"/>

  <rect x="225" y="60" width="160" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="305" y="82" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">AI 보조 작성</text>
  <text x="305" y="98" text-anchor="middle" font-size="8" fill="#991b1b">코드 생성 도구로 사용</text>

  <line x1="305" y1="116" x2="305" y2="140" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowI)"/>

  <rect x="160" y="140" width="290" height="100" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="305" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">코드 리뷰 — 이중 게이트</text>
  <text x="305" y="182" text-anchor="middle" font-size="8.5" fill="#3730a3">① 정합성 검증 (기존)</text>
  <text x="305" y="198" text-anchor="middle" font-size="8.5" fill="#3730a3">② 설명 가능성 검증 (신설)</text>
  <text x="305" y="216" text-anchor="middle" font-size="8" fill="#3730a3">"왜 이렇게 짰는지 즉답 가능한가"</text>

  <line x1="450" y1="190" x2="495" y2="190" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowI)"/>

  <rect x="495" y="150" width="170" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="580" y="172" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#374151">멘토 피드백 루프</text>
  <text x="580" y="190" text-anchor="middle" font-size="7.5" fill="#4b5563">이해도 낮으면</text>
  <text x="580" y="203" text-anchor="middle" font-size="7.5" fill="#4b5563">처벌 아닌 함께 보기</text>
  <text x="580" y="216" text-anchor="middle" font-size="7.5" fill="#4b5563">(시니어 시간 투입)</text>

  <line x1="305" y1="240" x2="305" y2="264" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowI)"/>

  <rect x="160" y="264" width="290" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="305" y="286" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">역량 지표 축적</text>
  <text x="305" y="302" text-anchor="middle" font-size="8" fill="#065f46">이해도·설명 게이트 통과율·독립 설계 사례</text>

  <path d="M 160 290 C 60 290 60 110 95 95" fill="none" stroke="#059669" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrowJ)"/>
  <text x="50" y="200" text-anchor="middle" font-size="8" fill="#065f46" transform="rotate(-90 50 200)">다음 과제 난이도 조정에 반영</text>

  <rect x="580" y="264" width="190" height="130" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="675" y="286" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7c2d12">게이트가 없으면</text>
  <text x="675" y="306" text-anchor="middle" font-size="7.5" fill="#7c2d12">PR은 통과되지만</text>
  <text x="675" y="320" text-anchor="middle" font-size="7.5" fill="#7c2d12">이해도 측정 지점이</text>
  <text x="675" y="334" text-anchor="middle" font-size="7.5" fill="#7c2d12">사라짐</text>
  <text x="675" y="354" text-anchor="middle" font-size="7.5" fill="#7c2d12">몇 년 뒤 "왜 아직</text>
  <text x="675" y="368" text-anchor="middle" font-size="7.5" fill="#7c2d12">혼자 설계를 못 하는가"</text>
  <text x="675" y="382" text-anchor="middle" font-size="7.5" font-weight="bold" fill="#9a3412">질문에 데이터가 없음</text>

  <defs>
    <marker id="arrowI" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowJ" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>
</svg>
