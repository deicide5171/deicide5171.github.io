<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">MapLibre 심볼 충돌 감지 — 그리드 인덱스로 라벨 겹침 판정</text>

  <!-- Left: naive overlap problem -->
  <g>
    <rect x="40" y="70" width="320" height="180" rx="8" fill="#fdf0f0" stroke="#c94a4a" stroke-width="1.5"/>
    <text x="200" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#a33">문제: 모든 라벨을 그대로 그리면</text>
    <circle cx="110" cy="130" r="4" fill="#555"/>
    <rect x="120" y="118" width="90" height="22" fill="#ffffff" stroke="#999" stroke-width="1"/>
    <text x="165" y="133" text-anchor="middle" font-size="11" fill="#333">서울특별시청</text>

    <circle cx="150" cy="150" r="4" fill="#555"/>
    <rect x="160" y="138" width="80" height="22" fill="#ffffff" stroke="#c94a4a" stroke-width="1.5"/>
    <text x="200" y="153" text-anchor="middle" font-size="11" fill="#a33">중구청</text>

    <circle cx="190" cy="145" r="4" fill="#555"/>
    <rect x="200" y="160" width="90" height="22" fill="#ffffff" stroke="#c94a4a" stroke-width="1.5"/>
    <text x="245" y="175" text-anchor="middle" font-size="11" fill="#a33">명동성당</text>

    <text x="200" y="230" text-anchor="middle" font-size="12" fill="#a33">라벨이 서로 겹쳐 읽을 수 없음</text>
  </g>

  <line x1="370" y1="160" x2="420" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="395" y="150" text-anchor="middle" font-size="11" fill="#555">충돌 감지</text>

  <!-- Right: grid-based collision detection -->
  <g>
    <rect x="440" y="70" width="320" height="180" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="1.5"/>
    <text x="600" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d5c3f">해결: 그리드 인덱스로 우선순위 검사</text>

    <!-- grid lines -->
    <g stroke="#bcdfcb" stroke-width="0.7">
      <line x1="440" y1="100" x2="760" y2="100"/>
      <line x1="440" y1="140" x2="760" y2="140"/>
      <line x1="440" y1="180" x2="760" y2="180"/>
      <line x1="440" y1="220" x2="760" y2="220"/>
      <line x1="500" y1="80" x2="500" y2="245"/>
      <line x1="560" y1="80" x2="560" y2="245"/>
      <line x1="620" y1="80" x2="620" y2="245"/>
      <line x1="680" y1="80" x2="680" y2="245"/>
      <line x1="720" y1="80" x2="720" y2="245"/>
    </g>

    <circle cx="510" cy="130" r="4" fill="#333"/>
    <rect x="520" y="118" width="90" height="22" fill="#ffffff" stroke="#1d5c3f" stroke-width="1.5"/>
    <text x="565" y="133" text-anchor="middle" font-size="11" fill="#1d5c3f">서울특별시청</text>
    <text x="565" y="150" text-anchor="middle" font-size="9" fill="#3c7a5c">(우선순위 높음: 유지)</text>

    <circle cx="550" cy="150" r="4" fill="#999"/>
    <text x="605" y="165" text-anchor="middle" font-size="10" fill="#999" text-decoration="line-through">중구청</text>
    <text x="605" y="178" text-anchor="middle" font-size="9" fill="#999">(겹침 감지: 숨김)</text>

    <circle cx="590" cy="200" r="4" fill="#333"/>
    <rect x="600" y="188" width="90" height="22" fill="#ffffff" stroke="#1d5c3f" stroke-width="1.5"/>
    <text x="645" y="203" text-anchor="middle" font-size="11" fill="#1d5c3f">명동성당</text>
    <text x="645" y="222" text-anchor="middle" font-size="9" fill="#3c7a5c">(빈 셀 확인 후 배치)</text>
  </g>

  <!-- bottom explanation -->
  <rect x="40" y="280" width="720" height="150" rx="8" fill="#eef4fb" stroke="#4a7fb5" stroke-width="1.5"/>
  <text x="400" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4f73">프레임마다 반복되는 4단계 파이프라인</text>
  <text x="400" y="332" text-anchor="middle" font-size="13" fill="#33587a">1. 심볼을 배치 우선순위(줌 레벨, 스타일의 sort-key, 소스 등장 순서)로 정렬</text>
  <text x="400" y="356" text-anchor="middle" font-size="13" fill="#33587a">2. 화면을 격자(grid)로 나눠 각 심볼의 바운딩 박스가 걸치는 셀을 계산 (공간 인덱스)</text>
  <text x="400" y="380" text-anchor="middle" font-size="13" fill="#33587a">3. 우선순위 순서대로, 이미 배치된 심볼과 같은 셀에서 겹치면 그 심볼은 숨김 처리</text>
  <text x="400" y="404" text-anchor="middle" font-size="13" fill="#33587a">4. 카메라가 움직일 때마다 이 계산을 반복하되, 텍스트가 갑자기 나타나거나 사라지지 않도록 페이드 인/아웃으로 부드럽게 전환</text>
</svg>
