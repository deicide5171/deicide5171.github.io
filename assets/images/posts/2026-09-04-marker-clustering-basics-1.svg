<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">마커 클러스터링 동작</text>

  <!-- Left: zoomed out with clusters -->
  <rect x="40" y="70" width="330" height="300" rx="8" fill="#eaf6ff" stroke="#4a90d9" stroke-width="2"/>
  <text x="205" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a4a7a">줌아웃 (묶음)</text>
  <circle cx="130" cy="180" r="30" fill="#4a90d9" opacity="0.85"/>
  <text x="130" y="186" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#fff">127</text>
  <circle cx="270" cy="230" r="24" fill="#4a90d9" opacity="0.85"/>
  <text x="270" y="236" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#fff">58</text>
  <circle cx="210" cy="310" r="18" fill="#4a90d9" opacity="0.85"/>
  <text x="210" y="316" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">12</text>

  <!-- arrow -->
  <line x1="380" y1="220" x2="425" y2="220" stroke="#e08a2b" stroke-width="2.5" marker-end="url(#m)"/>
  <text x="402" y="208" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a4a10">확대</text>

  <!-- Right: zoomed in with individual markers -->
  <rect x="430" y="70" width="330" height="300" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="595" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0a5a30">확대 (개별 마커)</text>
  <g fill="#e05252">
    <circle cx="500" cy="160" r="6"/>
    <circle cx="540" cy="190" r="6"/>
    <circle cx="580" cy="150" r="6"/>
    <circle cx="620" cy="200" r="6"/>
    <circle cx="560" cy="240" r="6"/>
    <circle cx="510" cy="260" r="6"/>
    <circle cx="640" cy="270" r="6"/>
    <circle cx="600" cy="310" r="6"/>
    <circle cx="530" cy="320" r="6"/>
  </g>

  <text x="400" y="410" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">줌 레벨에 따라 묶음이 나뉘고 펼쳐지며 화면에 그리는 요소 수를 줄인다</text>

  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e08a2b"/>
    </marker>
  </defs>
</svg>
