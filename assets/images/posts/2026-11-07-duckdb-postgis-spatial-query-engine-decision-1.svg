<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- Data sources -->
  <rect x="20" y="150" width="150" height="150" rx="10" fill="#f2f2f2" stroke="#888" stroke-width="2"/>
  <text x="95" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">원본 데이터</text>
  <text x="95" y="202" text-anchor="middle" font-size="12" fill="#444">Postgres 테이블</text>
  <text x="95" y="222" text-anchor="middle" font-size="12" fill="#444">(쓰기·갱신 발생)</text>
  <text x="95" y="252" text-anchor="middle" font-size="12" fill="#444">GeoParquet 파일</text>
  <text x="95" y="272" text-anchor="middle" font-size="12" fill="#444">(S3 / 분석 레이크)</text>

  <!-- PostGIS box -->
  <rect x="220" y="70" width="190" height="110" rx="10" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="315" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3b6e">PostGIS 3.7</text>
  <text x="315" y="118" text-anchor="middle" font-size="11" fill="#333">상주 서버 · GiST 인덱스</text>
  <text x="315" y="136" text-anchor="middle" font-size="11" fill="#333">트랜잭션 쓰기/갱신</text>
  <text x="315" y="154" text-anchor="middle" font-size="11" fill="#333">포인트 조회에 강함</text>

  <!-- DuckDB box -->
  <rect x="220" y="260" width="190" height="110" rx="10" fill="#fff3e0" stroke="#d98c00" stroke-width="2"/>
  <text x="315" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5600">DuckDB 2.0</text>
  <text x="315" y="308" text-anchor="middle" font-size="11" fill="#333">임베디드 · 컬럼형 스캔</text>
  <text x="315" y="326" text-anchor="middle" font-size="11" fill="#333">ST_AsMVT로 타일 직접 생성</text>
  <text x="315" y="344" text-anchor="middle" font-size="11" fill="#333">대규모 집계·스캔에 강함</text>

  <!-- Tile server -->
  <rect x="470" y="150" width="160" height="150" rx="10" fill="#eafaf1" stroke="#1f9d55" stroke-width="2"/>
  <text x="550" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f5c31">타일 서버</text>
  <text x="550" y="196" text-anchor="middle" font-size="11" fill="#333">Martin / GeoServer</text>
  <rect x="486" y="208" width="128" height="34" rx="6" fill="#fff" stroke="#1f9d55"/>
  <text x="550" y="229" text-anchor="middle" font-size="10" fill="#0f5c31">베이스: 정적 타일</text>
  <rect x="486" y="250" width="128" height="34" rx="6" fill="#fff" stroke="#d98c00"/>
  <text x="550" y="271" text-anchor="middle" font-size="10" fill="#8a5600">오버레이: 동적 생성</text>

  <!-- Client -->
  <rect x="670" y="195" width="110" height="60" rx="10" fill="#f2f2f2" stroke="#888" stroke-width="2"/>
  <text x="725" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">웹 지도</text>
  <text x="725" y="240" text-anchor="middle" font-size="11" fill="#444">클라이언트</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  <line x1="170" y1="190" x2="220" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="170" y1="260" x2="220" y2="310" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="410" y1="130" x2="486" y2="215" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="410" y1="310" x2="486" y2="260" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="630" y1="225" x2="670" y2="225" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Bottom note -->
  <rect x="60" y="390" width="680" height="45" rx="8" fill="#f7f7f7" stroke="#999"/>
  <text x="400" y="417" text-anchor="middle" font-size="12" fill="#333">베이스 레이어는 미리 구워둔 정적 타일, 자주 바뀌는 오버레이만 질의 엔진에서 즉석 생성</text>
</svg>
