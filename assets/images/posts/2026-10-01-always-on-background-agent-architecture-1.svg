<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>

  <rect x="20" y="30" width="150" height="55" rx="8" fill="#0ea5e9"/>
  <text x="95" y="53" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">사용자 요청</text>
  <text x="95" y="71" text-anchor="middle" fill="#e0f2fe" font-size="10">메신저 / 앱</text>

  <line x1="170" y1="57" x2="225" y2="57" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="225" y="30" width="140" height="55" rx="8" fill="#64748b"/>
  <text x="295" y="53" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">작업 큐</text>
  <text x="295" y="71" text-anchor="middle" fill="#e2e8f0" font-size="10">비동기 적재</text>

  <line x1="295" y1="85" x2="295" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="150" y="125" width="290" height="100" rx="8" fill="#7c3aed"/>
  <text x="295" y="150" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">가상 컴퓨터 샌드박스</text>
  <text x="295" y="170" text-anchor="middle" fill="#ede9fe" font-size="11">조사 · 코드 실행 · 파일 조작</text>
  <text x="295" y="188" text-anchor="middle" fill="#ede9fe" font-size="10">컨테이너 / 마이크로 VM 격리</text>
  <text x="295" y="206" text-anchor="middle" fill="#ddd6fe" font-size="10">진행 상태 체크포인트 저장</text>

  <line x1="440" y1="175" x2="495" y2="175" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="495" y="130" width="180" height="90" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="585" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">민감 행동 승인 게이트</text>
  <text x="585" y="174" text-anchor="middle" font-size="10" fill="#78350f">결제 · 외부 전송 · 삭제</text>
  <text x="585" y="190" text-anchor="middle" font-size="10" fill="#78350f">감지 시 실행 중단</text>
  <text x="585" y="206" text-anchor="middle" font-size="10" fill="#78350f">사람 확인 대기</text>

  <line x1="585" y1="220" x2="585" y2="250" stroke="#333" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="635" y="238" text-anchor="middle" font-size="9" fill="#78350f">승인/거부</text>
  <line x1="585" y1="250" x2="440" y2="200" stroke="#333" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arrow)"/>

  <line x1="295" y1="225" x2="295" y2="265" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="150" y="270" width="290" height="55" rx="8" fill="#dc2626"/>
  <text x="295" y="293" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">완료 알림</text>
  <text x="295" y="311" text-anchor="middle" fill="#fee2e2" font-size="10">요청과 같은 채널로 결과 전달</text>

  <line x1="295" y1="325" x2="295" y2="360" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="365" width="350" height="60" rx="8" fill="#059669"/>
  <text x="295" y="388" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">선호 메모리 저장소</text>
  <text x="295" y="406" text-anchor="middle" fill="#d1fae5" font-size="10">보고서 길이·어조 등 선택 누적 → 다음 작업 컨텍스트에 반영</text>

  <path d="M 295 365 Q 60 260 150 150" stroke="#059669" stroke-width="1.5" fill="none" stroke-dasharray="3,3" marker-end="url(#arrowg)"/>
  <text x="60" y="260" text-anchor="middle" font-size="9" fill="#059669" transform="rotate(-70 60 260)">선호 반영 되먹임</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrowg" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#059669"/>
    </marker>
  </defs>
</svg>
