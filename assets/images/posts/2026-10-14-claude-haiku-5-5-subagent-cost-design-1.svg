<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrowH" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">멀티에이전트 비용 분해 — 오케스트레이터가 대부분을 먹는 구조</text>

  <rect x="310" y="50" width="180" height="56" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="400" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">오케스트레이터 (Opus 5.5)</text>
  <text x="400" y="90" text-anchor="middle" font-size="9" fill="#3730a3">작업 분배 + 결과 통합</text>

  <line x1="340" y1="106" x2="150" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <line x1="380" y1="106" x2="320" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <line x1="420" y1="106" x2="480" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <line x1="460" y1="106" x2="650" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowH)"/>

  <rect x="80" y="150" width="140" height="46" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="150" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#064e3b">Haiku 5.5</text>
  <text x="150" y="184" text-anchor="middle" font-size="8" fill="#065f46">서브에이전트 1</text>

  <rect x="250" y="150" width="140" height="46" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="320" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#064e3b">Haiku 5.5</text>
  <text x="320" y="184" text-anchor="middle" font-size="8" fill="#065f46">서브에이전트 2</text>

  <rect x="410" y="150" width="140" height="46" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="480" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#064e3b">Haiku 5.5</text>
  <text x="480" y="184" text-anchor="middle" font-size="8" fill="#065f46">서브에이전트 3</text>

  <rect x="580" y="150" width="140" height="46" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="650" y="170" text-anchor="middle" font-size="9" font-weight="bold" fill="#064e3b">Haiku 5.5</text>
  <text x="650" y="184" text-anchor="middle" font-size="8" fill="#065f46">서브에이전트 N</text>

  <line x1="150" y1="196" x2="370" y2="240" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowH)"/>
  <line x1="320" y1="196" x2="385" y2="240" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowH)"/>
  <line x1="480" y1="196" x2="415" y2="240" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowH)"/>
  <line x1="650" y1="196" x2="430" y2="240" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrowH)"/>
  <text x="400" y="220" text-anchor="middle" font-size="8" fill="#4b5563">각 결과를 오케스트레이터 컨텍스트로 반환</text>

  <rect x="260" y="240" width="280" height="46" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="400" y="260" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7c2d12">오케스트레이터가 N개 결과를 재인용·통합</text>
  <text x="400" y="274" text-anchor="middle" font-size="8" fill="#9a3412">(이 단계가 비용의 대부분을 차지)</text>

  <line x1="400" y1="286" x2="400" y2="316" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowH)"/>

  <rect x="150" y="316" width="500" height="92" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.8"/>
  <text x="400" y="338" text-anchor="middle" font-size="10" font-weight="bold" fill="#581c87">청구액 구성 (예시 — 서브에이전트 20개 팬아웃)</text>
  <rect x="180" y="350" width="440" height="18" fill="#f3e8ff"/>
  <rect x="180" y="350" width="31" height="18" fill="#9333ea"/>
  <text x="400" y="364" text-anchor="middle" font-size="8.5" fill="#581c87">Haiku 5.5 서브에이전트 전체 ≈ 7%</text>
  <rect x="180" y="378" width="440" height="18" fill="#fef3c7"/>
  <rect x="180" y="378" width="409" height="18" fill="#f59e0b"/>
  <text x="400" y="392" text-anchor="middle" font-size="8.5" fill="#78350f">Opus 5.5 오케스트레이터(분배+통합) ≈ 93%</text>

  <text x="400" y="430" text-anchor="middle" font-size="9" fill="#4b5563">모델 단가를 낮춰도, 오케스트레이터가 무엇을 반복해서 읽는지를 줄이지 않으면 청구액은 그대로다</text>
</svg>
