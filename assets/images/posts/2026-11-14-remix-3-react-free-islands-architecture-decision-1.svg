<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">하이드레이션 전체 vs 아일랜드 선택적 번들링</text>

  <!-- Traditional React -->
  <text x="200" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#4f46e5">전통적 React 풀스택</text>
  <rect x="50" y="70" width="300" height="150" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="70" y="90" width="260" height="22" rx="4" fill="#c7d2fe"/>
  <text x="200" y="106" text-anchor="middle" font-size="10" fill="#1e1b4b">정적 헤더 (React 런타임 포함)</text>
  <rect x="70" y="120" width="260" height="22" rx="4" fill="#c7d2fe"/>
  <text x="200" y="136" text-anchor="middle" font-size="10" fill="#1e1b4b">정적 본문 (React 런타임 포함)</text>
  <rect x="70" y="150" width="260" height="22" rx="4" fill="#a5b4fc"/>
  <text x="200" y="166" text-anchor="middle" font-size="10" fill="#1e1b4b">실시간 차트 (상호작용)</text>
  <rect x="70" y="180" width="260" height="22" rx="4" fill="#c7d2fe"/>
  <text x="200" y="196" text-anchor="middle" font-size="10" fill="#1e1b4b">정적 푸터 (React 런타임 포함)</text>
  <text x="200" y="240" text-anchor="middle" font-size="11" fill="#b91c1c" font-weight="bold">전체 페이지에 React 런타임 하이드레이션</text>

  <!-- Remix 3 -->
  <text x="600" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#0891b2">Remix 3 (아일랜드 모델)</text>
  <rect x="450" y="70" width="300" height="150" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="470" y="90" width="260" height="22" rx="4" fill="#f1f5f9"/>
  <text x="600" y="106" text-anchor="middle" font-size="10" fill="#334155">정적 헤더 (HTML만, JS 없음)</text>
  <rect x="470" y="120" width="260" height="22" rx="4" fill="#f1f5f9"/>
  <text x="600" y="136" text-anchor="middle" font-size="10" fill="#334155">정적 본문 (HTML만, JS 없음)</text>
  <rect x="470" y="150" width="260" height="22" rx="4" fill="#67e8f9" stroke="#0891b2"/>
  <text x="600" y="166" text-anchor="middle" font-size="10" fill="#164e63" font-weight="bold">실시간 차트 ← clientEntry</text>
  <rect x="470" y="180" width="260" height="22" rx="4" fill="#f1f5f9"/>
  <text x="600" y="196" text-anchor="middle" font-size="10" fill="#334155">정적 푸터 (HTML만, JS 없음)</text>
  <text x="600" y="240" text-anchor="middle" font-size="11" fill="#0e7490" font-weight="bold">clientEntry 컴포넌트만 JS 번들에 포함</text>

  <!-- shared base -->
  <rect x="150" y="290" width="500" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="400" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">공통 서버 레이어 — Fetch API 기반 요청 → 라우트 매칭 → 핸들러 → 응답</text>
  <text x="400" y="338" text-anchor="middle" font-size="11" fill="#475569">같은 라우팅 로직이 서버·클라이언트에서 동일하게 실행됨</text>

  <line x1="200" y1="220" x2="320" y2="290" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="600" y1="220" x2="480" y2="290" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="400" y="400" text-anchor="middle" font-size="12" fill="#475569">판단 기준: 페이지에서 상호작용이 차지하는 비율</text>
  <text x="400" y="420" text-anchor="middle" font-size="12" fill="#475569">높으면 React 계열, 낮으면 아일랜드 모델이 유리</text>
</svg>
