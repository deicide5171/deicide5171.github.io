<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">지리 좌표계 vs 투영 좌표계</text>

  <!-- Geographic (globe) -->
  <rect x="40" y="70" width="330" height="220" rx="8" fill="#eaf6ff" stroke="#4a90d9" stroke-width="2"/>
  <text x="205" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a4a7a">지리 좌표계 (WGS84 / EPSG:4326)</text>
  <circle cx="205" cy="190" r="60" fill="#cfe4f5" stroke="#4a90d9" stroke-width="2"/>
  <ellipse cx="205" cy="190" rx="60" ry="22" fill="none" stroke="#4a90d9" stroke-width="1"/>
  <line x1="145" y1="190" x2="265" y2="190" stroke="#4a90d9" stroke-width="1"/>
  <line x1="205" y1="130" x2="205" y2="250" stroke="#4a90d9" stroke-width="1"/>
  <circle cx="225" cy="175" r="4" fill="#e05252"/>
  <text x="205" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">위도·경도(도 단위)</text>

  <!-- Projected (flat) -->
  <rect x="430" y="70" width="330" height="220" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="595" y="100" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0a5a30">투영 좌표계 (EPSG:3857/5179)</text>
  <rect x="500" y="135" width="190" height="110" fill="#dff0e8" stroke="#3a8a5a" stroke-width="2"/>
  <line x1="500" y1="135" x2="500" y2="245" stroke="#3a8a5a" stroke-width="1"/>
  <line x1="500" y1="245" x2="690" y2="245" stroke="#3a8a5a" stroke-width="1"/>
  <circle cx="600" cy="180" r="4" fill="#e05252"/>
  <text x="595" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">X·Y(미터 단위)</text>

  <!-- arrow -->
  <line x1="375" y1="180" x2="425" y2="180" stroke="#e08a2b" stroke-width="2.5" marker-end="url(#c)"/>
  <text x="400" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a4a10">투영</text>

  <!-- bottom note -->
  <rect x="90" y="310" width="620" height="100" rx="8" fill="#f7f7f7" stroke="#ccc"/>
  <text x="110" y="340" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222">EPSG 코드 = 좌표계를 식별하는 고유 번호</text>
  <text x="110" y="365" font-family="sans-serif" font-size="13" fill="#333">4326 = GPS 위경도 / 3857 = 웹 지도 / 5179 = 한국 국토지리정보원 표준</text>
  <text x="110" y="388" font-family="sans-serif" font-size="13" fill="#333">좌표계가 다르면 같은 숫자도 전혀 다른 위치 → proj4js 등으로 변환 필요</text>

  <defs>
    <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#e08a2b"/>
    </marker>
  </defs>
</svg>
