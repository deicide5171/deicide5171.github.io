<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">SKILL.md — 포맷은 공통, 실행 환경은 벤더별</text>

  <rect x="300" y="48" width="200" height="56" rx="8" fill="#eef2fb" stroke="#3b5bdb" stroke-width="2"/>
  <text x="400" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c2e6b">사내 Skill 저장소</text>
  <text x="400" y="87" text-anchor="middle" font-size="9.5" fill="#1c2e6b">SKILL.md + 참조 파일, 버전 관리</text>

  <defs>
    <marker id="m1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#555"/></marker>
  </defs>

  <line x1="340" y1="104" x2="160" y2="155" stroke="#555" stroke-width="1.8" marker-end="url(#m1)"/>
  <line x1="380" y1="104" x2="300" y2="155" stroke="#555" stroke-width="1.8" marker-end="url(#m1)"/>
  <line x1="420" y1="104" x2="500" y2="155" stroke="#555" stroke-width="1.8" marker-end="url(#m1)"/>
  <line x1="460" y1="104" x2="640" y2="155" stroke="#555" stroke-width="1.8" marker-end="url(#m1)"/>

  <rect x="80" y="158" width="160" height="62" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="160" y="180" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b5e20">Claude Code</text>
  <text x="160" y="196" text-anchor="middle" font-size="8.5" fill="#1b5e20">.claude/skills/</text>
  <text x="160" y="210" text-anchor="middle" font-size="8.5" fill="#1b5e20">자체 discovery 로직</text>

  <rect x="260" y="158" width="160" height="62" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="340" y="180" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b5e20">Codex CLI / ChatGPT</text>
  <text x="340" y="196" text-anchor="middle" font-size="8.5" fill="#1b5e20">자체 디렉터리 규칙</text>
  <text x="340" y="210" text-anchor="middle" font-size="8.5" fill="#1b5e20">OpenAI 런타임 적재</text>

  <rect x="440" y="158" width="160" height="62" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="520" y="180" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b5e20">Cursor</text>
  <text x="520" y="196" text-anchor="middle" font-size="8.5" fill="#1b5e20">.cursor/skills/</text>
  <text x="520" y="210" text-anchor="middle" font-size="8.5" fill="#1b5e20">에디터 내 로딩</text>

  <rect x="580" y="158" width="160" height="62" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="660" y="180" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b5e20">Gemini 앱</text>
  <text x="660" y="196" text-anchor="middle" font-size="8.5" fill="#1b5e20">2026-10-13 롤아웃 시작</text>
  <text x="660" y="210" text-anchor="middle" font-size="8.5" fill="#1b5e20">Gems → Skills 전환</text>

  <rect x="30" y="250" width="740" height="80" rx="8" fill="#fdf0e8" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a2d1c">포맷은 같아도 다른 것들</text>
  <text x="400" y="294" text-anchor="middle" font-size="10.5" fill="#8a2d1c">① Progressive Disclosure 트리거 시점 — 벤더마다 "언제 본문을 로드할지" 판단 로직이 다름</text>
  <text x="400" y="312" text-anchor="middle" font-size="10.5" fill="#8a2d1c">② 벤더 고유 확장 필드 — 공통 포맷에만 의존하면 벤더 특화 기능은 포기해야 함</text>

  <rect x="30" y="345" width="740" height="85" rx="8" fill="#fff7f0" stroke="#f0a04b" stroke-width="2"/>
  <text x="400" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a5a1c">설계 판단: 벤더 중립 vs 벤더 전용</text>
  <text x="400" y="391" text-anchor="middle" font-size="11" fill="#5a4632">여러 도구를 넘나드는 범용 작업 → 공통 SKILL.md로 설계, 벤더 특화 기능은 런타임별 래퍼로 분리</text>
  <text x="400" y="411" text-anchor="middle" font-size="11" fill="#5a4632">단일 벤더에 강하게 락인되어 그 벤더만의 기능이 핵심이라면 → 벤더 전용 최적화가 더 합리적</text>
</svg>
