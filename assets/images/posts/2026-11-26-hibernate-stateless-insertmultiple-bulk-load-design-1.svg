<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <rect x="20" y="190" width="140" height="70" rx="8" fill="#eef5ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="90" y="220" text-anchor="middle" font-size="14" fill="#1f3a63" font-weight="bold">대량 데이터</text>
  <text x="90" y="238" text-anchor="middle" font-size="12" fill="#1f3a63">CSV·외부 API</text>
  <text x="90" y="253" text-anchor="middle" font-size="12" fill="#1f3a63">(수십만 건)</text>

  <path d="M160 225 L205 225" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="190" width="140" height="70" rx="8" fill="#fff4e8" stroke="#d98a2e" stroke-width="1.5"/>
  <text x="280" y="217" text-anchor="middle" font-size="13" fill="#7a4c13" font-weight="bold">적재 방식</text>
  <text x="280" y="234" text-anchor="middle" font-size="12" fill="#7a4c13">선택 지점</text>
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#7a4c13">(이 글의 주제)</text>

  <path d="M350 205 L420 110" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M350 220 L420 185" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M350 250 L420 285" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M350 260 L420 365" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="425" y="75" width="190" height="60" rx="8" fill="#fdeeee" stroke="#c94f4f" stroke-width="1.5"/>
  <text x="520" y="98" text-anchor="middle" font-size="13" fill="#7a2020" font-weight="bold">JPA EntityManager</text>
  <text x="520" y="115" text-anchor="middle" font-size="11" fill="#7a2020">영속성 컨텍스트 경유</text>
  <text x="520" y="129" text-anchor="middle" font-size="10" fill="#a33">느림 · flush/clear 필요</text>

  <rect x="425" y="155" width="190" height="60" rx="8" fill="#eafaf0" stroke="#2e9e5b" stroke-width="1.5"/>
  <text x="520" y="178" text-anchor="middle" font-size="13" fill="#1d6b3e" font-weight="bold">StatelessSession</text>
  <text x="520" y="195" text-anchor="middle" font-size="11" fill="#1d6b3e">insertMultiple / updateMultiple</text>
  <text x="520" y="209" text-anchor="middle" font-size="10" fill="#2e9e5b">엔티티 지향 · 명시적 배치 (incubating)</text>

  <rect x="425" y="255" width="190" height="60" rx="8" fill="#eef5ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="520" y="278" text-anchor="middle" font-size="13" fill="#1f3a63" font-weight="bold">JdbcTemplate</text>
  <text x="520" y="295" text-anchor="middle" font-size="11" fill="#1f3a63">batchUpdate (순수 SQL)</text>
  <text x="520" y="309" text-anchor="middle" font-size="10" fill="#3b6fd6">예측 가능 · 영속성 컨텍스트 없음</text>

  <rect x="425" y="335" width="190" height="60" rx="8" fill="#f3eefc" stroke="#7b4fc9" stroke-width="1.5"/>
  <text x="520" y="358" text-anchor="middle" font-size="13" fill="#4a2d7a" font-weight="bold">Spring Batch</text>
  <text x="520" y="375" text-anchor="middle" font-size="11" fill="#4a2d7a">청크 처리 + 재시작</text>
  <text x="520" y="389" text-anchor="middle" font-size="10" fill="#7b4fc9">실패 지점부터 재개 필요할 때</text>

  <path d="M615 105 L660 225" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow2)"/>
  <path d="M615 185 L660 225" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow2)"/>
  <path d="M615 285 L660 225" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow2)"/>
  <path d="M615 365 L660 225" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow2)"/>

  <rect x="660" y="190" width="120" height="70" rx="8" fill="#f4f4f4" stroke="#555" stroke-width="1.5"/>
  <text x="720" y="220" text-anchor="middle" font-size="14" fill="#222" font-weight="bold">DB</text>
  <text x="720" y="238" text-anchor="middle" font-size="11" fill="#444">JDBC 배치</text>
  <text x="720" y="253" text-anchor="middle" font-size="11" fill="#444">INSERT/UPDATE</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#888"/></marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#bbb"/></marker>
  </defs>

  <text x="400" y="430" text-anchor="middle" font-size="12" fill="#999">같은 "대량 적재" 요구가 네 가지 다른 아키텍처 경로로 갈라지는 지점</text>
</svg>
