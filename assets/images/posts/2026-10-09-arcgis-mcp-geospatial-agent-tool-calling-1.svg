<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">공간 연산을 도구로 노출하는 두 갈래 경로</text>

  <rect x="300" y="50" width="200" height="56" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="400" y="72" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#312e81">AI 에이전트</text>
  <text x="400" y="88" text-anchor="middle" font-size="8" fill="#3730a3">자연어 → 도구 선택·호출</text>

  <line x1="400" y1="106" x2="400" y2="130" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <rect x="300" y="130" width="200" height="40" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="400" y="155" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#374151">MCP 클라이언트</text>

  <line x1="360" y1="170" x2="190" y2="210" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowM)"/>
  <line x1="440" y1="170" x2="610" y2="210" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowM)"/>

  <rect x="60" y="210" width="260" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="190" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">ArcGIS 호스팅 MCP 서버</text>
  <text x="190" y="250" text-anchor="middle" font-size="7.8" fill="#991b1b">지오코딩 · 라우팅 · 공간질의</text>
  <text x="190" y="263" text-anchor="middle" font-size="7.8" fill="#991b1b">지오인리치먼트 · 고도</text>
  <text x="190" y="278" text-anchor="middle" font-size="7.8" font-weight="bold" fill="#991b1b">전 세계 범용 기준 데이터</text>

  <rect x="480" y="210" width="260" height="76" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="610" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">자체 PostGIS 기반 MCP 서버</text>
  <text x="610" y="250" text-anchor="middle" font-size="7.8" fill="#991b1b">반경 검색 · 최근접 시설</text>
  <text x="610" y="263" text-anchor="middle" font-size="7.8" fill="#991b1b">자체 라우팅 엔진(OSRM 등)</text>
  <text x="610" y="278" text-anchor="middle" font-size="7.8" font-weight="bold" fill="#991b1b">자체 서비스 전용 데이터</text>

  <line x1="190" y1="286" x2="340" y2="330" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <line x1="610" y1="286" x2="460" y2="330" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowH)"/>

  <rect x="260" y="330" width="280" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
  <text x="400" y="352" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">에이전트 오케스트레이션 레이어</text>
  <text x="400" y="368" text-anchor="middle" font-size="8" fill="#065f46">연산 성격에 따라 결과를 합쳐 응답 생성</text>

  <line x1="400" y1="386" x2="400" y2="410" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <text x="400" y="428" text-anchor="middle" font-size="9" fill="#374151">최종 사용자에게 응답</text>

  <defs>
    <marker id="arrowM" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowH" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
  </defs>
</svg>
