<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="200" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">공용 서비스 계정 (기존)</text>
  <text x="600" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#444">IAM 역할 분리 + 비용 할당 태그</text>
  <line x1="400" y1="15" x2="400" y2="430" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Left side: shared account -->
  <rect x="50" y="55" width="80" height="40" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="90" y="80" text-anchor="middle" font-size="11" fill="#1f2d50">에이전트 A</text>
  <rect x="150" y="55" width="80" height="40" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="190" y="80" text-anchor="middle" font-size="11" fill="#1f2d50">에이전트 B</text>
  <rect x="250" y="55" width="80" height="40" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="290" y="80" text-anchor="middle" font-size="11" fill="#1f2d50">에이전트 C</text>

  <line x1="90" y1="95" x2="190" y2="150" stroke="#999" stroke-width="1.5"/>
  <line x1="190" y1="95" x2="190" y2="150" stroke="#999" stroke-width="1.5"/>
  <line x1="290" y1="95" x2="190" y2="150" stroke="#999" stroke-width="1.5"/>

  <rect x="110" y="150" width="160" height="45" rx="6" fill="#fff7e6" stroke="#d8972a" stroke-width="2"/>
  <text x="190" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#5c3d0a">공용 IAM 역할</text>
  <text x="190" y="186" text-anchor="middle" font-size="10" fill="#8a5a00">단일 식별자</text>

  <line x1="190" y1="195" x2="190" y2="240" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="110" y="240" width="160" height="45" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="190" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Bedrock 호출</text>
  <text x="190" y="276" text-anchor="middle" font-size="10" fill="#555">모델별 비용만 구분</text>

  <line x1="190" y1="285" x2="190" y2="330" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="330" width="200" height="60" rx="6" fill="#fdecec" stroke="#c23b3b" stroke-width="2"/>
  <text x="190" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a1f1f">Cost Explorer</text>
  <text x="190" y="370" text-anchor="middle" font-size="11" fill="#7a1f1f">"Bedrock 총액"만 표시</text>
  <text x="190" y="383" text-anchor="middle" font-size="10" fill="#7a1f1f">— 에이전트 구분 불가 —</text>

  <!-- Right side: per-agent -->
  <rect x="440" y="55" width="80" height="40" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="480" y="80" text-anchor="middle" font-size="11" fill="#1f2d50">에이전트 A</text>
  <rect x="680" y="55" width="80" height="40" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="720" y="80" text-anchor="middle" font-size="11" fill="#1f2d50">에이전트 B</text>

  <line x1="480" y1="95" x2="480" y2="130" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arrowgreen)"/>
  <line x1="720" y1="95" x2="720" y2="130" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arrowgreen)"/>

  <rect x="420" y="130" width="120" height="45" rx="6" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="2"/>
  <text x="480" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d6b3d">역할 A</text>
  <text x="480" y="165" text-anchor="middle" font-size="9" fill="#1d6b3d">tag: agent-type=A</text>

  <rect x="660" y="130" width="120" height="45" rx="6" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="2"/>
  <text x="720" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d6b3d">역할 B</text>
  <text x="720" y="165" text-anchor="middle" font-size="9" fill="#1d6b3d">tag: agent-type=B</text>

  <line x1="480" y1="175" x2="480" y2="210" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arrowgreen)"/>
  <line x1="720" y1="175" x2="720" y2="210" stroke="#2e9e5b" stroke-width="1.5" marker-end="url(#arrowgreen)"/>

  <rect x="420" y="210" width="120" height="40" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="480" y="234" text-anchor="middle" font-size="11" fill="#333">Bedrock 호출</text>
  <rect x="660" y="210" width="120" height="40" rx="6" fill="#f4f4f4" stroke="#777" stroke-width="2"/>
  <text x="720" y="234" text-anchor="middle" font-size="11" fill="#333">Bedrock 호출</text>

  <line x1="480" y1="250" x2="480" y2="275" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="720" y1="250" x2="720" y2="275" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="420" y="275" width="120" height="38" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="480" y="298" text-anchor="middle" font-size="10" fill="#1f2d50">로그 그룹 A</text>
  <rect x="660" y="275" width="120" height="38" rx="6" fill="#eef3ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="720" y="298" text-anchor="middle" font-size="10" fill="#1f2d50">로그 그룹 B</text>

  <line x1="480" y1="250" x2="560" y2="340" stroke="#2e9e5b" stroke-width="1.5"/>
  <line x1="720" y1="250" x2="640" y2="340" stroke="#2e9e5b" stroke-width="1.5"/>

  <rect x="510" y="340" width="200" height="60" rx="6" fill="#e8f7ee" stroke="#2e9e5b" stroke-width="2"/>
  <text x="610" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d6b3d">Cost Explorer</text>
  <text x="610" y="380" text-anchor="middle" font-size="11" fill="#1d6b3d">태그별 비용 분리 조회</text>
  <text x="610" y="393" text-anchor="middle" font-size="10" fill="#1d6b3d">agent-type=A / B 구분</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2e9e5b"/>
    </marker>
  </defs>
</svg>
