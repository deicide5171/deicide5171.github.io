<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">트랜잭셔널 아웃박스 패턴 — 이중 쓰기를 하나의 트랜잭션으로</text>

  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2fa84f"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Wrong path: direct dual write -->
  <rect x="40" y="55" width="150" height="40" rx="6" fill="#eaf3ff" stroke="#0b5fa5"/>
  <text x="115" y="80" text-anchor="middle" font-size="12.5" fill="#0b5fa5">주문 서비스</text>

  <line x1="190" y1="65" x2="330" y2="65" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowR)"/>
  <rect x="330" y="45" width="150" height="40" rx="6" fill="#ffe8e8" stroke="#c0392b"/>
  <text x="405" y="70" text-anchor="middle" font-size="11.5" fill="#a3281b">Kafka 직접 발행</text>
  <text x="255" y="58" text-anchor="middle" font-size="10.5" fill="#c0392b">DB 커밋과 별개 호출 → 실패 시 유실/중복</text>

  <!-- Divider -->
  <line x1="40" y1="105" x2="760" y2="105" stroke="#ddd" stroke-width="1"/>

  <!-- Correct path: one transaction box -->
  <rect x="40" y="130" width="380" height="150" rx="8" fill="#f7fbff" stroke="#0b5fa5" stroke-width="2"/>
  <text x="230" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b5fa5">주문 서비스 — 하나의 로컬 트랜잭션</text>

  <rect x="65" y="170" width="150" height="80" rx="6" fill="#eaf3ff" stroke="#1877c9"/>
  <text x="140" y="200" text-anchor="middle" font-size="12" fill="#0b5fa5">orders 테이블</text>
  <text x="140" y="220" text-anchor="middle" font-size="10.5" fill="#0b5fa5">INSERT 주문 행</text>

  <rect x="235" y="170" width="160" height="80" rx="6" fill="#eaffef" stroke="#2fa84f"/>
  <text x="315" y="200" text-anchor="middle" font-size="12" fill="#1f7a38">outbox 테이블</text>
  <text x="315" y="220" text-anchor="middle" font-size="10.5" fill="#1f7a38">INSERT 이벤트 행</text>

  <text x="230" y="262" text-anchor="middle" font-size="11" fill="#0b5fa5" font-weight="bold">COMMIT — 둘 다 성공하거나 둘 다 롤백</text>

  <!-- Relay -->
  <line x1="420" y1="220" x2="500" y2="220" stroke="#2fa84f" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <rect x="500" y="185" width="150" height="70" rx="6" fill="#eaffef" stroke="#2fa84f"/>
  <text x="575" y="212" text-anchor="middle" font-size="12" fill="#1f7a38">아웃박스 릴레이</text>
  <text x="575" y="230" text-anchor="middle" font-size="10.5" fill="#1f7a38">CDC(Debezium)</text>
  <text x="575" y="245" text-anchor="middle" font-size="10.5" fill="#1f7a38">또는 폴링 발행자</text>

  <line x1="650" y1="220" x2="740" y2="220" stroke="#2fa84f" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <rect x="640" y="330" width="120" height="0" fill="none"/>
  <text x="700" y="205" text-anchor="middle" font-size="1"> </text>

  <!-- Kafka box -->
  <rect x="600" y="290" width="150" height="45" rx="6" fill="#fff4e5" stroke="#c9701d"/>
  <text x="675" y="317" text-anchor="middle" font-size="12" fill="#a3550f">Kafka 토픽</text>

  <line x1="675" y1="255" x2="675" y2="290" stroke="#2fa84f" stroke-width="2.5" marker-end="url(#arrowG)"/>

  <!-- Consumer -->
  <rect x="600" y="365" width="150" height="45" rx="6" fill="#f0f0ff" stroke="#5a4fc9"/>
  <text x="675" y="392" text-anchor="middle" font-size="12" fill="#3f34a0">재고/알림 서비스</text>
  <line x1="675" y1="335" x2="675" y2="365" stroke="#c9701d" stroke-width="2.5" marker-end="url(#arrowG)"/>

  <text x="230" y="435" text-anchor="middle" font-size="11.5" fill="#555">outbox 테이블에 쓰는 순간 DB 트랜잭션의 원자성 보장을 그대로 이어받는다</text>
</svg>
