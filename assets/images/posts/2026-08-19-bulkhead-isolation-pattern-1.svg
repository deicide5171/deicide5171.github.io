<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">벌크헤드 패턴 — 의존성별 리소스 풀 격리 구조</text>

  <!-- Service A -->
  <rect x="30" y="150" width="120" height="90" rx="8" fill="#eef2ff" stroke="#4f5bd5" stroke-width="2"/>
  <text x="90" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">서비스 A</text>
  <text x="90" y="210" text-anchor="middle" font-size="12" fill="#555">(API 서버)</text>

  <!-- Arrows from A to each lane -->
  <line x1="150" y1="175" x2="255" y2="90" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="195" x2="415" y2="90" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="150" y1="215" x2="575" y2="90" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Lane X (normal) -->
  <g>
    <rect x="255" y="65" width="130" height="45" rx="6" fill="#e6f7ee" stroke="#2fa86a" stroke-width="2"/>
    <text x="320" y="93" text-anchor="middle" font-size="13" fill="#1d7a4c">스레드풀 X</text>
    <rect x="255" y="135" width="130" height="45" rx="6" fill="#e6f7ee" stroke="#2fa86a" stroke-width="2"/>
    <text x="320" y="163" text-anchor="middle" font-size="13" fill="#1d7a4c">커넥션풀 X</text>
    <line x1="320" y1="110" x2="320" y2="135" stroke="#2fa86a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="320" y1="180" x2="320" y2="215" stroke="#2fa86a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="255" y="215" width="130" height="45" rx="6" fill="#f3fbf7" stroke="#2fa86a" stroke-width="2"/>
    <text x="320" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d7a4c">서비스 X (정상)</text>
  </g>

  <!-- Lane Y (overloaded) -->
  <g>
    <rect x="415" y="65" width="130" height="45" rx="6" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
    <text x="480" y="93" text-anchor="middle" font-size="13" fill="#a72d2d">스레드풀 Y</text>
    <rect x="415" y="135" width="130" height="45" rx="6" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
    <text x="480" y="163" text-anchor="middle" font-size="13" fill="#a72d2d">커넥션풀 Y</text>
    <line x1="480" y1="110" x2="480" y2="135" stroke="#d64545" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="480" y1="180" x2="480" y2="215" stroke="#d64545" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="415" y="215" width="130" height="45" rx="6" fill="#fdecec" stroke="#d64545" stroke-width="2"/>
    <text x="480" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#a72d2d">서비스 Y</text>
    <text x="480" y="253" text-anchor="middle" font-size="11" fill="#a72d2d">(응답 지연·장애)</text>
  </g>

  <!-- Lane Z (normal) -->
  <g>
    <rect x="575" y="65" width="130" height="45" rx="6" fill="#e6f7ee" stroke="#2fa86a" stroke-width="2"/>
    <text x="640" y="93" text-anchor="middle" font-size="13" fill="#1d7a4c">스레드풀 Z</text>
    <rect x="575" y="135" width="130" height="45" rx="6" fill="#e6f7ee" stroke="#2fa86a" stroke-width="2"/>
    <text x="640" y="163" text-anchor="middle" font-size="13" fill="#1d7a4c">커넥션풀 Z</text>
    <line x1="640" y1="110" x2="640" y2="135" stroke="#2fa86a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="640" y1="180" x2="640" y2="215" stroke="#2fa86a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="575" y="215" width="130" height="45" rx="6" fill="#f3fbf7" stroke="#2fa86a" stroke-width="2"/>
    <text x="640" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d7a4c">서비스 Z (정상)</text>
  </g>

  <!-- Isolation boundary marker around lane Y -->
  <rect x="405" y="58" width="150" height="209" rx="10" fill="none" stroke="#d64545" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="480" y="285" text-anchor="middle" font-size="12" fill="#a72d2d">격벽(bulkhead) — 장애가 이 안에서 멈춘다</text>

  <!-- Bottom note -->
  <rect x="30" y="330" width="675" height="90" rx="8" fill="#f7f7f7" stroke="#ccc" stroke-width="1"/>
  <text x="55" y="358" font-size="13.5" fill="#333">풀을 공유하지 않으면, Y로 가는 스레드·커넥션이 모두 소진되어도</text>
  <text x="55" y="380" font-size="13.5" fill="#333">X·Z 요청을 처리할 스레드·커넥션은 그대로 남아 있다.</text>
  <text x="55" y="402" font-size="13.5" font-weight="bold" fill="#222">→ 하나의 의존성 장애가 서비스 A 전체의 요청 처리 능력을 갉아먹지 못한다.</text>
</svg>
