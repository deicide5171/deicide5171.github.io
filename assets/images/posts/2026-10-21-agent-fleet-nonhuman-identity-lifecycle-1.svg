<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>

  <defs>
    <marker id="arrowh" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Stage 1: Request -->
  <rect x="15" y="150" width="140" height="130" rx="8" fill="#eef1fb" stroke="#5b6fd4" stroke-width="1.5"/>
  <text x="85" y="178" font-size="13" text-anchor="middle" fill="#2c3a9e" font-weight="bold">요청</text>
  <text x="85" y="200" font-size="11" text-anchor="middle" fill="#555">팀이 목적·범위</text>
  <text x="85" y="216" font-size="11" text-anchor="middle" fill="#555">명시해 신청</text>

  <!-- Stage 2: Provisioning -->
  <rect x="175" y="150" width="140" height="130" rx="8" fill="#e8f0fe" stroke="#4a6fd4" stroke-width="1.5"/>
  <text x="245" y="178" font-size="13" text-anchor="middle" fill="#2c4a9e" font-weight="bold">발급</text>
  <text x="245" y="200" font-size="11" text-anchor="middle" fill="#555">owner·purpose</text>
  <text x="245" y="216" font-size="11" text-anchor="middle" fill="#555">expiry 필수 기록</text>
  <text x="245" y="235" font-size="10" text-anchor="middle" fill="#999">(소유자 없으면 거부)</text>

  <!-- Stage 3: Runtime JIT -->
  <rect x="335" y="150" width="140" height="130" rx="8" fill="#fdeee8" stroke="#d4714a" stroke-width="1.5"/>
  <text x="405" y="178" font-size="13" text-anchor="middle" fill="#9e3f2c" font-weight="bold">런타임 권한</text>
  <text x="405" y="200" font-size="11" text-anchor="middle" fill="#555">JIT 그랜트</text>
  <text x="405" y="216" font-size="11" text-anchor="middle" fill="#555">범위·시간 제한</text>
  <text x="405" y="235" font-size="10" text-anchor="middle" fill="#999">상시 권한 없음</text>

  <!-- Stage 4: Monitoring -->
  <rect x="495" y="150" width="140" height="130" rx="8" fill="#fdf3e0" stroke="#d4a24a" stroke-width="1.5"/>
  <text x="565" y="178" font-size="13" text-anchor="middle" fill="#8a6418" font-weight="bold">운영·모니터링</text>
  <text x="565" y="200" font-size="11" text-anchor="middle" fill="#555">last_used 추적</text>
  <text x="565" y="216" font-size="11" text-anchor="middle" fill="#555">이상 호출 탐지</text>

  <!-- Stage 5: Deprovisioning -->
  <rect x="655" y="150" width="130" height="130" rx="8" fill="#eaf7ee" stroke="#4aa26f" stroke-width="1.5"/>
  <text x="720" y="178" font-size="13" text-anchor="middle" fill="#276b43" font-weight="bold">회수</text>
  <text x="720" y="200" font-size="11" text-anchor="middle" fill="#555">만료·소유자 이탈</text>
  <text x="720" y="216" font-size="11" text-anchor="middle" fill="#555">시 자동 폐기</text>

  <!-- Arrows forward -->
  <path d="M 155 215 L 170 215" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowh)"/>
  <path d="M 315 215 L 330 215" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowh)"/>
  <path d="M 475 215 L 490 215" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowh)"/>
  <path d="M 635 215 L 650 215" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrowh)"/>

  <!-- Feedback: deprovision triggers back to zero -->
  <path d="M 720 150 C 720 90, 85 90, 85 145" fill="none" stroke="#b23" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowh)"/>
  <text x="400" y="80" font-size="11" text-anchor="middle" fill="#b23">회수 훅 미연결 시 — 프로젝트 끝나도 신원은 계속 살아있는 "좀비 신원"</text>

  <!-- Registry bar underneath -->
  <rect x="15" y="320" width="770" height="60" rx="8" fill="#f1f1f1" stroke="#999" stroke-width="1"/>
  <text x="400" y="345" font-size="12" text-anchor="middle" fill="#333" font-weight="bold">신원 레지스트리 (단일 소스) — id · owner · scope · expires_at · last_used_at · status</text>
  <text x="400" y="365" font-size="11" text-anchor="middle" fill="#777">다섯 단계 모두 이 레지스트리를 읽고 쓴다 — 레지스트리 없이 흩어지면 ② 발급만 있고 ⑤ 회수가 사라진다</text>

  <!-- connecting lines from stages to registry -->
  <path d="M 85 280 L 85 320" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M 245 280 L 245 320" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M 405 280 L 405 320" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M 565 280 L 565 320" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M 720 280 L 720 320" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Title -->
  <text x="400" y="35" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">에이전트 Non-Human Identity 라이프사이클</text>
  <text x="400" y="55" font-size="12" text-anchor="middle" fill="#666">발급 한 번으로 끝나지 않고, 회수까지 닫혀야 완성되는 순환 구조</text>
</svg>
