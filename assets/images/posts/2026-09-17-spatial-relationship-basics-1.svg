<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">공간 관계 — 두 도형의 위치 관계</text>

  <!-- Contains -->
  <rect x="60" y="100" width="160" height="150" rx="10" fill="#fafafa" stroke="#ddd"/>
  <text x="140" y="128" font-family="sans-serif" font-size="16" font-weight="bold" fill="#03c75a" text-anchor="middle">포함(Contains)</text>
  <rect x="90" y="145" width="100" height="80" fill="#d9f0e4" stroke="#03c75a" stroke-width="2"/>
  <circle cx="140" cy="185" r="10" fill="#c0392b"/>
  <text x="140" y="245" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">A가 B를 품음</text>

  <!-- Intersects -->
  <rect x="240" y="100" width="160" height="150" rx="10" fill="#fafafa" stroke="#ddd"/>
  <text x="320" y="128" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3b7dd8" text-anchor="middle">교차(Intersects)</text>
  <rect x="270" y="150" width="80" height="70" fill="#3b7dd8" fill-opacity="0.25" stroke="#3b7dd8" stroke-width="2"/>
  <rect x="315" y="175" width="80" height="70" fill="#e08e2b" fill-opacity="0.25" stroke="#e08e2b" stroke-width="2"/>
  <text x="320" y="245" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">겹침</text>

  <!-- Touches -->
  <rect x="420" y="100" width="160" height="150" rx="10" fill="#fafafa" stroke="#ddd"/>
  <text x="500" y="128" font-family="sans-serif" font-size="16" font-weight="bold" fill="#e08e2b" text-anchor="middle">접함(Touches)</text>
  <rect x="445" y="155" width="55" height="70" fill="#fdf0e0" stroke="#e08e2b" stroke-width="2"/>
  <rect x="500" y="155" width="55" height="70" fill="#eef3fb" stroke="#3b7dd8" stroke-width="2"/>
  <text x="500" y="245" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">경계만 닿음</text>

  <!-- Disjoint -->
  <rect x="600" y="100" width="160" height="150" rx="10" fill="#fafafa" stroke="#ddd"/>
  <text x="680" y="128" font-family="sans-serif" font-size="16" font-weight="bold" fill="#888" text-anchor="middle">분리(Disjoint)</text>
  <rect x="620" y="155" width="50" height="60" fill="#eee" stroke="#999" stroke-width="2"/>
  <rect x="700" y="170" width="50" height="60" fill="#eee" stroke="#999" stroke-width="2"/>
  <text x="680" y="245" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">안 닿음</text>

  <text x="400" y="320" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">"겹치기만(intersects)"과 "완전히 안(contains)"은 결과가 다르다</text>
  <text x="400" y="350" font-family="sans-serif" font-size="14" fill="#777" text-anchor="middle">PostGIS: ST_Contains / ST_Intersects / ST_Touches / ST_Disjoint</text>
</svg>
