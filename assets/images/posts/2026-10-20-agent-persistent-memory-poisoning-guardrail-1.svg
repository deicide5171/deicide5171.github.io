<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>

  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Stage 1: Extraction -->
  <rect x="25" y="160" width="155" height="120" rx="8" fill="#e8f0fe" stroke="#4a6fd4" stroke-width="1.5"/>
  <text x="102" y="188" font-size="13" text-anchor="middle" fill="#2c4a9e" font-weight="bold">수집</text>
  <text x="102" y="208" font-size="11" text-anchor="middle" fill="#555">세션 종료 시</text>
  <text x="102" y="226" font-size="11" text-anchor="middle" fill="#555">기억 후보 요약</text>
  <text x="102" y="244" font-size="11" text-anchor="middle" fill="#999">(사용자 발화 /</text>
  <text x="102" y="260" font-size="11" text-anchor="middle" fill="#999">외부 문서·도구 출력)</text>

  <!-- Stage 2: Risk gate -->
  <rect x="225" y="160" width="155" height="120" rx="8" fill="#fdeee8" stroke="#d4714a" stroke-width="1.5"/>
  <text x="302" y="188" font-size="13" text-anchor="middle" fill="#9e3f2c" font-weight="bold">위험도 평가 게이트</text>
  <text x="302" y="208" font-size="11" text-anchor="middle" fill="#555">출처 · 민감정보 점검</text>
  <text x="302" y="226" font-size="11" text-anchor="middle" fill="#555">명령형 패턴 탐지</text>
  <text x="302" y="244" font-size="11" text-anchor="middle" fill="#b23" font-weight="bold">reject / quarantine</text>
  <text x="302" y="260" font-size="11" text-anchor="middle" fill="#2a7" font-weight="bold">/ approve</text>

  <!-- Stage 3: Storage -->
  <rect x="425" y="160" width="155" height="120" rx="8" fill="#eaf7ee" stroke="#4aa26f" stroke-width="1.5"/>
  <text x="502" y="188" font-size="13" text-anchor="middle" fill="#276b43" font-weight="bold">저장소</text>
  <text x="502" y="208" font-size="11" text-anchor="middle" fill="#555">벡터 스토어 / DB</text>
  <text x="502" y="226" font-size="11" text-anchor="middle" fill="#555">+ 출처 메타데이터</text>
  <text x="502" y="244" font-size="11" text-anchor="middle" fill="#999">(source_type,</text>
  <text x="502" y="260" font-size="11" text-anchor="middle" fill="#999">confirmed_by_user)</text>

  <!-- Stage 4: Retrieval -->
  <rect x="620" y="160" width="155" height="120" rx="8" fill="#fdf3e0" stroke="#d4a24a" stroke-width="1.5"/>
  <text x="697" y="188" font-size="13" text-anchor="middle" fill="#8a6418" font-weight="bold">회수·주입</text>
  <text x="697" y="208" font-size="11" text-anchor="middle" fill="#555">다음 세션 시작 시</text>
  <text x="697" y="226" font-size="11" text-anchor="middle" fill="#555">프롬프트 앞단 삽입</text>
  <text x="697" y="244" font-size="11" text-anchor="middle" fill="#b23" font-weight="bold">2차 방어: 명령형</text>
  <text x="697" y="260" font-size="11" text-anchor="middle" fill="#b23" font-weight="bold">문장 재점검</text>

  <!-- Arrows -->
  <path d="M 180 220 L 220 220" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow3)"/>
  <path d="M 380 220 L 420 220" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow3)"/>
  <path d="M 580 220 L 615 220" fill="none" stroke="#666" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Feedback loop -->
  <path d="M 697 160 C 697 100, 102 100, 102 155" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow3)"/>
  <text x="400" y="95" font-size="11" text-anchor="middle" fill="#999">다음 세션에서 다시 출발점으로 — 포이즈닝되면 반복 실행</text>

  <!-- Caption -->
  <text x="400" y="330" font-size="12" text-anchor="middle" fill="#444">게이트(2단계)가 없으면 수집된 모든 텍스트가 검증 없이 저장·재주입된다</text>

  <!-- Title -->
  <text x="400" y="35" font-size="16" text-anchor="middle" fill="#222" font-weight="bold">에이전트 지속 메모리 파이프라인</text>
</svg>
