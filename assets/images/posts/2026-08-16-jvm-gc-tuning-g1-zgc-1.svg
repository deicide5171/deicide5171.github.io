<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">G1 vs ZGC — 힙 구조 &amp; 일시정지시간 경향 비교</text>

  <!-- G1 panel -->
  <text x="200" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#2563eb">G1 GC 힙 구조 (Region 기반)</text>
  <rect x="60" y="72" width="280" height="150" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- region grid -->
  <g font-size="9" fill="#ffffff" text-anchor="middle">
    <!-- rows of small region squares -->
    <rect x="68" y="80" width="30" height="30" fill="#22c55e"/><text x="83" y="98">Y</text>
    <rect x="102" y="80" width="30" height="30" fill="#22c55e"/><text x="117" y="98">Y</text>
    <rect x="136" y="80" width="30" height="30" fill="#f59e0b"/><text x="151" y="98">O</text>
    <rect x="170" y="80" width="30" height="30" fill="#94a3b8"/><text x="185" y="98">-</text>
    <rect x="204" y="80" width="30" height="30" fill="#f59e0b"/><text x="219" y="98">O</text>
    <rect x="238" y="80" width="30" height="30" fill="#22c55e"/><text x="253" y="98">Y</text>
    <rect x="272" y="80" width="30" height="30" fill="#94a3b8"/><text x="287" y="98">-</text>
    <rect x="306" y="80" width="24" height="30" fill="#ef4444"/><text x="315" y="98" font-size="8">H</text>

    <rect x="68" y="114" width="30" height="30" fill="#f59e0b"/><text x="83" y="132">O</text>
    <rect x="102" y="114" width="30" height="30" fill="#94a3b8"/><text x="117" y="132">-</text>
    <rect x="136" y="114" width="30" height="30" fill="#22c55e"/><text x="151" y="132">Y</text>
    <rect x="170" y="114" width="30" height="30" fill="#f59e0b"/><text x="185" y="132">O</text>
    <rect x="204" y="114" width="30" height="30" fill="#22c55e"/><text x="219" y="132">Y</text>
    <rect x="238" y="114" width="30" height="30" fill="#94a3b8"/><text x="253" y="132">-</text>
    <rect x="272" y="114" width="30" height="30" fill="#f59e0b"/><text x="287" y="132">O</text>
    <rect x="306" y="114" width="24" height="30" fill="#94a3b8"/><text x="315" y="132" font-size="8">-</text>
  </g>
  <text x="200" y="160" text-anchor="middle" font-size="11" fill="#475569">Young(Y) / Old(O) / Humongous(H) 영역이</text>
  <text x="200" y="175" text-anchor="middle" font-size="11" fill="#475569">고정 크기 Region 단위로 흩어져 있고,</text>
  <text x="200" y="190" text-anchor="middle" font-size="11" fill="#475569">가비지가 많은 Region부터 우선 회수한다</text>
  <text x="200" y="210" text-anchor="middle" font-size="11" fill="#1e40af">(Stop-the-world Young/Mixed GC)</text>

  <!-- ZGC panel -->
  <text x="600" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#059669">ZGC 힙 구조 (세대 분리 + 동시 압축)</text>
  <rect x="460" y="72" width="280" height="150" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">Young 세대</text>
  <g font-size="9" fill="#ffffff" text-anchor="middle">
    <rect x="470" y="98" width="26" height="26" fill="#34d399"/>
    <rect x="500" y="98" width="26" height="26" fill="#34d399"/>
    <rect x="530" y="98" width="26" height="26" fill="#34d399"/>
    <rect x="560" y="98" width="26" height="26" fill="#34d399"/>
    <rect x="590" y="98" width="26" height="26" fill="#34d399"/>
    <rect x="620" y="98" width="26" height="26" fill="#34d399"/>
    <rect x="650" y="98" width="26" height="26" fill="#34d399"/>
    <rect x="680" y="98" width="26" height="26" fill="#34d399"/>
    <rect x="710" y="98" width="26" height="26" fill="#34d399"/>
  </g>
  <text x="600" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">Old 세대</text>
  <g font-size="9" fill="#ffffff" text-anchor="middle">
    <rect x="470" y="146" width="26" height="26" fill="#0d9488"/>
    <rect x="500" y="146" width="26" height="26" fill="#0d9488"/>
    <rect x="530" y="146" width="26" height="26" fill="#0d9488"/>
    <rect x="560" y="146" width="26" height="26" fill="#0d9488"/>
    <rect x="590" y="146" width="26" height="26" fill="#0d9488"/>
    <rect x="620" y="146" width="26" height="26" fill="#94a3b8"/>
    <rect x="650" y="146" width="26" height="26" fill="#94a3b8"/>
    <rect x="680" y="146" width="26" height="26" fill="#94a3b8"/>
    <rect x="710" y="146" width="26" height="26" fill="#94a3b8"/>
  </g>
  <text x="600" y="190" text-anchor="middle" font-size="11" fill="#475569">애플리케이션 스레드가 도는 동안</text>
  <text x="600" y="205" text-anchor="middle" font-size="11" fill="#475569">컬러 포인터·로드 배리어로 대부분의 작업을</text>
  <text x="600" y="220" text-anchor="middle" font-size="11" fill="#1e40af">동시(Concurrent)에 압축·재배치한다</text>

  <!-- Divider -->
  <line x1="400" y1="55" x2="400" y2="225" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bottom: pause time trend chart -->
  <text x="400" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">힙 크기가 커질수록 — 일시정지시간 경향 (개념도, 설계 목표 기준)</text>

  <line x1="90" y1="410" x2="740" y2="410" stroke="#334155" stroke-width="1.5"/>
  <line x1="90" y1="410" x2="90" y2="280" stroke="#334155" stroke-width="1.5"/>
  <text x="415" y="435" text-anchor="middle" font-size="12" fill="#475569">힙 크기 증가 →</text>
  <text x="60" y="300" text-anchor="middle" font-size="12" fill="#475569" transform="rotate(-90 60 300)">일시정지시간 ↑</text>

  <!-- G1 rising line -->
  <polyline points="100,395 220,375 340,340 460,295 580,260 700,290" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="700" y="278" font-size="12" fill="#2563eb" font-weight="bold">G1</text>

  <!-- ZGC flat line -->
  <polyline points="100,400 220,398 340,396 460,394 580,393 700,392" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="700" y="405" font-size="12" fill="#059669" font-weight="bold">ZGC</text>

  <text x="415" y="290" text-anchor="middle" font-size="10" fill="#94a3b8">※ 실제 수치는 워크로드·튜닝값에 따라 달라짐 — 상대적 경향만 표현</text>
</svg>
