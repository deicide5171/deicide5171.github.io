<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">정확도 vs 정밀도 (과녁 비유)</text>

  <!-- Target 1: accurate + precise -->
  <g>
    <circle cx="230" cy="180" r="60" fill="none" stroke="#ccc" stroke-width="2"/>
    <circle cx="230" cy="180" r="35" fill="none" stroke="#ccc" stroke-width="2"/>
    <circle cx="230" cy="180" r="12" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
    <circle cx="228" cy="178" r="4" fill="#c0392b"/><circle cx="234" cy="182" r="4" fill="#c0392b"/>
    <circle cx="230" cy="184" r="4" fill="#c0392b"/><circle cx="232" cy="176" r="4" fill="#c0392b"/>
    <text x="230" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#03c75a" text-anchor="middle">정확O 정밀O</text>
    <text x="230" y="290" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">중심에 모임(이상적)</text>
  </g>

  <!-- Target 2: precise not accurate -->
  <g>
    <circle cx="420" cy="180" r="60" fill="none" stroke="#ccc" stroke-width="2"/>
    <circle cx="420" cy="180" r="35" fill="none" stroke="#ccc" stroke-width="2"/>
    <circle cx="420" cy="180" r="12" fill="#fff" stroke="#e08e2b" stroke-width="2"/>
    <circle cx="450" cy="150" r="4" fill="#c0392b"/><circle cx="456" cy="154" r="4" fill="#c0392b"/>
    <circle cx="452" cy="158" r="4" fill="#c0392b"/><circle cx="458" cy="148" r="4" fill="#c0392b"/>
    <text x="420" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e08e2b" text-anchor="middle">정확X 정밀O</text>
    <text x="420" y="290" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">모였지만 벗어남</text>
  </g>

  <!-- Target 3: accurate not precise -->
  <g>
    <circle cx="610" cy="180" r="60" fill="none" stroke="#ccc" stroke-width="2"/>
    <circle cx="610" cy="180" r="35" fill="none" stroke="#ccc" stroke-width="2"/>
    <circle cx="610" cy="180" r="12" fill="#fff" stroke="#3b7dd8" stroke-width="2"/>
    <circle cx="595" cy="165" r="4" fill="#c0392b"/><circle cx="625" cy="175" r="4" fill="#c0392b"/>
    <circle cx="605" cy="200" r="4" fill="#c0392b"/><circle cx="630" cy="195" r="4" fill="#c0392b"/>
    <text x="610" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3b7dd8" text-anchor="middle">정확O 정밀X</text>
    <text x="610" y="290" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">중심 근처지만 흩어짐</text>
  </g>

  <text x="400" y="360" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">정확도 = 중심에 가까운가 · 정밀도 = 얼마나 모여 있나(자릿수)</text>
  <text x="400" y="392" font-family="sans-serif" font-size="14" fill="#777" text-anchor="middle">소수점 자릿수가 많은 건 "정밀"할 뿐 "정확"한 것이 아니다</text>
</svg>
