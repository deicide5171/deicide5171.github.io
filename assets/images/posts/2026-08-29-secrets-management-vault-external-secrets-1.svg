<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">Vault + External Secrets Operator 동기화 흐름</text>

  <!-- Vault -->
  <rect x="40" y="60" width="220" height="130" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="150" y="86" font-family="sans-serif" font-size="14" font-weight="bold" fill="#3a6ea5" text-anchor="middle">HashiCorp Vault</text>
  <text x="60" y="110" font-family="sans-serif" font-size="11" fill="#555">· 시크릿 암호화 저장</text>
  <text x="60" y="128" font-family="sans-serif" font-size="11" fill="#555">· 동적 시크릿 발급(TTL)</text>
  <text x="60" y="146" font-family="sans-serif" font-size="11" fill="#555">· 정책 기반 접근 제어</text>
  <text x="60" y="164" font-family="sans-serif" font-size="11" fill="#555">· 감사 로그 기록</text>

  <line x1="260" y1="125" x2="310" y2="125" stroke="#4a7ab5" stroke-width="1.5"/>
  <polygon points="310,125 301,120 301,130" fill="#4a7ab5"/>
  <text x="285" y="115" font-family="sans-serif" font-size="10" fill="#5b7a9d" text-anchor="middle">폴링</text>

  <!-- ESO -->
  <rect x="314" y="60" width="220" height="130" rx="8" fill="#eef8f1" stroke="#2e9e63" stroke-width="1.5"/>
  <text x="424" y="86" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a6b45" text-anchor="middle">External Secrets Operator</text>
  <text x="334" y="110" font-family="sans-serif" font-size="11" fill="#555">· ClusterSecretStore로</text>
  <text x="346" y="126" font-family="sans-serif" font-size="11" fill="#555">Vault 연결 정보 정의</text>
  <text x="334" y="146" font-family="sans-serif" font-size="11" fill="#555">· ExternalSecret 리소스로</text>
  <text x="346" y="162" font-family="sans-serif" font-size="11" fill="#555">refreshInterval마다 동기화</text>

  <line x1="534" y1="125" x2="584" y2="125" stroke="#2e9e63" stroke-width="1.5"/>
  <polygon points="584,125 575,120 575,130" fill="#2e9e63"/>
  <text x="559" y="115" font-family="sans-serif" font-size="10" fill="#5b9a72" text-anchor="middle">생성</text>

  <!-- K8s Secret -->
  <rect x="588" y="60" width="172" height="130" rx="8" fill="#fdf6ec" stroke="#c98a3d" stroke-width="1.5"/>
  <text x="674" y="86" font-family="sans-serif" font-size="14" font-weight="bold" fill="#8a4a2e" text-anchor="middle">K8s Secret</text>
  <text x="606" y="112" font-family="sans-serif" font-size="11" fill="#555">표준 쿠버네티스</text>
  <text x="606" y="130" font-family="sans-serif" font-size="11" fill="#555">Secret 오브젝트로</text>
  <text x="606" y="148" font-family="sans-serif" font-size="11" fill="#555">애플리케이션에 노출</text>

  <line x1="150" y1="216" x2="150" y2="250" stroke="#4a7ab5" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="150" y="232" font-family="sans-serif" font-size="10" fill="#5b7a9d" text-anchor="middle">TTL 만료 시 자동 폐기</text>

  <line x1="674" y1="190" x2="674" y2="240" stroke="#c98a3d" stroke-width="1.5"/>
  <polygon points="674,240 668,228 680,228" fill="#c98a3d"/>

  <!-- Pod -->
  <rect x="574" y="246" width="200" height="70" rx="8" fill="#f9f9f9" stroke="#999" stroke-width="1.5"/>
  <text x="674" y="272" font-family="sans-serif" font-size="13" font-weight="bold" fill="#333" text-anchor="middle">애플리케이션 파드</text>
  <text x="674" y="292" font-family="sans-serif" font-size="11" fill="#666" text-anchor="middle">환경변수/볼륨으로 마운트</text>
  <text x="674" y="306" font-family="sans-serif" font-size="10" fill="#888" text-anchor="middle">(Vault를 직접 몰라도 됨)</text>

  <!-- 하단 주의사항 -->
  <rect x="40" y="340" width="720" height="90" rx="8" fill="#fff7f0" stroke="#ff8a3d"/>
  <text x="60" y="364" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a35a1f">주의: 반영 지연 지점</text>
  <text x="60" y="388" font-family="sans-serif" font-size="12" fill="#555">· Vault 회전 → ESO 폴링까지: 최대 refreshInterval만큼 지연</text>
  <text x="60" y="408" font-family="sans-serif" font-size="12" fill="#555">· K8s Secret 갱신 → 파드 반영까지: 환경변수는 재시작 필요, 볼륨은 애플리케이션 재로드 로직 필요</text>
</svg>
