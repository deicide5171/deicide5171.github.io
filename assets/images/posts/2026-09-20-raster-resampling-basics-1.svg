<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="42" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">래스터 리샘플링 (해상도 변환)</text>

  <!-- Source low-res grid -->
  <text x="150" y="90" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">원본 (저해상도 2×2)</text>
  <g>
    <rect x="90" y="110" width="60" height="60" fill="#c8e6d4" stroke="#fff" stroke-width="2"/>
    <rect x="150" y="110" width="60" height="60" fill="#66c295" stroke="#fff" stroke-width="2"/>
    <rect x="90" y="170" width="60" height="60" fill="#2e8b57" stroke="#fff" stroke-width="2"/>
    <rect x="150" y="170" width="60" height="60" fill="#a5d9bd" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- arrow -->
  <line x1="240" y1="170" x2="330" y2="170" stroke="#888" stroke-width="2"/>
  <polygon points="330,170 320,164 320,176" fill="#888"/>
  <text x="285" y="160" font-family="sans-serif" font-size="13" fill="#777" text-anchor="middle">리샘플링</text>

  <!-- Nearest result -->
  <text x="440" y="90" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">최근접 (범주형)</text>
  <g>
    <rect x="380" y="110" width="30" height="30" fill="#c8e6d4" stroke="#fff"/><rect x="410" y="110" width="30" height="30" fill="#c8e6d4" stroke="#fff"/>
    <rect x="440" y="110" width="30" height="30" fill="#66c295" stroke="#fff"/><rect x="470" y="110" width="30" height="30" fill="#66c295" stroke="#fff"/>
    <rect x="380" y="140" width="30" height="30" fill="#c8e6d4" stroke="#fff"/><rect x="410" y="140" width="30" height="30" fill="#c8e6d4" stroke="#fff"/>
    <rect x="440" y="140" width="30" height="30" fill="#66c295" stroke="#fff"/><rect x="470" y="140" width="30" height="30" fill="#66c295" stroke="#fff"/>
    <rect x="380" y="170" width="30" height="30" fill="#2e8b57" stroke="#fff"/><rect x="410" y="170" width="30" height="30" fill="#2e8b57" stroke="#fff"/>
    <rect x="440" y="170" width="30" height="30" fill="#a5d9bd" stroke="#fff"/><rect x="470" y="170" width="30" height="30" fill="#a5d9bd" stroke="#fff"/>
    <rect x="380" y="200" width="30" height="30" fill="#2e8b57" stroke="#fff"/><rect x="410" y="200" width="30" height="30" fill="#2e8b57" stroke="#fff"/>
    <rect x="440" y="200" width="30" height="30" fill="#a5d9bd" stroke="#fff"/><rect x="470" y="200" width="30" height="30" fill="#a5d9bd" stroke="#fff"/>
  </g>
  <text x="440" y="252" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">값 그대로 복제 (경계 유지)</text>

  <!-- Bilinear result -->
  <text x="640" y="90" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle" font-weight="bold">이중선형 (연속값)</text>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8e6d4"/><stop offset="100%" stop-color="#a5d9bd"/>
    </linearGradient>
  </defs>
  <rect x="580" y="110" width="120" height="120" fill="url(#g1)" stroke="#ccc"/>
  <text x="640" y="252" font-family="sans-serif" font-size="12" fill="#777" text-anchor="middle">주변 픽셀 평균으로 부드럽게</text>

  <text x="400" y="320" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">범주형(토지분류)은 최근접, 연속값(고도·온도)은 이중선형·삼차회선</text>
  <text x="400" y="360" font-family="sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">범주형에 평균을 내면 "1.5" 같은 무의미한 값이 생긴다</text>
  <text x="400" y="398" font-family="sans-serif" font-size="14" fill="#777" text-anchor="middle">업샘플링은 새 디테일을 만드는 게 아니라 보간된 값일 뿐이다</text>
</svg>
