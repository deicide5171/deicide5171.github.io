<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">플랫폼 스레드 vs 가상 스레드 — 부하가 늘어날 때의 구조 차이</text>

  <!-- LEFT PANEL: platform threads -->
  <text x="195" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#a3550f">플랫폼 스레드 풀 (예: 200개)</text>
  <rect x="60" y="75" width="270" height="260" rx="8" fill="#fff7f0" stroke="#e0a866" stroke-width="1.5"/>

  <!-- OS threads mapped 1:1, blocked on IO -->
  <g>
    <rect x="80" y="95" width="90" height="26" rx="4" fill="#ffe4c4" stroke="#c9701d"/>
    <text x="125" y="112" text-anchor="middle" font-size="10.5" fill="#8a4a10">OS 스레드 #1</text>

    <rect x="200" y="95" width="110" height="26" rx="4" fill="#ffe4c4" stroke="#c9701d"/>
    <text x="255" y="112" text-anchor="middle" font-size="10.5" fill="#8a4a10">요청 A 처리 중</text>

    <rect x="80" y="131" width="90" height="26" rx="4" fill="#ffe4c4" stroke="#c9701d"/>
    <text x="125" y="148" text-anchor="middle" font-size="10.5" fill="#8a4a10">OS 스레드 #2</text>

    <rect x="200" y="131" width="110" height="26" rx="4" fill="#ffd7d7" stroke="#c94040"/>
    <text x="255" y="144" text-anchor="middle" font-size="10" fill="#8a1a1a">I/O 대기 중</text>
    <text x="255" y="155" text-anchor="middle" font-size="9.5" fill="#8a1a1a">(스레드 점유, 유휴)</text>

    <rect x="80" y="167" width="90" height="26" rx="4" fill="#ffe4c4" stroke="#c9701d"/>
    <text x="125" y="184" text-anchor="middle" font-size="10.5" fill="#8a4a10">OS 스레드 #200</text>

    <rect x="200" y="167" width="110" height="26" rx="4" fill="#ffd7d7" stroke="#c94040"/>
    <text x="255" y="180" text-anchor="middle" font-size="10" fill="#8a1a1a">I/O 대기 중</text>
    <text x="255" y="191" text-anchor="middle" font-size="9.5" fill="#8a1a1a">(스레드 점유, 유휴)</text>
  </g>

  <rect x="80" y="205" width="230" height="46" rx="6" fill="#ffecec" stroke="#c94040" stroke-dasharray="4,3"/>
  <text x="195" y="224" text-anchor="middle" font-size="10.5" fill="#8a1a1a">풀 소진 시 요청 201번째는</text>
  <text x="195" y="238" text-anchor="middle" font-size="10.5" fill="#8a1a1a">대기열에서 스레드 반환을 기다림</text>

  <text x="195" y="285" text-anchor="middle" font-size="10.5" fill="#a3550f">스택 메모리: 스레드 1개당 수 MB</text>
  <text x="195" y="302" text-anchor="middle" font-size="10.5" fill="#a3550f">→ 동시 처리량이 스레드 수에 비례해 제한됨</text>

  <!-- RIGHT PANEL: virtual threads -->
  <text x="605" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f7a38">가상 스레드 + 소수의 캐리어 스레드</text>
  <rect x="470" y="75" width="270" height="260" rx="8" fill="#eafff0" stroke="#7cc492" stroke-width="1.5"/>

  <g>
    <rect x="490" y="95" width="230" height="24" rx="4" fill="#d6f5df" stroke="#2fa84f"/>
    <text x="605" y="111" text-anchor="middle" font-size="10" fill="#1f7a38">가상 스레드 수천~수만 개 (요청당 1개, 가벼움)</text>

    <rect x="495" y="126" width="45" height="20" rx="4" fill="#c7ecd2" stroke="#2fa84f"/>
    <rect x="545" y="126" width="45" height="20" rx="4" fill="#c7ecd2" stroke="#2fa84f"/>
    <rect x="595" y="126" width="45" height="20" rx="4" fill="#c7ecd2" stroke="#2fa84f"/>
    <rect x="645" y="126" width="45" height="20" rx="4" fill="#c7ecd2" stroke="#2fa84f"/>
    <rect x="695" y="126" width="25" height="20" rx="4" fill="#c7ecd2" stroke="#2fa84f"/>
    <text x="605" y="140" text-anchor="middle" font-size="8.5" fill="#1f7a38"> </text>

    <line x1="520" y1="150" x2="520" y2="185" stroke="#2fa84f" stroke-width="1.2" marker-end="url(#a2)"/>
    <line x1="605" y1="150" x2="560" y2="185" stroke="#2fa84f" stroke-width="1.2" marker-end="url(#a2)"/>
    <line x1="700" y1="150" x2="640" y2="185" stroke="#2fa84f" stroke-width="1.2" stroke-dasharray="3,2"/>

    <rect x="500" y="190" width="110" height="30" rx="5" fill="#bfe8cc" stroke="#1f7a38"/>
    <text x="555" y="209" text-anchor="middle" font-size="10" fill="#14522a">캐리어 스레드 (OS, 소수)</text>

    <rect x="620" y="190" width="110" height="30" rx="5" fill="#f0f0f0" stroke="#999" stroke-dasharray="3,2"/>
    <text x="675" y="209" text-anchor="middle" font-size="9.5" fill="#666">블로킹 시 잠시 대기</text>
  </g>

  <rect x="490" y="230" width="230" height="46" rx="6" fill="#eafff0" stroke="#2fa84f" stroke-dasharray="4,3"/>
  <text x="605" y="249" text-anchor="middle" font-size="10.5" fill="#1f7a38">I/O 대기 시 가상 스레드가 캐리어를</text>
  <text x="605" y="263" text-anchor="middle" font-size="10.5" fill="#1f7a38">반납 → 다른 요청이 그 캐리어를 사용</text>

  <text x="605" y="295" text-anchor="middle" font-size="10.5" fill="#1f7a38">메모리: 가상 스레드 1개당 수백 바이트대(가벼움)</text>
  <text x="605" y="312" text-anchor="middle" font-size="10.5" fill="#1f7a38">→ I/O 대기 비중이 클수록 이득이 커짐</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2fa84f"/>
    </marker>
  </defs>

  <text x="400" y="420" text-anchor="middle" font-size="11.5" fill="#555">이 구조 차이가 벤치마크 결과로 드러나는 지점은 &quot;동시 요청 수&quot;와 &quot;I/O 대기 비율&quot;이 커질 때다</text>
</svg>
