<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrowB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">MCP Apps — 도구 호출 결과가 샌드박스 UI로 렌더링되는 흐름</text>

  <rect x="30" y="56" width="180" height="64" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.8"/>
  <text x="120" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#312e81">MCP 서버</text>
  <text x="120" y="96" text-anchor="middle" font-size="8" fill="#3730a3">도구 실행 +</text>
  <text x="120" y="108" text-anchor="middle" font-size="8" fill="#3730a3">ui:// 리소스 선언</text>

  <line x1="210" y1="88" x2="290" y2="88" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="250" y="78" text-anchor="middle" font-size="7.5" fill="#4b5563">결과 JSON + ui:// 참조</text>

  <rect x="290" y="56" width="220" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="400" y="80" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">호스트</text>
  <text x="400" y="96" text-anchor="middle" font-size="8" fill="#065f46">(Claude / ChatGPT / VS Code)</text>
  <text x="400" y="108" text-anchor="middle" font-size="8" fill="#065f46">ui:// 리소스 로드 + CSP 적용</text>

  <line x1="400" y1="120" x2="400" y2="160" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="470" y="144" text-anchor="middle" font-size="7.5" fill="#4b5563">샌드박스 iframe에 렌더링</text>

  <rect x="280" y="160" width="240" height="64" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="400" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c2d12">샌드박스 iframe (UI)</text>
  <text x="400" y="200" text-anchor="middle" font-size="8" fill="#9a3412">deny-by-default: 네트워크·쿠키 차단</text>
  <text x="400" y="213" text-anchor="middle" font-size="8" fill="#9a3412">선언된 권한만 예외적으로 허용</text>

  <line x1="400" y1="224" x2="400" y2="262" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <text x="520" y="248" text-anchor="middle" font-size="7.5" fill="#4b5563">사용자 조작(필터·정렬·선택)</text>

  <rect x="280" y="262" width="240" height="56" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.8"/>
  <text x="400" y="284" text-anchor="middle" font-size="10" font-weight="bold" fill="#581c87">postMessage 브리지</text>
  <text x="400" y="300" text-anchor="middle" font-size="8" fill="#6b21a8">JSON-RPC 형식으로 호스트에 요청</text>

  <line x1="280" y1="290" x2="220" y2="290" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <line x1="220" y1="290" x2="220" y2="150" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="220" y1="150" x2="290" y2="88" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowB)" stroke-dasharray="4,3"/>

  <rect x="30" y="262" width="210" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="135" y="284" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">사용자 동의 게이트</text>
  <text x="135" y="300" text-anchor="middle" font-size="8" fill="#991b1b">UI에서 나가는 재호출은</text>
  <text x="135" y="313" text-anchor="middle" font-size="8" fill="#991b1b">호스트가 한 번 더 확인</text>
  <text x="135" y="326" text-anchor="middle" font-size="8" fill="#991b1b">(결제·삭제 등 상태 변경 시 필수)</text>

  <line x1="135" y1="262" x2="280" y2="230" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3,3"/>

  <text x="400" y="400" text-anchor="middle" font-size="9" fill="#4b5563">핵심: iframe은 MCP 서버에 직접 접속하지 않는다 — 항상 호스트를 거친다</text>
  <text x="400" y="418" text-anchor="middle" font-size="9" fill="#4b5563">호스트 미지원 환경을 위한 텍스트 폴백 경로를 도구 메타데이터에 함께 선언</text>
</svg>
