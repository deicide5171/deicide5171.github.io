<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; }
    .boxBad { fill: #fff0f0; stroke: #d9534f; stroke-width: 2; }
    .boxGood { fill: #f0f7f4; stroke: #2e8b57; stroke-width: 2; }
    .boxFast { fill: #eef3fb; stroke: #3b6fb0; stroke-width: 2; }
    .label { font-size: 13px; fill: #222222; text-anchor: middle; }
    .sublabel { font-size: 11px; fill: #555555; text-anchor: middle; }
    .arrow { stroke: #666666; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .title { font-size: 15px; font-weight: bold; fill: #222222; }
    .badtext { font-size: 12px; fill: #b02a2a; text-anchor: middle; }
    .goodtext { font-size: 12px; fill: #1f6b42; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666666" />
    </marker>
  </defs>

  <text x="20" y="28" class="title">① 기존 방식 — 녹음 후 비동기 요약 (단일 경로)</text>

  <rect x="20" y="45" width="110" height="46" class="box" />
  <text x="75" y="72" class="label">회의 오디오</text>

  <rect x="170" y="45" width="140" height="46" class="boxBad" />
  <text x="240" y="68" class="label">회의 종료까지</text>
  <text x="240" y="83" class="sublabel">전사만 축적</text>

  <rect x="350" y="45" width="140" height="46" class="box" />
  <text x="420" y="68" class="label">LLM 요약 1회 호출</text>
  <text x="420" y="83" class="sublabel">회의 종료 후</text>

  <rect x="530" y="45" width="130" height="46" class="box" />
  <text x="595" y="72" class="label">요약 텍스트 전달</text>

  <line x1="130" y1="68" x2="168" y2="68" class="arrow" />
  <line x1="310" y1="68" x2="348" y2="68" class="arrow" />
  <line x1="490" y1="68" x2="528" y2="68" class="arrow" />
  <text x="340" y="120" class="badtext">입력도 출력도 모두 회의가 끝나야 완성 — 실시간 개입 불가</text>

  <text x="20" y="180" class="title">② Claude Meetings — 실시간 경로 + 비동기 산출물 경로 분리</text>

  <rect x="20" y="200" width="110" height="46" class="box" />
  <text x="75" y="227" class="label">회의 참가자로 입장</text>

  <rect x="170" y="200" width="160" height="60" class="boxFast" />
  <text x="250" y="222" class="label">실시간 경로</text>
  <text x="250" y="238" class="sublabel">오디오·화면 스트림</text>
  <text x="250" y="252" class="sublabel">상태 패널 즉시 갱신</text>

  <rect x="170" y="280" width="160" height="60" class="boxGood" />
  <text x="250" y="302" class="label">비동기 산출물 경로</text>
  <text x="250" y="318" class="sublabel">맥락 누적 후</text>
  <text x="250" y="332" class="sublabel">문서·화이트보드 생성</text>

  <rect x="370" y="210" width="150" height="40" class="box" />
  <text x="445" y="235" class="label">참가자가 보는 상태창</text>

  <rect x="370" y="280" width="150" height="60" class="boxGood" />
  <text x="445" y="302" class="label">실시간 공동 편집</text>
  <text x="445" y="318" class="sublabel">문서/화이트보드</text>
  <text x="445" y="332" class="sublabel">회의 중에도 수정 가능</text>

  <rect x="560" y="245" width="150" height="46" class="boxBad" />
  <text x="635" y="267" class="label">호스트 승인 게이트</text>
  <text x="635" y="282" class="sublabel">신뢰 경계</text>

  <line x1="130" y1="223" x2="168" y2="225" class="arrow" />
  <line x1="130" y1="223" x2="168" y2="305" class="arrow" />
  <line x1="330" y1="230" x2="368" y2="230" class="arrow" />
  <line x1="330" y1="310" x2="368" y2="310" class="arrow" />

  <text x="635" y="340" class="goodtext">지연시간 우선 경로와</text>
  <text x="635" y="358" class="goodtext">정확성 우선 경로가</text>
  <text x="635" y="376" class="goodtext">서로 다른 리듬으로 공존</text>

</svg>
