<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">공간 인덱스(R-tree)의 경계 상자</text>

  <!-- big map area -->
  <rect x="80" y="70" width="640" height="300" fill="#fbfbfb" stroke="#ccc" stroke-width="1.5"/>

  <!-- bounding box A (contains points) -->
  <rect x="120" y="110" width="200" height="150" fill="none" stroke="#4a90d9" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="130" y="128" font-family="sans-serif" font-size="12" fill="#1a4a7a">경계상자 A</text>
  <circle cx="160" cy="160" r="4" fill="#888"/>
  <circle cx="220" cy="200" r="4" fill="#888"/>
  <circle cx="280" cy="150" r="4" fill="#888"/>
  <circle cx="190" cy="230" r="4" fill="#888"/>

  <!-- bounding box B (contains search + points) -->
  <rect x="380" y="130" width="240" height="180" fill="none" stroke="#03c75a" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="390" y="148" font-family="sans-serif" font-size="12" fill="#0a5a30">경계상자 B</text>
  <circle cx="440" cy="200" r="4" fill="#888"/>
  <circle cx="520" cy="240" r="4" fill="#888"/>
  <circle cx="560" cy="180" r="4" fill="#888"/>

  <!-- search circle inside B -->
  <circle cx="500" cy="220" r="55" fill="#e05252" opacity="0.15" stroke="#e05252" stroke-width="2"/>
  <circle cx="500" cy="220" r="5" fill="#e05252"/>
  <text x="500" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c0392b">검색 영역(반경)</text>

  <!-- skip label for A -->
  <text x="220" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4a90d9">검색 영역과 안 겹침 → 통째로 스킵</text>

  <text x="400" y="405" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">겹치는 상자 B만 파고들어 후보를 좁힌 뒤 정밀 판정한다 (전체 스캔 회피)</text>
</svg>
