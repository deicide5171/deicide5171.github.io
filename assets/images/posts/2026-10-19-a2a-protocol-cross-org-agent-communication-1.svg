<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">내부 호출과 조직 경계 호출을 나누는 설계</text>

  <rect x="40" y="70" width="320" height="180" rx="10" fill="#eef1fb" stroke="#4a5fc1" stroke-width="1.5"/>
  <text x="200" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a3680">우리 조직 (신뢰 경계 안쪽)</text>
  <rect x="60" y="110" width="120" height="50" rx="6" fill="#ffffff" stroke="#4a5fc1"/>
  <text x="120" y="140" text-anchor="middle" font-size="12" fill="#2a3680">오케스트레이터</text>
  <rect x="210" y="110" width="120" height="50" rx="6" fill="#ffffff" stroke="#4a5fc1"/>
  <text x="270" y="133" text-anchor="middle" font-size="12" fill="#2a3680">서브에이전트</text>
  <text x="270" y="150" text-anchor="middle" font-size="11" fill="#2a3680">(직접 호출/MCP)</text>
  <path d="M180,135 L210,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="200" y="225" text-anchor="middle" font-size="12" fill="#2a3680">내부 호출 — A2A 불필요</text>

  <line x1="400" y1="60" x2="400" y2="400" stroke="#999999" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="400" y="420" text-anchor="middle" font-size="13" fill="#555555">신뢰 경계 — A2A가 담당하는 지점</text>

  <rect x="440" y="70" width="320" height="180" rx="10" fill="#fdf2e9" stroke="#d98a3d" stroke-width="1.5"/>
  <text x="600" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a4a12">파트너 조직 (신뢰 경계 바깥)</text>
  <rect x="460" y="110" width="280" height="50" rx="6" fill="#ffffff" stroke="#d98a3d"/>
  <text x="600" y="133" text-anchor="middle" font-size="12" fill="#7a4a12">파트너 에이전트</text>
  <text x="600" y="150" text-anchor="middle" font-size="11" fill="#7a4a12">Agent Card 공개 (서명 포함)</text>
  <rect x="460" y="180" width="280" height="50" rx="6" fill="#ffffff" stroke="#d98a3d"/>
  <text x="600" y="203" text-anchor="middle" font-size="12" fill="#7a4a12">Task 위임 · 상태 추적</text>
  <text x="600" y="220" text-anchor="middle" font-size="11" fill="#7a4a12">(A2A JSON-RPC / gRPC)</text>

  <path d="M330,180 L440,180" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="385" y="170" text-anchor="middle" font-size="12" fill="#333333">A2A</text>
</svg>
