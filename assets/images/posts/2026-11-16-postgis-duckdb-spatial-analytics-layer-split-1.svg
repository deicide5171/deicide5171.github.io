<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">PostGIS 직접 쿼리 vs GeoParquet 경유 DuckDB Spatial 분석 경로</text>

  <!-- Path 1: direct query -->
  <text x="40" y="60" font-size="12" font-weight="bold" fill="#1e3a8a">경로 1 — 대시보드가 PostGIS를 직접 쿼리</text>

  <rect x="40" y="75" width="150" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="102" text-anchor="middle" font-size="11" fill="#1e3a8a">주문·매장 쓰기</text>

  <rect x="230" y="75" width="150" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="305" y="102" text-anchor="middle" font-size="11" fill="#1e3a8a">PostGIS (OLTP)</text>

  <rect x="420" y="75" width="150" height="45" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="495" y="95" text-anchor="middle" font-size="10" fill="#9a3412">분석 쿼리 직접 실행</text>
  <text x="495" y="110" text-anchor="middle" font-size="10" fill="#9a3412">트랜잭션과 자원 경쟁</text>

  <rect x="610" y="75" width="150" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="685" y="102" text-anchor="middle" font-size="11" fill="#1e3a8a">대시보드(실시간)</text>

  <line x1="190" y1="97" x2="230" y2="97" stroke="#64748b" stroke-width="2"/>
  <line x1="380" y1="97" x2="420" y2="97" stroke="#64748b" stroke-width="2"/>
  <line x1="570" y1="97" x2="610" y2="97" stroke="#64748b" stroke-width="2"/>

  <!-- Path 2: separated -->
  <text x="40" y="190" font-size="12" font-weight="bold" fill="#166534">경로 2 — GeoParquet 내보내기 + DuckDB Spatial 분리</text>

  <rect x="40" y="205" width="150" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="232" text-anchor="middle" font-size="11" fill="#1e3a8a">주문·매장 쓰기</text>

  <rect x="230" y="205" width="150" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="305" y="232" text-anchor="middle" font-size="11" fill="#1e3a8a">PostGIS (OLTP)</text>

  <rect x="420" y="205" width="150" height="45" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="495" y="225" text-anchor="middle" font-size="10" fill="#166534">증분 내보내기</text>
  <text x="495" y="240" text-anchor="middle" font-size="10" fill="#166534">GeoParquet → S3</text>

  <rect x="610" y="205" width="150" height="45" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="685" y="225" text-anchor="middle" font-size="10" fill="#166534">DuckDB Spatial</text>
  <text x="685" y="240" text-anchor="middle" font-size="10" fill="#166534">격리된 분석 엔진</text>

  <line x1="190" y1="227" x2="230" y2="227" stroke="#64748b" stroke-width="2"/>
  <line x1="380" y1="227" x2="420" y2="227" stroke="#64748b" stroke-width="2"/>
  <line x1="570" y1="227" x2="610" y2="227" stroke="#64748b" stroke-width="2"/>

  <rect x="610" y="270" width="150" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="685" y="295" text-anchor="middle" font-size="11" fill="#1e3a8a">대시보드(지연)</text>
  <line x1="685" y1="250" x2="685" y2="270" stroke="#64748b" stroke-width="2"/>

  <rect x="40" y="345" width="720" height="75" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="400" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">트레이드오프: 경로1은 데이터가 항상 최신이지만 트랜잭션 부하를 나눠 짊</text>
  <text x="400" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">경로2는 완전히 격리되지만 내보내기 주기만큼 데이터가 지연된다</text>
  <text x="400" y="406" text-anchor="middle" font-size="10" fill="#64748b">신선도 요구(실시간 운영 vs 입점 검토 리포트)를 먼저 정해야 경로를 고를 수 있다</text>

</svg>
