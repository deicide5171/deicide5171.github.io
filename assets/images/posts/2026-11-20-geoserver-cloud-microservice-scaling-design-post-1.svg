<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; }
    .boxBad { fill: #fff0f0; stroke: #d9534f; stroke-width: 2; }
    .boxGood { fill: #f0f7f4; stroke: #2e8b57; stroke-width: 2; }
    .boxShared { fill: #fdf6e3; stroke: #b08900; stroke-width: 2; }
    .label { font-size: 13px; fill: #222222; text-anchor: middle; }
    .sublabel { font-size: 11px; fill: #555555; text-anchor: middle; }
    .arrow { stroke: #666666; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .title { font-size: 15px; font-weight: bold; fill: #222222; }
    .badtext { font-size: 12px; fill: #b02a2a; text-anchor: middle; }
    .goodtext { font-size: 12px; fill: #1f6b42; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666666" />
    </marker>
  </defs>

  <text x="20" y="28" class="title">① 모놀리식 GeoServer — 단일 JVM 안에서 자원 공유</text>

  <rect x="20" y="45" width="100" height="40" class="box" />
  <text x="70" y="69" class="label">클라이언트 요청</text>

  <rect x="160" y="40" width="320" height="90" class="boxBad" />
  <text x="320" y="60" class="label">단일 GeoServer 인스턴스(JVM)</text>
  <text x="240" y="80" class="sublabel">WMS</text>
  <text x="290" y="80" class="sublabel">WFS</text>
  <text x="340" y="80" class="sublabel">WCS</text>
  <text x="390" y="80" class="sublabel">REST</text>
  <text x="320" y="100" class="sublabel">같은 스레드 풀 · 같은 힙 메모리</text>
  <text x="320" y="115" class="sublabel">WFS 대용량 쿼리 → WMS 타일링까지 지연</text>

  <rect x="540" y="45" width="130" height="40" class="boxShared" />
  <text x="605" y="69" class="label">PostGIS / 파일 스토어</text>

  <line x1="120" y1="65" x2="158" y2="75" class="arrow" />
  <line x1="480" y1="85" x2="538" y2="65" class="arrow" />
  <text x="320" y="150" class="badtext">서비스 종류와 무관하게 하나의 장애가 전체로 번짐</text>

  <text x="20" y="210" class="title">② GeoServer Cloud — 게이트웨이·디스커버리로 서비스 분리</text>

  <rect x="20" y="230" width="100" height="40" class="box" />
  <text x="70" y="254" class="label">클라이언트 요청</text>

  <rect x="150" y="225" width="100" height="50" class="boxGood" />
  <text x="200" y="248" class="label">게이트웨이</text>
  <text x="200" y="263" class="sublabel">라우팅</text>

  <rect x="150" y="290" width="100" height="40" class="boxGood" />
  <text x="200" y="314" class="label">디스커버리</text>

  <rect x="290" y="200" width="90" height="40" class="boxGood" />
  <text x="335" y="224" class="label">WMS 서비스</text>
  <rect x="290" y="250" width="90" height="40" class="boxBad" />
  <text x="335" y="274" class="label">WFS 서비스</text>
  <rect x="290" y="300" width="90" height="40" class="box" />
  <text x="335" y="324" class="label">WCS/REST/GWC</text>

  <rect x="540" y="245" width="130" height="40" class="boxShared" />
  <text x="605" y="269" class="label">PostGIS / 파일 스토어</text>

  <line x1="120" y1="250" x2="148" y2="250" class="arrow" />
  <line x1="250" y1="235" x2="288" y2="220" class="arrow" />
  <line x1="250" y1="245" x2="288" y2="270" class="arrow" />
  <line x1="250" y1="275" x2="288" y2="310" class="arrow" />
  <line x1="380" y1="220" x2="538" y2="255" class="arrow" />
  <line x1="380" y1="270" x2="538" y2="260" class="arrow" />
  <line x1="380" y1="320" x2="538" y2="270" class="arrow" />

  <text x="605" y="320" class="goodtext">애플리케이션 계층(CPU·메모리)은</text>
  <text x="605" y="337" class="goodtext">서비스별로 격리되지만</text>
  <text x="605" y="354" class="badtext">데이터 계층은 여전히 공유 자원</text>

</svg>
