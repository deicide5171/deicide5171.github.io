<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">MapLibre GL JS 렌더 루프에 CustomLayerInterface로 Three.js 레이어 삽입</text>

  <!-- Left: MapLibre render stack -->
  <rect x="40" y="65" width="260" height="330" rx="10" fill="#f5f7fa" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="90" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#334155">MapLibre GL JS 렌더 스택</text>

  <rect x="60" y="105" width="220" height="48" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="170" y="125" text-anchor="middle" font-size="13" fill="#1e3a8a">배경 / 래스터 타일 레이어</text>
  <text x="170" y="142" text-anchor="middle" font-size="11" fill="#3b5a9a">background, raster</text>

  <rect x="60" y="163" width="220" height="48" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="170" y="183" text-anchor="middle" font-size="13" fill="#1e3a8a">벡터 레이어 (fill/line/symbol)</text>
  <text x="170" y="200" text-anchor="middle" font-size="11" fill="#3b5a9a">vector tile 기반</text>

  <rect x="60" y="221" width="220" height="58" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="170" y="243" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#92400e">Custom Layer</text>
  <text x="170" y="260" text-anchor="middle" font-size="11" fill="#92400e">type: "custom" · render(gl, matrix)</text>
  <text x="170" y="274" text-anchor="middle" font-size="10.5" fill="#a86b1f">← Three.js 렌더러가 여기 끼어듦</text>

  <rect x="60" y="289" width="220" height="48" rx="6" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="170" y="309" text-anchor="middle" font-size="13" fill="#1e3a8a">심볼 / 레이블 레이어</text>
  <text x="170" y="326" text-anchor="middle" font-size="11" fill="#3b5a9a">POI, 텍스트</text>

  <text x="170" y="365" text-anchor="middle" font-size="12" fill="#475569">각 프레임마다 이 순서로</text>
  <text x="170" y="381" text-anchor="middle" font-size="12" fill="#475569">위에서 아래로 그려짐</text>

  <!-- Arrow from custom layer box to right side -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
  </defs>
  <path d="M280,250 L360,250" stroke="#f59e0b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="320" y="240" text-anchor="middle" font-size="10.5" fill="#92400e">gl 컨텍스트 공유</text>

  <!-- Right: Three.js scene box -->
  <rect x="370" y="105" width="390" height="175" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="565" y="130" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#065f46">Three.js Scene (같은 WebGL 컨텍스트)</text>

  <rect x="390" y="145" width="160" height="55" rx="6" fill="#ffffff" stroke="#34d399"/>
  <text x="470" y="167" text-anchor="middle" font-size="12" fill="#065f46">Camera</text>
  <text x="470" y="184" text-anchor="middle" font-size="10.5" fill="#0d7a5f">matrix(Mercator)로</text>
  <text x="470" y="197" text-anchor="middle" font-size="10.5" fill="#0d7a5f">projectionMatrix 갱신</text>

  <rect x="570" y="145" width="160" height="55" rx="6" fill="#ffffff" stroke="#34d399"/>
  <text x="650" y="167" text-anchor="middle" font-size="12" fill="#065f46">3D Mesh / Model</text>
  <text x="650" y="184" text-anchor="middle" font-size="10.5" fill="#0d7a5f">지도 좌표계에 맞춰</text>
  <text x="650" y="197" text-anchor="middle" font-size="10.5" fill="#0d7a5f">위치·회전 배치</text>

  <path d="M470,200 L470,222" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M650,200 L650,222" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>

  <rect x="390" y="225" width="340" height="42" rx="6" fill="#d1fae5" stroke="#10b981"/>
  <text x="560" y="250" text-anchor="middle" font-size="12" fill="#065f46">renderer.render(scene, camera) → gl에 직접 드로우콜</text>

  <!-- bottom flow: per-frame sequence -->
  <rect x="40" y="405" width="720" height="35" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="400" y="428" text-anchor="middle" font-size="11.5" fill="#334155">프레임마다: MapLibre가 카메라 행렬 계산 → render(gl, matrix) 호출 → Three.js가 그 행렬로 투영 후 gl에 그림 → MapLibre가 남은 레이어 이어서 렌더</text>
</svg>
