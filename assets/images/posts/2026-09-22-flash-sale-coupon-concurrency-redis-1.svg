<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">선착순 쿠폰 발급 흐름</text>

  <text x="130" y="70" text-anchor="middle" font-size="13" fill="#555">동시 요청 폭주</text>
  <circle cx="80" cy="100" r="14" fill="#e05a5a" fill-opacity="0.7"/>
  <circle cx="120" cy="90" r="14" fill="#e05a5a" fill-opacity="0.7"/>
  <circle cx="160" cy="105" r="14" fill="#e05a5a" fill-opacity="0.7"/>
  <circle cx="100" cy="120" r="14" fill="#e05a5a" fill-opacity="0.7"/>
  <circle cx="140" cy="125" r="14" fill="#e05a5a" fill-opacity="0.7"/>
  <text x="120" y="160" text-anchor="middle" font-size="12" fill="#888">수천~수만 건/초</text>

  <line x1="190" y1="110" x2="255" y2="110" stroke="#555" stroke-width="3" marker-end="url(#arrowC)"/>

  <rect x="260" y="65" width="180" height="100" rx="10" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="350" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#22345a">Redis</text>
  <text x="350" y="118" text-anchor="middle" font-size="12" fill="#333">DECR (재고 차감)</text>
  <text x="350" y="136" text-anchor="middle" font-size="12" fill="#333">SADD (중복 방지)</text>
  <text x="350" y="154" text-anchor="middle" font-size="11" fill="#888">원자적 · 밀리초 응답</text>

  <line x1="440" y1="90" x2="500" y2="90" stroke="#2f9e58" stroke-width="3" marker-end="url(#arrowC)"/>
  <text x="470" y="80" text-anchor="middle" font-size="11" fill="#2f9e58">성공</text>
  <line x1="440" y1="140" x2="500" y2="140" stroke="#e05a5a" stroke-width="3" marker-end="url(#arrowC)"/>
  <text x="470" y="160" text-anchor="middle" font-size="11" fill="#e05a5a">실패(소진)</text>

  <rect x="505" y="60" width="130" height="55" rx="8" fill="#eef8ef" stroke="#2f9e58" stroke-width="2"/>
  <text x="570" y="92" text-anchor="middle" font-size="12" fill="#1f5c34">즉시 "당첨" 응답</text>

  <rect x="505" y="125" width="130" height="55" rx="8" fill="#fdeeee" stroke="#e05a5a" stroke-width="2"/>
  <text x="570" y="157" text-anchor="middle" font-size="12" fill="#8a2e2e">즉시 "실패" 응답</text>

  <line x1="570" y1="115" x2="570" y2="215" stroke="#888" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="500" y1="215" x2="700" y2="215" stroke="#888" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="500" y1="215" x2="500" y2="270" stroke="#555" stroke-width="3" marker-end="url(#arrowC)"/>

  <rect x="380" y="275" width="170" height="70" rx="10" fill="#fff7f0" stroke="#f0a04b" stroke-width="2"/>
  <text x="465" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a1e">메시지 큐</text>
  <text x="465" y="325" text-anchor="middle" font-size="11" fill="#5a4632">비동기 적재 (당첨자만)</text>

  <line x1="465" y1="345" x2="465" y2="380" stroke="#555" stroke-width="3" marker-end="url(#arrowC)"/>

  <rect x="365" y="385" width="200" height="55" rx="10" fill="#f6f9fc" stroke="#c8d6e5" stroke-width="2"/>
  <text x="465" y="418" text-anchor="middle" font-size="13" fill="#22345a">DB 발급 이력 순차 기록</text>

  <defs>
    <marker id="arrowC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
