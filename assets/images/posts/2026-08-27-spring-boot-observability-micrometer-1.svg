<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">Micrometer로 메트릭·로그·트레이스 연결하기</text>

  <rect x="40" y="70" width="200" height="60" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="140" y="95" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">애플리케이션 코드</text>
  <text x="140" y="114" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#666">Counter/Timer/Gauge 계측</text>

  <line x1="240" y1="100" x2="300" y2="100" stroke="#8aa5c4" stroke-width="2"/>
  <polygon points="300,100 290,95 290,105" fill="#8aa5c4"/>

  <rect x="300" y="70" width="180" height="60" rx="8" fill="#ffffff" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="390" y="95" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">MeterRegistry</text>
  <text x="390" y="114" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#666">벤더 중립 파사드</text>

  <line x1="480" y1="100" x2="540" y2="100" stroke="#8aa5c4" stroke-width="2"/>
  <polygon points="540,100 530,95 530,105" fill="#8aa5c4"/>

  <rect x="540" y="70" width="220" height="60" rx="8" fill="#eef8f1" stroke="#2e9e63" stroke-width="2"/>
  <text x="650" y="95" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a6b45">Prometheus 등 백엔드</text>
  <text x="650" y="114" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444">/actuator/prometheus</text>

  <!-- 두번째 레인: 트레이싱 -->
  <line x1="140" y1="130" x2="140" y2="180" stroke="#c98a3d" stroke-width="2"/>
  <polygon points="140,188 133,175 147,175" fill="#c98a3d"/>

  <rect x="40" y="190" width="200" height="60" rx="8" fill="#fdf6ec" stroke="#c98a3d" stroke-width="1.5"/>
  <text x="140" y="215" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#a3611c">Micrometer Tracing</text>
  <text x="140" y="234" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#666">trace id / span id 생성</text>

  <line x1="240" y1="220" x2="300" y2="220" stroke="#d8b877" stroke-width="2"/>
  <polygon points="300,220 290,215 290,225" fill="#d8b877"/>

  <rect x="300" y="190" width="180" height="60" rx="8" fill="#ffffff" stroke="#c98a3d" stroke-width="1.5"/>
  <text x="390" y="215" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#a3611c">로그 MDC</text>
  <text x="390" y="234" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#666">%X{traceId},%X{spanId}</text>

  <line x1="480" y1="220" x2="540" y2="220" stroke="#d8b877" stroke-width="2"/>
  <polygon points="540,220 530,215 530,225" fill="#d8b877"/>

  <rect x="540" y="190" width="220" height="60" rx="8" fill="#fdf1f0" stroke="#d0413b" stroke-width="1.5"/>
  <text x="650" y="215" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#a13a34">분산 트레이싱 백엔드</text>
  <text x="650" y="234" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#444">Zipkin/OTel 등</text>

  <text x="400" y="310" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">메트릭에서 이상 신호를 발견하면 같은 시각의 로그를 trace id로 필터링해</text>
  <text x="400" y="330" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">해당 요청의 분산 트레이스까지 바로 이어서 조사할 수 있다</text>

  <text x="400" y="400" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">주의: user_id·request_id 같은 고카디널리티 값은 메트릭 태그가 아니라 로그·트레이스에만 남긴다</text>
</svg>
