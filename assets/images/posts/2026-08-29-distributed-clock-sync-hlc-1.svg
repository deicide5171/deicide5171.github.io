<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="32" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">HLC vs TrueTime — 분산 시간 동기화 두 접근</text>

  <!-- HLC 섹션 -->
  <text x="40" y="64" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a6b45">HLC — 논리 카운터로 보정</text>
  <rect x="40" y="76" width="340" height="150" rx="8" fill="#eef8f1" stroke="#a8d8b8"/>

  <text x="60" y="100" font-family="sans-serif" font-size="12" fill="#333">노드 A</text>
  <rect x="60" y="106" width="120" height="34" rx="5" fill="#ffffff" stroke="#2e9e63"/>
  <text x="120" y="127" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">(100, 0)</text>

  <text x="230" y="100" font-family="sans-serif" font-size="12" fill="#333">노드 B</text>
  <rect x="230" y="106" width="120" height="34" rx="5" fill="#ffffff" stroke="#2e9e63"/>
  <text x="290" y="127" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">(98, 0)</text>

  <line x1="180" y1="123" x2="226" y2="123" stroke="#2e9e63" stroke-width="1.5"/>
  <polygon points="226,123 217,118 217,128" fill="#2e9e63"/>
  <text x="203" y="115" font-family="sans-serif" font-size="10" fill="#5b9a72" text-anchor="middle">메시지</text>

  <text x="60" y="164" font-family="sans-serif" font-size="12" fill="#333">B 수신 후 갱신</text>
  <rect x="60" y="170" width="290" height="34" rx="5" fill="#ffffff" stroke="#2e9e63" stroke-width="2"/>
  <text x="205" y="191" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">max(로컬, 자신, 수신) = (100, 1)</text>

  <text x="60" y="212" font-family="sans-serif" font-size="11" fill="#5b9a72">→ 물리 시각이 같으면 논리 카운터로 순서를 세분화</text>

  <!-- TrueTime 섹션 -->
  <text x="420" y="64" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3a6ea5">TrueTime — 불확실성 구간 + 대기</text>
  <rect x="420" y="76" width="340" height="150" rx="8" fill="#eef4fb" stroke="#b9cfe8"/>

  <text x="440" y="100" font-family="sans-serif" font-size="12" fill="#333">TT.now() 호출 결과</text>
  <rect x="440" y="108" width="300" height="30" rx="5" fill="#ffffff" stroke="#4a7ab5"/>
  <text x="590" y="128" font-family="sans-serif" font-size="12" fill="#3a6ea5" text-anchor="middle">[earliest, latest] 구간으로 응답</text>

  <line x1="450" y1="160" x2="730" y2="160" stroke="#8aa5c4" stroke-width="2"/>
  <line x1="450" y1="153" x2="450" y2="167" stroke="#4a7ab5" stroke-width="2"/>
  <line x1="620" y1="153" x2="620" y2="167" stroke="#4a7ab5" stroke-width="2"/>
  <text x="450" y="178" font-family="sans-serif" font-size="10" fill="#888" text-anchor="middle">earliest</text>
  <text x="620" y="178" font-family="sans-serif" font-size="10" fill="#888" text-anchor="middle">latest (ε 폭)</text>

  <text x="440" y="200" font-family="sans-serif" font-size="11" fill="#3a6ea5">커밋 시 ε만큼 대기(commit wait) 후 확정</text>
  <text x="440" y="216" font-family="sans-serif" font-size="10" fill="#888">→ 커밋 타임스탬프가 실제로 지나간 시각임을 보장</text>

  <line x1="60" y1="248" x2="740" y2="248" stroke="#ddd" stroke-width="1"/>

  <!-- 하단 비교 요약 -->
  <rect x="40" y="264" width="720" height="156" rx="8" fill="#f9f9f9" stroke="#ddd"/>
  <text x="60" y="288" font-family="sans-serif" font-size="13" fill="#333" font-weight="bold">차이 요약</text>
  <text x="60" y="312" font-family="sans-serif" font-size="12" fill="#555">· HLC: 물리 시각 + 논리 카운터, 일반 NTP 동기화로 충분, CockroachDB·MongoDB 등이 채택</text>
  <text x="60" y="334" font-family="sans-serif" font-size="12" fill="#555">· TrueTime: GPS·원자시계로 오차를 극소화, 커밋 대기로 순서 보장, Google Spanner가 채택</text>
  <text x="60" y="356" font-family="sans-serif" font-size="12" fill="#555">· HLC는 소프트웨어만으로 구현 가능하지만, TrueTime은 전용 하드웨어 인프라가 전제된다</text>
  <text x="60" y="378" font-family="sans-serif" font-size="12" fill="#555">· 두 방식 모두 목표는 동일: 인과관계가 있는 이벤트의 순서를 절대 뒤집지 않는 것</text>
  <text x="60" y="400" font-family="sans-serif" font-size="12" fill="#555">· 온프레미스 환경에서는 HLC 기반 오픈소스 DB가 현실적인 선택지</text>
</svg>
