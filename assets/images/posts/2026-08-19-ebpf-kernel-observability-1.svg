<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">eBPF 프로그램의 커널 훅(Hook) 구조</text>
  <text x="400" y="46" text-anchor="middle" font-size="11.5" fill="#666">애플리케이션 코드를 건드리지 않고 커널의 지정 지점에 프로그램을 안전하게 붙여 데이터를 수집한다</text>

  <!-- User space container -->
  <rect x="30" y="62" width="740" height="70" rx="8" fill="#eafaf0" stroke="#03a35d" stroke-width="1.5"/>
  <text x="46" y="80" font-size="12" font-weight="bold" fill="#03683c">사용자 공간 (User Space)</text>

  <rect x="46" y="88" width="230" height="36" rx="6" fill="#ffffff" stroke="#03a35d" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="161" y="110" text-anchor="middle" font-size="11.5" fill="#333">애플리케이션 (수정 없음)</text>

  <rect x="300" y="88" width="230" height="36" rx="6" fill="#ffffff" stroke="#03a35d" stroke-width="1.2"/>
  <text x="415" y="110" text-anchor="middle" font-size="11.5" fill="#333">관측 도구 (bpftrace · bcc · Cilium)</text>

  <rect x="554" y="88" width="200" height="36" rx="6" fill="#f5f0ff" stroke="#7c4fd6" stroke-width="1.2"/>
  <text x="654" y="103" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5a2fb0">로더 + 검증기 통과</text>
  <text x="654" y="117" text-anchor="middle" font-size="9.5" fill="#5a2fb0">(Verifier: 안전성 사전 검사)</text>

  <!-- syscall boundary -->
  <line x1="30" y1="145" x2="770" y2="145" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="400" y="140" text-anchor="middle" font-size="10" fill="#888">시스템 콜 경계 (bpf() syscall로 프로그램 적재)</text>

  <!-- Kernel space container -->
  <rect x="30" y="152" width="740" height="230" rx="8" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="46" y="170" font-size="12" font-weight="bold" fill="#1f3a7a">커널 공간 (Kernel Space)</text>

  <!-- Hook points row -->
  <g font-size="10.5">
    <rect x="46" y="182" width="160" height="50" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.2"/>
    <text x="126" y="200" text-anchor="middle" font-weight="bold" fill="#1f3a7a">kprobe / kretprobe</text>
    <text x="126" y="215" text-anchor="middle" fill="#555">커널 함수 진입·반환 시점</text>

    <rect x="222" y="182" width="160" height="50" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.2"/>
    <text x="302" y="200" text-anchor="middle" font-weight="bold" fill="#1f3a7a">tracepoint</text>
    <text x="302" y="215" text-anchor="middle" fill="#555">커널이 미리 정의한 이벤트</text>

    <rect x="398" y="182" width="160" height="50" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.2"/>
    <text x="478" y="200" text-anchor="middle" font-weight="bold" fill="#1f3a7a">syscall 진입/종료</text>
    <text x="478" y="215" text-anchor="middle" fill="#555">read·write·connect 등</text>

    <rect x="574" y="182" width="180" height="50" rx="6" fill="#ffffff" stroke="#3b6fd6" stroke-width="1.2"/>
    <text x="664" y="200" text-anchor="middle" font-weight="bold" fill="#1f3a7a">XDP / tc (네트워크 훅)</text>
    <text x="664" y="215" text-anchor="middle" fill="#555">NIC 드라이버 · 패킷 경로</text>
  </g>

  <!-- attach lines to eBPF program hexagon-like boxes -->
  <line x1="126" y1="232" x2="126" y2="252" stroke="#d97706" stroke-width="1.4"/>
  <line x1="302" y1="232" x2="302" y2="252" stroke="#d97706" stroke-width="1.4"/>
  <line x1="478" y1="232" x2="478" y2="252" stroke="#d97706" stroke-width="1.4"/>
  <line x1="664" y1="232" x2="664" y2="252" stroke="#d97706" stroke-width="1.4"/>

  <rect x="56" y="252" width="140" height="34" rx="16" fill="#fff2e0" stroke="#d97706" stroke-width="1.3"/>
  <text x="126" y="273" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a4b00">eBPF 프로그램</text>

  <rect x="232" y="252" width="140" height="34" rx="16" fill="#fff2e0" stroke="#d97706" stroke-width="1.3"/>
  <text x="302" y="273" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a4b00">eBPF 프로그램</text>

  <rect x="408" y="252" width="140" height="34" rx="16" fill="#fff2e0" stroke="#d97706" stroke-width="1.3"/>
  <text x="478" y="273" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a4b00">eBPF 프로그램</text>

  <rect x="594" y="252" width="140" height="34" rx="16" fill="#fff2e0" stroke="#d97706" stroke-width="1.3"/>
  <text x="664" y="273" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a4b00">eBPF 프로그램</text>

  <!-- lines down to shared maps -->
  <line x1="126" y1="286" x2="300" y2="322" stroke="#8a4b00" stroke-width="1.2"/>
  <line x1="302" y1="286" x2="330" y2="322" stroke="#8a4b00" stroke-width="1.2"/>
  <line x1="478" y1="286" x2="450" y2="322" stroke="#8a4b00" stroke-width="1.2"/>
  <line x1="664" y1="286" x2="480" y2="322" stroke="#8a4b00" stroke-width="1.2"/>

  <!-- eBPF Maps -->
  <rect x="290" y="322" width="200" height="42" rx="6" fill="#f5f0ff" stroke="#7c4fd6" stroke-width="1.4"/>
  <text x="390" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a2fb0">eBPF Maps</text>
  <text x="390" y="355" text-anchor="middle" font-size="9.5" fill="#5a2fb0">프로그램 간 · 커널-유저 공간 공유 자료구조</text>

  <!-- ring buffer -->
  <rect x="524" y="322" width="200" height="42" rx="6" fill="#f5f0ff" stroke="#7c4fd6" stroke-width="1.4"/>
  <text x="624" y="340" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a2fb0">Ring / Perf Buffer</text>
  <text x="624" y="355" text-anchor="middle" font-size="9.5" fill="#5a2fb0">이벤트를 유저 공간으로 스트리밍</text>

  <line x1="490" y1="343" x2="522" y2="343" stroke="#7c4fd6" stroke-width="1.4" marker-end="url(#arrowPurple)"/>

  <!-- arrow back up to observability tool -->
  <path d="M 624 322 C 624 260, 500 200, 415 126" fill="none" stroke="#7c4fd6" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#arrowPurple)"/>
  <text x="600" y="235" font-size="9.5" fill="#5a2fb0" transform="rotate(-52 600 235)">결과 전달</text>

  <text x="400" y="405" text-anchor="middle" font-size="10.5" fill="#555">애플리케이션 재컴파일·재배포 없이, 커널이 이미 지나가는 이벤트에 훅을 걸어 관측한다</text>
  <text x="400" y="422" text-anchor="middle" font-size="9.5" fill="#999">검증기(Verifier)가 루프·메모리 접근을 사전 검사해 커널 크래시 위험 없이 안전하게 적재한다</text>

  <defs>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c4fd6"/>
    </marker>
  </defs>
</svg>
