<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrowP" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Agent Teams — 리드 세션이 작업을 쪼개 worktree별로 격리하고 순차 병합</text>

  <rect x="320" y="44" width="160" height="44" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="400" y="62" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">리드 세션</text>
  <text x="400" y="76" text-anchor="middle" font-size="8" fill="#1e40af">공유 작업 목록 관리</text>

  <line x1="360" y1="88" x2="160" y2="128" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="400" y1="88" x2="400" y2="128" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <line x1="440" y1="88" x2="640" y2="128" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowP)"/>

  <rect x="80" y="128" width="160" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="160" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">팀원 A</text>
  <text x="160" y="164" text-anchor="middle" font-size="8" fill="#065f46">worktree: module-a</text>
  <text x="160" y="176" text-anchor="middle" font-size="8" fill="#065f46">branch: feature/a</text>

  <rect x="320" y="128" width="160" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="400" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">팀원 B</text>
  <text x="400" y="164" text-anchor="middle" font-size="8" fill="#065f46">worktree: module-b</text>
  <text x="400" y="176" text-anchor="middle" font-size="8" fill="#065f46">branch: feature/b</text>

  <rect x="560" y="128" width="160" height="56" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
  <text x="640" y="150" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#064e3b">팀원 C</text>
  <text x="640" y="164" text-anchor="middle" font-size="8" fill="#065f46">worktree: module-c</text>
  <text x="640" y="176" text-anchor="middle" font-size="8" fill="#065f46">branch: feature/c</text>

  <text x="400" y="204" text-anchor="middle" font-size="9" fill="#4b5563">각자 독립된 워킹 디렉터리 — 동시에 파일을 써도 서로 덮어쓰지 않음</text>

  <line x1="160" y1="184" x2="160" y2="226" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowP)"/>
  <line x1="400" y1="184" x2="400" y2="226" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowP)"/>
  <line x1="640" y1="184" x2="640" y2="226" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowP)"/>

  <rect x="80" y="226" width="160" height="36" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="160" y="248" text-anchor="middle" font-size="9" fill="#4c1d95">개별 CI 통과</text>

  <rect x="320" y="226" width="160" height="36" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="248" text-anchor="middle" font-size="9" fill="#4c1d95">개별 CI 통과</text>

  <rect x="560" y="226" width="160" height="36" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="640" y="248" text-anchor="middle" font-size="9" fill="#4c1d95">개별 CI 통과</text>

  <line x1="160" y1="262" x2="370" y2="300" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowP)"/>
  <line x1="400" y1="262" x2="400" y2="300" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowP)"/>
  <line x1="640" y1="262" x2="430" y2="300" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowP)"/>

  <rect x="260" y="300" width="280" height="50" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="400" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#78350f">순차 병합 (리드/사람이 순서 결정)</text>
  <text x="400" y="336" text-anchor="middle" font-size="8.5" fill="#92400e">한 번에 하나씩 — 동시 머지 금지</text>

  <line x1="400" y1="350" x2="400" y2="382" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowP)"/>

  <rect x="290" y="382" width="220" height="42" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="400" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e3a8a">메인 브랜치</text>

  <text x="60" y="410" font-size="8" fill="#9ca3af">공유 접점(공통 설정·인터페이스)은</text>
  <text x="60" y="422" font-size="8" fill="#9ca3af">사전에 한 팀원에게만 전담시킨다</text>
</svg>
