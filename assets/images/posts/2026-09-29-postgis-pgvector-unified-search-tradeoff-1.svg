<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">"근처에서 '아이랑 가기 좋은 카페' 찾아주세요"</text>

  <!-- Left: unified -->
  <rect x="30" y="55" width="340" height="360" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="200" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e1b4b">통합형 — Postgres 한 대</text>

  <rect x="55" y="100" width="290" height="70" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="200" y="122" text-anchor="middle" font-size="12" fill="#312e81">places 테이블</text>
  <text x="200" y="140" text-anchor="middle" font-size="11" fill="#4338ca">geom geometry(Point,4326)</text>
  <text x="200" y="156" text-anchor="middle" font-size="11" fill="#4338ca">embedding vector(768)</text>

  <line x1="200" y1="170" x2="200" y2="195" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="55" y="195" width="290" height="80" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="200" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#312e81">한 번의 SQL 질의</text>
  <text x="200" y="238" text-anchor="middle" font-size="11" fill="#4338ca">GiST: ST_DWithin(geom, 반경)</text>
  <text x="200" y="256" text-anchor="middle" font-size="11" fill="#4338ca">HNSW: embedding &lt;=&gt; 질의벡터</text>

  <line x1="200" y1="275" x2="200" y2="300" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="55" y="300" width="290" height="55" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#064e3b">정렬·필터 결과 한 번에 반환</text>
  <text x="200" y="340" text-anchor="middle" font-size="11" fill="#065f46">트랜잭션 하나, 조인 불필요</text>

  <text x="200" y="385" text-anchor="middle" font-size="12" fill="#4338ca">장점: 정합성 · 단순함</text>
  <text x="200" y="403" text-anchor="middle" font-size="12" fill="#b91c1c">한계: 두 인덱스가 같은 서버 자원 경쟁</text>

  <!-- Right: separated -->
  <rect x="430" y="55" width="340" height="360" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="600" y="82" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c2d12">분리형 — 벡터DB + PostGIS</text>

  <rect x="450" y="100" width="130" height="60" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="515" y="125" text-anchor="middle" font-size="11" fill="#7c2d12">벡터 전용 DB</text>
  <text x="515" y="143" text-anchor="middle" font-size="11" fill="#7c2d12">(Pinecone 등)</text>

  <rect x="620" y="100" width="130" height="60" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="685" y="125" text-anchor="middle" font-size="11" fill="#7c2d12">PostGIS</text>
  <text x="685" y="143" text-anchor="middle" font-size="11" fill="#7c2d12">(공간 데이터)</text>

  <line x1="515" y1="160" x2="515" y2="195" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="685" y1="160" x2="685" y2="195" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="450" y="195" width="300" height="60" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="600" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">애플리케이션 레이어에서 조인</text>
  <text x="600" y="238" text-anchor="middle" font-size="11" fill="#9a3412">후보 top-K 받아 ID로 재필터링</text>

  <line x1="600" y1="255" x2="600" y2="300" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow3)"/>

  <rect x="450" y="300" width="300" height="55" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">결과 부족 위험</text>
  <text x="600" y="340" text-anchor="middle" font-size="11" fill="#991b1b">top-K 후보에 반경 안 매장이 없을 수도</text>

  <text x="600" y="385" text-anchor="middle" font-size="12" fill="#065f46">장점: 각 DB 전문 성능·독립 스케일링</text>
  <text x="600" y="403" text-anchor="middle" font-size="12" fill="#b91c1c">한계: 정합성·지연 이중 관리</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
  </defs>
</svg>
