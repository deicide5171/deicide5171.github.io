<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- click event -->
  <rect x="300" y="20" width="200" height="46" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="400" y="48" text-anchor="middle" font-size="15" fill="#1b3a73">클릭 (화면 픽셀 좌표)</text>

  <!-- split into two picking systems -->
  <rect x="80" y="110" width="280" height="60" rx="8" fill="#fff7f0" stroke="#e08a2e" stroke-width="2"/>
  <text x="220" y="134" text-anchor="middle" font-size="14" fill="#7a4310">three.js Raycaster</text>
  <text x="220" y="154" text-anchor="middle" font-size="11" fill="#7a4310">씬의 메시와 광선 교차 검사</text>

  <rect x="440" y="110" width="280" height="60" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="580" y="134" text-anchor="middle" font-size="14" fill="#15502f">OpenLayers forEachFeatureAtPixel</text>
  <text x="580" y="154" text-anchor="middle" font-size="11" fill="#15502f">벡터 피처 히트테스트</text>

  <line x1="400" y1="66" x2="220" y2="108" stroke="#555" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="400" y1="66" x2="580" y2="108" stroke="#555" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- priority layer -->
  <rect x="220" y="220" width="360" height="60" rx="8" fill="#f3f0ff" stroke="#6c4fd6" stroke-width="2"/>
  <text x="400" y="244" text-anchor="middle" font-size="15" fill="#3a2a73">우선순위 조정 레이어</text>
  <text x="400" y="264" text-anchor="middle" font-size="11" fill="#3a2a73">z-depth 비교 또는 고정 규칙</text>

  <line x1="220" y1="170" x2="340" y2="218" stroke="#555" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="580" y1="170" x2="460" y2="218" stroke="#555" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- result -->
  <rect x="250" y="330" width="300" height="55" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="2"/>
  <text x="400" y="354" text-anchor="middle" font-size="14" fill="#333333">팝업 — 올바른 대상 1개의 속성만 표시</text>
  <text x="400" y="372" text-anchor="middle" font-size="11" fill="#333333">3D 오브젝트 userData 또는 2D feature properties</text>

  <line x1="400" y1="280" x2="400" y2="328" stroke="#555" stroke-width="2" marker-end="url(#arrow4)"/>
</svg>
