<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#fafafa"/>

  <rect x="320" y="20" width="160" height="50" rx="8" fill="#2563eb"/>
  <text x="400" y="50" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">여행 예약 에이전트</text>

  <line x1="400" y1="70" x2="400" y2="110" stroke="#333" stroke-width="2"/>
  <text x="410" y="95" font-size="12" fill="#555">사용자 요청 해석</text>

  <rect x="60" y="115" width="320" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="220" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">MCP (Layer 1)</text>
  <text x="220" y="160" text-anchor="middle" font-size="12" fill="#333">"이 에이전트가 어떤 도구를 쓰는가"</text>
  <text x="220" y="176" text-anchor="middle" font-size="11" fill="#666">DB 조회 · 결제 API · 내부 캘린더</text>

  <rect x="420" y="115" width="320" height="70" rx="8" fill="#fef3f2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">A2A (Layer 2)</text>
  <text x="580" y="160" text-anchor="middle" font-size="12" fill="#333">"어떤 다른 에이전트에게 위임하는가"</text>
  <text x="580" y="176" text-anchor="middle" font-size="11" fill="#666">항공사 · 호텔 · 렌터카사 소유 에이전트</text>

  <line x1="220" y1="185" x2="220" y2="220" stroke="#4f46e5" stroke-width="2"/>
  <rect x="90" y="225" width="90" height="45" rx="6" fill="#c7d2fe"/>
  <text x="135" y="252" text-anchor="middle" font-size="11">내부 DB</text>
  <rect x="195" y="225" width="90" height="45" rx="6" fill="#c7d2fe"/>
  <text x="240" y="252" text-anchor="middle" font-size="11">결제 게이트웨이</text>
  <rect x="300" y="225" width="90" height="45" rx="6" fill="#c7d2fe"/>
  <text x="345" y="252" text-anchor="middle" font-size="11">사내 캘린더</text>
  <text x="220" y="290" text-anchor="middle" font-size="11" fill="#666">신뢰 경계: 같은 조직, 함수 호출처럼 동기적</text>

  <line x1="580" y1="185" x2="580" y2="220" stroke="#dc2626" stroke-width="2"/>
  <rect x="440" y="225" width="90" height="45" rx="6" fill="#fecaca"/>
  <text x="485" y="248" text-anchor="middle" font-size="11">항공사</text>
  <text x="485" y="262" text-anchor="middle" font-size="10">Agent Card</text>
  <rect x="545" y="225" width="90" height="45" rx="6" fill="#fecaca"/>
  <text x="590" y="248" text-anchor="middle" font-size="11">호텔사</text>
  <text x="590" y="262" text-anchor="middle" font-size="10">Agent Card</text>
  <rect x="650" y="225" width="90" height="45" rx="6" fill="#fecaca"/>
  <text x="695" y="248" text-anchor="middle" font-size="11">렌터카사</text>
  <text x="695" y="262" text-anchor="middle" font-size="10">Agent Card</text>
  <text x="580" y="290" text-anchor="middle" font-size="11" fill="#666">신뢰 경계: 다른 조직, 비동기 협상·승인 필요</text>

  <rect x="140" y="330" width="520" height="90" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">핵심 구분</text>
  <text x="400" y="378" text-anchor="middle" font-size="12" fill="#334155">MCP = 내가 소유·신뢰하는 자원에 대한 "함수 호출"</text>
  <text x="400" y="398" text-anchor="middle" font-size="12" fill="#334155">A2A = 내가 소유하지 않은 자율적 에이전트에 대한 "업무 위임"</text>
</svg>
