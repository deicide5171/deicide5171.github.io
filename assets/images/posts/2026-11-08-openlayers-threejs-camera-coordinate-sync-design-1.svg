<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- 사용자 조작 -->
  <rect x="300" y="20" width="200" height="46" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="400" y="48" text-anchor="middle" font-size="15" fill="#1b3a73">사용자: 줌 · 패닝 · 회전</text>

  <!-- OpenLayers View -->
  <rect x="280" y="100" width="240" height="60" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="400" y="124" text-anchor="middle" font-size="15" fill="#15502f">OpenLayers View (단일 진실)</text>
  <text x="400" y="144" text-anchor="middle" font-size="12" fill="#15502f">중심 · 해상도 · 회전</text>

  <!-- postrender event -->
  <rect x="300" y="195" width="200" height="40" rx="8" fill="#fdf6e3" stroke="#c9a227" stroke-width="2"/>
  <text x="400" y="220" text-anchor="middle" font-size="13" fill="#6b5a10">postrender 이벤트</text>

  <!-- 동기화 레이어 -->
  <rect x="250" y="265" width="300" height="60" rx="8" fill="#f3f0ff" stroke="#6c4fd6" stroke-width="2"/>
  <text x="400" y="289" text-anchor="middle" font-size="15" fill="#3a2a73">좌표 변환 · 동기화 레이어</text>
  <text x="400" y="309" text-anchor="middle" font-size="12" fill="#3a2a73">해상도 → 카메라 뷰 폭, 중심 → 카메라 위치</text>

  <!-- three.js camera -->
  <rect x="80" y="365" width="260" height="55" rx="8" fill="#fff7f0" stroke="#e08a2e" stroke-width="2"/>
  <text x="210" y="388" text-anchor="middle" font-size="14" fill="#7a4310">three.js OrthographicCamera</text>
  <text x="210" y="406" text-anchor="middle" font-size="11" fill="#7a4310">매 프레임 position·zoom·rotation 갱신</text>

  <!-- 3D object -->
  <rect x="460" y="365" width="260" height="55" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="2"/>
  <text x="590" y="388" text-anchor="middle" font-size="14" fill="#333333">3D 오브젝트 (EPSG:3857 고정)</text>
  <text x="590" y="406" text-anchor="middle" font-size="11" fill="#333333">씬 좌표를 다시 옮기지 않음</text>

  <!-- arrows -->
  <line x1="400" y1="66" x2="400" y2="98" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="400" y1="160" x2="400" y2="193" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="400" y1="235" x2="400" y2="263" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="340" y1="325" x2="220" y2="363" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="460" y1="325" x2="580" y2="363" stroke="#555" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="340" y1="392" x2="460" y2="392" stroke="#999" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow2)"/>
  <text x="400" y="384" text-anchor="middle" font-size="11" fill="#999999">같은 좌표계로 투영</text>
</svg>
