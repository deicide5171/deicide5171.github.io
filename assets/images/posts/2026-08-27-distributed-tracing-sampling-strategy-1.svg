<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">헤드 샘플링 vs 테일 샘플링 — 결정 시점의 차이</text>

  <!-- 헤드 샘플링 -->
  <text x="40" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="#5b7a9d">헤드 샘플링 — 트레이스 시작 시 결정</text>
  <rect x="40" y="84" width="90" height="46" rx="6" fill="#eef4fb" stroke="#4a7ab5" stroke-width="2"/>
  <text x="85" y="112" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222">요청 시작</text>
  <text x="85" y="146" font-family="sans-serif" font-size="11" fill="#d0413b" text-anchor="middle">여기서 확률로</text>
  <text x="85" y="160" font-family="sans-serif" font-size="11" fill="#d0413b" text-anchor="middle">저장 여부 결정</text>

  <line x1="130" y1="107" x2="200" y2="107" stroke="#8aa5c4" stroke-width="1.5"/>
  <rect x="200" y="84" width="90" height="46" rx="6" fill="#ffffff" stroke="#8aa5c4"/>
  <text x="245" y="112" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222">스팬 A</text>
  <line x1="290" y1="107" x2="360" y2="107" stroke="#8aa5c4" stroke-width="1.5"/>
  <rect x="360" y="84" width="90" height="46" rx="6" fill="#ffffff" stroke="#8aa5c4"/>
  <text x="405" y="112" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222">스팬 B</text>
  <line x1="450" y1="107" x2="520" y2="107" stroke="#8aa5c4" stroke-width="1.5"/>
  <rect x="520" y="84" width="90" height="46" rx="6" fill="#ffffff" stroke="#8aa5c4"/>
  <text x="565" y="112" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222">스팬 C</text>
  <line x1="610" y1="107" x2="660" y2="107" stroke="#8aa5c4" stroke-width="1.5"/>
  <polygon points="660,107 650,102 650,112" fill="#8aa5c4"/>
  <text x="700" y="112" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">결과 확인 전</text>
  <text x="700" y="126" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">(에러인지 모름)</text>

  <!-- 구분선 -->
  <line x1="40" y1="200" x2="760" y2="200" stroke="#e0e0e0" stroke-width="1"/>

  <!-- 테일 샘플링 -->
  <text x="40" y="236" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a6b45">테일 샘플링 — 트레이스 완료 후 결정</text>
  <rect x="40" y="250" width="90" height="46" rx="6" fill="#eef8f1" stroke="#2e9e63" stroke-width="1.5"/>
  <text x="85" y="278" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#222">요청 시작</text>

  <line x1="130" y1="273" x2="200" y2="273" stroke="#8aa5c4" stroke-width="1.5"/>
  <rect x="200" y="250" width="90" height="46" rx="6" fill="#ffffff" stroke="#8aa5c4"/>
  <text x="245" y="278" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222">스팬 A</text>
  <line x1="290" y1="273" x2="360" y2="273" stroke="#8aa5c4" stroke-width="1.5"/>
  <rect x="360" y="250" width="90" height="46" rx="6" fill="#ffffff" stroke="#8aa5c4"/>
  <text x="405" y="278" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222">스팬 B</text>
  <line x1="450" y1="273" x2="520" y2="273" stroke="#8aa5c4" stroke-width="1.5"/>
  <rect x="520" y="250" width="90" height="46" rx="6" fill="#ffffff" stroke="#8aa5c4"/>
  <text x="565" y="278" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#222">스팬 C(에러)</text>
  <line x1="610" y1="273" x2="660" y2="273" stroke="#2e9e63" stroke-width="2.5"/>
  <polygon points="660,273 650,268 650,278" fill="#2e9e63"/>

  <rect x="660" y="250" width="100" height="46" rx="6" fill="#fdf6ec" stroke="#c98a3d" stroke-width="2"/>
  <text x="710" y="272" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#a3611c">완료 후 판정</text>
  <text x="710" y="288" font-family="sans-serif" font-size="10" text-anchor="middle" fill="#a3611c">(에러 → 100% 저장)</text>

  <text x="400" y="340" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">테일 샘플링은 모든 스팬이 Collector 버퍼에 모일 때까지 기다렸다가</text>
  <text x="400" y="360" font-family="sans-serif" font-size="13" fill="#666" text-anchor="middle">에러·지연시간 같은 실제 결과를 보고 저장 여부를 결정한다</text>

  <text x="400" y="410" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">실무: 헤드 샘플링으로 볼륨을 줄이고, 테일 샘플링으로 에러/지연 트레이스를 확실히 남긴다</text>
</svg>
