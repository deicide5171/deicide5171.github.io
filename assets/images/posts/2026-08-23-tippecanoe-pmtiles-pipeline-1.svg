<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="42" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">tippecanoe + PMTiles — 서버 없는 벡터 타일 파이프라인</text>

  <!-- 1. 원본 데이터 -->
  <rect x="25" y="110" width="150" height="90" rx="8" fill="#eef4fb" stroke="#4a78a8" stroke-width="2"/>
  <text x="100" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">원본 공간 데이터</text>
  <text x="100" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444444">GeoJSON</text>
  <text x="100" y="186" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444444">Shapefile 등</text>

  <line x1="175" y1="155" x2="212" y2="155" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. tippecanoe -->
  <rect x="215" y="95" width="190" height="120" rx="8" fill="#e8f5ec" stroke="#2e8b57" stroke-width="2"/>
  <text x="310" y="124" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1d5c3a">tippecanoe (빌드)</text>
  <text x="310" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444444">줌별 지오메트리 단순화</text>
  <text x="310" y="172" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444444">밀집 피처 드로핑</text>
  <text x="310" y="194" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444444">타일 크기 상한 관리</text>

  <line x1="405" y1="155" x2="442" y2="155" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. PMTiles -->
  <rect x="445" y="110" width="150" height="90" rx="8" fill="#fdf3e7" stroke="#d2884b" stroke-width="2"/>
  <text x="520" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">PMTiles 단일 파일</text>
  <text x="520" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444444">tiles.pmtiles</text>
  <text x="520" y="186" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444444">(디렉터리 + 타일)</text>

  <line x1="595" y1="155" x2="632" y2="155" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. 정적 스토리지 -->
  <rect x="635" y="110" width="140" height="90" rx="8" fill="#f3eefb" stroke="#7a5fb0" stroke-width="2"/>
  <text x="705" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">정적 스토리지</text>
  <text x="705" y="164" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444444">S3 · R2 · CDN</text>
  <text x="705" y="186" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444444">서버 프로세스 없음</text>

  <!-- 브라우저 -->
  <rect x="560" y="310" width="215" height="95" rx="8" fill="#eef4fb" stroke="#4a78a8" stroke-width="2"/>
  <text x="667" y="340" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">브라우저 (MapLibre)</text>
  <text x="667" y="364" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444444">pmtiles 프로토콜 플러그인</text>
  <text x="667" y="386" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#444444">화면에 보이는 타일만 요청</text>

  <!-- Range 요청 화살표 -->
  <line x1="700" y1="305" x2="700" y2="205" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="712" y1="215" x2="712" y2="300" stroke="#999999" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="688" y="248" text-anchor="end" font-family="sans-serif" font-size="14" fill="#333333">HTTP Range 요청</text>
  <text x="688" y="270" text-anchor="end" font-family="sans-serif" font-size="14" fill="#777777">필요한 바이트만 전송</text>

  <!-- 핵심 포인트 -->
  <rect x="25" y="290" width="470" height="125" rx="8" fill="#f7f7f7" stroke="#cccccc" stroke-width="1.5"/>
  <text x="45" y="320" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">핵심 포인트</text>
  <text x="45" y="348" font-family="sans-serif" font-size="14" fill="#444444">· 타일 생성 연산은 전부 빌드 시점에 끝난다</text>
  <text x="45" y="372" font-family="sans-serif" font-size="14" fill="#444444">· 배포 후에는 정적 파일 전송만 남는다</text>
  <text x="45" y="396" font-family="sans-serif" font-size="14" fill="#444444">· 뷰어는 Range 요청으로 필요한 부분만 읽는다</text>
</svg>
