<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">추론 예산 라우팅과 세션 예산 관리</text>

  <rect x="320" y="44" width="160" height="42" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="400" y="70" text-anchor="middle" font-size="11" fill="#312e81">요청 수신</text>

  <line x1="400" y1="86" x2="400" y2="108" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="280" y="108" width="240" height="46" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="400" y="128" text-anchor="middle" font-size="10" font-weight="bold" fill="#312e81">난이도 · 지연 민감도 분류기</text>
  <text x="400" y="144" text-anchor="middle" font-size="9" fill="#3730a3">실패 비용 / 응답 대기 허용치 판단</text>

  <line x1="330" y1="154" x2="200" y2="190" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="470" y1="154" x2="600" y2="190" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="80" y="190" width="240" height="56" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="200" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">저위험 · 단순 작업</text>
  <text x="200" y="228" text-anchor="middle" font-size="9" fill="#065f46">경량 모델 + 낮은 추론 예산</text>

  <rect x="480" y="190" width="240" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="600" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">고위험 · 다단계 작업</text>
  <text x="600" y="228" text-anchor="middle" font-size="9" fill="#991b1b">프론티어 모델 + 높은 추론 예산</text>

  <line x1="200" y1="246" x2="330" y2="280" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="600" y1="246" x2="470" y2="280" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="270" y="280" width="260" height="60" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="400" y="300" text-anchor="middle" font-size="10" font-weight="bold" fill="#7c2d12">세션 예산 매니저</text>
  <text x="400" y="316" text-anchor="middle" font-size="9" fill="#92400e">턴별 누적 토큰 추적</text>
  <text x="400" y="330" text-anchor="middle" font-size="9" fill="#92400e">(개별 턴이 아니라 세션 전체 기준)</text>

  <line x1="330" y1="340" x2="230" y2="372" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="470" y1="340" x2="570" y2="372" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="80" y="372" width="300" height="46" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="230" y="392" text-anchor="middle" font-size="10" font-weight="bold" fill="#064e3b">한도 근접 시: 저예산 모델로 다운그레이드</text>
  <text x="230" y="407" text-anchor="middle" font-size="9" fill="#065f46">지연 민감 경로는 예고 응답(preamble) 선행</text>

  <rect x="420" y="372" width="300" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="570" y="392" text-anchor="middle" font-size="10" font-weight="bold" fill="#7f1d1d">한도 초과 시: 자동 진행 중단</text>
  <text x="570" y="407" text-anchor="middle" font-size="9" fill="#991b1b">사람에게 에스컬레이션</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
