<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222222">분산 ID 3종 비트 레이아웃 — 타임스탬프가 정렬성을 만든다</text>

  <!-- Row 1: Snowflake -->
  <text x="40" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Snowflake (64비트)</text>
  <rect x="40" y="90" width="30" height="46" fill="#e0e4ea" stroke="#666666" stroke-width="1"/>
  <rect x="70" y="90" width="390" height="46" fill="#aec6f0" stroke="#666666" stroke-width="1"/>
  <rect x="460" y="90" width="140" height="46" fill="#f4c48e" stroke="#666666" stroke-width="1"/>
  <rect x="600" y="90" width="160" height="46" fill="#a8d5a8" stroke="#666666" stroke-width="1"/>
  <text x="265" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">41bit 타임스탬프(ms)</text>
  <text x="530" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">10bit 워커 ID</text>
  <text x="680" y="118" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">12bit 시퀀스</text>
  <text x="55" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666666">부호 1bit</text>
  <text x="760" y="154" text-anchor="end" font-family="sans-serif" font-size="13" fill="#666666">커스텀 에포크 기준 약 69년 · 워커당 ms마다 4,096개</text>

  <!-- Row 2: ULID -->
  <text x="40" y="204" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">ULID (128비트)</text>
  <rect x="40" y="214" width="270" height="46" fill="#aec6f0" stroke="#666666" stroke-width="1"/>
  <rect x="310" y="214" width="450" height="46" fill="#cbb2dd" stroke="#666666" stroke-width="1"/>
  <text x="175" y="242" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">48bit 타임스탬프(ms)</text>
  <text x="535" y="242" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">80bit 랜덤</text>
  <text x="760" y="278" text-anchor="end" font-family="sans-serif" font-size="13" fill="#666666">Crockford Base32로 26자 문자열 인코딩</text>

  <!-- Row 3: UUIDv7 -->
  <text x="40" y="328" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">UUIDv7 (128비트, RFC 9562)</text>
  <rect x="40" y="338" width="270" height="46" fill="#aec6f0" stroke="#666666" stroke-width="1"/>
  <rect x="310" y="338" width="40" height="46" fill="#e0e4ea" stroke="#666666" stroke-width="1"/>
  <rect x="350" y="338" width="100" height="46" fill="#cbb2dd" stroke="#666666" stroke-width="1"/>
  <rect x="450" y="338" width="40" height="46" fill="#e0e4ea" stroke="#666666" stroke-width="1"/>
  <rect x="490" y="338" width="270" height="46" fill="#cbb2dd" stroke="#666666" stroke-width="1"/>
  <text x="175" y="366" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1f2933">48bit 타임스탬프(ms)</text>
  <text x="330" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2933">ver</text>
  <text x="400" y="366" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2933">rand_a 12bit</text>
  <text x="470" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2933">var</text>
  <text x="625" y="366" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1f2933">rand_b 62bit</text>

  <text x="400" y="428" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#444444">세 방식 모두 상위 비트가 타임스탬프 → 생성 시각 순으로 근사 정렬(k-sorted) 가능</text>
</svg>
