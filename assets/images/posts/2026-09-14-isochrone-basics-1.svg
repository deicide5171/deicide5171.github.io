<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">등시간권 vs 단순 반경</text>

  <!-- Left: simple radius -->
  <rect x="60" y="90" width="320" height="300" rx="12" fill="#fafafa" stroke="#ddd"/>
  <text x="220" y="122" font-family="sans-serif" font-size="17" font-weight="bold" fill="#888" text-anchor="middle">단순 반경(버퍼)</text>
  <circle cx="220" cy="250" r="95" fill="#8888cc" fill-opacity="0.2" stroke="#8888cc" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="220" cy="250" r="7" fill="#c0392b"/>
  <text x="220" y="365" font-family="sans-serif" font-size="14" fill="#777" text-anchor="middle">직선 거리 원 (도로 무시)</text>

  <!-- Right: isochrone (irregular) -->
  <rect x="420" y="90" width="320" height="300" rx="12" fill="#fafafa" stroke="#ddd"/>
  <text x="580" y="122" font-family="sans-serif" font-size="17" font-weight="bold" fill="#03c75a" text-anchor="middle">등시간권(isochrone)</text>
  <path d="M580,160 Q660,180 680,240 Q700,300 620,330 Q560,350 520,320 Q470,300 490,250 Q460,210 520,190 Q550,170 580,160 Z"
        fill="#03c75a" fill-opacity="0.2" stroke="#03c75a" stroke-width="2.5"/>
  <circle cx="580" cy="250" r="7" fill="#c0392b"/>
  <text x="580" y="365" font-family="sans-serif" font-size="14" fill="#777" text-anchor="middle">도로 따라 이동 시간 기준</text>

  <text x="400" y="420" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">강·산으로 막히면 좁고, 큰길 쪽은 넓게 → 원이 아닌 울퉁불퉁한 모양</text>
</svg>
