<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">3D Tiles 타일셋 계층 구조 (LOD 트리)</text>

  <!-- precision axis -->
  <line x1="40" y1="70" x2="40" y2="380" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="40" y="60" text-anchor="middle" font-size="12" fill="#666">정밀도</text>
  <text x="20" y="220" text-anchor="middle" font-size="12" fill="#666" transform="rotate(-90 20 220)">낮음 → 높음</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <!-- Level 0 root -->
  <rect x="330" y="80" width="140" height="46" rx="6" fill="#0b5fa5" stroke="#083f6e" stroke-width="1.5"/>
  <text x="400" y="100" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Root Tile</text>
  <text x="400" y="117" text-anchor="middle" font-size="11" fill="#dbeafe">Level 0 · 전역 경계볼륨</text>

  <!-- connectors L0->L1 -->
  <line x1="400" y1="126" x2="180" y2="196" stroke="#999" stroke-width="1.5"/>
  <line x1="400" y1="126" x2="400" y2="196" stroke="#999" stroke-width="1.5"/>
  <line x1="400" y1="126" x2="620" y2="196" stroke="#999" stroke-width="1.5"/>

  <!-- Level 1 nodes -->
  <rect x="110" y="196" width="140" height="46" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="180" y="216" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Tile A</text>
  <text x="180" y="232" text-anchor="middle" font-size="10" fill="#dbeafe">Level 1 · 중간 해상도</text>

  <rect x="330" y="196" width="140" height="46" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="400" y="216" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Tile B</text>
  <text x="400" y="232" text-anchor="middle" font-size="10" fill="#dbeafe">Level 1 · 중간 해상도</text>

  <rect x="550" y="196" width="140" height="46" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="620" y="216" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Tile C</text>
  <text x="620" y="232" text-anchor="middle" font-size="10" fill="#dbeafe">Level 1 · 중간 해상도</text>

  <!-- connectors L1(B) -> L2 leaves (refined, near camera) -->
  <line x1="400" y1="242" x2="320" y2="312" stroke="#999" stroke-width="1.5"/>
  <line x1="400" y1="242" x2="480" y2="312" stroke="#999" stroke-width="1.5"/>

  <rect x="245" y="312" width="150" height="46" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="320" y="332" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Tile B-1</text>
  <text x="320" y="348" text-anchor="middle" font-size="10" fill="#eafff0">Level 2 · 고해상도 메시</text>

  <rect x="405" y="312" width="150" height="46" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="480" y="332" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Tile B-2</text>
  <text x="480" y="348" text-anchor="middle" font-size="10" fill="#eafff0">Level 2 · 고해상도 메시</text>

  <!-- Tile A, C stay coarse (not refined - far from camera) -->
  <text x="180" y="270" text-anchor="middle" font-size="10.5" fill="#a33" font-weight="bold">SSE 임계값 이하 → 더 이상 세분화 안 함</text>
  <text x="620" y="270" text-anchor="middle" font-size="10.5" fill="#a33" font-weight="bold">SSE 임계값 이하 → 더 이상 세분화 안 함</text>

  <!-- Camera icon near Tile B-1/B-2 -->
  <g transform="translate(640,340)">
    <polygon points="0,0 46,-16 46,16" fill="#ffb020" stroke="#a56a00" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#a56a00"/>
    <text x="-10" y="34" font-size="11.5" fill="#7a4b00" font-weight="bold" text-anchor="middle">카메라 시점</text>
  </g>
  <line x1="600" y1="335" x2="480" y2="330" stroke="#ffb020" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="560" y="392" text-anchor="middle" font-size="11" fill="#7a4b00">화면 공간 오차(SSE)가 클수록 &#8594; 더 세밀한 타일로 교체 요청</text>

  <text x="400" y="425" text-anchor="middle" font-size="12" fill="#555">카메라와 가까운 Tile B만 재귀적으로 자식 타일(B-1, B-2)을 로드해 세분화한다</text>
</svg>
