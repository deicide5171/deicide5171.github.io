<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#1a1a1a">React 19 Actions: 폼 제출 데이터 흐름</text>

  <!-- Step 1: Form -->
  <rect x="30" y="90" width="150" height="90" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="105" y="125" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">&lt;form&gt;</text>
  <text x="105" y="147" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">action={'{formAction}'}</text>
  <text x="105" y="165" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">사용자 submit</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="135" x2="235" y2="135" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Action function -->
  <rect x="240" y="90" width="170" height="90" rx="8" fill="#ecfdf5" stroke="#03c75a" stroke-width="2"/>
  <text x="325" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">Action 함수</text>
  <text x="325" y="142" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">async (prev, formData)</text>
  <text x="325" y="160" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">서버 요청 / 검증</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="135" x2="465" y2="135" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: state update -->
  <rect x="470" y="90" width="170" height="90" rx="8" fill="#fff7ed" stroke="#ff8a3d" stroke-width="2"/>
  <text x="555" y="120" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">새 state 반환</text>
  <text x="555" y="142" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">{'{ error, ok, ... }'}</text>
  <text x="555" y="160" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#333">컴포넌트 리렌더</text>

  <!-- Arrow down to hooks row -->
  <line x1="105" y1="180" x2="105" y2="230" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="325" y1="180" x2="325" y2="230" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="555" y1="180" x2="555" y2="230" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Hooks band -->
  <rect x="40" y="235" width="720" height="130" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1.5"/>
  <text x="400" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a">함께 쓰는 훅 3가지</text>

  <rect x="65" y="275" width="205" height="75" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="167" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">useActionState</text>
  <text x="167" y="318" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#444">state, formAction,</text>
  <text x="167" y="334" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#444">isPending 반환</text>

  <rect x="297" y="275" width="205" height="75" rx="6" fill="#ffffff" stroke="#03c75a" stroke-width="1.5"/>
  <text x="399" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">useFormStatus</text>
  <text x="399" y="318" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#444">하위 컴포넌트에서</text>
  <text x="399" y="334" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#444">pending 상태 구독</text>

  <rect x="529" y="275" width="205" height="75" rx="6" fill="#ffffff" stroke="#ff8a3d" stroke-width="1.5"/>
  <text x="631" y="298" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">useOptimistic</text>
  <text x="631" y="318" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#444">서버 응답 전</text>
  <text x="631" y="334" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#444">낙관적 UI 반영</text>

  <!-- Bottom note -->
  <text x="400" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">기존 방식: onSubmit + useState(loading/error) 직접 관리 → Actions: 훅이 pending·에러·낙관적 갱신을 표준화</text>
  <text x="400" y="424" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#999">React 19 (2024.12 정식 릴리스) 기준 폼 제출 데이터 흐름 개념도</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
