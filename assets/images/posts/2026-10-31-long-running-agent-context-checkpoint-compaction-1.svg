<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <style>
    .box { fill:#f4f8ff; stroke:#3b6fd6; stroke-width:1.5; }
    .box2 { fill:#fff4ec; stroke:#d97b3f; stroke-width:1.5; }
    .box3 { fill:#f0fbf4; stroke:#2f9e5b; stroke-width:1.5; }
    .boxbad { fill:#fbeaea; stroke:#c0392b; stroke-width:1.5; }
    .lbl { font-size:13px; fill:#1a1a1a; }
    .sub { font-size:11px; fill:#555; }
    .title { font-size:16px; font-weight:bold; fill:#1a1a1a; }
    .arrow { stroke:#555; stroke-width:1.5; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="20" y="25" class="title">압축 순서 — 체크포인트가 먼저, 압축은 그 다음</text>

  <rect x="20" y="45" width="150" height="55" rx="6" class="box"/>
  <text x="95" y="68" text-anchor="middle" class="lbl">워킹 메모리</text>
  <text x="95" y="84" text-anchor="middle" class="sub">컨텍스트 윈도우 한계 임박</text>

  <line x1="170" y1="72" x2="215" y2="72" class="arrow"/>

  <rect x="220" y="45" width="180" height="55" rx="6" class="box3"/>
  <text x="310" y="63" text-anchor="middle" class="lbl">① 핫 체크포인트 기록</text>
  <text x="310" y="81" text-anchor="middle" class="sub">진행상황·남은작업·아티팩트</text>

  <line x1="400" y1="72" x2="445" y2="72" class="arrow"/>

  <rect x="450" y="45" width="140" height="55" rx="6" class="box2"/>
  <text x="520" y="68" text-anchor="middle" class="lbl">② 압축 수행</text>
  <text x="520" y="84" text-anchor="middle" class="sub">요약으로 공간 확보</text>

  <line x1="590" y1="72" x2="635" y2="72" class="arrow"/>

  <rect x="640" y="45" width="140" height="55" rx="6" class="box"/>
  <text x="710" y="68" text-anchor="middle" class="lbl">③ 새 윈도우</text>
  <text x="710" y="84" text-anchor="middle" class="sub">요약 + 체크포인트 참조</text>

  <text x="400" y="135" text-anchor="middle" class="title" fill="#c0392b">순서가 뒤집히면 — 압축이 먼저 일어나면 체크포인트 자체가 손실된 상태를 받아 적는다</text>

  <line x1="20" y1="160" x2="780" y2="160" stroke="#ccc" stroke-dasharray="4,4"/>
  <text x="400" y="185" text-anchor="middle" class="title">메모리 3계층</text>

  <rect x="40" y="205" width="220" height="110" rx="8" class="box"/>
  <text x="150" y="230" text-anchor="middle" class="lbl">워킹 메모리</text>
  <text x="150" y="252" text-anchor="middle" class="sub">현재 스레드 안에서만 유효</text>
  <text x="150" y="272" text-anchor="middle" class="sub">컨텍스트 윈도우 그 자체</text>
  <text x="150" y="295" text-anchor="middle" fill="#3b6fd6" class="sub">압축 대상</text>

  <rect x="290" y="205" width="220" height="110" rx="8" class="box3"/>
  <text x="400" y="230" text-anchor="middle" class="lbl">핫 체크포인트</text>
  <text x="400" y="252" text-anchor="middle" class="sub">압축 직전 durable 기록</text>
  <text x="400" y="272" text-anchor="middle" class="sub">진행·남은작업·아티팩트</text>
  <text x="400" y="295" text-anchor="middle" fill="#2f9e5b" class="sub">재개 시 검증 후 복원</text>

  <rect x="540" y="205" width="220" height="110" rx="8" class="box2"/>
  <text x="650" y="230" text-anchor="middle" class="lbl">콜드 장기 메모리</text>
  <text x="650" y="252" text-anchor="middle" class="sub">벡터 스토어·파일 기반</text>
  <text x="650" y="272" text-anchor="middle" class="sub">스레드를 넘는 지식</text>
  <text x="650" y="295" text-anchor="middle" fill="#d97b3f" class="sub">장기 기억 필요할 때만</text>

  <line x1="20" y1="335" x2="780" y2="335" stroke="#ccc" stroke-dasharray="4,4"/>
  <text x="400" y="360" text-anchor="middle" class="title">주의: 메모리 추가가 곧 신뢰성 개선은 아니다</text>

  <rect x="120" y="375" width="260" height="60" rx="8" class="box"/>
  <text x="250" y="398" text-anchor="middle" class="lbl">짧은 작업 성공률 76.3%</text>
  <text x="250" y="418" text-anchor="middle" class="sub">arXiv:2603.29231</text>

  <rect x="420" y="375" width="260" height="60" rx="8" class="boxbad"/>
  <text x="550" y="398" text-anchor="middle" class="lbl">매우 긴 작업 52.1%</text>
  <text x="550" y="418" text-anchor="middle" class="sub">naive 메모리 스캐폴드는 10개 중 6개 모델 악화</text>
</svg>
