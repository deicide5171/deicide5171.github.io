<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">기능 테스트만 있는 게이트 vs 보안 게이트를 병렬로 둔 게이트</text>

  <!-- Top row: before -->
  <text x="20" y="68" font-size="12" font-weight="bold" fill="#991b1b">기존: 기능 테스트만 게이트</text>

  <rect x="20" y="80" width="130" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="85" y="110" text-anchor="middle" font-size="12" fill="#334155">에이전트 코드</text>

  <line x1="150" y1="105" x2="210" y2="105" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="80" width="150" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="285" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">기능 테스트 (CI)</text>

  <line x1="360" y1="105" x2="420" y2="105" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="80" width="130" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="485" y="104" text-anchor="middle" font-size="12" fill="#334155">머지</text>
  <text x="485" y="120" text-anchor="middle" font-size="11" fill="#334155">게이트</text>

  <line x1="550" y1="105" x2="610" y2="105" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="610" y="80" width="150" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="685" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">배포</text>
  <text x="685" y="120" text-anchor="middle" font-size="10" fill="#7f1d1d">(취약점 동행)</text>

  <!-- Divider -->
  <line x1="20" y1="170" x2="780" y2="170" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Bottom row: after -->
  <text x="20" y="200" font-size="12" font-weight="bold" fill="#14532d">개선: 보안 게이트를 병렬 필수 체크로 추가</text>

  <rect x="20" y="212" width="130" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="85" y="242" text-anchor="middle" font-size="12" fill="#334155">에이전트 코드</text>

  <line x1="150" y1="237" x2="210" y2="195" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="150" y1="237" x2="210" y2="280" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="170" width="150" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="285" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">기능 테스트 (CI)</text>

  <rect x="210" y="255" width="150" height="70" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="285" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">보안 게이트</text>
  <text x="285" y="295" text-anchor="middle" font-size="10" fill="#9a3412">diff SAST + 의존성·</text>
  <text x="285" y="309" text-anchor="middle" font-size="10" fill="#9a3412">시크릿 스캔</text>

  <line x1="360" y1="195" x2="420" y2="230" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="290" x2="420" y2="250" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="215" width="130" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="485" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">머지 게이트</text>
  <text x="485" y="255" text-anchor="middle" font-size="10" fill="#14532d">둘 다 통과해야</text>

  <line x1="550" y1="240" x2="610" y2="240" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="610" y="215" width="150" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="685" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">배포</text>
  <text x="685" y="255" text-anchor="middle" font-size="10" fill="#14532d">(고위험 경로는</text>

  <text x="685" y="330" text-anchor="middle" font-size="10" fill="#92400e">※ 고위험 경로(인증·결제)는 에이전틱 보안</text>
  <text x="685" y="345" text-anchor="middle" font-size="10" fill="#92400e">리뷰 결과까지 받은 뒤 배포 진입</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>
</svg>
