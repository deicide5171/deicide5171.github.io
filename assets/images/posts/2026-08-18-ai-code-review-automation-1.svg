<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">PR 생성부터 병합까지 — CI에 AI 코드 리뷰 단계 끼워넣기</text>

  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#777"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6a3fb5"/>
    </marker>
  </defs>

  <!-- trigger -->
  <rect x="20" y="55" width="130" height="46" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="85" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">PR open /</text>
  <text x="85" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">synchronize</text>

  <line x1="150" y1="78" x2="180" y2="78" stroke="#777" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- lint -->
  <rect x="184" y="55" width="130" height="46" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="249" y="74" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">린트 · 포맷 검사</text>
  <text x="249" y="90" text-anchor="middle" font-size="10" fill="#dbeafe">스타일 규칙 강제</text>

  <line x1="314" y1="78" x2="344" y2="78" stroke="#777" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- test -->
  <rect x="348" y="55" width="130" height="46" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="413" y="74" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">단위 · 통합 테스트</text>
  <text x="413" y="90" text-anchor="middle" font-size="10" fill="#dbeafe">동작 정합성 검증</text>

  <line x1="478" y1="78" x2="508" y2="78" stroke="#777" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- ai review (highlighted) -->
  <rect x="512" y="50" width="160" height="56" rx="6" fill="#6a3fb5" stroke="#4a2a85" stroke-width="2"/>
  <text x="592" y="72" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">AI 코드 리뷰</text>
  <text x="592" y="88" text-anchor="middle" font-size="10" fill="#ece3fb">LLM이 diff 분석 · 코멘트 생성</text>

  <line x1="672" y1="78" x2="702" y2="78" stroke="#6a3fb5" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- human review -->
  <rect x="20" y="140" width="182" height="56" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="111" y="163" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">사람 리뷰</text>
  <text x="111" y="180" text-anchor="middle" font-size="10" fill="#eafff0">AI 코멘트 참고, 최종 승인 판단</text>

  <line x1="706" y1="106" x2="706" y2="230" stroke="#6a3fb5" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="706" y1="230" x2="212" y2="230" stroke="#6a3fb5" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="212" y1="230" x2="212" y2="198" stroke="#6a3fb5" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
  <text x="460" y="222" text-anchor="middle" font-size="10.5" fill="#6a3fb5">critical/warning/nit 심각도 분류 코멘트를 PR에 게시</text>

  <line x1="111" y1="196" x2="111" y2="226" stroke="#777" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- merge -->
  <rect x="20" y="230" width="182" height="50" rx="6" fill="#ffb020" stroke="#a56a00" stroke-width="1.5"/>
  <text x="111" y="250" text-anchor="middle" font-size="12.5" fill="#4a2e00" font-weight="bold">승인 → 병합</text>
  <text x="111" y="266" text-anchor="middle" font-size="10" fill="#5c3d00">merge 시 배포 파이프라인 트리거</text>

  <!-- annotations -->
  <rect x="20" y="305" width="360" height="120" rx="6" fill="#f5f8fc" stroke="#c9dbee" stroke-width="1"/>
  <text x="35" y="326" font-size="12" font-weight="bold" fill="#0b5fa5">AI 리뷰 단계 설계 원칙</text>
  <text x="35" y="346" font-size="10.5" fill="#333">· 승인권은 갖지 않는다 — 코멘트만 남기는 전처리</text>
  <text x="35" y="364" font-size="10.5" fill="#333">· 큰 PR은 diff를 파일 단위로 나눠 전송(토큰 관리)</text>
  <text x="35" y="382" font-size="10.5" fill="#333">· 병합 차단 여부는 팀 신뢰 수준에 맞춰 단계적으로</text>
  <text x="35" y="400" font-size="10.5" fill="#333">· 리뷰 프롬프트·체크리스트도 저장소에서 버전 관리</text>

  <rect x="420" y="305" width="360" height="120" rx="6" fill="#fdf7ef" stroke="#eeddc0" stroke-width="1"/>
  <text x="435" y="326" font-size="12" font-weight="bold" fill="#8a5a00">운영 전 확인할 것</text>
  <text x="435" y="346" font-size="10.5" fill="#333">· 사설 코드가 외부 LLM API로 전송되는지 여부</text>
  <text x="435" y="364" font-size="10.5" fill="#333">· 조직 보안 정책과 충돌 시 온프레미스 대안 검토</text>
  <text x="435" y="382" font-size="10.5" fill="#333">· 오탐이 많으면 무시되므로 심각도 표시로 절제</text>
  <text x="435" y="400" font-size="10.5" fill="#333">· API 키는 CI 시크릿으로만 관리(코드 하드코딩 금지)</text>
</svg>
