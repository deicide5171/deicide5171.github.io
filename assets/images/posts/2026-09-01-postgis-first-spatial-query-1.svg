<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">geometry vs geography 거리 계산</text>

  <!-- geometry: flat plane -->
  <rect x="40" y="70" width="330" height="300" rx="8" fill="#eaf6ff" stroke="#4a90d9" stroke-width="2"/>
  <text x="205" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a4a7a">geometry (평면 좌표)</text>
  <line x1="90" y1="300" x2="90" y2="130" stroke="#999" stroke-width="1"/>
  <line x1="90" y1="300" x2="330" y2="300" stroke="#999" stroke-width="1"/>
  <circle cx="130" cy="270" r="6" fill="#e05252"/>
  <text x="130" y="290" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">서울 시청</text>
  <circle cx="290" cy="180" r="6" fill="#e05252"/>
  <text x="290" y="165" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">강남역</text>
  <line x1="130" y1="270" x2="290" y2="180" stroke="#1a4a7a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="205" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">직선(평면) 거리 — 단위 부정확</text>

  <!-- geography: curved earth -->
  <rect x="430" y="70" width="330" height="300" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="595" y="100" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0a5a30">geography (지구 곡률 반영)</text>
  <path d="M 470 300 Q 595 150 720 300" fill="none" stroke="#3a8a5a" stroke-width="2"/>
  <circle cx="500" cy="278" r="6" fill="#e05252"/>
  <text x="500" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">서울 시청</text>
  <circle cx="660" cy="230" r="6" fill="#e05252"/>
  <text x="660" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">강남역</text>
  <path d="M 500 278 Q 580 230 660 230" fill="none" stroke="#0a5a30" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="595" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">타원체 곡률 반영 — 정확한 미터 단위</text>

  <text x="400" y="415" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">ST_Distance(geom::geography, ...)로 형변환해야 실제 거리에 가깝다</text>
</svg>
