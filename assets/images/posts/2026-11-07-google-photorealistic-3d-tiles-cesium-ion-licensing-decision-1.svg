<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- Requirement box -->
  <rect x="300" y="20" width="200" height="60" rx="10" fill="#f2f2f2" stroke="#888" stroke-width="2"/>
  <text x="400" y="45" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">"전국 실사 3D 도시를</text>
  <text x="400" y="63" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">지도에 띄워주세요"</text>

  <!-- Two paths -->
  <rect x="60" y="120" width="300" height="190" rx="12" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="210" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3b6e">Google 직접 사용</text>
  <text x="210" y="172" text-anchor="middle" font-size="11" fill="#333">Google Maps Platform API 호출</text>
  <text x="210" y="192" text-anchor="middle" font-size="11" fill="#333">요청(타일) 단위 과금</text>
  <text x="210" y="212" text-anchor="middle" font-size="11" fill="#333">SaaS 전용 — 자체 호스팅 불가</text>
  <text x="210" y="232" text-anchor="middle" font-size="11" fill="#333">전역 커버리지, 커스터마이징 제한</text>
  <rect x="80" y="250" width="260" height="40" rx="6" fill="#fff" stroke="#3b6fd6"/>
  <text x="210" y="274" text-anchor="middle" font-size="11" fill="#1f3b6e">적합: 범용 전역 배경 3D</text>

  <rect x="440" y="120" width="300" height="190" rx="12" fill="#fff3e0" stroke="#d98c00" stroke-width="2"/>
  <text x="590" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5600">Cesium ion 경유</text>
  <text x="590" y="172" text-anchor="middle" font-size="11" fill="#333">ion 계정 쿼터 기준 과금</text>
  <text x="590" y="192" text-anchor="middle" font-size="11" fill="#333">SaaS+Self-Hosted 하이브리드 가능</text>
  <text x="590" y="212" text-anchor="middle" font-size="11" fill="#333">상업적 재배포 시 통합 라이선스 필요</text>
  <text x="590" y="232" text-anchor="middle" font-size="11" fill="#333">자체 3D Tiles 자산과 합성 용이</text>
  <rect x="460" y="250" width="260" height="40" rx="6" fill="#fff" stroke="#d98c00"/>
  <text x="590" y="274" text-anchor="middle" font-size="11" fill="#8a5600">적합: 자체 자산과 합성·재판매</text>

  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
  <line x1="370" y1="80" x2="250" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="430" y1="80" x2="550" y2="120" stroke="#555" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Bottom decision gate -->
  <rect x="60" y="340" width="680" height="90" rx="10" fill="#f7f7f7" stroke="#999" stroke-width="1.5"/>
  <text x="400" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">먼저 답해야 할 질문</text>
  <text x="400" y="388" text-anchor="middle" font-size="11" fill="#333">이 3D 뷰를 다른 조직에 상업적으로 재배포하는가?</text>
  <text x="400" y="408" text-anchor="middle" font-size="11" fill="#333">자체 3D Tiles 자산(건물·시설물)과 같은 장면에 합성해야 하는가?</text>
</svg>
