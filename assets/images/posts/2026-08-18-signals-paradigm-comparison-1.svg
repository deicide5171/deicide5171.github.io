<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">업데이트 전파 방식 비교: Virtual DOM vs Signals</text>

  <!-- divider -->
  <line x1="400" y1="42" x2="400" y2="430" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- ===== LEFT: Virtual DOM ===== -->
  <text x="200" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc2626">① 기존 방식 — Virtual DOM 재조정</text>

  <!-- Root -->
  <rect x="135" y="78" width="130" height="42" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="200" y="103" text-anchor="middle" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#1a1a1a">Root (state 변경)</text>

  <line x1="200" y1="120" x2="200" y2="140" stroke="#999" stroke-width="1.5"/>
  <line x1="65" y1="140" x2="335" y2="140" stroke="#999" stroke-width="1.5"/>
  <line x1="65" y1="140" x2="65" y2="150" stroke="#999" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="200" y1="140" x2="200" y2="150" stroke="#999" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="335" y1="140" x2="335" y2="150" stroke="#999" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Children: all re-run regardless of actual usage -->
  <rect x="15" y="152" width="100" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="65" y="171" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a1a1a">Child A</text>
  <text x="65" y="187" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#991b1b">재실행(미사용)</text>

  <rect x="150" y="152" width="100" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="200" y="171" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a1a1a">Child B</text>
  <text x="200" y="187" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#991b1b">재실행(실사용)</text>

  <rect x="285" y="152" width="100" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="335" y="171" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a1a1a">Child C</text>
  <text x="335" y="187" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#991b1b">재실행(미사용)</text>

  <line x1="200" y1="198" x2="200" y2="222" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="105" y="226" width="190" height="40" rx="7" fill="#fff7ed" stroke="#ff8a3d" stroke-width="2"/>
  <text x="200" y="251" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">전체 트리 Diff 연산</text>

  <line x1="200" y1="266" x2="200" y2="290" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="120" y="294" width="160" height="40" rx="7" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="200" y="319" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">실제 DOM 패치</text>

  <text x="200" y="360" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666">state 하나만 바뀌어도</text>
  <text x="200" y="378" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666">하위 컴포넌트가 통째로 재실행된다</text>

  <!-- ===== RIGHT: Signals ===== -->
  <text x="600" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#03c75a">② Signals — 세밀(Fine-grained) 반응성</text>

  <!-- Signal node -->
  <circle cx="480" cy="115" r="34" fill="#ecfdf5" stroke="#03c75a" stroke-width="2.2"/>
  <text x="480" y="111" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a1a1a">Signal</text>
  <text x="480" y="124" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#333">count</text>

  <!-- unrelated signal, stays untouched -->
  <circle cx="700" cy="115" r="30" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="700" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666">Signal</text>
  <text x="700" y="124" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#999">other</text>

  <line x1="504" y1="132" x2="546" y2="162" stroke="#03c75a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <!-- computed -->
  <rect x="550" y="168" width="110" height="42" rx="7" fill="#ecfdf5" stroke="#03c75a" stroke-width="2.2"/>
  <text x="605" y="192" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1a1a1a">computed</text>
  <text x="605" y="205" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#333">doubled</text>

  <line x1="605" y1="210" x2="605" y2="240" stroke="#03c75a" stroke-width="2.2" marker-end="url(#arrowGreen)"/>

  <!-- effect / DOM node -->
  <rect x="545" y="244" width="120" height="42" rx="7" fill="#ecfdf5" stroke="#03c75a" stroke-width="2.2"/>
  <text x="605" y="264" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1a1a1a">effect →</text>
  <text x="605" y="279" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#333">해당 DOM 노드만 갱신</text>

  <!-- unrelated branch not updated -->
  <line x1="700" y1="145" x2="700" y2="180" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="645" y="184" width="110" height="40" rx="7" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="700" y="207" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#999">구독 없음(미갱신)</text>

  <text x="600" y="330" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666">값을 실제로 호출(읽기)한 노드만</text>
  <text x="600" y="348" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#666">의존성 그래프를 타고 자동 갱신된다</text>

  <!-- legend -->
  <rect x="20" y="392" width="760" height="46" rx="8" fill="#f7f7f7" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="411" text-anchor="middle" font-family="sans-serif" font-size="11.5" font-weight="bold" fill="#1a1a1a">동일한 3단 구조, 다른 이름</text>
  <text x="400" y="429" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#444">Vue: ref/reactive → computed → watchEffect  ·  Solid: createSignal → createMemo → createEffect  ·  Angular: signal → computed → effect</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#03c75a"/>
    </marker>
  </defs>
</svg>
