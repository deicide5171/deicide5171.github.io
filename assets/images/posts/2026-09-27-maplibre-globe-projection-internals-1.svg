<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <radialGradient id="globeShade" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#eaf4ff"/>
      <stop offset="100%" stop-color="#bcd9f2"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">MapLibre GL JS — 머케이터 평면에서 3D 지구본 투영으로</text>

  <!-- Flat mercator -->
  <g>
    <rect x="60" y="80" width="200" height="140" rx="6" fill="#fdf5f0" stroke="#c98a2e" stroke-width="1.5"/>
    <text x="160" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a12">낮은 줌 레벨: 평면 머케이터</text>
    <line x1="60" y1="120" x2="260" y2="120" stroke="#e0b070" stroke-width="1"/>
    <line x1="60" y1="160" x2="260" y2="160" stroke="#e0b070" stroke-width="1"/>
    <line x1="60" y1="200" x2="260" y2="200" stroke="#e0b070" stroke-width="1"/>
    <text x="160" y="240" text-anchor="middle" font-size="11" fill="#8a5a12">극지방일수록 면적이 크게 왜곡</text>
  </g>

  <line x1="270" y1="150" x2="330" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="300" y="140" text-anchor="middle" font-size="11" fill="#555">줌아웃 시</text>

  <!-- Globe -->
  <g>
    <circle cx="450" cy="150" r="90" fill="url(#globeShade)" stroke="#4a7fb5" stroke-width="2"/>
    <ellipse cx="450" cy="150" rx="90" ry="30" fill="none" stroke="#7fa8cc" stroke-width="1"/>
    <ellipse cx="450" cy="150" rx="60" ry="90" fill="none" stroke="#7fa8cc" stroke-width="1"/>
    <ellipse cx="450" cy="150" rx="20" ry="90" fill="none" stroke="#7fa8cc" stroke-width="1"/>
    <line x1="360" y1="150" x2="540" y2="150" stroke="#7fa8cc" stroke-width="1"/>
    <text x="450" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4f73">높은 줌 아웃: 3D Globe 투영</text>
    <text x="450" y="255" text-anchor="middle" font-size="11" fill="#2b4f73">구면 좌표를 정점 셰이더에서 직접 왜곡 처리</text>
  </g>

  <line x1="540" y1="150" x2="600" y2="150" stroke="#555" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="570" y="140" text-anchor="middle" font-size="11" fill="#555">더 줌인 시</text>

  <!-- back to flat at high zoom -->
  <g>
    <rect x="610" y="80" width="150" height="140" rx="6" fill="#fdf5f0" stroke="#c98a2e" stroke-width="1.5"/>
    <text x="685" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a5a12">높은 줌 레벨</text>
    <text x="685" y="150" text-anchor="middle" font-size="12" fill="#8a5a12">지구본 곡률이</text>
    <text x="685" y="168" text-anchor="middle" font-size="12" fill="#8a5a12">시각적으로 평면과</text>
    <text x="685" y="186" text-anchor="middle" font-size="12" fill="#8a5a12">동일해져 자동 전환</text>
  </g>

  <!-- bottom note -->
  <rect x="40" y="300" width="720" height="130" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="1.5"/>
  <text x="400" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d5c3f">Globe 모드는 별도 렌더 파이프라인이 아니다</text>
  <text x="400" y="352" text-anchor="middle" font-size="13" fill="#2b4f73">타일 데이터·스타일 스펙·CustomLayer는 그대로 재사용하고, 정점 셰이더 단계에서</text>
  <text x="400" y="374" text-anchor="middle" font-size="13" fill="#2b4f73">머케이터 좌표를 구면 좌표로 투영하는 행렬만 다르게 적용한다</text>
  <text x="400" y="400" text-anchor="middle" font-size="13" fill="#2b4f73">줌 레벨에 따라 GPU가 평면↔구면 투영을 부드럽게 보간(interpolate)해 전환 시 끊김이 없다</text>
  <text x="400" y="420" text-anchor="middle" font-size="12" fill="#3c7a5c">projection: 'globe' 설정 하나로 활성화, style spec에 표준으로 정의됨</text>
</svg>
