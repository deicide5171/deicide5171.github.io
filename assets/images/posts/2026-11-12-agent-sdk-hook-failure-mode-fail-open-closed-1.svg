<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- agent request -->
  <rect x="40" y="30" width="200" height="56" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="140" y="54" text-anchor="middle" font-size="13" fill="#1b3a73">에이전트 도구 호출</text>
  <text x="140" y="72" text-anchor="middle" font-size="11" fill="#1b3a73">예: 결제 승인 요청</text>

  <line x1="240" y1="58" x2="300" y2="58" stroke="#555" stroke-width="2" marker-end="url(#arrowH)"/>

  <!-- hook -->
  <rect x="302" y="30" width="200" height="56" rx="8" fill="#f3f0ff" stroke="#6c4fd6" stroke-width="2"/>
  <text x="402" y="54" text-anchor="middle" font-size="13" fill="#3a2a73">PreToolUse 훅</text>
  <text x="402" y="72" text-anchor="middle" font-size="11" fill="#3a2a73">정책 체크 콜백</text>

  <line x1="402" y1="86" x2="402" y2="130" stroke="#555" stroke-width="2"/>

  <!-- normal verdict branch -->
  <line x1="402" y1="130" x2="230" y2="170" stroke="#03c75a" stroke-width="2" marker-end="url(#arrowH)"/>
  <line x1="402" y1="130" x2="570" y2="170" stroke="#d6555a" stroke-width="2" marker-end="url(#arrowH)"/>
  <text x="400" y="118" text-anchor="middle" font-size="11" fill="#999999">정상 응답</text>

  <rect x="120" y="172" width="220" height="50" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="230" y="202" text-anchor="middle" font-size="13" fill="#15502f">허용 → 행동 실행</text>

  <rect x="460" y="172" width="220" height="50" rx="8" fill="#fdf0f0" stroke="#d6555a" stroke-width="2"/>
  <text x="570" y="202" text-anchor="middle" font-size="13" fill="#7a2a2d">거부 → 행동 중단</text>

  <!-- hook failure branch -->
  <line x1="402" y1="130" x2="402" y2="260" stroke="#e08a2e" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowH)"/>
  <text x="470" y="245" text-anchor="middle" font-size="11" fill="#999999">타임아웃·예외 (훅 자체 장애)</text>

  <rect x="260" y="262" width="280" height="56" rx="8" fill="#fff7f0" stroke="#e08a2e" stroke-width="2"/>
  <text x="400" y="286" text-anchor="middle" font-size="13" fill="#7a4310">onFailure 설정</text>
  <text x="400" y="304" text-anchor="middle" font-size="11" fill="#7a4310">block(fail-closed) / allow(fail-open)</text>

  <line x1="330" y1="318" x2="230" y2="360" stroke="#555" stroke-width="2" marker-end="url(#arrowH)"/>
  <line x1="470" y1="318" x2="570" y2="360" stroke="#555" stroke-width="2" marker-end="url(#arrowH)"/>

  <rect x="120" y="362" width="220" height="56" rx="8" fill="#fdf0f0" stroke="#d6555a" stroke-width="2"/>
  <text x="230" y="386" text-anchor="middle" font-size="13" fill="#7a2a2d">fail-closed</text>
  <text x="230" y="404" text-anchor="middle" font-size="11" fill="#7a2a2d">행동 차단, 안전성 우선</text>

  <rect x="460" y="362" width="220" height="56" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="570" y="386" text-anchor="middle" font-size="13" fill="#1b3a73">fail-open</text>
  <text x="570" y="404" text-anchor="middle" font-size="11" fill="#1b3a73">행동 통과, 가용성 우선</text>
</svg>
