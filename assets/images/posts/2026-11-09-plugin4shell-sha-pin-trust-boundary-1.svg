<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- install time -->
  <rect x="60" y="24" width="300" height="70" rx="8" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="210" y="50" text-anchor="middle" font-size="14" fill="#15502f">최초 설치 — 사람이 SHA 검토</text>
  <text x="210" y="70" text-anchor="middle" font-size="11" fill="#15502f">package@sha256:abcd... 지정</text>
  <text x="210" y="86" text-anchor="middle" font-size="11" fill="#15502f">신뢰가 실제로 검증되는 유일한 지점</text>

  <line x1="210" y1="94" x2="210" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="60" y="132" width="300" height="60" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="210" y="156" text-anchor="middle" font-size="13" fill="#1b3a73">참조 해석 로직</text>
  <text x="210" y="176" text-anchor="middle" font-size="11" fill="#1b3a73">Git ref 해석 순서에 의존</text>

  <line x1="210" y1="192" x2="210" y2="228" stroke="#555" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="60" y="230" width="300" height="60" rx="8" fill="#f5f5f5" stroke="#777777" stroke-width="2"/>
  <text x="210" y="254" text-anchor="middle" font-size="13" fill="#333333">정상 코드 체크아웃</text>
  <text x="210" y="272" text-anchor="middle" font-size="11" fill="#333333">(최초 설치 시 기대한 결과)</text>

  <!-- update cycle on the right -->
  <rect x="440" y="24" width="300" height="60" rx="8" fill="#fff7f0" stroke="#e08a2e" stroke-width="2"/>
  <text x="590" y="48" text-anchor="middle" font-size="13" fill="#7a4310">자동 업데이트 주기 (사람 검토 없음)</text>
  <text x="590" y="68" text-anchor="middle" font-size="11" fill="#7a4310">백그라운드에서 반복 실행</text>

  <line x1="590" y1="84" x2="590" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="440" y="132" width="300" height="80" rx="8" fill="#fdf0f0" stroke="#d6555a" stroke-width="2"/>
  <text x="590" y="156" text-anchor="middle" font-size="13" fill="#7a2a2d">공격자가 SHA와 동일한 이름의</text>
  <text x="590" y="174" text-anchor="middle" font-size="12" fill="#7a2a2d">브랜치 생성</text>
  <text x="590" y="194" text-anchor="middle" font-size="11" fill="#7a2a2d">→ 같은 참조 해석 로직이 브랜치를 매칭</text>

  <line x1="590" y1="212" x2="590" y2="248" stroke="#555" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="440" y="250" width="300" height="60" rx="8" fill="#fdf0f0" stroke="#d6555a" stroke-width="2"/>
  <text x="590" y="274" text-anchor="middle" font-size="13" fill="#7a2a2d">악성 버전 조용히 체크아웃</text>
  <text x="590" y="292" text-anchor="middle" font-size="11" fill="#7a2a2d">"SHA 핀 유지됨"으로 로그엔 정상 기록</text>

  <line x1="360" y1="162" x2="440" y2="162" stroke="#999999" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="400" y="150" text-anchor="middle" font-size="10" fill="#999999">같은 해석 경로 재사용</text>

  <text x="400" y="400" text-anchor="middle" font-size="12" fill="#999999">핀 고정은 "참조 해석 경로가 모호하지 않을 때"만 불변성을 보장한다</text>
</svg>
