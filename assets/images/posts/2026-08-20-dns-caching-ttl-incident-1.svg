<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1a1a">DNS 캐시 계층과 TTL 전파</text>
  <text x="400" y="46" text-anchor="middle" font-size="11.5" fill="#666">권한 네임서버가 정한 TTL이 각 계층에 "그대로" 적용되지 않는 이유</text>

  <defs>
    <marker id="arrowD" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- Layer boxes: left(client) to right(authoritative) -->
  <!-- Box 1: App/JVM cache -->
  <rect x="24" y="70" width="140" height="120" rx="8" fill="#fff0eb" stroke="#c0392b" stroke-width="2"/>
  <text x="94" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c0392b">1 · 애플리케이션</text>
  <text x="94" y="106" text-anchor="middle" font-size="9.5" fill="#c0392b">(JVM 등) 캐시</text>
  <text x="94" y="128" text-anchor="middle" font-size="9" fill="#333">networkaddress</text>
  <text x="94" y="141" text-anchor="middle" font-size="9" fill="#333">.cache.ttl</text>
  <text x="94" y="163" text-anchor="middle" font-size="9" fill="#c0392b">TTL 무시하고</text>
  <text x="94" y="176" text-anchor="middle" font-size="9" fill="#c0392b">영구 캐싱 위험</text>

  <!-- Box 2: OS stub resolver -->
  <rect x="184" y="70" width="140" height="120" rx="8" fill="#fff4e5" stroke="#c9701d" stroke-width="2"/>
  <text x="254" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a3550f">2 · OS 스텁</text>
  <text x="254" y="106" text-anchor="middle" font-size="9.5" fill="#a3550f">리졸버 캐시</text>
  <text x="254" y="128" text-anchor="middle" font-size="9" fill="#333">systemd-resolved,</text>
  <text x="254" y="141" text-anchor="middle" font-size="9" fill="#333">nscd, dnsmasq 등</text>
  <text x="254" y="163" text-anchor="middle" font-size="9" fill="#a3550f">보통 TTL을</text>
  <text x="254" y="176" text-anchor="middle" font-size="9" fill="#a3550f">그대로 따름</text>

  <!-- Box 3: Recursive resolver -->
  <rect x="344" y="70" width="140" height="120" rx="8" fill="#eaf3ff" stroke="#0b5fa5" stroke-width="2"/>
  <text x="414" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0b5fa5">3 · 재귀 리졸버</text>
  <text x="414" y="106" text-anchor="middle" font-size="9.5" fill="#0b5fa5">(사내/ISP/8.8.8.8)</text>
  <text x="414" y="128" text-anchor="middle" font-size="9" fill="#333">수많은 클라이언트가</text>
  <text x="414" y="141" text-anchor="middle" font-size="9" fill="#333">공유하는 캐시</text>
  <text x="414" y="163" text-anchor="middle" font-size="9" fill="#0b5fa5">여기서 남은 TTL이</text>
  <text x="414" y="176" text-anchor="middle" font-size="9" fill="#0b5fa5">클라이언트마다 제각각</text>

  <!-- Box 4: Authoritative NS -->
  <rect x="504" y="70" width="140" height="120" rx="8" fill="#eaffef" stroke="#2fa84f" stroke-width="2"/>
  <text x="574" y="92" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1f7a38">4 · 권한</text>
  <text x="574" y="106" text-anchor="middle" font-size="9.5" fill="#1f7a38">네임서버(Authoritative)</text>
  <text x="574" y="128" text-anchor="middle" font-size="9" fill="#333">Zone 파일에</text>
  <text x="574" y="141" text-anchor="middle" font-size="9" fill="#333">TTL 원본 값 설정</text>
  <text x="574" y="163" text-anchor="middle" font-size="9" fill="#1f7a38">여기서 IP가 바뀌어도</text>
  <text x="574" y="176" text-anchor="middle" font-size="9" fill="#1f7a38">즉시 전파되지 않음</text>

  <!-- Box 5: Negative cache note -->
  <rect x="664" y="70" width="112" height="120" rx="8" fill="#f5f0ff" stroke="#7a4fc9" stroke-width="2"/>
  <text x="720" y="92" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5b3a9e">5 · 네거티브</text>
  <text x="720" y="105" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#5b3a9e">캐싱</text>
  <text x="720" y="126" text-anchor="middle" font-size="8.7" fill="#333">NXDOMAIN도</text>
  <text x="720" y="138" text-anchor="middle" font-size="8.7" fill="#333">SOA 필드 기준</text>
  <text x="720" y="150" text-anchor="middle" font-size="8.7" fill="#333">TTL만큼 캐싱</text>
  <text x="720" y="167" text-anchor="middle" font-size="8.7" fill="#5b3a9e">레코드 생성 직후</text>
  <text x="720" y="179" text-anchor="middle" font-size="8.7" fill="#5b3a9e">"없음" 오탐 지속</text>

  <!-- Arrows connecting boxes -->
  <line x1="164" y1="130" x2="182" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrowD)"/>
  <line x1="324" y1="130" x2="342" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrowD)"/>
  <line x1="484" y1="130" x2="502" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrowD)"/>
  <line x1="644" y1="130" x2="662" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrowD)" stroke-dasharray="4,3"/>

  <!-- Scenario band -->
  <rect x="24" y="216" width="752" height="150" rx="8" fill="#f7f7f7" stroke="#bbb" stroke-width="1.5"/>
  <text x="400" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">장애로 이어지는 전형적 시나리오 — TTL 300초로 설정하고 IP를 교체했을 때</text>

  <text x="60" y="266" font-size="10.5" fill="#333">① 권한 서버는 즉시 새 IP를 응답하지만, 이미 각 리졸버에 캐싱된 옛 레코드는 남은 TTL만큼 계속 반환된다.</text>
  <text x="60" y="288" font-size="10.5" fill="#333">② 캐시 계층이 하나씩 늘어날수록(앱→OS→사내 리졸버) 전파 지연이 누적되어, 실제 체감 전환 시간은 TTL보다 길어질 수 있다.</text>
  <text x="60" y="310" font-size="10.5" fill="#333">③ JVM처럼 TTL을 자체 정책으로 무시하는 계층이 있으면, 300초가 지나도 옛 IP로만 계속 연결을 시도하는 인스턴스가 남는다.</text>
  <text x="60" y="332" font-size="10.5" fill="#333">④ 반대로 TTL을 지나치게 짧게 잡으면 모든 리졸버가 매번 권한 서버에 재질의하면서 조회량과 지연이 함께 늘어난다.</text>

  <text x="400" y="356" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c0392b">→ "TTL을 몇 초로 할까"는 단일 값이 아니라, 계층마다 다른 캐시 정책까지 감안한 설계 문제다</text>

  <text x="400" y="392" text-anchor="middle" font-size="10" fill="#666">모든 계층이 TTL을 동일하게 존중한다는 가정이 무너지는 지점에서 장애가 시작된다</text>
</svg>
