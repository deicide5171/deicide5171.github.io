<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">두 가지 구조적 동시성(Structured Concurrency) 모델 비교</text>

  <!-- Column headers -->
  <text x="200" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a34a0">Kotlin Coroutines</text>
  <text x="600" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5fa5">Java Virtual Threads</text>

  <!-- Left parent -->
  <rect x="100" y="68" width="200" height="46" rx="8" fill="#f5eeff" stroke="#6a3fb5" stroke-width="1.5"/>
  <text x="200" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a34a0">coroutineScope { }</text>
  <text x="200" y="104" text-anchor="middle" font-size="10" fill="#5a34a0">부모 Job이 자식 생명주기 소유</text>

  <!-- Right parent -->
  <rect x="500" y="68" width="200" height="46" rx="8" fill="#eaf3ff" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="600" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#0b5fa5">StructuredTaskScope</text>
  <text x="600" y="104" text-anchor="middle" font-size="10" fill="#0b5fa5">try-with-resources로 스코프 소유</text>

  <!-- Left children -->
  <rect x="55" y="165" width="130" height="50" rx="8" fill="#f5eeff" stroke="#6a3fb5" stroke-width="1.3"/>
  <text x="120" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a34a0">launch A</text>
  <text x="120" y="200" text-anchor="middle" font-size="9.5" fill="#5a34a0">suspend fun 호출</text>

  <rect x="215" y="165" width="130" height="50" rx="8" fill="#f5eeff" stroke="#6a3fb5" stroke-width="1.3"/>
  <text x="280" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a34a0">launch B</text>
  <text x="280" y="200" text-anchor="middle" font-size="9.5" fill="#5a34a0">suspend fun 호출</text>

  <!-- Right children -->
  <rect x="455" y="165" width="130" height="50" rx="8" fill="#eaf3ff" stroke="#0b5fa5" stroke-width="1.3"/>
  <text x="520" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#0b5fa5">fork(subtask1)</text>
  <text x="520" y="200" text-anchor="middle" font-size="9.5" fill="#0b5fa5">가상 스레드 위 블로킹 코드</text>

  <rect x="615" y="165" width="130" height="50" rx="8" fill="#eaf3ff" stroke="#0b5fa5" stroke-width="1.3"/>
  <text x="680" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#0b5fa5">fork(subtask2)</text>
  <text x="680" y="200" text-anchor="middle" font-size="9.5" fill="#0b5fa5">가상 스레드 위 블로킹 코드</text>

  <!-- Parent-child connectors (solid) -->
  <line x1="160" y1="114" x2="120" y2="163" stroke="#999" stroke-width="1.3" marker-end="url(#arrowGray)"/>
  <line x1="240" y1="114" x2="280" y2="163" stroke="#999" stroke-width="1.3" marker-end="url(#arrowGray)"/>
  <line x1="560" y1="114" x2="520" y2="163" stroke="#999" stroke-width="1.3" marker-end="url(#arrowGray)"/>
  <line x1="640" y1="114" x2="680" y2="163" stroke="#999" stroke-width="1.3" marker-end="url(#arrowGray)"/>

  <!-- Cancellation propagation (dashed red) -->
  <path d="M120,215 C120,245 160,245 195,225" stroke="#c62828" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M205,225 C240,245 280,245 280,215" stroke="#c62828" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowRed)"/>
  <text x="200" y="252" text-anchor="middle" font-size="9.5" fill="#c62828">A 실패 → Job 취소 전파 → B 자동 취소</text>

  <path d="M520,215 C520,245 560,245 595,225" stroke="#c62828" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M605,225 C640,245 680,245 680,215" stroke="#c62828" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowRed)"/>
  <text x="600" y="252" text-anchor="middle" font-size="9.5" fill="#c62828">subtask1 실패 → shutdown() → subtask2 인터럽트</text>

  <!-- Divider -->
  <line x1="40" y1="280" x2="760" y2="280" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Cancellation mechanism strip -->
  <rect x="55" y="296" width="290" height="46" rx="8" fill="#faf7ff" stroke="#c9b8e8" stroke-width="1.2"/>
  <text x="200" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a34a0">협력적 취소</text>
  <text x="200" y="330" text-anchor="middle" font-size="9.5" fill="#5a34a0">suspend 지점(체크포인트)에서 취소 확인</text>

  <rect x="455" y="296" width="290" height="46" rx="8" fill="#f3f8ff" stroke="#a9cef0" stroke-width="1.2"/>
  <text x="600" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#0b5fa5">인터럽트 기반 취소</text>
  <text x="600" y="330" text-anchor="middle" font-size="9.5" fill="#0b5fa5">Thread.interrupt() 시그널로 즉시 전달</text>

  <!-- Bottom common note -->
  <rect x="55" y="360" width="690" height="66" rx="8" fill="#f0f0f0" stroke="#888" stroke-width="1.3"/>
  <text x="400" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">공통 원칙: 자식 작업은 부모 스코프보다 오래 살 수 없다</text>
  <text x="400" y="400" text-anchor="middle" font-size="10.5" fill="#444">부모가 끝나기 전 자식의 성공/실패/취소가 모두 확정되어야 스코프가 종료된다 (leak 방지)</text>
  <text x="400" y="416" text-anchor="middle" font-size="10.5" fill="#444">→ Kotlin은 언어 차원의 코루틴 빌더로, Java는 java.util.concurrent API로 이 원칙을 구현한다</text>

  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c62828"/>
    </marker>
  </defs>
</svg>
