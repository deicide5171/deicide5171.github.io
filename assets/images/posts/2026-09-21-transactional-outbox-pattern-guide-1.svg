<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <!-- Application box -->
  <rect x="40" y="60" width="180" height="90" rx="8" fill="#eef4ff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="130" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#22345a">애플리케이션</text>
  <text x="130" y="122" text-anchor="middle" font-size="13" fill="#22345a">주문 생성 트랜잭션</text>

  <!-- Arrow to DB -->
  <line x1="220" y1="105" x2="300" y2="105" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DB box with two tables -->
  <rect x="300" y="40" width="220" height="180" rx="8" fill="#fbfbfb" stroke="#888" stroke-width="2"/>
  <text x="410" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">단일 DB 트랜잭션</text>

  <rect x="320" y="80" width="180" height="55" rx="6" fill="#e8f7ee" stroke="#2f9e58" stroke-width="2"/>
  <text x="410" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5c34">orders 테이블</text>
  <text x="410" y="122" text-anchor="middle" font-size="12" fill="#1f5c34">비즈니스 데이터</text>

  <rect x="320" y="150" width="180" height="55" rx="6" fill="#fff4e5" stroke="#d98a2b" stroke-width="2"/>
  <text x="410" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4a10">outbox 테이블</text>
  <text x="410" y="192" text-anchor="middle" font-size="12" fill="#7a4a10">published=false</text>

  <text x="410" y="240" text-anchor="middle" font-size="12" fill="#666">두 테이블 모두 하나의 커밋으로 원자성 확보</text>

  <!-- Arrow to relay -->
  <line x1="500" y1="177" x2="590" y2="270" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Relay box -->
  <rect x="590" y="240" width="170" height="70" rx="8" fill="#f3ecfb" stroke="#7b4fbf" stroke-width="2"/>
  <text x="675" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#432a6b">릴레이</text>
  <text x="675" y="288" text-anchor="middle" font-size="12" fill="#432a6b">폴링 또는 CDC</text>

  <!-- Arrow to broker -->
  <line x1="675" y1="310" x2="675" y2="360" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Broker box -->
  <rect x="580" y="360" width="190" height="60" rx="8" fill="#e8f2fb" stroke="#2b6fb0" stroke-width="2"/>
  <text x="675" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b3f66">메시지 브로커</text>
  <text x="675" y="405" text-anchor="middle" font-size="12" fill="#1b3f66">Kafka / RabbitMQ</text>

  <!-- markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <text x="130" y="180" text-anchor="middle" font-size="12" fill="#666">DB 저장 + 이벤트 기록을</text>
  <text x="130" y="198" text-anchor="middle" font-size="12" fill="#666">한 트랜잭션으로 처리</text>
</svg>
