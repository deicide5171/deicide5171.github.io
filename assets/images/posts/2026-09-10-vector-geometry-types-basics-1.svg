<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">벡터 지오메트리의 세 가지 기본 타입</text>

  <!-- Point panel -->
  <rect x="50" y="90" width="220" height="280" rx="12" fill="#fafafa" stroke="#ddd"/>
  <text x="160" y="125" font-family="sans-serif" font-size="19" font-weight="bold" fill="#03c75a" text-anchor="middle">Point (점)</text>
  <circle cx="160" cy="230" r="12" fill="#03c75a"/>
  <text x="160" y="320" font-family="sans-serif" font-size="14" fill="#555" text-anchor="middle">좌표 1개</text>
  <text x="160" y="344" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">카페·정류장·핀</text>

  <!-- LineString panel -->
  <rect x="290" y="90" width="220" height="280" rx="12" fill="#fafafa" stroke="#ddd"/>
  <text x="400" y="125" font-family="sans-serif" font-size="19" font-weight="bold" fill="#3b7dd8" text-anchor="middle">LineString (선)</text>
  <polyline points="320,270 360,200 420,240 480,180" fill="none" stroke="#3b7dd8" stroke-width="3.5"/>
  <circle cx="320" cy="270" r="5" fill="#3b7dd8"/>
  <circle cx="360" cy="200" r="5" fill="#3b7dd8"/>
  <circle cx="420" cy="240" r="5" fill="#3b7dd8"/>
  <circle cx="480" cy="180" r="5" fill="#3b7dd8"/>
  <text x="400" y="320" font-family="sans-serif" font-size="14" fill="#555" text-anchor="middle">점을 이은 경로</text>
  <text x="400" y="344" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">도로·강·이동경로</text>

  <!-- Polygon panel -->
  <rect x="530" y="90" width="220" height="280" rx="12" fill="#fafafa" stroke="#ddd"/>
  <text x="640" y="125" font-family="sans-serif" font-size="19" font-weight="bold" fill="#e08e2b" text-anchor="middle">Polygon (면)</text>
  <polygon points="580,260 610,180 690,180 710,250 640,290" fill="#e08e2b" fill-opacity="0.35" stroke="#e08e2b" stroke-width="3"/>
  <text x="640" y="320" font-family="sans-serif" font-size="14" fill="#555" text-anchor="middle">닫힌 영역(첫=끝)</text>
  <text x="640" y="344" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">행정구역·건물·공원</text>

  <text x="400" y="410" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">표현 대상(위치 / 경로 / 영역)에 맞는 타입을 고른다</text>
</svg>
