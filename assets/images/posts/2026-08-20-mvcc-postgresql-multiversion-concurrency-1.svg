<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">튜플 버전 체인과 xmin/xmax</text>
  <text x="400" y="52" text-anchor="middle" font-size="12" fill="#666">UPDATE는 덮어쓰기가 아니라 새 버전을 추가하는 동작이다 (id=1 행 기준)</text>

  <!-- Version 1 -->
  <rect x="40" y="90" width="210" height="100" rx="6" fill="#c9821a" stroke="#8f5c10" stroke-width="1.5"/>
  <text x="145" y="112" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">버전 1 (죽은 튜플)</text>
  <text x="60" y="134" font-size="11.5" fill="#fff2df">id = 1</text>
  <text x="60" y="152" font-size="11.5" fill="#fff2df">balance = 1000</text>
  <text x="60" y="170" font-size="11" fill="#ffe4bf">xmin = 101</text>
  <text x="60" y="185" font-size="11" fill="#ffe4bf">xmax = 205</text>

  <!-- arrow 1 -> 2 -->
  <line x1="250" y1="140" x2="300" y2="140" stroke="#999" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="275" y="128" text-anchor="middle" font-size="10" fill="#777">txn 205 UPDATE</text>

  <!-- Version 2 -->
  <rect x="300" y="90" width="210" height="100" rx="6" fill="#c9821a" stroke="#8f5c10" stroke-width="1.5"/>
  <text x="405" y="112" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">버전 2 (죽은 튜플)</text>
  <text x="320" y="134" font-size="11.5" fill="#fff2df">id = 1</text>
  <text x="320" y="152" font-size="11.5" fill="#fff2df">balance = 2000</text>
  <text x="320" y="170" font-size="11" fill="#ffe4bf">xmin = 205</text>
  <text x="320" y="185" font-size="11" fill="#ffe4bf">xmax = 318</text>

  <!-- arrow 2 -> 3 -->
  <line x1="510" y1="140" x2="560" y2="140" stroke="#999" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="535" y="128" text-anchor="middle" font-size="10" fill="#777">txn 318 UPDATE</text>

  <!-- Version 3 (current) -->
  <rect x="560" y="90" width="210" height="100" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="665" y="112" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">버전 3 (현재 유효)</text>
  <text x="580" y="134" font-size="11.5" fill="#eafff0">id = 1</text>
  <text x="580" y="152" font-size="11.5" fill="#eafff0">balance = 3500</text>
  <text x="580" y="170" font-size="11" fill="#d7ffe2">xmin = 318</text>
  <text x="580" y="185" font-size="11" fill="#d7ffe2">xmax = (없음)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <!-- Snapshot visibility zone -->
  <rect x="40" y="240" width="720" height="130" rx="6" fill="#f5f8fc" stroke="#c8d6e5" stroke-width="1.2"/>
  <text x="60" y="264" font-size="12.5" fill="#0b5fa5" font-weight="bold">가시성 판단: 스냅샷을 가진 트랜잭션은 어떤 버전을 보는가</text>

  <text x="60" y="292" font-size="11.5" fill="#333">・ 트랜잭션 시작 시점의 스냅샷 기준 txn ID &lt; 210 인 트랜잭션 →</text>
  <text x="480" y="292" font-size="11.5" fill="#8f5c10" font-weight="bold">버전 1 (balance=1000)</text>

  <text x="60" y="315" font-size="11.5" fill="#333">・ 스냅샷 기준 210 ≤ txn ID &lt; 320 인 트랜잭션 →</text>
  <text x="400" y="315" font-size="11.5" fill="#8f5c10" font-weight="bold">버전 2 (balance=2000)</text>

  <text x="60" y="338" font-size="11.5" fill="#333">・ 스냅샷 기준 txn ID ≥ 320 인 트랜잭션 (커밋된 최신 상태) →</text>
  <text x="480" y="338" font-size="11.5" fill="#1f7a38" font-weight="bold">버전 3 (balance=3500)</text>

  <text x="60" y="360" font-size="11" fill="#777">더는 어떤 활성 스냅샷도 참조하지 않는 버전 1·2는 VACUUM 대상(죽은 튜플)이 된다.</text>

  <text x="400" y="405" text-anchor="middle" font-size="11.5" fill="#555">같은 행이라도 트랜잭션의 스냅샷 시점에 따라 서로 다른 버전이 보인다</text>
  <text x="400" y="425" text-anchor="middle" font-size="10.5" fill="#999">xmin/xmax는 실제로는 튜플 헤더에 저장되는 시스템 컬럼이다</text>
</svg>
