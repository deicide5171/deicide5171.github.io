<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1a1a1a">OpenTelemetry Collector 파이프라인</text>

  <!-- Signal sources -->
  <text x="70" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">계측 대상 (SDK)</text>

  <rect x="20" y="90" width="100" height="36" rx="6" fill="#6a3fd0" stroke="#4c2a9e" stroke-width="1.5"/>
  <text x="70" y="113" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">Traces</text>

  <rect x="20" y="140" width="100" height="36" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="70" y="163" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">Metrics</text>

  <rect x="20" y="190" width="100" height="36" rx="6" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="70" y="213" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">Logs</text>

  <!-- Arrows to Receivers -->
  <line x1="120" y1="108" x2="185" y2="150" stroke="#999" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="120" y1="158" x2="185" y2="158" stroke="#999" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="120" y1="208" x2="185" y2="166" stroke="#999" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Collector box -->
  <rect x="190" y="60" width="440" height="330" rx="10" fill="#f7f5ff" stroke="#c9bdf0" stroke-width="1.5"/>
  <text x="410" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c2a9e">OTel Collector</text>

  <!-- Receivers -->
  <rect x="215" y="135" width="120" height="46" rx="6" fill="#8a5ef0" stroke="#6a3fd0" stroke-width="1.5"/>
  <text x="275" y="154" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">Receivers</text>
  <text x="275" y="169" text-anchor="middle" font-size="9.5" fill="#eee">OTLP/gRPC·HTTP</text>

  <line x1="335" y1="158" x2="380" y2="158" stroke="#6a3fd0" stroke-width="1.5" marker-end="url(#arrowP)"/>

  <!-- Processors -->
  <rect x="385" y="135" width="130" height="46" rx="6" fill="#8a5ef0" stroke="#6a3fd0" stroke-width="1.5"/>
  <text x="450" y="154" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">Processors</text>
  <text x="450" y="169" text-anchor="middle" font-size="9.5" fill="#eee">batch·sampling</text>

  <line x1="515" y1="158" x2="560" y2="158" stroke="#6a3fd0" stroke-width="1.5" marker-end="url(#arrowP)"/>

  <!-- Exporters -->
  <rect x="565" y="135" width="130" height="46" rx="6" fill="#8a5ef0" stroke="#6a3fd0" stroke-width="1.5"/>
  <text x="630" y="154" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">Exporters</text>
  <text x="630" y="169" text-anchor="middle" font-size="9.5" fill="#eee">벤더별 프로토콜</text>

  <!-- pipeline label -->
  <text x="410" y="205" text-anchor="middle" font-size="11" fill="#555">수집 → 가공(배치·필터·리샘플링) → 내보내기 순으로 처리</text>

  <!-- Backends -->
  <text x="410" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">백엔드 (관측 플랫폼)</text>

  <rect x="215" y="265" width="120" height="40" rx="6" fill="#c9821a" stroke="#8f5c10" stroke-width="1.5"/>
  <text x="275" y="290" text-anchor="middle" font-size="11" fill="#fff">Jaeger / Tempo</text>

  <rect x="350" y="265" width="120" height="40" rx="6" fill="#c9821a" stroke="#8f5c10" stroke-width="1.5"/>
  <text x="410" y="290" text-anchor="middle" font-size="11" fill="#fff">Prometheus</text>

  <rect x="485" y="265" width="120" height="40" rx="6" fill="#c9821a" stroke="#8f5c10" stroke-width="1.5"/>
  <text x="545" y="290" text-anchor="middle" font-size="11" fill="#fff">Loki / Elastic</text>

  <line x1="630" y1="181" x2="275" y2="263" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowGray)"/>
  <line x1="630" y1="181" x2="410" y2="263" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowGray)"/>
  <line x1="630" y1="181" x2="545" y2="263" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowGray)"/>

  <rect x="215" y="330" width="480" height="45" rx="6" fill="#eaf3fc" stroke="#b8d7f2" stroke-width="1"/>
  <text x="455" y="349" text-anchor="middle" font-size="11.5" fill="#0b5fa5" font-weight="bold">특징</text>
  <text x="455" y="364" text-anchor="middle" font-size="10.5" fill="#333">애플리케이션은 벤더 SDK 대신 OTLP 한 곳에만 전송, 백엔드 교체는 Collector 설정만 변경</text>

  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#999"/></marker>
    <marker id="arrowP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#6a3fd0"/></marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#999"/></marker>
  </defs>
</svg>
