<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">useEffect 방식 vs use() + Suspense</text>

  <!-- Left: useEffect -->
  <text x="200" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#555">기존: useEffect + useState</text>

  <rect x="60" y="80" width="280" height="50" rx="6" fill="#eef4ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="200" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f3d7a">컴포넌트 렌더 → loading=true 반환</text>

  <line x1="200" y1="130" x2="200" y2="155" stroke="#999" stroke-width="1.5" marker-end="url(#u1)"/>

  <rect x="60" y="160" width="280" height="50" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
  <text x="200" y="190" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">useEffect 안에서 fetch 실행</text>

  <line x1="200" y1="210" x2="200" y2="235" stroke="#999" stroke-width="1.5" marker-end="url(#u1)"/>

  <rect x="60" y="240" width="280" height="50" rx="6" fill="#eafaf0" stroke="#03a35a" stroke-width="1.5"/>
  <text x="200" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#03612f">setUser로 재렌더 → 데이터 표시</text>

  <text x="200" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a1f1f">컴포넌트가 직접 로딩 상태 관리</text>

  <!-- Right: use() -->
  <text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#555">React 19: use() + Suspense</text>

  <rect x="460" y="80" width="280" height="50" rx="6" fill="#eef4ff" stroke="#3b6fd6" stroke-width="1.5"/>
  <text x="600" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f3d7a">use(promise) 호출</text>

  <line x1="600" y1="130" x2="600" y2="155" stroke="#999" stroke-width="1.5" marker-end="url(#u1)"/>

  <rect x="460" y="160" width="280" height="50" rx="6" fill="#fff5e9" stroke="#e08b2b" stroke-width="1.5"/>
  <text x="600" y="182" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#8a5314">아직 pending → 컴포넌트 실행 정지</text>
  <text x="600" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a5314">Suspense fallback 표시</text>

  <line x1="600" y1="210" x2="600" y2="235" stroke="#999" stroke-width="1.5" marker-end="url(#u1)"/>

  <rect x="460" y="240" width="280" height="50" rx="6" fill="#eafaf0" stroke="#03a35a" stroke-width="1.5"/>
  <text x="600" y="262" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#03612f">resolve 시 재렌더</text>
  <text x="600" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#03612f">use()가 값 즉시 반환</text>

  <text x="600" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#03612f">로딩 상태 관리가 Suspense 경계로 이동</text>

  <defs>
    <marker id="u1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#999"/></marker>
  </defs>

  <rect x="60" y="360" width="680" height="60" rx="8" fill="#fdeeee" stroke="#c0392b" stroke-width="1.5"/>
  <text x="400" y="385" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#8a1f1f">주의: 렌더링마다 새 Promise를 만들면 무한 재요청</text>
  <text x="400" y="405" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5a2727">Promise는 컴포넌트 바깥에서 안정적으로 생성해 전달해야 함</text>
</svg>
