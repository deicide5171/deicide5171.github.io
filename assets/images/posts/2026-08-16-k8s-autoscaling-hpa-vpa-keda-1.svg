<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">쿠버네티스 오토스케일링 3종 비교</text>

  <!-- HPA column -->
  <g>
    <rect x="30" y="60" width="220" height="360" rx="10" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="140" y="90" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1d4ed8">HPA</text>
    <text x="140" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Horizontal Pod Autoscaler</text>

    <rect x="55" y="130" width="170" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="140" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">metrics-server (CPU/Mem)</text>

    <text x="140" y="185" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1d4ed8">↓</text>

    <rect x="55" y="195" width="170" height="45" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="140" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e3a8a">Pod 개수 조절</text>
    <text x="140" y="231" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">replicas: 3 → 6</text>

    <!-- pod icons -->
    <circle cx="90" cy="270" r="10" fill="#3b82f6"/>
    <circle cx="120" cy="270" r="10" fill="#3b82f6"/>
    <circle cx="150" cy="270" r="10" fill="#3b82f6"/>
    <circle cx="180" cy="270" r="10" fill="#93c5fd"/>
    <circle cx="210" cy="270" r="10" fill="#93c5fd"/>
    <text x="140" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">→ 수평(개수) 확장</text>

    <text x="140" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">적합: 상태 없는(stateless)</text>
    <text x="140" y="347" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">웹/API 서버</text>
    <text x="140" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">지표: CPU·메모리 사용률</text>
    <text x="140" y="391" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">(기본), 커스텀 메트릭 확장</text>
  </g>

  <!-- VPA column -->
  <g>
    <rect x="290" y="60" width="220" height="360" rx="10" fill="#fef3e8" stroke="#f97316" stroke-width="2"/>
    <text x="400" y="90" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#c2410c">VPA</text>
    <text x="400" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Vertical Pod Autoscaler</text>

    <rect x="315" y="130" width="170" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="400" y="154" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">과거 사용량 추이 분석</text>

    <text x="400" y="185" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#c2410c">↓</text>

    <rect x="315" y="195" width="170" height="45" rx="6" fill="#fed7aa" stroke="#f97316"/>
    <text x="400" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7c2d12">requests/limits 조절</text>
    <text x="400" y="231" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">cpu: 250m → 500m</text>

    <!-- pod resize icon -->
    <rect x="370" y="258" width="20" height="24" fill="#fdba74"/>
    <rect x="405" y="252" width="26" height="30" fill="#f97316"/>
    <text x="400" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">→ 수직(자원량) 확장</text>

    <text x="400" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">적합: 배치·단일 인스턴스</text>
    <text x="400" y="347" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">상태 유지 워크로드</text>
    <text x="400" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">주의: Pod 재시작 필요</text>
    <text x="400" y="391" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">(In-place 재조정은 제한적)</text>
  </g>

  <!-- KEDA column -->
  <g>
    <rect x="550" y="60" width="220" height="360" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="660" y="90" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#15803d">KEDA</text>
    <text x="660" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">Kubernetes Event-Driven Autoscaling</text>

    <rect x="575" y="130" width="170" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
    <text x="660" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#222">외부 이벤트 소스</text>
    <text x="660" y="164" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b">(큐 길이, Kafka lag 등)</text>

    <text x="660" y="185" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#15803d">↓</text>

    <rect x="575" y="195" width="170" height="45" rx="6" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="660" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#14532d">HPA 생성·위임</text>
    <text x="660" y="231" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#334155">0 ↔ N (Scale-to-Zero)</text>

    <circle cx="620" cy="270" r="10" fill="#16a34a"/>
    <circle cx="650" cy="270" r="10" fill="#16a34a"/>
    <circle cx="680" cy="270" r="10" fill="#bbf7d0" stroke="#16a34a" stroke-dasharray="2,2"/>
    <text x="660" y="298" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">→ 이벤트 기반 수평 확장</text>

    <text x="660" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">적합: 메시지 큐 컨슈머,</text>
    <text x="660" y="347" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">비동기 워커, 유휴시 0개 운영</text>
    <text x="660" y="374" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">지표: 50+ Scaler(외부 시스템)</text>
    <text x="660" y="391" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">내부적으로 HPA를 이용</text>
  </g>

  <text x="400" y="435" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">CPU·메모리는 HPA/VPA, 큐 길이 등 외부 이벤트는 KEDA — 세 가지는 함께 조합해서 사용 가능</text>
</svg>
