<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>

  <!-- Parent -->
  <rect x="280" y="30" width="240" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="400" y="58" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e1b4b">오케스트레이터(부모)</text>
  <text x="400" y="80" text-anchor="middle" font-size="12" fill="#4338ca">전체 대화 이력 + 시스템 프롬프트</text>

  <!-- Arrows down -->
  <line x1="330" y1="100" x2="180" y2="150" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="100" x2="620" y2="150" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Isolated box -->
  <rect x="50" y="150" width="260" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="180" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">Isolated 서브에이전트</text>
  <text x="180" y="200" text-anchor="middle" font-size="12" fill="#991b1b">받는 것: task 설명 한 줄</text>
  <text x="180" y="220" text-anchor="middle" font-size="12" fill="#991b1b">부모의 대화 이력 모름</text>
  <text x="180" y="240" text-anchor="middle" font-size="12" fill="#991b1b">→ 프리픽스 캐시 새로 시작(cold)</text>

  <!-- Forked box -->
  <rect x="490" y="150" width="260" height="110" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="620" y="176" text-anchor="middle" font-size="15" font-weight="bold" fill="#064e3b">Forked 서브에이전트</text>
  <text x="620" y="200" text-anchor="middle" font-size="12" fill="#065f46">받는 것: 부모의 전체 대화 이력</text>
  <text x="620" y="220" text-anchor="middle" font-size="12" fill="#065f46">+ 동일한 시스템 프롬프트 접두사</text>
  <text x="620" y="240" text-anchor="middle" font-size="12" fill="#065f46">→ 부모 프롬프트 캐시 재사용(warm)</text>

  <!-- Use case boxes -->
  <rect x="50" y="300" width="260" height="110" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="180" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">적합한 경우</text>
  <text x="180" y="350" text-anchor="middle" font-size="12" fill="#9a3412">독립 리서치, 병렬 조사</text>
  <text x="180" y="370" text-anchor="middle" font-size="12" fill="#9a3412">불필요한 맥락 오염 차단</text>
  <text x="180" y="390" text-anchor="middle" font-size="12" fill="#9a3412">긴 이력을 넘길 필요 없음</text>

  <rect x="490" y="300" width="260" height="110" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="620" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">적합한 경우</text>
  <text x="620" y="350" text-anchor="middle" font-size="12" fill="#9a3412">부모가 진단한 작업 이어받기</text>
  <text x="620" y="370" text-anchor="middle" font-size="12" fill="#9a3412">동일 맥락에서 실행만 위임</text>
  <text x="620" y="390" text-anchor="middle" font-size="12" fill="#9a3412">캐시 재사용으로 비용 절감</text>
</svg>
