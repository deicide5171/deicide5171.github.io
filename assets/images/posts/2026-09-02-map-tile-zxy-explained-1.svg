<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">타일 피라미드와 z/x/y 좌표</text>

  <!-- z=0 -->
  <text x="120" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a4a7a">z = 0 (1개)</text>
  <rect x="90" y="100" width="60" height="60" fill="#dff0e8" stroke="#3a8a5a" stroke-width="1.5"/>
  <text x="120" y="135" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">0,0</text>

  <!-- z=1 -->
  <text x="330" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a4a7a">z = 1 (4개)</text>
  <rect x="270" y="100" width="60" height="60" fill="#dff0e8" stroke="#3a8a5a" stroke-width="1.5"/>
  <text x="300" y="135" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">0,0</text>
  <rect x="330" y="100" width="60" height="60" fill="#cfe8d8" stroke="#3a8a5a" stroke-width="1.5"/>
  <text x="360" y="135" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">1,0</text>
  <rect x="270" y="160" width="60" height="60" fill="#cfe8d8" stroke="#3a8a5a" stroke-width="1.5"/>
  <text x="300" y="195" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">0,1</text>
  <rect x="330" y="160" width="60" height="60" fill="#dff0e8" stroke="#3a8a5a" stroke-width="1.5"/>
  <text x="360" y="195" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#333">1,1</text>

  <!-- z=2 -->
  <text x="620" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a4a7a">z = 2 (16개)</text>
  <g>
    <rect x="560" y="100" width="120" height="120" fill="none" stroke="#3a8a5a" stroke-width="1.5"/>
    <line x1="590" y1="100" x2="590" y2="220" stroke="#3a8a5a" stroke-width="1"/>
    <line x1="620" y1="100" x2="620" y2="220" stroke="#3a8a5a" stroke-width="1"/>
    <line x1="650" y1="100" x2="650" y2="220" stroke="#3a8a5a" stroke-width="1"/>
    <line x1="560" y1="130" x2="680" y2="130" stroke="#3a8a5a" stroke-width="1"/>
    <line x1="560" y1="160" x2="680" y2="160" stroke="#3a8a5a" stroke-width="1"/>
    <line x1="560" y1="190" x2="680" y2="190" stroke="#3a8a5a" stroke-width="1"/>
    <rect x="620" y="130" width="30" height="30" fill="#e05252" opacity="0.5"/>
  </g>
  <text x="620" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#333">x=2, y=1 타일</text>

  <!-- arrows between levels -->
  <line x1="160" y1="130" x2="255" y2="130" stroke="#888" stroke-width="2" marker-end="url(#t)"/>
  <text x="207" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666">x4</text>
  <line x1="400" y1="160" x2="545" y2="160" stroke="#888" stroke-width="2" marker-end="url(#t)"/>
  <text x="472" y="150" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#666">x4</text>

  <!-- explanation -->
  <rect x="90" y="290" width="620" height="110" rx="8" fill="#f7f7f7" stroke="#ccc"/>
  <text x="110" y="320" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222">z / x / y 의미</text>
  <text x="110" y="345" font-family="sans-serif" font-size="13" fill="#333">z = 줌 레벨 (클수록 확대·상세)</text>
  <text x="110" y="366" font-family="sans-serif" font-size="13" fill="#333">x = 가로 타일 인덱스 (0 ~ 2^z - 1)</text>
  <text x="110" y="387" font-family="sans-serif" font-size="13" fill="#333">y = 세로 타일 인덱스 (0 ~ 2^z - 1) — 슬리피맵은 위에서 아래로 증가</text>

  <defs>
    <marker id="t" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>
