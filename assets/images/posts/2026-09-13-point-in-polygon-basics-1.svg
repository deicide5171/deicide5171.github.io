<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="44" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">레이 캐스팅 — 교차 횟수로 내부 판정</text>

  <!-- Polygon -->
  <polygon points="250,120 520,110 560,260 380,340 220,270" fill="#f0f7f4" stroke="#03c75a" stroke-width="2.5"/>

  <!-- Inside point + ray (1 crossing = odd = inside) -->
  <circle cx="360" cy="200" r="7" fill="#03c75a"/>
  <line x1="360" y1="200" x2="720" y2="200" stroke="#03c75a" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="543" cy="200" r="5" fill="#c0392b"/>
  <text x="368" y="192" font-family="sans-serif" font-size="13" fill="#333">내부 점</text>
  <text x="600" y="192" font-family="sans-serif" font-size="14" fill="#03c75a">교차 1번 (홀수) → 안</text>

  <!-- Outside point + ray (2 crossings = even = outside) -->
  <circle cx="120" cy="300" r="7" fill="#888"/>
  <line x1="120" y1="300" x2="720" y2="300" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="300" cy="300" r="5" fill="#c0392b"/>
  <circle cx="450" cy="300" r="5" fill="#c0392b"/>
  <text x="60" y="292" font-family="sans-serif" font-size="13" fill="#333">외부 점</text>
  <text x="540" y="330" font-family="sans-serif" font-size="14" fill="#888">교차 2번 (짝수) → 밖</text>

  <text x="400" y="400" font-family="sans-serif" font-size="15" fill="#333" text-anchor="middle">점에서 반직선을 쏴 다각형 변과의 교차 횟수가 홀수면 내부, 짝수면 외부</text>
</svg>
