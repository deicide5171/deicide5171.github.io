<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>

  <text x="400" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">3D Tiles 타일셋 계층 구조와 LOD·프러스텀 컬링</text>
  <text x="400" y="43" text-anchor="middle" font-size="11.5" fill="#666">tileset.json 트리를 따라 필요한 타일만 골라 스트리밍한다</text>

  <line x1="20" y1="53" x2="780" y2="53" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Section 1: tileset hierarchy -->
  <text x="24" y="70" font-size="13" font-weight="bold" fill="#0b5fa5">1. 타일셋 계층 구조 — 카메라 거리에 따른 LOD 교체</text>

  <!-- Root tile -->
  <rect x="320" y="78" width="160" height="42" rx="6" fill="#0b5fa5" stroke="#083f6e" stroke-width="1.5"/>
  <text x="400" y="96" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">루트 타일 (Root Tile)</text>
  <text x="400" y="111" text-anchor="middle" font-size="9.5" fill="#dbeafe">boundingVolume=전체, geometricError=500</text>

  <!-- connectors root -> children -->
  <line x1="400" y1="120" x2="150" y2="158" stroke="#999" stroke-width="1.5"/>
  <line x1="400" y1="120" x2="400" y2="158" stroke="#999" stroke-width="1.5"/>
  <line x1="400" y1="120" x2="650" y2="158" stroke="#999" stroke-width="1.5"/>

  <!-- children -->
  <rect x="75" y="158" width="150" height="40" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="150" y="175" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">자식 타일 A</text>
  <text x="150" y="190" text-anchor="middle" font-size="9.5" fill="#dbeafe">geometricError=120</text>

  <rect x="325" y="158" width="150" height="40" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="400" y="175" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">자식 타일 B</text>
  <text x="400" y="190" text-anchor="middle" font-size="9.5" fill="#dbeafe">geometricError=120</text>

  <rect x="575" y="158" width="150" height="40" rx="6" fill="#1877c9" stroke="#0b5fa5" stroke-width="1.5"/>
  <text x="650" y="175" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">자식 타일 C</text>
  <text x="650" y="190" text-anchor="middle" font-size="9.5" fill="#dbeafe">geometricError=120</text>

  <!-- connectors child B -> grandchildren -->
  <line x1="400" y1="198" x2="315" y2="222" stroke="#999" stroke-width="1.5"/>
  <line x1="400" y1="198" x2="485" y2="222" stroke="#999" stroke-width="1.5"/>

  <rect x="245" y="222" width="140" height="34" rx="5" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="315" y="238" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">손자 타일 (leaf)</text>
  <text x="315" y="251" text-anchor="middle" font-size="9" fill="#eafff0">geometricError=15, glTF 실제 모델</text>

  <rect x="415" y="222" width="140" height="34" rx="5" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="485" y="238" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">손자 타일 (leaf)</text>
  <text x="485" y="251" text-anchor="middle" font-size="9" fill="#eafff0">geometricError=15, glTF 실제 모델</text>

  <text x="400" y="272" text-anchor="middle" font-size="11" fill="#555">카메라가 가까워질수록 화면상 오차(SSE)가 커져, 더 낮은 geometricError를 가진 자식 타일로 교체된다</text>

  <line x1="20" y1="284" x2="780" y2="284" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Section 2: frustum culling -->
  <text x="24" y="301" font-size="13" font-weight="bold" fill="#0b5fa5">2. 프러스텀 컬링 — 카메라 시야 밖 타일은 요청·렌더링하지 않는다</text>

  <!-- frustum triangle -->
  <polygon points="70,415 760,300 760,432" fill="#0b5fa5" fill-opacity="0.10" stroke="#0b5fa5" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- camera -->
  <circle cx="70" cy="415" r="7" fill="#222"/>
  <text x="70" y="440" text-anchor="middle" font-size="10.5" fill="#222" font-weight="bold">카메라</text>

  <!-- inside tiles (rendered) -->
  <rect x="365" y="376" width="70" height="28" rx="4" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="400" y="393" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">타일 A</text>
  <text x="400" y="402" text-anchor="middle" font-size="7.5" fill="#eafff0">렌더링</text>

  <rect x="585" y="356" width="70" height="28" rx="4" fill="#2fa84f" stroke="#1f7a38" stroke-width="1.5"/>
  <text x="620" y="373" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">타일 B</text>
  <text x="620" y="382" text-anchor="middle" font-size="7.5" fill="#eafff0">렌더링</text>

  <!-- outside tiles (culled) -->
  <rect x="215" y="306" width="70" height="28" rx="4" fill="#999" stroke="#666" stroke-width="1.5"/>
  <text x="250" y="323" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">타일 D</text>
  <text x="250" y="332" text-anchor="middle" font-size="7.5" fill="#eee">컬링(스킵)</text>

  <rect x="665" y="278" width="70" height="28" rx="4" fill="#999" stroke="#666" stroke-width="1.5"/>
  <text x="700" y="295" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">타일 E</text>
  <text x="700" y="304" text-anchor="middle" font-size="7.5" fill="#eee">컬링(스킵)</text>

  <rect x="465" y="418" width="70" height="26" rx="4" fill="#999" stroke="#666" stroke-width="1.5"/>
  <text x="500" y="434" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">타일 C</text>
  <text x="500" y="443" text-anchor="middle" font-size="7.5" fill="#eee">컬링</text>

</svg>
