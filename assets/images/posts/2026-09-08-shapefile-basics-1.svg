<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="46" font-family="sans-serif" font-size="24" font-weight="bold" fill="#222" text-anchor="middle">셰이프파일 = 여러 파일의 세트</text>

  <text x="400" y="80" font-family="sans-serif" font-size="15" fill="#777" text-anchor="middle">같은 이름(seoul_district)으로 한 폴더에 함께 있어야 열린다</text>

  <!-- .shp -->
  <rect x="60" y="120" width="160" height="120" rx="10" fill="#f0f7f4" stroke="#03c75a" stroke-width="2"/>
  <text x="140" y="152" font-family="sans-serif" font-size="19" font-weight="bold" fill="#03c75a" text-anchor="middle">.shp</text>
  <text x="140" y="182" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">도형(점·선·면)</text>
  <text x="140" y="204" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">의 좌표</text>
  <text x="140" y="228" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">필수</text>

  <!-- .shx -->
  <rect x="240" y="120" width="160" height="120" rx="10" fill="#eef3fb" stroke="#3b7dd8" stroke-width="2"/>
  <text x="320" y="152" font-family="sans-serif" font-size="19" font-weight="bold" fill="#3b7dd8" text-anchor="middle">.shx</text>
  <text x="320" y="182" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">도형 위치 색인</text>
  <text x="320" y="204" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">(빠른 접근)</text>
  <text x="320" y="228" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">필수</text>

  <!-- .dbf -->
  <rect x="420" y="120" width="160" height="120" rx="10" fill="#fdf3e7" stroke="#e08e2b" stroke-width="2"/>
  <text x="500" y="152" font-family="sans-serif" font-size="19" font-weight="bold" fill="#e08e2b" text-anchor="middle">.dbf</text>
  <text x="500" y="182" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">속성(이름·인구</text>
  <text x="500" y="204" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">등의 표)</text>
  <text x="500" y="228" font-family="sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">필수</text>

  <!-- .prj -->
  <rect x="600" y="120" width="160" height="120" rx="10" fill="#f5f0fb" stroke="#8e5bd8" stroke-width="2"/>
  <text x="680" y="152" font-family="sans-serif" font-size="19" font-weight="bold" fill="#8e5bd8" text-anchor="middle">.prj</text>
  <text x="680" y="182" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">좌표계 정보</text>
  <text x="680" y="204" font-family="sans-serif" font-size="14" fill="#333" text-anchor="middle">(WGS84 등)</text>
  <text x="680" y="228" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">권장</text>

  <!-- combine -->
  <text x="400" y="300" font-family="sans-serif" font-size="16" fill="#333" text-anchor="middle">▼ 네 파일이 함께 모여</text>

  <rect x="250" y="330" width="300" height="70" rx="12" fill="#e9f7ef" stroke="#03c75a" stroke-width="2.5"/>
  <text x="400" y="362" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222" text-anchor="middle">하나의 공간 데이터</text>
  <text x="400" y="386" font-family="sans-serif" font-size="14" fill="#555" text-anchor="middle">(자치구 경계 + 속성 + 좌표계)</text>
</svg>
