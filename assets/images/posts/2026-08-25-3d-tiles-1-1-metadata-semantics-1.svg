<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect x="0" y="0" width="800" height="450" fill="#ffffff"/>
  <text x="400" y="34" font-family="sans-serif" font-size="19" font-weight="bold" fill="#222" text-anchor="middle">3D Tiles 1.1 — 구조적 메타데이터 파이프라인</text>

  <!-- 1. 스키마 -->
  <text x="130" y="66" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a6b45" text-anchor="middle">① 스키마 정의</text>
  <rect x="40" y="80" width="180" height="150" rx="8" fill="#eef4fb" stroke="#4a7ab5" stroke-width="1.5"/>
  <text x="130" y="102" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2e5a8f" text-anchor="middle">class: Building</text>
  <text x="55" y="126" font-family="sans-serif" font-size="12" fill="#333">height: FLOAT32</text>
  <text x="55" y="146" font-family="sans-serif" font-size="12" fill="#333">floors: UINT8</text>
  <text x="55" y="166" font-family="sans-serif" font-size="12" fill="#333">yearBuilt: UINT16</text>
  <text x="55" y="186" font-family="sans-serif" font-size="12" fill="#333">usage: ENUM</text>
  <text x="55" y="210" font-family="sans-serif" font-size="11" fill="#888">(residential/</text>
  <text x="55" y="224" font-family="sans-serif" font-size="11" fill="#888">commercial/mixed)</text>

  <!-- 화살표 1 -->
  <line x1="220" y1="155" x2="278" y2="155" stroke="#8aa5c4" stroke-width="2"/>
  <polygon points="278,155 268,150 268,160" fill="#8aa5c4"/>

  <!-- 2. 프로퍼티 테이블 -->
  <text x="400" y="66" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a6b45" text-anchor="middle">② 프로퍼티 테이블</text>
  <rect x="283" y="80" width="234" height="150" rx="8" fill="#fdf6ec" stroke="#c98a3d" stroke-width="1.5"/>
  <line x1="283" y1="106" x2="517" y2="106" stroke="#e8d3ae" stroke-width="1"/>
  <text x="300" y="100" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a3611c">row</text>
  <text x="345" y="100" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a3611c">floors</text>
  <text x="410" y="100" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a3611c">usage</text>
  <text x="300" y="128" font-family="sans-serif" font-size="12" fill="#333">0</text>
  <text x="345" y="128" font-family="sans-serif" font-size="12" fill="#333">22</text>
  <text x="410" y="128" font-family="sans-serif" font-size="12" fill="#333">COMMERCIAL</text>
  <text x="300" y="152" font-family="sans-serif" font-size="12" fill="#333">1</text>
  <text x="345" y="152" font-family="sans-serif" font-size="12" fill="#333">5</text>
  <text x="410" y="152" font-family="sans-serif" font-size="12" fill="#333">RESIDENTIAL</text>
  <text x="300" y="176" font-family="sans-serif" font-size="12" fill="#333">2</text>
  <text x="345" y="176" font-family="sans-serif" font-size="12" fill="#333">40</text>
  <text x="410" y="176" font-family="sans-serif" font-size="12" fill="#333">MIXED</text>
  <text x="400" y="208" font-family="sans-serif" font-size="11" fill="#a3611c" text-anchor="middle">이진 버퍼 기반 컬럼형 저장</text>

  <!-- 화살표 2 -->
  <line x1="517" y1="155" x2="575" y2="155" stroke="#8aa5c4" stroke-width="2"/>
  <polygon points="575,155 565,150 565,160" fill="#8aa5c4"/>

  <!-- 3. 지오메트리 -->
  <text x="670" y="66" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a6b45" text-anchor="middle">③ 메시 feature</text>
  <rect x="580" y="80" width="180" height="150" rx="8" fill="#eef8ef" stroke="#2e9e63" stroke-width="1.5"/>
  <polygon points="605,210 605,150 640,110 690,110 725,150 725,210" fill="#a8d5b5" stroke="#2e9e63" stroke-width="1.5"/>
  <text x="670" y="165" font-family="sans-serif" font-size="12" fill="#1a6b45" text-anchor="middle">featureId=0</text>
  <text x="670" y="222" font-family="sans-serif" font-size="11" fill="#1a6b45" text-anchor="middle">EXT_mesh_features</text>

  <!-- 하단 설명: 질의 -->
  <rect x="60" y="270" width="680" height="120" rx="8" fill="#f7f7f7" stroke="#ccc" stroke-width="1"/>
  <text x="400" y="298" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">렌더링 후 클릭 → feature ID → 프로퍼티 테이블 조회</text>
  <text x="400" y="326" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">"이 건물은 22층, 상업용, 준공 정보 확인" — 순수 렌더링을 넘어 속성 질의가 가능</text>
  <text x="400" y="354" font-family="sans-serif" font-size="13" fill="#333" text-anchor="middle">스타일 표현식 예: ${floors} &gt;= 20 인 건물만 강조 색상 적용</text>
  <text x="400" y="378" font-family="sans-serif" font-size="12" fill="#888" text-anchor="middle">3D Tiles 1.0의 배치 테이블(벤더 확장)이 OGC 정식 명세로 승격되며 gLTF와 메타데이터 모델을 공유</text>
</svg>
